let RC=null;                 // ฟอร์มรับของที่กำลังกรอก {d,sup_id,sup_name,note,po_id,po_no,lines[]} (ไม่มี bill_no)
let RC_VIEW='form';          // 'form' | 'list'
let RC_T=null;               // timer บันทึกร่าง
const RC_DRAFT='jjck_rc_draft',RC_DRAFT_MS=12*3600*1000;
function rcBlank(){return {d:bizTodayISO(),sup_id:'',sup_name:'',note:'',po_id:null,po_no:'',lines:[]};}   // ไม่มี bill_no แล้ว (ฟอร์มไม่มีช่องเลขบิล · kc_receipts.bill_no = null เสมอ)
function rcLineBlank(){return {item_id:'',name:'',packs:'',pack_unit:'',pack_qty:'',unit:'',price_mode:'pack',price:'',newu:null};}
function rcDraftLoad(){const d=LS.get(RC_DRAFT,null);if(!d||!d.data||d.d!==bizTodayISO()||Date.now()-num(d.t)>RC_DRAFT_MS){LS.del(RC_DRAFT);return null;}
  const f=Object.assign(rcBlank(),d.data);delete f.bill_no;f.lines=(Array.isArray(f.lines)?f.lines:[]).map(l=>Object.assign(rcLineBlank(),l));return f;}   // ร่างรุ่นเก่าที่ยังมี bill_no = ทิ้งช่องนั้น
function rcDraft(){clearTimeout(RC_T);RC_T=setTimeout(()=>{if(!RC)return;const has=RC.lines.length||RC.note||RC.sup_id;
  if(has)LS.set(RC_DRAFT,{t:Date.now(),d:bizTodayISO(),data:RC});else LS.del(RC_DRAFT);},250);}
function rcDraftClear(){clearTimeout(RC_T);LS.del(RC_DRAFT);}

/* ---------- หน้า (เจ้าของสั่ง 2026-10-17: "เลือกเป็นรูปเลย แล้วใส่ข้อมูลหลังจากกดรูป · เลขบิลไม่ต้องใส่") ---------- */
let RC_CAT='';               // ชิปของตารางรูป: '' ทั้งหมด · '__sup' ร้านที่เลือก · ชื่อหมวด
let RC_Q='';                 // คำค้นในตารางรูป (คงไว้ตอนวาดใหม่)
RENDER.recv=function(el){
  if(!RC)RC=rcDraftLoad()||rcBlank();
  el.innerHTML=dhead('📥 '+t('nav_recv'),esc(dispDate(bizTodayISO())))+sqlNeedBox()+
    pillBar([{k:'form',lb:t('rc_new'),ic:'➕',n:RC.lines.length||null},{k:'list',lb:t('rc_recent'),ic:'📜'}],RC_VIEW,k=>{RC_VIEW=k;rerender();},{scroll:1})+
    '<div id="rcBody"></div>';
  if(RC_VIEW==='form')rcPaintForm();else rcPaintList();
};
function rcPaintForm(){ // หัว (ร้าน·วันที่·หมายเหตุ) → รายการที่รับแล้ว (แตะ = แก้) → ตารางรูปสินค้า (แตะ = เพิ่ม/แก้) → แถบบันทึก
  const b=document.getElementById('rcBody');if(!b)return;
  b.innerHTML=rcHeadHtml()+
    '<div class="rc-sec">🧾 '+esc(t('rc_lines_title'))+(RC.lines.length?' <span class="bdg">'+RC.lines.length+'</span>':'')+
      (RC.lines.length?'<button class="btn gh sm2" style="margin-left:auto" onclick="rcClearAsk()">🗑 '+esc(t('rc_clear'))+'</button>':'')+'</div>'+
    '<div id="rcLines">'+(RC.lines.length?RC.lines.map((l,i)=>rcLineRow(l,i)).join(''):'<div class="note">'+esc(t('rc_no_lines'))+'</div>')+'</div>'+
    '<div class="rc-sec">🖼️ '+esc(t('rc_tap_pic'))+'</div><div id="rcChips">'+rcChipsHtml()+'</div>'+searchBox('rcGridQ','rcGridSearch')+
    '<div class="igrid rcgrid" id="rcGrid">'+rcGridHtml()+'</div>';
  const q=document.getElementById('rcGridQ');if(q&&RC_Q)q.value=RC_Q;
  pillReveal(b);   // วาดใหม่ทั้งฟอร์ม (กด ✓ ในหน้าต่าง) แล้วแถบชิปเด้งซ้ายสุด — ชิปที่เลือกต้องยังเห็น (ผู้ตรวจ V2)
  rcBar();
}
function rcSupOpts(){const act=S.sups.filter(s=>s.active!==false||s.id===RC.sup_id);
  return '<option value="">'+esc(t('rc_sup_pick'))+'</option>'+act.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===RC.sup_id?' selected':'')+'>'+esc(s.name)+'</option>').join('');}
function rcHeadHtml(){ // ไม่มีช่องเลขบิลแล้ว (bill_no ในตารางเป็น null · ใบเก่าที่มีเลขยังโชว์ในรายการ/รายละเอียด)
  return card('🏷️ '+esc(t('sup')),
    fld(t('sup'),'<div class="row" style="flex-wrap:nowrap"><select id="rcSup" class="grow" style="min-width:0" onchange="rcSetSup(this.value)">'+rcSupOpts()+'</select>'+
      '<button class="btn gh sm2" style="flex:none" onclick="rcNewSup()">'+esc(t('rc_sup_new'))+'</button></div>')+
    '<div class="grid2">'+fld(t('date'),'<input type="date" id="rcD" value="'+esc(RC.d)+'" max="'+esc(bizTodayISO())+'" onchange="RC.d=this.value||bizTodayISO();rcDraft()">')+
      fld(t('note'),'<input id="rcNote" value="'+esc(RC.note)+'" oninput="RC.note=this.value;rcDraft()">')+'</div>'+
    '<div class="row"><button class="btn gh sm2" onclick="rcPoPick()">📋 '+esc(t('rc_from_po'))+'</button>'+
      (RC.po_id?'<span class="chip blue rc-po-chip">'+esc(t('rc_po_tag'))+' '+esc(RC.po_no||RC.po_id)+' <a onclick="rcPoClear()" style="cursor:pointer">✕</a></span>':'')+'</div>');
}
function rcSetSup(id){const s=supById(id);RC.sup_id=s?s.id:'';RC.sup_name=s?s.name:'';RC_CAT=rcSupItems().length?'__sup':'';rcDraft();rcGridPaint();}
function rcBar(){
  if(S.tab!=='recv'||RC_VIEW!=='form')return;
  if(!RC.lines.length){pinnedBar(null);return;}
  const tot=RC.lines.reduce((a,l)=>{const c=rcCalc(l);return a+(c.price_total||0);},0);
  pinnedBar('<span class="v">'+RC.lines.length+' '+esc(t('rc_lines_n'))+' · '+esc(money(tot))+'</span><button class="btn" id="rcSaveBtn" onclick="rcSave()">💾 '+esc(t('save'))+'</button>');
}

/* ---------- ตารางรูปสินค้า (แตะรูป = เพิ่มรายการแล้วเปิดหน้าต่างใส่ข้อมูล · แตะซ้ำ = แก้) ---------- */
function rcIcon(it){try{return itIcon(it);}catch(e){return '🥬';}}
function rcCatIcon(c){try{return IT_IC[c]||'🧺';}catch(e){return '🧺';}}
function rcThumb(o,cls){ // รูปในช่อง — ไม่ใส่ซูมแบบ thumbHtml (แตะรูป = เลือกสินค้า)
  const url=o&&imgOk(o.image_url)?String(o.image_url):'';return '<div class="'+(cls||'ithumb')+'">'+(url?'<img src="'+esc(url)+'" loading="lazy" data-ic="'+esc(rcIcon(o))+'" onerror="this.parentNode.textContent=this.dataset.ic">':rcIcon(o))+'</div>';}   // รูปเสีย = กลับเป็นอิโมจิ
function rcCatOf(it){return String(it&&it.cat||'').trim()||'อื่นๆ';}
function rcSupItems(){const k=supKey(RC.sup_name);return k?activeItems().filter(it=>supKey(it.sup)===k):[];}
function rcCats(){const c=[];activeItems().forEach(it=>{const x=rcCatOf(it);if(!c.includes(x))c.push(x);});return ITEM_CATS.filter(x=>c.includes(x)).concat(c.filter(x=>!ITEM_CATS.includes(x)));}
function rcCatCur(){const cats=rcCats();if(RC_CAT==='__sup')return rcSupItems().length?'__sup':'';return cats.includes(RC_CAT)?RC_CAT:'';}
function rcChipsHtml(){const sup=rcSupItems().length,items=[];
  if(sup)items.push({k:'__sup',lb:t('rc_this_sup'),ic:'🏷️',n:sup});
  items.push({k:'',lb:t('rc_all'),ic:'🧺'});rcCats().forEach(c=>items.push({k:c,lb:trCat(c),ic:rcCatIcon(c)}));
  return pillBar(items,rcCatCur(),'rcSetCat',{scroll:1});}
function rcGridList(){const q=supKey(RC_Q),cat=rcCatCur();let L=cat==='__sup'?rcSupItems():activeItems().filter(it=>!cat||rcCatOf(it)===cat);
  if(q)L=L.filter(it=>supKey(it.name).includes(q)||supKey(dispName(it)).includes(q)||supKey(it.sup).includes(q)||supKey(it.cat).includes(q));
  return L.slice().sort((a,b)=>dispName(a).localeCompare(dispName(b),'th'));}
function rcGridHtml(){const L=rcGridList(),inL={};RC.lines.forEach((l,i)=>{if(l.item_id&&inL[l.item_id]==null)inL[l.item_id]=i;});
  return L.map(it=>{const i=inL[it.id],l=i!=null?RC.lines[i]:null,c=l?rcCalc(l):null;
    return '<div class="icard rctile tap'+(l?' on':'')+'" data-id="'+esc(it.id)+'" onclick="rcTileTap(this.dataset.id)">'+rcThumb(it,'ithumb')+
      (l?'<span class="rcbadge">✓'+(c.packs>0?' '+fmtQ(c.packs)+' '+esc(trUnit(l.pack_unit||it.unit)):'')+'</span>':'')+
      '<div class="iname">'+esc(dispName(it))+'</div><div class="isub">'+esc(t('rc_stock'))+' '+fmtQ(it.qty)+' '+esc(trUnit(it.unit))+(itemCost(it)!=null?' · ฿'+rcP(itemCost(it))+'/'+esc(trUnit(it.unit)):'')+'</div></div>';}).join('')+
    '<div class="icard rctile tap rcnew" onclick="rcNewItem(null)"><div class="ithumb">➕</div><div class="iname">'+esc(t('rc_item_new'))+'</div><div class="isub">&nbsp;</div></div>'+
    (L.length?'':'<div class="empty" style="grid-column:1/-1">'+esc(t('empty'))+'</div>');}
function rcGridPaint(){const g=document.getElementById('rcGrid');if(g)g.innerHTML=rcGridHtml();const c=document.getElementById('rcChips');if(c){c.innerHTML=rcChipsHtml();pillReveal(c);}}   // ชิปที่เลือกต้องยังเห็นหลังวาดใหม่ (pillReveal กลางของ shell)
function rcSetCat(k){RC_CAT=k||'';rcGridPaint();}
function rcGridSearch(v){RC_Q=String(v||'');const g=document.getElementById('rcGrid');if(g)g.innerHTML=rcGridHtml();}   // กรองในที่ — คีย์บอร์ดไม่หุบ
function rcTileTap(id){const it=itemById(id);if(!it)return;const i=RC.lines.findIndex(l=>l.item_id===id);if(i>=0){rcEdit(i);return;}
  RC.lines.push(rcLineBlank());rcSetItem(RC.lines.length-1,it);}

/* ---------- รายการที่รับแล้ว (แถวสรุป · แตะ = หน้าต่างแก้) ---------- */
function rcLineRow(l,i){const it=itemById(l.item_id);
  if(!it)return '<div class="card rcln" id="rcR'+i+'"><div class="row" style="flex-wrap:nowrap"><button class="rcl-pick empty grow" onclick="rcPickItem('+i+')">🥬 '+esc(t('rc_pick_item'))+'</button><button class="rcl-x" aria-label="x" onclick="rcDelLine('+i+')">✕</button></div></div>';
  const c=rcCalc(l),base=it.unit||'';let sub='';
  if(!(c.qty_base>0))sub='<span class="red">'+esc(c.packs>0?t('rc_need_size',{u:trUnit(l.pack_unit||base),b:trUnit(base)}):t('rc_need_qty'))+'</span>';
  else{sub='<b>'+fmtQ(c.packs)+' '+esc(trUnit(l.pack_unit||base))+'</b>'+(l.pack_unit&&l.pack_unit!==base?' × '+fmtQ(c.pack_qty)+' = '+fmtQ(c.qty_base)+' '+esc(trUnit(base)):'');
    sub+=c.price_total==null?' · <span class="red">'+esc(t('rc_no_price_yet'))+'</span>':' · '+esc(money(c.price_total))+' <span class="mut">(฿'+rcP(c.price_base)+'/'+esc(trUnit(base))+')</span>';}
  return '<div class="card rcln" id="rcR'+i+'"><div class="row" style="flex-wrap:nowrap"><div class="rcln-tap" onclick="rcEdit('+i+')">'+rcThumb(it,'rcln-th')+'<div style="min-width:0;flex:1"><b>'+esc(dispName(it))+'</b><div class="rcln-sub">'+sub+'</div></div></div>'+
    '<button class="rcl-x" aria-label="x" onclick="rcDelLine('+i+')">✕</button></div></div>';}

/* ---------- หน้าต่างใส่ข้อมูลของรายการ (เปิดหลังแตะรูป) ---------- */
function rcCalc(l){ // → {it,packs,pack_qty,qty_base,price,price_total,price_base}
  const it=itemById(l.item_id);const packs=num(l.packs),pq=num(l.pack_qty);const qty_base=rnd4(packs*pq);
  const ps=String(l.price==null?'':l.price).trim();const price=ps===''?null:num(ps);
  const price_total=price==null?null:rnd2(l.price_mode==='total'?price:price*packs);

function rcValidate(){ // → ข้อความผิดพลาด หรือ null
  if(!S.kcSql)return t('rc_sql_block');
  if(!RC.lines.length)return t('rc_need_item');
  for(const l of RC.lines){const c=rcCalc(l);if(!c.it)return t('rc_need_item');
    if(!(c.packs>0))return dispName(c.it)+': '+t('rc_need_qty');
    if(!(c.pack_qty>0))return dispName(c.it)+': '+t('rc_need_size',{u:trUnit(l.pack_unit||c.it.unit),b:trUnit(c.it.unit)});
    if(c.price==null||c.price<0)return dispName(c.it)+': '+t('rc_need_price');}
  return null;}
function rcLineRows(rid){ // บรรทัดที่จะเขียน + ค่าก่อนรับของแต่ละวัตถุดิบ (prev_* ไว้ย้อน/คิดใหม่ตอนยกเลิก · prev_qty = ยอดก่อนรับ)
  return RC.lines.map((l,i)=>{const c=rcCalc(l),it=c.it;
    return {receipt_id:rid,item_id:it.id,name:it.name,packs:c.packs,pack_unit:l.pack_unit||it.unit,pack_qty:c.pack_qty,unit:it.unit||'',qty_base:c.qty_base,
      price_mode:l.price_mode==='total'?'total':'pack',price:rnd4(c.price),price_total:c.price_total,price_base:rnd4(c.price_base),sort:i+1,
      prev_avg:it.avg_cost==null?null:num(it.avg_cost),prev_last:it.last_price==null?null:num(it.last_price),prev_last_at:it.last_price_at||null,prev_qty:rnd4(num(it.qty))};});}
const RC_PREV=['prev_avg','prev_last','prev_last_at','prev_qty'];
async function rcInsertLines(rows){ // ตารางจริงอาจยังไม่มีช่อง prev_* → ตัดออกแล้วเขียนใหม่ (fail-soft) · คืน false ถ้าถูกตัด
  try{await db(()=>sb.from('kc_receipt_lines').insert(rows));return true;}
  catch(e){if(!/prev_/.test(String(e&&e.message||'')))throw e;}
  await db(()=>sb.from('kc_receipt_lines').insert(rows.map(r=>{const x=Object.assign({},r);RC_PREV.forEach(k=>{delete x[k];});return x;})));return false;}
async function rcSavePacks(rows){ // หน่วยบรรจุใหม่ที่พิมพ์เอง → จำไว้กับวัตถุดิบ (ck_items.packs)
  for(const r of rows){const it=itemById(r.item_id);if(!it||!r.pack_unit||r.pack_unit===it.unit||unitFactor(it,r.pack_unit)!=null)continue;
    const packs=(Array.isArray(it.packs)?it.packs:[]).concat([{u:r.pack_unit,q:r.pack_qty}]);
    try{await db(()=>sb.from('ck_items').update({packs}).eq('id',it.id));it.packs=packs;toast(t('rc_pack_new_saved',{u:trUnit(r.pack_unit),i:dispName(it),q:fmtQ(r.pack_qty),b:trUnit(it.unit)}));}catch(e){}}}
function rcSnap(ids){const o={};ids.forEach(id=>{const it=itemById(id);if(it)o[id]={qty:num(it.qty),avg_cost:it.avg_cost==null?null:num(it.avg_cost),last_price:it.last_price==null?null:num(it.last_price),last_price_at:it.last_price_at||null};});return o;}
async function rcRollback(rid,step,snap){ // บันทึกไม่ครบ = ถอนทุกอย่างที่เขียนไปแล้ว (best effort · ไม่ throw)
  if(step==='moves')await pushMovesUndo('kc_receipts',rid);
  if(step==='moves'||step==='cost'){for(const id of Object.keys(snap)){const p={avg_cost:snap[id].avg_cost,last_price:snap[id].last_price,last_price_at:snap[id].last_price_at};
    try{await sb.from('ck_items').update(p).eq('id',id);}catch(e){}const it=itemById(id);if(it)Object.assign(it,p);}}
  if(step!=='head'){try{await sb.from('kc_receipt_lines').delete().eq('receipt_id',rid);}catch(e){}}
  try{await sb.from('kc_receipts').delete().eq('id',rid);}catch(e){}}
async function rcAfterMoves(rid,agg,snap,d,prevOk){ // ยอดก่อนรับที่ RPC บอก (ยอดสดหลังบวก − ที่รับ) ต่างจากตอนคิด = คิดถัวเฉลี่ยใหม่ + แก้ prev_qty บนบรรทัด
  let fixed=false;
  for(const id of Object.keys(agg)){const it=itemById(id);if(!it)continue;const live=rnd4(num(it.qty)-agg[id].q);
    if(Math.abs(live-snap[id].qty)<1e-9)continue;
    const it0=Object.assign({},it,{avg_cost:snap[id].avg_cost});const avg=avgCostItem(it0,agg[id].q,agg[id].v/agg[id].q,live);
    try{await sb.from('ck_items').update({avg_cost:avg}).eq('id',id);it.avg_cost=avg;fixed=true;
      if(prevOk)await sb.from('kc_receipt_lines').update({prev_qty:live}).eq('receipt_id',rid).eq('item_id',id);}catch(e){}}
  if(fixed)toast(t('rc_cost_fix'),'warn');}
async function rcSave(){await once(async()=>{
  const err=rcValidate();if(err){toast(err,true);return;}
  const zero=RC.lines.filter(l=>rcCalc(l).price===0).length;
  if(zero&&!(await confirm2(t('rc_zero_price_q',{n:zero}))))return;
  await refreshRows('item',RC.lines.map(l=>l.item_id));   // ยอด/ต้นทุนสดก่อนคิดถัวเฉลี่ย (อีกเครื่องอาจเพิ่งรับ/ใช้ของตัวเดียวกัน)
  const rid=uid('rc'),d=RC.d||bizTodayISO();const rows=rcLineRows(rid);const total=rnd2(rows.reduce((a,r)=>a+r.price_total,0));
  const head={id:rid,d,sup_id:RC.sup_id||null,sup_name:RC.sup_name||null,bill_no:null,total,note:RC.note||null,po_id:RC.po_id||null,by_name:S.user&&S.user.name};   // ไม่มีช่องเลขบิลแล้ว (ร่างรุ่นเก่าที่ยังมี bill_no ก็ไม่เขียน)
  /* ต้นทุน: รวมบรรทัดของวัตถุดิบเดียวกันก่อน แล้วถัวเฉลี่ยครั้งเดียว (ใช้ยอดก่อนเคลื่อนไหว — จึงเขียนก่อน pushMoves · พลาด = ถอน) */
  const agg={};rows.forEach(r=>{const a=agg[r.item_id]=agg[r.item_id]||{q:0,v:0};a.q+=r.qty_base;a.v+=r.price_total;});
  const snap=rcSnap(Object.keys(agg));
  let prevOk=true,step='head';
  try{
    await db(()=>sb.from('kc_receipts').insert(head));
    step='lines';prevOk=await rcInsertLines(rows);
    step='cost';for(const id of Object.keys(agg)){const it=itemById(id);if(it&&agg[id].q>0)await applyItemReceipt(it,agg[id].q,agg[id].v/agg[id].q,d,snap[id].qty);}
    step='moves';await pushMoves(rows.map(r=>({d,kind:'receive',ref_kind:'item',ref_id:r.item_id,qty:r.qty_base,cost:r.price_total,ref_table:'kc_receipts',ref_id2:rid,note:head.sup_name?head.sup_name+(head.bill_no?' #'+head.bill_no:''):null})));
  }catch(e){await rcRollback(rid,step,snap);toast(t('rc_not_saved')+' · '+((e&&e.message)||e),true);return;}
  await rcAfterMoves(rid,agg,snap,d,prevOk);
  await rcSavePacks(rows);
  if(RC.po_id){try{await db(()=>sb.from('kc_pos').update({status:'received'}).eq('id',RC.po_id));}catch(e){}}
  toast(prevOk?t('rc_saved',{n:rows.length,m:money(total)}):t('rc_prev_cols'),prevOk?false:'warn');   // ไม่มีช่อง prev_* = บันทึกได้ เตือน (เหลือง) ว่ายกเลิกแล้วต้นทุนไม่ย้อน
  RC=rcBlank();rcDraftClear();RC_CAT='';RC_Q='';RC_VIEW='list';rerender();rcDetail(rid);});}   // ฟอร์มใหม่ = ชิป/คำค้นของตารางรูปเริ่มใหม่ด้วย (ไม่งั้นคำค้นเก่าค้างกรองตารางรูปของใบถัดไป)

async function rcLaterLines(r,itemIds){ // ใบรับของที่บันทึก "หลัง" ใบนี้ (ตามเวลาบันทึก) ของวัตถุดิบเดียวกัน → {item_id:[{prev_qty,qty,price,d}]} เรียงตามเวลา · 1 ใบ = 1 ก้อน (รวมบรรทัดของวัตถุดิบเดียวกันเหมือนตอนบันทึก)
  const out={};if(!r.created_at)return out;
  const rs=await db(()=>sb.from('kc_receipts').select('id,d,created_at').gt('created_at',r.created_at).neq('id',r.id).order('created_at').limit(500));
  if(!rs.length)return out;
  const ls=await db(()=>sb.from('kc_receipt_lines').select('id,receipt_id,item_id,qty_base,price_total,prev_qty,prev_avg').in('receipt_id',rs.map(x=>x.id)).in('item_id',itemIds));
  const ord={},dOf={};rs.forEach((x,i)=>{ord[x.id]=i;dOf[x.id]=x.d;});
  const g={};ls.forEach(l=>{const k=l.item_id+'|'+l.receipt_id;const o=g[k]=g[k]||{item_id:l.item_id,receipt_id:l.receipt_id,i:ord[l.receipt_id],prev_qty:l.prev_qty==null?null:num(l.prev_qty),qty:0,v:0,d:dOf[l.receipt_id]||null};
    o.qty+=num(l.qty_base);o.v+=num(l.price_total);});
  Object.values(g).sort((x,y)=>x.i-y.i).forEach(o=>{(out[o.item_id]=out[o.item_id]||[]).push({receipt_id:o.receipt_id,prev_qty:o.prev_qty,qty:rnd4(o.qty),price:o.qty>0?o.v/o.qty:0,d:o.d});});
  return out;}
function rcVoidPatch(it,l,vq,vp,later,done){ // ต้นทุนหลังยกเลิกของวัตถุดิบหนึ่งตัว → {patch, fixes} · later=null = อ่านใบหลังจากนั้นไม่ได้ → ถอดน้ำหนักจากถัวเฉลี่ยปัจจุบัน
  const qtyNow=done?num(it.qty)+vq:num(it.qty);   // ยอดที่ยังรวมใบที่กำลังยกเลิก
  const res=costAfterVoid({qty:qtyNow,avg_cost:it.avg_cost},{avg:l.prev_avg,last:l.prev_last,last_at:l.prev_last_at},vq,vp,later);
  const p={avg_cost:res.avg};if(!res.unknown){p.last_price=res.last;p.last_price_at=res.last_at;}
  return {patch:p,fixes:res.fixes||[]};}
async function rcFixLater(iid,fixes){ // ใบหลัง ๆ ของวัตถุดิบนี้จดค่าก่อนรับใหม่ (เหมือนใบที่ยกเลิกไม่เคยมี) · fail-soft
  for(const f of fixes){try{await sb.from('kc_receipt_lines').update({prev_qty:f.prev_qty,prev_avg:f.prev_avg,prev_last:f.prev_last,prev_last_at:f.prev_last_at}).eq('receipt_id',f.L.receipt_id).eq('item_id',iid);}catch(e){}}}
async function rcVoid(id){await once(async()=>{
  let r=null,lines=[];
  try{r=await db(()=>sb.from('kc_receipts').select('*').eq('id',id).maybeSingle());if(r)lines=await db(()=>sb.from('kc_receipt_lines').select('*').eq('receipt_id',id).order('sort'));}catch(e){return;}
  if(!r){toast(t('rc_voided_gone'));return;}
  if(r.d!==bizTodayISO()){toast(t('rc_void_today'),true);return;}
  if(!(await confirm2(t('rc_void_q',{s:r.sup_name||'',b:r.bill_no?'#'+r.bill_no:'',n:lines.length}),{danger:true})))return;
  const itemIds=[...new Set(lines.map(l=>l.item_id).filter(Boolean))];
  await refreshRows('item',itemIds);
  let na=false;   // บรรทัดไม่มีช่อง prev_* (ตารางรุ่นเก่า) = คืนสต๊อกอย่างเดียว เตือนว่าต้นทุนไม่ย้อน
  try{
    const done=await voidDone('kc_receipts',id);   // รอบก่อนคืนสต๊อกแล้วแต่ลบใบไม่สำเร็จ = ไม่คืนซ้ำ
    let later=null;try{later=await rcLaterLines(r,itemIds);}catch(e){later=null;}
    /* ต้นทุนหลังยกเลิก: ไม่มีใบหลังจากนั้น = คืนค่าที่จดไว้ก่อนรับ · มี = เล่นซ้ำด้วยใบที่เหลือ (ไม่ลบผลของใบที่มาทีหลัง) */
    const agg={};lines.forEach(l=>{const a=agg[l.item_id]=agg[l.item_id]||{q:0,v:0,l};a.q+=num(l.qty_base);a.v+=num(l.price_total);});
    const patches={},fixes={};
    for(const iid of Object.keys(agg)){const it=itemById(iid);if(!it)continue;const l=agg[iid].l;
      if(!('prev_avg' in l)){na=true;continue;}
      const r2=rcVoidPatch(it,l,agg[iid].q,agg[iid].q>0?agg[iid].v/agg[iid].q:0,later?(later[iid]||[]):null,done);patches[iid]=r2.patch;fixes[iid]=r2.fixes;}
    if(!done)await pushMoves(lines.map(l=>({d:bizTodayISO(),kind:'adjust',ref_kind:'item',ref_id:l.item_id,qty:-num(l.qty_base),cost:-num(l.price_total),ref_table:'kc_receipts',ref_id2:id,note:t('rc_void_note')+(r.bill_no?' #'+r.bill_no:'')})));
    for(const iid of Object.keys(patches)){const it=itemById(iid);await db(()=>sb.from('ck_items').update(patches[iid]).eq('id',iid));Object.assign(it,patches[iid]);await rcFixLater(iid,fixes[iid]);}
    await db(()=>sb.from('kc_receipt_lines').delete().eq('receipt_id',id));
    await db(()=>sb.from('kc_receipts').delete().eq('id',id));
    if(r.po_id){try{await db(()=>sb.from('kc_pos').update({status:'sent'}).eq('id',r.po_id));}catch(e){}}
  }catch(e){return;}
  closeModal();toast(na?t('rc_prev_na'):t('rc_void_ok'),na?'warn':false);if(S.tab==='recv')rerender();});}

/* ---------- ออเดอร์สาขา + ยอดส่ง (อ่านอย่างเดียว · fail-soft) ---------- */
async function mkLoad(force){
  if(MK_LOADING)return MK_LOADING;
  if(!force&&MK_ORD.ok&&Date.now()-MK_ORD.at<60000)return;
  MK_LOADING=(async()=>{
    const td=bizTodayISO(),lb=num((S.cfg||CFG_DEF).order_lookback_days);
    const get=async q=>{try{const r=await q;if(r&&r.error){const x={ok:false,rows:[],err:r.error};sdTblGone(x);return x.ok?[]:null;}return r.data||[];}catch(e){return null;}};   // อ่านพลาด/ไม่มีสิทธิ์/ไม่มีคอลัมน์ = null (ห้ามถือว่าว่าง → ⚡ จากข้อมูลครึ่ง ๆ) · ตารางไม่มีจริงตอนยังไม่รัน SQL = ว่าง
    const [orders,links,dels,prods]=await Promise.all([
      get(sb.from('stock_receipts').select('branch_id,branch_name,product_id,name,unit,sup,order_date,ordered').gte('order_date',addDays(td,-lb)).gt('ordered',0)),
      get(sb.from('kc_links').select('stk_name,recipe_id,factor')),
      get(sb.from('kc_deliveries').select('id,d,branch,order_date,status,note').gte('d',addDays(td,-Math.max(14,lb+3))).neq('status','void')),   // ต้องมี note — sdCalcGroups ใช้ sdIsManual(d) ข้ามบิล ➕ ส่งเพิ่ม (ผู้ตรวจ V2 เจอว่าไม่มี note → บิลส่งเพิ่มไปหักออเดอร์ของสาขา)
      get(sb.from('kc_productions').select('*').eq('d',td).order('created_at',{ascending:false}))]);
    let dl=[],dlOk=dels!=null;if(dels&&dels.length){const r=await get(sb.from('kc_delivery_lines').select('delivery_id,recipe_id,stk_product_id,name,sent').in('delivery_id',dels.map(x=>x.id)));if(r==null)dlOk=false;else dl=r;}
    MK_ORD=mkOrdersCalc(orders||[],links,dels||[],dl,td,orders!=null&&dlOk,dlOk);MK_TODAY=prods||[];   // อ่านไม่ครบ (ออเดอร์/บิล/บรรทัดที่ส่งแล้ว) = ไม่คิด ⚡ จากข้อมูลครึ่ง ๆ · บิลอ่านไม่ครบ = ไม่คิด 🔄 ด้วย
  })();
  try{await MK_LOADING;}finally{MK_LOADING=null;}
}
function mkOrdersCalc(orders,links,dels,dl,td,ok,dailyOk){ // ออเดอร์ค้างต่อเมนู = ตัวคิดเดียวกับ 🚚 ส่งสาขา/☀️ วันนี้ (sdCalcGroups) → ⚡ ขาด ของหน้านี้ = ขาด ของหน้าส่งสาขา เสมอ · dailyOk (ตั้งต้น = ok) = บิล 14 วันอ่านครบ จึงคิดยอดส่งเฉลี่ย
  if(Array.isArray(links))TD_LINKS=links;   // ชื่อสินค้าสาขา ↔ เมนู (อ่านไม่ได้ = ใช้ของเดิม)
  const C=ok?sdCalcGroups({sr:orders,dl:dels,dll:dl},S.branchesAll):{ordered:{},sent:{}};   // ทำของ = ทั้งครัว (ทุกสาขา) · หน้าส่งสาขา/วันนี้ ใช้ S.branches ตามสิทธิ์ · อ่านไม่ครบ = ไม่มีออเดอร์ให้คิด (ขึ้นแถบเตือน)
  const daily={},from14=addDays(td,-14),dById={};dels.forEach(x=>{dById[x.id]=x;});
  if(dailyOk==null?ok:dailyOk)dl.forEach(l=>{const dv=dById[l.delivery_id];if(!dv||!l.recipe_id)return;if(String(dv.d)>=from14)daily[l.recipe_id]=num(daily[l.recipe_id])+num(l.sent)*tdLineFactor(l);});   // หน่วยครัว (= tdAvgSent ของ ☀️)
  Object.keys(daily).forEach(k=>{daily[k]=rnd4(daily[k]/14);});
  return {at:Date.now(),ok,ordered:C.ordered,sent:C.sent,daily};}
function mkNeeds(){ // ต่อเมนู: open (สั่งค้าง) · short (ขาด) · target (= Safety ขั้นต่ำที่ต้องมี) · upto (= Max ทำเติมให้ถึง · ไม่ตั้ง = Safety) · below (ต้องเติม) · sugg (รอบที่แนะนำ)
  const out={};activeRecipes().forEach(r=>{
    const open=Math.max(0,rnd4(num(MK_ORD.ordered[r.id])-num(MK_ORD.sent[r.id]))),stock=num(r.qty),short=Math.max(0,rnd4(open-stock));
    const tc=mnTargetCalc(r,stock,num(MK_ORD.daily[r.id]));   // สูตรเดียวกับ ☀️ วันนี้ + 🎯 หน้าตั้ง Safety/Max: สต๊อก < Safety → เติมถึง Max (ว่าง = ถึง Safety)
    const target=tc.safety,below=tc.below,need=Math.max(short,below),yq=num(r.yield_qty)||1;
    out[r.id]={open,stock,short,target,upto:tc.upto,below,need,sugg:need>0?Math.ceil(need/yq-1e-9):0};});
  return out;}

    '<div class="row" style="justify-content:space-between"><span class="chip '+(num(r.qty)>0?'ok':'mid')+'">📦 '+fmtQ(r.qty)+' '+esc(u)+'</span>'+(n.sugg?'<span class="mk-sugg">'+esc(t('mk_sugg',{n:n.sugg}))+(n.short>0&&n.below>n.short+1e-9?' · '+esc(t('mk_sugg_tgt',{q:fmtQ(n.upto)})):'')+'</span>':'')+'</div>'+need+'</div>';}

function mkPaintDraftBox(){

/* ---------- ร่าง ---------- */
function mkDraftRead(){const d=LS.get(MK_DRAFT,null);if(!d||typeof d!=='object'||!d.mk||d.d!==bizTodayISO()||!(Date.now()-num(d.t)<MK_DRAFT_MS))return null;return d;}
function mkDraft(open,now){ // open=false = ‹ กลับ แล้ว (เก็บตัวเลขไว้ ไม่เปิดฟอร์มเองตอนรีเฟรช) · now = เขียนทันที (ไม่รอ 150ms)
  clearTimeout(mkDraft._t);const w=()=>{if(MK)LS.set(MK_DRAFT,{t:Date.now(),d:bizTodayISO(),open:open!==false,mk:MK});};
  if(now)w();else mkDraft._t=setTimeout(w,150);}
function mkDraftClear(){clearTimeout(mkDraft._t);LS.del(MK_DRAFT);}
function mkDraftGo(){const dr=mkDraftRead();if(!dr||!recipeById(dr.mk.rid)){mkDraftClear();mkPaintDraftBox();return;}MK=dr.mk;mkDraft(true,true);rerender();}
function mkDraftDrop(){mkDraftClear();MK=null;if(S.tab==='make')rerender();}

/* ---------- ฟอร์มทำของ ---------- */
async function mkOpen(rid,lots,kind){
  if(!canKitchen())return;const r=recipeById(rid);if(!r)return;
  const dr=mkDraftRead();
  if(dr&&dr.mk.rid!==rid&&recipeById(dr.mk.rid)){if(!(await confirm2(t('mk_draft_q',{n:dispName(recipeById(dr.mk.rid))}),{danger:true})))return;}
  if(dr&&dr.mk.rid===rid){MK=dr.mk;mkDraft(true,true);if(S.tab==='make')rerender();else show('make');return;}
  lots=num(lots)>0?rnd4(num(lots)):1;
  MK={rid,lots,lines:bomOf(r).map(l=>mkLineFrom(l,lots)),
    actual:rnd4(num(r.yield_qty)*lots),actualTouched:false,kind:['urgent','refill'].includes(kind)?kind:'manual',note:''};
  mkDraft(true,true);if(S.tab==='make')rerender();else show('make');
}
function mkLineFrom(l,lots){ // บรรทัดสูตร → บรรทัดทำของ · หน่วยในสูตรแปลงเป็นหน่วยหลักไม่ได้ (ขนาดบรรจุถูกลบ/หน่วยสะกดผิด) = bad_unit — ห้ามคิดเป็น 0 เงียบ ๆ (ตรวจอิสระ 2026-10-16)
  const bad=l.qty_base==null,plan=bad?0:rnd4(l.qty_base*lots);
  return {item_id:l.item_id,plan,used:plan,waste:0,bad_unit:bad?(l.unit||'?'):null};}
function mkLinesSync(m){ // ร่างที่เปิดค้าง/เพิ่งแก้สูตร: หน่วยที่เคยแปลงไม่ได้แปลงได้แล้ว (หรือกลับกัน) → ปรับบรรทัดให้ตรงสูตรปัจจุบัน
  const r=recipeById(m.rid);if(!r)return;const bom=bomOf(r);
  m.lines.forEach(l=>{const b=bom.find(x=>x.item_id===l.item_id);if(!b)return;const nb=b.qty_base==null?(b.unit||'?'):null;
    if(nb!==(l.bad_unit||null)){l.bad_unit=nb;l.plan=nb?0:rnd4(b.qty_base*num(m.lots));l.used=l.plan;}});}

}
function mkLineCalc(i){ // → {it,uc,used,waste,cost,over,bad,ubad} · ubad = หน่วยในสูตรที่แปลงเป็นหน่วยหลักไม่ได้ (บรรทัดนี้บันทึกไม่ได้)
  const l=MK.lines[i],it=itemById(l.item_id);if(!it)return {it:null};
  const sU=String(l.used==null?'':l.used).trim(),sW=String(l.waste==null?'':l.waste).trim();
  const used=sU===''?0:num(sU),waste=sW===''?0:num(sW),ubad=l.bad_unit||null,bad=!!ubad||(sU!==''&&(isNaN(parseFloat(sU))||used<0))||(sW!==''&&(isNaN(parseFloat(sW))||waste<0));
  const uc=itemCost(it);const cost=uc==null?null:rnd4((used+waste)*uc);
  return {it,uc,used,waste,cost,over:used+waste>num(it.qty)+1e-9,bad,ubad};}
function mkLineWarn(c){return c.ubad?t('mk_unit_bad',{u:trUnit(c.ubad),b:trUnit(c.it.unit)}):(c.over?t('mk_over'):'');}
function mkLinesHtml(){
  const m=MK;if(!m.lines.length)return '<div class="hintbox">'+esc(t('mk_no_bom'))+'</div>';
  return m.lines.map((l,i)=>{const c=mkLineCalc(i);if(!c.it)return '';const u=trUnit(c.it.unit),dis=c.ubad?' disabled':'';
    return '<div class="mk-line'+(c.over||c.ubad?' over':'')+'" id="mkL'+i+'"><div class="r1">'+thumbHtml(c.it,'🥬')+'<div class="nm">'+esc(dispName(c.it))+' <small>'+esc(u)+'</small><div class="have">'+esc(t('mk_have',{q:fmtQ(c.it.qty)+' '+u}))+(c.uc!=null?' · '+esc(mkMoney(c.uc))+'/'+esc(u):' · <span class="amber">'+esc(t('no_price'))+'</span>')+'</div></div>'+
      '<div class="cost" id="mkC'+i+'">'+(c.cost==null?'–':esc(money(c.cost)))+'</div></div>'+
      '<div class="r2"><div class="c0"><label>'+esc(t('mk_plan'))+'</label><div class="pv" id="mkP'+i+'">'+(c.ubad?'⚠':fmtQ(l.plan))+'</div></div>'+
      '<div><label>'+esc(t('mk_used'))+'</label><input type="text" inputmode="decimal" id="mkU'+i+'" value="'+esc(l.used)+'"'+dis+' onfocus="this.select()" oninput="mkLineIn('+i+',\'used\',this.value)"></div>'+
      '<div><label>'+esc(t('mk_waste'))+'</label><input type="text" inputmode="decimal" id="mkW'+i+'" value="'+esc(l.waste===0?'':l.waste)+'" placeholder="0"'+dis+' onfocus="this.select()" oninput="mkLineIn('+i+',\'waste\',this.value)"></div></div>'+
      '<div class="ow" id="mkO'+i+'">'+esc(mkLineWarn(c))+'</div></div>';}).join('');}
function mkLinePaint(i){ // วาดตัวเลขของบรรทัดในที่ (ไม่แตะ input ที่กำลังพิมพ์)
  const c=mkLineCalc(i);if(!c.it)return;const cc=document.getElementById('mkC'+i),ow=document.getElementById('mkO'+i),ln=document.getElementById('mkL'+i);
  if(cc)cc.textContent=c.cost==null?'–':money(c.cost);if(ow)ow.textContent=mkLineWarn(c);if(ln)ln.classList.toggle('over',!!(c.over||c.ubad));}
function mkLineIn(i,k,v){const m=MK;if(!m||!m.lines[i])return;m.lines[i][k]=v;mkDraft();mkLinePaint(i);mkPaintSum();}
function mkLotsChange(v){ // เปลี่ยนจำนวนรอบ = ตามสูตร/ใช้จริง/ได้จริง กลับเป็นตามแผนทั้งหมด (เศษที่พิมพ์ไว้คงเดิม)
  const m=MK;if(!m)return;const r=recipeById(m.rid);v=rnd4(num(v));
  if(v===rnd4(num(m.lots)))return;   // input แล้ว change ซ้ำ (blur ตอนแตะช่องอื่น) = ไม่ทำอะไร — ตรวจอิสระ 2026-10-16: วาดใหม่ตอนนี้ทำให้ช่องที่เพิ่งแตะหาย
  m.lots=v;
  const bom=bomOf(r);m.lines.forEach(l=>{const b=bom.find(x=>x.item_id===l.item_id);const qb=b&&b.qty_base!=null?b.qty_base:0;l.plan=rnd4(qb*v);l.used=l.plan;});
  m.actual=rnd4(num(r.yield_qty)*v);m.actualTouched=false;const a=document.getElementById('mkActual');if(a)a.value=m.actual;
  const hint=document.getElementById('mkActHint');if(hint)hint.textContent=t('mk_actual_hint',{q:fmtQ(rnd4(num(r.yield_qty)*v)),u:trUnit(r.yield_unit)});
  const b=document.getElementById('mkLines');
  if(b&&m.lines.every((l,i)=>document.getElementById('mkU'+i)))m.lines.forEach((l,i)=>{   // แก้ตัวเลขในที่ — ไม่ทำลาย input ที่โฟกัสอยู่
    const p=document.getElementById('mkP'+i),u=document.getElementById('mkU'+i);if(p)p.textContent=l.bad_unit?'⚠':fmtQ(l.plan);if(u)u.value=l.used;mkLinePaint(i);});
  else if(b)b.innerHTML=mkLinesHtml();
  mkDraft();mkPaintSum();}
function mkActualChange(v){const m=MK;if(!m)return;m.actual=rnd4(num(v));m.actualTouched=true;mkDraft();mkPaintSum();}
function mkCalc(){ // ต้นทุนล็อต: items (ใช้จริง+เศษ × ต้นทุน/หน่วย) · oh (ค่าใช้จ่ายแฝงตามตั้งค่า) · extra (ค่าอื่น × รอบ) · ohAll = oh+extra · total · unit
  const m=MK,r=recipeById(m.rid);let items=0;const missing=[],ubad=[];
  m.lines.forEach((l,i)=>{const c=mkLineCalc(i);if(!c.it)return;if(c.ubad){ubad.push(dispName(c.it)+' ('+trUnit(c.ubad)+')');return;}if(c.uc==null){if(c.used+c.waste>0)missing.push(dispName(c.it));return;}items+=c.cost;});
  items=rnd2(items);const actual=num(m.actual),lots=num(m.lots);
  const oh=rnd2(overheadFor(items,actual)),extra=rnd2(num(r.extra_cost)*lots),ohAll=rnd2(oh+extra),total=rnd2(items+ohAll);
  return {items,oh,extra,ohAll,total,unit:actual>0?rnd4(total/actual):null,missing,ubad,prev:recipeUnitCost(r)};}
function mkSumHtml(){
  const m=MK,r=recipeById(m.rid),c=mkCalc(),u=trUnit(r.yield_unit);
  let vs='';if(c.unit!=null&&c.prev!=null&&c.prev>0){const p=Math.round((c.unit-c.prev)/c.prev*100);vs='<span class="sm '+(p>0?'red':p<0?'green':'mut')+'">'+(p>0?'▲':p<0?'▼':'=')+Math.abs(p)+'% · '+esc(t('mk_vs',{c:fmtQ(c.prev),u}))+'</span>';}
  else if(c.unit!=null)vs='<span class="sm mut">'+esc(t('mk_vs_first'))+'</span>';
  return '<h3>'+esc(t('mk_cost'))+'</h3>'+
    '<div class="ln"><span>'+esc(t('mk_cost_items'))+'</span><span>'+esc(money(c.items))+'</span></div>'+

/* ---------- บันทึก ---------- */
function mkValidate(){ // → ข้อความผิดพลาด หรือ null
  const m=MK;if(!S.kcSql)return t('mk_sql_block');
  if(!(num(m.lots)>0))return t('mk_need_lots');if(!(num(m.actual)>0))return t('mk_need_actual');
  for(let i=0;i<m.lines.length;i++){const c=mkLineCalc(i);if(!c.it)continue;
    if(c.ubad)return t('mk_unit_bad_q',{n:dispName(c.it),u:trUnit(c.ubad),b:trUnit(c.it.unit)});   // สูตรแปลงหน่วยไม่ได้ = ห้ามบันทึก (ไม่งั้นล็อตนี้ขาดส่วนผสม ต้นทุนต่ำกว่าจริง)
    if(c.bad)return t('mk_bad_line',{n:dispName(c.it)});}
  return null;}
async function mkIns(tbl,rows){ // ตารางจริงอาจยังไม่มีช่อง prev_* → ตัดออกแล้วเขียนใหม่ (fail-soft) · คืน false ถ้าถูกตัด
  setBusy(true);
  try{let r=await sb.from(tbl).insert(rows);if(!r||!r.error)return true;
    if(r.error.code==='PGRST204'&&/prev_/.test(String(r.error.message||''))){const strip=x=>{const y=Object.assign({},x);delete y.prev_avg;delete y.prev_unit_cost;delete y.prev_qty;return y;};
      r=await sb.from(tbl).insert(Array.isArray(rows)?rows.map(strip):strip(rows));if(!r||!r.error)return false;}
    const d=document.getElementById('syncDot');if(d)d.className='err';toast(t('sv_err')+(r.error.message||r.error),true);throw r.error;}
  finally{setBusy(false);}}
function mkRepaintCosts(){ // ต้นทุนสดหลัง refreshRows — แก้ตัวเลขต้นทุนบนบรรทัด/สรุปในที่ (ไม่วาดฟอร์มใหม่)
  if(!MK)return;MK.lines.forEach((l,i)=>{const c=mkLineCalc(i);const cc=document.getElementById('mkC'+i);if(cc)cc.textContent=c.cost==null?'–':money(c.cost);});mkPaintSum();}
async function mkRollback(pid,step,r,snap){ // บันทึกไม่ครบ = ถอนทุกอย่างที่เขียนไปแล้ว (best effort · ไม่ throw)
  if(step==='moves')await pushMovesUndo('kc_productions',pid);
  if((step==='moves'||step==='cost')&&r){const p={avg_cost:snap.avg_cost,unit_cost:snap.unit_cost};try{await sb.from('ck_recipes').update(p).eq('id',r.id);}catch(e){}Object.assign(r,p);}
  if(step!=='head'){try{await sb.from('kc_production_lines').delete().eq('production_id',pid);}catch(e){}}
  try{await sb.from('kc_productions').delete().eq('id',pid);}catch(e){}}
async function mkAfterMoves(pid,r,actual,unit,snap,prevOk){ // ยอดสินค้าก่อนล็อตที่ RPC บอก ต่างจากตอนคิด = คิดถัวเฉลี่ยใหม่ + แก้ prev_qty
  const live=rnd4(num(r.qty)-actual);if(Math.abs(live-snap.qty)<1e-9)return;
  const avg=avgCostRecipe(Object.assign({},r,{avg_cost:snap.avg_cost}),actual,unit,live);
  try{await sb.from('ck_recipes').update({avg_cost:avg}).eq('id',r.id);r.avg_cost=avg;if(prevOk)await sb.from('kc_productions').update({prev_qty:live}).eq('id',pid);toast(t('mk_cost_fix'),'warn');}catch(e){}}
async function mkSave(){await once(async()=>{
  const m=MK;if(!m||!canKitchen())return;const r=recipeById(m.rid);if(!r)return;
  const nt=document.getElementById('mkNote');if(nt)m.note=nt.value;
  const err=mkValidate();if(err){toast(err,true);return;}
  await refreshRows('item',m.lines.map(l=>l.item_id));await refreshRows('recipe',[r.id]);mkRepaintCosts();   // ยอด/ต้นทุนสด — ต้นทุนล็อตนี้คิดจากราคาวัตถุดิบล่าสุดจริง
  const over=m.lines.map((l,i)=>mkLineCalc(i)).filter(c=>c.it&&c.over).map(c=>dispName(c.it));
  if(over.length&&!(await confirm2(t('mk_over_q',{list:over.join(', ')}),{danger:true})))return;
  const c=mkCalc();
  if(c.missing.length&&!(await confirm2(t('mk_missing_q',{list:c.missing.join(', ')}))))return;
  const pid=uid('pd'),d=bizTodayISO(),lots=rnd4(num(m.lots)),actual=rnd4(num(m.actual)),u=trUnit(r.yield_unit);
  const snap={avg_cost:r.avg_cost==null?null:num(r.avg_cost),unit_cost:r.unit_cost==null?null:num(r.unit_cost),qty:rnd4(num(r.qty))};
  const head={id:pid,d,recipe_id:r.id,name:r.name,lots,plan_qty:rnd4(lots*num(r.yield_qty)),actual_qty:actual,unit:r.yield_unit||'',cost_items:c.items,cost_overhead:c.ohAll,cost_total:c.total,cost_unit:c.unit,
    kind:m.kind||'manual',note:String(m.note||'').trim()||null,by_name:S.user&&S.user.name,prev_avg:snap.avg_cost,prev_unit_cost:snap.unit_cost,prev_qty:snap.qty};
  const rows=m.lines.map((l,i)=>{const x=mkLineCalc(i);if(!x.it)return null;
    return {production_id:pid,item_id:x.it.id,name:x.it.name,qty_plan:rnd4(l.plan),qty_used:rnd4(x.used),qty_waste:rnd4(x.waste),unit:x.it.unit||'',unit_cost:x.uc==null?null:rnd4(x.uc),cost:rnd4(x.cost||0),sort:i+1};}).filter(Boolean);
  let prevOk=true,step='head';
  try{
    prevOk=await mkIns('kc_productions',head);
    step='lines';if(rows.length)await mkIns('kc_production_lines',rows);
    step='cost';await applyRecipeLot(r,actual,c.unit,snap.qty);   // ถัวเฉลี่ยกับสต๊อกเดิม + unit_cost = ล็อตนี้ — ก่อน pushMoves (ใช้ยอดก่อนเคลื่อนไหว) · พลาด = ถอน
    step='moves';const mv=[];
    rows.forEach(x=>{const uc=num(x.unit_cost);
      if(x.qty_used>0)mv.push({d,kind:'produce_out',ref_kind:'item',ref_id:x.item_id,qty:-x.qty_used,cost:-rnd4(x.qty_used*uc),ref_table:'kc_productions',ref_id2:pid,note:r.name});
      if(x.qty_waste>0)mv.push({d,kind:'waste',ref_kind:'item',ref_id:x.item_id,qty:-x.qty_waste,cost:-rnd4(x.qty_waste*uc),ref_table:'kc_productions',ref_id2:pid,note:r.name+' · '+t('mk_waste')});});
    mv.push({d,kind:'produce_in',ref_kind:'recipe',ref_id:r.id,qty:actual,cost:c.total,ref_table:'kc_productions',ref_id2:pid,note:t('mk_lots_n',{n:fmtQ(lots)})});
    await pushMoves(mv);
  }catch(e){await mkRollback(pid,step,r,snap);toast(t('mk_not_saved')+' · '+((e&&e.message)||e),true);return;}
  await mkAfterMoves(pid,r,actual,c.unit,snap,prevOk);
  toast(prevOk?t('mk_saved',{q:fmtQ(actual),u,c:fmtQ(c.unit)}):t('mk_prev_cols'),prevOk?false:'warn');
  MK=null;mkDraftClear();MK_TODAY.unshift(Object.assign({created_at:new Date().toISOString()},head));MK_ORD.at=0;
  if(S.tab==='make')rerender();mkDetail(pid);
});}

async function mkLaterLots(p){ // ล็อตของสินค้าเดียวกันที่บันทึก "หลัง" ล็อตนี้ → [{prev_qty,qty,price:cost_unit}] เรียงตามเวลา
  if(!p.created_at)return [];
  const rows=await db(()=>sb.from('kc_productions').select('id,actual_qty,cost_unit,prev_qty,created_at').eq('recipe_id',p.recipe_id).gt('created_at',p.created_at).neq('id',p.id).order('created_at').limit(500));
  return rows.map(x=>({id:x.id,prev_qty:x.prev_qty==null?null:num(x.prev_qty),qty:num(x.actual_qty),price:num(x.cost_unit)}));}
function mkVoidPatch(r,p,later,done){ // ต้นทุนสินค้าหลังยกเลิกล็อต → {patch,fixes} · later=null = อ่านล็อตหลังจากนั้นไม่ได้ → ถอดน้ำหนักจากถัวเฉลี่ยปัจจุบัน
  const vq=num(p.actual_qty),vp=num(p.cost_unit),qtyNow=done?num(r.qty)+vq:num(r.qty);
  const res=costAfterVoid({qty:qtyNow,avg_cost:r.avg_cost},{avg:p.prev_avg,last:p.prev_unit_cost,last_at:null},vq,vp,later);   // "ราคาล่าสุด" ของสินค้า = unit_cost ของล็อตล่าสุด
  const patch={avg_cost:res.avg,unit_cost:res.unknown?(r.unit_cost==null?null:num(r.unit_cost)):res.last};
  return {patch,fixes:res.fixes||[]};}
async function mkFixLater(fixes){ // ล็อตหลัง ๆ จดค่าก่อนล็อตใหม่ (เหมือนล็อตที่ยกเลิกไม่เคยมี) · fail-soft
  for(const f of fixes){try{await sb.from('kc_productions').update({prev_qty:f.prev_qty,prev_avg:f.prev_avg,prev_unit_cost:f.prev_last}).eq('id',f.L.id);}catch(e){}}}
async function mkVoid(id){await once(async()=>{
  if(!canKitchen())return;let p=null,lines=[];
  try{p=await db(()=>sb.from('kc_productions').select('*').eq('id',id).maybeSingle());if(p)lines=await db(()=>sb.from('kc_production_lines').select('*').eq('production_id',id).order('sort'));}catch(e){return;}
  if(!p){toast(t('mk_gone'));return;}
  if(p.d!==bizTodayISO()){toast(t('mk_void_today'),true);return;}
  if(!(await confirm2(t('mk_void_q',{n:p.name,q:fmtQ(p.actual_qty),u:trUnit(p.unit)}),{danger:true})))return;
  const r=recipeById(p.recipe_id);let na=false;
  if(r)await refreshRows('recipe',[r.id]);await refreshRows('item',lines.map(l=>l.item_id));
  try{
    const done=await voidDone('kc_productions',id);   // รอบก่อนคืนสต๊อกแล้วแต่ลบล็อตไม่สำเร็จ = ไม่คืนซ้ำ
    let patch=null,fixes=[];
    if(r){if('prev_avg' in p){let later=null;try{later=await mkLaterLots(p);}catch(e){later=null;}const r2=mkVoidPatch(r,p,later,done);patch=r2.patch;fixes=r2.fixes;}else na=true;}
    const d=bizTodayISO(),note=t('mk_void_note')+' · '+p.name;
    if(!done){const mv=lines.map(l=>({d,kind:'adjust',ref_kind:'item',ref_id:l.item_id,qty:rnd4(num(l.qty_used)+num(l.qty_waste)),cost:num(l.cost),ref_table:'kc_productions',ref_id2:id,note}));
      if(r)mv.push({d,kind:'adjust',ref_kind:'recipe',ref_id:r.id,qty:-num(p.actual_qty),cost:-num(p.cost_total),ref_table:'kc_productions',ref_id2:id,note});
      await pushMoves(mv);}
    if(patch){await db(()=>sb.from('ck_recipes').update(patch).eq('id',r.id));Object.assign(r,patch);await mkFixLater(fixes);}
    await db(()=>sb.from('kc_production_lines').delete().eq('production_id',id));
    await db(()=>sb.from('kc_productions').delete().eq('id',id));
  }catch(e){return;}
  MK_TODAY=MK_TODAY.filter(x=>x.id!==id);MK_ORD.at=0;closeModal();toast(na?t('mk_prev_na'):t('mk_void_ok'),na?'warn':false);
  if(S.tab==='make'&&!MK)rerender();});}

let CT={};                                            // {'kind|id':{kind,id,v:'ที่พิมพ์',u:'หน่วยนับตอนพิมพ์'}}
let CT_KIND=(LS.get('jjck_ct_kind','')==='recipe')?'recipe':'item';
let CT_CAT=String(LS.get('jjck_ct_cat','')||'');
let CT_Q='';
const CT_DRAFT='jjck_ct_draft',CT_DRAFT_MS=12*3600*1000;
const CT_IC={'เนื้อสัตว์':'🥩','ผัก':'🥬','ของแห้ง':'🌾','เครื่องปรุง':'🧂','บรรจุภัณฑ์':'📦','อื่นๆ':'🧺','น้ำจิ้ม':'🥣','ของหมัก':'🍖','น้ำซุป':'🍲','ของหวาน':'🍰'};
const ctIcon=(kind,o)=>CT_IC[ctCatOf(o)]||(kind==='item'?'🥬':'🍲');
const ctObj=(kind,id)=>kind==='item'?itemById(id):recipeById(id);
const ctList=kind=>kind==='item'?activeItems():activeRecipes();
const ctCatOf=o=>String(o&&o.cat||'').trim()||'อื่นๆ';
const ctBase=(kind,o)=>kind==='item'?(o.unit||''):(o.yield_unit||'');
function ctUnit(kind,o){if(kind!=='item')return {u:o.yield_unit||'',f:1};const u=countUnitOf(o);return {u,f:unitFactor(o,u)||1};}   // หน่วยนับ + 1 หน่วยนับ = กี่หน่วยหลัก
function ctCounted(e){if(!e)return false;const s=String(e.v==null?'':e.v).replace(/,/g,'').trim();if(s==='')return false;const n=Number(s);return isFinite(n)&&n>=0;}
function ctTotal(e,o,kind){const f=(kind==='item'&&e.u)?(unitFactor(o,e.u)||ctUnit(kind,o).f):ctUnit(kind,o).f;return rnd4(num(e.v)*f);}   // → หน่วยหลัก
function ctCats(kind){const L=ctList(kind),c=(kind==='item'?ITEM_CATS:MENU_CATS).slice();L.forEach(o=>{const x=ctCatOf(o);if(!c.includes(x))c.push(x);});return c.filter(x=>L.some(o=>ctCatOf(o)===x));}
function ctCntOf(L,kind){return L.filter(o=>ctCounted(CT[kind+'|'+o.id])).length;}
function ctAny(){return Object.values(CT).some(ctCounted);}

/* ---------- ร่าง ---------- */
function ctDraftGet(){const d=LS.get(CT_DRAFT,null);if(!d||!d.e||d.d!==bizTodayISO()||Date.now()-num(d.t)>CT_DRAFT_MS){if(d)LS.del(CT_DRAFT);return null;}return d;}
function ctDraftSave(){const e={};Object.values(CT).forEach(x=>{if(ctCounted(x))e[x.kind+'|'+x.id]={v:String(x.v),u:x.u||''};});
  if(Object.keys(e).length)LS.set(CT_DRAFT,{t:Date.now(),d:bizTodayISO(),e});else LS.del(CT_DRAFT);}
function ctDraftClear(){LS.del(CT_DRAFT);}
function ctDraftRestore(){const d=ctDraftGet();if(!d)return 0;let n=0;
  Object.entries(d.e).forEach(([k,x])=>{const p=k.indexOf('|'),kind=k.slice(0,p),id=k.slice(p+1);if(!ctObj(kind,id))return;
    CT[k]={kind,id,v:String(x&&x.v!=null?x.v:''),u:(x&&x.u)||''};if(ctCounted(CT[k]))n++;else delete CT[k];});
  if(n)toast('📝 '+t('ct_draft',{n}));return n;}
function ctNormUnits(){ // หน่วยนับของสินค้าเปลี่ยนหลังพิมพ์ไปแล้ว → แปลงตัวเลขที่พิมพ์ไว้เป็นหน่วยใหม่
  Object.values(CT).forEach(e=>{if(e.kind!=='item'||!ctCounted(e)||!e.u)return;const o=itemById(e.id);if(!o)return;
    const U=ctUnit('item',o);if(e.u===U.u)return;const f0=unitFactor(o,e.u);if(f0)e.v=String(rnd4(num(e.v)*f0/U.f));e.u=U.u;});}

/* ---------- หน้า ---------- */
RENDER.count=function(el){
  if(!ctAny())ctDraftRestore();
  ctNormUnits();
  const kind=CT_KIND,cats=ctCats(kind);
  if(CT_CAT&&!cats.includes(CT_CAT))CT_CAT='';
  const nI=ctList('item'),nR=ctList('recipe');
  const pills=[{k:'item',lb:'🥬 '+t('ct_items'),n:ctCntOf(nI,'item')+'/'+nI.length},{k:'recipe',lb:'🍲 '+t('ct_recipes'),n:ctCntOf(nR,'recipe')+'/'+nR.length}];
  let h=dhead('📋 '+t('nav_count'),esc(dispDate(bizTodayISO())))+sqlNeedBox()+
    pillBar(pills,kind,k=>ctSetKind(k),{scroll:1,cls:'ctkind'})+   // closure เสมอ — ชื่อฟังก์ชันแบบสตริงทำให้เครื่องหมายคำพูดใน onclick ชนกัน
    (ctAny()?'':'<div class="note">'+esc(t('ct_hint'))+'</div>')+
    '<div id="ctChips">'+ctChipsHtml()+'</div>'+
    searchBox('ctQ',v=>ctFilter(v))+
    '<div id="ctGrid">'+ctGridHtml()+'</div><div class="card empty" id="ctNone" style="display:none">'+esc(t('ct_no_match'))+'</div>';
  el.innerHTML=h;const q=document.getElementById('ctQ');if(q)q.value=CT_Q;ctFilter(CT_Q);ctBar();ctMeta();
};
function ctChipsHtml(){const kind=CT_KIND,L=ctList(kind),cats=ctCats(kind);
  const chips=[{k:'',lb:t('all'),n:ctCntOf(L,kind)+'/'+L.length}].concat(cats.map(c=>{const M=L.filter(o=>ctCatOf(o)===c);return {k:c,lb:(CT_IC[c]||'🧺')+' '+trCat(c),n:ctCntOf(M,kind)+'/'+M.length};}));
  return pillBar(chips,CT_CAT,k=>ctSetCat(k),{scroll:1,cls:'ctchips'});}   // closure — หมวดเป็นภาษาไทย ใส่ใน onclick ตรง ๆ ไม่ได้
function ctGridHtml(){const kind=CT_KIND,L=ctList(kind),cats=ctCats(kind).filter(c=>!CT_CAT||c===CT_CAT);
  if(!L.length)return '<div class="card empty">'+esc(t('ct_none'))+'</div>';
  const byName=(a,b)=>dispName(a).localeCompare(dispName(b),'th');
  return cats.map(c=>{const M=L.filter(o=>ctCatOf(o)===c).sort(byName);
    return '<div class="ctsec" data-c="'+esc(c)+'"><div class="ctsech">'+(CT_IC[c]||'🧺')+' '+esc(trCat(c))+'<span class="sp">'+M.length+'</span></div><div class="igrid">'+M.map(o=>ctCard(kind,o)).join('')+'</div></div>';}).join('');}
function ctCard(kind,o){
  const k=kind+'|'+o.id,e=CT[k],counted=ctCounted(e),U=ctUnit(kind,o),base=ctBase(kind,o);
  return '<div class="icard skcard'+(counted?' cnt':'')+'" data-k="'+esc(k)+'" data-n="'+esc(supKey(dispName(o)+' '+o.name+' '+ctCatOf(o)))+'">'+
    '<div class="skhead">'+thumbHtml(o,ctIcon(kind,o),'ithumb')+'<div class="skttl">'+
    '<div class="iname">'+esc(dispName(o))+'</div>'+
    '<div class="isub">'+esc(t('ct_sys'))+' <b>'+fmtQ(rnd2(num(o.qty)/U.f))+'</b> '+esc(trUnit(U.u))+
      (U.u!==base?'<br><span class="xs">'+esc(t('ct_unit_eq',{u:trUnit(U.u),q:fmtQ(U.f),b:trUnit(base)}))+'</span>':'')+'</div></div></div>'+
    '<div class="skstep"><button type="button" aria-label="-" onclick="ctBump(this,-1)">−</button>'+
    '<input type="text" inputmode="decimal" placeholder="0" class="'+(counted?'has':'')+'" value="'+esc(counted?e.v:'')+'" oninput="ctInput(this)" onchange="ctInput(this)">'+
    '<button type="button" class="plus" aria-label="+" onclick="ctBump(this,1)">＋</button><span class="b ctu">'+esc(trUnit(U.u))+'</span></div>'+
    '<div class="skfoot"><span class="b cteq" style="color:var(--gold)">'+ctEqTxt(e,o,kind)+'</span>'+
    '<button type="button" class="outb'+(counted&&num(e.v)===0?' on':'')+'" onclick="ctZero(this)">'+esc(t('ct_out'))+'</button></div></div>';}
function ctEqTxt(e,o,kind){const U=ctUnit(kind,o),base=ctBase(kind,o);return (ctCounted(e)&&U.u!==base)?'= '+fmtQ(ctTotal(e,o,kind))+' '+esc(trUnit(base)):'';}
function ctCardOf(el){return el&&el.closest?el.closest('.skcard'):null;}
function ctInput(el){ // พิมพ์แล้วแก้ในที่ — การ์ดนี้ + ตัวนับ + ชิป + แถบล่าง (ไม่วาดหน้าใหม่ คีย์บอร์ดไม่หุบ)
  const card=ctCardOf(el);if(!card)return;const k=card.dataset.k,p=k.indexOf('|'),kind=k.slice(0,p),id=k.slice(p+1);
  const o=ctObj(kind,id);if(!o)return;
  const e=CT[k]||(CT[k]={kind,id,v:'',u:''});e.v=String(el.value==null?'':el.value);e.u=ctUnit(kind,o).u;
  const c=ctCounted(e);
  card.classList.toggle('cnt',c);el.classList.toggle('has',c);
  const ob=card.querySelector('.outb');if(ob)ob.classList.toggle('on',c&&num(e.v)===0);
  const eq=card.querySelector('.cteq');if(eq)eq.innerHTML=ctEqTxt(e,o,kind);
  if(!c)delete CT[k];
  ctDraftSave();ctMeta();}
function ctBump(btn,d){ // −/＋ ทีละ 1 หน่วยนับ (ไม่ต่ำกว่า 0)
  const card=ctCardOf(btn),inp=card&&card.querySelector('.skstep input');if(!inp)return;
  let v=rnd4(num(inp.value)+d);if(v<0)v=0;inp.value=String(v);ctInput(inp);}
function ctZero(btn){const card=ctCardOf(btn),inp=card&&card.querySelector('.skstep input');if(!inp)return;inp.value='0';ctInput(inp);}
function ctMeta(){ // ตัวนับทุกจุด (แถบล่าง · ปุ่มส่วน · ชิป) — แก้ในที่
  const kind=CT_KIND,L=ctList(kind),n=ctCntOf(L,kind);
  const v=document.getElementById('ctN');if(v)v.textContent=t('ct_counted',{a:n,b:L.length});
  const b=document.getElementById('ctGo');if(b)b.disabled=!ctAny();
  document.querySelectorAll('#view-count .ctkind .pill').forEach(x=>{const kk=x.dataset.k,M=ctList(kk);const s=x.querySelector('.bdg');if(s)s.textContent=ctCntOf(M,kk)+'/'+M.length;});
  document.querySelectorAll('#view-count .ctchips .pill').forEach(x=>{const c=x.dataset.k,M=c?L.filter(o=>ctCatOf(o)===c):L;const s=x.querySelector('.bdg');if(s)s.textContent=ctCntOf(M,kind)+'/'+M.length;});}
function ctBar(){if(S.tab!=='count')return;
  pinnedBar('<span class="v" id="ctN"></span><span class="ctacts"><button class="btn gh" onclick="ctCancel()">'+esc(t('cancel'))+'</button>'+
    '<button class="btn" id="ctGo" onclick="ctSummary()">'+esc(t('ct_save'))+'</button></span>');}
function ctPaint(){const el=document.getElementById('view-count');if(el&&S.tab==='count')RENDER.count(el);}
function ctSetKind(k){CT_KIND=k==='recipe'?'recipe':'item';LS.set('jjck_ct_kind',CT_KIND);CT_CAT='';LS.set('jjck_ct_cat','');ctPaint();}
function ctSetCat(k){CT_CAT=String(k||'');LS.set('jjck_ct_cat',CT_CAT);   // เปลี่ยนหมวดในที่ — ไม่เลื่อนหน้ากลับบนสุด
  const g=document.getElementById('ctGrid');if(g)g.innerHTML=ctGridHtml();
  document.querySelectorAll('#view-count .ctchips .pill').forEach(x=>x.classList.toggle('on',x.dataset.k===CT_CAT));ctFilter(CT_Q);}
function ctFilter(v){CT_Q=String(v==null?'':v);const q=supKey(CT_Q);let any=0;
  document.querySelectorAll('#view-count .ctsec').forEach(s=>{let n=0;
    s.querySelectorAll('.skcard').forEach(c=>{const ok=!q||String(c.dataset.n||'').indexOf(q)>=0;c.style.display=ok?'':'none';if(ok)n++;});
    s.style.display=n?'':'none';any+=n;});
  const e=document.getElementById('ctNone');if(e)e.style.display=any?'none':'';}
async function ctCancel(){if(ctAny()){const ok=await confirm2(t('ct_cancel_q'),{danger:true});if(!ok)return;}CT={};ctDraftClear();ctPaint();}

/* ---------- สรุป + ปรับยอด ---------- */
function ctRows(){ // ทุกรายการที่นับ → {kind,id,o,name,disp,u,f,base,count_qty,sys,cnt,delta}
  const out=[];Object.values(CT).forEach(e=>{if(!ctCounted(e))return;const o=ctObj(e.kind,e.id);if(!o)return;
    const U=ctUnit(e.kind,o),base=ctBase(e.kind,o),cnt=ctTotal(e,o,e.kind),sys=num(o.qty);let delta=rnd4(cnt-sys);if(Math.abs(delta)<1e-9)delta=0;
    out.push({kind:e.kind,id:e.id,o,name:o.name,disp:dispName(o),u:U.u,f:U.f,base,count_qty:num(e.v),sys,cnt,delta});});
  const ord=r=>r.kind==='item'?0:1;out.sort((a,b)=>ord(a)-ord(b)||a.disp.localeCompare(b.disp,'th'));return out;}
function ctSumTable(rows){ // ตารางเฉพาะที่ต่าง (หน่วยนับ + แปลงเป็นหน่วยหลักถ้าไม่ใช่หน่วยเดียวกัน)
  let h='<div class="twrap"><table class="t ctsum"><thead><tr><th>'+esc(t('name'))+'</th><th class="n">'+esc(t('ct_col_sys'))+'</th><th class="n">'+esc(t('ct_col_cnt'))+'</th><th class="n">'+esc(t('ct_col_diff'))+'</th></tr></thead><tbody>';
  let last='';rows.forEach(r=>{if(r.kind!==last){last=r.kind;h+='<tr class="ctk"><td colspan="4">'+(r.kind==='item'?'🥬 '+esc(t('ct_items')):'🍲 '+esc(t('ct_recipes')))+'</td></tr>';}
    const v=x=>fmtQ(rnd2(x/r.f)),diffU=r.u!==r.base;   // แสดงเป็นหน่วยนับ 2 ตำแหน่ง (ค่าจริงที่เก็บเป็นหน่วยหลักไม่ปัด)
    h+='<tr class="ctrow '+(r.delta>0?'pos':'neg')+'" data-k="'+esc(r.kind+'|'+r.id)+'"><td>'+esc(r.disp)+'<span class="xs">'+esc(trUnit(r.u))+'</span></td>'+
      '<td class="n">'+v(r.sys)+(diffU?'<span class="xs">'+fmtQ(r.sys)+' '+esc(trUnit(r.base))+'</span>':'')+'</td>'+
      '<td class="n">'+v(r.cnt)+(diffU?'<span class="xs">'+fmtQ(r.cnt)+' '+esc(trUnit(r.base))+'</span>':'')+'</td>'+
      '<td class="n d b">'+(r.delta>0?'+':'')+v(r.delta)+(diffU?'<span class="xs">'+(r.delta>0?'+':'')+fmtQ(r.delta)+' '+esc(trUnit(r.base))+'</span>':'')+'</td></tr>';});
  return h+'</tbody></table></div>';}
async function ctRefreshLive(){ // ยอดในระบบสดของทุกรายการที่นับ (อีกเครื่องอาจเพิ่งรับ/ทำ/ส่งระหว่างนับ) + แก้ "ในระบบ" บนการ์ดในที่
  const rows=ctRows();await refreshRows('item',rows.filter(r=>r.kind==='item').map(r=>r.id));await refreshRows('recipe',rows.filter(r=>r.kind==='recipe').map(r=>r.id));
  document.querySelectorAll('#view-count .skcard').forEach(card=>{const k=card.dataset.k||'',p=k.indexOf('|'),o=ctObj(k.slice(0,p),k.slice(p+1));if(!o)return;
    const U=ctUnit(k.slice(0,p),o),b=card.querySelector('.isub b');if(b)b.textContent=fmtQ(rnd2(num(o.qty)/U.f));});}
async function ctSummary(){
  if(!ctRows().length){toast(t('ct_none'),true);return;}
  await ctRefreshLive();const rows=ctRows();if(!rows.length)return;
  const diffs=rows.filter(r=>r.delta!==0);
  let h='<h3>📋 '+esc(t('ct_sum_t'))+'</h3>'+
    '<div class="row" style="margin-bottom:10px"><span class="chip mid">'+esc(t('ct_sum_n',{n:rows.length}))+'</span><span class="chip ok">'+esc(t('ct_sum_ok',{n:rows.length-diffs.length}))+'</span>'+
    '<span class="chip '+(diffs.length?'warn':'mid')+'">'+esc(t('ct_sum_diff',{n:diffs.length}))+'</span></div>';
  if(!diffs.length)h+='<div class="okbox">'+esc(t('ct_sum_none'))+'</div>';
  else h+='<div class="hintbox">'+esc(t('ct_sum_hint'))+'</div>'+ctSumTable(diffs);
  h+=sqlNeedBox()+fld(t('note'),'<input id="ctNote" maxlength="200" placeholder="'+esc(t('ct_note_ph'))+'">')+
    '<div class="row" style="margin-top:10px"><button class="btn gh" style="flex:1" onclick="closeModal()">'+esc(t('back'))+'</button>'+
    '<button class="btn ok" style="flex:1" id="ctApplyBtn" onclick="ctApply()">'+esc(diffs.length?t('ct_apply',{n:diffs.length}):t('ct_apply0'))+'</button></div>';
  openModal(h);}
async function ctApply(){await once(async()=>{
  if(!S.kcSql){toast(t('ct_sql_block'),true);return;}
  if(!ctRows().length)return;
  const btn=document.getElementById('ctApplyBtn');if(btn)btn.disabled=true;
  await ctRefreshLive();const rows=ctRows();   // ส่วนต่าง = นับได้ − ยอดสด ณ วินาทีที่ปรับ (ไม่ใช่ยอดตอนเปิดหน้า)
  const note=String((document.getElementById('ctNote')||{}).value||'').trim()||null,today=bizTodayISO(),by=(S.user&&S.user.name)||null;
  try{
    for(const kind of ['item','recipe']){const R=rows.filter(r=>r.kind===kind);if(!R.length)continue;
      const cid=uid('ct');let step='head';
      try{
        await db(()=>sb.from('kc_counts').insert({id:cid,d:today,kind,n:R.length,diff:R.filter(r=>r.delta!==0).length,note,by_name:by}));
        step='lines';await db(()=>sb.from('kc_count_lines').insert(R.map(r=>({count_id:cid,ref_id:r.id,name:r.name,sys_qty:rnd4(r.sys),counted_qty:rnd4(r.cnt),delta:rnd4(r.delta),unit:r.base,count_unit:r.u,count_qty:rnd4(r.count_qty)}))));
        step='moves';const mv=R.filter(r=>r.delta!==0).map(r=>{const c=kind==='item'?itemCost(r.o):recipeUnitCost(r.o);
          return {d:today,kind:'adjust',ref_kind:kind,ref_id:r.id,name:r.name,qty:r.delta,cost:c==null?null:rnd4(r.delta*c),ref_table:'kc_counts',ref_id2:cid,note:I18N.th.ct_move_note};});
        if(mv.length)await pushMoves(mv);
      }catch(e){ // บันทึกไม่ครบ = ถอนหัว/บรรทัด/สต๊อกของส่วนนี้ทิ้ง ไม่เหลือผลนับค้างทั้งที่สต๊อกไม่ขยับ (กดซ้ำได้ ไม่ซ้ำ)
        if(step==='moves')await pushMovesUndo('kc_counts',cid);
        if(step!=='head'){try{await sb.from('kc_count_lines').delete().eq('count_id',cid);}catch(_){}}
        try{await sb.from('kc_counts').delete().eq('id',cid);}catch(_){}
        toast(t('ct_not_saved')+' · '+((e&&e.message)||e),true);throw e;}
      R.forEach(r=>{delete CT[kind+'|'+r.id];});ctDraftSave();}   // ส่วนที่บันทึกแล้วหลุดจากร่าง — ส่วนถัดไปพลาดก็ไม่เขียนซ้ำ
  }catch(e){if(btn)btn.disabled=false;return;}
  CT={};ctDraftClear();closeModal();toast(t('ct_saved'));if(S.tab==='count')ctPaint();
});}

/* ---------- หน้าต่างผลนับ (โมดูลประวัติเรียก) ---------- */
async function ctDetail(id){
  let c=null,lines=[];
  try{c=await db(()=>sb.from('kc_counts').select('*').eq('id',id).maybeSingle());if(c)lines=await db(()=>sb.from('kc_count_lines').select('*').eq('count_id',id).order('id'));}catch(e){return;}
  if(!c){toast(t('ct_noread'),true);return;}
  const rows=lines.map(l=>{const f=num(l.count_qty)>0&&num(l.counted_qty)>0?num(l.counted_qty)/num(l.count_qty):(l.count_unit&&l.unit&&l.count_unit!==l.unit?null:1);
    return {disp:l.name||'',u:l.count_unit||l.unit||'',base:l.unit||'',f:f||1,sys:num(l.sys_qty),cnt:num(l.counted_qty),delta:num(l.delta),kind:c.kind};});
  const diffs=rows.filter(r=>Math.abs(r.delta)>1e-9);
  openModal('<h3>📋 '+esc(t('ct_detail_t'))+' · '+(c.kind==='recipe'?'🍲 '+esc(t('ct_recipes')):'🥬 '+esc(t('ct_items')))+'</h3>'+
    '<div class="sm mut" style="margin-bottom:8px">'+esc(dispDate(c.d))+(c.created_at?' '+esc(dispTime(c.created_at)):'')+(c.by_name?' · '+esc(t('ct_by'))+' '+esc(c.by_name):'')+'</div>'+
    '<div class="row" style="margin-bottom:10px"><span class="chip mid">'+esc(t('ct_lines_n',{n:fmtI(c.n)}))+'</span><span class="chip '+(num(c.diff)?'warn':'ok')+'">'+esc(t('ct_sum_diff',{n:fmtI(c.diff)}))+'</span></div>'+
    (c.note?'<div class="note">'+esc(c.note)+'</div>':'')+
    (diffs.length?ctSumTable(diffs):'<div class="okbox">'+esc(t('ct_sum_none'))+'</div>')+
    '<button class="btn gh big" style="margin-top:10px" onclick="closeModal()">'+esc(t('close'))+'</button>');}

/* ============================================================
   🚚 ส่งสาขา — send (sd*)
   ออเดอร์สาขา = stock_receipts ที่แอพนับสต๊อกเขียนตอนสาขากดสั่ง (sup = cfg.ck_sup_names **หรือ** ชื่อสินค้าตรงเมนูครัวกลาง `sdIsKitchenRow` · order_date ≥ วันนี้ − lookback)
   จัดกลุ่ม สาขา+วันสั่ง (เฉพาะสาขาที่เห็น = JJBR ∩ _br) · หักจำนวนที่ส่งไปแล้ว (kc_deliveries status≠void + lines ต่อสินค้า) → เหลือ = ค้างส่ง
   ชื่อสินค้าสาขา → เมนู ใช้ tdLinkOf()/TD_LINKS ของหน้าวันนี้ (kc_links → ชื่อตรงกัน) · ยังไม่ผูก = เลือกเมนูแล้วบันทึก kc_links
   ส่ง (ตั้งต้น = น้อยสุดของ ค้างส่ง/ของที่เหลือหลังจัดให้ใบสั่งก่อนหน้า) แก้ในที่ · ขาด → ⚡ ทำของ (หน้าทำของ ชิป ด่วน)
   ✅ ส่งแล้ว ออกบิล = kc_deliveries + kc_delivery_lines (ต้นทุน/ราคา ณ ตอนส่ง) → kc_moves 'send' + ck_add_qty (ห้ามส่งเกินสต๊อกสด)
     · ยอดสดอ่านไม่ได้ = ไม่ออกบิล (sd_live_fail) · หลังกดยืนยัน อ่านซ้ำทั้งยอดสด + ใบสั่ง/ที่ส่งแล้ว (อีกเครื่องอาจส่ง/ทำของ/สาขาแก้ยอดระหว่างหน้าต่างเปิด) ไม่ตรง = ไม่ออกบิล (sd_changed)
     · เลขบิลอ่านใหม่หลังหน้าต่าง · ชน (23505 — unique index ใน SQL) = อ่านเลขใหม่แล้วลองอีก ≤3 ครั้ง
   → ข้อความบิล (ไทยเสมอ) เข้ากลุ่มไลน์ของสาขา (cfg.branch_line) · ไม่มีกลุ่ม/ส่งไม่ได้ = กล่องคัดลอก + เปิดไลน์
   เขียนไม่ครบ = ถอนทั้งหมด (sdRollback) · ส่งบางส่วน = ที่เหลือยังขึ้น "ค้างส่ง" · setBadge('send', จำนวนใบสั่งที่ยังค้าง)
   ➕ ส่งเพิ่ม (เจ้าของสั่ง 2026-10-17 "ต้องมีปุ่ม เพิ่ม ด้วยเผื่อ สาขาเรียกของเพิ่มแล้วต้องใส่รายละเอียดเอง") — sdManual*:
     หัวหน้า 🚚 / กล่องว่าง → หน้าต่าง ① เลือกสาขา (S.branches ตามสิทธิ์ · ปุ่มสีสาขา) ② แตะรูปเมนู → ใส่จำนวน (หน่วย yield_unit ตั้งต้น 1)
     → กลุ่ม "✋ สาขาเรียกเพิ่ม" เป็นการ์ดใน SD.groups ต่อท้ายออเดอร์ปกติ (g.manual=true · key 'manual|<สาขา>|<วันนี้>' · บรรทัด rid 'manual|<สาขา>|<recipe_id>' pid '' link factor 1)
     · ร่าง localStorage jjck_sd_manual {d:วันนี้,g:{<สาขา>:[{recipe_id,qty}]}} เฉพาะวันเดียวกัน (รีเฟรชแล้วอยู่) · แก้จำนวนในที่ = แก้ร่าง (ส่ง = น้อยสุดของ จำนวน/ของที่เหลือ — ไม่พอ = ส่งเท่าที่มี ขาดขึ้นในบิล)
     · ✅ ส่งแล้ว ออกบิล ใช้ sdSend เส้นทางเดิมทุกขั้น (ยอดสดก่อน/หลังหน้าต่าง · เลขบิล · ถอนทั้งหมดถ้าพลาด) — head.order_date = วันนี้ · head.note = SD_MANUAL_NOTE (ไทยเสมอ) · บรรทัด stk_product_id null
       · ตรวจซ้ำหลังหน้าต่างเทียบกับร่างปัจจุบัน (ไม่ใช่ sdCalcGroups) · สำเร็จ = เหลือในร่างเฉพาะส่วนที่ส่งไม่ครบ (sdManualAfterBill — ขอ − ส่ง · ส่งครบ = เอาออก · ตรงกับบรรทัด "ค้างส่ง" ในบิลไลน์ · ผู้ตรวจ V2) · ข้อความไลน์มีบรรทัด "✋ สาขาเรียกของเพิ่ม" · 🧾 บิล/ยกเลิกบิล/ประวัติ เหมือนบิลปกติ

   ============================================================ */

/* ---------- อ่าน (fail-soft · ใช้ tdGet ของหน้าวันนี้) ---------- */
async function sdLoad(opt){ // opt.noRefresh = แค่นับใบสั่งค้าง (ป้าย 🚚 ตอนบูต) ไม่อ่านยอดสดของเมนู
  const quiet=!!(opt&&opt.noRefresh);
  if(SD.loading){await SD.loading;if(quiet||!SD.quiet)return;}   // โหลดแบบเงียบค้างอยู่ → รอแล้วอ่านยอดสดต่อ
  SD.quiet=quiet;
  SD.loading=(async()=>{
    const R=await sdRead();
    SD.ok=R.ok;SD.err=R.err;
    if(R.lk.ok)TD_LINKS=R.lk.rows;
    if(!SD.ok){SD.at=Date.now();return;}   // อ่านไม่ครบ (เช่น kc_delivery_lines) = ห้ามคิดจากข้อมูลครึ่ง ๆ — ใบที่ส่งไปแล้วจะกลับมาให้ส่งซ้ำ · คงผลรอบที่อ่านได้ล่าสุด (ป้าย 🚚) ไว้
    SD.raw=R.raw;
    const rids=[...new Set(R.raw.sr.map(r=>{const l=tdLinkOf(r.name);return l&&l.recipe_id;}).filter(Boolean))];
    if(rids.length&&!quiet)await refreshRows('recipe',rids);   // "มี" = ยอดสด (อีกเครื่องอาจเพิ่งทำของ/ส่ง)
    SD.at=Date.now();sdCalc();
  })();
  try{await SD.loading;}finally{SD.loading=null;}
}
async function sdRead(){ // อ่านชุดข้อมูลออเดอร์ (ไม่แตะ SD) → {ok,err,raw:{sr,dl,dll},lk} · sdLoad ใช้ตอนโหลด · sdSend ใช้อ่านซ้ำหลังกดยืนยัน
  const td=bizTodayISO(),cfg=S.cfg||CFG_DEF,from=addDays(td,-num(cfg.order_lookback_days));
  const [sr,lk,dl]=await Promise.all([
    tdGet('stock_receipts',q=>q.gte('order_date',from).gt('ordered',0).order('order_date').order('product_id')),   // ตารางจริงไม่มีคอลัมน์ id (คีย์ = สาขา+สินค้า+วันสั่ง)
    tdGet('kc_links'),
    tdGet('kc_deliveries',q=>q.gte('order_date',from).neq('status','void'))]);
  sdTblGone(dl);
  let dll={ok:true,rows:[]};
  if(dl.ok&&dl.rows.length)dll=await tdGet('kc_delivery_lines',q=>q.in('delivery_id',dl.rows.map(d=>d.id)));
  sdTblGone(dll);
  const ok=sr.ok&&dl.ok&&dll.ok;
  return {ok,err:ok?null:String(((sr.err||dl.err||dll.err)||{}).message||''),raw:{sr:sr.rows,dl:dl.rows,dll:dll.rows},lk};}
function sdTblGone(x){ // ยังไม่รัน SQL (S.kcSql=false) + ตารางไม่มีจริง = ยังไม่เคยส่งอะไร → ถือว่าว่าง (ออกบิลถูกกันด้วย sd_sql_block อยู่แล้ว) · permission denied/อ่านพลาด ≠ ตารางไม่มี
  if(x.ok||S.kcSql)return;const e=x.err||{},c=String(e.code||''),m=String(e.message||e||'');
  if(c==='42P01'||c==='PGRST205'||/does not exist|could not find the table/i.test(m)){x.ok=true;x.rows=[];x.gone=true;}}
function sdIsKitchenRow(r,names){ // แถว stock_receipts เป็นออเดอร์ครัวกลางไหม — ซัพตรง ck_sup_names **หรือ** ชื่อสินค้าตรงกับเมนูครัวกลาง (kc_links / ชื่อเมนู / stock_name)
  // เจ้าของ 2026-10-17: "จริงๆ ก็จะมีเฉพาะเมนูในระบบครัวกลางนี่และ ชื่อเหมือนกัน" → ไม่ต้องให้สาขาติ๊ก/ตั้งชื่อซัพให้ตรง · ชื่อตรงเมนู = ของครัวกลางเสมอ
  names=names||((S.cfg||CFG_DEF).ck_sup_names||[]).map(supKey);
  return names.includes(supKey(r.sup))||!!tdLinkOf(r.name);}
function sdCalcGroups(R,branches){ // ฟังก์ชันล้วน — ☀️ วันนี้ · 🍳 ทำของ · 🚚 ส่งสาขา ใช้ตัวคิดเดียวกัน ตัวเลขจึงตรงกันทุกหน้า
  // {sr,dl,dll} + สาขาที่นับ → {groups:[{key,code,name,short,color,od,lines:[{rid,pid,name,unit,ordered,already,remaining,link,have:0,sent:0}],unlinked}] (เฉพาะที่ยังค้างส่ง · วันสั่งเก่าก่อน),
  //  ordered:{rid:Σสั่ง×f} · sent:{rid:Σส่งแล้ว×f (ไม่เกินที่สั่ง)} · need:{rid:Σค้างส่ง×f} (= ordered−sent) · unlinked:[ชื่อสินค้าสาขาที่ยังไม่ผูก] · lines:จำนวนบรรทัดค้าง
  // ส่งแล้วหักรายบรรทัด (kc_delivery_lines ต่อ สาขา|วันสั่ง|ไอดีสินค้าสาขา · แถวเก่าไม่มีไอดี = ต่อชื่อ) → ส่งบางส่วน = ที่เหลือยังค้าง
  const names=((S.cfg||CFG_DEF).ck_sup_names||[]).map(supKey);
  const byStk={};(branches||[]).forEach(b=>{if(b.stk)byStk[String(b.stk)]=b;});
  const dById={};(R.dl||[]).forEach(d=>{if(d.status!=='void'&&!sdIsManual(d))dById[String(d.id)]=d;});   // บิล ➕ ส่งเพิ่ม (note = SD_MANUAL_NOTE) ไม่ใช่ของที่สั่งไว้ — ไม่หักออกจากออเดอร์ (ร่างเรียกเพิ่มก็ไม่อยู่ในผลนี้: ☀️/🍳 ไม่นับ)
  const byId={},byName={};
  (R.dll||[]).forEach(l=>{const d=dById[String(l.delivery_id)];if(!d)return;const k0=d.branch+'|'+String(d.order_date||'').slice(0,10),q=num(l.sent);
    if(l.stk_product_id)byId[k0+'|'+l.stk_product_id]=num(byId[k0+'|'+l.stk_product_id])+q;else byName[k0+'|'+supKey(l.name)]=num(byName[k0+'|'+supKey(l.name)])+q;});
  const groups={},ordered={},sent={},need={},unlinked=[];
  (R.sr||[]).forEach(r=>{if(!sdIsKitchenRow(r,names))return;const b=byStk[String(r.branch_id)];if(!b||!(num(r.ordered)>0))return;
    const od=String(r.order_date||'').slice(0,10),k0=b.code+'|'+od,link=tdLinkOf(r.name),rec=link&&recipeById(link.recipe_id);
    let already=num(byId[k0+'|'+r.product_id])+num(byName[k0+'|'+supKey(r.name)]);
    if(rec&&supKey(rec.name)!==supKey(r.name))already+=num(byName[k0+'|'+supKey(rec.name)]);
    already=rnd4(already);const remaining=rnd4(num(r.ordered)-already);
    if(link){const rid=link.recipe_id,f=num(link.factor)||1;ordered[rid]=rnd4(num(ordered[rid])+num(r.ordered)*f);
      if(already>0)sent[rid]=rnd4(num(sent[rid])+Math.min(already,num(r.ordered))*f);
      if(remaining>1e-9)need[rid]=rnd4(num(need[rid])+remaining*f);}
    if(remaining<=1e-9)return;
    const g=groups[k0]=groups[k0]||{key:k0,code:b.code,name:b.name,short:b.short||b.name,color:b.color||'',od,lines:[],unlinked:0};
    if(!link){g.unlinked++;if(!unlinked.includes(r.name))unlinked.push(r.name);}
    g.lines.push({rid:String(r.branch_id)+'|'+String(r.order_date)+'|'+String(r.product_id==null?'':r.product_id),pid:r.product_id==null?'':String(r.product_id),cat:String(r.cat_label||''),name:String(r.name||''),unit:String(r.unit||''),ordered:num(r.ordered),already,remaining,link,have:0,sent:0});});
  const ord={};(branches||[]).forEach((b,i)=>{ord[b.code]=i;});
  const G=Object.values(groups).sort((a,b)=>a.od<b.od?-1:a.od>b.od?1:(num(ord[a.code])-num(ord[b.code])));
  G.forEach(g=>g.lines.sort((a,b)=>String(a.cat).localeCompare(String(b.cat),'th')||String(a.name).localeCompare(String(b.name),'th')||String(a.pid).localeCompare(String(b.pid))));   // เรียงแบบใบสั่งของสาขา: หมวด → ชื่อ (ตารางจริงไม่มี id ให้เรียงตามลำดับที่สั่ง)
  return {groups:G,ordered,sent,need,unlinked,lines:G.reduce((a,g)=>a+g.lines.length,0)};}
function sdCalc(){ // SD.raw → SD.groups (sdCalcGroups) + จัดสรรของที่มีตามลำดับ: ใบสั่งเก่าก่อน · ใบหลังได้ที่เหลือ · ป้าย 🚚 = จำนวนใบสั่งที่ยังค้าง
  if(!SD.raw)return;   // ยังไม่เคยอ่านครบ = ไม่มีอะไรให้คิด (ป้าย 🚚 คงเดิม)
  const G0=sdCalcGroups(SD.raw,S.branches).groups,G=G0.concat(sdManualGroups());   // ➕ ส่งเพิ่ม ต่อท้ายออเดอร์ปกติ — ได้ของที่เหลือหลังจัดให้ใบสั่งก่อน
  const left={};
  G.forEach(g=>{g.lines.forEach(l=>{if(!l.link)return;
      const rid=l.link.recipe_id,r=recipeById(rid),f=num(l.link.factor)||1;
      if(!(rid in left))left[rid]=Math.max(0,num(r&&r.qty));
      l.have=rnd4(left[rid]/f);
      const ek=g.key+'|'+l.pid,ed=g.manual?null:SD_EDIT[ek];   // เรียกเพิ่ม: จำนวนในร่างคือที่ขอ · ส่ง = เท่าที่มี (ไม่พอ = ขาด ขึ้นในบิล)
      l.sent=ed!=null?Math.min(l.remaining,Math.max(0,num(ed))):Math.min(l.remaining,l.have);
      l.noPrice=sdPriceOf(l)==null;if(l.noPrice)l.sent=0;   // ไม่มีราคา = ส่งไม่ได้ (บิล ฿0 คิดเงินสาขาขาด — กติกาเจ้าของ: ราคา = ต้นทุนจริงของล็อต)
      left[rid]=Math.max(0,rnd4(left[rid]-l.sent*f));});});
  SD.groups=G;setBadge('send',G0.length);   // ป้าย 🚚 = ใบสั่งจากแอพนับสต๊อกเท่านั้น (ตรงกับการ์ด ☀️ วันนี้ — ร่างเรียกเพิ่มอยู่แค่เครื่องนี้)
}
const sdFactor=l=>num(l.link&&l.link.factor)||1;
function sdBrColor(code,c){c=String(c||(typeof JJBR!=='undefined'&&typeof JJBR.color==='function'?JJBR.color(code):'')||'');return /^#[0-9a-fA-F]{3,8}$/.test(c)?c:'#6B0F12';}   // สีสาขาจากทะเบียนกลาง (ไม่มี = ไวน์)
function sdPriceOf(l){const r=l.link&&recipeById(l.link.recipe_id);const p=sellPrice(r);if(p==null)return null;const v=p*sdFactor(l);return v>=1?rnd2(v):rnd4(v);}   // ราคาขาย/หน่วยของสาขา (≥฿1 ปัด 2 ตำแหน่งเหมือนที่พิมพ์ในบิล → จำนวน × ราคา = เป็นเงิน พอดี)
function sdCostOf(l){const r=l.link&&recipeById(l.link.recipe_id);const c=recipeUnitCost(r);return c==null?null:rnd4(c*sdFactor(l));}
function sdGroupTotal(g){return rnd2(g.lines.reduce((a,l)=>a+(l.link?rnd2(num(l.sent)*num(sdPriceOf(l))):0),0));}

/* ---------- วาด ---------- */
function sdWhyEmpty(){ // ไม่มีการ์ด = บอกสาเหตุจากข้อมูลที่อ่านมา (เจ้าของ 2026-10-17: "ของที่จะส่งพรุ่งนี้ยังไม่เห็นมีเลย" — เดิมหายเงียบ)
  const sr=(SD.raw&&SD.raw.sr)||[],cfg=S.cfg||CFG_DEF,byStk={};(S.branches||[]).forEach(b=>{if(b.stk)byStk[String(b.stk)]=b;});
  const rows=sr.filter(r=>num(r.ordered)>0&&byStk[String(r.branch_id)]);
  if(!rows.length)return '<div class="sd-why warn">'+esc(t('sd_why_zero',{d:cfg.order_lookback_days}))+'</div>';
  const other=rows.filter(r=>!sdIsKitchenRow(r));
  if(!other.length)return '';   // มีออเดอร์แต่ส่งครบแล้ว = "ไม่มีออเดอร์ค้าง" ตามปกติ
  const sups=[...new Set(other.map(r=>String(r.sup||'—').trim()))].slice(0,5),nm=[...new Set(other.map(r=>String(r.name||'').trim()).filter(Boolean))].slice(0,6);
  return '<div class="sd-why">'+esc(t('sd_why_other',{n:other.length,s:sups.join(', '),p:nm.join(' · ')+(other.length>nm.length?' …':'')}))+'</div>';}
function sdPaint(){
  const b=document.getElementById('sdBody');if(!b)return;
  if(!SD.ok){b.innerHTML='<div class="badbox">⚠ '+esc(t('sd_noread'))+(SD.err?' · '+esc(SD.err):'')+'<div class="xs" style="margin-top:4px">'+esc(t('sd_noread_h'))+'</div></div>'+
    '<button type="button" class="btn gh" onclick="sdReload()">'+esc(t('sd_reload'))+'</button>';return;}
  if(!SD.groups.length){const cfg=S.cfg||CFG_DEF;b.innerHTML='<div class="card"><div class="empty">'+esc(t('sd_none'))+'<div class="xs mut" style="margin-top:6px">'+esc(t('sd_none_h',{s:cfg.ck_sup_names.join(', '),d:cfg.order_lookback_days}))+'</div>'+sdWhyEmpty()+
    (canKitchen()?'<div class="sd-empty-add"><button type="button" class="btn sd-madd" onclick="sdManualOpen()">'+esc(t('sd_m_btn'))+'</button><div class="xs mut">'+esc(t('sd_m_empty_h'))+'</div></div>':'')+'</div></div>';return;}
  b.innerHTML=SD.groups.map((g,gi)=>sdCardHtml(g,gi)).join('');
}
function sdCardHtml(g,gi){
  const td=bizTodayISO(),partial=g.lines.some(l=>l.already>0),linked=g.lines.filter(l=>l.link&&!l.noPrice).length,anyLink=g.lines.some(l=>l.link);
  const mZero=sdManualZero(g);
  let h='<div class="card sd-card'+(g.manual?' sd-manual':'')+'" id="sdG'+gi+'" data-key="'+esc(g.key)+'"><h3><span class="sd-dot" style="background:'+esc(sdBrColor(g.code,g.color))+'"></span>'+esc(g.short||g.name)+
    '<span class="sp">'+(g.manual?'<span class="chip warn sd-mchip">'+esc(t('sd_m_chip'))+'</span>':'')+'<span class="chip '+(g.od===td?'blue':'warn')+'">'+esc(g.od===td?t('today'):t('sd_order_d',{d:dispDate(g.od)}))+'</span>'+(partial?'<span class="chip warn">⏳ '+esc(t('sd_partial'))+'</span>':'')+'</span></h3>';
  h+=g.lines.map((l,li)=>sdLineHtml(gi,l,li,li===g.lines.length-1)).join('');
  h+='<div class="sd-foot"><div class="sd-tot"><span class="mut sm">'+esc(t('sd_lines_n',{n:g.lines.length}))+'</span><b id="sdTot'+gi+'">'+esc(money(sdGroupTotal(g)))+'</b></div>'+
    (linked?(mZero?'<span class="chip bad">'+esc(t('sd_m_nothing_s'))+'</span><button type="button" class="btn gh sm2" onclick="sdMake()">'+esc(t('sd_make'))+'</button>':'<button type="button" class="btn big sd-go" id="sdGo'+gi+'" onclick="sdSend('+gi+')">'+esc(t('sd_go'))+'</button>'):anyLink?'<span class="chip bad">⛔ '+esc(t('no_price'))+'</span>':'<span class="chip warn">🔗 '+esc(t('sd_link_first'))+'</span>')+
    (g.manual?'<button type="button" class="btn gh sm2 sd-drop" style="color:var(--bad)" onclick="sdManualDrop('+gi+')">'+esc(t('sd_m_drop'))+'</button>':'')+'</div></div>';
  return h;}
function sdLineHtml(gi,l,li,last){
  const id=gi+'_'+li,u=trUnit(l.unit),g=SD.groups[gi];
  if(g&&g.manual)return sdManualLineHtml(gi,l,li,last);
  let h='<div class="sdl'+(last?' last':'')+'" id="sdL'+id+'"><div class="sdl-top"><b class="sdl-name">'+esc(l.name)+'</b>'+(l.already>0?'<span class="xs mut">⏳ '+esc(t('sd_partial_h',{q:fmtQ(l.already),u}))+'</span>':'')+'</div>';
  if(!l.link){h+='<div class="sdl-stats"><span>'+esc(t('sd_ordered'))+' <b>'+fmtQ(l.remaining)+' '+esc(u)+'</b></span></div>'+
    '<button type="button" class="btn gh sm2 sd-link" onclick="sdLinkPick('+gi+','+li+')">🔗 '+esc(t('sd_unlinked'))+' ›</button>';return h+'</div>';}
  const p=sdPriceOf(l);
  h+='<div class="sdl-stats"><span>'+esc(t('sd_ordered'))+' <b>'+fmtQ(l.remaining)+' '+esc(u)+'</b></span><span>'+esc(t('sd_have'))+' <b id="sdHv'+id+'" class="'+(l.have>=l.remaining?'green':'red')+'">'+fmtQ(l.have)+'</b></span>'+
    (p==null?'<span class="chip warn">'+esc(t('no_price'))+'</span>':'<span>'+esc(moneyU(p))+'/'+esc(u)+'</span>')+'</div>'+
    (l.noPrice?'<div class="sdl-send"><span class="chip bad">⛔ '+esc(t('sd_no_price_h'))+'</span><button type="button" class="btn gh sm2" onclick="show(\'menus\')">📖 '+esc(t('nav_menus'))+'</button></div>':
    '<div class="sdl-send"><span class="sdl-lb">'+esc(t('sd_send'))+'</span>'+stepper('sdS'+id,l.sent,{step:1,min:0,max:l.remaining,unit:l.unit,on:(v)=>sdSetSent(gi,li,v)})+'</div>')+
    '<div class="sdl-short" id="sdSh'+id+'">'+sdShortHtml(l)+'</div>';
  return h+'</div>';}
function sdShortHtml(l,noMk){const sh=Math.max(0,rnd4(l.remaining-num(l.sent)));if(sh<=1e-9)return '<span class="chip ok">✓ '+esc(t('sd_full'))+'</span>';   // noMk = การ์ด ✋ ที่ท้ายการ์ดมี ⚡ อยู่แล้ว (ไม่ขึ้นซ้ำ 2 ปุ่ม — ผู้ตรวจรอบ 2)
  return '<span class="chip bad">'+esc(t('sd_short'))+' '+fmtQ(sh)+' '+esc(trUnit(l.unit))+'</span>'+(l.have<l.remaining-1e-9&&!noMk?'<button type="button" class="btn gh sm2 sd-mk" onclick="sdMake()">'+esc(t('sd_make'))+'</button>':'');}
function sdManualZero(g){return !!g&&!!g.manual&&g.lines.some(l=>l.link&&!l.noPrice)&&!g.lines.some(l=>l.link&&!l.noPrice&&num(l.sent)>0);}   // เรียกเพิ่มแต่ของถูกจัดให้ใบสั่งสาขาหมดแล้ว = ท้ายการ์ดบอกตรง ๆ + ⚡ แทนปุ่ม ✅ (ผู้ตรวจ V1)
function sdSetSent(gi,li,v){ // แก้จำนวนส่งในที่ (ไม่วาดใหม่ — คีย์บอร์ดไม่หุบ) · เกินที่สั่ง = ตัดเหลือเท่าที่สั่ง
  const g=SD.groups[gi],l=g&&g.lines[li];if(!l||!l.link||l.noPrice)return;
  let q=Math.max(0,rnd4(numIn(v)));   // "1,5" = 1.5 (numIn)
  if(q>l.remaining+1e-9){q=l.remaining;toast(t('sd_max_order',{q:fmtQ(l.remaining),u:trUnit(l.unit)}),'warn');const inp=document.getElementById('sdS'+gi+'_'+li);if(inp)inp.value=q;}
  SD_EDIT[g.key+'|'+l.pid]=q;sdCalc();sdRefresh();}
function sdRefresh(){ // ตัวเลข มี/ขาด/รวม ของทุกบรรทัดตามการจัดสรรใหม่ (ช่องที่กำลังพิมพ์ไม่แตะ)
  SD.groups.forEach((g,gi)=>{g.lines.forEach((l,li)=>{if(!l.link)return;const id=gi+'_'+li,want=g.manual?l.ordered:l.sent;   // ช่องของบรรทัดเรียกเพิ่ม = จำนวนที่ขอ (ร่าง) ไม่ใช่ที่ส่งได้
    const hv=document.getElementById('sdHv'+id);if(hv){hv.textContent=fmtQ(l.have);hv.className=l.have>=l.remaining?'green':'red';}
    const inp=document.getElementById('sdS'+id);if(inp&&document.activeElement!==inp&&num(inp.value)!==num(want))inp.value=want;
    const sh=document.getElementById('sdSh'+id);if(sh)sh.innerHTML=sdShortHtml(l,sdManualZero(g));});
    const tt=document.getElementById('sdTot'+gi);if(tt)tt.textContent=money(sdGroupTotal(g));});}
function sdMake(){if(typeof mkSetPill==='function')mkSetPill('urgent');show('make');}

/* ---------- ผูกชื่อสินค้าสาขา ↔ เมนู (kc_links) ---------- */

    '<div class="sd-pick" id="sdLkList">'+list('')+'</div><div class="row" style="margin-top:10px"><button type="button" class="btn gh" style="margin-left:auto" onclick="closeModal()">'+esc(t('cancel'))+'</button></div>');

async function sdLinkGo(rid){await once(async()=>{
