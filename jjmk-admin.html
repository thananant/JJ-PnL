<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120E0C; --bg2:#1A1411; --card:#211A16; --card2:#2B221D; --line:#3A2E27; --line2:#4E3E34;
  --red:#A31B24; --red2:#C72A34;
  --gold:#D9A441; --gold2:#F2CF7A; --goldDim:#A98338;
  --ink:#F4EADB; --ink2:#CBBBA7; --mut:#8E7F70;
  --ok:#4CC38A; --bad:#EA4C55; --warn:#E09B3A;
  --fd:'Prompt','Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --fb:'Sarabun','Prompt','Noto Sans Thai',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--fb);color:var(--ink);background:var(--bg);min-height:100vh;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 60px}

header.top{
  position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1A1411,#150F0D);
  border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px;
}
.top .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0}
.brand{font-family:var(--fd);font-weight:700;font-size:17px;color:var(--gold2);display:flex;align-items:center;gap:8px}
.blogo{border-radius:9px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.who{margin-left:auto;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.who b{color:var(--gold2)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{
  font-family:var(--fd);font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;
}
.tabs button.on{background:linear-gradient(145deg,var(--red2),#6E1016);border-color:var(--goldDim);color:#fff;font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--gold2);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{font-size:12.5px;color:var(--mut);line-height:1.6;margin-bottom:12px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-family:var(--fd);font-weight:600;font-size:12px;color:var(--goldDim);white-space:nowrap}
tr:last-child td{border-bottom:none}
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.btn{font-family:var(--fd);font-size:13px;font-weight:500;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(145deg,var(--red2),#6E1016);border-color:var(--goldDim);color:#fff;font-weight:600}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

input,select{font-family:var(--fb);font-size:13.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--line2);background:#181310;color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--gold)}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;font-family:var(--fd);font-weight:500}

.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);background:#1B1512;color:var(--ink2);white-space:nowrap}
.chip.ok{border-color:#2E6B4E;background:#16301F;color:#8BE0B4}
.chip.adm{border-color:var(--goldDim);background:#2A2012;color:var(--gold2)}
.chip.off{border-color:#5A2A2E;background:#2A1416;color:#F2A0A5}

/* ช่องเลือกในตาราง — หน้าตาเหมือนป้าย แต่กดเปลี่ยนได้เลย */
.inlinesel{
  width:auto;min-width:120px;font-size:12px;padding:5px 26px 5px 10px;border-radius:99px;
  border:1px solid var(--line2);background:#1B1512;color:var(--ink2);cursor:pointer;
}
.inlinesel:hover{border-color:var(--gold);color:var(--ink)}
.inlinesel.adm{border-color:var(--goldDim);background:#2A2012;color:var(--gold2)}
.inlinesel:disabled{opacity:.5;cursor:wait}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

/* ตารางสิทธิ์ */
.appbox{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--bg2)}
.apphead{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;background:var(--card2)}
.apphead .ic{font-size:19px}
.apphead .nm{font-family:var(--fd);font-weight:600;font-size:14px}
.apphead .cnt{margin-left:auto;font-size:11.5px;color:var(--mut)}
.apphead .arw{color:var(--mut);font-size:12px;transition:transform .15s}
.appbox.open .apphead .arw{transform:rotate(90deg)}
.appbody{display:none;padding:4px 13px 13px}
.appbox.open .appbody{display:block}

.prow{display:grid;grid-template-columns:1fr repeat(5,42px);gap:4px;align-items:center;padding:5px 0;border-bottom:1px solid #2A211C}
.prow:last-child{border-bottom:none}
.prow.hd{font-family:var(--fd);font-size:10.5px;font-weight:600;color:var(--goldDim);border-bottom:1px solid var(--line);padding-bottom:7px;position:sticky;top:0;background:var(--bg2)}
.prow .nm{font-size:12.5px}
.prow .cc{text-align:center}
.prow input[type=checkbox]{width:17px;height:17px;accent-color:var(--gold);cursor:pointer}
.prow input[type=radio]{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}

/* แถวเลือกคนในหน้าต่าง "คัดลอกสิทธิ์" — คนละโครงกับ .prow (ที่เป็นตารางติ๊กสิทธิ์ 6 คอลัมน์) */
.pickrow{
  display:flex;align-items:center;gap:12px;
  padding:10px 2px;border-bottom:1px solid #2A211C;
}
.pickrow:last-child{border-bottom:none}
.pickrow .pwho{flex:1;min-width:0;display:block;margin:0}   /* ชื่อคลาสต้องไม่ใช่ .who — ชนกับแถบผู้ใช้ด้านบนที่มี margin-left:auto */
.pickrow .nm2{font-family:var(--fd);font-weight:600;font-size:13.5px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pickrow .apps{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pickrow .btn{flex:none;white-space:nowrap}
@media(max-width:560px){
  .pickrow{flex-direction:column;align-items:stretch;gap:8px}
  .pickrow .btn{width:100%}
}

.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.brscope{margin-top:10px;padding:9px 11px;border:1px dashed #4A3B31;border-radius:10px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.brscope .bst{flex-basis:100%;font-size:12.5px;color:var(--ink2)}
.brscope label{display:inline-flex;align-items:center;gap:5px;font-size:14px;cursor:pointer}
.brscope input{width:18px;height:18px}

/* ตัวกรองรายชื่อผู้ใช้ (แท็บ ผู้ใช้ & สิทธิ์) */
.ufbar{display:grid;grid-template-columns:minmax(170px,1.5fr) repeat(4,minmax(118px,1fr)) auto;gap:8px;align-items:center;margin:2px 0 12px}
.ufbar .on{border-color:var(--gold);background:#2A2012;color:var(--gold2)}
.ufbar .btn{white-space:nowrap}
@media(max-width:900px){.ufbar{grid-template-columns:1fr 1fr}.ufbar #ufQ,.ufbar .btn{grid-column:1/-1}}
@media(max-width:700px){.ufbar input,.ufbar select{font-size:16px}.ufbar .btn{min-height:44px}}
.quick button{font-size:11.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);background:#1B1512;color:var(--ink2);cursor:pointer;font-family:var(--fd)}
.quick button:hover{border-color:var(--gold);color:var(--gold2)}

/* modal */
#ov{position:fixed;inset:0;background:rgba(8,5,4,.78);z-index:50;display:none;align-items:center;justify-content:center;padding:20px 12px;overflow-y:auto}
#ov.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:18px;
  max-width:760px;width:100%;margin:auto;max-height:calc(100dvh - 40px);
  display:flex;flex-direction:column;overflow:hidden}
.modal>*{flex:none}
.modal .scrollarea{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
@media(max-width:560px){ .modal{padding:14px;border-radius:14px} }
.modal h3{font-family:var(--fd);font-size:16px;color:var(--gold2);margin-bottom:12px}
.mbtn{display:flex;gap:9px;margin-top:16px}
.mbtn .btn:last-child{margin-left:auto}

/* login */
#login{position:fixed;inset:0;background:linear-gradient(180deg,#7E1013,#2A0608);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
#login.on{display:flex}
.lgc{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:22px;max-width:340px;width:100%;text-align:center}
.lgc h2{font-family:var(--fd);font-size:18px;color:var(--gold2);margin-bottom:5px}
.lgc p{font-size:12.5px;color:var(--mut);margin-bottom:16px}
.lgc input{margin-bottom:10px;text-align:center}
#lgMsg{font-size:12.5px;color:#FF9AA0;min-height:18px;margin-top:8px}

.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:13px;line-height:1.7}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);background:#2B221D;border:1px solid var(--goldDim);color:var(--ink);padding:11px 20px;border-radius:11px;font-size:13.5px;z-index:90;transition:transform .25s;box-shadow:0 8px 26px rgba(0,0,0,.5);max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast:empty{opacity:0;pointer-events:none}   /* ว่าง = ไม่ต้องโผล่ (เห็นตอนถ่ายภาพทั้งหน้า) */
#toast.err{border-color:var(--bad);color:#FFC9CC}
.spin{width:26px;height:26px;border:3px solid var(--line2);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
a.back{color:var(--ink2);text-decoration:none;font-size:12.5px}
a.back:hover{color:var(--gold2)}
</style>
<style>
/* ===== มือถือ (เจ้าของแจ้ง 2026-09-29: "ขนาดแปลก เวลาเปิดในโทรศัพท์") =====
   1) เปิดจากไอคอนบนหน้าจอโฮม: index.html ตั้งแถบสถานะแบบโปร่ง (black-translucent) ทั้งแอพ
      -> หัวของหน้านี้ต้องเว้นที่ให้แถบสถานะ iPhone ไม่งั้นนาฬิกา/สัญญาณทับชื่อแอพ
   2) ตาราง class="mc" = จอแคบกลายเป็นการ์ดต่อแถว (ป้ายชื่อคอลัมน์ติดให้เองด้วย mcLabel())
      ตาราง class="mx" (ตารางสรุปสิทธิ์) = ยังเป็นตาราง เลื่อนแนวนอนได้ คอลัมน์ชื่อค้างไว้ซ้ายสุด */
header.top{padding-top:calc(12px + env(safe-area-inset-top))}
@media(max-width:700px){
  header.top{position:static;padding-bottom:10px;margin-bottom:12px}
  .top .wrap{flex-wrap:wrap;row-gap:8px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .brand{font-size:16px}
  .brand small{display:none}
  .who{margin-left:0;width:100%;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;font-size:13px}
  .who a.back{white-space:nowrap;font-size:13px}
  /* แถบแท็บค้างไว้บนสุดตอนเลื่อน (กติกามือถือใน CLAUDE.md) — ใต้แถบสถานะ iPhone พอดี */
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    margin:0 -14px 14px;padding:6px 14px 8px;position:sticky;top:env(safe-area-inset-top);z-index:15;
    background:var(--bg);box-shadow:0 6px 10px -8px rgba(0,0,0,.7)}
  /* พื้นทึบหลังแถบสถานะ iPhone — เลื่อนหน้าแล้วเนื้อหาไม่โผล่ไปใต้นาฬิกา/สัญญาณ */
  body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);
    background:var(--bg);z-index:30;pointer-events:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;min-height:44px}
  .card{padding:13px}
  .btn{min-height:40px}
  /* ช่องกรอก/ช่องเลือกทุกช่อง (รวมในหน้าต่างเด้ง) ต้อง 16px ขึ้นไป ไม่งั้น iPhone ซูมหน้าเองตอนแตะ */
  #main input:not([type=checkbox]):not([type=radio]),#main select,#main textarea,
  #modal input:not([type=checkbox]):not([type=radio]),#modal select,#modal textarea{font-size:16px}
  .zsel{min-height:44px}
}
@media(max-width:760px){
  .twrap{overflow:visible}
  table.mc,table.mc tbody{display:block}
  table.mc tr.mh{display:none}
  table.mc tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px;
    padding:13px;margin-bottom:10px;border:1px solid var(--line);border-radius:13px;background:var(--card2)}
  table.mc tr[hidden]{display:none!important}        /* ตัวกรองซ่อนแถวด้วย hidden — ต้องชนะ display:grid */
  table.mc td{display:block;padding:0;border:0;min-width:0;grid-column:span 1;word-break:break-word}
  table.mc td:first-child,table.mc td:last-child,table.mc td[colspan]{grid-column:1/-1}
  table.mc td[data-l]:not([data-l=""])::before{content:attr(data-l);display:block;font-size:11px;
    color:var(--mut);margin-bottom:4px;font-family:var(--fd);font-weight:500}
  table.mc td:last-child{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  table.mc td:last-child::before{flex-basis:100%;margin-bottom:0}
  table.mc td:last-child .btn{flex:1 1 auto;min-height:44px;font-size:14px}
  table.mc .inlinesel{width:100%;min-width:0;min-height:44px;font-size:16px}
  table.mc td.empty{display:block}
  /* ผู้ใช้ & สิทธิ์: ชื่อ (เต็ม) / ระดับ | ประจำที่ / แอพที่เข้าได้ (เต็ม) / ปุ่ม (เต็ม) */
  table.mc.mc-users td:first-child[data-l]::before{display:none}   /* ชื่อคนเห็นชัดอยู่แล้ว ไม่ต้องมีป้าย "ชื่อ" */
  table.mc-users td:first-child b{font-size:16px}
  table.mc-users td:nth-child(4){grid-column:1/-1}
  table.mc-users td:nth-child(4) .chip{font-size:12px;padding:3px 10px}
  table.mc-users td:last-child .chip{flex:1;text-align:center;padding:10px}
  /* ตารางสรุปสิทธิ์: คอลัมน์ชื่อค้างไว้ซ้ายตอนเลื่อน */
  table.mx th:first-child,table.mx td:first-child{position:sticky;left:0;z-index:1;background:var(--card);
    box-shadow:6px 0 8px -6px rgba(0,0,0,.6)}
  .twrap:has(table.mx){overflow-x:auto}
}
@media(max-width:480px){
  /* จอแคบมาก: ระดับ / ประจำที่ วางคนละบรรทัด ไม่งั้นชื่อในช่องเลือกโดนตัด ("ผู้ดูแลระ…") */
  table.mc-users td:nth-child(2),table.mc-users td:nth-child(3){grid-column:1/-1}
}

/* JJ Gate — ช่องล็อกอินบนมือถือต้องไม่ต่ำกว่า 16px ไม่งั้น iPhone จะซูมหน้าจอเองตอนกดพิมพ์ */
@media (max-width:640px){
  #lgU,#lgP,#liUser,#liPass{font-size:16px !important}
  .jjgate-note{font-size:13px !important}
}

/* ===== แท็บ "รออนุมัติ" (ใบสมัครพนักงานใหม่ 2026-09-29) ===== */
.pcount{display:inline-block;margin-left:7px;background:#D9A441;color:#2A1A08;border-radius:99px;
  padding:1px 8px;font-size:12px;font-weight:800;vertical-align:middle}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:13px;overflow:hidden}
.pchead{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);background:var(--card2)}
.pav{width:44px;height:44px;border-radius:13px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;color:#fff;background:linear-gradient(145deg,#C72A34,#6E1016)}
.pnm{font-family:var(--fd);font-size:16.5px;font-weight:700;line-height:1.3}
.pnm small{font-weight:400;color:var(--mut);font-size:13px;margin-left:5px}
.pwhen{margin-left:auto;font-size:12px;color:var(--mut);text-align:right;line-height:1.6;white-space:nowrap}
.pbadge{display:inline-block;background:rgba(217,164,65,.15);border:1px solid rgba(217,164,65,.45);
  color:var(--gold2);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.pbody{padding:13px 15px}
.pgrid2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px}
.pkv{border-bottom:1px dashed var(--line);padding-bottom:6px;min-width:0}
.pkv .k{font-size:11.5px;color:var(--mut);margin-bottom:2px}
.pkv .v{font-size:14.5px;color:var(--ink);line-height:1.45;word-break:break-word}
.pkv.w3{grid-column:span 3}
.psec{font-size:13px;font-weight:700;color:var(--gold);margin:16px 0 9px;display:flex;align-items:center;gap:7px}
.psec::after{content:"";flex:1;height:1px;background:var(--line)}
/* แถวเลือกระดับ/ประจำที่ของใบสมัคร — ห้ามใช้ชื่อ .prow (ชื่อนั้นเป็นตารางติ๊กสิทธิ์ ถ้าซ้ำ ช่องติ๊กจะชิดซ้ายไม่ตรงคอลัมน์) */
.pnrow{display:flex;gap:9px 11px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pnrow .lb{font-size:13px;color:var(--ink2);white-space:nowrap}
.pnrow .zsel{width:auto!important;min-width:170px;max-width:260px;flex:0 1 auto;margin-left:0}
.pnrow .zsel.cp{margin-left:auto;min-width:220px}
@media(max-width:700px){.pnrow{gap:7px}.pnrow .zsel,.pnrow .zsel.cp{flex:1 1 100%;max-width:none;margin-left:0}}
.papps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.papp{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-size:13.5px;cursor:pointer;user-select:none}
.papp.on{border-color:var(--gold);background:rgba(217,164,65,.1)}
.papp input{width:16px;height:16px;flex:0 0 16px;accent-color:var(--gold)}
.pbtns{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.btn.okb{background:linear-gradient(180deg,#2FA35A,#177A3C);border-color:#177A3C;color:#fff}
.btn.nob{background:transparent;border-color:#6A4340;color:#E88C86}
.phint{font-size:12.5px;color:var(--mut);margin-top:9px;line-height:1.65}
@media(max-width:820px){.pgrid2{grid-template-columns:1fr 1fr}.pkv.w3{grid-column:span 2}.papps{grid-template-columns:1fr 1fr}}

<script>
/* ============================================================
   JJ Gate — ด่านกันคนเข้าทางลิงก์ตรง (เจ้าของสั่ง 2026-09-21)
   · เข้าจากหน้าศูนย์รวมแอพ (index.html) หลังล็อกอิน = ผ่านได้เลยตามสิทธิ์
   · เข้าด้วย URL ตรง / ลิงก์ที่ถูกส่งต่อ = ต้องใส่รหัสผ่านใหม่ทุกครั้ง
   ใบผ่านมี 2 แบบ:
   · ใบผ่านครั้งเดียว (localStorage 'jjhub_pass') หน้าศูนย์รวมแอพออกให้ตอนกดไอคอน
     อายุ 2 นาที · ผูกกับชื่อผู้ใช้ + ชื่อแอพ · ใช้แล้วลบทิ้งทันที
   · ใบผ่านประจำแท็บ (sessionStorage) — รีเฟรช/กดลากลงยังอยู่ แต่แท็บใหม่ไม่มี
   *** บล็อกนี้เหมือนกันทุกแอพ (ต่างแค่ชื่อแอพบรรทัดแรก) แก้ที่ไหนต้องแก้ให้ครบทุกไฟล์ ***
   ============================================================ */
window.JJGate=(function(){
  var APP='admin';                 /* ชื่อแอพนี้ — ต้องตรงกับ data-app ในหน้าศูนย์รวมแอพ */
  var TAB='jjgate_'+APP, TICKET='jjhub_pass', ALT='jjsso_ticket';
  var IDLE=30*60*1000;               /* ทิ้งไว้เกิน 30 นาทีแล้วรีเฟรช = ยืนยันรหัสใหม่ (กติกาเดียวกับ P&L) */
  var TTL=2*60*1000;                 /* ใบผ่านจากหน้าศูนย์รวมแอพ อายุ 2 นาที */
  function j(s){ try{ return JSON.parse(s||'null'); }catch(e){ return null; } }
  function readTab(){ try{ return j(sessionStorage.getItem(TAB)); }catch(e){ return null; } }
  function grant(user){ try{ sessionStorage.setItem(TAB,JSON.stringify({u:user||'',t:Date.now()})); }catch(e){} }
  /* ใช้ใบผ่านแล้วต้องลบให้เกลี้ยงทั้ง 2 แบบ ไม่งั้นใบที่เหลือจะถูกเอาไปเปิดแท็บใหม่ได้อีก
     (ลบเฉพาะใบที่จ่าหน้าถึงแอพนี้ — ใบของแอพอื่นต้องไม่โดนลบไปด้วย) */
  function burn(){
    try{ localStorage.removeItem(TICKET); }catch(e){}
    var o=null; try{ o=j(localStorage.getItem(ALT)); }catch(e){}
    if(!o||!o.app||o.app===APP){ try{ localStorage.removeItem(ALT); }catch(e){} }
  }
  function takeTicket(){
    var t=null; try{ t=j(localStorage.getItem(TICKET)); }catch(e){}
    if(t&&t.app===APP&&t.u&&t.exp&&t.exp>=Date.now()){ burn(); return t; }
    /* รับใบผ่านอีกแบบของหน้าศูนย์รวมแอพด้วย (jjsso_ticket — ระบบเดียวกับที่ JJ Social/ซ่อมบำรุงใช้) */
    var o=null; try{ o=j(localStorage.getItem(ALT)); }catch(e){}
    if(o&&o.u&&(!o.app||o.app===APP)&&(Date.now()-(+o.t||0))<TTL){ burn(); return {app:APP,u:o.u,exp:Date.now()+TTL}; }
    return null;
  }
  /* เปิดจากไอคอนที่ติดตั้งไว้บนหน้าจอมือถือ (PWA) = เครื่องของเจ้าตัวเอง ไม่ใช่ลิงก์ที่ถูกส่งต่อ → ผ่านได้
     (ลิงก์ที่ส่งต่อทางแชทจะเปิดในเบราว์เซอร์ธรรมดา ไม่ใช่โหมดนี้ — ยังโดนถามรหัสเหมือนเดิม) */
  function installed(){
    try{
      if(navigator.standalone===true)return true;                                   /* iPhone/iPad */
      return !!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches
             || window.matchMedia&&window.matchMedia('(display-mode: fullscreen)').matches);  /* Android */
    }catch(e){ return false; }
  }
  /* เรียกก่อนจะยอมรับ session ที่ค้างอยู่ในเครื่อง — false = ให้แสดงหน้าล็อกอิน
     ผ่านได้ 3 ทาง: ใบผ่านประจำแท็บ (รวมถึงการดึงหน้าลงรีเฟรช) · ใบผ่านจากหน้าศูนย์รวมแอพ · เปิดจากไอคอนบนมือถือ */
  function ok(user){
    var g=readTab();
    if(g&&(Date.now()-(g.t||0))<IDLE&&(!user||g.u===user)){ grant(g.u||user); return true; }
    var t=takeTicket();
    if(t&&(!user||t.u===user)){ grant(t.u); return true; }
    if(installed()){ grant(user||''); return true; }
    return false;
  }
  /* ออกใบผ่านก่อนพาไปอีกแอพ (หน้าศูนย์รวมแอพ + ลิงก์ข้ามแอพ) — ไม่รู้ชื่อผู้ใช้ = ไม่ออกให้ */
  function issue(app,user){
    if(!app||!user)return false;
    try{ localStorage.setItem(TICKET,JSON.stringify({app:app,u:user,exp:Date.now()+TTL})); return true; }catch(e){ return false; }
  }
  /* แปะข้อความ "เปิดจากลิงก์ตรง" บนหน้าล็อกอินของแอพ + เติมชื่อผู้ใช้ให้ เหลือแค่พิมพ์รหัส */
  function note(user,userId,passId){
    try{
      var u=userId?document.getElementById(userId):null, pw=passId?document.getElementById(passId):null;
      if(u&&user)u.value=user;
      /* หน้าล็อกอินมาตรฐาน (JJ Login) มีแถบ 🔒 ของตัวเองอยู่แล้ว */
      if(window.JJLogin&&document.getElementById('jjlgLock')){
        JJLogin.lock('<b>เปิดจากลิงก์ตรง</b> — ยืนยันรหัสผ่านอีกครั้งเพื่อความปลอดภัย<br>'+
          '<span style="opacity:.85">เข้าจาก<a href="index.html" style="color:inherit;font-weight:600"> หน้าศูนย์รวมแอพ </a>จะไม่ต้องกรอกซ้ำ</span>');
        if(pw)setTimeout(function(){ try{ pw.focus(); }catch(e){} },90);
        return;
      }
      var card=(u&&u.closest)?u.closest('.logincard,.lgc,.card,#login,#loginWrap'):null;
      if(card&&!card.querySelector('.jjgate-note')){
        var d=document.createElement('div');
        d.className='jjgate-note';
        d.style.cssText='margin:0 0 13px;padding:10px 12px;border-radius:11px;font-size:12.5px;line-height:1.55;text-align:left;'+
          'background:rgba(217,164,65,.13);border:1px solid rgba(217,164,65,.5);color:#C79A3E';
        d.innerHTML='🔒 <b>เปิดจากลิงก์ตรง</b> — ยืนยันรหัสผ่านอีกครั้งเพื่อความปลอดภัย<br>'+
          '<span style="opacity:.85">เข้าจาก<a href="index.html" style="color:inherit;font-weight:600"> หน้าศูนย์รวมแอพ </a>จะไม่ต้องกรอกซ้ำ</span>';
        card.insertBefore(d,card.firstChild);
      }
      if(pw)setTimeout(function(){ try{ pw.focus(); }catch(e){} },90);
    }catch(e){}
  }
  /* ต่ออายุใบผ่านของแท็บนี้เมื่อมีการใช้งาน */
  ['click','keydown','pointerdown','touchstart'].forEach(function(ev){
    try{ document.addEventListener(ev,function(){ var g=readTab(); if(g&&(Date.now()-(g.t||0))<IDLE)grant(g.u); },{passive:true,capture:true}); }catch(e){}
  });
  return {ok:ok,grant:grant,issue:issue,note:note,installed:installed,app:APP};
})();
</script>

        if(i)i.addEventListener('keydown',function(e){ if(e.key==='Enter')run(e); });
      });
      return box;
    },
    wrap:function(o){ this.css(); return '<div class="jjlg-in">'+this.html(o)+'</div>'; },
    /* ผูกปุ่ม/Enter ให้การ์ดที่สร้างด้วย wrap() เอง */
    bind:function(o){ o=o||{};
      var go=o.submit;
      var run=function(e){ if(e&&e.preventDefault)e.preventDefault();
        if(typeof go==='function')go(); else if(typeof go==='string')try{eval(go);}catch(x){} };
      var b=document.getElementById(o.btnId||'lgBtn'); if(b&&go)b.addEventListener('click',run);
      [o.uid||'lgU',o.pid||'lgP'].forEach(function(id){
        var i=document.getElementById(id);
        if(i)i.addEventListener('keydown',function(e){ if(e.key==='Enter')run(e); });
      });
    },
    show:function(el,focusId){
      var box=(typeof el==='string')?document.getElementById(el):el;
      if(!box)return; box.classList.add('on');
      var f=document.getElementById(focusId||'lgU');
      if(f)setTimeout(function(){try{f.focus();}catch(e){}},60);
    },
    hide:function(el){ var box=(typeof el==='string')?document.getElementById(el):el;
      if(box)box.classList.remove('on'); },
    msg:function(t,id){ var m=document.getElementById(id||'lgMsg'); if(m)m.innerHTML=t||''; },
    /* แถบ "เปิดจากลิงก์ตรง" — เรียกตอนที่ด่านไม่ผ่าน */
    lock:function(t){ var l=document.getElementById('jjlgLock'); if(!l)return;
      l.style.display=''; l.lastElementChild.innerHTML=t||
        '<b>เปิดจากลิงก์ตรง</b> — ใส่รหัสผ่านอีกครั้งเพื่อความปลอดภัย'; }
  };
  window.JJLogin=JJLogin;
})();
</script>

/* sha256 (ให้ตรงกับ pwHash ของ P&L: sha256hex(u+'|'+p+'|JJPNL')) */
function sha256hex(a){
  function r(x,n){return(x>>>n)|(x<<(32-n));}
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const u=unescape(encodeURIComponent(a));const l=u.length;const w=[];
  for(let i=0;i<l;i++)w[i>>2]=(w[i>>2]||0)|(u.charCodeAt(i)<<(24-(i%4)*8));
  w[l>>2]=(w[l>>2]||0)|(0x80<<(24-(l%4)*8));
  const n=((l+8>>6)+1)<<4;for(let i=w.length;i<n;i++)w[i]=0;w[n-1]=l*8;
  for(let j=0;j<n;j+=16){
    const W=w.slice(j,j+16);
    for(let i=16;i<64;i++){
      const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3), s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10);
      W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0;
    }
    let [a1,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+W[i])>>>0;
      const S0=r(a1,2)^r(a1,13)^r(a1,22), mj=(a1&b)^(a1&c)^(b&c), t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a1;a1=(t1+t2)>>>0;
    }
    H=[(H[0]+a1)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function pwHash(u,p){return sha256hex(u+'|'+p+'|JJPNL');}

/* ---------- Supabase REST ---------- */
async function api(method,path,body,prefer){
  const h={'apikey':CONFIG.SUPABASE_KEY,'Authorization':'Bearer '+CONFIG.SUPABASE_KEY,'Content-Type':'application/json'};
  if(prefer)h['Prefer']=prefer; else if(method!=='GET')h['Prefer']='return=representation';
  const r=await fetch(CONFIG.SUPABASE_URL+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(!r.ok){const t=await r.text();throw new Error(t.slice(0,200)||('HTTP '+r.status));}
  if(r.status===204)return null;
  const t=await r.text(); return t?JSON.parse(t):null;
}
const sel=(t,q)=>api('GET',t+'?'+q);
const upd=(t,q,b)=>api('PATCH',t+'?'+q,b);
const ins=(t,b)=>api('POST',t,b);

/* มือถือ: ตาราง class="mc" แสดงเป็นการ์ดต่อแถว — ติดป้ายชื่อคอลัมน์ (data-l) ให้ทุกช่องจากแถวหัวตาราง
   เรียกเองทุกครั้งที่เนื้อหาใน #main เปลี่ยน (MutationObserver ข้างล่าง) จะได้ไม่ต้องไล่แก้ทุก view */
function mcLabel(root){
  (root||document).querySelectorAll('table.mc').forEach(t=>{
    const head=t.querySelector('tr'); if(!head||!head.querySelector('th'))return;
    head.classList.add('mh');
    const names=[...head.children].map(th=>th.textContent.trim());
    t.querySelectorAll('tr').forEach(tr=>{
      if(tr===head)return;
      let i=0;
      [...tr.children].forEach(td=>{
        const span=Number(td.getAttribute('colspan')||1);
        if(span===1&&!td.hasAttribute('data-l'))td.setAttribute('data-l',names[i]||'');
        i+=span;
      });
    });
  });
}
(function(){
  let q=0;
  const run=()=>{ q=0; try{ mcLabel($('#main')); }catch(e){} };
  const start=()=>{ const m=$('#main'); if(!m)return;
    new MutationObserver(()=>{ if(!q)q=requestAnimationFrame(run); }).observe(m,{childList:true,subtree:true}); };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start); else start();
})();

}

function setupCard(){

function copyFn(){
  const el=document.getElementById('fnSignupNotify'); if(!el)return;
  const t=el.textContent;
  const done=()=>toast('คัดลอกแล้ว — เอาไปวางที่ Edge Functions (ไม่ใช่ SQL Editor)');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));
  else fallback(t,done);
  function fallback(txt,cb){
    const a=document.createElement('textarea'); a.value=txt; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select();
    try{document.execCommand('copy');cb();}catch(e){toast('คัดลอกไม่สำเร็จ',true);}
    a.remove();
  }
}

const FN_VER=(function(){

       return (/VERSION\s*=\s*"([^"]+)"/.exec(el?el.textContent:'')||[])[1]||''; }
  catch(e){ return ''; }
})();
async function testFn(){
  const box=document.getElementById('fnRes'); box.className='fnres on';
  box.innerHTML='⏳ กำลังทดสอบ…';
  const url=CONFIG.SUPABASE_URL+'/functions/v1/signup-notify';
  try{
    const r=await fetch(url,{method:'POST',
      headers:{'Content-Type':'application/json',apikey:CONFIG.SUPABASE_KEY},
      body:JSON.stringify({username:'ทดสอบระบบ',name:'(ข้อความทดสอบจาก JJ Access)',nickname:'',unit:''})});
    const t=(await r.text()||'').trim();
    if(r.status===404){
      box.innerHTML='❌ <b>ยังไม่ได้ deploy ฟังก์ชัน</b><br>ทำตามข้อ 1–2 ก่อนครับ'; return;
    }
    if(r.status===401){
      box.innerHTML='❌ <b>ยังไม่ได้ปิด Verify JWT</b><br>ฟังก์ชัน deploy แล้ว แต่ Supabase ปัดตกตั้งแต่ด่านหน้า — ทำข้อ 3'; return;
    }
    if(/^skip/.test(t)){
      if(/กลุ่ม/.test(t)){
        box.innerHTML='⚠️ <b>ยังไม่ได้ใส่ไอดีกลุ่ม</b><br>ใส่ในช่องข้างบนแล้วกด 💾 บันทึกกลุ่ม ก่อนครับ'; return;
      }
      /* ฟังก์ชันบอกมาด้วยว่ามันเห็น secret ชื่ออะไรบ้าง (ชื่ออย่างเดียว ไม่มีค่า) */
      const m=/เห็น:\s*([^|]*)/.exec(t), seen=m?m[1].trim():'';   // ตัดส่วน "| v<เวอร์ชัน>" ท้ายข้อความออก
      const other=seen&&seen!=='-';
      box.innerHTML='⚠️ <b>ฟังก์ชันอ่าน secret <code>LINE_TOKEN</code> ไม่เจอ</b><br>'+
        (other
          ? 'แต่เห็นตัวอื่นอยู่ (<span style="font-size:12px;color:var(--mut)">'+esc(seen)+'</span>) '+
            'แปลว่าโปรเจกต์ถูกแล้ว — ปกติเกิดจาก<b>ตั้ง secret หลัง deploy</b><br>'+
            '👉 กลับไปที่ฟังก์ชัน <code>signup-notify</code> แล้วกด <b>Deploy</b> ซ้ำอีกรอบ แล้วกดทดสอบใหม่<br>'+
            '<span style="font-size:12px;color:var(--mut)">ถ้ายังไม่ได้ ให้เช็คว่าชื่อสะกด <code>LINE_TOKEN</code> เป๊ะ ไม่มีเว้นวรรคหน้า/หลัง และค่าไม่ว่าง</span>'
          : 'และไม่เห็น secret ของ LINE เลยสักตัว — ใส่ที่ Edge Functions → Secrets (ดูขั้นตอนข้อ 4)<br>'+
            '<span style="font-size:12px;color:var(--mut)">ตั้งแล้วต้องกด Deploy ฟังก์ชันซ้ำอีกรอบ</span>');
      return;
    }
    if(/^sent/.test(t)){
      /* ฟังก์ชันตอบเวอร์ชันของโค้ดที่ deploy อยู่กลับมาด้วย — ไม่มี = ยังเป็นโค้ดรุ่นเก่า */
      const v=(/\|\s*v([0-9.\-]+)/.exec(t)||[])[1]||'';
      box.innerHTML='✅ <b>ใช้งานได้แล้ว</b> — ลองดูในกลุ่ม LINE จะมีข้อความทดสอบเด้งเข้าไป'+
        (v?'<br><span style="font-size:12px;color:var(--mut)">โค้ดที่ deploy อยู่: v'+esc(v)+' · ต้องเป็น <b>'+esc(FN_VER)+'</b> ขึ้นไป ระบบลืมรหัสผ่านถึงจะใช้ได้</span>'
          :'<br><span style="font-size:12px;color:var(--warn)">⚠️ ยังเป็นโค้ดรุ่นเก่า — ระบบ \"ลืมรหัสผ่าน\" จะยังไม่ทำงาน '+
           'กด 📋 คัดลอกโค้ด แล้ว Deploy ทับอีกรอบครับ</span>');
      return;
    }
    if(/^LINE ตอบกลับ/.test(t)){
      box.innerHTML='❌ <b>LINE ปฏิเสธ</b><br><span style="font-size:12px;color:var(--mut)">'+esc(t.slice(0,220))+'</span><br>'+
        'มักเป็นเพราะ token ผิด หรือบอทไม่ได้อยู่ในกลุ่มนั้น'; return;
    }
    box.innerHTML='ℹ️ ฟังก์ชันตอบกลับว่า: <span style="font-size:12px;color:var(--mut)">'+esc(t.slice(0,220)||('HTTP '+r.status))+'</span>';
  }catch(e){
    box.innerHTML='❌ ต่อไม่ได้ — <span style="font-size:12px;color:var(--mut)">'+esc(String(e.message||e).slice(0,160))+'</span>';
  }

function pendCopyFrom(id,srcId){
  if(!srcId)return;
  const src=(S.users||[]).find(x=>String(x.id)===String(srcId)); if(!src)return;
  const apps=isBoss(src)?fullApps():JSON.parse(JSON.stringify(src.apps||{}));
  S.pendCopy[id]=apps; S.pendApps[id]={};
  APPKEYS.forEach(k=>{
    const on=!!(apps[k]&&Object.values(apps[k]).some(v=>String(v).includes('v')));
    if(on)S.pendApps[id][k]=true;
    const box=$('#pa_'+id+'_'+k); if(box){box.classList.toggle('on',on);
      const cb=box.querySelector('input'); if(cb)cb.checked=on;}
  });
  const r=$('#pr_'+id); if(r&&ROLES[src.role]&&src.role!=='admin'&&src.role!=='owner')r.value=src.role;
  const un=$('#pu_'+id); if(un&&UNITS[src.unit])un.value=src.unit;
  toast('คัดลอกสิทธิ์จาก '+(src.display_name||src.username)+' มาแล้ว — ตรวจดูก่อนกดอนุมัติ');
}
async function pendApprove(id){
  const u=(S.pend||[]).find(x=>x.id===id); if(!u)return;
  const role=($('#pr_'+id)||{}).value||'staff';
  const unit=($('#pu_'+id)||{}).value||'ALL';
  const boss=(role==='admin'||role==='owner');
  let apps;
  if(boss)apps=fullApps();
  else if(S.pendCopy[id])apps=S.pendCopy[id];
  else { apps={}; Object.keys(S.pendApps[id]||{}).forEach(k=>{apps[k]=pendApps(k);}); }
  const n=boss?APPKEYS.length:Object.keys(apps).length;
  if(!boss&&!n&&!confirm('ยังไม่ได้ติ๊กแอพไหนเลย\n\nอนุมัติแล้วเขาจะล็อกอินได้แต่ไม่เห็นแอพอะไรเลย — ไปติ๊กให้ทีหลังได้ที่แท็บผู้ใช้ & สิทธิ์\n\nอนุมัติเลยไหม?'))return;
  try{
    await upd('pnl_users','id=eq.'+id,{status:'active',active:true,role:role,unit:unit,apps:apps,
      approved_by:(S.user&&S.user.username)||'?',approved_at:new Date().toISOString(),reject_reason:null});
    await alog(u.username,'อนุมัติพนักงานใหม่',
      'ระดับ '+((ROLES[role]||{}).n||role)+' · ประจำที่ '+((UNITS[unit]||{}).n||unit)+' · เปิดให้ '+n+' แอพ');
    toast('✅ อนุมัติ '+(u.display_name||u.username)+' แล้ว — เข้าใช้งานได้เลย');

/* ---------- แท็บ 1: ผู้ใช้ & สิทธิ์ ---------- */
/* ---------- ตัวกรองรายชื่อผู้ใช้ (เจ้าของสั่ง 2026-09-29) ----------
   กรองในหน้าจอเลย ไม่ดึงข้อมูลใหม่ · เก็บใน sessionStorage = รีเฟรช/ลากลงแล้วยังอยู่ ปิดแท็บแล้วหาย */
const UF_KEY='jjacc_ufilter';
const UF_ST={on:'✅ ใช้งานอยู่',off:'⛔ ปิดใช้งาน',pending:'⏳ รออนุมัติ',rejected:'✖️ ไม่อนุมัติ'};
function stOf(u){ return u.status==='pending'?'pending':u.status==='rejected'?'rejected':u.active===false?'off':'on'; }
function ufGet(){
  try{ const f=JSON.parse(sessionStorage.getItem(UF_KEY)||'{}');
    if(!f||typeof f!=='object')return {};
    return { q:String(f.q||''), role:ROLES[f.role]?f.role:'', unit:UNITS[f.unit]?f.unit:'',
      app:(f.app==='_none'||APPS[f.app])?f.app:'', st:UF_ST[f.st]?f.st:'' };   // กันค่าเสียจากเวอร์ชันเก่า
  }catch(e){ return {}; }
}
function ufMatch(u,f){
  const q=String(f.q||'').trim().toLowerCase();
  if(q && (String(u.display_name||'')+' '+String(u.username||'')).toLowerCase().indexOf(q)<0)return false;
  if(f.role && roleOf(u)!==f.role)return false;
  if(f.unit && unitOf(u)!==f.unit)return false;
  if(f.st && stOf(u)!==f.st)return false;
  if(f.app==='_none')return !APPKEYS.some(k=>appOn(u,k));
  if(f.app && !appOn(u,f.app))return false;      // ผู้ดูแลระบบ/เจ้าของ = เข้าได้ทุกแอพ จึงติดทุกตัวกรองแอพ
  return true;
}
function ufActive(f){ return !!(String(f.q||'').trim()||f.role||f.unit||f.app||f.st); }
function ufBar(us,f){
  const cnt=fn=>us.filter(fn).length;
  const opt=(v,label,n,cur)=>'<option value="'+v+'"'+(cur===v?' selected':'')+'>'+label+' ('+n+')</option>';
  const on=v=>v?' class="on"':'';
  return '<div class="ufbar">'+
    '<input id="ufQ" type="search" placeholder="🔍 ค้นหาชื่อ / ชื่อผู้ใช้" autocomplete="off" value="'+esc(f.q||'')+'" oninput="ufApply()"'+on(String(f.q||'').trim())+'>'+
    '<select id="ufRole" onchange="ufApply()"'+on(f.role)+'><option value="">ทุกระดับ</option>'+
      Object.keys(ROLES).map(k=>opt(k,ROLES[k].ic+' '+esc(ROLES[k].n),cnt(u=>roleOf(u)===k),f.role)).join('')+'</select>'+
    '<select id="ufUnit" onchange="ufApply()"'+on(f.unit)+'><option value="">ทุกที่ (ประจำที่)</option>'+
      Object.keys(UNITS).map(k=>opt(k,UNITS[k].ic+' '+esc(UNITS[k].n),cnt(u=>unitOf(u)===k),f.unit)).join('')+'</select>'+
    '<select id="ufApp" onchange="ufApply()"'+on(f.app)+'><option value="">ทุกแอพ</option>'+

function ufCountHtml(shown,total,f){
  return ufActive(f)?'แสดง '+shown+' จาก '+total+' บัญชี':total+' บัญชี';
}
function ufApply(){
  const g=id=>{ const el=$('#'+id); return el?el.value:''; };
  const f={q:g('ufQ'),role:g('ufRole'),unit:g('ufUnit'),app:g('ufApp'),st:g('ufSt')};
  try{ sessionStorage.setItem(UF_KEY,JSON.stringify(f)); }catch(e){}
  let shown=0;
  document.querySelectorAll('tr[data-uid]').forEach(tr=>{
    const u=S.users.find(x=>String(x.id)===tr.dataset.uid);
    const ok=!!u&&ufMatch(u,f); tr.hidden=!ok; if(ok)shown++;
  });
  ['ufQ','ufRole','ufUnit','ufApp','ufSt'].forEach(id=>{ const el=$('#'+id); if(el)el.classList.toggle('on',!!String(el.value).trim()); });
  const c=$('#ufCount'); if(c)c.textContent=ufCountHtml(shown,S.users.length,f);
  const n=$('#ufNone'); if(n)n.hidden=!!shown||!S.users.length;
  const b=$('#ufClr'); if(b)b.hidden=!ufActive(f);
}
function ufClear(){
  ['ufQ','ufRole','ufUnit','ufApp','ufSt'].forEach(id=>{ const el=$('#'+id); if(el)el.value=''; });
  ufApply();
}

/* ---------- พนักงานลาออก / รับกลับ / ลบบัญชีถาวร ----------
   หลักคิด: **ลาออก = ปิดใช้งาน ไม่ใช่ลบ**
   ชื่อผู้ใช้ถูกอ้างเป็นข้อความอยู่ในประวัติหลายที่ (payroll_audit · pnl_access_log ·
   inv_invoices.created_by · ck_orders ...) ลบแถวทิ้ง = ประวัติเก่าชี้ไปหาคนที่ไม่มีตัวตน
   และชื่อผู้ใช้ว่างให้คนใหม่มาใช้ซ้ำได้ ประวัติจะปนกัน
   ปิดใช้งานแล้วเข้าไม่ได้ทุกแอพทันที (ทุกแอพกรอง active=is.true อยู่แล้ว)
   ลบถาวรมีไว้สำหรับบัญชีทดสอบ/สมัครผิดเท่านั้น — ต้องพิมพ์ชื่อผู้ใช้ยืนยัน */

      '<button class="btn pri" onclick="userQuitGo('+id+')">🚪 ยืนยันว่าออกงานแล้ว</button></div>');

  }catch(e){ toast('เปิดบัญชีไม่สำเร็จ: '+e.message,true); }
}

/* ---------- เปลี่ยนระดับ/ประจำที่ ได้จากตารางเลย (ไม่ต้องเปิดฟอร์ม) ---------- */
function pickCell(u,field){
  const MAP = field==='role' ? ROLES : UNITS;
  const cur = field==='role' ? roleOf(u) : unitOf(u);
  const cls = (field==='role'&&isBoss(u)) ? ' adm' : '';
  return '<select class="inlinesel'+cls+'" data-id="'+u.id+'" data-f="'+field+'" onchange="quickSet(this)">'+
    Object.keys(MAP).map(k=>'<option value="'+k+'"'+(cur===k?' selected':'')+'>'+
      MAP[k].ic+' '+esc(MAP[k].n)+'</option>').join('')+'</select>';
}
async function quickSet(el){
  const id=Number(el.dataset.id), field=el.dataset.f, val=el.value;
  const u=S.users.find(x=>x.id===id); if(!u)return;
  const prev = field==='role' ? roleOf(u) : unitOf(u);
  if(val===prev)return;
  el.disabled=true;
  try{
    const body={}; body[field]=val;
    await upd('pnl_users','id=eq.'+id,body);
    u[field]=val;
    const label = field==='role' ? ROLES[val].n : UNITS[val].n;
    await alog(u.username, field==='role'?'เปลี่ยนระดับ':'เปลี่ยนประจำที่', label);
    toast((u.display_name||u.username)+' → '+label+' ✓');
    render();
  }catch(e){
    el.value=prev; toast('บันทึกไม่สำเร็จ: '+e.message,true);
  }finally{ el.disabled=false; }
}

function editPerms(id,keepDraft){

  if(isBoss(u)){
    openModal('<h3>⚙️ สิทธิ์ของ '+esc(u.display_name||u.username)+'</h3>'+
      '<div class="empty">บัญชีนี้เป็น <b>'+ROLES[roleOf(u)].ic+' '+esc(ROLES[roleOf(u)].n)+'</b> — เข้าได้ทุกแอพ ทำได้ทุกอย่างโดยอัตโนมัติ<br>'+
      '<span style="font-size:12px">ถ้าต้องการจำกัดสิทธิ์ ให้เปลี่ยนระดับเป็น "ผู้จัดการ" หรือ "พนักงาน" ก่อน (ปุ่ม ✏️)</span></div>'+
      '<div class="mbtn"><button class="btn" onclick="closeModal()">ปิด</button></div>');

  }

      ' <span class="chip">'+esc(u.username)+'</span></h3>'+
    '<p class="sub">ติ๊ก <b>เปิดแอพ</b> เพื่อให้เข้าระบบนั้นได้ แล้วเลือกสิทธิ์รายหน้าจอ — ไม่ติ๊ก "ดู" = ซ่อนหน้านั้นไปเลย<br>'+
    'ติ๊ก เพิ่ม/แก้/ลบ โดยไม่ติ๊ก "ดู" ไม่ได้ (ระบบจะติ๊ก "ดู" ให้อัตโนมัติ)</p>'+
    '<div class="mbtn" style="justify-content:flex-start;margin:0 0 10px">'+
      '<button class="btn" onclick="copyFromPick()">📋 คัดลอกสิทธิ์จากคนอื่น</button></div>'+
    '<div id="permBoxes" class="scrollarea">'+permBoxesHtml(u)+'</div>'+
    '<div class="mbtn"><button class="btn" onclick="closeModal()">ยกเลิก</button>'+

function permSummary(u){   // สรุปว่าเปิดแอพไหนให้บ้าง (ไว้โชว์ในรายการให้เลือก)

                  :'<span class="chip">— ยังไม่ได้เปิดแอพไหนเลย —</span>';
}
function fullApps(){       // สิทธิ์เต็มทุกแอพทุกหน้า (ใช้ตอนคัดลอกจากผู้ดูแล/เจ้าของ)
  const out={};
  APPKEYS.forEach(k=>{const a={};Object.keys(APPS[k].s).forEach(sc=>a[sc]='vaed');out[k]=a;});
  return out;
}
function copyFromPick(){
  const u=S.users.find(x=>x.id===S.editId); if(!u)return;
  APPKEYS.forEach(k=>{if($('#box_'+k))syncDraft(k);});   // เก็บที่ติ๊กค้างไว้ก่อน เผื่อกดยกเลิก
  const others=S.users.filter(x=>x.id!==u.id);
  const rows=others.length?others.map(o=>
      '<div class="pickrow">'+
        '<div class="pwho">'+
          '<div class="nm2">'+esc(o.display_name||o.username)+
            '<span class="chip">'+esc(o.username)+'</span></div>'+
          '<div class="apps">'+permSummary(o)+'</div>'+
        '</div>'+
        '<button class="btn sm" onclick="copyFrom('+o.id+')">คัดลอก →</button>'+
      '</div>').join('')

    '<div class="scrollarea">'+rows+'</div>'+
    '<div class="mbtn"><button class="btn" onclick="editPerms(S.editId,true)">ย้อนกลับ</button></div>');
}
function copyFrom(srcId){
  const src=S.users.find(x=>x.id===srcId), u=S.users.find(x=>x.id===S.editId);
  if(!src||!u)return;
  S.draft=isBoss(src)?fullApps():JSON.parse(JSON.stringify(src.apps||{}));
  S.copiedFrom=src.username;
  editPerms(S.editId,true);
  toast('คัดลอกสิทธิ์จาก '+(src.display_name||src.username)+' มาแล้ว — ตรวจดูแล้วกด 💾 บันทึกสิทธิ์');
}
function appBox(k,u){
  const A=APPS[k], on=appOn(u,k), scr=Object.keys(A.s);
  const head='<div class="apphead" onclick="this.parentNode.classList.toggle(\'open\')">'+
    '<span class="ic">'+A.ic+'</span><span class="nm">'+esc(A.n)+'</span>'+
    '<span class="cnt" id="cnt_'+k+'">'+(on?countScreens(u,k)+'/'+scr.length+' หน้า':'ปิด')+'</span>'+
    '<span class="arw">▶</span></div>';

      (cur.includes(f[0])?' checked':'')+' onchange="flagChg(this)"></span>').join('');
    return '<div class="prow"><span class="nm">'+esc(A.s[sc])+'</span>'+cells+

function flagChg(el){
  const k=el.dataset.k, sc=el.dataset.s, f=el.dataset.f;
  const box=$('#box_'+k);
  const get=ff=>box.querySelector('input[type=checkbox][data-s="'+sc+'"][data-f="'+ff+'"]');
  if(el.checked&&f!=='v'){const v=get('v'); if(v&&!v.checked)v.checked=true;}       // เพิ่ม/แก้/ลบ ต้องเห็นหน้าก่อน
  if(!el.checked&&f==='v'){FLAGS.forEach(x=>{if(x[0]!=='v'){const c=get(x[0]);if(c)c.checked=false;}});} // ไม่เห็น = ทำอะไรไม่ได้
  syncDraft(k);
}
function hideScr(k,sc){
  const box=$('#box_'+k);
  FLAGS.forEach(f=>{const c=box.querySelector('input[type=checkbox][data-s="'+sc+'"][data-f="'+f[0]+'"]');if(c)c.checked=false;});
  syncDraft(k);
}
function bulk(k,val){
  const box=$('#box_'+k);
  box.querySelectorAll('input[type=checkbox][data-k="'+k+'"]').forEach(c=>{c.checked=val.includes(c.dataset.f);});
  box.querySelectorAll('input[type=radio][data-k="'+k+'"]').forEach(r=>{r.checked=(val==='');});
  syncDraft(k);
  if(val!=='')box.classList.add('open');
}
function syncDraft(k){
  const box=$('#box_'+k); const A=APPS[k]; const out={};
  Object.keys(A.s).forEach(sc=>{
    let fl='';
    FLAGS.forEach(f=>{const c=box.querySelector('input[type=checkbox][data-s="'+sc+'"][data-f="'+f[0]+'"]');if(c&&c.checked)fl+=f[0];});
    if(fl)out[sc]=fl;
    const rd=box.querySelector('input[type=radio][data-s="'+sc+'"]'); if(rd)rd.checked=(fl==='');
  });
  if(BR_SCOPED[k] && Object.keys(out).length){
    const br=[...box.querySelectorAll('input[data-br]')].filter(c=>c.checked).map(c=>c.dataset.br);
    if(br.length && br.length<BR_LIST.length) out._br=br.join(',');
  }
  if(Object.keys(out).length)S.draft[k]=out; else delete S.draft[k];
  const n=Object.values(out).filter(v=>v.includes('v')).length;
  const c=$('#cnt_'+k); if(c)c.textContent=n?(n+'/'+Object.keys(A.s).length+' หน้า'):'ปิด';
}
async function savePerms(){
  const u=S.users.find(x=>x.id===S.editId); if(!u)return;
  APPKEYS.forEach(k=>{if($('#box_'+k))syncDraft(k);});
  try{
    await upd('pnl_users','id=eq.'+u.id,{apps:S.draft});
    const opened=APPKEYS.filter(k=>S.draft[k]&&Object.values(S.draft[k]).some(v=>v.includes('v')));
    await alog(u.username,S.copiedFrom?'คัดลอกสิทธิ์':'แก้สิทธิ์',
      (S.copiedFrom?'คัดลอกจาก '+S.copiedFrom+' · ':'')+
      'เปิดแอพ: '+(opened.map(k=>APPS[k].n).join(', ')||'— ไม่มี —'));
    S.copiedFrom=null;
    closeModal(); toast('บันทึกสิทธิ์ของ '+(u.display_name||u.username)+' แล้ว ✓'); render();
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message,true);}
}

  try{
    await ins('pnl_users',{username:uname,display_name:name||uname,pass_hash:pwHash(uname,pass),role,active:true,perms:{},apps:{}});
    await alog(uname,'นำเข้าบัญชี','จากระบบนับสต๊อก (sc_users)');

/* ---------- ล็อกอิน ---------- */
async function initAuth(){
  const saved=JSON.parse(localStorage.getItem('jjpnl_auth')||'null');
  /* JJ Gate — เข้าทางลิงก์ตรง = ต้องใส่รหัสใหม่ (เข้าจากหน้าศูนย์รวมแอพถึงจะผ่านเลย) */
  const relock=!!(saved&&saved.u&&!JJGate.ok(saved.u));
  if(saved&&saved.u&&!relock){
    try{
      const rows=await sel('pnl_users','select=*&active=is.true&username=eq.'+encodeURIComponent(saved.u));
      if(rows[0]&&rows[0].pass_hash===saved.h){ setUser(rows[0]); return true; }
    }catch(e){}
  }
  $('#login').classList.add('on');
  if(relock){ JJGate.note(saved.u,'lgU','lgP'); }
  else setTimeout(()=>{const el=$('#lgU');if(el)el.focus();},60);
  return false;
}
async function doLogin(){
  const u=($('#lgU').value||'').trim(), p=$('#lgP').value||'';
  if(!u||!p){$('#lgMsg').textContent='ใส่ชื่อผู้ใช้และรหัสผ่านก่อนครับ';return;}
  try{
    const rows=await sel('pnl_users','select=*&active=is.true&username=eq.'+encodeURIComponent(u));
    if(!rows[0]||rows[0].pass_hash!==pwHash(u,p)){$('#lgMsg').textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return;}
    if(!isBoss(rows[0])){$('#lgMsg').textContent='หน้านี้เปิดให้เฉพาะผู้ดูแลระบบและเจ้าของเท่านั้น';return;}
    JJGate.grant(rows[0].username);
    localStorage.setItem('jjpnl_auth',JSON.stringify({u:rows[0].username,h:rows[0].pass_hash}));
    $('#login').classList.remove('on'); setUser(rows[0]); render();
  }catch(e){$('#lgMsg').textContent='เข้าสู่ระบบไม่สำเร็จ: '+e.message;}
}

/* ============================================================
   ลากหน้าลง = รีเฟรช (pull-to-refresh) — ใช้ได้บนมือถือทุกแบบ
   จำเป็นเพราะแอปที่ "เพิ่มไปยังหน้าจอโฮม" (PWA) ไม่มีปุ่ม/ท่ารีเฟรชของเบราว์เซอร์
   แตะที่ยอดสุดของหน้าแล้วลากลงเกิน 70px → ปล่อยนิ้ว = โหลดหน้าใหม่
   ============================================================ */
(function(){
  if(!('ontouchstart' in window))return;              // เฉพาะจอสัมผัส
  var TH=70, MAX=110, y0=0, dy=0, pulling=false, ready=false, bar=null;

  function el(){
    if(bar)return bar;
    bar=document.createElement('div');
    bar.setAttribute('aria-hidden','true');
    bar.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;display:flex;'+
      'align-items:center;justify-content:center;pointer-events:none;'+
      'height:0;overflow:hidden;transition:none;'+
      'font:600 13px/1.2 "Prompt","Sarabun",system-ui,sans-serif;color:#F2CF7A;'+
      'background:linear-gradient(180deg,rgba(163,27,36,.95),rgba(163,27,36,0));';
    bar.innerHTML='<span id="__ptrTxt">ลากลงเพื่อรีเฟรช</span>';
    document.body.appendChild(bar);
    return bar;
  }
  function atTop(){
    var d=document.scrollingElement||document.documentElement;
    return (window.pageYOffset||d.scrollTop||0)<=0;
  }
  /* ลากอยู่ในกล่องที่เลื่อนได้เอง (ตาราง/ลิสต์) ไม่นับ */
  function inScrollable(node){
    for(var n=node;n&&n!==document.body;n=n.parentElement){
      var st=getComputedStyle(n), oy=st.overflowY;
      if((oy==='auto'||oy==='scroll')&&n.scrollHeight>n.clientHeight&&n.scrollTop>0)return true;
    }
    return false;
  }
  /* โหมด kiosk (แท็บเล็ตหน้าร้านให้ลูกค้ากด) ห้ามรีเฟรช — คะแนนที่กดค้างไว้จะหาย */
  function kiosk(){
    return document.body.classList.contains('kiosk') ||
           /[?&]kiosk=/.test(location.search);
  }
  document.addEventListener('touchstart',function(e){
    if(kiosk()){pulling=false;return;}
    if(e.touches.length!==1||!atTop()||inScrollable(e.target)){pulling=false;return;}
    y0=e.touches[0].clientY; dy=0; pulling=true; ready=false;
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(!pulling)return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0||!atTop()){ if(bar){bar.style.height='0';} return; }
    if(e.cancelable)e.preventDefault();                // กันหน้าเด้งตามนิ้ว
    var h=Math.min(dy*0.5,MAX), b=el();
    b.style.height=h+'px';
    ready = dy>TH;
    var t=b.querySelector('#__ptrTxt');
    if(t)t.textContent = ready ? 'ปล่อยเพื่อรีเฟรช' : 'ลากลงเพื่อรีเฟรช';
  },{passive:false});

  document.addEventListener('touchend',function(){
    if(!pulling)return; pulling=false;
    var b=el();
    if(ready){
      b.style.height='44px';
      var t=b.querySelector('#__ptrTxt'); if(t)t.textContent='กำลังโหลด…';
      setTimeout(function(){ location.reload(); },120);
    }else{
      b.style.transition='height .2s'; b.style.height='0';
      setTimeout(function(){ b.style.transition='none'; },220);
    }
  },{passive:true});
})();
</script>

// ทำอะไรได้บ้าง (ดูที่ช่อง action ใน body)

//   action=reset_request = ขอรหัส 6 หลักไปตั้งรหัสผ่านใหม่   -> ตอบ JSON {ok}
//   action=reset_confirm = ใส่รหัส 6 หลัก + รหัสผ่านใหม่      -> ตอบ JSON {ok}

//     -> ใครอ่านตารางได้ก็ย้อนกลับเป็นรหัสไม่ได้ · **ห้ามเอารหัสจริงมาเก็บที่นี่เด็ดขาด**
//   - ใส่ผิดเกิน 5 ครั้ง / เกิน 10 นาที = ต้องขอใหม่ · ขอถี่กว่า 60 วินาทีไม่ได้
//   - เบราว์เซอร์คิด pass_hash เองแล้วส่งมา รหัสผ่านตัวจริงจึงไม่เคยออกจากเครื่องผู้ใช้

const CORS = {

const SB_URL = Deno.env.get("SUPABASE_URL") || "";

function sbHead(extra?: Record<string, string>) {

async function sbGet(path: string): Promise<any[]> {

async function groupId(): Promise<string> {

async function pushLine(token: string, to: string, text: string): Promise<string> {
  const r = await fetch("https://api.line.me/v2/bot/message/push", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify({ to, messages: [{ type: "text", text }] }),
  });
  if (r.ok) return "";
  const t = await r.text();
  return "LINE ตอบกลับ " + r.status + ": " + t.slice(0, 300);
}

/* ---------- รหัส 6 หลัก ---------- */

// กุญแจ HMAC เอาจาก secret ที่มีอยู่แล้วในฟังก์ชัน (ไม่ต้องตั้งเพิ่ม)
// service role key ของ Supabase ใส่มาให้เองทุกฟังก์ชัน · ไม่มีก็ใช้ LINE_TOKEN ซึ่งฟีเจอร์นี้ต้องมีอยู่แล้ว
function hmacSecret(): string {
  return (Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") || "") + "|" + (Deno.env.get("LINE_TOKEN") || "");
}
async function codeHash(username: string, code: string): Promise<string> {
  const key = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(hmacSecret()),
    { name: "HMAC", hash: "SHA-256" }, false, ["sign"],
  );
  const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(username + "|" + code));
  return Array.from(new Uint8Array(sig)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function newCode(): string {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return String(a[0] % 1000000).padStart(6, "0");
}
function sameHex(a: string, b: string): boolean {
  if (a.length !== b.length) return false;
  let d = 0;
  for (let i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return d === 0;
}
function okUser(u: string): boolean {
  return /^[a-z0-9._-]{3,20}$/.test(u);
}
function thTime(ms: number): string {
  try {
    return new Intl.DateTimeFormat("th-TH", {
      timeZone: "Asia/Bangkok", hour: "2-digit", minute: "2-digit",
    }).format(new Date(ms));
  } catch (_) { return ""; }
}

const rkey = (u: string) => "reset:" + u;

async function readReset(u: string): Promise<any> {
  try {
    const rows = await sbGet("pnl_settings?select=val&id=eq." + encodeURIComponent(rkey(u)));
    if (!rows || !rows[0]) return null;
    return JSON.parse(String(rows[0].val || "null"));
  } catch (_) { return null; }
}
async function writeReset(u: string, o: unknown): Promise<void> {
  const r = await fetch(SB_URL + "/rest/v1/pnl_settings?on_conflict=id", {
    method: "POST",
    headers: sbHead({ Prefer: "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify({
      id: rkey(u), val: JSON.stringify(o),
      updated_at: new Date().toISOString(), updated_by: "reset",
    }),
  });
  if (!r.ok) throw new Error("บันทึกคำขอไม่ได้ (" + r.status + ")");
}
async function clearReset(u: string): Promise<void> {
  try {
    await fetch(SB_URL + "/rest/v1/pnl_settings?id=eq." + encodeURIComponent(rkey(u)),
      { method: "DELETE", headers: sbHead() });
  } catch (_) { /* ไม่เป็นไร เดี๋ยวก็หมดอายุเอง */ }
}

async function findUser(u: string): Promise<any> {
  const rows = await sbGet(
    "pnl_users?select=username,display_name,active,status&username=eq." + encodeURIComponent(u));
  return rows && rows[0] ? rows[0] : null;
}
function userBlocked(usr: any): string {
  if (usr.status === "pending") return "บัญชีนี้ยังรอผู้ดูแลอนุมัติอยู่";
  if (usr.status === "rejected") return "บัญชีนี้ไม่ได้รับอนุมัติ";
  if (usr.active === false) return "บัญชีนี้ถูกปิดใช้งาน — ติดต่อผู้ดูแลครับ";
  return "";
}
async function logReset(username: string, detail: string): Promise<void> {
  try {
    await fetch(SB_URL + "/rest/v1/pnl_access_log", {
      method: "POST", headers: sbHead({ Prefer: "return=minimal" }),
      body: JSON.stringify({
        actor: username, target_user: username,
        action: "ตั้งรหัสผ่านใหม่ด้วยรหัส 6 หลัก", detail: detail.slice(0, 300),
      }),
    });
  } catch (_) { /* จดไม่ได้ก็ไม่ขวางการตั้งรหัส */ }
}

/* ---------- ขอรหัส ---------- */
async function resetRequest(b: Record<string, string>, token: string, to: string) {
  const u = String(b.username || "").trim().toLowerCase();
  if (!okUser(u)) return jsonRes({ ok: false, reason: "ชื่อผู้ใช้ไม่ถูกรูปแบบ" });

  const usr = await findUser(u);
  if (!usr) return jsonRes({ ok: false, reason: "ไม่พบชื่อผู้ใช้นี้ในระบบ" });
  const bad = userBlocked(usr);
  if (bad) return jsonRes({ ok: false, reason: bad });

  const now = Date.now();
  const cur = await readReset(u);
  if (cur && cur.iat && now - cur.iat < ASK_GAP_SEC * 1000) {
    const wait = Math.ceil((ASK_GAP_SEC * 1000 - (now - cur.iat)) / 1000);
    return jsonRes({ ok: false, reason: "เพิ่งขอรหัสไปเมื่อสักครู่ — รออีก " + wait + " วินาที" });
  }

  const code = newCode();
  const exp = now + CODE_TTL_MIN * 60000;
  await writeReset(u, { h: await codeHash(u, code), exp, iat: now, n: 0 });

  const msg = [
    "🔑 ขอตั้งรหัสผ่านใหม่",
    "",
    "ชื่อผู้ใช้: " + u,
    "ชื่อ: " + (usr.display_name || u),
    "",
    "รหัสยืนยัน: " + code,
    "ใช้ได้ถึง " + thTime(exp) + " น. (" + CODE_TTL_MIN + " นาที)",
    "",
    "⚠️ บอกรหัสนี้กับเจ้าตัวเท่านั้น",
    "ไม่มีใครขอ = ไม่ต้องบอกใคร เดี๋ยวหมดอายุเอง",
  ].join("\n");

  const err = await pushLine(token, to, msg);
  if (err) {
    await clearReset(u);
    return jsonRes({ ok: false, reason: "ส่งรหัสเข้ากลุ่ม LINE ไม่สำเร็จ · " + err });
  }
  return jsonRes({ ok: true, name: usr.display_name || u, minutes: CODE_TTL_MIN });
}

/* ---------- ใส่รหัส + ตั้งรหัสผ่านใหม่ ---------- */
async function resetConfirm(b: Record<string, string>, token: string, to: string) {
  const u = String(b.username || "").trim().toLowerCase();
  const code = String(b.code || "").replace(/\D/g, "");
  const ph = String(b.pass_hash || "").trim().toLowerCase();
  if (!okUser(u)) return jsonRes({ ok: false, reason: "ชื่อผู้ใช้ไม่ถูกรูปแบบ" });
  if (code.length !== 6) return jsonRes({ ok: false, reason: "ใส่รหัส 6 หลักให้ครบก่อนครับ" });
  if (!/^[0-9a-f]{64}$/.test(ph)) return jsonRes({ ok: false, reason: "รหัสผ่านใหม่ไม่ถูกต้อง" });

  const st = await readReset(u);
  if (!st || !st.h) return jsonRes({ ok: false, reason: "ยังไม่ได้ขอรหัส หรือรหัสหมดอายุแล้ว — กดขอรหัสใหม่ครับ" });
  if (!st.exp || Date.now() > st.exp) {
    await clearReset(u);
    return jsonRes({ ok: false, reason: "รหัสหมดอายุแล้ว — กดขอรหัสใหม่ครับ" });
  }
  const tries = Number(st.n || 0);
  if (tries >= CODE_TRIES) {
    await clearReset(u);
    return jsonRes({ ok: false, reason: "ใส่รหัสผิดหลายครั้งเกินไป — กดขอรหัสใหม่ครับ" });
  }
  if (!sameHex(st.h, await codeHash(u, code))) {
    const left = CODE_TRIES - tries - 1;
    if (left <= 0) { await clearReset(u); return jsonRes({ ok: false, reason: "รหัสไม่ถูกต้อง — ใส่ผิดครบแล้ว กดขอรหัสใหม่ครับ" }); }
    await writeReset(u, { ...st, n: tries + 1 });
    return jsonRes({ ok: false, reason: "รหัสไม่ถูกต้อง (ลองได้อีก " + left + " ครั้ง)" });
  }

  const usr = await findUser(u);
  if (!usr) return jsonRes({ ok: false, reason: "ไม่พบชื่อผู้ใช้นี้ในระบบ" });
  const bad = userBlocked(usr);
  if (bad) return jsonRes({ ok: false, reason: bad });

  const r = await fetch(SB_URL + "/rest/v1/pnl_users?username=eq." + encodeURIComponent(u), {
    method: "PATCH", headers: sbHead({ Prefer: "return=minimal" }),
    body: JSON.stringify({ pass_hash: ph }),
  });
  if (!r.ok) return jsonRes({ ok: false, reason: "ตั้งรหัสผ่านใหม่ไม่สำเร็จ (" + r.status + ")" });

  await clearReset(u);
  await logReset(u, "ขอรหัสผ่านกลุ่ม LINE แล้วตั้งรหัสใหม่เอง");
  if (to) {
    await pushLine(token, to,
      "✅ " + (usr.display_name || u) + " (" + u + ") ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว\n" +
      "ถ้าไม่ใช่เจ้าตัว ให้รีบเข้า 🔑 JJ Access ไปเปลี่ยนรหัส/ปิดบัญชีทันที");
  }
  return jsonRes({ ok: true });
}

/* ---------- แจ้งกลุ่มว่ามีคนสมัครใหม่ (ของเดิม) ---------- */
function signupText(b: Record<string, string>): string {
  return [
    "🧑‍💼 มีคนสมัครเป็นพนักงานใหม่",
    "",
    "ชื่อ: " + (b.name || "-") + (b.nickname ? " (" + b.nickname + ")" : ""),
    "ชื่อผู้ใช้ที่ขอ: " + (b.username || "-"),
    b.unit ? "อยากทำที่: " + (UNIT[b.unit] || b.unit) : "",
    "",
    "อนุมัติที่ 🔑 JJ Access → แท็บ ⏳ รออนุมัติ",
    "https://thananant.github.io/JJ-PnL/jjmk-admin.html",
  ].filter((x) => x !== "").join("\n");
}

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok", { headers: CORS });

  try {
    const b = await req.json().catch(() => ({} as Record<string, string>));
    const action = String(b.action || "");
    const isReset = action === "reset_request" || action === "reset_confirm";

    const token = (Deno.env.get("LINE_TOKEN") || "").trim();
    if (!token) {
      // บอกให้รู้ว่าฟังก์ชันนี้ "เห็น" secret ชื่ออะไรบ้าง (ชื่ออย่างเดียว ไม่ส่งค่าออกไป)
      // ตั้ง secret ไว้แล้วแต่ยังไม่เห็น = ต้องกด Deploy ฟังก์ชันใหม่อีกรอบ
      const seen = ["LINE_TOKEN", "LINE_GROUP_ID", "LINE_CHANNEL_ACCESS_TOKEN", "LINE_SECRET", "LINE_CHANNEL_SECRET"]
        .filter((k) => (Deno.env.get(k) || "").trim() !== "");
      const why = "skip: อ่าน LINE_TOKEN ไม่เจอ | เห็น: " + (seen.join(", ") || "-") + " | v" + VERSION;
      return isReset
        ? jsonRes({ ok: false, reason: "ระบบส่ง LINE ยังไม่พร้อม — แจ้งผู้ดูแลระบบครับ" })
        : new Response(why, { headers: CORS });
    }

    const to = await groupId();
    if (!to) {
      return isReset
        ? jsonRes({ ok: false, reason: "ยังไม่ได้ตั้งกลุ่ม LINE — แจ้งผู้ดูแลระบบครับ" })
        : new Response("skip: ยังไม่ได้เลือกกลุ่ม LINE | v" + VERSION, { headers: CORS });
    }

    if (action === "reset_request") return await resetRequest(b, token, to);
    if (action === "reset_confirm") return await resetConfirm(b, token, to);

    const err = await pushLine(token, to, signupText(b));
    if (err) return new Response(err, { status: 200, headers: CORS });
    return new Response("sent | v" + VERSION, { headers: CORS });
  } catch (e) {
    const m = "error: " + String((e as Error)?.message || e);
    return new Response(m, { status: 200, headers: CORS });
  }
});
