async function orderSend(id){
  if(!canKitchen())return;
  const o=S.orders.find(x=>x.id===id);const lines=S.orderItems[id]||[];
  if(!o||o.status!=='prep')return;
  // เช็คของพอ/ยืนยัน ก่อนเขียนข้อมูลใดๆ
  const short=lines.some(l=>{const r=recipeById(l.recipe_id);return r&&num(l.qty)>num(r.qty);});
  if(!confirm(t('or_send_confirm')+(short?'\n'+t('or_stock_short'):'')))return;
  await once(async()=>{
  const today=bizTodayISO();const moves=[];let total=0;
  for(const l of lines){
    const r=recipeById(l.recipe_id);if(!r)continue;
    const cu=recipeUnitCost(r);
    const amount=cu!=null?rnd2(num(l.qty)*cu):null;
    l.cost_unit=cu;l.amount=amount;if(amount!=null)total+=amount;
    await dbi(()=>sb.from('ck_order_items').update({cost_unit:cu,amount}).eq('id',l.id));
    moves.push({d:today,kind:'send',item_kind:'recipe',ref_id:r.id,name:r.name,qty:-num(l.qty),
      cost:amount,ref:o.id,branch:o.branch});
  }
  await pushMoves(moves);
  o.status='sent';o.total=rnd2(total);
  await dbi(()=>sb.from('ck_orders').update({status:'sent',total:o.total}).eq('id',id));
  closeModal();applyChrome();toast(t('or_sent_ok'));show(S.tab);
  });}
async function orderUnsend(id){ // ส่งผิด — คืนสต๊อกของที่ผลิตแล้ว กลับสถานะกำลังจัด
  if(!canKitchen())return;
  if(!confirm(t('undo_confirm')))return;
  await once(async()=>{
    const o=S.orders.find(x=>x.id===id);if(!o||o.status!=='sent')return;
    const mv=await dbi(()=>sb.from('ck_moves').select('*').eq('ref',id).eq('kind','send'));
    await dbi(()=>sb.from('ck_moves').delete().eq('ref',id).eq('kind','send'));
    for(const m of (mv||[])){
      const r=recipeById(m.ref_id);
      const v=await addQty('recipe',m.ref_id,-num(m.qty)); // qty ของ move เป็นลบ — ลบลบ = บวกคืน
      if(r)r.qty=v!=null?v:rnd2(num(r.qty)-num(m.qty));
    }
    o.status='prep';o.total=null;
    await dbi(()=>sb.from('ck_orders').update({status:'prep',total:null}).eq('id',id));
    closeModal();applyChrome();toast(t('sv_ok'));show(S.tab);
  });}
function orderPrint(id){
  const o=S.orders.find(x=>x.id===id);const lines=S.orderItems[id]||[];
  let rows='';let tot=0;
  lines.forEach((l,i)=>{rows+='<tr><td>'+(i+1)+'</td><td>'+esc(l.name)+'</td><td class="n">'+fmtI(l.qty)+' '+esc(trUnit(l.unit||''))+'</td>'+
    '<td class="n">'+(l.cost_unit!=null?fmt(l.cost_unit,2):'')+'</td><td class="n">'+(l.amount!=null?fmt(l.amount,2):'')+'</td></tr>';
    tot+=num(l.amount);});
  document.getElementById('printArea').innerHTML=
    '<div class="ph"><img src="'+LOGO_B64+'"><div><div style="font-size:18px;font-weight:700">'+t('or_deliver_note')+'</div>'+
    '<div style="font-size:13px">จริงใจหมูกระทะ — JJ Kitchen</div></div>'+
    '<div style="margin-left:auto;text-align:right;font-size:13px">'+t('or_branch')+': <b>'+esc(o.branch_name||branchName(o.branch))+'</b><br>'+t('date')+': '+dispDate(o.d)+'</div></div>'+
    '<table><tr><th style="width:30px">#</th><th>'+t('nav_menus')+'</th><th class="n">'+t('qty')+'</th><th class="n">'+t('cost')+'/'+t('unit')+'</th><th class="n">'+t('total')+'</th></tr>'+rows+
    '<tr><td colspan="4" style="text-align:right;font-weight:700">'+t('or_value')+'</td><td class="n" style="font-weight:700">'+fmt(o.total!=null?o.total:tot,2)+'</td></tr></table>'+
    (o.note?'<div style="margin-top:8px;font-size:13px">📝 '+esc(o.note)+'</div>':'')+
    '<div class="sigs"><div>'+t('or_sig_pack')+'</div><div>'+t('or_sig_check')+'</div><div>'+t('or_sig_send')+'</div><div>'+t('or_sig_recv')+'</div></div>';
  window.print();
}
</script>
<script>
/* ============================================================
   ☀️ วันนี้ — งานประจำวันครัวกลางจบในหน้าเดียว
   รับของเข้า(พร้อมราคา) · ผลิต · ส่งสาขา · นับสต๊อก · สรุปวันนี้
   ตัดรอบวันใหม่ 06:00 เช้า (bizTodayISO)
   ============================================================ */
RENDER.today=async function(el){
  const D=bizTodayISO();
  let mv=[];
  try{mv=await dbi(()=>sbAll(()=>sb.from('ck_moves').select('*').eq('d',D).order('id'),50).then(data=>({data})));}
  catch(e){el.innerHTML='<div class="card empty">⚠ '+esc((e&&e.message)||e)+'</div>';return;}
  S._tmv=mv;
  const recv=mv.filter(x=>x.kind==='buy');
  const sends=mv.filter(x=>x.kind==='send');
  const counted=mv.some(x=>x.kind==='adjust');
  const prodsT=S.prods.filter(p=>p.d===D);
  const recvVal=recv.reduce((s,x)=>s+num(x.cost),0);
  const madeVal=prodsT.reduce((s,p)=>s+num(p.cost_total),0);
  const sentVal=sends.reduce((s,x)=>s+Math.abs(num(x.cost)),0);
  const leftVal=S.recipes.reduce((s,r)=>{const c=recipeUnitCost(r);return s+(c!=null?num(r.qty)*c:0);},0);
  const K=canKitchen();

  let h='<div class="card"><h3>☀️ '+dispDate(D)+
    '<span class="sp"><span class="chip '+(counted?'ok':'warn')+'">'+(counted?t('td_counted_ok'):t('td_counted_no'))+'</span></span></h3>'+
    '<div class="xs mut">'+t('td_hint')+'</div></div>';
  // ปุ่มลัดใหญ่ 4 งานหลัก
  if(K)h+='<div class="bigacts">'+
    '<button class="bigact" onclick="qrModal()"><span class="bi">📥</span>'+t('td_receive')+'</button>'+
    '<button class="bigact hot" onclick="produceModal()"><span class="bi">🍳</span>'+t('nav_produce')+'</button>'+
    '<button class="bigact" onclick="qsModal()"><span class="bi">🚚</span>'+t('td_send')+'</button>'+
    '<button class="bigact" onclick="show(\'stock\');skCountStart()"><span class="bi">📋</span>'+t('skc_start').replace('📋 ','')+'</button></div>';
  // KPI วันนี้
  h+='<div class="kpis">'+
    '<div class="kpi hero"><div class="t">🍳 '+t('da_produce_today')+'</div><div class="kpi-v">฿'+fmt(madeVal)+'</div><div class="s">'+prodsT.length+' '+t('items_n')+'</div></div>'+
    '<div class="kpi"><div class="t">🚚 '+t('td_sent_today')+'</div><div class="kpi-v">฿'+fmt(sentVal)+'</div><div class="s mut">'+[...new Set(sends.map(x=>x.branch))].filter(Boolean).length+' 🏪</div></div>'+
    '<div class="kpi"><div class="t">📥 '+t('td_recv_today')+'</div><div class="kpi-v">฿'+fmt(recvVal)+'</div><div class="s mut">'+recv.length+' '+t('items_n')+'</div></div>'+
    '<div class="kpi tap" onclick="show(\'stock\')"><div class="t">🍲 '+t('sk_menus')+'</div><div class="kpi-v">฿'+fmt(leftVal)+'</div><div class="s mut">'+t('sk_val')+'</div></div></div>';

  // ผลิตวันนี้
  h+='<div class="card"><h3>🍳 '+t('da_produce_today')+'</h3>';
  if(!prodsT.length)h+='<div class="empty">'+t('td_none')+'</div>';
  else prodsT.forEach(p=>{const r=recipeById(p.recipe_id);
    h+='<div class="rowline" style="cursor:pointer" onclick="prodDetail(\''+p.id+'\')">'+thumbHtml(r,'🍲')+
      '<div class="grow"><b>'+esc(r?dispName(r):p.name||'')+'</b>'+
      '<div class="xs mut">'+fmtI(p.qty)+' '+esc(trUnit(r?r.yield_unit||'':''))+' · ฿'+fmt(p.cost_unit,2)+'/'+esc(trUnit(r?r.yield_unit||'':''))+'</div></div>'+
      '<b>฿'+fmt(p.cost_total,2)+'</b></div>';});
  h+='</div>';

  // ส่งสาขาวันนี้ (จากการตัดสต๊อกจริง)
  h+='<div class="card"><h3>🚚 '+t('td_sent_today')+'</h3>';
  if(!sends.length)h+='<div class="empty">'+t('td_none')+'</div>';
  else{
    const byOrd={};sends.forEach(x=>{(byOrd[x.ref||'?']=byOrd[x.ref||'?']||[]).push(x);});
    Object.keys(byOrd).forEach(oid=>{
      const rows=byOrd[oid];const o=S.orders.find(x=>x.id===oid);
      const val=rows.reduce((s,x)=>s+Math.abs(num(x.cost)),0);
      const bn=(o&&(o.branch_name||branchName(o.branch)))||rows[0].branch||'?';
      h+='<div class="rowline" '+(o?'style="cursor:pointer" onclick="orderDetail(\''+oid+'\')"':'')+'>'+
        '<div class="grow"><b>🏪 '+esc(bn)+'</b><div class="xs mut">'+
        rows.map(x=>esc(x.name)+' '+fmtI(Math.abs(num(x.qty)))).join(' · ')+'</div></div>'+
        '<b>฿'+fmt(val,2)+'</b></div>';});
  }
  h+='</div>';

  // รับเข้าวันนี้
  h+='<div class="card"><h3>📥 '+t('td_recv_today')+'</h3>';
  if(!recv.length)h+='<div class="empty">'+t('td_none')+'</div>';
  else recv.forEach(x=>{const it=itemById(x.ref_id);const fromPo=x.ref&&!String(x.ref).startsWith('qr');
    h+='<div class="rowline">'+thumbHtml(it,ITEM_CAT_IC[it&&it.cat]||'🥬')+
      '<div class="grow"><b>'+esc(it?dispName(it):x.name||'')+'</b>'+
      '<div class="xs mut">'+fmtI(x.qty)+' '+esc(trUnit(it?it.unit||'':''))+(fromPo?' · '+t('td_from_po'):'')+'</div></div>'+
      (x.cost!=null?'<b>฿'+fmt(x.cost,2)+'</b>':'')+
      (K&&!fromPo?'<button class="btn gh sm2" onclick="mvUndo('+x.id+')">↩</button>':'')+'</div>';});
  h+='</div>';

  // ของผลิตคงเหลือ — "ควรเหลือเท่าไร"
  const madeBy={},sentBy={};
  mv.filter(x=>x.kind==='made').forEach(x=>{madeBy[x.ref_id]=(madeBy[x.ref_id]||0)+num(x.qty);});
  sends.forEach(x=>{sentBy[x.ref_id]=(sentBy[x.ref_id]||0)+Math.abs(num(x.qty));});
  const showRecs=S.recipes.filter(r=>num(r.qty)!==0||madeBy[r.id]||sentBy[r.id]);
  h+='<div class="card"><h3>🍲 '+t('td_left')+'</h3>';
  if(!showRecs.length)h+='<div class="empty">'+t('td_none')+'</div>';
  else{h+='<div class="twrap"><table class="t"><tr><th>'+t('nav_menus')+'</th><th class="right">'+t('stt_made')+'</th><th class="right">'+t('stt_send')+'</th><th class="right"><b>'+t('sk_now')+'</b></th></tr>';
    showRecs.forEach(r=>{
      h+='<tr><td>'+esc(dispName(r))+'</td><td class="n">'+(madeBy[r.id]?fmtI(madeBy[r.id]):'–')+'</td>'+
        '<td class="n">'+(sentBy[r.id]?fmtI(sentBy[r.id]):'–')+'</td>'+
        '<td class="n"><b>'+fmtI(r.qty)+' '+esc(trUnit(r.yield_unit||''))+'</b></td></tr>';});
    h+='</table></div>';}
  h+='<button class="btn dk" style="margin-top:10px" onclick="todayPrint()">'+t('td_print')+'</button></div>';
  el.innerHTML=h;
};

/* ---------- ↩ ยกเลิกรายการเคลื่อนไหวเดี่ยว (รับเข้าเร็ว) ---------- */
async function mvUndo(id){
  if(!canKitchen())return;
  if(!confirm(t('undo_confirm')))return;
  await once(async()=>{
    const rows=await dbi(()=>sb.from('ck_moves').select('*').eq('id',id));
    const m=rows&&rows[0];if(!m)return;
    await dbi(()=>sb.from('ck_moves').delete().eq('id',id));
    const o=m.item_kind==='item'?itemById(m.ref_id):recipeById(m.ref_id);
    const v=await addQty(m.item_kind,m.ref_id,-num(m.qty));
    if(o)o.qty=v!=null?v:rnd2(num(o.qty)-num(m.qty));
    toast(t('sv_ok'));show(S.tab);
  });}

/* ---------- 📥 รับของเข้าเร็ว (ไม่ต้องมีใบสั่งซื้อ) ---------- */
let QR=null;
function qrModal(){if(!canKitchen())return;QR={iid:null,a:'',b:'',price:''};paintQr();}
function qrPick(){
  pickItem(iid=>{const it=itemById(iid);QR.iid=iid;
    QR.price=(it&&it.price!=null)?String(it.price):'';paintQr();},paintQr);
}
function paintQr(){
  const d=QR;if(!d)return;
  const it=d.iid?itemById(d.iid):null;
  const hasBuy=it&&it.buy_unit&&num(it.buy_qty)>1;
  const mult=hasBuy?num(it.buy_qty):1;
  const total=rnd2(num(d.a)*mult+num(d.b));
  let h='<h3>📥 '+t('td_receive')+' · '+dispDate(bizTodayISO())+'</h3>'+
    '<div class="fld"><label>'+t('nav_items')+'</label>'+
    '<button class="btn gh" style="width:100%;justify-content:flex-start" onclick="qrPick()">'+
    (it?thumbHtml(it,ITEM_CAT_IC[it.cat]||'🥬')+' <b>'+esc(dispName(it))+'</b>':t('search'))+'</button></div>';
  if(it){
    if(hasBuy)h+='<div class="grid2">'+
      '<div class="fld"><label>'+t('skc_full')+' ('+esc(trUnit(it.buy_unit))+')</label>'+
      '<input inputmode="decimal" value="'+esc(d.a)+'" onchange="QR.a=this.value;paintQr()"></div>'+
      '<div class="fld"><label>'+t('skc_loose')+' ('+esc(trUnit(it.unit||''))+')</label>'+
      '<input inputmode="decimal" value="'+esc(d.b)+'" onchange="QR.b=this.value;paintQr()"></div></div>';
    else h+='<div class="fld"><label>'+t('qty')+' ('+esc(trUnit(it.unit||''))+')</label>'+
      '<input inputmode="decimal" value="'+esc(d.b)+'" onchange="QR.b=this.value;paintQr()"></div>';
    h+='<div class="fld"><label>'+t('po_price_now')+(it.buy_unit?' — '+esc(trUnit(it.buy_unit)):'')+'</label>'+
      '<input inputmode="decimal" value="'+esc(d.price)+'" onchange="QR.price=this.value"></div>';
    if(total>0)h+='<div class="okbox">'+t('total')+' <b>'+fmtI(total)+' '+esc(trUnit(it.unit||''))+'</b>'+
      (String(d.price).trim()!==''?' · ฿'+fmt(total*num(d.price)/(num(it.buy_qty)||1),2):'')+'</div>';
    h+='<div style="display:flex;gap:8px;margin-top:10px">'+
      '<button class="btn gh" style="flex:1" onclick="qrSave(true)">'+t('td_save_next')+'</button>'+
      '<button class="btn" style="flex:1" onclick="qrSave(false)">'+t('save')+'</button></div>';
  }
  openModal(h);
}
async function qrSave(next){await once(async()=>{
  const d=QR;if(!d)return;
  const it=d.iid?itemById(d.iid):null;
  if(!it){toast(t('need_name'),true);return;}
  const mult=(it.buy_unit&&num(it.buy_qty)>1)?num(it.buy_qty):1;
  const total=rnd2(num(d.a)*mult+num(d.b));
  if(total<=0){toast(t('need_qty'),true);return;}
  const price=String(d.price).trim()===''?null:num(d.price);
  const cost=price!=null?rnd2(total*price/(num(it.buy_qty)||1)):null;
  const D=bizTodayISO();
  await pushMoves([{d:D,kind:'buy',item_kind:'item',ref_id:it.id,name:it.name,qty:total,cost,
    ref:'qr'+Date.now().toString(36)}]);
  if(price!=null){
    if(num(price)!==num(it.price)){it.price=price;
      await dbi(()=>sb.from('ck_items').update({price}).eq('id',it.id));}
    await dbi(()=>sb.from('ck_price_log').insert({item_id:it.id,d:D,price,buy_unit:it.buy_unit||it.unit,source:'manual'}));
  }
  toast(t('sv_ok'));
  if(next){QR={iid:null,a:'',b:'',price:''};qrPick();}
  else{QR=null;closeModal();show(S.tab);}
});}

/* ---------- 🚚 ส่งสาขาเร็ว (ขั้นตอนเดียว: สร้าง+ตัดสต๊อก+คิดต้นทุน) ---------- */
let QS=null;
function qsModal(){if(!canKitchen())return;
  QS={branch:(S.branches[0]||{}).code||'',lines:[]};paintQs();}
function paintQs(){
  const d=QS;if(!d)return;
  let h='<h3>🚚 '+t('td_send')+' · '+dispDate(bizTodayISO())+'</h3>'+
    '<div class="fld"><label>'+t('or_branch')+'</label><select onchange="QS.branch=this.value">'+
    S.branches.map(b=>'<option value="'+esc(b.code)+'" '+(b.code===d.branch?'selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select></div>';
  d.lines.forEach((l,i)=>{const r=recipeById(l.recipe_id);
    h+='<div class="rowline">'+thumbHtml(r,'🍲')+'<div class="grow"><b>'+esc(r?dispName(r):l.name)+'</b>'+
      '<div class="xs mut">'+t('pl_have')+' '+fmtI(r?r.qty:0)+' '+esc(trUnit(r?r.yield_unit||'':''))+'</div></div>'+
      '<div class="stepper"><button onclick="QS.lines['+i+'].qty=Math.max(0,rnd2(num(QS.lines['+i+'].qty)-1));paintQs()">−</button>'+
      '<input inputmode="decimal" value="'+fmtI(l.qty)+'" onchange="QS.lines['+i+'].qty=num(this.value)">'+
      '<button class="plus" onclick="QS.lines['+i+'].qty=rnd2(num(QS.lines['+i+'].qty)+1);paintQs()">＋</button></div>'+
      '<button class="btn gh sm2" onclick="QS.lines.splice('+i+',1);paintQs()">🗑</button></div>';});
  h+='<button class="btn gh" style="width:100%;margin-top:8px" onclick="qsAdd()">'+t('or_add_menu')+'</button>'+
    '<button class="btn ok big" style="margin-top:12px" onclick="qsSend()" '+(d.lines.length?'':'disabled')+'>'+t('td_send_now')+'</button>';
  openModal(h,true);
}
function qsAdd(){
  pickRecipe(rid=>{const r=recipeById(rid);if(!r)return;
    const ex=QS.lines.find(l=>l.recipe_id===rid);
    if(ex)ex.qty=rnd2(num(ex.qty)+1);
    else QS.lines.push({recipe_id:rid,name:r.name,qty:1});
    paintQs();},paintQs);
}
async function qsSend(){
  const d=QS;if(!d)return;
  const lines=d.lines.filter(l=>num(l.qty)>0);
  if(!lines.length){toast(t('or_add_menu'),true);return;}
  const short=lines.some(l=>{const r=recipeById(l.recipe_id);return r&&num(l.qty)>num(r.qty);});
  if(!confirm(t('or_send_confirm')+(short?'\n'+t('or_stock_short'):'')))return;
  await once(async()=>{
    const D=bizTodayISO();
    const oid=uid('or');
    const row={id:oid,branch:d.branch,branch_name:branchName(d.branch),d:D,status:'sent',by_name:S.user.name};
    await dbi(()=>sb.from('ck_orders').insert(row));
    const moves=[];let total=0;
    const items=lines.map((l,i)=>{
      const r=recipeById(l.recipe_id);
      const cu=r?recipeUnitCost(r):null;
      const amount=cu!=null?rnd2(num(l.qty)*cu):null;
      if(amount!=null)total+=amount;
      if(r)moves.push({d:D,kind:'send',item_kind:'recipe',ref_id:r.id,name:r.name,qty:-num(l.qty),
        cost:amount,ref:oid,branch:d.branch});
      return {order_id:oid,recipe_id:l.recipe_id,name:l.name,unit:r?r.yield_unit||'':'',qty:num(l.qty),
        cost_unit:cu,amount,sort:i};});
    const ins2=await dbi(()=>sb.from('ck_order_items').insert(items).select());
    await pushMoves(moves);
    row.total=rnd2(total);
    await dbi(()=>sb.from('ck_orders').update({total:row.total}).eq('id',oid));
    S.orders.unshift(row);S.orderItems[oid]=ins2;
    QS=null;applyChrome();closeModal();toast(t('or_sent_ok'));show(S.tab);
  });}

/* ---------- 🖨 พิมพ์สรุปวันนี้ ---------- */
function todayPrint(){
  const D=bizTodayISO();const mv=S._tmv||[];
  const prodsT=S.prods.filter(p=>p.d===D);
  const sends=mv.filter(x=>x.kind==='send');
  const recv=mv.filter(x=>x.kind==='buy');
  let rows='';
  let sec='<h3 style="margin:14px 0 4px;font-size:14px">🍳 '+t('da_produce_today')+'</h3><table><tr><th>'+t('nav_menus')+'</th><th class="n">'+t('qty')+'</th><th class="n">'+t('pr_cost_unit')+'</th><th class="n">'+t('total')+'</th></tr>';
  let tv=0;
  prodsT.forEach(p=>{const r=recipeById(p.recipe_id);tv+=num(p.cost_total);
    sec+='<tr><td>'+esc(p.name||'')+'</td><td class="n">'+fmtI(p.qty)+' '+esc(r?r.yield_unit||'':'')+'</td><td class="n">'+fmt(p.cost_unit,2)+'</td><td class="n">'+fmt(p.cost_total,2)+'</td></tr>';});
  sec+='<tr><td colspan="3" style="font-weight:700;text-align:right">'+t('total')+'</td><td class="n" style="font-weight:700">'+fmt(tv,2)+'</td></tr></table>';
  rows+=sec;
  const byBr={};sends.forEach(x=>{(byBr[x.branch||'?']=byBr[x.branch||'?']||[]).push(x);});
  sec='<h3 style="margin:14px 0 4px;font-size:14px">🚚 '+t('td_sent_today')+'</h3>';
  Object.keys(byBr).forEach(br=>{
    const list=byBr[br];const val=list.reduce((s,x)=>s+Math.abs(num(x.cost)),0);
    sec+='<table style="margin-bottom:6px"><tr><th colspan="3">🏪 '+esc(branchName(br))+'</th></tr>'+
      list.map(x=>'<tr><td>'+esc(x.name)+'</td><td class="n">'+fmtI(Math.abs(num(x.qty)))+'</td><td class="n">'+(x.cost!=null?fmt(Math.abs(num(x.cost)),2):'')+'</td></tr>').join('')+
      '<tr><td colspan="2" style="font-weight:700;text-align:right">'+t('total')+'</td><td class="n" style="font-weight:700">'+fmt(val,2)+'</td></tr></table>';});
  if(!Object.keys(byBr).length)sec+='<div style="font-size:12px;color:#666">'+t('td_none')+'</div>';
  rows+=sec;
  sec='<h3 style="margin:14px 0 4px;font-size:14px">📥 '+t('td_recv_today')+'</h3>';
  if(recv.length)sec+='<table>'+recv.map(x=>'<tr><td>'+esc(x.name)+'</td><td class="n">'+fmtI(x.qty)+'</td><td class="n">'+(x.cost!=null?fmt(x.cost,2):'')+'</td></tr>').join('')+'</table>';
  else sec+='<div style="font-size:12px;color:#666">'+t('td_none')+'</div>';
  rows+=sec;
  sec='<h3 style="margin:14px 0 4px;font-size:14px">🍲 '+t('td_left')+'</h3><table><tr><th>'+t('nav_menus')+'</th><th class="n">'+t('sk_now')+'</th></tr>'+
    S.recipes.filter(r=>num(r.qty)>0).map(r=>'<tr><td>'+esc(r.name)+'</td><td class="n">'+fmtI(r.qty)+' '+esc(r.yield_unit||'')+'</td></tr>').join('')+'</table>';
  rows+=sec;
  document.getElementById('printArea').innerHTML=
    '<div class="ph"><img src="'+LOGO_B64+'"><div><div style="font-size:18px;font-weight:700">'+t('td_report')+'</div>'+
    '<div style="font-size:13px">จริงใจหมูกระทะ — JJ Kitchen</div></div>'+
    '<div style="margin-left:auto;text-align:right;font-size:13px">'+t('date')+': '+dispDate(D)+'</div></div>'+rows+
    '<div class="sigs"><div>'+t('or_sig_pack')+'</div><div>'+t('or_sig_check')+'</div></div>';
  window.print();
}

/* ---------- 🌐 แปลชื่อที่ยังไม่มีคำแปลอัตโนมัติ (รันเงียบๆ หลังโหลด) ---------- */
let BF_RUN=false;
async function autoBackfillI18n(){
  if(BF_RUN)return;BF_RUN=true;
  try{
    const needs=o=>!(o.i18n&&o.i18n.en&&o.i18n.lo&&o.i18n.my);
    let did=0;
    for(const it of S.items){
      if(!needs(it))continue;
      const o=await autoI18n(it.name,it.i18n);
      if(o){it.i18n=o;did++;await sb.from('ck_items').update({i18n:o}).eq('id',it.id);}
    }
    for(const r of S.recipes){
      if(!needs(r))continue;
      const o=await autoI18n(r.name,r.i18n);
      if(o){r.i18n=o;did++;await sb.from('ck_recipes').update({i18n:o}).eq('id',r.id);}
    }
    // แปลเสร็จแล้วรีเฟรชหน้าปัจจุบัน (เฉพาะตอนไม่ได้เปิดฟอร์มค้าง)
    if(did&&LANG!=='th'&&!document.getElementById('modalWrap').classList.contains('on'))show(S.tab);
  }catch(e){}
  finally{BF_RUN=false;}
}
</script>
<script>
/* ============================================================
   📦 สต๊อกครัวกลาง
   ============================================================ */
let SK_MODE='table', SK_CNT={}, SK_Q='';
RENDER.stock=function(el){
  if(SK_MODE==='count'){renderStockCount(el);return;}
  let h='<div class="card"><h3>🥬 '+t('sk_items')+
    '<span class="sp">'+(canKitchen()?'<button class="btn sm2" onclick="skCountStart()">'+t('skc_start')+'</button> ':'')+
    S.items.length+' '+t('items_n')+'</span></h3>';
  if(!S.items.length)h+='<div class="empty">'+t('it_none')+'</div>';
  else{h+='<div class="twrap"><table class="t"><tr><th>'+t('nav_items')+'</th><th class="right">'+t('sk_now')+'</th><th class="right">'+t('sk_min')+'</th><th class="right">'+t('sk_val')+'</th><th></th></tr>';
    S.items.forEach(i=>{const c=unitCost(i);const low=i.min_qty!=null&&num(i.qty)<=num(i.min_qty);
      h+='<tr><td>'+esc(dispName(i))+'</td>'+
        '<td class="n"'+(low?' style="color:var(--bad);font-weight:700"':'')+'>'+fmtI(i.qty)+' '+esc(trUnit(i.unit||''))+'</td>'+
        '<td class="n">'+(i.min_qty!=null?fmtI(i.min_qty):'–')+'</td>'+
        '<td class="n">'+(c!=null?'฿'+fmt(num(i.qty)*c,2):'–')+'</td>'+
        '<td class="right">'+(canKitchen()?'<button class="btn gh sm2" onclick="adjModal(\'item\',\''+i.id+'\')">'+t('sk_adjust')+'</button>':'')+'</td></tr>';});
    const val=S.items.reduce((s,i)=>{const c=unitCost(i);return s+(c!=null?num(i.qty)*c:0);},0);
    h+='<tr class="tot"><td>'+t('total')+'</td><td></td><td></td><td class="n">฿'+fmt(val,2)+'</td><td></td></tr></table></div>';}
  h+='</div>';
  h+='<div class="card"><h3>🍲 '+t('sk_menus')+'<span class="sp">'+S.recipes.length+' '+t('items_n')+'</span></h3>';
  if(!S.recipes.length)h+='<div class="empty">'+t('mn_none')+'</div>';
  else{h+='<div class="twrap"><table class="t"><tr><th>'+t('nav_menus')+'</th><th class="right">'+t('sk_now')+'</th><th class="right">'+t('pr_cost_unit')+'</th><th class="right">'+t('sk_val')+'</th><th></th></tr>';
    S.recipes.forEach(r=>{const c=recipeUnitCost(r);
      h+='<tr><td>'+esc(dispName(r))+'</td><td class="n">'+fmtI(r.qty)+' '+esc(trUnit(r.yield_unit||''))+'</td>'+
        '<td class="n">'+(c!=null?'฿'+fmt(c,2):'–')+'</td>'+
        '<td class="n">'+(c!=null?'฿'+fmt(num(r.qty)*c,2):'–')+'</td>'+
        '<td class="right">'+(canKitchen()?'<button class="btn gh sm2" onclick="adjModal(\'recipe\',\''+r.id+'\')">'+t('sk_adjust')+'</button>':'')+'</td></tr>';});
    h+='</table></div>';}
  h+='</div>';
  el.innerHTML=h;
};
function adjModal(kind,id){
  const o=kind==='item'?itemById(id):recipeById(id);if(!o)return;
  openModal('<h3>'+t('sk_adj_title')+' · '+esc(dispName(o))+'</h3>'+
    '<div class="fld"><label>'+t('sk_now')+'</label><div class="b" style="font-size:18px">'+fmtI(o.qty)+' '+esc(trUnit((kind==='item'?o.unit:o.yield_unit)||''))+'</div></div>'+
    '<div class="fld"><label>'+t('sk_new_qty')+'</label><input id="adjQ" inputmode="decimal" value="'+fmtI(o.qty)+'"></div>'+
    '<div class="fld"><label>'+t('sk_adj_note')+'</label><input id="adjN"></div>'+
    '<button class="btn big" onclick="adjSave(\''+kind+'\',\''+id+'\')">'+t('save')+'</button>');
}
async function adjSave(kind,id){await once(async()=>{
  const o=kind==='item'?itemById(id):recipeById(id);if(!o)return;
  const nv=num(document.getElementById('adjQ').value);
  const delta=rnd2(nv-num(o.qty));
  if(delta!==0){
    await pushMoves([{d:bizTodayISO(),kind:'adjust',item_kind:kind,ref_id:id,name:o.name,qty:delta,
      note:document.getElementById('adjN').value.trim()||null}]);
  }
  closeModal();toast(t('sv_ok'));show(S.tab);
});}

/* ---------- 📋 โหมดนับสต๊อกครัวกลาง (นับของสำรองที่สั่งมาเก็บไว้) ---------- */
function skCountStart(){if(!canKitchen())return;SK_MODE='count';SK_CNT={};SK_Q='';show('stock');}
function skCountExit(){SK_MODE='table';SK_CNT={};show('stock');}
function skEnt(kind,id){const k=kind+'|'+id;return SK_CNT[k]||(SK_CNT[k]={kind,id,a:'',b:''});}
function skIsCounted(e){return e&&(String(e.a).trim()!==''||String(e.b).trim()!=='');}
function skTotal(e,o,kind){ // เต็ม×อัตราแปลง + เศษ (หน่วยใช้)
  const full=String(e.a).trim()===''?0:num(e.a);
  const loose=String(e.b).trim()===''?0:num(e.b);
  const mult=(kind==='item'&&o.buy_unit&&num(o.buy_qty)>1)?num(o.buy_qty):1;
  return rnd2(full*mult+loose);}
function skSet(kind,id,f,v){skEnt(kind,id)[f]=v;show('stock');}
function skCountCard(kind,o){
  const e=SK_CNT[kind+'|'+o.id];const counted=skIsCounted(e);
  const unit=kind==='item'?(o.unit||''):(o.yield_unit||'');
  const hasBuy=kind==='item'&&o.buy_unit&&num(o.buy_qty)>1;
  const ic=kind==='item'?(ITEM_CAT_IC[o.cat]||'🥬'):'🍲';
  let h='<div class="icard'+(counted?' cnt':'')+'">'+
    '<div class="ithumb" style="height:64px">'+(o.image_url?'<img src="'+esc(o.image_url)+'" loading="lazy">':ic)+'</div>'+
    '<div class="iname" style="min-height:auto">'+esc(dispName(o))+'</div>'+
    '<div class="isub">'+t('skc_sys')+' '+fmtI(o.qty)+' '+esc(trUnit(unit))+'</div>';
  if(hasBuy){
    h+='<div class="grid2">'+
      '<div><div class="xs mut">'+t('skc_full')+' ('+esc(trUnit(o.buy_unit))+')</div>'+
      '<input inputmode="decimal" value="'+esc(e?e.a:'')+'" onchange="skSet(\''+kind+'\',\''+o.id+'\',\'a\',this.value)"></div>'+
      '<div><div class="xs mut">'+t('skc_loose')+' ('+esc(trUnit(unit))+')</div>'+
      '<input inputmode="decimal" value="'+esc(e?e.b:'')+'" onchange="skSet(\''+kind+'\',\''+o.id+'\',\'b\',this.value)"></div></div>';
  }else{
    h+='<div><div class="xs mut">'+t('qty')+' ('+esc(trUnit(unit))+')</div>'+
      '<input inputmode="decimal" value="'+esc(e?e.b:'')+'" onchange="skSet(\''+kind+'\',\''+o.id+'\',\'b\',this.value)"></div>';
  }
  if(counted)h+='<div class="xs b" style="color:var(--gold)">'+t('total')+' '+fmtI(skTotal(e,o,kind))+' '+esc(trUnit(unit))+'</div>';
  return h+'</div>';
}
function renderStockCount(el){
  const q=SK_Q.toLowerCase();
  const items=S.items.filter(i=>i.active!==false&&(!q||(i.name||'').toLowerCase().includes(q)||dispName(i).toLowerCase().includes(q)));
  const recs=S.recipes.filter(r=>r.active!==false&&(!q||(r.name||'').toLowerCase().includes(q)||dispName(r).toLowerCase().includes(q)));
  const all=S.items.length+S.recipes.length;
  const n=Object.values(SK_CNT).filter(skIsCounted).length;
  let h='<div class="hintbox">'+t('skc_hint')+'</div>'+
    '<input placeholder="'+t('search')+'" value="'+esc(SK_Q)+'" oninput="SK_Q=this.value;show(\'stock\')" style="margin-bottom:10px">'+
    '<div class="secbar">🥬 '+t('sk_items')+'<span class="sp">'+items.length+'</span></div>'+
    '<div class="igrid" style="margin-bottom:14px">'+items.map(i=>skCountCard('item',i)).join('')+'</div>';
  if(recs.length)h+='<div class="secbar">🍲 '+t('sk_menus')+'<span class="sp">'+recs.length+'</span></div>'+
    '<div class="igrid" style="margin-bottom:14px">'+recs.map(r=>skCountCard('recipe',r)).join('')+'</div>';
  h+='<div class="stickysum"><span class="v">'+t('skc_counted',{a:n,b:all})+'</span>'+
    '<span style="margin-left:auto;display:flex;gap:8px">'+
    '<button class="btn gh sm2" onclick="skCountExit()">'+t('cancel')+'</button>'+
    '<button class="btn ok" onclick="skCountSum()" '+(n?'':'disabled')+'>'+t('skc_save')+'</button></span></div>';
  el.innerHTML=h;
}
function skCountSum(){ // สรุปเฉพาะตัวที่ต่างจากระบบ ก่อนปรับจริง
  const diffs=[];
  Object.values(SK_CNT).forEach(e=>{
    if(!skIsCounted(e))return;
    const o=e.kind==='item'?itemById(e.id):recipeById(e.id);if(!o)return;
    const total=skTotal(e,o,e.kind);
    const delta=rnd2(total-num(o.qty));
    if(delta!==0)diffs.push({kind:e.kind,id:e.id,name:o.name,disp:dispName(o),
      unit:e.kind==='item'?(o.unit||''):(o.yield_unit||''),sys:num(o.qty),cnt:total,delta});
  });
  window._skDiffs=diffs;
  if(!diffs.length){openModal('<h3>📋 '+t('skc_start')+'</h3><div class="okbox">'+t('skc_none')+'</div>'+
    '<button class="btn big" onclick="closeModal();skCountExit()">'+t('done')+'</button>');return;}
  let h='<h3>📋 '+t('skc_sum')+'</h3><div class="twrap"><table class="t">'+
    '<tr><th>'+t('nav_items')+'</th><th class="right">'+t('skc_sys')+'</th><th class="right">'+t('skc_start').replace('📋 ','')+'</th><th class="right">'+t('skc_diff')+'</th></tr>';
  diffs.forEach(d=>{h+='<tr><td>'+esc(d.disp)+'</td><td class="n">'+fmtI(d.sys)+' '+esc(trUnit(d.unit))+'</td>'+
    '<td class="n">'+fmtI(d.cnt)+'</td>'+
    '<td class="n" style="color:var(--'+(d.delta>0?'ok':'bad')+');font-weight:700">'+(d.delta>0?'+':'')+fmtI(d.delta)+'</td></tr>';});
  h+='</table></div><button class="btn ok big" style="margin-top:12px" onclick="skCountApply()">'+t('skc_apply')+' ('+diffs.length+')</button>';
  openModal(h,true);
}
async function skCountApply(){await once(async()=>{
  const diffs=window._skDiffs||[];if(!diffs.length)return;
  const today=bizTodayISO();
  await pushMoves(diffs.map(d=>({d:today,kind:'adjust',item_kind:d.kind,ref_id:d.id,name:d.name,
    qty:d.delta,note:'นับสต๊อก'})));
  closeModal();toast(t('sv_ok'));skCountExit();
});}

/* ============================================================
   📖 เมนู & สูตร
   ============================================================ */
let MN_CAT='';
RENDER.menus=function(el){
  let h='';
  if(canKitchen())h+='<div style="margin-bottom:10px"><button class="btn" onclick="menuEdit()">'+t('mn_new')+'</button></div>';
  const cats=[...new Set(S.recipes.map(r=>r.cat||'อื่นๆ'))];
  h+='<div class="catbar" onclick="const b=event.target.closest(\'button\');if(b){MN_CAT=b.dataset.cat||\'\';show(\'menus\')}">'+
    '<button data-cat="" class="'+(MN_CAT===''?'on':'')+'">'+t('all')+'</button>'+
    cats.map(c=>'<button data-cat="'+esc(c)+'" class="'+(MN_CAT===c?'on':'')+'">'+(MENU_CAT_IC[c]||'🍱')+' '+esc(trCat(c))+'</button>').join('')+'</div>';
  const list=S.recipes.filter(r=>!MN_CAT||(r.cat||'อื่นๆ')===MN_CAT);
  if(!list.length){h+='<div class="card empty">'+t('mn_none')+'</div>';el.innerHTML=h;return;}
  h+='<div class="igrid">';
  list.forEach(r=>{
    const c=recipeCostCalc(r);const cu=recipeUnitCost(r);
    h+='<div class="icard" onclick="menuDetail(\''+r.id+'\')" style="cursor:pointer">'+
      '<div class="ithumb">'+(r.image_url?'<img src="'+esc(r.image_url)+'" loading="lazy">':'🍲')+'</div>'+
      '<div class="iname">'+esc(dispName(r))+'</div>'+
      '<div class="isub">'+t('mn_yield')+' '+fmtI(r.yield_qty)+' '+esc(trUnit(r.yield_unit||''))+'</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<span class="chip '+(cu!=null?'gold':'mid')+'">'+(cu!=null?'฿'+fmt(cu,2)+'/'+esc(trUnit(r.yield_unit||'')):'⚠')+'</span>'+
      '<span class="iqty">'+fmtI(r.qty)+'</span></div></div>';});
  h+='</div>';
  el.innerHTML=h;
};
function menuDetail(id){
  const r=recipeById(id);if(!r)return;
  const bom=bomOf(r);const c=recipeCostCalc(r);
  let h='<h3>'+thumbHtml(r,'🍲')+' '+esc(dispName(r))+'</h3>'+
    '<div class="sm mut" style="margin-bottom:8px">'+esc(trCat(r.cat||''))+' · '+t('mn_yield')+' <b>'+fmtI(r.yield_qty)+' '+esc(trUnit(r.yield_unit||''))+'</b>'+
    ' · '+t('sk_now')+' <b>'+fmtI(r.qty)+'</b>'+(r.note?'<br>📝 '+esc(r.note):'')+'</div>';
  if(!bom.length)h+='<div class="hintbox">'+t('mn_no_bom')+'</div>';
  else{
    h+='<div class="secbar">'+t('mn_bom')+'</div><div class="twrap"><table class="t"><tr><th>'+t('nav_items')+'</th><th class="right">'+t('qty')+'</th><th class="right">'+t('cost')+'</th></tr>';
    bom.forEach(l=>{const it=itemById(l.item_id);const uc=unitCost(it);
      h+='<tr><td>'+esc(dispName(it))+'</td><td class="n">'+fmtI(l.qty)+' '+esc(trUnit(it.unit||''))+'</td>'+
        '<td class="n">'+(uc!=null?'฿'+fmt(num(l.qty)*uc,2):'–')+'</td></tr>';});
    h+='<tr class="tot"><td>'+t('pr_cost_total')+(num(r.extra_cost)?' <span class="xs mut">(+'+t('mn_extra')+' ฿'+fmt(r.extra_cost,2)+')</span>':'')+'</td><td></td>'+
      '<td class="n">฿'+fmt(c.total,2)+'</td></tr>'+
      '<tr class="tot"><td><b>'+t('mn_cost_per')+'</b></td><td></td><td class="n"><b style="color:var(--red)">฿'+fmt(c.perUnit,2)+' / '+esc(trUnit(r.yield_unit||''))+'</b></td></tr></table></div>';
    if(c.missing)h+='<div class="hintbox">⚠ '+t('it_price')+' — '+t('no_data')+'</div>';
  }
  h+='<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
    '<button class="btn dk sm2" onclick="menuCalc(\''+id+'\')">'+t('mn_calc')+'</button>'+
    (canKitchen()?'<button class="btn gh sm2" onclick="menuEdit(\''+id+'\')">✎ '+t('edit')+'</button>'+
    '<button class="btn sm2" onclick="closeModal();produceModal(\''+id+'\')">🍳 '+t('nav_produce')+'</button>':'')+'</div>';
  openModal(h,true);
}
function menuCalc(id){
  const r=recipeById(id);if(!r)return;
  openModal('<h3>'+t('mn_calc_title')+' · '+esc(dispName(r))+'</h3>'+
    '<div class="fld"><label>'+t('mn_calc_q')+' ('+esc(trUnit(r.yield_unit||''))+')</label>'+
    '<div class="stepper"><button onclick="stepQty(\'mcQ\',-1);menuCalcPaint(\''+id+'\')">−</button>'+
    '<input id="mcQ" inputmode="decimal" value="'+fmtI(r.yield_qty)+'" oninput="menuCalcPaint(\''+id+'\')">'+
    '<button class="plus" onclick="stepQty(\'mcQ\',1);menuCalcPaint(\''+id+'\')">＋</button></div></div>'+
    '<div id="mcOut"></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
    (canKitchen()?'<button class="btn big" style="flex:1" onclick="menuCalcPlan(\''+id+'\')">'+t('mn_make_plan')+'</button>':'')+'</div>',true);
  menuCalcPaint(id);
}
function menuCalcPaint(id){
  const r=recipeById(id);const q=num(document.getElementById('mcQ').value);
  const batches=q/(num(r.yield_qty)||1);
  let mat=0,h='<div class="secbar">'+t('mn_calc_need')+'</div><div class="twrap"><table class="t"><tr><th>'+t('nav_items')+'</th><th class="right">'+t('qty')+'</th><th class="right">'+t('pl_have')+'</th><th class="right">'+t('cost')+'</th></tr>';
  bomOf(r).forEach(l=>{const it=itemById(l.item_id);const need=rnd2(batches*num(l.qty));const uc=unitCost(it);
    const enough=num(it.qty)>=need;
    if(uc!=null)mat+=need*uc;
    h+='<tr><td>'+esc(dispName(it))+'</td><td class="n">'+fmtI(need)+' '+esc(trUnit(it.unit||''))+'</td>'+
      '<td class="n">'+(enough?'<span class="chip ok">'+fmtI(it.qty)+'</span>':'<span class="chip bad">'+fmtI(it.qty)+'</span>')+'</td>'+
      '<td class="n">'+(uc!=null?'฿'+fmt(need*uc,2):'–')+'</td></tr>';});
  const total=mat+num(r.extra_cost)*batches;
  h+='<tr class="tot"><td>'+t('pr_cost_total')+'</td><td></td><td></td><td class="n">฿'+fmt(total,2)+'</td></tr>'+
    '<tr class="tot"><td><b>'+t('mn_cost_per')+'</b></td><td></td><td></td><td class="n"><b style="color:var(--red)">฿'+fmt(q?total/q:0,2)+'</b></td></tr></table></div>';
  document.getElementById('mcOut').innerHTML=h;
}
function menuCalcPlan(id){
  const q=num(document.getElementById('mcQ').value);
  MODAL_BACK=null;planModal(null,null,id,q||null);
}
let MN_DRAFT=null;
function menuEdit(id){
  if(!canKitchen())return;
  const r=id?recipeById(id):null;
  MN_DRAFT=r?{id:r.id,name:r.name,cat:r.cat||'อื่นๆ',yield_qty:num(r.yield_qty)||1,yield_unit:r.yield_unit||'กก.',
      extra_cost:num(r.extra_cost)||0,note:r.note||'',image_url:r.image_url,

    :{id:null,name:'',cat:'อื่นๆ',yield_qty:1,yield_unit:'กก.',extra_cost:0,note:'',image_url:null,bom:[]};

}

    '<div class="fld"><label>'+t('unit')+'</label><select onchange="MN_DRAFT.yield_unit=this.value">'+unitOptions(d.yield_unit)+'</select></div></div>'+

      '<input style="width:86px" inputmode="decimal" value="'+fmtI(l.qty)+'" onchange="MN_DRAFT.bom['+i+'].qty=num(this.value)">'+
      '<button class="btn gh sm2" onclick="MN_DRAFT.bom.splice('+i+',1);paintMenuEdit()">🗑</button></div>';});
  h+='<button class="btn gh" style="width:100%;margin-top:8px" onclick="mnAddIng()">'+t('mn_add_ing')+'</button>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
    (d.id?'<button class="btn gh" onclick="menuDel(\''+d.id+'\')">🗑</button>':'')+

function mnAddIng(){
  pickItem(iid=>{if(!MN_DRAFT.bom.some(l=>l.item_id===iid))MN_DRAFT.bom.push({item_id:iid,qty:1});
    paintMenuEdit();},paintMenuEdit);
}
async function menuSave(){await once(async()=>{
  const d=MN_DRAFT;if(!d)return;
  d.name=(document.getElementById('mnName').value||'').trim();
  if(!d.name){toast(t('need_name'),true);return;}
  const row={name:d.name,cat:d.cat,yield_qty:d.yield_qty||1,yield_unit:d.yield_unit,
    extra_cost:d.extra_cost||0,note:d.note||null};
  let rid=d.id;let renamed=false;
  if(rid){const old=recipeById(rid);renamed=old&&old.name!==d.name;
    if(renamed)row.i18n=null; // เปลี่ยนชื่อ — ล้างคำแปลเก่าแล้วแปลใหม่
    await dbi(()=>sb.from('ck_recipes').update(row).eq('id',rid));
    Object.assign(recipeById(rid),row);
    const oldIds=(S.boms[rid]||[]).map(l=>l.id).filter(x=>x!=null);
    const lines=d.bom.filter(l=>num(l.qty)>0).map((l,i)=>({recipe_id:rid,item_id:l.item_id,qty:l.qty,sort:i}));
    const ins=lines.length?await dbi(()=>sb.from('ck_recipe_items').insert(lines).select()):[];
    if(oldIds.length)await dbi(()=>sb.from('ck_recipe_items').delete().in('id',oldIds));
    S.boms[rid]=ins;}
  else{rid=uid('rc');row.id=rid;row.qty=0;
    await dbi(()=>sb.from('ck_recipes').insert(row));S.recipes.push(row);
    const lines=d.bom.filter(l=>num(l.qty)>0).map((l,i)=>({recipe_id:rid,item_id:l.item_id,qty:l.qty,sort:i}));
    const ins=lines.length?await dbi(()=>sb.from('ck_recipe_items').insert(lines).select()):[];
    S.boms[rid]=ins;}
  MN_DRAFT=null;closeModal();toast(t('sv_ok'));show('menus');
  // แปลชื่ออัตโนมัติ (พื้นหลัง — เติมเฉพาะช่องว่าง)
  const r=recipeById(rid);
  autoI18n(row.name,renamed?null:(r&&r.i18n)).then(o=>{if(o&&r){r.i18n=o;
    sb.from('ck_recipes').update({i18n:o}).eq('id',rid).then(()=>{},()=>{});}}).catch(()=>{});
});}
async function menuDel(id){if(!confirm(t('confirm_del')))return;
  await once(async()=>{
    await dbi(()=>sb.from('ck_recipes').update({deleted_at:new Date().toISOString()}).eq('id',id));
    S.recipes=S.recipes.filter(x=>x.id!==id);MN_DRAFT=null;MODAL_BACK=null;closeModal();show('menus');});}

let IT_CAT='',IT_Q='';
RENDER.items=function(el){

  if(canKitchen())h+='<div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap">'+

    '<button class="btn gh" onclick="supsModal()">🚛 '+t('it_sup_title')+'</button></div>';

    cats.map(c=>'<button data-cat="'+esc(c)+'" class="'+(IT_CAT===c?'on':'')+'">'+(ITEM_CAT_IC[c]||'🧺')+' '+esc(trCat(c))+'</button>').join('')+'</div>'+

};
function paintItemGrid(){
  const box=document.getElementById('itGrid');if(!box)return;
  const q=IT_Q.toLowerCase();
  const list=S.items.filter(i=>(!IT_CAT||(i.cat||'อื่นๆ')===IT_CAT)&&
    (!q||(i.name||'').toLowerCase().includes(q)||dispName(i).toLowerCase().includes(q)));
  if(!list.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">'+t('it_none')+'</div>';return;}
  box.innerHTML=list.map(i=>{
    const uc=unitCost(i);const low=i.min_qty!=null&&num(i.qty)<=num(i.min_qty);
    return '<div class="icard'+(low?' low':'')+'">'+
      (canKitchen()?'<button class="edit-dot" onclick="itemEdit(\''+i.id+'\')">✎</button>':'')+
      '<div class="ithumb" '+(i.image_url?'onclick="zoomImg(\''+esc(i.image_url)+'\')"':(canKitchen()?'onclick="pickImage(\'item\',\''+i.id+'\',()=>paintItemGrid())"':''))+'>'+
      (i.image_url?'<img src="'+esc(i.image_url)+'" loading="lazy">':(ITEM_CAT_IC[i.cat]||'🥬'))+'</div>'+
      '<div class="iname">'+esc(dispName(i))+'</div>'+
      '<div class="isub">'+(i.price!=null?'฿'+fmt(i.price,2)+'/'+esc(trUnit(i.buy_unit||i.unit||'')):'– '+t('it_price'))+
      (uc!=null?' · ฿'+fmt(uc,2)+'/'+esc(trUnit(i.unit||'')):'')+'</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<span class="chip '+(low?'bad':'mid')+'">'+fmtI(i.qty)+' '+esc(trUnit(i.unit||''))+'</span>'+
      '<span class="xs mut">'+esc(i.sup||'')+'</span></div></div>';}).join('');
}

async function itemSave(){await once(async()=>{
  const d=IT_DRAFT;if(!d)return;
  d.name=(document.getElementById('itName').value||'').trim();
  if(!d.name){toast(t('need_name'),true);return;}
  const row={name:d.name,cat:d.cat,unit:d.unit,buy_unit:d.buy_unit||null,buy_qty:d.buy_qty||1,
    price:d.price,sup:d.sup||'',lead_days:d.lead_days||1,min_qty:d.min_qty};
  let iid=d.id;let renamed=false;
  const oldPrice=iid?num(itemById(iid).price):null;
  if(iid){const old=itemById(iid);renamed=old&&old.name!==d.name;
    if(renamed)row.i18n=null; // เปลี่ยนชื่อ — ล้างคำแปลเก่าแล้วแปลใหม่
    await dbi(()=>sb.from('ck_items').update(row).eq('id',iid));
    Object.assign(itemById(iid),row);
    if(d.price!=null&&num(d.price)!==oldPrice)
      await dbi(()=>sb.from('ck_price_log').insert({item_id:iid,d:todayStr(),price:d.price,buy_unit:d.buy_unit||d.unit,source:'manual'}));}
  else{iid=uid('it');row.id=iid;row.qty=0;
    await dbi(()=>sb.from('ck_items').insert(row));S.items.push(row);
    if(d.price!=null)await dbi(()=>sb.from('ck_price_log').insert({item_id:iid,d:todayStr(),price:d.price,buy_unit:d.buy_unit||d.unit,source:'manual'}));}
  IT_DRAFT=null;closeModal();toast(t('sv_ok'));show('items');
  const it=itemById(iid);
  autoI18n(row.name,renamed?null:(it&&it.i18n)).then(o=>{if(o&&it){it.i18n=o;
    sb.from('ck_items').update({i18n:o}).eq('id',iid).then(()=>{},()=>{});}}).catch(()=>{});
});}
async function itemDel(id){if(!confirm(t('confirm_del')))return;

    await dbi(()=>sb.from('ck_items').update({deleted_at:new Date().toISOString()}).eq('id',id));
    S.items=S.items.filter(x=>x.id!==id);IT_DRAFT=null;MODAL_BACK=null;closeModal();show('items');});}

function supEdit(id){
  if(!canKitchen())return;
  const s=id?S.sups.find(x=>x.id===id):null;
  openModal('<h3>🚛 '+(s?t('edit'):t('it_sup_new'))+'</h3>'+
    '<div class="fld"><label>'+t('name')+'</label><input id="spName" value="'+esc(s?s.name:'')+'"></div>'+
    '<div class="grid2"><div class="fld"><label>'+t('it_phone')+'</label><input id="spPhone" value="'+esc(s?s.phone||'':'')+'"></div>'+
    '<div class="fld"><label>'+t('it_lead')+'</label><input id="spLead" inputmode="decimal" value="'+(s?s.lead_days||1:1)+'"></div></div>'+

async function supSave(id){
  if(!canKitchen())return;
  await once(async()=>{
    const name=(document.getElementById('spName').value||'').trim();
    if(!name){toast(t('need_name'),true);return;}
    const row={name,phone:document.getElementById('spPhone').value.trim()||null,
      lead_days:num(document.getElementById('spLead').value)||1,
      note:document.getElementById('spNote').value.trim()||null};
    if(id){await dbi(()=>sb.from('ck_sups').update(row).eq('id',id));
      Object.assign(S.sups.find(x=>x.id===id),row);}
    else{row.id=uid('sp');await dbi(()=>sb.from('ck_sups').insert(row));S.sups.push(row);}
    S.sups.sort((a,b)=>(a.name||'')<(b.name||'')?-1:1);
    closeModal();toast(t('sv_ok'));supsModal();
  });}
async function supDel(id){
  if(!canKitchen())return;
  if(!confirm(t('confirm_del')))return;

    await dbi(()=>sb.from('ck_sups').delete().eq('id',id));
    S.sups=S.sups.filter(x=>x.id!==id);closeModal();supsModal();});}

<script>
/* ============================================================
   📈 สถิติการใช้ / ผลิต / ส่ง
   ============================================================ */
async function loadMoves(m){ // เดือน YYYY-MM
  return await dbi(()=>sbAll(()=>sb.from('ck_moves').select('*')
    .gte('d',m+'-01').lte('d',dstr(m,monthDays(m))).order('d').order('id'),100).then(data=>({data})));
}
let STATS_TOK=0;
RENDER.stats=async function(el){
  const m=S.statsM;
  const tok=++STATS_TOK; // กันผลเดือนเก่าที่มาช้าทับเดือนที่เลือกล่าสุด
  el.innerHTML='<div class="spin"></div>';
  let moves=[],prev=[];
  try{[moves,prev]=await Promise.all([loadMoves(m),loadMoves(prevMonth(m))]);}
  catch(e){if(tok===STATS_TOK)el.innerHTML='<div class="card empty">⚠ '+esc((e&&e.message)||e)+'</div>';return;}
  if(tok!==STATS_TOK)return;
  S._mv=moves;
  const useMv=moves.filter(x=>x.kind==='use');
  const madeMv=moves.filter(x=>x.kind==='made');
  const sendMv=moves.filter(x=>x.kind==='send');
  const useVal=useMv.reduce((s,x)=>s+num(x.cost),0);
  const madeVal=madeMv.reduce((s,x)=>s+num(x.cost),0);
  const sendVal=sendMv.reduce((s,x)=>s+Math.abs(num(x.cost)),0);
  const days=[...new Set(useMv.map(x=>x.d))].length||1; // นับเฉพาะวันที่มีการใช้ของจริง
  let h='<div class="card"><h3>📈 '+t('nav_stats')+
    '<span class="sp"><button class="btn gh sm2" onclick="S.statsM=prevMonth(S.statsM);show(\'stats\')">‹</button> <b>'+dispMonth(m)+'</b> <button class="btn gh sm2" onclick="S.statsM=nextMonth(S.statsM);show(\'stats\')">›</button></span></h3></div>';
  h+='<div class="kpis">'+
    '<div class="kpi hero"><div class="t">🍳 '+t('stt_produced')+'</div><div class="kpi-v">฿'+fmt(madeVal)+'</div><div class="s">'+fmt(madeMv.reduce((s,x)=>s+num(x.qty),0))+' '+t('unit')+'</div></div>'+
    '<div class="kpi"><div class="t">🥬 '+t('stt_use_month')+'</div><div class="kpi-v">฿'+fmt(useVal)+'</div><div class="s mut">฿'+fmt(useVal/days)+' '+t('per_day')+'</div></div>'+
    '<div class="kpi"><div class="t">🚚 '+t('stt_sent')+'</div><div class="kpi-v">฿'+fmt(sendVal)+'</div><div class="s mut">'+sendMv.length+' '+t('items_n')+'</div></div>'+
    '<div class="kpi"><div class="t">📅 '+t('stt_use_day')+'</div><div class="kpi-v">฿'+fmt(useVal/days)+'</div><div class="s mut">'+days+' 📆</div></div></div>';
  if(!moves.length){h+='<div class="card empty">'+t('stt_none')+'</div>';el.innerHTML=h;return;}
  // กราฟมูลค่าผลิตรายวัน
  h+='<div class="card"><h3>📊 '+t('stt_chart')+'</h3><div style="height:210px"><canvas id="stChart"></canvas></div></div>';
  // การใช้วัตถุดิบ
  const byItem={};
  useMv.forEach(x=>{const k=x.ref_id;
    if(!byItem[k])byItem[k]={name:x.name,qty:0,val:0,days:{}};
    byItem[k].qty+=Math.abs(num(x.qty));byItem[k].val+=num(x.cost);byItem[k].days[x.d]=1;});
  const prevByItem={};
  prev.filter(x=>x.kind==='use').forEach(x=>{prevByItem[x.ref_id]=(prevByItem[x.ref_id]||0)+Math.abs(num(x.qty));});
  h+='<div class="card"><h3>🥬 '+t('stt_by_item')+'</h3><div class="twrap"><table class="t">'+
    '<tr><th>'+t('nav_items')+'</th><th class="right">'+t('stt_use_month')+'</th><th class="right">'+t('stt_use_day')+'</th><th class="right">'+t('stt_prev')+'</th><th class="right">'+t('stt_value')+'</th></tr>';
  Object.keys(byItem).sort((a,b)=>byItem[b].val-byItem[a].val).forEach(k=>{
    const v=byItem[k];const it=itemById(k);const pq=prevByItem[k];
    h+='<tr class="tap" onclick="statHist(\''+k+'\',\'use\')"><td>'+esc(it?dispName(it):v.name||'')+'</td>'+
      '<td class="n">'+fmtI(v.qty)+' '+esc(trUnit(it?it.unit||'':''))+'</td>'+
      '<td class="n">'+fmtI(v.qty/(Object.keys(v.days).length||1))+'</td>'+
      '<td class="n">'+(pq!=null?fmtI(pq):'–')+'</td>'+
      '<td class="n">฿'+fmt(v.val,2)+'</td></tr>';});
  h+='</table></div></div>';
  // ผลิต & ส่งตามเมนู
  const byMenu={};
  madeMv.forEach(x=>{const k=x.ref_id;
    if(!byMenu[k])byMenu[k]={name:x.name,made:0,sent:0,val:0};
    byMenu[k].made+=num(x.qty);byMenu[k].val+=num(x.cost);});
  sendMv.forEach(x=>{const k=x.ref_id;
    if(!byMenu[k])byMenu[k]={name:x.name,made:0,sent:0,val:0};
    byMenu[k].sent+=Math.abs(num(x.qty));});
  h+='<div class="card"><h3>🍲 '+t('stt_by_menu')+'</h3><div class="twrap"><table class="t">'+
    '<tr><th>'+t('nav_menus')+'</th><th class="right">'+t('stt_made')+'</th><th class="right">'+t('stt_send')+'</th><th class="right">'+t('stt_value')+'</th></tr>';
  Object.keys(byMenu).sort((a,b)=>byMenu[b].val-byMenu[a].val).forEach(k=>{
    const v=byMenu[k];const r=recipeById(k);
    h+='<tr class="tap" onclick="statHist(\''+k+'\',\'made\')"><td>'+esc(r?dispName(r):v.name||'')+'</td>'+
      '<td class="n">'+fmtI(v.made)+' '+esc(trUnit(r?r.yield_unit||'':''))+'</td>'+
      '<td class="n">'+fmtI(v.sent)+'</td><td class="n">฿'+fmt(v.val,2)+'</td></tr>';});
  h+='</table></div></div>';
  el.innerHTML=h;
  // วาดกราฟ
  const dim=monthDays(m);const labels=[],vals=[];
  for(let d=1;d<=dim;d++){labels.push(d);
    vals.push(rnd2(madeMv.filter(x=>x.d===dstr(m,d)).reduce((s,x)=>s+num(x.cost),0)));}
  if(S.charts.st)S.charts.st.destroy();
  const cv=document.getElementById('stChart');
  if(cv&&window.Chart)S.charts.st=new Chart(cv,{type:'bar',
    data:{labels,datasets:[{data:vals,backgroundColor:'#C62127',borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false}},y:{ticks:{callback:v=>'฿'+fmt(v)}}}}});
};
function statHist(refId,kind){
  const list=(S._mv||[]).filter(x=>x.ref_id===refId&&x.kind===kind);
  if(!list.length)return;
  const o=kind==='use'?itemById(refId):recipeById(refId);
  const byD={};list.forEach(x=>{if(!byD[x.d])byD[x.d]={qty:0,val:0};
    byD[x.d].qty+=Math.abs(num(x.qty));byD[x.d].val+=Math.abs(num(x.cost));});
  let h='<h3>📅 '+t('stt_hist')+' · '+esc(o?dispName(o):list[0].name||'')+'</h3>'+
    '<div class="twrap"><table class="t"><tr><th>'+t('date')+'</th><th class="right">'+t('qty')+'</th><th class="right">'+t('stt_value')+'</th></tr>';
  Object.keys(byD).sort().forEach(d=>{
    h+='<tr><td>'+dispDate(d)+'</td><td class="n">'+fmtI(byD[d].qty)+'</td><td class="n">฿'+fmt(byD[d].val,2)+'</td></tr>';});
  h+='</table></div>';
  openModal(h);
}

async function backfillI18n(){ // เติมคำแปลที่ขาดให้ทุกชื่อ
  let n=0;
  for(const it of S.items){
    if(it.i18n&&it.i18n.en&&it.i18n.lo&&it.i18n.my)continue;
    const o=await autoI18n(it.name,it.i18n);
    if(o){it.i18n=o;await sb.from('ck_items').update({i18n:o}).eq('id',it.id);n++;}
  }
  for(const r of S.recipes){
    if(r.i18n&&r.i18n.en&&r.i18n.lo&&r.i18n.my)continue;
    const o=await autoI18n(r.name,r.i18n);
    if(o){r.i18n=o;await sb.from('ck_recipes').update({i18n:o}).eq('id',r.id);n++;}
  }
  toast(t('se_backfill_done')+' ('+n+')');
}

async function enterApp(prof){
  S.prof=prof;
  S.user={id:prof.auth_uid,name:prof.name||prof.username||'?'};
  hideLogin();
  try{await loadAll();}
  catch(e){ // โหลดข้อมูลพลาด (เน็ตหลุด ฯลฯ) — ไม่เด้งกลับหน้า login ให้กดลองใหม่
    document.getElementById('view-dash').innerHTML=
      '<div class="card"><div class="empty">⚠ '+esc((e&&e.message)||e)+'</div>'+
      '<button class="btn big" onclick="location.reload()">'+t('setup_retry')+'</button></div>';
    applyChrome();return;}
  applyChrome();
  const savedTab=LS.get('jjck_tab','today');
  show(VIEWS.includes(savedTab)?savedTab:'today');
  autoBackfillI18n(); // แปลชื่อที่ยังขาดให้เองเงียบๆ (ของที่เพิ่มจากภายนอก/อัพเดทระบบ)
}
async function boot(){
  document.body.setAttribute('data-lang',LANG);
  document.documentElement.lang=LANG;
  applyChrome();paintLogin();
  if(!sb){showLogin();document.getElementById('lgMsg').textContent=t('lg_lib');return;}
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){showLogin();return;}
    const prof=await sbProfile();
    if(!prof){await sb.auth.signOut();showLogin();return;}
    if(prof.status!=='active'){await sb.auth.signOut();showLogin();
      document.getElementById('lgMsg').textContent=t('lg_pending');return;}
    await enterApp(prof);
  }catch(e){showLogin();
    document.getElementById('lgMsg').textContent=(e&&e.message)||String(e);}
}

document.querySelectorAll('.tabbar button[data-v],.sb-item[data-v]').forEach(b=>{
  b.addEventListener('click',()=>show(b.dataset.v));
