  --bg:#120E0C; --bg2:#1A1411; --card:#211A16; --card2:#2B221D; --line:#3A2E27; --line2:#4E3E34;
  --red:#A31B24; --red2:#C72A34;
  --gold:#D9A441; --gold2:#F2CF7A; --goldDim:#A98338;
  --ink:#F4EADB; --ink2:#CBBBA7; --mut:#8E7F70;
  --ok:#4CC38A; --bad:#EA4C55; --warn:#E09B3A;
  --fd:'Prompt','Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --fb:'Sarabun','Prompt','Noto Sans Thai',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--fb);color:var(--ink);background:var(--bg);min-height:100vh;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 60px}

header.top{
  position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1A1411,#150F0D);
  border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px;
}
.top .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0}
.brand{font-family:var(--fd);font-weight:700;font-size:17px;color:var(--gold2);display:flex;align-items:center;gap:8px}
.blogo{border-radius:9px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.who{margin-left:auto;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.who b{color:var(--gold2)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{
  font-family:var(--fd);font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;
}
.tabs button.on{background:linear-gradient(145deg,var(--red2),#6E1016);border-color:var(--goldDim);color:#fff;font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--gold2);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{font-size:12.5px;color:var(--mut);line-height:1.6;margin-bottom:12px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-family:var(--fd);font-weight:600;font-size:12px;color:var(--goldDim);white-space:nowrap}
tr:last-child td{border-bottom:none}
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.btn{font-family:var(--fd);font-size:13px;font-weight:500;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(145deg,var(--red2),#6E1016);border-color:var(--goldDim);color:#fff;font-weight:600}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

input,select{font-family:var(--fb);font-size:13.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--line2);background:#181310;color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--gold)}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;font-family:var(--fd);font-weight:500}

.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);background:#1B1512;color:var(--ink2);white-space:nowrap}
.chip.ok{border-color:#2E6B4E;background:#16301F;color:#8BE0B4}
.chip.adm{border-color:var(--goldDim);background:#2A2012;color:var(--gold2)}
.chip.off{border-color:#5A2A2E;background:#2A1416;color:#F2A0A5}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

/* ตารางสิทธิ์ */
.appbox{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--bg2)}
.apphead{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;background:var(--card2)}
.apphead .ic{font-size:19px}
.apphead .nm{font-family:var(--fd);font-weight:600;font-size:14px}
.apphead .cnt{margin-left:auto;font-size:11.5px;color:var(--mut)}
.apphead .arw{color:var(--mut);font-size:12px;transition:transform .15s}
.appbox.open .apphead .arw{transform:rotate(90deg)}
.appbody{display:none;padding:4px 13px 13px}
.appbox.open .appbody{display:block}

.prow{display:grid;grid-template-columns:1fr repeat(5,42px);gap:4px;align-items:center;padding:5px 0;border-bottom:1px solid #2A211C}
.prow:last-child{border-bottom:none}
.prow.hd{font-family:var(--fd);font-size:10.5px;font-weight:600;color:var(--goldDim);border-bottom:1px solid var(--line);padding-bottom:7px;position:sticky;top:0;background:var(--bg2)}
.prow .nm{font-size:12.5px}
.prow .cc{text-align:center}
.prow input[type=checkbox]{width:17px;height:17px;accent-color:var(--gold);cursor:pointer}
.prow input[type=radio]{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}

.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.quick button{font-size:11.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);background:#1B1512;color:var(--ink2);cursor:pointer;font-family:var(--fd)}
.quick button:hover{border-color:var(--gold);color:var(--gold2)}

/* modal */
#ov{position:fixed;inset:0;background:rgba(8,5,4,.78);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto}
#ov.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:18px;max-width:820px;width:100%;margin:auto}
.modal h3{font-family:var(--fd);font-size:16px;color:var(--gold2);margin-bottom:12px}
.mbtn{display:flex;gap:9px;margin-top:16px}
.mbtn .btn:last-child{margin-left:auto}

/* login */
#login{position:fixed;inset:0;background:linear-gradient(180deg,#7E1013,#2A0608);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
#login.on{display:flex}
.lgc{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:22px;max-width:340px;width:100%;text-align:center}
.lgc h2{font-family:var(--fd);font-size:18px;color:var(--gold2);margin-bottom:5px}
.lgc p{font-size:12.5px;color:var(--mut);margin-bottom:16px}
.lgc input{margin-bottom:10px;text-align:center}
#lgMsg{font-size:12.5px;color:#FF9AA0;min-height:18px;margin-top:8px}

.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:13px;line-height:1.7}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);background:#2B221D;border:1px solid var(--goldDim);color:var(--ink);padding:11px 20px;border-radius:11px;font-size:13.5px;z-index:90;transition:transform .25s;box-shadow:0 8px 26px rgba(0,0,0,.5);max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--bad);color:#FFC9CC}
.spin{width:26px;height:26px;border:3px solid var(--line2);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
a.back{color:var(--ink2);text-decoration:none;font-size:12.5px}
a.back:hover{color:var(--gold2)}
</style>
</head>

/* sha256 (ให้ตรงกับ pwHash ของ P&L: sha256hex(u+'|'+p+'|JJPNL')) */
function sha256hex(a){
  function r(x,n){return(x>>>n)|(x<<(32-n));}
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const u=unescape(encodeURIComponent(a));const l=u.length;const w=[];
  for(let i=0;i<l;i++)w[i>>2]=(w[i>>2]||0)|(u.charCodeAt(i)<<(24-(i%4)*8));
  w[l>>2]=(w[l>>2]||0)|(0x80<<(24-(l%4)*8));
  const n=((l+8>>6)+1)<<4;for(let i=w.length;i<n;i++)w[i]=0;w[n-1]=l*8;
  for(let j=0;j<n;j+=16){
    const W=w.slice(j,j+16);
    for(let i=16;i<64;i++){
      const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3), s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10);
      W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0;
    }
    let [a1,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+W[i])>>>0;
      const S0=r(a1,2)^r(a1,13)^r(a1,22), mj=(a1&b)^(a1&c)^(b&c), t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a1;a1=(t1+t2)>>>0;
    }
    H=[(H[0]+a1)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function pwHash(u,p){return sha256hex(u+'|'+p+'|JJPNL');}

/* ---------- Supabase REST ---------- */
async function api(method,path,body,prefer){
  const h={'apikey':CONFIG.SUPABASE_KEY,'Authorization':'Bearer '+CONFIG.SUPABASE_KEY,'Content-Type':'application/json'};
  if(prefer)h['Prefer']=prefer; else if(method!=='GET')h['Prefer']='return=representation';
  const r=await fetch(CONFIG.SUPABASE_URL+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(!r.ok){const t=await r.text();throw new Error(t.slice(0,200)||('HTTP '+r.status));}
  if(r.status===204)return null;
  const t=await r.text(); return t?JSON.parse(t):null;
}
const sel=(t,q)=>api('GET',t+'?'+q);
const upd=(t,q,b)=>api('PATCH',t+'?'+q,b);
const ins=(t,b)=>api('POST',t,b);

async function alog(target,action,detail){
  try{await ins('pnl_access_log',{actor:(S.user&&S.user.username)||'?',target_user:target,action,detail:(detail||'').slice(0,300)});}catch(e){}
}

/* ---------- แผนสิทธิ์ ---------- */
function permOf(u,app,screen){ // คืนสตริงแฟล็ก เช่น 'vae'
  if(!u)return '';
  if(u.role==='admin')return 'vaed';
  const a=(u.apps||{})[app]; if(!a)return '';
  return a[screen]||'';
}
function appOn(u,app){ // เข้าแอพนี้ได้ไหม (มีอย่างน้อย 1 หน้าจอที่เห็นได้)
  if(!u)return false;
  if(u.role==='admin')return true;
  const a=(u.apps||{})[app]; if(!a)return false;
  return Object.values(a).some(v=>String(v).includes('v'));
}
function countScreens(u,app){
  if(!u)return 0;
  if(u.role==='admin')return Object.keys(APPS[app].s).length;
  const a=(u.apps||{})[app]||{};
  return Object.keys(APPS[app].s).filter(k=>String(a[k]||'').includes('v')).length;
}

/* ============ Render หลัก ============ */
function go(t){
  S.tab=t;
  ['users','survey','matrix','log'].forEach(x=>{const b=$('#tb_'+x);if(b)b.classList.toggle('on',x===t);});
  render();
}
async function render(){
  const el=$('#main');
  el.innerHTML='<div class="spin"></div>';
  try{
    if(S.tab==='users')      el.innerHTML=await viewUsers();
    else if(S.tab==='survey')el.innerHTML=await viewSurvey();
    else if(S.tab==='matrix')el.innerHTML=await viewMatrix();
    else                     el.innerHTML=await viewLog();
  }catch(e){
    el.innerHTML='<div class="card"><div class="empty">โหลดข้อมูลไม่สำเร็จ<br><span style="font-size:12px">'+esc(e.message)+'</span><br><br>'+
      '<button class="btn" onclick="render()">ลองใหม่</button></div></div>';
  }
}

async function loadUsers(force){
  if(S.users.length&&!force)return S.users;
  S.users=await sel('pnl_users','select=*&order=role.desc,username&limit=1000');
  return S.users;
}

      '<span style="font-size:12px">ถ้าต้องการจำกัดสิทธิ์ ให้เปลี่ยนบทบาทเป็น "พนักงาน" ก่อน (ปุ่ม ✏️)</span></div>'+

    '<p class="sub">ติ๊ก <b>เปิดแอพ</b> เพื่อให้เข้าระบบนั้นได้ แล้วเลือกสิทธิ์รายหน้าจอ — ไม่ติ๊ก "ดู" = ซ่อนหน้านั้นไปเลย<br>'+

    '<div style="max-height:56vh;overflow-y:auto;padding-right:4px">'+boxes+'</div>'+

function appBox(k,u){
  const A=APPS[k], on=appOn(u,k), scr=Object.keys(A.s);
  const head='<div class="apphead" onclick="this.parentNode.classList.toggle(\'open\')">'+
    '<span class="ic">'+A.ic+'</span><span class="nm">'+esc(A.n)+'</span>'+
    '<span class="cnt" id="cnt_'+k+'">'+(on?countScreens(u,k)+'/'+scr.length+' หน้า':'ปิด')+'</span>'+
    '<span class="arw">▶</span></div>';
  const quick='<div class="quick">'+
    '<button type="button" onclick="bulk(\''+k+'\',\'vaed\')">เปิดทุกหน้า ทุกสิทธิ์</button>'+
    '<button type="button" onclick="bulk(\''+k+'\',\'v\')">ดูอย่างเดียวทุกหน้า</button>'+
    '<button type="button" onclick="bulk(\''+k+'\',\'vae\')">ดู+เพิ่ม+แก้ (ห้ามลบ)</button>'+
    '<button type="button" onclick="bulk(\''+k+'\',\'\')">ปิดแอพนี้</button></div>';
  const hd='<div class="prow hd"><span>หน้าจอ</span>'+FLAGS.map(f=>'<span class="cc">'+f[1]+'</span>').join('')+'<span class="cc">ซ่อน</span></div>';
  const body=scr.map(sc=>{
    const cur=permOf(u,k,sc);
    const cells=FLAGS.map(f=>'<span class="cc"><input type="checkbox" data-k="'+k+'" data-s="'+sc+'" data-f="'+f[0]+'"'+
      (cur.includes(f[0])?' checked':'')+' onchange="flagChg(this)"></span>').join('');
    return '<div class="prow"><span class="nm">'+esc(A.s[sc])+'</span>'+cells+
      '<span class="cc"><input type="radio" name="hide_'+k+'_'+sc+'" data-k="'+k+'" data-s="'+sc+'"'+
      (cur===''?' checked':'')+' onclick="hideScr(\''+k+'\',\''+sc+'\')"></span></div>';
  }).join('');
  return '<div class="appbox'+(on?' open':'')+'" id="box_'+k+'">'+head+
    '<div class="appbody"><p class="sub" style="margin:8px 0 2px">'+esc(A.d)+'</p>'+quick+hd+body+'</div></div>';
}
function flagChg(el){
  const k=el.dataset.k, sc=el.dataset.s, f=el.dataset.f;
  const box=$('#box_'+k);
  const get=ff=>box.querySelector('input[type=checkbox][data-s="'+sc+'"][data-f="'+ff+'"]');
  if(el.checked&&f!=='v'){const v=get('v'); if(v&&!v.checked)v.checked=true;}       // เพิ่ม/แก้/ลบ ต้องเห็นหน้าก่อน
  if(!el.checked&&f==='v'){FLAGS.forEach(x=>{if(x[0]!=='v'){const c=get(x[0]);if(c)c.checked=false;}});} // ไม่เห็น = ทำอะไรไม่ได้
  syncDraft(k);
}
function hideScr(k,sc){
  const box=$('#box_'+k);
  FLAGS.forEach(f=>{const c=box.querySelector('input[type=checkbox][data-s="'+sc+'"][data-f="'+f[0]+'"]');if(c)c.checked=false;});
  syncDraft(k);
}
function bulk(k,val){
  const box=$('#box_'+k);
  box.querySelectorAll('input[type=checkbox][data-k="'+k+'"]').forEach(c=>{c.checked=val.includes(c.dataset.f);});
  box.querySelectorAll('input[type=radio][data-k="'+k+'"]').forEach(r=>{r.checked=(val==='');});
  syncDraft(k);
  if(val!=='')box.classList.add('open');
}
function syncDraft(k){
  const box=$('#box_'+k); const A=APPS[k]; const out={};
  Object.keys(A.s).forEach(sc=>{
    let fl='';
    FLAGS.forEach(f=>{const c=box.querySelector('input[type=checkbox][data-s="'+sc+'"][data-f="'+f[0]+'"]');if(c&&c.checked)fl+=f[0];});
    if(fl)out[sc]=fl;
    const rd=box.querySelector('input[type=radio][data-s="'+sc+'"]'); if(rd)rd.checked=(fl==='');
  });
  if(Object.keys(out).length)S.draft[k]=out; else delete S.draft[k];
  const n=Object.values(out).filter(v=>v.includes('v')).length;
  const c=$('#cnt_'+k); if(c)c.textContent=n?(n+'/'+Object.keys(A.s).length+' หน้า'):'ปิด';
}
async function savePerms(){
  const u=S.users.find(x=>x.id===S.editId); if(!u)return;
  APPKEYS.forEach(k=>{if($('#box_'+k))syncDraft(k);});
  try{
    await upd('pnl_users','id=eq.'+u.id,{apps:S.draft});
    const opened=APPKEYS.filter(k=>S.draft[k]&&Object.values(S.draft[k]).some(v=>v.includes('v')));
    await alog(u.username,'แก้สิทธิ์','เปิดแอพ: '+(opened.map(k=>APPS[k].n).join(', ')||'— ไม่มี —'));
    closeModal(); toast('บันทึกสิทธิ์ของ '+(u.display_name||u.username)+' แล้ว ✓'); render();
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message,true);}
}

        '<option value="staff"'+(u.role!=='admin'?' selected':'')+'>พนักงาน (กำหนดสิทธิ์รายแอพ)</option>'+
        '<option value="admin"'+(u.role==='admin'?' selected':'')+'>ผู้ดูแลระบบ (ทุกสิทธิ์ทุกแอพ)</option></select></label>'+
    '</div>'+
    '<label class="fld" style="display:flex;gap:9px;align-items:center"><input type="checkbox" id="fAct" '+(u.active!==false?'checked':'')+' style="width:18px;height:18px"><span style="margin:0">เปิดใช้งานบัญชีนี้</span></label>'+
    '<div class="mbtn"><button class="btn" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn pri" onclick="saveUser('+(id||'null')+')">💾 บันทึก</button></div>');
}
async function saveUser(id){
  const name=($('#fName').value||'').trim(), uname=($('#fUser').value||'').trim();
  const pass=$('#fPass').value||'', role=$('#fRole').value, active=$('#fAct').checked;
  if(!name||!uname){toast('ใส่ชื่อและ username ก่อนครับ',true);return;}
  try{
    if(id){
      const u=S.users.find(x=>x.id===id);
      const body={display_name:name,role,active};
      if(pass){if(pass.length<4){toast('รหัสผ่านอย่างน้อย 4 ตัว',true);return;} body.pass_hash=pwHash(u.username,pass);}
      await upd('pnl_users','id=eq.'+id,body);
      await alog(u.username,'แก้ข้อมูลผู้ใช้',(pass?'เปลี่ยนรหัสผ่าน · ':'')+'บทบาท: '+role+(active?'':' · ปิดใช้งาน'));
    }else{
      if(pass.length<4){toast('รหัสผ่านอย่างน้อย 4 ตัว',true);return;}
      await ins('pnl_users',{username:uname,display_name:name,pass_hash:pwHash(uname,pass),role,active,perms:{},apps:{}});
      await alog(uname,'เพิ่มผู้ใช้','บทบาท: '+role);
    }
    closeModal(); toast('บันทึกแล้ว ✓'); render();
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message,true);}
}

    '<div class="grid2" style="gap:14px">'+
      '<div class="appbox open" style="margin:0"><div class="apphead" style="cursor:default"><span class="ic">📒</span><span class="nm">บัญชีกลาง (pnl_users)</span><span class="cnt">'+us.length+' คน</span></div>'+
      '<div class="appbody" style="display:block"><p class="sub" style="margin:8px 0">ใช้ร่วมกันแล้วโดย: P&amp;L · Owner · Payroll · Social · Calendar · Invoice</p>'+

      '<div class="appbox open" style="margin:0"><div class="apphead" style="cursor:default"><span class="ic">🔐</span><span class="nm">ระบบที่ยังแยกบัญชี</span><span class="cnt">'+(us.length+(S.sc||[]).length+(S.au||[]).length)+' บัญชีรวมทุกที่</span></div>'+
      '<div class="appbody" style="display:block">'+
        '<p class="sub" style="margin:8px 0 10px">ทั้งร้านมีที่เก็บบัญชี 3 ที่ — ตัวเลขคือจำนวนที่ดึงมาได้จริงตอนนี้:</p>'+
        '<div style="font-size:13px;line-height:2.2">'+
        '<div>📒 <b>บัญชีกลาง</b> <code>pnl_users</code> — <b class="gold-txt">'+us.length+' คน</b> <span style="color:var(--mut)">(P&amp;L · Owner · Payroll · Social · Calendar · Invoice)</span></div>'+
        '<div>📦 <b>นับสต๊อก</b> <code>sc_users</code> — '+(S.scErr?'<span class="chip off">อ่านไม่ได้</span>':'<b class="gold-txt">'+S.sc.length+' คน</b>')+'</div>'+
        '<div>🍳 <b>ครัวกลาง</b> + 🛠️ <b>ซ่อมบำรุง</b> <code>app_users</code> — '+(S.auErr?'<span class="chip off">อ่านไม่ได้</span>':'<b class="gold-txt">'+S.au.length+' คน</b>')+'</div>'+
        '<div>📊 <b>KPI</b> — ไม่มีล็อกอิน (แท็บเล็ตหน้าร้าน)</div></div>'+
        (S.scErr||S.auErr?'<p class="sub" style="margin:10px 0 0;color:#F2A0A5">อ่านบางตารางไม่ได้ — ยังไม่ได้รัน <b>jjmk-access.sql</b> เวอร์ชันล่าสุดใน Supabase (เปิดสิทธิ์อ่านให้หน้านี้)</p>':'')+

    '</div></div>'+

    '<p class="sub">กด <b>⬇ นำเข้า</b> เพื่อสร้างบัญชีกลางชื่อเดียวกัน (ต้องตั้งรหัสผ่านใหม่) แล้วค่อยติ๊กสิทธิ์ในแท็บ "ผู้ใช้ &amp; สิทธิ์"</p>'+
    scBlock+'</div>'+

    '<p class="sub">สองระบบนี้ล็อกอินผ่าน Supabase Auth (อีเมล <code>ชื่อผู้ใช้@jjmk.local</code>) — คนละชุดกับบัญชีกลาง<br>'+
    'กด <b>⬇ นำเข้า</b> เพื่อสร้างบัญชีกลางชื่อเดียวกัน · บัญชี Supabase Auth เดิมยังใช้เข้า 2 ระบบนั้นได้ตามปกติจนกว่าจะย้ายระบบเสร็จ</p>'+
    auBlock+'</div>';
}
function importSc(username,display,role){
  openModal('<h3>⬇ นำเข้าบัญชี "'+esc(username)+'" เป็นบัญชีกลาง</h3>'+
    '<p class="sub">รหัสผ่านเดิมของระบบนับสต๊อกใช้ต่อไม่ได้ (คนละสูตรเข้ารหัส) — ตั้งรหัสใหม่ให้พนักงานคนนี้</p>'+
    '<label class="fld"><span>ชื่อที่แสดง</span><input id="fName" value="'+esc(display||username)+'"></label>'+
    '<label class="fld"><span>รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)</span><input id="fPass" type="password" autocomplete="new-password"></label>'+
    '<input type="hidden" id="fUser" value="'+esc(username)+'"><input type="hidden" id="fRole" value="'+esc(role)+'">'+
    '<div class="mbtn"><button class="btn" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn pri" onclick="doImport()">สร้างบัญชีกลาง</button></div>');
}
async function doImport(){
  const uname=$('#fUser').value, name=($('#fName').value||'').trim(), pass=$('#fPass').value||'', role=$('#fRole').value;
  if(pass.length<4){toast('รหัสผ่านอย่างน้อย 4 ตัว',true);return;}
  try{
    await ins('pnl_users',{username:uname,display_name:name||uname,pass_hash:pwHash(uname,pass),role,active:true,perms:{},apps:{}});
    await alog(uname,'นำเข้าบัญชี','จากระบบนับสต๊อก (sc_users)');
    closeModal(); toast('นำเข้าบัญชี '+uname+' แล้ว ✓'); S.users=[]; render();
  }catch(e){toast('นำเข้าไม่สำเร็จ: '+e.message,true);}
}

/* ---------- แท็บ 3: ตารางสรุปสิทธิ์ ---------- */
async function viewMatrix(){
  const us=(await loadUsers()).filter(u=>u.active!==false);
  const head='<tr><th>ผู้ใช้</th>'+APPKEYS.map(k=>'<th style="text-align:center" title="'+esc(APPS[k].n)+'">'+APPS[k].ic+'</th>').join('')+'</tr>';
  const rows=us.map(u=>'<tr><td><b>'+esc(u.display_name||u.username)+'</b>'+
    (u.role==='admin'?' <span class="chip adm">admin</span>':'')+'</td>'+
    APPKEYS.map(k=>{
      const n=countScreens(u,k), tot=Object.keys(APPS[k].s).length;
      const c=n===0?'<span style="color:#5C4F45">–</span>'
        :n===tot?'<span style="color:var(--ok)">●</span>'
        :'<span style="color:var(--warn)" title="'+n+'/'+tot+' หน้า">◐</span>';
      return '<td style="text-align:center;font-size:15px">'+c+'</td>';
    }).join('')+'</tr>').join('');
  return '<div class="card"><h3>🗂 ใครเข้าแอพไหนได้บ้าง</h3>'+
    '<p class="sub"><span style="color:var(--ok)">●</span> เข้าได้ทุกหน้า · <span style="color:var(--warn)">◐</span> เข้าได้บางหน้า · – เข้าไม่ได้ · แสดงเฉพาะบัญชีที่เปิดใช้งาน</p>'+
    '<div class="twrap"><table>'+head+rows+'</table></div>'+
    '<p class="sub" style="margin:12px 0 0">'+APPKEYS.map(k=>APPS[k].ic+' '+esc(APPS[k].n)).join(' · ')+'</p></div>';
}

/* ---------- แท็บ 4: ประวัติ ---------- */
async function viewLog(){
  let rows=[];
  try{rows=await sel('pnl_access_log','select=*&order=created_at.desc&limit=200');}
  catch(e){return '<div class="card"><div class="empty">ยังอ่านประวัติไม่ได้ — รัน <b>jjmk-access.sql</b> ใน Supabase ก่อนครับ<br><span style="font-size:12px">'+esc(e.message)+'</span></div></div>';}
  const body=rows.map(r=>{
    const d=new Date(r.created_at);
    return '<tr><td style="white-space:nowrap;font-size:12px;color:var(--mut)">'+
      d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+'</td>'+
      '<td>'+esc(r.actor)+'</td><td><b>'+esc(r.target_user)+'</b></td>'+
      '<td>'+esc(r.action)+'</td><td style="font-size:12px;color:var(--ink2)">'+esc(r.detail||'')+'</td></tr>';
  }).join('');
  return '<div class="card"><h3>📜 ประวัติการแก้สิทธิ์ <span class="chip">'+rows.length+' รายการล่าสุด</span></h3>'+
    '<div class="twrap"><table><tr><th>เวลา</th><th>คนแก้</th><th>บัญชีที่ถูกแก้</th><th>ทำอะไร</th><th>รายละเอียด</th></tr>'+
    (body||'<tr><td colspan="5" class="empty">ยังไม่มีประวัติ</td></tr>')+'</table></div></div>';
}

/* ---------- ล็อกอิน ---------- */
async function initAuth(){
  const saved=JSON.parse(localStorage.getItem('jjpnl_auth')||'null');
  if(saved&&saved.u){
    try{
      const rows=await sel('pnl_users','select=*&active=is.true&username=eq.'+encodeURIComponent(saved.u));
      if(rows[0]&&rows[0].pass_hash===saved.h){ setUser(rows[0]); return true; }
    }catch(e){}
  }
  $('#login').classList.add('on');
  setTimeout(()=>{const el=$('#lgU');if(el)el.focus();},60);
  return false;
}
async function doLogin(){
  const u=($('#lgU').value||'').trim(), p=$('#lgP').value||'';
  if(!u||!p){$('#lgMsg').textContent='ใส่ชื่อผู้ใช้และรหัสผ่านก่อนครับ';return;}
  try{
    const rows=await sel('pnl_users','select=*&active=is.true&username=eq.'+encodeURIComponent(u));
    if(!rows[0]||rows[0].pass_hash!==pwHash(u,p)){$('#lgMsg').textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return;}
    if(rows[0].role!=='admin'){$('#lgMsg').textContent='หน้านี้เปิดให้เฉพาะผู้ดูแลระบบ (admin)';return;}
    localStorage.setItem('jjpnl_auth',JSON.stringify({u:rows[0].username,h:rows[0].pass_hash}));
    $('#login').classList.remove('on'); setUser(rows[0]); render();
  }catch(e){$('#lgMsg').textContent='เข้าสู่ระบบไม่สำเร็จ: '+e.message;}
}
function setUser(u){
  S.user=u;
  $('#uchip').innerHTML='👤 <b>'+esc(u.display_name||u.username)+'</b> · ผู้ดูแล <a class="back" style="margin-left:8px" onclick="logout()" href="javascript:">ออก</a>';
}
function logout(){localStorage.removeItem('jjpnl_auth');location.reload();}

/* ---------- start ---------- */
(async function(){
  const ok=await initAuth();
  if(!ok)return;
  if(S.user.role!=='admin'){
    $('#main').innerHTML='<div class="card"><div class="empty">🔒 หน้านี้เปิดให้เฉพาะผู้ดูแลระบบ (admin) เท่านั้น<br>'+
      '<a class="back" href="index.html">← กลับหน้าศูนย์รวมแอพ</a></div></div>';
    return;
  }
  render();
})();
</script>
