<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JJ เช็คสต๊อก · จริงใจหมูกระทะ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#C62127;--dk:#7E1013;--wine:#6B0F12;--ink:#2E2119;--mut:#8A7A66;--line:#E8DFCC;--card:#FFFDF7;--bg:#F6F1E5;--green:#1F7A43;--amber:#A66A00;--blue:#5B7FA6;--gold:#E5B03C;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Sarabun','Noto Sans Lao','Noto Sans Myanmar',sans-serif;-webkit-tap-highlight-color:transparent}
html[lang="lo"] *{font-family:'Noto Sans Lao','Sarabun',sans-serif}
html[lang="my"] *{font-family:'Noto Sans Myanmar','Sarabun',sans-serif;line-height:1.55}
html,body{overscroll-behavior-y:contain}   /* กันเบราว์เซอร์มือถือรีโหลดทั้งหน้าเอง — ใช้ตัวลากลงของแอพแทน */
body{background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:86px}
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--dk),#690C0F);color:#fff;padding:10px 16px 8px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hrow{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-family:'Prompt';font-size:17px;font-weight:700;white-space:nowrap}
.seg{display:flex;gap:6px}
.seg button{padding:7px 14px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#F2DCDC;font-weight:700;font-size:13.5px;font-family:'Prompt';cursor:pointer}
.seg button.on{background:#fff;color:var(--dk)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{padding:7px 13px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#F2DCDC;font-weight:700;font-size:13px;font-family:'Prompt';cursor:pointer}
.tabs button.on{background:var(--gold);color:#5A3E00}
header input[type=date],header input[type=text]{padding:7px 9px;border:0;border-radius:10px;font-size:13.5px}
/* ---- แถบแผนก (pills) ---- */
.deptbar{position:sticky;top:0;z-index:25;background:var(--bg);border-bottom:3px solid var(--gold);padding:10px 16px 8px}
.deptbar .in{max-width:1220px;margin:0 auto}
#pills{display:flex;flex-direction:column;gap:3px}
.zrow{display:flex;align-items:flex-start;gap:10px}
.zlb{flex:none;font-family:'Prompt';font-weight:700;font-size:12px;color:var(--wine);background:#F6E7E7;border-radius:8px;padding:7px 11px;margin-top:2px;white-space:nowrap}
.zsel{margin-left:6px;padding:5px 8px;border:1.5px solid var(--line);border-radius:9px;font-size:12px;background:#fff;font-family:'Sarabun'}
.hlogo{width:28px;height:28px;border-radius:9px;border:1.5px solid #E9B44C;object-fit:cover;vertical-align:-7px;margin-right:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:4px}
@media(max-width:640px){.pills{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}}
.pill{flex:none;display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:99px;border:1.8px solid var(--wine);background:#fff;color:var(--wine);font-family:'Prompt';font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--wine);color:#fff}
.pill .bdg{background:#F6E7E7;color:var(--wine);border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:700}
.pill.on .bdg{background:rgba(255,255,255,.22);color:#fff}
.pill .ok{color:var(--green);font-size:13px}
.pill.on .ok{color:#B9E8C5}
.srch{width:100%;padding:11px 16px;border:1.5px solid var(--line);border-radius:99px;font-size:15px;background:#fff;margin-top:4px}
main{max-width:1220px;margin:0 auto;padding:14px 16px}
.dhead{display:flex;align-items:center;gap:12px;margin:6px 0 14px;font-family:'Prompt';font-weight:700;font-size:17px;color:var(--wine)}
.dhead::after{content:'';flex:1;height:2px;background:var(--gold);border-radius:2px}
.note{background:#FDF6E7;border:1.5px dashed #D9BE85;border-radius:12px;padding:8px 14px;font-size:12.5px;color:#7A6234;margin-bottom:12px}
/* ---- การ์ดนับ ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:#fff;border:1.8px solid var(--wine);border-radius:var(--r);padding:12px 14px}
.pcard.done{border-color:#9DBFA6;background:#FBFDFA}
.pcard .top{display:flex;align-items:flex-start;gap:10px}
.pimg{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#F3ECE0;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:1px solid var(--line);flex:none}
.pcard .t{font-family:'Prompt';font-weight:700;font-size:15px}
.pcard .st-n{font-size:11.5px;color:var(--amber);font-weight:700}
.pcard .st-y{font-size:11.5px;color:var(--green);font-weight:700}
.pcard .cn{font-size:11.5px;color:var(--blue)}
.pcard .cam{margin-left:auto;border:0;background:none;font-size:15px;cursor:pointer;opacity:.5}
.pcard .mid{display:flex;align-items:center;gap:8px;margin-top:12px}
.chip{border:1.5px solid var(--line);background:#FBF6EA;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--wine)}
.step{display:flex;gap:6px;margin-left:auto;align-items:center}
.step button{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:#FBF6EA;color:var(--mut);font-size:19px;cursor:pointer}
.step button.plus{background:var(--wine);border-color:var(--wine);color:#fff}
.step input{width:64px;height:40px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;text-align:center;background:#FBF6EA}
.step input.has{border-color:var(--green);background:#F0F8F1;font-weight:700}
.pcard .bot{display:flex;align-items:center;margin-top:10px}
.pcard .bst{font-size:12.5px;color:var(--mut)}
.pcard .bst b{color:var(--green)}
.outb{margin-left:auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 16px;font-size:13px;color:var(--mut);cursor:pointer}
.outb.on{background:#FBEAEA;border-color:#E4A6A6;color:var(--red);font-weight:700}
/* ---- หน้าผูกชื่อ / Safety ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card>.h{display:flex;align-items:center;gap:9px;padding:11px 15px;font-family:'Prompt';font-weight:700;font-size:15px;background:#FBF6EA;border-bottom:1px solid #F0E8D6}
.card>.h .n{margin-left:auto;font-size:12px;color:var(--mut);font-weight:600}
.lrow{display:grid;grid-template-columns:46px minmax(160px,1fr) minmax(160px,1fr) 130px;gap:10px;align-items:center;padding:8px 15px;border-bottom:1px solid #F5EFE1;font-size:14px}
.lrow:last-child{border-bottom:0}
.lhd{display:grid;grid-template-columns:46px minmax(160px,1fr) minmax(160px,1fr) 130px;gap:10px;padding:7px 15px;font-size:11px;color:var(--mut);font-weight:700;border-bottom:1px solid #F2EBDB}
.okt{color:var(--green);font-weight:700;font-size:12.5px}
.wat{color:var(--amber);font-weight:700;font-size:12.5px}
.hd2,.row2{display:grid;grid-template-columns:46px minmax(190px,1fr) 150px 90px 90px 90px;gap:10px;align-items:center;padding:8px 15px}
.hd2{font-size:11px;color:var(--mut);font-weight:700;border-bottom:1px solid #F2EBDB;padding:7px 15px}
.row2{border-bottom:1px solid #F5EFE1}
.row2:last-child{border-bottom:0}
.nm .t{font-weight:700;font-size:14.5px}
.nm .s{font-size:11.5px;color:var(--mut)}
.nm .s .cn{color:var(--blue)}
.ri{width:100%;max-width:86px;padding:8px 6px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;text-align:center;background:#fff}
.ri.dirty{border-color:var(--amber);background:#FFFBEF;font-weight:700}
.di{width:100%;padding:8px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;background:#fff}
.di.dirty{border-color:var(--amber);background:#FFFBEF}
.zsel.dirty{border-color:var(--amber);background:#FFFBEF}
@keyframes jjblink{0%,100%{box-shadow:0 0 0 0 rgba(198,33,39,.55);border-color:var(--red)}50%{box-shadow:0 0 0 5px rgba(198,33,39,0);border-color:#EFAFAF}}
.needlink{border-color:var(--red)!important;background:#FFF4F4;animation:jjblink 1.1s ease-in-out infinite}
.card.ovok{overflow:visible}   /* การ์ดที่มีกล่องเลือกกลุ่มไลน์ — ไม่งั้นเมนูโดนตัด */
.gpick{position:relative}
.gpbtn{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:9px;padding:7px 9px;font-family:'Sarabun';font-size:13px;color:var(--ink);cursor:pointer}
.gpbtn:hover{border-color:var(--wine)}
.gpbtn .cv{margin-left:auto;font-size:10px;opacity:.7;flex:none}
.gpmenu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1.5px solid var(--line);border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.2);z-index:60;padding:6px;max-height:300px;overflow:auto}
.gpitem{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;
  font-family:'Sarabun';font-size:13px;color:var(--ink);cursor:pointer;white-space:normal}
.gpitem:hover{background:#FBF6EA}
.gpitem.on{background:#FBF6EA}
.gpitem.on .gpn{font-weight:700;color:var(--wine)}
.gpu{color:var(--red);font-weight:700}
.gpf{color:#24466F;font-weight:700}
@media(prefers-reduced-motion:reduce){.needlink{animation:none}}
@keyframes jjblink2{0%,100%{box-shadow:0 0 0 0 rgba(198,33,39,.45)}50%{box-shadow:0 0 0 6px rgba(198,33,39,0)}}
.pill.needc{border-color:var(--red);animation:jjblink2 1.4s ease-in-out infinite}
.pill.needc .bdg{background:#FBE3E3;color:var(--red)}
.pill.needc.on{background:var(--red);border-color:var(--red)}
.pcard.needc{border-color:var(--red);animation:jjblink2 1.6s ease-in-out infinite}
.ovl{position:fixed;inset:0;background:rgba(30,18,10,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.ovl.on{display:flex}
.ovlbox{background:var(--card);border-radius:16px;width:min(620px,100%);max-height:88vh;overflow:auto;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.ovlbox h3{font-family:'Prompt';font-size:17px;margin-bottom:4px}
.ovlbox .mrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:7px;background:#fff}
.ovlbox .mrow.off{opacity:.55}
.ovlbox .mrow .nm{flex:1;font-size:13.5px}
.ovlbox .mrow .nm small{display:block;color:var(--mut);font-size:11px}
.ovlbox .seg2{display:flex;gap:8px;margin:10px 0}
.ovlbox .seg2 button{flex:1;padding:11px 10px;border-radius:12px;border:1.8px solid var(--line);background:#fff;font-family:'Prompt';font-weight:700;font-size:13.5px;cursor:pointer;color:var(--mut)}
.ovlbox .seg2 button.on{border-color:var(--wine);background:#FBF6EA;color:var(--wine)}
.ovlfoot{display:flex;gap:9px;margin-top:12px}
.ovlfoot button{flex:1;padding:12px;border-radius:12px;border:0;font-family:'Prompt';font-weight:700;font-size:14.5px;cursor:pointer}
.ovlfoot .go{background:var(--red);color:#fff}
.ovlfoot .go:disabled{opacity:.5}
.ovlfoot .cx{background:#EFE7D6;color:var(--ink)}
#langBox{position:relative;margin-left:auto;order:2;flex:none}
#langBox .flag{width:24px;height:17px;border-radius:3px;object-fit:cover;flex:none;display:block;
  box-shadow:0 0 0 1px rgba(0,0,0,.16),0 1px 2px rgba(0,0,0,.18);background:#EFE7D6}
#langBtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;
  border-radius:99px;padding:6px 12px 6px 7px;font-family:'Prompt';font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;
  transition:background .15s,box-shadow .15s}
#langBtn:hover{background:rgba(255,255,255,.26);box-shadow:0 2px 10px rgba(0,0,0,.18)}
#langBtn .cv{font-size:10px;opacity:.9;margin-left:1px}
#langMenu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid #EADFC8;border-radius:16px;
  box-shadow:0 16px 38px rgba(0,0,0,.26);z-index:120;min-width:218px;padding:6px;animation:langIn .13s ease-out}
@keyframes langIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#langMenu.on{display:block}
#langMenu button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;
  border-radius:11px;font-family:'Sarabun';font-size:14px;color:var(--ink);cursor:pointer}
#langMenu button+button{margin-top:2px}
#langMenu button:hover{background:#FBF6EA}
#langMenu button.on{background:#FBF6EA}
#langMenu .lnm{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0}
#langMenu .lnm b{font-size:15px;font-weight:600}
#langMenu .lnm i{font-style:normal;font-size:11px;color:#8A7F6B}
#langMenu button.on .lnm b{color:var(--wine);font-weight:700}
#langMenu .lck{color:var(--wine);font-weight:800;font-size:15px}
#trBar{position:fixed;left:50%;transform:translateX(-50%);top:8px;background:var(--wine);color:#fff;border-radius:99px;
  padding:6px 14px;font-size:12.5px;z-index:130;display:none}
#trBar.on{display:block}
.hbtns{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.obann{background:#EFF4FA;border:1.5px solid #B9CBE0;border-radius:12px;padding:9px 12px;margin-bottom:12px;color:#33517A}
.obhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13.5px}
.obhead .obsum{color:#4A6A93}
.obhead>.outb{margin-left:auto}
.obhead>.outb+.outb{margin-left:0}
.obrow{display:flex;gap:9px;align-items:flex-start;margin-top:8px}
.oblb{flex:none;font-size:11.5px;font-weight:700;background:#DDE7F2;border-radius:8px;padding:4px 9px;margin-top:2px}
.obchips{display:flex;flex-wrap:wrap;gap:6px}
.obchip{background:#fff;border:1.5px solid #B9CBE0;color:#24466F;border-radius:99px;padding:5px 11px;font-size:12.5px;font-family:'Sarabun';cursor:pointer;white-space:nowrap}
.obchip span{color:#6E8CB0;font-size:11.5px}
.obchip:hover{background:#DDE7F2}
.obchip.mut{border-color:var(--line);color:var(--mut);background:#FBF9F4}
@media(prefers-reduced-motion:reduce){.pill.needc,.pcard.needc{animation:none}}
.brchip{display:inline-flex;align-items:center;gap:5px;background:#F2EDE0;border:1.5px solid var(--line);color:var(--mut);border-radius:99px;padding:4px 10px;font-size:12px;margin:2px 3px 2px 0}
.brchip.on{background:#EAF4EC;border-color:#9DBFA6;color:#2E5B3C;font-weight:700}
.brchip button{border:0;background:none;color:var(--red);cursor:pointer;font-size:12px;padding:0 1px;font-weight:700}
.lrow.dim{opacity:.62}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px;margin-bottom:13px}
.dtile{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.dtile .ic{font-size:23px;flex:none}
.dtile .lb{font-size:12px;color:var(--mut);font-weight:600}
.dtile .v{font-family:'Prompt';font-weight:700;font-size:22px;line-height:1.15}
.dtile .sb{font-size:11.5px;color:var(--mut)}
.pbar{height:9px;background:#EFE7D6;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px}
.bchip{display:inline-block;background:#F1E7D2;border:1.5px solid #D9BE85;color:#6B4E14;border-radius:9px;padding:6px 12px;font-weight:700;font-size:13.5px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(0,0,0,.07);z-index:20}
.foot .in{max-width:1220px;margin:0 auto;display:flex;gap:12px;align-items:center}
.foot .st{flex:1;font-size:13.5px;color:var(--mut)}
.foot .st b{color:var(--ink)}
.savebtn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-family:'Prompt';font-weight:700;font-size:15px;box-shadow:0 3px 10px rgba(198,33,39,.3);cursor:pointer}
.savebtn:disabled{opacity:.5}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#ctl input[type=text]{padding:7px 9px;border:0;border-radius:10px;font-size:13.5px;width:110px}
#sideNav #ctl{flex-direction:column;align-items:stretch;margin:6px 0 12px;gap:7px}
#sideNav #ctl input{width:100%;border:0}
.clb{display:none}
#sideNav #ctl .clb{display:block;font-family:'Prompt';font-weight:600;font-size:10.5px;color:#F2DCDC;opacity:.8;letter-spacing:.06em;margin:2px 2px -2px}
#sideNav #ctl input[type=date]{background:rgba(255,255,255,.14);color:#fff;font-family:'Prompt';font-weight:600;font-size:14px;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.22);color-scheme:dark;cursor:pointer}
#sideNav #ctl input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.9;cursor:pointer}
#sideNav #ctl input[type=date]:hover{background:rgba(255,255,255,.2)}
#sideNav #ctl input[type=text]{background:rgba(255,255,255,.14);color:#fff;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.22);font-size:14px}
#sideNav #ctl input[type=text]::placeholder{color:rgba(255,255,255,.55)}
header #ctl input[type=date]{border-radius:10px;padding:7px 9px;font-size:13.5px;border:0}
#sideNav #ctl .seg button{flex:1}
#cfgBox{margin-top:auto}
#cfgSub{display:none;margin:2px 0 4px}
#cfgSub.on{display:block}
.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.stb{padding:9px 14px;border-radius:99px;border:1.8px solid var(--wine);background:#fff;color:var(--wine);font-family:'Prompt';font-weight:700;font-size:13.5px;cursor:pointer}
.stb.on{background:var(--wine);color:#fff}
@media(min-width:821px){
  .subtabs{display:none}
  #sideNav .ni .ic{flex:none;width:22px;text-align:center;font-size:15px}
  #sideNav .ni.head.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
  #sideNav .ni.sub{font-size:13.5px;font-weight:600;color:#EFD9D9;padding:9px 10px 9px 12px;margin:2px 0 2px 14px;
    border-left:2px solid rgba(255,255,255,.2);border-radius:0 10px 10px 0;line-height:1.35}
  #sideNav .ni.sub .ic{width:20px;font-size:14px}
  #sideNav .ni.sub:hover{background:rgba(255,255,255,.08);color:#fff}
  #sideNav .ni.sub.on{background:rgba(255,255,255,.2);color:#fff;border-left-color:var(--gold);box-shadow:none}
}
#uchip{display:none;color:#F2DCDC;font-size:12.5px;padding:10px 4px 2px;border-top:1px solid rgba(255,255,255,.15)}
#uchip b{color:#fff}
#uchip a{color:#F1C40F;cursor:pointer;font-weight:700;margin-left:8px}
#loginOv{position:fixed;inset:0;background:linear-gradient(180deg,#7E1013,#4E090B);z-index:100;display:none;align-items:center;justify-content:center}
#loginOv.on{display:flex}
.lgcard{background:#fff;border-radius:18px;padding:26px 24px;width:min(92vw,360px);text-align:center}
.lgcard img{width:64px;height:64px;border-radius:16px;border:2px solid #E9B44C;margin-bottom:8px}
.lgcard h2{font-family:'Prompt';font-size:18px;margin-bottom:12px}
.lgcard input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;margin-bottom:9px}

/* ---------- ล็อกอิน + สิทธิ์ (sc_users): เห็นบางสาขา · นับได้บางแผนก ---------- */
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const enc=new TextEncoder().encode(str);
  const l=enc.length, bitLen=l*8;
  const withOne=l+1, total=(Math.ceil((withOne+8)/64))*64;
  const M=new Uint8Array(total); M.set(enc); M[l]=0x80;
  const dv=new DataView(M.buffer);
  dv.setUint32(total-4, bitLen>>>0); dv.setUint32(total-8, Math.floor(bitLen/4294967296));
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  const w=new Array(64);
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){
      const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3);
      const s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[t]+w[t])>>>0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}

function trFill(tpl,src){                                    // ใส่ตัวเลขของต้นฉบับกลับเข้าคำแปล

function trGet(t,map){ // คำแปลจากแคช (null = ยังไม่มี · '=' = ใช้ต้นฉบับ)

function trWant(t,map){ // ข้อความที่ต้องส่งไปแปลสำหรับ t (ปกติ = คีย์ตัดเลข · ถ้าคีย์มีแล้วแต่ใส่เลขกลับไม่ได้ → ส่งตัวเต็ม)

const trURL=(t,sl,tl)=>'https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q='+encodeURIComponent(t);
async function trGET(text,sl,tl){ // ยิงตัวแปล 1 ครั้ง (ลองซ้ำ 1 รอบถ้าเน็ตสะดุด/โดนจำกัด)

async function trChunkOnce(chunk,sl,tl,out,ans){ // แปล 1 ก้อน · คืน 'ok' | 'split' (บรรทัดไม่ตรง ต้องผ่าครึ่ง) | 'fail' (เน็ต/กูเกิลล้ม)

function trChunks(list){ // แบ่งก้อน ≤30 บรรทัด และ ≤1500 ตัวอักษร

async function trFetch(list,tl,onPart,ans){ // แยกก้อน: คำไทย sl=th · ไม่ใช่ไทย sl=auto · 4 worker ช่วยกัน · ก้อนที่ตอบไม่ตรงถูกผ่าครึ่งโยนกลับคิว · เสร็จก้อนไหนส่งคืนทันที

function trCollect(all){ // เก็บโหนด/แอตทริบิวต์ที่ยังไม่ได้แปล (all=true เอาทุกโหนดในขอบเขต)

function addDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);
  const p2=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function nextDow(ds,key){const want=DOW_EN.indexOf(key); if(want<0)return '';
  for(let i=1;i<=7;i++){const d2=addDays(ds,i); if(new Date(d2+'T12:00:00').getDay()===want)return d2;} return '';}
const dowTH=ds=>DOW_SH[DOW_EN[new Date(ds+'T12:00:00').getDay()]]||'';
const MON_TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(ds){const d=new Date(ds+'T12:00:00'); if(isNaN(+d))return ds||'-';
  return d.getDate()+' '+MON_TH[d.getMonth()]+' '+(d.getFullYear()+543)+' ('+dowTH(ds)+')';}
function rateOn(it,ds){const g=dayGrp(ds);return num(g===1?it.rate_fri:g===2?it.rate_we:it.rate_wk);}
const dowKey=ds=>DOW_EN[new Date(ds+'T12:00:00').getDay()];
const supAhead=x=>Math.max(0,Math.min(6,parseInt(x&&x.order_ahead,10)||0));
function deliveryDate(sup,cd){ // ของจะมาส่งวันไหน ถ้าสั่งวันนี้ (รวมโหมด "สั่งล่วงหน้า N วัน")
  const x=supSched(sup);
  if(!x)return {d:addDays(cd,1),od:cd,ahead:0,mode:'any',lead:1,unset:true};
  const m=supModeOf(x);
  if(m==='fixed'){
    const ah=supAhead(x);
    for(let k=0;k<=ah;k++){ const od=addDays(cd,k),dd=(x.schedule||{})[dowKey(od)];
      if(dd)return {d:nextDow(od,dd),od:od,ahead:k,mode:'fixed'}; }   // สั่งวันนี้แทนวันสั่งจริงที่จะถึงใน N วัน
    return {d:'',od:'',ahead:0,mode:'fixed'};
  }
  const l=parseInt(x.lead_days,10)>=1?parseInt(x.lead_days,10):1;
  return {d:addDays(cd,l),od:cd,ahead:0,mode:'any',lead:l};
}
function nextDeliveryAfter(sup,od,curD){ // ของ "ชุดถัดไป" จะมาวันไหน (หลังชุดที่สั่งรอบนี้)
  const x=supSched(sup); if(!x||!curD)return addDays(curD||od,1);
  if(supModeOf(x)==='fixed'){
    for(let k=1;k<=8;k++){ const d2=addDays(od,k),dd=(x.schedule||{})[dowKey(d2)];
      if(dd){ const del=nextDow(d2,dd); if(del>curD)return del; } }
    return addDays(curD,1);
  }
  return addDays(curD,1);   // สั่งได้ทุกวัน = พรุ่งนี้สั่งใหม่ได้ ของชุดนี้ครอบคลุม 1 วัน
}
function sumRate(it,from,to){ // ยอดใช้รวมช่วง [from, to) — to ไม่รวม
  let s=0,n=0; if(!from||!to)return {sum:0,days:0};
  for(let d2=from; d2<to && n<31; d2=addDays(d2,1),n++) s+=rateOn(it,d2);
  return {sum:+s.toFixed(3),days:n};
}
function covRange(from,days){ // "ส,อา" — ช่วงวันที่ของชุดนี้ต้องครอบคลุม
  const out=[]; for(let i=0,d2=from;i<days&&i<14;i++,d2=addDays(d2,1))out.push(dowTH(d2));
  return out.join(',');
}
function inTransit(sup,it,cd,delD){ // ของที่สั่งไว้แล้วและจะมาถึงก่อนชุดนี้ (จาก stock_receipts ของระบบเดิม)
  const rc=(S.recv||{})[it.id]; if(!rc||!delD)return 0;
  let s=0;
  Object.keys(rc).forEach(od=>{ if(od>=cd)return;                       // ใบสั่งของวันก่อนหน้า
    const dd=(deliveryDate(sup,od)||{}).d;
    if(dd&&dd>cd&&dd<delD)s+=num(rc[od]);                               // ยังไม่ถึงตอนนับ แต่มาก่อนชุดนี้
  });
  return +s.toFixed(3);
}
function orderPlan(){ // คิดใบสั่งของทุกซัพของสาขานี้ ณ วันขายที่เลือก

  const g={};

    (g[sp]=g[sp]||{sup:sp,rows:[]}).rows.push(it);
  });
  return Object.values(g).map(x=>{
    const dl=deliveryDate(x.sup,cd);
    const nx=dl.d?nextDeliveryAfter(x.sup,dl.od||cd,dl.d):'';   // ของชุดถัดไปมาวันไหน
    const gap=addDays(cd,1);                                     // นับตอนปิดร้าน = ยอดของวันขายนี้ถูกใช้ไปแล้ว
    const rows=x.rows.map(it=>{
      const have=counted(it)?(it.out?0:num(it.qty)):null;
      const cov=dl.d?sumRate(it,dl.d,nx||addDays(dl.d,1)):{sum:0,days:0};  // ต้องใช้ตั้งแต่วันของมา ถึงก่อนชุดหน้ามา
      const pre=dl.d?sumRate(it,gap,dl.d):{sum:0,days:0};                  // ใช้ไประหว่างรอของมาส่ง
      const need=cov.sum;
      const onWay=inTransit(x.sup,it,cd,dl.d);                             // ของที่สั่งไว้แล้วกำลังมาก่อนชุดนี้
      const left=have==null?null:Math.max(0,+(have-pre.sum+onWay).toFixed(3));  // ของที่จะเหลือตอนของชุดนี้มาถึง
      const order=(have==null||!need)?null:Math.max(0,+(need-left).toFixed(3));
      const b=buOf(billName(it));                         // หน่วยซื้อจากบิล (ถ้ามี)
      const bu=b?b.top:'';
      const c=bu&&!uSame(bu,it.unit)?(S.conv||{})[String(billName(it)).trim()+'|'+bu]:null;  // ชื่อพ้อง = หน่วยเดียวกัน ไม่ต้องแปลง
      const packs=(order&&c&&c.f)?Math.ceil(order/c.f):null;
      return {it,have,need,order,bu,factor:c?c.f:null,packs,cov,pre,left,onWay};
    }).sort((a,b2)=>((b2.order>0?1:0)-(a.order>0?1:0))||cmpItem(a.it,b2.it)); // ต้องสั่งขึ้นบน ที่เหลือลำดับเดียวกับเมนูอื่น
    const covDays=rows.length?(rows[0].cov.days||0):0;
    return {sup:x.sup,dl,rows,nx,covDays,
      covTxt:(dl.d&&covDays)?('ครอบคลุม '+covDays+' วัน ('+covRange(dl.d,covDays)+')'):'',
      nOrder:rows.filter(r=>r.order>0).length,
      nNoCount:rows.filter(r=>r.have==null&&r.need>0).length,
      nNoRate:rows.filter(r=>!r.need).length};
  }).sort((a,b2)=>(b2.nOrder-a.nOrder)||a.sup.localeCompare(b2.sup,'th'));
}
function orderText(sp){ // ฟอร์แมตใบสั่งที่ส่งเข้าไลน์ซัพ
  const g=(orderPlan()||[]).find(x=>x.sup===sp); if(!g)return '';
  const cd=($('#cd')&&$('#cd').value)||bizToday();
  const list=g.rows.filter(r=>r.order>0); if(!list.length)return '';
  const L=['🛒 จริงใจหมูกระทะ','🏪 สาขา'+BR_NAME[S.br],'🏷️ '+sp,
    '📅 สั่งวันที่ '+thDate(cd),'🚚 ส่งวันที่ '+(g.dl.d?thDate(g.dl.d):'-'),''];
  list.forEach(r=>{
    L.push('• '+billName(r.it)+' — '+fq(r.packs!=null?r.packs:r.order)+' '+(r.packs!=null?r.bu:(r.it.unit||''))
      +(r.packs!=null?(' (= '+fq(r.order)+' '+(r.it.unit||'')+')'):''));
  });
  L.push('','รวม '+list.length+' รายการ');
  return L.join('\n');
}

async function logReceipts(sp){ // upsert stock_receipts (แหล่งความจริงของ "สั่งจริง" ของระบบเดิม)

    +(test?' · ไม่ได้บันทึกยอดสั่ง':''),!!fail.length||!!noGrp);
  render();

        +(lineOf(key)&&lineOf(key).group_id?'📤 ส่งเข้าไลน์':'📤 ส่งไลน์ (ยังไม่ผูกกลุ่ม)')+'</button>':'')+'</div></div>';

      +(g.nNoCount?'<div class="lrow" style="grid-template-columns:1fr;font-size:12px;color:var(--amber)">⚠ ยังไม่ได้นับ '+g.nNoCount+' รายการ — ยอดสั่งยังไม่ครบ</div>':'')
      :'');
  }).join('');
  const totOrder=plan.reduce((a,g)=>a+g.nOrder,0);
  $('#list').innerHTML='<div class="dhead">🛒 สั่งของ · สาขา'+BR_NAME[S.br]+' · วันขาย '+esc(cd)+' ('+dowTH(cd)+')</div>'
    +'<div class="note"><b>ต้องสั่ง = ยอดใช้ตั้งแต่วันที่ของมาส่ง จนถึงก่อนของชุดถัดไปมา − ของที่จะเหลือตอนของมาถึง</b>'
    +'<div style="font-size:11.5px;margin-top:3px">ของที่จะเหลือ = ยอดนับได้ − ยอดใช้ระหว่างรอของมาส่ง + ของที่สั่งไว้แล้วกำลังมา · '
    +'เช่น สั่งศุกร์ ของมาเสาร์ ชุดหน้ามาจันทร์ → ต้องเผื่อ เสาร์+อาทิตย์</div>'
    +'<div style="font-size:11.5px;margin-top:2px">วันขายตัดรอบ 6 โมงเช้า · ตั้งอัตราใช้ที่ 🛟 Safety · รอบส่ง/สั่งล่วงหน้า ที่ 🚚 รอบสั่งซัพ</div></div>'
    +'<div class="lrow" style="grid-template-columns:1fr auto"><div><input class="di" id="ordQ" value="'+esc(S.ordQ||'')+'" placeholder="🔍 ค้นหาสินค้าในใบสั่ง" oninput="ordSearch(this.value)"></div>'
    +'<div style="font-size:13px;white-space:nowrap;padding-left:10px">รวมต้องสั่ง <b style="color:var(--red)">'+totOrder+'</b> รายการ</div>'
    +(plan.some(g=>g.nOrder)?'<div><button class="outb" style="background:#EAF4EC;border-color:#9DBFA6;color:#2E5B3C;font-weight:700;white-space:nowrap" onclick="sendAllOpen()">📤 ส่งทั้งหมด</button></div>':'<div></div>')+'</div>'
    +(secs||'<div class="empty">ยังไม่มีซัพในรายการสินค้าของสาขานี้</div>');
}
function toggleOrd(k){S.ordOpen=S.ordOpen||{};S.ordOpen[k]=!((S._ordNow||{})[k]);render();}

/* ---- 📊 แดชบอร์ด: สรุปสิ่งสำคัญของวัน ---- */
function renderDash(){
  const cd=($('#cd')&&$('#cd').value)||bizToday();
  const ds=deptList();
  const items=ds.reduce((a,d2)=>a.concat(d2.items),[]);
  const done=items.filter(counted).length,all=items.length;
  const out=items.filter(x=>x.out).slice().sort(cmpItem);
  const pct=all?Math.round(done*100/all):0;
  const unb=S.all.filter(p=>!S.map[p.id]).length;
  const noDept=S.all.filter(p=>!String(p.dept||'').trim()&&!String(p.cat_label||'').trim()).length;
  const noZone=ds.filter(d2=>!deptZone(d2.label)).length;
  const dirty=items.filter(it=>counted(it)&&(String(num(it.qty))+'|'+(it.out?1:0))!==it._saved).length;
  const tile=(ic,lb,v,sub,col)=>'<div class="dtile"><div class="ic">'+ic+'</div><div><div class="lb">'+lb+'</div>'
    +'<div class="v"'+(col?' style="color:'+col+'"':'')+'>'+v+'</div>'+(sub?'<div class="sb">'+sub+'</div>':'')+'</div></div>';
  const bar=(n,t)=>{const p3=t?Math.round(n*100/t):0;
    return '<div class="pbar"><i style="width:'+p3+'%;background:'+(p3===100?'var(--green)':p3>=50?'var(--gold)':'#E0A9A9')+'"></i></div>';};
  const deptRows=ds.map(d2=>{
    const dn=d2.items.filter(counted).length,dt=d2.items.length;
    return '<div class="lrow" style="grid-template-columns:minmax(120px,1fr) 1.4fr 96px;cursor:pointer" onclick="goCount(\''+esc(d2.label).replace(/'/g,"\\'")+'\')">'
      +'<div><b>'+(DEPT_IC[d2.label]||'🗂')+' '+esc(d2.label)+'</b>'+(deptZone(d2.label)?' <span style="font-size:11px;color:var(--mut)">'+esc(deptZone(d2.label))+'</span>':'')+'</div>'
      +'<div>'+bar(dn,dt)+'</div>'
      +'<div style="text-align:right;font-size:12.5px;'+(dn===dt&&dt?'color:var(--green);font-weight:700':'color:var(--mut)')+'">'+dn+'/'+dt+(dn===dt&&dt?' ✓':'')+'</div></div>';
  }).join('');
  const todo=[];
  if(dirty)todo.push('มียอดนับ <b>'+dirty+'</b> รายการที่ยังไม่ได้กดบันทึก');
  if(unb)todo.push('ยังไม่ผูกชื่อบิล <b>'+unb+'</b> รายการ (หน้า 🔗 ผูกชื่อ)');
  if(noZone)todo.push('ยังไม่จัดโซนหน้าร้าน/หลังร้าน <b>'+noZone+'</b> แผนก (⚙️ ตั้งค่า › แผนก)');
  if(noDept)todo.push('ยังไม่มีแผนก <b>'+noDept+'</b> รายการ');
  $('#list').innerHTML='<div class="dhead">📊 แดชบอร์ด · สาขา'+BR_NAME[S.br]+' · วันขาย '+esc(cd)+'</div>'
    +orderBanner()
    +'<div class="dgrid">'
    +tile('📋','นับแล้ววันนี้',done+'/'+all,pct+'% ของรายการทั้งหมด',pct===100?'var(--green)':'')
    +tile('⏳','ยังไม่ได้นับ',String(all-done),(all-done)?'กดดูรายแผนกด้านล่าง':'ครบแล้ว ✓',(all-done)?'var(--amber)':'var(--green)')
    +tile('🚫','ของหมดสต๊อก',String(out.length),out.length?out.slice(0,3).map(x=>esc(x.name)).join(', ')+(out.length>3?' …':''):'ไม่มี',out.length?'var(--red)':'')
    +tile('💾','ยังไม่บันทึก',String(dirty),dirty?'กดบันทึกที่หน้านับสต๊อก':'บันทึกครบแล้ว ✓',dirty?'var(--amber)':'var(--green)')
    +'</div>'
    +'<div class="card"><div class="h">🛒 ใบสั่งของวันนี้ <span class="n">คิดจาก ยอดใช้ของวันส่ง − ยอดนับได้</span></div>'
    +'<div class="lrow" style="grid-template-columns:1fr auto;cursor:pointer" onclick="setTab(\'order\')"><div>ซัพที่ต้องสั่งวันนี้ <b>'+orderPlan().filter(g=>g.nOrder).length+'</b> ราย · รวม <b>'+orderPlan().reduce((a,g)=>a+g.nOrder,0)+'</b> รายการ</div><div><button class="outb">เปิดหน้าสั่งของ →</button></div></div></div>'
    +(todo.length?'<div class="card"><div class="h">📝 งานที่ควรทำ</div>'
      +todo.map(t=>'<div class="lrow" style="grid-template-columns:1fr"><div>• '+t+'</div></div>').join('')+'</div>':'')
    +'<div class="card"><div class="h">📦 ความคืบหน้าการนับ รายแผนก <span class="n">แตะแผนกเพื่อไปนับ</span></div>'
    +(deptRows||'<div class="empty">ยังไม่มีสินค้าในสาขานี้</div>')+'</div>'
    +(out.length?'<div class="card"><div class="h">🚫 ของหมดวันนี้ <span class="n">'+out.length+' รายการ</span></div>'
      +out.map(x=>'<div class="lrow" style="grid-template-columns:44px 1fr 120px">'+imgCell(x)
        +'<div class="nm"><div class="t" style="font-size:13.5px">'+esc(x.name)+'</div><div class="s">'+esc(deptOf(x))+'</div></div>'
        +'<div style="text-align:right;font-size:12px;color:var(--mut)">'+esc(x.sup||'')+'</div></div>').join('')+'</div>':'');
}
function goCount(l){S.dept=l;localStorage.setItem('jjsc_dept',l);setTab('count');}
/* ---- 📋 หน้านับ: แถบแผนก + การ์ด ---- */
function renderCount(){
  const ds=deptList();
  if(!ds.length){$('#pills').innerHTML='';$('#list').innerHTML='<div class="empty">สาขานี้ยังไม่มีสินค้าในระบบนับ</div>';return;}
  if(!S.dept){const sv=localStorage.getItem('jjsc_dept');if(sv&&ds.some(d2=>d2.label===sv))S.dept=sv;}
  if(!S.dept||!ds.some(d2=>d2.label===S.dept))S.dept=ds[0].label;
  const pillHtml=dp=>{
    const done=dp.items.filter(counted).length,all=dp.items.length;
    return '<button class="pill'+(dp.label===S.dept?' on':'')+(done<all?' needc':'')+'" onclick="pickDept(\''+esc(dp.label).replace(/'/g,"\\'")+'\')">'
      +(DEPT_IC[dp.label]||'🗂')+' '+esc(dp.label)
      +' <span class="bdg">'+(done<all?(all-done):all)+'</span>'+(done===all?' <span class="ok">✓</span>':'')+'</button>';
  };
  const zoneOf=dp=>{const z=deptZone(dp.label);return (z==='หน้าร้าน'||z==='หลังร้าน')?z:null;};
  if((S.zoneOk||S.deptTbl)&&ds.some(zoneOf)){ // พื้นที่แบ่งโซน: หน้าร้าน / หลังร้าน (ตั้งโซนที่หน้า Safety)
    const zs={'หน้าร้าน':[],'หลังร้าน':[],'อื่นๆ':[]};
    ds.forEach(dp=>{zs[zoneOf(dp)||'อื่นๆ'].push(dp);});
    $('#pills').innerHTML=[['🏪 หน้าร้าน','หน้าร้าน'],['🍳 หลังร้าน','หลังร้าน'],['🗂 ยังไม่จัดโซน','อื่นๆ']]
      .filter(z=>zs[z[1]].length)
      .map(z=>'<div class="zrow"><span class="zlb">'+z[0]+'</span><div class="pills">'+zs[z[1]].map(pillHtml).join('')+'</div></div>').join('');
  }else{
    $('#pills').innerHTML='<div class="pills">'+ds.map(pillHtml).join('')+'</div>'
      +(S.user&&S.user.role==='admin'?'<div style="font-size:11px;color:var(--mut);margin-top:2px">ตั้งโซนหน้าร้าน/หลังร้านได้ที่ ⚙️ ตั้งค่า › แผนก</div>':'');
  }
  const q=S.q.trim();
  const show=(q?S.items.filter(matches):(deptList().find(d2=>d2.label===S.dept)||{items:[]}).items).slice().sort(cmpItem);
  const unb=S.all.filter(p=>!S.map[p.id]).length;
  const warns=(unb?'⚠ ยังไม่ผูกชื่อบิล '+unb+' รายการ (ยังนับได้ปกติ) — ผูก/แก้ชื่อได้ที่หน้า "ผูกชื่อ"':'')
    +(S.deptOk?(S.zoneOk?'':' · ⚠ รัน sql/jjmk_stockcheck_dept.sql ตัวอัปเดต เพื่อแบ่งโซนหน้าร้าน/หลังร้าน'):' · ⚠ ยังไม่ได้รัน sql/jjmk_stockcheck_dept.sql ใช้หมวดเดิมแทนแผนก');
  $('#list').innerHTML=
    '<div class="dhead">'+(q?('🔍 ผลค้นหา "'+esc(q)+'" (ทุกแผนก)'):(DEPT_IC[S.dept]||'🗂')+' '+esc(S.dept))+'</div>'
    +orderBanner()
    +(warns.replace(/^ · /,'')?'<div class="note">'+warns.replace(/^ · /,'')+'</div>':'')
    +(show.length?'<div class="grid">'+show.map(it=>{
      const cur=S.cur[it.id],cn=it.name!==billName(it),ok=counted(it);
      return '<div class="pcard'+(ok?' done':' needc')+'">'
        +'<div class="top">'+imgCell(it)
        +'<div><div class="t">'+esc(it.name)+' '+(ok?(it.out?'<span class="st-n" style="color:var(--red)">✗ หมด</span>':'<span class="st-y">✓ นับแล้ว</span>'):'<span class="st-n">⚠ ยังไม่นับ</span>')+'</div>'
        +(cn?'<div class="cn">🧾 บิล: '+esc(billName(it))+'</div>':'')
        +(!S.map[it.id]?'<div class="cn" style="color:var(--amber)">⚠ ยังไม่ผูกชื่อบิล</div>':'')
        +(onlySome(it.name)?'<div class="cn" style="color:var(--mut)">เฉพาะสาขา'+BR_NAME[S.br]+'</div>':'')+'</div>'
        +'<button class="cam" onclick="pickImg(\''+it.id+'\')">✏️</button></div>'
        +'<div class="mid"><span class="chip">'+esc(it.unit||'หน่วย')+'</span>'
        +'<div class="step"><button onclick="bump(\''+it.id+'\',-1)">−</button>'
        +'<input class="'+(it.qty!=null&&it.qty!==''?'has':'')+'" type="text" inputmode="decimal" value="'+(it.qty??'')+'" onchange="setQ(\''+it.id+'\',this.value)">'
        +'<button class="plus" onclick="bump(\''+it.id+'\',1)">+</button></div></div>'
        +'<div class="bot"><span class="bst">'+(ok?(it.out?'ของหมดสต๊อก':'นับได้ <b>'+it.qty+' '+esc(it.unit||'')+'</b>'):'ยังไม่นับ')+(cur?' · ครั้งก่อน '+cur.qty:'')+'</span>'
        +'<button class="outb'+(it.out?' on':'')+'" onclick="setOut(\''+it.id+'\')">หมด</button></div>'
        +'</div>';
    }).join('')+'</div>':'<div class="empty">ไม่พบ "'+esc(q)+'"</div>');
}
/* ---- 🔗 หน้าผูกชื่อ: ชื่อจริง (บิล) ↔ ชื่อนับ รายสาขา ---- */
function renderLink(){
  const q=(S.lnkQ||'').trim().toLowerCase();
  const hit=it=>!q||it.name.toLowerCase().includes(q)||String(billName(it)).toLowerCase().includes(q)||String(it.sup||'').toLowerCase().includes(q);
  const allOk=S.all.filter(it=>S.map[it.id]),allNo=S.all.filter(it=>!S.map[it.id]);
  const ok=allOk.filter(hit).slice().sort(cmpItem),no=allNo.filter(hit).slice().sort(cmpItem);
  const canEdit=!S.user||S.user.role==='admin';
  const row=it=>{const m=S.map[it.id];
    return '<div class="lrow">'+imgCell(it)
      +'<div><b>'+(m?esc(m.pnl_item):'–')+'</b><div style="font-size:11px;color:var(--mut)">ชื่อจริง (บิล P&L)</div></div>'
      +'<div><span id="cn_'+it.id+'">'+esc(it.name)
      +(canEdit?' <button class="outb" style="padding:3px 8px;font-size:12px" onclick="editCn(\''+it.id+'\')" title="แก้ชื่อนับ (มีผลทั้ง 2 สาขา)">✏️</button>':'')
      +'</span><div style="font-size:11px;color:var(--mut)">ชื่อนับ · '+esc(deptOf(it))+'</div></div>'
      +(m?'<span class="okt">✓ ผูกแล้ว</span>':'<span class="wat">⚠ ยังไม่ผูก</span>')+'</div>';};
  // การผูกต้องตรงกันทั้งสองทาง (เช็ครวม 2 สาขา):
  //   ชื่อบิลเดียวกัน → ต้องชี้ชื่อนับเดียว · ชื่อนับเดียวกัน → ต้องชี้ชื่อบิลเดียว
  const byBill={},byCnt={};
  (S.mapRows||[]).forEach(r=>{
    const b=String(r.pnl_item||'').trim(),c=String(r.product_name||'').trim();
    if(b)(byBill[b]=byBill[b]||new Set()).add(c);
    if(c)(byCnt[c]=byCnt[c]||new Set()).add(b);
  });
  const pick=m=>Object.keys(m).map(k=>[k,[...m[k]].filter(Boolean)]).filter(x=>x[1].length>1);
  const dup=pick(byBill),dup2=pick(byCnt);
  const dupCard=(title,rows,l1,l2,hint)=>'<div class="card"><div class="h">🚨 '+title+' <span class="n">'+rows.length+' ชื่อ (เช็ครวม 2 สาขา)</span></div>'
    +rows.map(x=>'<div class="lrow" style="grid-template-columns:minmax(140px,1fr) 2fr"><div><b>'+esc(x[0])+'</b><div style="font-size:11px;color:var(--mut)">'+l1+'</div></div>'
      +'<div>'+x[1].map(esc).join(' <span style="color:var(--red);font-weight:700">≠</span> ')+'<div style="font-size:11px;color:var(--mut)">'+l2+' — '+hint+'</div></div></div>').join('')+'</div>';
  const dupHtml=(dup.length||dup2.length)
    ?(dup.length?dupCard('ชื่อบิลเดียวกัน แต่ชื่อนับไม่ตรงกัน',dup,'ชื่อบิล','ชื่อนับที่พบ','ชื่อนับไม่ตรงกัน → <b>แก้ชื่อสินค้าในระบบ stock (แอพนับ)</b> ให้เหลือชื่อเดียว'):'')
      +(dup2.length?dupCard('ชื่อนับเดียวกัน แต่ชื่อบิลไม่ตรงกัน',dup2,'ชื่อนับ','ชื่อบิลที่พบ','ชื่อบิลไม่ตรงกัน → <b>แก้ในระบบ P&L</b> (เปลี่ยนชื่อบิลในบิล หรือแก้การผูกที่หน้า "ใช้จริง (สต๊อก)")'):'')
    :'<div class="note" style="border-color:#B9D9B0;background:#F0F8F1;color:#2E5B3C">✓ การผูกตรงกันหมดทั้งสองทาง (ชื่อบิล↔ชื่อนับ) ทั้ง 2 สาขา — ไม่มีตัวที่ต้องแก้</div>';
  $('#list').innerHTML=
    '<div class="dhead">🔗 การผูกชื่อ · สาขา'+BR_NAME[S.br]+'</div>'
    +dupHtml
    +'<div class="card" style="padding:10px 12px;margin-bottom:12px"><input class="di" id="lnkQ" value="'+esc(S.lnkQ||'')+'" placeholder="🔍 ค้นหาชื่อนับ / ชื่อบิล / ซัพ" oninput="lnkSearch(this.value)">'
    +(q?'<div style="font-size:12px;color:var(--mut);margin-top:5px">ผลค้นหา "'+esc(q)+'" — ผูกแล้ว '+ok.length+' · ยังไม่ผูก '+no.length+' รายการ</div>':'')+'</div>'
    +'<div class="note">ผูกแล้ว <b>'+allOk.length+'</b> / ทั้งหมด '+S.all.length+' รายการ · ตัวที่ยังไม่ผูกจะไม่ขึ้นหน้านับ — ไปผูกที่แอพ P&L หน้า "ใช้จริง (สต๊อก)" แล้วกลับมารีเฟรช</div>'
    +(no.length?'<div class="card"><div class="h">⚠ ยังไม่ผูก <span class="n">'+no.length+(q?' รายการที่ค้นเจอ':' รายการ')+'</span></div>'
      +'<div class="lhd"><span></span><span>ชื่อจริง (บิล)</span><span>ชื่อนับ</span><span></span></div>'+no.map(row).join('')+'</div>':'')
    +(ok.length?'<div class="card"><div class="h">✓ ผูกแล้ว <span class="n">'+ok.length+(q?' รายการที่ค้นเจอ':' รายการ')+'</span></div>'
    +'<div class="lhd"><span></span><span>ชื่อจริง (บิล)</span><span>ชื่อนับ</span><span></span></div>'+ok.map(row).join('')+'</div>'
    :(q&&!no.length?'<div class="empty">ไม่พบ "'+esc(q)+'"</div>':''));
}

function supObj(n){const e=S.supEdit=S.supEdit||{};
  if(!e[n]){const x=supSched(n)||{};
    e[n]={exists:!!supSched(n),mode:supModeOf(x),
      lead:(parseInt(x.lead_days,10)>=1?parseInt(x.lead_days,10):1),schedule:{...(x.schedule||{})},
      ahead:supAhead(x),prepay:!!x.prepay};}
  return e[n];}
function supSetMode(i,v){supObj(S.supList[i]).mode=v;render();}
function supSetLead(i,v){supObj(S.supList[i]).lead=Math.max(1,parseInt(v,10)||1);render();}
function supSetDay(i,k,v){const o=supObj(S.supList[i]);if(v)o.schedule[k]=v;else delete o.schedule[k];render();}
function supSetAhead(i,v){supObj(S.supList[i]).ahead=Math.max(0,Math.min(6,parseInt(v,10)||0));render();}
function supSetPrepay(i,v){supObj(S.supList[i]).prepay=!!v;render();}
async function supSave(i){
  const n=S.supList[i],o=supObj(n);
  const body={order_mode:o.mode,lead_days:o.lead,schedule:o.schedule,order_ahead:o.ahead|0,prepay:!!o.prepay};
  let warn='';
  try{
    const x0=supSched(n);
    if(!x0){toast('ไม่พบซัพ "'+n+'" ในตาราง suppliers ของระบบเดิม — เพิ่มชื่อซัพที่แอพนับเดิมก่อนครับ',true);return;}
    try{ await api('PATCH','suppliers?name=eq.'+encodeURIComponent(x0.name),body,'return=minimal'); }
    catch(e1){   // ยังไม่ได้รัน sql/jjmk_stockcheck_supflags.sql → ไม่มีคอลัมน์ใหม่ ให้บันทึกส่วนที่เหลือไปก่อน
      if(!/order_ahead|prepay|PGRST204|column/i.test(String(e1.message||e1)))throw e1;
      delete body.order_ahead; delete body.prepay;
      await api('PATCH','suppliers?name=eq.'+encodeURIComponent(x0.name),body,'return=minimal');
      warn=' — แต่ "สั่งล่วงหน้า/จ่ายก่อนส่ง" ยังไม่ได้ เพราะยังไม่ได้รัน sql/jjmk_stockcheck_supflags.sql';
    }
    o.exists=true; Object.assign(x0,body);
    toast((warn?'⚠ ':'✅ ')+'บันทึกรอบสั่ง '+n+(warn||' — โฟลว์สั่งของแอพนับใช้ค่านี้ด้วย'),!!warn); render();

}

async function delProd(id){ // เอาสินค้าออกจากสาขาเดียว (soft delete)
  const r=(S.allBr||[]).find(x=>x.id===id); if(!r)return;

async function syncLineGroups(auto){ // ดึงกลุ่มที่บอทอยู่ + อัปเดตชื่อกลุ่ม (Edge Function ของระบบเดิม)
  if(S._lgSyncing)return; S._lgSyncing=true;
  if(!auto)toast('⏳ กำลังดึงชื่อกลุ่มจากไลน์...');
  const before={}; (S.lineGroups||[]).forEach(g=>{before[String(g.group_id)]=String(g.name||'');});
  let synced=null;
  try{
    const r=await fetch(CONFIG.URL+'/functions/v1/sync-line-groups',{method:'POST',
      headers:{'Content-Type':'application/json',apikey:CONFIG.KEY,Authorization:'Bearer '+CONFIG.KEY},body:'{}'});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&typeof j.updated==='number')synced=j.updated;
  }catch(e){}
  try{ S.lineGroups=await selAll('line_groups?select=*&order=seen_at.desc.nullslast'); }
  catch(e){ try{ S.lineGroups=await selAll('line_groups?select=*'); }catch(e2){} }
  try{ localStorage.setItem('jjsc_lgsync',String(Date.now())); }catch(e){}
  S._lgSyncing=false;
  const n=(S.lineGroups||[]).length;
  // ชื่อกลุ่มไหนเปลี่ยนไปบ้าง (คนในไลน์เปลี่ยนชื่อกลุ่ม → ระบบตามให้เอง · การผูกซัพใช้ group_id ไม่หลุด)
  // ถ้าชื่อใหม่ว่าง (ไลน์ไม่ส่งชื่อมา) → คงชื่อเดิมไว้ ไม่นับว่าเปลี่ยน (กันชื่อที่ตั้งเองหายไป)
  (S.lineGroups||[]).forEach(g=>{ const o=before[String(g.group_id)];
    if(o&&!String(g.name||'').trim())g.name=o; });
  const chg=(S.lineGroups||[]).filter(g=>before[String(g.group_id)]!=null&&before[String(g.group_id)]!==String(g.name||''));
  if(chg.length)S.lgChanged=chg.map(g=>({id:String(g.group_id),from:before[String(g.group_id)],to:String(g.name||'')}));
  if(auto){
    if(chg.length){ toast('🔄 ชื่อกลุ่มไลน์เปลี่ยน '+chg.length+' กลุ่ม — อัปเดตให้แล้ว'); render(); }
    else if(S.tab==='cfgl')render();
    return;
  }
  toast(n?('🔄 เจอ '+n+' กลุ่ม'+(synced!=null?(' · อัปเดตชื่อ '+synced+' กลุ่ม'):'')
        +(chg.length?(' · ชื่อเปลี่ยน '+chg.length+' กลุ่ม'):'')+' ✓')
        :'ยังไม่เจอกลุ่ม — เชิญบอทเข้ากลุ่มแล้วพิมพ์ 1 ข้อความในกลุ่มก่อนครับ',!n);
  render();
}

async function supRename(old){

  if(supKey(nn)!==supKey(old)&&supSched(nn)){toast('มีซัพชื่อ "'+nn+'" อยู่แล้ว',true);return;}
  try{
    if(x)await api('PATCH','suppliers?name=eq.'+encodeURIComponent(x.name),{name:nn},'return=minimal');

  if(!to)return;
  if(!supSched(to)&&!others.some(x=>supKey(x)===supKey(to))){toast('ไม่พบซัพ "'+to+'" — เพิ่มซัพก่อนครับ',true);return;}
  try{
    await api('PATCH','products?sup=eq.'+encodeURIComponent(from),{sup:to},'return=minimal');
    [S.all,S.allBr].forEach(arr=>(arr||[]).forEach(p2=>{if(supKey(p2.sup)===supKey(from))p2.sup=to;}));

/* ---- ลำดับรายการมาตรฐาน (ใช้ทุกเมนู): ของที่มีครบทุกสาขาก่อน เรียงตามชื่อ · ของที่มีบางสาขาไว้ท้ายกลุ่ม ---- */

/* ---- 📏 คลังหน่วย: รวมหน่วยทั้งหมด + เพิ่ม/แก้ชื่อ/ลบ/รวมชื่อพ้อง ---- */
const uKey=u=>String(u||'').trim();
/* ชื่อพ้อง (alias): หน่วยคนละชื่อแต่ของเดียวกัน เช่น บิลเขียน "กก." แต่หน่วยนับคือ "โล"
   → sc_units.alias_of ชี้ไปหน่วยหลัก · ทุกที่ที่เทียบหน่วยให้เทียบด้วย uMain() */
function uAliasMap(){
  const m={};
  (S.units||[]).forEach(r=>{const n=uKey(r.name),a=uKey(r.alias_of); if(n&&a&&a!==n)m[n]=a;});
  Object.keys(m).forEach(k=>{ let v=m[k],i=0; while(m[v]&&m[v]!==v&&i++<10)v=m[v]; m[k]=v; }); // ชี้ต่อกันเป็นทอด → ยุบเป็นตัวหลัก
  return m;
}
function uMain(n){ if(!S._uAlias)S._uAlias=uAliasMap(); const k=uKey(n); return S._uAlias[k]||k; }
const uSame=(a,b)=>uMain(a)===uMain(b);                       // หน่วยเดียวกันไหม (นับชื่อพ้องด้วย)
function uAliasOf(main){ main=uKey(main);                      // ชื่อพ้องทั้งหมดของหน่วยหลักนี้
  if(!S._uAlias)S._uAlias=uAliasMap();
  return Object.keys(S._uAlias).filter(k=>S._uAlias[k]===main).sort((a,b)=>a.localeCompare(b,'th'));
}
function uDirty(){ S._uAlias=null; }                           // รายชื่อหน่วยเปลี่ยน → คิดชื่อพ้องใหม่
function unitStats(){ // หน่วย → ใช้ที่ไหนบ้าง (หน่วยนับกี่รายการ · บิลกี่ครั้ง · ตัวคูณกี่แถว)
  const st={},add=(u,k,n)=>{const x=uKey(u); if(!x)return; (st[x]=st[x]||{cnt:0,map:0,bill:0,conv:0,reg:0})[k]+=(n||1);};
  ((S.allBr&&S.allBr.length)?S.allBr:(S.all||[])).forEach(it=>add(it.unit,'cnt'));
  (S.mapRows||[]).forEach(m=>add(m.stock_unit,'map'));
  Object.keys(S.billSup||{}).forEach(sp=>Object.keys(S.billSup[sp]).forEach(item=>
    Object.keys(S.billSup[sp][item]).forEach(u=>add(u,'bill',S.billSup[sp][item][u].n))));
  Object.keys(S.conv||{}).forEach(k=>{ add(k.split('|')[1],'conv'); add((S.conv[k]||{}).to,'conv'); });
  (S.units||[]).forEach(r=>add(r.name,'reg'));
  return st;
}
function unitAll(withAlias){ // รายชื่อหน่วยทั้งหมด (ในรายการ + ที่ใช้จริงในข้อมูล) เรียงตามการใช้งาน
  const st=unitStats(),reg={};
  (S.units||[]).forEach(r=>{const n=uKey(r.name); if(n)reg[n]=r;});
  const all=Object.keys(st).map(n=>{const x=st[n];
    return {name:n,row:reg[n]||null,cnt:x.cnt,map:x.map,bill:x.bill,conv:x.conv,
            main:uMain(n),alias:uMain(n)!==n,used:x.cnt+x.map+x.bill+x.conv};})
    .sort((a,b)=>(b.cnt-a.cnt)||(b.bill-a.bill)||a.name.localeCompare(b.name,'th'));
  return withAlias?all:all.filter(u=>!u.alias);   // ปกติซ่อนชื่อพ้อง (ไปโชว์ใต้หน่วยหลัก)
}
function aliasTodo(){ // สินค้าที่บิลใช้ "ชื่อพ้อง" ของหน่วยนับ แต่ยังไม่มีตัวคูณใน pnl_unit_conv (ฝั่ง P&L ต้องใช้)
  const out=[],seen={};
  Object.keys(S.billSup||{}).forEach(sp=>Object.keys(S.billSup[sp]).forEach(item=>{
    Object.keys(S.billSup[sp][item]).forEach(u=>{
      if(uKey(u)===uMain(u))return;                       // ชื่อหลักอยู่แล้ว
      const it=(S.all||[]).find(x=>uKey(billName(x))===uKey(item)); if(!it)return;
      if(!uSame(u,it.unit))return;                        // คนละหน่วยจริง ๆ → ต้องใส่ตัวคูณเอง
      const k=item+'|'+u; if(seen[k]||(S.conv||{})[k])return; seen[k]=1;
      out.push({item:item,from:uKey(u),to:uKey(it.unit)});
    });
  }));
  return out;
}

async function unitRename(old){
  old=uKey(old); const u=unitAll().find(x=>x.name===old)||{cnt:0,map:0,bill:0,conv:0};
  const nn=uKey(ask('เปลี่ยนชื่อหน่วย "'+old+'" เป็น\n(จะเปลี่ยนให้ทุกที่: สินค้าทั้ง 2 สาขา · ชื่อที่ผูกกับ P&L · ตัวคูณ'
    +(u.bill?' — หน่วยในบิลเก่ายังเป็น "'+old+'" ตามเดิม':'')+')',old));
  if(!nn||nn===old)return;
  try{
    if(u.cnt)await api('PATCH','products?unit=eq.'+encodeURIComponent(old)+'&deleted_at=is.null',{unit:nn},'return=minimal');
    if(u.map)await api('PATCH','pnl_stock_map?stock_unit=eq.'+encodeURIComponent(old),{stock_unit:nn},'return=minimal').catch(()=>{});
    if(u.conv)await api('PATCH','pnl_unit_conv?to_unit=eq.'+encodeURIComponent(old),{to_unit:nn},'return=minimal').catch(()=>{});
    const row=unitFind(old);
    if(row&&row.id!=null)await api('PATCH','sc_units?id=eq.'+row.id,{name:nn,kind:unitKind(u)},'return=minimal');
    else if(S.unitTbl)await api('POST','sc_units',[{name:nn,kind:unitKind(u)}],'return=minimal').catch(()=>{});
    // อัปเดตในหน้าจอเลย ไม่ต้องรีโหลด
    (S.all||[]).forEach(x=>{ if(uKey(x.unit)===old)x.unit=nn; });
    (S.allBr||[]).forEach(x=>{ if(uKey(x.unit)===old)x.unit=nn; });
    (S.mapRows||[]).forEach(x=>{ if(uKey(x.stock_unit)===old)x.stock_unit=nn; });
    Object.keys(S.conv||{}).forEach(k=>{ if(uKey(S.conv[k].to)===old)S.conv[k].to=nn; });
    if(row)row.name=nn; else if(S.unitTbl)S.units=(S.units||[]).concat({name:nn,kind:unitKind(u)});
    (S.units||[]).forEach(r2=>{ if(uKey(r2.alias_of)===old)r2.alias_of=nn; }); uDirty();
    // หน่วยเดิมยังอยู่ในบิล (บิลเก่าแก้ไม่ได้) → ใส่ตัวคูณ 1:1 ให้เอง ไม่งั้นใบสั่งจะขึ้น "ยังไม่ใส่ตัวคูณ"
    let nFix=0;
    if(u.bill){
      const items={};
      Object.keys(S.billSup||{}).forEach(sp=>Object.keys(S.billSup[sp]).forEach(item=>{
        if(Object.keys(S.billSup[sp][item]).some(x=>uKey(x)===old))items[item]=1; }));
      const rows2=Object.keys(items).filter(item=>(S.all||[]).some(x=>uKey(billName(x))===uKey(item)&&uKey(x.unit)===nn))
        .filter(item=>!(S.conv||{})[item+'|'+old])
        .map(item=>({item:item,from_unit:old,to_unit:nn,factor:1}));
      if(rows2.length){
        await api('POST','pnl_unit_conv?on_conflict=item,from_unit',rows2,'resolution=merge-duplicates,return=minimal').catch(()=>{});
        rows2.forEach(r2=>{(S.conv=S.conv||{})[r2.item+'|'+old]={to:nn,f:1};});
        nFix=rows2.length;
      }
    }
    toast('✅ เปลี่ยน "'+old+'" เป็น "'+nn+'" แล้ว'+(u.cnt?' ('+u.cnt+' รายการ)':'')
      +(nFix?' · ใส่ตัวคูณ 1 '+old+' = 1 '+nn+' ให้ '+nFix+' รายการ (บิลเก่ายังเขียน "'+old+'")':'')); render();
  }catch(e){toast('แก้ชื่อไม่สำเร็จ — '+errMsg(e),true);}
}

async function unitMerge(src,main){ // รวมหน่วย: src กลายเป็น "ชื่อพ้อง" ของ main และของที่ใช้ src ถูกเปลี่ยนเป็น main
  src=uKey(src); main=uMain(main);
  if(!src||!main||src===main)return;
  const u=unitAll(true).find(x=>x.name===src)||{cnt:0,map:0,bill:0,conv:0};
  if(!cfm('รวมหน่วย "'+src+'" เข้ากับ "'+main+'" ?\n\n'
    +'• สินค้าที่ใช้หน่วย "'+src+'" ('+u.cnt+' รายการ ทั้ง 2 สาขา) จะเปลี่ยนเป็น "'+main+'"\n'
    +'• ระบบจะจำว่า "'+src+'" = "'+main+'" (บิลที่เขียน "'+src+'" ถือว่าเป็น "'+main+'")\n'
    +'• บิลเก่าไม่ถูกแก้ · ตัวคูณ 1:1 ใส่ให้อัตโนมัติ'))return;
  try{
    if(u.cnt)await api('PATCH','products?unit=eq.'+encodeURIComponent(src)+'&deleted_at=is.null',{unit:main},'return=minimal');
    if(u.map)await api('PATCH','pnl_stock_map?stock_unit=eq.'+encodeURIComponent(src),{stock_unit:main},'return=minimal').catch(()=>{});
    if(u.conv)await api('PATCH','pnl_unit_conv?to_unit=eq.'+encodeURIComponent(src),{to_unit:main},'return=minimal').catch(()=>{});
    if(S.unitTbl){
      if(!unitFind(main))await api('POST','sc_units',[{name:main,kind:'both'}],'return=minimal').catch(()=>{});
      const row=unitFind(src);
      if(row&&row.id!=null)await api('PATCH','sc_units?id=eq.'+row.id,{alias_of:main},'return=minimal');
      else await api('POST','sc_units',[{name:src,kind:'buy',alias_of:main}],'return=minimal');
      await api('PATCH','sc_units?alias_of=eq.'+encodeURIComponent(src),{alias_of:main},'return=minimal').catch(()=>{}); // ที่เคยชี้มาที่ src ให้ชี้ main
    }
    // อัปเดตในหน้าจอทันที
    (S.all||[]).forEach(x=>{ if(uKey(x.unit)===src)x.unit=main; });
    (S.allBr||[]).forEach(x=>{ if(uKey(x.unit)===src)x.unit=main; });
    (S.mapRows||[]).forEach(x=>{ if(uKey(x.stock_unit)===src)x.stock_unit=main; });
    Object.keys(S.conv||{}).forEach(k=>{ if(uKey(S.conv[k].to)===src)S.conv[k].to=main; });
    const r0=unitFind(src);
    if(r0)r0.alias_of=main; else S.units=(S.units||[]).concat({name:src,kind:'buy',alias_of:main});
    if(!unitFind(main))S.units=(S.units||[]).concat({name:main,kind:'both'});
    (S.units||[]).forEach(r=>{ if(uKey(r.alias_of)===src)r.alias_of=main; });
    uDirty(); S.uMergeFrom=null;
    const nFix=await fillAliasConv(true);   // ฝั่ง P&L: ใส่ตัวคูณ 1:1 ให้บิลที่เขียนชื่อพ้อง
    toast('✅ รวม "'+src+'" เข้ากับ "'+main+'" แล้ว'+(u.cnt?' · เปลี่ยนสินค้า '+u.cnt+' รายการ':'')+(nFix?' · ใส่ตัวคูณ 1:1 ให้ '+nFix+' รายการ':''));
    render();
  }catch(e){toast('รวมหน่วยไม่สำเร็จ — '+errMsg(e),true);}
}

async function convSave(i){ // เซฟหน่วยนับ (ตามชื่อ=2 สาขา) + ตัวคูณของหน่วยซื้อนั้น (pnl_unit_conv)
  const r=(S._uRows||[])[i]; if(!r)return;
  const it=S.all.find(x=>x.id===r.pid); if(!it)return;
  const cuEl=document.getElementById('cu_'+i),fxEl=document.getElementById('fx_'+i);
  const cu=((cuEl&&cuEl.value)||'').trim()||String(it.unit||'');
  try{
    if(cu&&cu!==String(it.unit||'')){ // หน่วยนับ: ชื่อเดียวทั้ง 2 สาขา
      await api('PATCH','products?name=eq.'+encodeURIComponent(it.name),{unit:cu},'return=minimal');
      await api('PATCH','pnl_stock_map?product_name=eq.'+encodeURIComponent(it.name),{stock_unit:cu},'return=minimal').catch(()=>{});
      S.all.forEach(x=>{if(x.name===it.name)x.unit=cu;});
      (S.mapRows||[]).forEach(x=>{if(x.product_name===it.name)x.stock_unit=cu;});
    }
    if(r.unit&&!uSame(r.unit,cu)&&fxEl&&!fxEl.disabled){
      const f=num(fxEl.value);
      if(!f){toast('ใส่ตัวคูณก่อนครับ (1 '+r.unit+' = กี่ '+cu+')',true);return;}
      await api('POST','pnl_unit_conv?on_conflict=item,from_unit',
        [{item:r.item,from_unit:r.unit,to_unit:cu,factor:f}],'resolution=merge-duplicates,return=minimal');
      (S.conv=S.conv||{})[r.item+'|'+r.unit]={to:cu,f};
      toast('✅ 1 '+r.unit+' = '+fq(f)+' '+cu+' ('+r.item+')');
    }else toast('✅ บันทึกหน่วยนับ '+it.name+' = '+cu);
    render();
  }catch(e){toast('บันทึกไม่สำเร็จ — '+String(e.message||e).slice(0,110),true);}
}

const PTR={on:false,y0:0,pull:0,lock:false};
function ptrInside(el){ // นิ้วอยู่ในกล่องที่เลื่อนอยู่ (ตาราง/กล่องเลือกกลุ่ม) → ปล่อยให้เลื่อนตามปกติ
  for(let n=el;n&&n!==document.body;n=n.parentElement)if(n.scrollTop>0)return true;
  return false;
}
function ptrRender(){
  const el=document.getElementById('ptr'); if(!el)return;
  el.style.transform='translate(-50%, '+(PTR.pull-56)+'px)';
  el.classList.toggle('rel',PTR.pull>=70);
  const c=el.querySelector('.ptr-c');
  if(c&&!el.classList.contains('spin'))c.style.transform='rotate('+Math.round(PTR.pull*3)+'deg)';
}
function ptrStart(e){
  if(PTR.lock||!e.touches||!e.touches[0])return;
  if(window.scrollY>2)return;                                             // ต้องอยู่บนสุดของหน้า
  const ov=document.getElementById('ovl');
  if(ov&&ov.classList.contains('on'))return;                              // กล่องยืนยันเปิดอยู่
  const lg=document.getElementById('loginOv');
  if(lg&&getComputedStyle(lg).display!=='none')return;                    // ยังไม่ได้ล็อกอิน
  if(e.target&&ptrInside(e.target))return;
  PTR.on=true; PTR.y0=e.touches[0].clientY; PTR.pull=0;
  const el=document.getElementById('ptr'); if(el)el.classList.add('drag');
}
function ptrMove(e){
  if(!PTR.on||!e.touches||!e.touches[0])return;
  const dy=e.touches[0].clientY-PTR.y0;
  if(dy<=0){ PTR.pull=0; ptrRender(); return; }
  if(window.scrollY<=2){
    PTR.pull=Math.min(120,dy*0.5);                                        // หนืดครึ่งหนึ่งของนิ้ว
    if(e.cancelable)e.preventDefault();                                   // กันเบราว์เซอร์รีโหลดทั้งหน้าเอง
    ptrRender();
  }
}
async function ptrEnd(){
  if(!PTR.on)return;
  PTR.on=false;
  const el=document.getElementById('ptr'); if(el)el.classList.remove('drag');
  if(PTR.pull<70){ PTR.pull=0; ptrRender(); return; }                     // ลากไม่ถึง = เด้งกลับ เฉย ๆ
  PTR.lock=true;
  if(el){ el.classList.add('spin'); el.style.transform='translate(-50%, 16px)'; }
  try{
    draftSave();                                                          // ค่านับที่ยังไม่กดบันทึกเก็บไว้ก่อน
    await loadAll();                                                      // โหลดข้อมูลใหม่ (loadAll คืนค่านับที่ค้างให้เอง)
    toast('↻ อัปเดตข้อมูลล่าสุดแล้ว');
  }catch(e){ toast('รีเฟรชไม่สำเร็จ — '+String(e.message||e).slice(0,90),true); }
  PTR.pull=0; PTR.lock=false;
  if(el){ el.classList.remove('spin','rel'); el.querySelector('.ptr-c').style.transform=''; ptrRender(); }
}
function initPtr(){ // จอสัมผัส (มือถือ/แท็บเล็ต): ลากลงจากบนสุด = รีเฟรชข้อมูล
  if(!('ontouchstart' in window))return;
  document.addEventListener('touchstart',ptrStart,{passive:true});
  document.addEventListener('touchmove',ptrMove,{passive:false});         // passive:false = ห้ามเบราว์เซอร์รีโหลดเอง
  document.addEventListener('touchend',ptrEnd,{passive:true});
  document.addEventListener('touchcancel',()=>{ if(!PTR.on)return; PTR.on=false; PTR.pull=0;
    const el=document.getElementById('ptr'); if(el)el.classList.remove('drag'); ptrRender(); },{passive:true});
}

async function saveCn(id){
  const it=S.all.find(x=>x.id===id); if(!it)return;
  const nn=(document.getElementById('cni_'+id).value||'').trim(),old=it.name;
  if(!nn||nn===old){render();return;}
  try{
    // เปลี่ยนชื่อนับที่ต้นทาง (ระบบ stock) ทุกแถวชื่อเดียวกัน = ทั้ง 2 สาขา
    await api('PATCH','products?name=eq.'+encodeURIComponent(old),{name:nn},'return=minimal');
    // ตารางผูกฝั่ง P&L เก็บสำเนาชื่อนับไว้ — อัปเดตตามให้เลย
    await api('PATCH','pnl_stock_map?product_name=eq.'+encodeURIComponent(old),{product_name:nn},'return=minimal').catch(()=>{});
    S.all.forEach(x=>{if(x.name===old)x.name=nn;});
    (S.mapRows||[]).forEach(r=>{if(r.product_name===old)r.product_name=nn;});
    Object.values(S.map).forEach(r=>{if(r.product_name===old)r.product_name=nn;});
    toast('✅ เปลี่ยนชื่อนับ "'+old+'" → "'+nn+'" (ทั้ง 2 สาขา + ตารางผูก)');
    render();
  }catch(e){toast('เปลี่ยนชื่อไม่สำเร็จ — '+String(e.message||e).slice(0,100),true);}
}
async function setZone(dept,z){ // โซนผูกกับแผนก (แยกสาขา) → อัปเดตสินค้าในแผนกของสาขานี้ + ตารางแผนก
  try{
    const ids=deptIds(dept);
    if(ids.length)await patchIds(ids,{zone:z||null}); // เขียนเฉพาะโซน — ไม่แตะ dept/หมวดเดิม (ไม่งั้นกลุ่มอื่นเพี้ยน)
    const d2=(S.depts||[]).find(x=>String(x.name||'').trim()===dept);
    if(d2&&d2.id!=null){await api('PATCH','sc_depts?id=eq.'+d2.id,{zone:z||null},'return=minimal').catch(()=>{});d2.zone=z||null;}
    else if(S.deptTbl){
      const r=await api('POST','sc_depts',{branch_id:STK_BR[S.br],name:dept,zone:z||null,sort:(S.depts||[]).length+1},'return=representation').catch(()=>null);
      if(r&&r[0])(S.depts=S.depts||[]).push(r[0]);
    }
    S.all.forEach(x=>{if(ids.includes(x.id))x.zone=z||null;});
    toast('✅ แผนก "'+dept+'" → โซน'+(z||' (ไม่ระบุ)')+' · สาขา'+BR_NAME[S.br]);render();
  }catch(e){toast('ตั้งโซนไม่สำเร็จ — '+String(e.message||e).slice(0,100),true);render();}
}

function pickImg(id){S.imgTarget=id;$('#imgFile').click();}
function shrink(file){return new Promise(res=>{
  const img=new Image();img.onload=()=>{
    const M=640,k=Math.min(1,M/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>res(b),'image/jpeg',0.8);
  };img.onerror=()=>res(null);img.src=URL.createObjectURL(file);});}
async function setImgUrl(name,url){
  await api('PATCH','products?name=eq.'+encodeURIComponent(name),{image_url:url},'return=minimal');
  S.all.forEach(x=>{if(x.name===name)x.image_url=url;});
}
async function upImg(file){
  const it=S.all.find(x=>x.id===S.imgTarget);if(!it||!file)return;
  toast('⏳ กำลังอัปโหลดรูป...');
  try{
    const blob=await shrink(file);if(!blob)throw new Error('อ่านรูปไม่สำเร็จ');
    const path='p/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    const r=await fetch(CONFIG.URL+'/storage/v1/object/product-images/'+path,{method:'POST',
      headers:{apikey:CONFIG.KEY,Authorization:'Bearer '+CONFIG.KEY,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
    if(!r.ok)throw new Error(await r.text().catch(()=>r.status));
    await setImgUrl(it.name,CONFIG.URL+'/storage/v1/object/public/product-images/'+path);
    toast('✅ ใส่รูป '+billName(it)+' แล้ว (เห็นทั้ง 2 สาขา)');render();
  }catch(e){toast('อัปโหลดรูปไม่สำเร็จ — '+String(e.message||e).slice(0,100),true);}
}

async function saveAll(){
  const btn=$('#save');btn.disabled=true;const old=btn.textContent;btn.textContent='⏳ กำลังบันทึก...';
  try{
    if(S.tab==='count'){
      const who=($('#who').value||'').trim();localStorage.setItem('jjsc_who',who);
      const hash=cntHash;
      const picked=S.items.filter(it=>counted(it)&&hash(it)!==it._saved);
      if(!picked.length){toast('ทุกแถวเหมือนที่บันทึกไว้แล้ว ✓ ไม่ต้องเซฟซ้ำ');btn.disabled=false;btn.textContent=old;refresh();return;}
      const cd=$('#cd').value||bizToday(),bid=STK_BR[S.br];
      const hist=picked.map(it=>({branch_id:bid,branch_name:BR_NAME[S.br],count_date:cd,counter:who||null,
        cat_label:deptOf(it),product_id:it.id,name:it.name,unit:it.unit||'',
        sup:it.sup||'',qty:num(it.qty),out_of_stock:!!it.out,safety:it.safety??null,max:it.max??null}));
      const cur=picked.map(it=>({branch_id:bid,product_id:it.id,qty:num(it.qty),counter:who||null,updated_at:new Date().toISOString()}));
      await api('POST','stock_counts',hist,'return=minimal');
      await api('POST','stock_current?on_conflict=branch_id,product_id',cur,'resolution=merge-duplicates,return=minimal');
      picked.forEach(it=>{S.cur[it.id]={product_id:it.id,qty:num(it.qty)};it._saved=String(num(it.qty))+'|'+(it.out?1:0);});
      draftSave();
      toast('✅ บันทึกการนับ '+picked.length+' รายการ');
    }else if(S.tab==='set'){
      const dirty=S.items.filter(isDirty);
      for(const it of dirty){
        const d2={...it.dirty};
        const dept=d2.dept; delete d2.dept;
        if(dept!==undefined)d2.dept=dept||null; // แผนกแยกสาขา → ไปกับ PATCH by id ตัวเดียวกัน
        if(Object.keys(d2).length)await api('PATCH','products?id=eq.'+encodeURIComponent(it.id),d2,'return=minimal');
        if(dept!==undefined)it.dept=dept||null;
        Object.assign(it,Object.fromEntries(Object.entries(it.dirty).filter(([k])=>k!=='dept')));
        it.dirty={};
      }
      toast('✅ บันทึกตั้งค่า '+dirty.length+' รายการ');
    }
    render();
  }catch(e){toast('บันทึกไม่สำเร็จ — '+String(e.message||e).slice(0,140),true);}
  btn.disabled=false;btn.textContent=old;refresh();
}

async function initAuth(){
  try{ await api('GET','sc_users?select=id&limit=1'); S.authOn=true; }
  catch(e){ S.authOn=false; return; } // ยังไม่ได้รัน sql ผู้ใช้ = โหมดเปิด
  const saved=JSON.parse(localStorage.getItem('jjsc_auth')||'null');
  if(saved){
    const rows=await api('GET','sc_users?select=*&active=is.true&username=eq.'+encodeURIComponent(saved.u)).catch(()=>[]);
    if(rows[0]&&rows[0].pass_hash===saved.h){ S.user=rows[0]; return; }
  }
  showLogin();
}
function showLogin(){ $('#loginOv').classList.add('on'); const el=$('#lgU'); if(el)setTimeout(()=>el.focus(),50); }
async function doLogin(){
  const u=($('#lgU').value||'').trim(),p=$('#lgP').value||'';
  if(!u||!p){$('#lgMsg').textContent='ใส่ชื่อผู้ใช้และรหัสผ่านก่อนครับ';return;}
  const rows=await api('GET','sc_users?select=*&active=is.true&username=eq.'+encodeURIComponent(u)).catch(()=>[]);
  if(!rows[0]||rows[0].pass_hash!==pwHash(u,p)){$('#lgMsg').textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return;}
  S.user=rows[0]; localStorage.setItem('jjsc_auth',JSON.stringify({u,h:rows[0].pass_hash}));
  $('#loginOv').classList.remove('on'); $('#lgP').value='';
  applyAuth(); await loadAll();
}
function logout(){ localStorage.removeItem('jjsc_auth'); S.user=null; S.users=null; showLogin(); applyAuth(); }
const allowedBr=()=>{const u=S.user;const all=Object.keys(STK_BR);
  return (u&&Array.isArray(u.branches)&&u.branches.length)?all.filter(b=>u.branches.includes(b)):all;};
const canDept=d=>{const u=S.user;
  return !u||u.role==='admin'||!Array.isArray(u.depts)||!u.depts.length||u.depts.includes(d);};
function renderBr(){
  const bs=allowedBr();
  if(!bs.includes(S.br))S.br=bs[0]||'JJRD';
  $('#brSeg').innerHTML=bs.map(b=>'<button data-br="'+b+'" class="'+(S.br===b?'on':'')+'">'+BR_NAME[b]+'</button>').join('');
}
function applyAuth(){
  renderBr();
  const u=S.user;
  if(u){$('#who').value=u.username;$('#who').readOnly=true;} // ผู้นับ = username ที่ล็อกอิน ล็อกแก้ไม่ได้
  else $('#who').readOnly=false;
  $('#uchip').style.display=u?'block':'none';
  if(u)$('#uchip').innerHTML='👤 <b>'+esc(u.display_name||u.username)+'</b> · '+(u.role==='admin'?'แอดมิน':'พนักงาน')+'<a onclick="logout()">ออก</a>';
  const noAdm=!!(u&&u.role!=='admin');
  document.querySelectorAll('[data-t="set"],[data-t="sched"],[data-t="items"],[data-t="cfg"],#cfgBox').forEach(b=>{b.style.display=noAdm?'none':'';}); // Safety/รอบสั่งซัพ/ตั้งค่า เฉพาะแอดมิน
}
function placeCtl(){
  const c=$('#ctl'),t=window.innerWidth>=821?$('#scSlot'):$('#hcSlot');
  if(c&&t&&c.parentElement!==t)t.appendChild(c);
}
function boot(){
  ['scLogo','hdLogo','lgLogo'].forEach(id=>{const el=document.getElementById(id);if(el)el.src=LOGO_B64;});
  ['icon','apple-touch-icon'].forEach(rel=>{const l=document.createElement('link');l.rel=rel;l.href=LOGO_B64;document.head.appendChild(l);});
  renderBr(); placeCtl(); window.addEventListener('resize',placeCtl);
  $('#lgP')&&($('#lgP').onkeydown=e=>{if(e.key==='Enter')doLogin();});
  $('#brSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.br=b.dataset.br;localStorage.setItem('jjsc_br',S.br);
    document.querySelectorAll('#brSeg button').forEach(x=>x.classList.toggle('on',x.dataset.br===S.br));loadAll();};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  $('#cd').value=bizToday();
  $('#who').value=localStorage.getItem('jjsc_who')||'';
  $('#q').oninput=e=>{S.q=e.target.value;render();};
  $('#pills').addEventListener('wheel',e=>{const p=e.target.closest('.pills');
    if(p&&p.scrollWidth>p.clientWidth){p.scrollLeft+=(e.deltaY||e.deltaX);e.preventDefault();}},{passive:false});
  $('#cd').onchange=()=>{S._cdManual=true;loadAll();};
  setInterval(()=>{ // ข้ามตี 6 = วันขายใหม่ → รีเซ็ตหน้านับอัตโนมัติ (ถ้าไม่ได้เลือกวันเองไว้)
    if(!S._cdManual&&$('#cd').value!==bizToday()){$('#cd').value=bizToday();loadAll();}
  },60000);
  $('#save').onclick=saveAll;
  $('#imgFile').onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';upImg(f);};
  initPtr(); initLang();
  initAuth().then(()=>{applyAuth();restoreTab();return loadAll();})
    .catch(e=>{$('#list').innerHTML='<div class="empty">โหลดไม่สำเร็จ — '+esc(e.message||e)+'</div>';});
}
boot();
</script>
