<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>JJ Kitchen — ครัวกลาง จริงใจหมูกระทะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=Noto+Sans+Lao+Looped:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --fh:'Prompt','Noto Sans Lao Looped','Noto Sans Myanmar',sans-serif;
  --red:#C62127; --red-d:#A31B20; --red-t:#FBEBEB;
  --ink:#241F1E; --mut:#8B837B; --bg:#F5F2ED; --card:#FFFFFF; --line:#E7E1D8;
  --ok:#1E8E5A; --ok-t:#E6F4EC; --bad:#D23B3B; --bad-t:#FCE9E8; --gold:#B98A2F; --gold-t:#F7EEDC;
  --blue:#3D6E8C; --blue-t:#E7F0F5;
  --r:14px; --sh:0 1px 2px rgba(35,25,20,.05),0 4px 14px rgba(35,25,20,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html,body{overscroll-behavior-y:contain}
body{font-family:'Sarabun','Noto Sans Lao Looped','Noto Sans Myanmar',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100dvh}
h1,h2,h3,.num,.kpi-v{font-family:var(--fh)}
body[data-lang="lo"]{--fh:'Noto Sans Lao Looped','Prompt',sans-serif;font-family:'Noto Sans Lao Looped','Sarabun',sans-serif}
body[data-lang="my"]{--fh:'Noto Sans Myanmar','Prompt',sans-serif;font-family:'Noto Sans Myanmar','Sarabun',sans-serif}
.num,td.n,input[type=number],.kpi-v,.money{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:15px;color:var(--ink)}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
input[type=number]{text-align:right}
input,select,textarea{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
input::placeholder{color:#C5BEB5}
::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-thumb{background:#D8D1C7;border-radius:3px}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(245,242,237,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px clamp(14px,1.6vw,28px) 6px;max-width:none;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-weight:700;font-size:18px;letter-spacing:.2px}
.brand .hlogo{width:26px;height:26px;border-radius:8px;border:1.5px solid #E9B44C;background:var(--red);object-fit:cover;flex:none}
.brand small{font-weight:500;color:var(--mut);font-size:11px;display:block;line-height:1}
.ptitle{display:none}
.hbtn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.hbtn:active{transform:scale(.96)}
#syncDot{width:9px;height:9px;border-radius:50%;background:var(--ok);margin-left:auto;flex:none;transition:.2s}
#syncDot.busy{background:var(--gold);animation:pul 1s infinite}
#syncDot.err{background:var(--bad)}
@keyframes pul{50%{opacity:.35}}
.tabbar{display:flex;gap:4px;overflow-x:auto;padding:4px 10px 8px;max-width:none;margin:0 auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:none;padding:8px 14px;border-radius:99px;font-weight:600;color:var(--mut);font-size:14px;display:inline-flex;align-items:center;gap:5px}
.tabbar button.on{background:var(--ink);color:#fff}

/* ---------- Sidebar (desktop) ---------- */
#sideNav{display:none}
@media(min-width:900px){
  /* เนื้อหาชิดขวาแถบข้าง กว้างสุด 1220px — จอกว้างมากให้ลอยกึ่งกลางโซนขวา ไม่ยืดจนกล่องโล่ง */
  #app{width:auto;max-width:1220px;margin:0 0 0 max(236px,calc(50vw - 492px));
    padding:20px 36px calc(36px + env(safe-area-inset-bottom))}
  header{padding-left:236px}
  #sideNav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:236px;z-index:60;
    background:linear-gradient(180deg,#7E1013 0%,#690C0F 100%);padding:18px 13px calc(14px + env(safe-area-inset-bottom));overflow-y:auto}
  #sideNav::-webkit-scrollbar{width:0}
  .sb-logo{display:flex;align-items:center;gap:10px;margin:2px 4px 14px}
  .sb-logo img{width:47px;height:47px;border-radius:13px;border:2px solid #E9B44C;box-shadow:0 2px 10px rgba(0,0,0,.35);object-fit:cover;flex:none}
  .sb-logo b{display:block;color:#fff;font-family:var(--fh);font-size:15px;line-height:1.2}
  .sb-logo small{color:#EFC6C6;font-size:11px;font-weight:500}
  .sb-note{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.24);border:1px solid rgba(233,180,76,.55);color:#F1D6A2;font-size:12px;font-weight:600;border-radius:11px;padding:8px 11px;margin:0 2px 14px}
  .sb-note b{color:#FFCF6E;font-weight:700}
  .sb-sec{color:rgba(255,255,255,.42);font-size:10.5px;letter-spacing:.2em;font-weight:700;margin:12px 8px 6px;font-family:var(--fh)}
  .sb-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;color:#F2DCDC;font-weight:600;font-size:14.5px;padding:10px 12px;border-radius:11px;margin-bottom:2px;transition:background .12s}
  .sb-item .ic{width:22px;text-align:center;flex:none;font-size:16px}
  .sb-item:hover{background:rgba(255,255,255,.09)}
  .sb-item.on{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.28)}
  .sbadge{margin-left:auto;background:#fff;color:var(--red);border-radius:99px;font-size:11px;line-height:1;padding:3px 7px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .sb-foot{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
  #sbUser{color:#F2DCDC;font-size:12.5px;padding:4px 8px 8px}
  #sbUser a{color:#F3C74F;font-weight:700;cursor:pointer;margin-left:6px}
  header .brand{display:none}
  .tabbar{display:none}
  .hrow{padding:13px 36px 11px;max-width:1220px;margin:0 auto}
  .ptitle{display:block;font-family:inherit;font-weight:700;font-size:20px;margin-right:auto}
  #syncDot{margin-left:0}
}

/* ---------- Layout ---------- */
main{max-width:none;width:100%;margin:0 auto;padding:14px clamp(14px,1.6vw,28px) calc(30px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block;animation:fin .18s ease}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{margin-left:auto;font-weight:500;color:var(--mut);font-size:12.5px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.b{font-weight:700}.right{text-align:right}
.btn{background:var(--red);color:#fff;font-weight:600;padding:10px 16px;border-radius:11px;box-shadow:0 2px 8px rgba(198,33,39,.3);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:scale(.97)}
.btn.gh{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.dk{background:var(--ink);box-shadow:none;color:#fff}
.btn.ok{background:var(--ok);box-shadow:0 2px 8px rgba(30,142,90,.3)}
.btn.sm2{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn.big{width:100%;padding:14px 16px;font-size:17px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok-t);color:var(--ok)}
.chip.bad{background:var(--bad-t);color:var(--bad)}
.chip.mid{background:#EFEBE4;color:var(--mut)}
.chip.warn{background:var(--gold-t);color:var(--gold)}
.chip.gold{background:var(--gold-t);color:var(--gold)}
.chip.blue{background:var(--blue-t);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.kpi .t{font-size:12px;color:var(--mut);font-weight:600}
.kpi-v{font-size:22px;font-weight:700;margin-top:2px;line-height:1.15}
.kpi .s{font-size:12px;margin-top:3px}
.kpi.hero{background:linear-gradient(135deg,var(--red),#8F171C);border:none;color:#fff}
.kpi.hero .t{color:rgba(255,255,255,.75)}.kpi.hero .s{color:rgba(255,255,255,.8)}
.kpi.tap{cursor:pointer}
#modalWrap{position:fixed;inset:0;background:rgba(30,24,20,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
@media(min-width:640px){#modalWrap{align-items:center}}
#modalWrap.on{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{border-radius:18px}}
.modal.wide{max-width:760px}
.modal h3{margin:0 0 14px;font-size:16px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:200;transition:.25s;opacity:0;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{transform:translateX(-50%);opacity:1}
#toast.err{background:var(--bad)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:13.5px}
.fld{margin-bottom:9px}
.fld label{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:3px}
.md2{display:block}
@media(min-width:760px){.md2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stickysum{position:sticky;bottom:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-family:var(--fh);box-shadow:0 -4px 20px rgba(0,0,0,.15);z-index:10;flex-wrap:wrap}
.stickysum .v{font-weight:700;font-size:18px}
.secbar{background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-family:var(--fh);font-weight:600;font-size:13.5px;display:flex;margin:16px 0 8px;align-items:center;gap:8px}
.secbar .sp{margin-left:auto;font-weight:700}
.twrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11.5px;color:var(--mut);font-weight:700;text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap;font-family:var(--fh)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot{border-top:2px solid var(--ink);background:#FBFAF7;font-weight:700}
table.t tr.tap{cursor:pointer}
table.t tr.tap:hover{background:#FFF8F3}

/* ---------- Item / photo cards ---------- */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
@media(max-width:430px){.igrid{grid-template-columns:1fr 1fr}}
.icard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;position:relative}
.icard.low{border-color:var(--bad);background:#FFF7F6}
.icard.cnt{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-t)}
.icard .ithumb{width:100%;height:92px;border-radius:11px;background:#F3ECE0;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;cursor:pointer}
.icard .ithumb img{width:100%;height:100%;object-fit:cover}
.icard .iname{font-weight:700;font-size:14px;line-height:1.25;min-height:2.2em}
.icard .isub{font-size:11.5px;color:var(--mut)}
.icard .iqty{font-family:var(--fh);font-weight:700;font-size:16px}
.icard .edit-dot{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:var(--sh);z-index:2}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.pick{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;text-align:center}
.pick.on{border-color:var(--red);background:var(--red-t);box-shadow:0 0 0 2px var(--red-t)}
.pick .pthumb{width:100%;height:74px;border-radius:9px;background:#F3ECE0;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
.pick .pthumb img{width:100%;height:100%;object-fit:cover}
.pick .pname{font-size:12.5px;font-weight:700;line-height:1.2}
.stepper{display:flex;align-items:center;gap:6px;justify-content:center}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:700;color:var(--red);flex:none}
.stepper button.plus{background:var(--red);color:#fff;border-color:var(--red)}
.stepper input{width:76px;height:44px;text-align:center;font-family:var(--fh);font-weight:700;font-size:17px;border-radius:12px;padding:4px}
.catbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.catbar button{flex:none;padding:7px 13px;border-radius:99px;font-weight:600;font-size:13px;background:#fff;border:1.5px solid var(--line);color:var(--mut);display:inline-flex;gap:5px;align-items:center}
.catbar button.on{background:var(--red);border-color:var(--red);color:#fff}
/* ชิปในฟอร์ม — ขึ้นบรรทัดใหม่ได้ เห็นครบทุกตัวไม่ต้องเลื่อน */
.catwrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.catwrap button{padding:8px 13px;border-radius:99px;font-weight:600;font-size:13.5px;background:#fff;border:1.5px solid var(--line);color:var(--mut);display:inline-flex;gap:5px;align-items:center;min-height:40px}
.catwrap button.on{background:var(--red);border-color:var(--red);color:#fff}
.catwrap button.add{border-style:dashed;color:var(--red);border-color:var(--red)}
.catwrap button.add.on{background:var(--red-t);color:var(--red)}
/* ใบจัดส่งตามยอดนับสาขา */
.brline{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.brline .grow{min-width:0}
.brq{flex:none;width:86px;text-align:center}
.brq b{font-size:17px;display:block;margin-top:2px}
.brq input{text-align:center;font-size:17px;font-weight:700;padding:8px 4px;margin-top:2px}
.brlink{color:var(--blue);cursor:pointer;text-decoration:underline dotted}
@media(max-width:420px){.brq{width:72px}}
.catnew{background:#FBF8F2;border:1.5px solid var(--line);border-radius:14px;padding:12px}
.icpick{display:flex;flex-wrap:wrap;gap:6px}
.icpick button{width:44px;height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:21px}
.icpick button.on{border-color:var(--red);background:var(--red-t);box-shadow:0 0 0 2px var(--red-t)}

/* ---------- หน้า วันนี้: ปุ่มลัดใหญ่ ---------- */
.bigacts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:760px){.bigacts{grid-template-columns:repeat(4,1fr)}}
.bigact{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 8px;box-shadow:var(--sh);font-weight:700;font-size:14px}
.bigact .bi{font-size:30px;line-height:1}
.bigact:active{transform:scale(.97)}
.bigact.hot{background:linear-gradient(135deg,var(--red),#8F171C);border:none;color:#fff}

/* ---------- Status pills / step wizard ---------- */
.stpill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:700}
.st-draft{background:#EFEBE4;color:var(--mut)}
.st-ordered{background:var(--gold-t);color:var(--gold)}
.st-received{background:var(--ok-t);color:var(--ok)}
.st-plan{background:var(--blue-t);color:var(--blue)}
.st-done{background:var(--ok-t);color:var(--ok)}
.st-new{background:var(--red-t);color:var(--red)}
.st-prep{background:var(--gold-t);color:var(--gold)}
.st-sent{background:var(--blue-t);color:var(--blue)}
.st-cancel{background:#EFEBE4;color:var(--mut);text-decoration:line-through}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps .st{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding:8px 4px;border-radius:10px;background:#EFEBE4;font-family:var(--fh)}
.steps .st.on{background:var(--red);color:#fff}
.steps .st.ok{background:var(--ok-t);color:var(--ok)}

/* ---------- Calendar ---------- */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;max-width:430px;background:var(--line);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.calgrid .wd{text-align:center;font-size:11px;font-weight:700;color:var(--mut);padding:7px 0 6px;font-family:var(--fh);background:#F6EFDF}
.calgrid .wd.sun{color:var(--red)}
.calgrid button{height:46px;border:none;border-radius:0;background:#fff;font-family:var(--fh);font-weight:600;font-size:14px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.calgrid button.sun{color:var(--red)}
.calgrid button.tdy{box-shadow:inset 0 0 0 2px var(--red)}
.calgrid button.on{background:var(--ink);color:#fff}
.calgrid button.has::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--red)}
.calgrid button.on.has::after{background:#fff}

/* ---------- Language switch ---------- */
.langrow{display:flex;gap:6px;flex-wrap:wrap}
.langrow button{flex:1;min-width:110px;padding:13px 10px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px}
.langrow button .fl{font-size:24px}
.langrow button.on{border-color:var(--red);background:var(--red-t);color:var(--red-d)}
.langsw{display:flex;gap:4px}
.langsw button{padding:5px 10px;border-radius:99px;border:1.5px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:700}
.langsw button.on{background:#fff;color:var(--red-d);border-color:#fff}

/* ---------- Login ---------- */
#loginOv{position:fixed;inset:0;background:linear-gradient(150deg,#2E1414,#5A1E20);display:none;align-items:center;justify-content:center;z-index:999;padding:18px}
#loginOv.on{display:flex}
.logincard{background:#FFFDF8;border-radius:20px;padding:26px 24px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.logincard .lseal{width:74px;height:74px;border-radius:20px;border:2.5px solid #E9B44C;object-fit:cover;display:block;margin:0 auto 10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.logincard h1{font-size:20px;margin:0;text-align:center}

    for(let t=0;t<64;t++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+w[t])>>>0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
/* ผู้ใช้ต้องได้รับสิทธิ์แอพครัวกลาง — ยังไม่เคยตั้งสิทธิ์เลย (apps ว่าง) = ไม่ล็อกใคร */
function kitchenAllowed(u){
  const apps=(u&&u.apps&&typeof u.apps==='object')?u.apps:{};
  if(u.role==='admin'||u.role==='owner')return true;
  if(!Object.keys(apps).length)return true;
  const k=apps.kitchen;
  return !!(k&&typeof k==='object'&&Object.keys(k).some(x=>String(k[x]||'').indexOf('v')>=0));
}
/* บัญชีกลาง → โปรไฟล์แบบที่แอพนี้ใช้อยู่เดิม
   role: ผู้ดูแล/เจ้าของ = owner · ผู้จัดการ หรือมีสิทธิ์หน้าตั้งค่า = manager · ที่เหลือ = warehouse (ทำงานครัวได้ แต่ไม่ใช่ผู้ดูแล) */
function mapCentralProf(u){
  const apps=(u&&u.apps&&typeof u.apps==='object')?u.apps:{};
  const k=apps.kitchen&&typeof apps.kitchen==='object'?apps.kitchen:null;
  const see=x=>!!(k&&String(k[x]||'').indexOf('v')>=0);
  const boss=u.role==='admin'||u.role==='owner';
  const role = boss ? 'owner'
             : (u.role==='manager'||see('set')||see('acc')) ? 'manager' : 'warehouse';
  /* เห็นเฉพาะสาขา (เจ้าของสั่ง 2026-10-02 "กำหนดได้ว่าใครเห็นของสาขาไหน แบบ payroll")
     ตั้งที่ 🔑 JJ Access → กล่องครัวกลาง → apps.kitchen._br = 'JJLP,JJRD' · ไม่ตั้ง/ผู้ดูแลระบบ/เจ้าของ = ทุกสาขา
     "สาขา" ของแอพนี้ = ปลายทางที่ครัวส่งของไป (ออเดอร์สาขา · ยอดที่สาขาต้องการ · ยอดส่ง/รายรับรายสาขา)
     งานในครัวเอง (ผลิต · สต๊อกครัว · สั่งซื้อ · สูตร) ไม่ผูกสาขา เห็นเหมือนเดิม
     ได้แค่ JJCK/OFFICE = เห็นเฉพาะงานในครัว ไม่เห็นข้อมูลสาขาไหนเลย (ไม่ล็อกแอพ — ครัวกลางคือ JJCK เอง)
     ⚠️ อย่าใช้ชื่อ S.br — นั่นคือแคชยอดที่สาขาต้องการ */
  const sc=boss?[]:String((k&&k._br)||'').split(',').map(x=>x.trim())
    .filter(x=>['JJLP','JJRD','JJCK','OFFICE'].includes(x));
  const brScope=sc.length?sc:null;
  return {username:u.username, name:u.display_name||u.username, role, status:'active',
          auth_uid:'central:'+u.username, branch_ids:brScope||[], brScope, perms:{}, central:true,
          unit:u.unit||'ALL', apps:apps, kitchenPerm:k, pass_hash:u.pass_hash};
}
async function centralUser(username){
  const {data,error}=await sb.from('pnl_users')
    .select('username,display_name,role,unit,active,apps,pass_hash')
    .eq('active',true).eq('username',username).maybeSingle();
  if(error)throw error;
  return data||null;
}
async function sbProfile(){                 // อ่านโปรไฟล์จากใบอนุญาตของแท็บนี้
  let sess=null;
  try{ sess=JSON.parse(sessionStorage.getItem(CK_SESS)||'null'); }catch(e){}
  if(!sess||!sess.u)return null;
  const u=await centralUser(sess.u).catch(()=>null);
  if(!u||u.pass_hash!==sess.h)return null;
  return kitchenAllowed(u)?mapCentralProf(u):null;
}
/* ---------- 🔒 ล็อกหน้าจอ — เข้าผ่านลิงก์ตรงๆ ต้องใส่รหัสผ่านซ้ำ ----------
   เปิดจาก "ศูนย์รวมแอพ" (ใบผ่านสดๆ ชื่อผู้ใช้ตรงกัน) → เข้าได้เลยตามสิทธิ์
   เปิดจากลิงก์ตรงๆ → ล็อกไว้ก่อน แม้เครื่องนั้นจะเคยล็อกอินค้างไว้
   (กันกรณีลิงก์หลุด หรือเครื่องกลางในครัวที่ใครก็หยิบมากดได้) */
const TICKET='jjsso_ticket';   // ใบผ่านจากศูนย์รวมแอพ — มาตรฐานเดียวกับ JJ Social / ซ่อมบำรุง
const TICKET_TTL=120000;       // อายุ 2 นาที ใช้ได้ครั้งเดียว
const KEEP_KEY='jjck_keep',KEEP_MS=12*3600*1000;   // "จำไว้ในเครื่องนี้ 12 ชม."
let LOCK=null;                 // {username,email,name} ระหว่างล็อกหน้าจอ
function hubTicket(username){
  let tk=null;
  try{tk=JSON.parse(localStorage.getItem(TICKET)||'null');localStorage.removeItem(TICKET);}catch(e){}
  if(!tk||!tk.u||!tk.t)return false;
  if(tk.app&&tk.app!=='kitchen')return false;      // ใบผ่านออกให้แอพอื่น
  if(Date.now()-Number(tk.t)>TICKET_TTL)return false;
  // ใบผ่านต้องเป็นชื่อเดียวกับบัญชีที่ค้างในเครื่อง — กันคนล็อกอินบัญชีตัวเองที่ศูนย์รวมแอพ
  // แล้วเดินมาใช้สิทธิ์ของคนก่อนหน้าบนเครื่องกลาง
  return String(tk.u).trim().toLowerCase()===String(username||'').trim().toLowerCase();
}
function keepRead(){            // "จำไว้ในเครื่องนี้" ที่ยังไม่หมดอายุ — ต้องมี hash ไว้ตรวจกับ pnl_users ใหม่ทุกครั้ง
  let k=null;
  try{k=JSON.parse(localStorage.getItem(KEEP_KEY)||'null');}catch(e){}
  if(!k||!k.u||!k.h||!(k.exp>Date.now())){if(k)try{localStorage.removeItem(KEEP_KEY)}catch(e){}return null;}
  return k;
}
function keepOk(username){
  const k=keepRead();
  return !!k&&String(k.u).trim().toLowerCase()===String(username||'').trim().toLowerCase();
}
function setKeep(username,on,hash){
  try{(on&&hash)?localStorage.setItem(KEEP_KEY,JSON.stringify({u:username,h:hash,exp:Date.now()+KEEP_MS}))

}

/* เห็นเฉพาะสาขา (apps.kitchen._br) — null = ทุกสาขา */

<script>
/* ============================================================

const S={user:null,prof:null,tab:'dash',setupNeeded:false,
  items:[],sups:[],recipes:[],boms:{},pos:[],poItems:{},plans:[],prods:[],orders:[],orderItems:{},branches:[],
  statsM:todayStr().slice(0,7),charts:{},expCats:[]};

const CK_TABLES=['ck_items','ck_sups','ck_recipes','ck_recipe_items','ck_plans','ck_pos','ck_po_items',
  'ck_productions','ck_prod_items','ck_orders','ck_order_items','ck_moves','ck_price_log','ck_settings'];

  return c==='42P01'||c==='PGRST205'||c==='PGRST204'||c==='42501'||/does not exist|not find the table|permission denied/i.test(m);};

async function loadAll(){
  setBusy(true);
  try{
    const probe=await sb.from('ck_items').select('id').limit(1);
    if(probe.error){if(MISSING_TBL(probe.error)){S.setupNeeded=true;return;}throw probe.error;}
    S.setupNeeded=false;
    const from90=addDays(todayStr(),-45);
    const [it,sp,rc,bm,pl,po,poi,pr,od,odi,br,xc,un,ks,bl,sc1,sc2]=await Promise.all([

      sbAll(()=>sb.from('ck_recipe_items').select('*').order('sort').order('id')),
      sbAll(()=>sb.from('ck_plans').select('*').or('status.eq.plan,d.gte.'+from90).order('d').order('id')),
      sbAll(()=>sb.from('ck_pos').select('*').neq('status','cancel').order('created_at',{ascending:false}).order('id')),
      sbAll(()=>sb.from('ck_po_items').select('*').order('sort').order('id')),

      sb.from('ck_settings').select('value').eq('key','exp_cats').maybeSingle()
        .then(r=>(r&&r.data&&Array.isArray(r.data.value))?r.data.value:[]).catch(()=>[]),
      // หน่วยที่เพิ่มเอง + ตัวแปลงหน่วย (ck_settings key=units)
      sb.from('ck_settings').select('value').eq('key','units').maybeSingle()
        .then(r=>(r&&r.data&&r.data.value&&typeof r.data.value==='object')?r.data.value:null).catch(()=>null),
      // flow ประจำวัน: ค่าตั้งการผลิต/ราคาขายสาขา + การล็อกแก้ไข + บิลซัพ (ยังไม่รัน SQL = ข้ามไป)
      sb.from('ck_settings').select('key,value').in('key',['kplan','editlock']).then(r=>(r&&r.data)||[]).catch(()=>[]),

      sb.from('ck_sups').select('order_days').limit(1).then(r=>!(r&&r.error)).catch(()=>false),

    S.items=it;S.sups=sp;S.recipes=rc;S.plans=pl;S.pos=po;S.prods=pr;S.orders=od.filter(o=>inBr(o.branch));   // เห็นเฉพาะสาขา
    S.boms={};bm.forEach(l=>{(S.boms[l.recipe_id]=S.boms[l.recipe_id]||[]).push(l);});
    S.poItems={};poi.forEach(l=>{(S.poItems[l.po_id]=S.poItems[l.po_id]||[]).push(l);});
    S.orderItems={};odi.forEach(l=>{(S.orderItems[l.order_id]=S.orderItems[l.order_id]||[]).push(l);});
    S.branchesAll=(br&&br.length)?br:[{code:'JJRD',name:'รัชดา'},{code:'JJLP',name:'ลาดพร้าว'}];   // ไว้หาชื่อสาขา
    // สาขาปลายทางที่เลือกส่งได้ — เห็นเฉพาะสาขา = เฉพาะที่ได้สิทธิ์ (ไม่นับแถวครัวกลางของ P&L) · ว่างได้ (ได้แค่ JJCK/OFFICE)
    S.branches=brScoped()?S.branchesAll.filter(b=>inBr(b.code)&&!b.is_central):S.branchesAll;
    S.expCats=(xc||[]).filter(c=>c&&typeof c.n==='string'&&c.n.trim());
    S.units=unitsClean(un);
    const kv=k=>((ks||[]).find(x=>x.key===k)||{}).value;
    S.kp=kpClean(kv('kplan'));S.editlock=elClean(kv('editlock'));S.bills=bl||[];S.kpAvg=null;
    S.scSql=!!(sc1&&sc2);
  }finally{setBusy(false);}
}
async function reloadAll(){await loadAll();applyChrome();show(S.tab);toast('⟳ '+t('done'));autoBackfillI18n();}

function itemById(id){return S.items.find(x=>x.id===id)||null;}
function recipeById(id){return S.recipes.find(x=>x.id===id)||null;}
function supByName(n){return S.sups.find(x=>x.name===(n||''))||null;}
function branchName(code){const b=(S.branchesAll||S.branches).find(x=>x.code===code);return b?b.name:code;}
/* เห็นเฉพาะสาขา: กรองแถวที่มีช่องสาขาตั้งแต่ฝั่งเซิร์ฟเวอร์ (ไม่มีสาขาเลย = ใส่ค่าที่ไม่มีจริง ไม่ส่ง in.() ว่าง) */
function brQin(q,col){const s=S.prof&&S.prof.brScope;return s?q.in(col,s.length?s:['-']):q;}

/* ---------- ต้นทุน ---------- */
function unitCost(it){ // ต้นทุนต่อหน่วยใช้ (ราคา/หน่วยซื้อ ÷ อัตราแปลง)
  if(!it||it.price==null)return null;
  const bq=num(it.buy_qty)||1;return num(it.price)/bq;}
function bomOf(r){return (S.boms[r.id]||[]).filter(l=>itemById(l.item_id));}
function recipeCostCalc(r){ // ต้นทุนตามสูตร (จากราคาวัตถุดิบล่าสุด) ต่อ 1 สูตร และต่อหน่วย
  const bom=bomOf(r);let mat=0,missing=false;
  bom.forEach(l=>{const c=unitCost(itemById(l.item_id));if(c==null){missing=true;return;}mat+=num(l.qty)*c;});
  const total=mat+num(r.extra_cost);
  const y=num(r.yield_qty)||1;
  return {mat,total,perUnit:total/y,missing,hasBom:bom.length>0};}
function recipeUnitCost(r){ // ใช้ต้นทุนผลิตล่าสุดก่อน ถ้าไม่มีใช้คำนวณจากสูตร
  if(r.unit_cost!=null)return num(r.unit_cost);
  const c=recipeCostCalc(r);return c.hasBom&&!c.missing?c.perUnit:null;}
function recipeSellPrice(r){ // ราคาขายสาขา = ต้นทุนจริง/หน่วย + % (เจ้าของเลือก 2026-10-06 · ตั้ง % ที่หน้าตั้งค่า/รายเมนู)
  const c=recipeUnitCost(r);if(c==null)return null;
  return rnd4(c*(1+markupOf(r)/100));}

/* ---------- เคลื่อนไหวสต๊อก (ledger + ยอดคงเหลือ) ---------- */
async function addQty(kind,id,delta){ // บวก/ลบยอดแบบ atomic ผ่าน RPC (กันหลายเครื่องเขียนชนกัน)
  try{
    const {data,error}=await sb.rpc('ck_add_qty',{p_kind:kind,p_id:id,p_delta:delta});
    if(error)throw error;
    return data==null?null:+data;
  }catch(e){ // RPC ยังไม่ติดตั้ง — อ่านยอดล่าสุดจาก DB ก่อนแล้วค่อยเขียนทับ
    const tbl=kind==='item'?'ck_items':'ck_recipes';
    const cur=await dbi(()=>sb.from(tbl).select('qty').eq('id',id).maybeSingle());
    const v=rnd2(num(cur&&cur.qty)+delta);
    await dbi(()=>sb.from(tbl).update({qty:v}).eq('id',id));
    return v;
  }
}
async function pushMoves(moves){ // moves: [{d,kind,item_kind,ref_id,name,qty,cost,ref,note,branch}]
  if(!moves.length)return;
  const by=S.user&&S.user.name;
  await dbi(()=>sb.from('ck_moves').insert(moves.map(m=>Object.assign({by_name:by},m))));
  // รวม delta ต่อชิ้น แล้วอัพเดทยอดคงเหลือ (ยอดจริงจากเซิร์ฟเวอร์)
  const agg={};
  moves.forEach(m=>{const k=m.item_kind+'|'+m.ref_id;agg[k]=(agg[k]||0)+num(m.qty);});
  for(const k of Object.keys(agg)){
    const [kind,id]=k.split('|');
    const o=kind==='item'?itemById(id):recipeById(id);
    if(!o)continue;
    const v=await addQty(kind,id,agg[k]);
    o.qty=v!=null?v:rnd2(num(o.qty)+agg[k]);
  }
}
async function recalcStock(){ // คำนวณยอดคงเหลือใหม่จาก ledger ทั้งหมด
  const all=await dbi(()=>sbAll(()=>sb.from('ck_moves').select('item_kind,ref_id,qty').order('id'),500).then(data=>({data})));
  const agg={};all.forEach(m=>{const k=m.item_kind+'|'+m.ref_id;agg[k]=(agg[k]||0)+num(m.qty);});
  for(const it of S.items){const v=rnd2(agg['item|'+it.id]||0);
    if(v!==num(it.qty)){it.qty=v;await dbi(()=>sb.from('ck_items').update({qty:v}).eq('id',it.id));}}
  for(const r of S.recipes){const v=rnd2(agg['recipe|'+r.id]||0);
    if(v!==num(r.qty)){r.qty=v;await dbi(()=>sb.from('ck_recipes').update({qty:v}).eq('id',r.id));}}
  toast(t('se_recalc_done'));
}

const QUALITY={sm:{max:240,qual:.6},md:{max:480,qual:.72},lg:{max:640,qual:.8}};
function processImage(file,cb){const reader=new FileReader();
  reader.onload=()=>{const im=new Image();
    im.onload=()=>{const q=QUALITY.md;let w=im.width,h=im.height;
      const sc=Math.min(1,q.max/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0,w,h);
      try{cb(cv.toDataURL('image/jpeg',q.qual))}catch(e){cb(null)}};
    im.onerror=()=>cb(null);im.src=reader.result};
  reader.onerror=()=>cb(null);reader.readAsDataURL(file)}
function pickImage(kind,id,after){ // kind: 'item'|'recipe'

      if(!dataUrl)throw new Error(t('img_fail'));
      const blob=await (await fetch(dataUrl)).blob();
      const path='ck/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
      const up=await sb.storage.from('product-images').upload(path,blob,{contentType:'image/jpeg',upsert:true});

/* ---------- 📏 หน่วย + ตัวแปลงหน่วย ----------
   หน่วยที่เพิ่มเอง + ตัวแปลงกลาง เก็บที่ ck_settings key=units {list:[{n,i18n}],conv:[{a,f,b}]} (1 a = f b)
   ขนาดหน่วยของสินค้าแต่ละตัว เก็บที่ ck_items.packs [{u,q}] (1 u = q หน่วยใช้) — เช่น 1 ถุง = 1,000 กรัม
   หน่วยซื้อ (buy_unit/buy_qty) ก็นับเป็นขนาดหน่วยของสินค้านั้นด้วย */
const UNIT_STD=[['กก.',1000,'กรัม'],['ขีด',100,'กรัม'],['ลิตร',1000,'มล.'],['โหล',12,'ชิ้น']];  // ตัวแปลงพื้นฐาน (แก้ไม่ได้)
const rnd4=v=>Math.round((Number(v)||0)*1e4)/1e4;
const fmtQ=n=>(n==null||isNaN(n))?'–':Number(n).toLocaleString('th-TH',{maximumFractionDigits:4});
function unitsClean(v){
  v=(v&&typeof v==='object')?v:{};
  return {list:(Array.isArray(v.list)?v.list:[]).filter(x=>x&&typeof x.n==='string'&&x.n.trim()),
    conv:(Array.isArray(v.conv)?v.conv:[]).filter(c=>c&&typeof c.a==='string'&&typeof c.b==='string'&&c.a&&c.b&&c.a!==c.b&&num(c.f)>0)};}
function unitConvs(){return UNIT_STD.map(x=>({a:x[0],f:x[1],b:x[2],std:1})).concat((S.units&&S.units.conv)||[]);}
function itemPacks(it){return (it&&Array.isArray(it.packs)?it.packs:[]).filter(p=>p&&p.u&&p.u!==it.unit&&num(p.q)>0);}
function unitGraph(it){ // ของสินค้านี้ก่อน (ชนะตัวแปลงกลางเสมอ) แล้วค่อยตัวแปลงกลาง
  const g={};
  const add=(a,b,f)=>{f=num(f);if(!a||!b||a===b||!(f>0))return;(g[a]=g[a]||[]).push([b,f]);(g[b]=g[b]||[]).push([a,1/f]);};
  if(it){const base=it.unit||'';
    if(it.buy_unit&&it.buy_unit!==base)add(it.buy_unit,base,num(it.buy_qty)||1);
    itemPacks(it).forEach(p=>add(p.u,base,p.q));}
  unitConvs().forEach(c=>add(c.a,c.b,c.f));
  return g;}
function unitConv(it,from,to){ // 1 from = ? to · แปลงไม่ได้ = null
  if(!from||!to)return null;if(from===to)return 1;
  const g=unitGraph(it);const seen={};seen[from]=1;let q=[[from,1]];
  while(q.length){const nx=[];
    for(const [u,f] of q)for(const [v,k] of (g[u]||[])){
      if(seen[v])continue;seen[v]=1;const ff=f*k;
      if(v===to)return Math.round(ff*1e9)/1e9;
      nx.push([v,ff]);}
    q=nx;}
  return null;}
function unitFactor(it,u){return it?unitConv(it,u,it.unit||''):null;}  // 1 u = ? หน่วยใช้ของสินค้า
function itemUnits(it){ // หน่วยที่รู้ขนาดแล้วของสินค้านี้ — หน่วยใช้ · หน่วยซื้อ · หน่วยบรรจุ · หน่วยที่แปลงผ่านตัวแปลงกลางได้
  const out=[];const push=u=>{if(u&&!out.includes(u)&&unitFactor(it,u)!=null)out.push(u);};
  push(it.unit);push(it.buy_unit);itemPacks(it).forEach(p=>push(p.u));
  allUnits().forEach(push);unitConvs().forEach(c=>{push(c.a);push(c.b);});
  return out;}
function unitEqTxt(it,u){const f=unitFactor(it,u);
  return (f==null||u===it.unit)?'':'1 '+trUnit(u)+' = '+fmtQ(f)+' '+trUnit(it.unit||'');}

async function unitRegister(n){ // หน่วยใหม่ที่ตั้งตอนรับของ/แก้สินค้า → เข้ารายการหน่วยในหน้าตั้งค่าด้วย

let PACKS_OK=true;   // false = ยังไม่ได้รัน SQL เพิ่มคอลัมน์ ck_items.packs (จำขนาดหน่วยได้แค่รอบนี้)
const packsColErr=e=>!!e&&/packs/i.test(String(e.message||e));
async function itemPackSet(it,u,q){ // จำขนาดหน่วยของสินค้า: 1 u = q หน่วยใช้ (อ่านใหม่ก่อนเขียน)
  const r=await sb.from('ck_items').select('packs').eq('id',it.id).maybeSingle();
  if(r&&r.error&&!packsColErr(r.error)){toast(t('sv_err')+(r.error.message||r.error),true);throw r.error;}
  const cur=(r&&!r.error&&r.data&&Array.isArray(r.data.packs))?r.data.packs:itemPacks(it);
  const next=cur.filter(p=>p&&p.u&&p.u!==u&&num(p.q)>0).concat([{u,q:num(q)}]);
  if(r&&r.error){PACKS_OK=false;it.packs=next;return false;}
  await dbi(()=>sb.from('ck_items').update({packs:next}).eq('id',it.id));
  it.packs=next;return true;}

'alter table ck_pos add column if not exists order_by date;',
'create table if not exists ck_po_items (',
'  id bigserial primary key, po_id text not null, item_id text, name text, unit text,',
'  qty numeric default 0, price numeric, received_qty numeric, sort integer default 0);',
'create index if not exists ck_po_items_po on ck_po_items(po_id);',
'create table if not exists ck_productions (',
'  id text primary key, d date not null, recipe_id text, name text, qty numeric not null,',
'  cost_mat numeric, cost_extra numeric, cost_total numeric, cost_unit numeric,',
'  note text, by_name text, plan_id text, created_at timestamptz default now());',
'create index if not exists ck_productions_d on ck_productions(d);',
'create table if not exists ck_prod_items (',
'  id bigserial primary key, prod_id text not null, item_id text, name text, unit text,',
'  qty numeric default 0, cost numeric default 0);',
'create index if not exists ck_prod_items_p on ck_prod_items(prod_id);',
'create table if not exists ck_orders (',
'  id text primary key, branch text default \'\', branch_name text default \'\', d date not null,',
'  status text default \'new\', total numeric, note text, by_name text, created_at timestamptz default now());',
'create index if not exists ck_orders_d on ck_orders(d);',
'create table if not exists ck_order_items (',
'  id bigserial primary key, order_id text not null, recipe_id text, name text, unit text,',
'  qty numeric default 0, cost_unit numeric, amount numeric, sort integer default 0);',
'create index if not exists ck_order_items_o on ck_order_items(order_id);',
'alter table ck_order_items add column if not exists sell_unit numeric;',
'alter table ck_order_items add column if not exists amount_sell numeric;',
'alter table ck_orders add column if not exists total_sell numeric;',
'create table if not exists ck_moves (',
'  id bigserial primary key, d date not null, kind text not null,',
'  item_kind text not null default \'item\', ref_id text not null, name text,',
'  qty numeric not null, cost numeric, ref text, note text, branch text,',
'  by_name text, created_at timestamptz default now());',
'create index if not exists ck_moves_d on ck_moves(d);',
'create index if not exists ck_moves_ref on ck_moves(ref_id);',
'create table if not exists ck_price_log (',
'  id bigserial primary key, item_id text not null, d date not null, price numeric,',
'  buy_unit text, source text default \'po\', created_at timestamptz default now());',
'create index if not exists ck_price_log_i on ck_price_log(item_id);',
'create table if not exists ck_settings (key text primary key, value jsonb);',
'create table if not exists ck_expenses ( -- ค่าใช้จ่ายครัวกลาง: ค่าแรง ไฟ น้ำ แก๊ส ฯลฯ',
'  id text primary key, d date not null, cat text default \'อื่นๆ\', name text,',
'  amount numeric not null default 0, note text, by_name text, created_at timestamptz default now());',
'create index if not exists ck_expenses_d on ck_expenses(d);',
'create table if not exists ck_br_needs ( -- ยอดที่สาขาต้องการ (จากการนับสต๊อก) vs ส่งจริง — ใช้วางแผนผลิต/สั่งของ',
'  id bigserial primary key, branch text not null, count_date date not null, product_id text not null,',
'  name text, unit text, have numeric, need numeric, sent numeric, recipe_id text, factor numeric,',
'  d_send date, order_id text, by_name text, created_at timestamptz default now(),',
'  unique (branch, count_date, product_id));',
'create index if not exists ck_br_needs_d on ck_br_needs(count_date);',
'',
'-- ฟังก์ชันบวก/ลบยอดสต๊อกแบบ atomic (กันหลายเครื่องกดพร้อมกันแล้วยอดเพี้ยน)',
'create or replace function ck_add_qty(p_kind text, p_id text, p_delta numeric)',
'returns numeric language plpgsql security definer set search_path = public as $fn$',
'declare v numeric;',
'begin',
'  if p_kind = \'item\' then',
'    update ck_items set qty = round(coalesce(qty,0) + p_delta, 2) where id = p_id returning qty into v;',
'  else',
'    update ck_recipes set qty = round(coalesce(qty,0) + p_delta, 2) where id = p_id returning qty into v;',
'  end if;',
'  return v;',
'end $fn$;',
'revoke execute on function ck_add_qty(text,text,numeric) from public;',
'grant execute on function ck_add_qty(text,text,numeric) to anon, authenticated;',
'',
'-- สิทธิ์: แอพเข้าผ่านบัญชีกลาง pnl_users (anon key) เหมือนแอพอื่นในเครือ — สิทธิ์รายคนตรวจที่ตัวแอพ (JJ Access)',
'alter table ck_plans add column if not exists kind text; -- urgent / refill',
'alter table ck_productions add column if not exists plan_qty numeric; -- สั่งผลิต (ผลิตได้จริง = qty)',
'alter table ck_orders add column if not exists bill_no text; -- เลขบิลส่งสาขา',
'create table if not exists ck_bills ( -- บิลรับของจากซัพ (รายการอยู่ใน ck_moves kind=buy ref=id)',
'  id text primary key, d date not null, sup text default \'\', bill_no text, total numeric default 0,',
'  credit_days integer default 0, due_date date, paid_at date, po_id text, note text, by_name text,',
'  created_at timestamptz default now(), updated_at timestamptz default now());',
'do $$ declare tb text; begin',
'  foreach tb in array array[\'ck_items\',\'ck_sups\',\'ck_recipes\',\'ck_recipe_items\',\'ck_plans\',\'ck_pos\',\'ck_po_items\',\'ck_productions\',\'ck_prod_items\',\'ck_orders\',\'ck_order_items\',\'ck_moves\',\'ck_price_log\',\'ck_settings\',\'ck_expenses\',\'ck_br_needs\',\'ck_bills\'] loop',
'    execute format(\'alter table %I enable row level security\', tb);',
'    execute format(\'drop policy if exists ck_auth_all on %I\', tb);',
'    execute format(\'drop policy if exists ck_anon_read on %I\', tb);',
'    if not exists (select 1 from pg_policies where tablename=tb and policyname=\'ck_all\') then',
'      execute format(\'create policy ck_all on %I for all to anon, authenticated using (true) with check (true)\', tb);',
'    end if;',
'    execute format(\'grant select, insert, update, delete on %I to anon, authenticated\', tb);',
'  end loop;',
'end $$;',
'grant usage, select on all sequences in schema public to anon, authenticated;',
'',
'-- รูปภาพ: ใช้ bucket product-images เดิมของแอพนับสต๊อก (มีอยู่แล้ว) — ถ้ายังไม่มีให้สร้าง',
'insert into storage.buckets (id, name, public) values (\'product-images\',\'product-images\',true)',
'on conflict (id) do nothing;',
'do $$ begin',
'  if not exists (select 1 from pg_policies where schemaname=\'storage\' and tablename=\'objects\' and policyname=\'ck_img_up\') then',
'    create policy ck_img_up on storage.objects for insert to anon, authenticated',
'      with check (bucket_id = \'product-images\');',
'  end if;',
'  if not exists (select 1 from pg_policies where schemaname=\'storage\' and tablename=\'objects\' and policyname=\'ck_img_read\') then',
'    create policy ck_img_read on storage.objects for select to anon, authenticated',
'      using (bucket_id = \'product-images\');',
'  end if;',
'  if not exists (select 1 from pg_policies where schemaname=\'storage\' and tablename=\'objects\' and policyname=\'ck_img_del\') then',
'    create policy ck_img_del on storage.objects for delete to anon, authenticated',
'      using (bucket_id = \'product-images\');',
'  end if;',
'end $$;'
].join('\n');
</script>
<script>
/* ============================================================
   Shell: nav + chrome
   ============================================================ */
const VIEWS=['today','dash','plan','buy','produce','orders','stock','menus','items','sups','stats','acc','set'];
function applyChrome(){
  document.body.setAttribute('data-lang',LANG);

    '<a onclick="doLogout()">'+t('logout')+'</a>'+
    (brScoped()?'<div style="margin-top:3px">'+t('br_scope',{b:esc(brScopeTxt()||'—')})+'</div>':'');
  // badge: ใบสั่งซื้อค้างรับ / ออเดอร์ค้าง

function show(v){
  if(!VIEWS.includes(v))v='dash';
  S.tab=v;LS.set('jjck_tab',v);
  document.querySelectorAll('.tabbar button,.sb-item').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(typeof navSync==='function')navSync(v);
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='view-'+v));
  const el=document.getElementById('view-'+v);
  document.getElementById('pageTitle').textContent=t('nav_'+v);
  if(S.setupNeeded){renderSetup(el);return;}
  el.innerHTML='<div class="spin"></div>';
  try{RENDER[v](el);}catch(e){el.innerHTML='<div class="card empty">⚠ '+esc((e&&e.message)||e)+'</div>';console.error(e);}
}
function langModal(){
  openModal('<h3>🌐 '+t('se_lang')+'</h3><div class="langrow">'+
    ['th','en','lo','my'].map(l=>'<button class="'+(l===LANG?'on':'')+'" onclick="setLang(\''+l+'\');closeModal()">'+
      '<span class="fl">'+({th:'🇹🇭',en:'🇬🇧',lo:'🇱🇦',my:'🇲🇲'}[l])+'</span>'+I18N[l].lang_name+'</button>').join('')+'</div>');
}
function renderSetup(el){
  el.innerHTML='<div class="card" id="setupCard"><h3>🛠 '+t('setup_title')+'</h3>'+
    '<div class="hintbox">'+t('setup_txt')+'</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">'+
    '<button class="btn" onclick="copySql()">'+t('se_copy_sql')+'</button>'+
    '<button class="btn gh" onclick="location.reload()">'+t('setup_retry')+'</button></div>'+
    '<textarea readonly id="sqlBox"></textarea></div>';
  document.getElementById('sqlBox').value=KITCHEN_SQL;
}
function copySql(){
  const ta=document.getElementById('sqlBox');
  if(ta){ta.select();}
  (navigator.clipboard?navigator.clipboard.writeText(KITCHEN_SQL):Promise.reject())
    .then(()=>toast(t('se_copied'))).catch(()=>{try{document.execCommand('copy');toast(t('se_copied'));}catch(e){}});
}
const RENDER={};

/* ============================================================
   🏠 หน้าหลัก
   ============================================================ */
function dashLegacyHtml(){ // ส่วนล่างของแดชบอร์ด: แผนผลิต · ใบสั่งซื้อถึงกำหนด · ของใกล้หมด · ออเดอร์ล่าสุด
  const today=bizTodayISO(),tomorrow=addDays(today,1);
  const prToday=S.prods.filter(p=>p.d===today);
  const prVal=prToday.reduce((s,p)=>s+num(p.cost_total),0);
  const low=S.items.filter(i=>i.min_qty!=null&&num(i.qty)<=num(i.min_qty));
  const openOrd=S.orders.filter(o=>o.status==='new'||o.status==='prep');
  const stockVal=S.items.reduce((s,i)=>{const c=unitCost(i);return s+(c!=null?num(i.qty)*c:0);},0);
  const plans=S.plans.filter(p=>p.status==='plan'&&(p.d===today||p.d===tomorrow));
  const poDue=S.pos.filter(p=>p.status==='ordered'&&p.d_due&&p.d_due<=today);
  const poOrderNow=S.pos.filter(p=>p.status==='draft'&&p.order_by&&p.order_by<=today);
  let h='';
  // แผนผลิตวันนี้-พรุ่งนี้
  h+='<div class="card"><h3>📅 '+t('da_plans')+'<span class="sp"><button class="btn sm2" onclick="planModal()">'+t('pl_add')+'</button></span></h3>';
  if(!plans.length)h+='<div class="empty">'+t('da_none_plan')+'</div>';
  else plans.forEach(p=>{const r=recipeById(p.recipe_id);if(!r)return;
    h+='<div class="rowline">'+thumbHtml(r,'🍲')+
      '<div class="grow"><b>'+esc(dispName(r))+'</b><div class="xs mut">'+dispDate(p.d)+' · '+fmtI(p.qty)+' '+esc(r.yield_unit||'')+'</div></div>'+
      (canKitchen()?'<button class="btn sm2" onclick="produceFromPlan(\''+p.id+'\')">'+t('pl_produce_now')+'</button>':'')+'</div>';});
  h+='</div>';
  // ใบสั่งซื้อร่างที่ถึงกำหนดต้องสั่ง
  if(poOrderNow.length){
    h+='<div class="card"><h3>⏰ '+t('pl_order_by')+' — '+t('today')+'</h3>';
    poOrderNow.forEach(p=>{h+='<div class="rowline"><div class="grow"><b>'+esc(p.po_no||'')+'</b> · '+esc(p.sup||'–')+
      '<div class="xs mut">'+t('pl_order_by')+' '+dispDate(p.order_by)+'</div></div>'+
      (canKitchen()?'<button class="btn sm2" onclick="poMarkOrdered(\''+p.id+'\')">'+t('po_mark_ordered')+'</button>':'')+'</div>';});
    h+='</div>';}
  // ของที่ต้องเข้าวันนี้
  if(poDue.length){
    h+='<div class="card"><h3>🚚 '+t('da_po_due')+'</h3>';
    poDue.forEach(p=>{h+='<div class="rowline"><div class="grow"><b>'+esc(p.po_no||'')+'</b> · '+esc(p.sup||'–')+
      '<div class="xs mut">'+t('po_d_due')+' '+dispDate(p.d_due)+'</div></div>'+
      (canKitchen()?'<button class="btn ok sm2" onclick="poReceiveModal(\''+p.id+'\')">'+t('po_receive')+'</button>':'')+'</div>';});
    h+='</div>';}
  // ของใกล้หมด
  h+='<div class="card"><h3>⚠ '+t('da_low_title')+'</h3>';
  if(!low.length)h+='<div class="okbox">'+t('da_all_good')+'</div>';
  else{low.slice(0,10).forEach(i=>{
    h+='<div class="rowline">'+thumbHtml(i,ITEM_CAT_IC[i.cat]||'🥬')+
      '<div class="grow"><b>'+esc(dispName(i))+'</b><div class="xs mut">'+t('sk_now')+' '+fmtI(i.qty)+' '+esc(i.unit||'')+' · '+t('sk_min')+' '+fmtI(i.min_qty)+'</div></div>'+
      '<span class="chip bad">'+fmtI(i.qty)+' '+esc(i.unit||'')+'</span></div>';});
    if(canKitchen())h+='<button class="btn big" style="margin-top:10px" onclick="quickPoLow()">🛒 '+t('da_order_now')+' ('+low.length+')</button>';}
  h+='</div>';
  // ออเดอร์ล่าสุด
  h+='<div class="card"><h3>🚚 '+t('da_recent')+(S.branches.length?'<span class="sp"><button class="btn sm2" onclick="orderModal()">'+t('or_new')+'</button></span>':'')+'</h3>';
  const rec=S.orders.slice(0,6);
  if(!rec.length)h+='<div class="empty">'+t('or_none')+'</div>';
  else rec.forEach(o=>{h+=orderRow(o);});
  h+='</div>';
  return h;
}

/* ============================================================
   📅 แผนผลิต
   ============================================================ */
let PLAN_M=todayStr().slice(0,7);
RENDER.plan=function(el){
  const m=PLAN_M,dim=monthDays(m),today=todayStr();
  const plansM=S.plans.filter(p=>p.d.slice(0,7)===m&&p.status!=='cancel');
  const hasDay={};plansM.forEach(p=>hasDay[p.d]=1);
  const first=new Date(+m.slice(0,4),+m.slice(5,7)-1,1).getDay();
  let cal='<div class="calgrid">'+t('wd').map((w,i)=>'<div class="wd'+(i===0?' sun':'')+'">'+w+'</div>').join('');
  for(let i=0;i<first;i++)cal+='<div></div>';
  for(let d=1;d<=dim;d++){const iso=dstr(m,d);
    cal+='<button class="'+((first+d-1)%7===0?'sun ':'')+(iso===today?'tdy ':'')+(hasDay[iso]?'has':'')+'" onclick="planModal(null,\''+iso+'\')">'+d+'</button>';}
  cal+='</div>';
  let h='<div class="card"><h3>📅 '+t('nav_plan')+
    '<span class="sp"><button class="btn gh sm2" onclick="PLAN_M=prevMonth(PLAN_M);show(\'plan\')">‹</button> <b>'+dispMonth(m)+'</b> <button class="btn gh sm2" onclick="PLAN_M=nextMonth(PLAN_M);show(\'plan\')">›</button></span></h3>'+
    '<div class="md2"><div>'+cal+'<div class="xs mut" style="margin-top:6px">'+t('pl_pick')+' · '+t('pl_date')+'</div></div><div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">'+
    (canKitchen()?'<button class="btn" onclick="planModal()">'+t('pl_add')+'</button>'+
    '<button class="btn dk" onclick="bomWizard()">'+t('pl_calc')+'</button>':'')+'</div>';
  if(!plansM.length)h+='<div class="empty">'+t('pl_none')+'</div>';
  else{
    const byD={};plansM.forEach(p=>{(byD[p.d]=byD[p.d]||[]).push(p);});
    Object.keys(byD).sort().forEach(d=>{
      h+='<div class="secbar">'+dispDate(d)+(d===today?' · '+t('today'):'')+'<span class="sp">'+byD[d].length+' '+t('items_n')+'</span></div>';
      byD[d].forEach(p=>{const r=recipeById(p.recipe_id);
        if(!r){ // เมนูถูกลบ — ให้ลบแผนทิ้งได้ ไม่ค้างเป็นผี
          h+='<div class="rowline"><div class="mthumb">🗑</div><div class="grow"><b class="mut">'+t('menu_deleted')+'</b>'+
            '<div class="xs mut">'+fmtI(p.qty)+'</div></div>'+
            (canKitchen()?'<button class="btn gh sm2" onclick="planDel(\''+p.id+'\')">🗑 '+t('del')+'</button>':'')+'</div>';
          return;}
        h+='<div class="rowline">'+thumbHtml(r,'🍲')+
          '<div class="grow"><b>'+esc(dispName(r))+'</b><div class="xs mut">'+fmtI(p.qty)+' '+esc(trUnit(r.yield_unit||''))+(p.note?' · '+esc(p.note):'')+'</div></div>'+
          '<span class="stpill st-'+(p.status==='done'?'done':'plan')+'">'+(p.status==='done'?t('done'):t('nav_plan'))+'</span>'+
          (canKitchen()&&p.status==='plan'?'<button class="btn sm2" onclick="produceFromPlan(\''+p.id+'\')">🍳</button>'+
          '<button class="btn gh sm2" onclick="planModal(\''+p.id+'\')">✎</button>':'')+'</div>';});
    });
  }
  h+='</div></div></div>';
  el.innerHTML=h;
};
let PL_DRAFT=null;
function planModal(id,dPre,ridPre,qtyPre){
  if(!canKitchen())return;
  const p=id?S.plans.find(x=>x.id===id):null;
  PL_DRAFT=p?{id:p.id,d:p.d,rid:p.recipe_id,qty:num(p.qty),note:p.note||''}
    :{id:null,d:dPre||todayStr(),rid:ridPre||null,qty:qtyPre||null,note:''};
  if(PL_DRAFT.rid&&!num(PL_DRAFT.qty)){const r=recipeById(PL_DRAFT.rid);PL_DRAFT.qty=num(r&&r.yield_qty)||1;}
  paintPlanModal();
}
function paintPlanModal(){
  const d=PL_DRAFT;if(!d)return;
  const r=d.rid?recipeById(d.rid):null;
  openModal('<h3>📅 '+(d.id?'✎ '+t('edit'):t('pl_add'))+'</h3>'+
    '<div class="fld"><label>'+t('pl_date')+'</label><input type="date" id="plD" value="'+esc(d.d)+'" onchange="PL_DRAFT.d=this.value"></div>'+
    '<div class="fld"><label>'+t('pl_menu')+'</label>'+
    '<button class="btn gh" style="width:100%;justify-content:flex-start" onclick="plPick()">'+
    (r?thumbHtml(r,'🍲')+' <b>'+esc(dispName(r))+'</b>':t('pl_pick'))+'</button></div>'+
    '<div class="fld"><label>'+t('pl_qty')+' '+(r?'<span class="mut">('+esc(trUnit(r.yield_unit||''))+')</span>':'')+'</label>'+
    '<div class="stepper"><button onclick="stepQty(\'plQ\',-1);PL_DRAFT.qty=num(document.getElementById(\'plQ\').value)">−</button>'+
    '<input id="plQ" inputmode="decimal" value="'+(num(d.qty)?fmtI(d.qty):'')+'" onchange="PL_DRAFT.qty=num(this.value)">'+
    '<button class="plus" onclick="stepQty(\'plQ\',1);PL_DRAFT.qty=num(document.getElementById(\'plQ\').value)">＋</button></div></div>'+
    '<div class="fld"><label>'+t('note')+'</label><input id="plNote" value="'+esc(d.note)+'" onchange="PL_DRAFT.note=this.value"></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
    (d.id?'<button class="btn gh" onclick="planDel(\''+d.id+'\')">🗑 '+t('del')+'</button>':'')+
    '<button class="btn big" style="flex:1" onclick="planSave()">'+t('save')+'</button></div>');
}
function plPick(){
  pickRecipe(rid=>{PL_DRAFT.rid=rid;const r=recipeById(rid);
    if(!num(PL_DRAFT.qty))PL_DRAFT.qty=num(r&&r.yield_qty)||1;
    paintPlanModal();},paintPlanModal);
}
function stepQty(id,dir){const inp=document.getElementById(id);let v=num(inp.value);
  const step=v>=100?10:1;v=Math.max(0,v+dir*step);inp.value=fmtI(v);}
async function planSave(){await once(async()=>{
  const d=PL_DRAFT;if(!d)return;
  if(!d.rid){toast(t('pl_pick'),true);return;}
  if(!num(d.qty)){toast(t('need_qty'),true);return;}

});}
async function planDel(id){if(!confirm(t('confirm_del')))return;

    await dbi(()=>sb.from('ck_plans').delete().eq('id',id));
    S.plans=S.plans.filter(x=>x.id!==id);PL_DRAFT=null;closeModal();show(S.tab);});}

/* ============================================================
   🧮 บอมสูตร — คำนวณของที่ต้องสั่งจากแผนผลิต (BOM explosion)
   ============================================================ */
function bomWizard(){
  const today=todayStr();
  const from=today,to=addDays(today,7);
  openModal('<h3>'+t('pl_calc')+'</h3>'+
    '<div class="steps"><div class="st on">'+t('pl_step1')+'</div><div class="st">'+t('pl_step2')+'</div><div class="st">'+t('pl_step3')+'</div></div>'+
    '<div class="fld"><label>'+t('pl_range')+'</label><div class="grid2">'+
    '<input type="date" id="bwFrom" value="'+from+'"><input type="date" id="bwTo" value="'+to+'"></div></div>'+
    '<div id="bwPlans"></div>'+
    '<button class="btn big" style="margin-top:12px" onclick="bomExplode()">'+t('next')+' →</button>',true);
  document.getElementById('bwFrom').onchange=paintBwPlans;
  document.getElementById('bwTo').onchange=paintBwPlans;
  paintBwPlans();
}
function paintBwPlans(){
  const f=document.getElementById('bwFrom').value,to=document.getElementById('bwTo').value;
  const list=S.plans.filter(p=>p.status==='plan'&&p.d>=f&&p.d<=to);
  window._bwPlans=list.map(p=>p.id);
  document.getElementById('bwPlans').innerHTML=list.length?list.map(p=>{
    const r=recipeById(p.recipe_id);if(!r)return '';
    return '<div class="rowline">'+thumbHtml(r,'🍲')+'<div class="grow"><b>'+esc(dispName(r))+'</b>'+
      '<div class="xs mut">'+dispDate(p.d)+' · '+fmtI(p.qty)+' '+esc(r.yield_unit||'')+'</div></div>'+
      '<label class="xs"><input type="checkbox" checked data-pid="'+p.id+'" style="width:20px;height:20px"></label></div>';
  }).join(''):'<div class="empty">'+t('pl_none')+' — '+t('pl_add')+'</div>';
}
function bomExplode(){
  const picked=[...document.querySelectorAll('#bwPlans input[data-pid]:checked')].map(x=>x.dataset.pid);
  const plans=S.plans.filter(p=>picked.includes(p.id));
  if(!plans.length){toast(t('pl_pick'),true);return;}
  // ต้องใช้ต่อวัตถุดิบ + วันผลิตแรกที่ใช้ของตัวนั้น
  const need={},firstD={};
  plans.forEach(p=>{const r=recipeById(p.recipe_id);if(!r)return;
    const batches=num(p.qty)/(num(r.yield_qty)||1);
    bomOf(r).forEach(l=>{
      need[l.item_id]=(need[l.item_id]||0)+batches*num(l.qty);
      if(!firstD[l.item_id]||p.d<firstD[l.item_id])firstD[l.item_id]=p.d;});});
  // ของกำลังมา (ใบสั่งซื้อที่สั่งแล้ว/ร่างที่สร้างไว้) — นับเฉพาะที่จะเข้าทันวันผลิต
  const incoming={};
  S.pos.filter(p=>(p.status==='ordered'||p.status==='draft')&&p.d_due).forEach(p=>{(S.poItems[p.id]||[]).forEach(l=>{
    const it=itemById(l.item_id);if(!it)return;
    if(firstD[l.item_id]&&p.d_due>firstD[l.item_id])return; // ของเข้าหลังวันผลิต — ใช้ไม่ทัน
    incoming[l.item_id]=(incoming[l.item_id]||0)+num(l.qty)*(num(it.buy_qty)||1);});});
  const rows=Object.keys(need).map(iid=>{
    const it=itemById(iid);if(!it)return null;
    const have=Math.max(0,num(it.qty)),inc=incoming[iid]||0;
    const short=Math.max(0,need[iid]-have-inc);
    const bq=num(it.buy_qty)||1;
    const buyN=Math.ceil(short/bq-1e-9);
    const lead=num(it.lead_days)||((supByName(it.sup)||{}).lead_days)||1;
    const orderBy=addDays(firstD[iid],-lead);
    return {it,need:need[iid],have,inc,short,buyN,orderBy,produceD:firstD[iid]};
  }).filter(Boolean).sort((a,b)=>(a.it.sup||'')<(b.it.sup||'')?-1:1);
  window._bwRows=rows;
  let h='<h3>'+t('pl_calc')+'</h3>'+
    '<div class="steps"><div class="st ok">'+t('pl_step1')+'</div><div class="st on">'+t('pl_step2')+'</div><div class="st">'+t('pl_step3')+'</div></div>'+
    '<div class="twrap"><table class="t"><tr><th>'+t('nav_items')+'</th><th class="right">'+t('pl_need')+'</th><th class="right">'+t('pl_have')+'</th><th class="right">'+t('pl_incoming')+'</th><th class="right">'+t('pl_short')+'</th></tr>';
  rows.forEach(r=>{h+='<tr><td>'+esc(dispName(r.it))+' <span class="xs mut">'+esc(r.it.unit||'')+'</span></td>'+
    '<td class="n">'+fmtI(r.need)+'</td><td class="n">'+fmtI(r.have)+'</td><td class="n">'+(r.inc?fmtI(r.inc):'–')+'</td>'+
    '<td class="n">'+(r.short>0?'<b style="color:var(--bad)">'+fmtI(r.short)+'</b>':'<span class="chip ok">✓</span>')+'</td></tr>';});
  h+='</table></div>';
  const shorts=rows.filter(r=>r.short>0);
  if(!shorts.length)h+='<div class="okbox" style="margin-top:10px">'+t('pl_no_short')+'</div>';
  else h+='<button class="btn big" style="margin-top:12px" onclick="bomPoStep()">'+t('next')+' →</button>';
  openModal(h,true);
}
function bomPoStep(){
  const shorts=(window._bwRows||[]).filter(r=>r.short>0);
  const bySup={};shorts.forEach(r=>{(bySup[r.it.sup||'']=bySup[r.it.sup||'']||[]).push(r);});
  let h='<h3>'+t('pl_step3')+'</h3>'+
    '<div class="steps"><div class="st ok">'+t('pl_step1')+'</div><div class="st ok">'+t('pl_step2')+'</div><div class="st on">'+t('pl_step3')+'</div></div>';
  Object.keys(bySup).sort().forEach(sup=>{
    const rows=bySup[sup];
    const orderBy=rows.map(r=>r.orderBy).sort()[0];
    h+='<div class="card" style="margin-bottom:10px"><h3>🛒 '+(sup?esc(sup):'–')+
      '<span class="sp chip '+(orderBy<=todayStr()?'bad':'warn')+'">'+t('pl_order_by')+' '+dispDate(orderBy)+'</span></h3>';
    rows.forEach(r=>{h+='<div class="rowline"><div class="grow">'+esc(dispName(r.it))+
      '<div class="xs mut">'+t('pl_short')+' '+fmtI(r.short)+' '+esc(r.it.unit||'')+' · '+t('pl_produce_on')+' '+dispDate(r.produceD)+'</div></div>'+
      '<b>'+r.buyN+' '+esc(r.it.buy_unit||r.it.unit||'')+'</b></div>';});
    h+='</div>';});
  h+='<button class="btn big" onclick="bomCreatePos()">📝 '+t('pl_create_po')+' ('+Object.keys(bySup).length+')</button>';
  openModal(h,true);
}
async function bomCreatePos(){await once(async()=>{
  const shorts=(window._bwRows||[]).filter(r=>r.short>0);
  const bySup={};shorts.forEach(r=>{(bySup[r.it.sup||'']=bySup[r.it.sup||'']||[]).push(r);});
  for(const sup of Object.keys(bySup)){
    const rows=bySup[sup];
    const po={id:uid('po'),po_no:nextPoNo(),sup,d_order:todayStr(),
      d_due:rows.map(r=>r.produceD).sort()[0],order_by:rows.map(r=>r.orderBy).sort()[0],
      status:'draft',by_name:S.user.name,note:t('pr_from_plan')};
    try{await dbi(()=>sb.from('ck_pos').insert(po));}
    catch(e){ // DB เก่ายังไม่มีคอลัมน์ order_by — รัน jjmk_kitchen_setup.sql รอบใหม่จะได้ครบ
      if(!/order_by/.test(String((e&&e.message)||e)))throw e;
      delete po.order_by;await dbi(()=>sb.from('ck_pos').insert(po));}
    const lines=rows.map((r,i)=>({po_id:po.id,item_id:r.it.id,name:r.it.name,
      unit:r.it.buy_unit||r.it.unit||'',qty:r.buyN,price:r.it.price,sort:i}));
    const ins=await dbi(()=>sb.from('ck_po_items').insert(lines).select());
    S.pos.unshift(po);S.poItems[po.id]=ins;
  }
  closeModal();toast(t('pl_created_po')+' ✅');show('buy');
});}
function quickPoLow(){ // สั่งของใกล้หมดทั้งหมดแบบเร็ว (หักของที่สั่งค้างไว้แล้ว)
  const incoming={};
  S.pos.filter(p=>p.status==='ordered'||p.status==='draft').forEach(p=>{(S.poItems[p.id]||[]).forEach(l=>{
    const it=itemById(l.item_id);if(!it)return;
    incoming[l.item_id]=(incoming[l.item_id]||0)+num(l.qty)*(num(it.buy_qty)||1);});});
  const low=S.items.filter(i=>i.min_qty!=null&&num(i.qty)<=num(i.min_qty));
  window._bwRows=low.map(it=>{
    const inc=incoming[it.id]||0;
    const short=Math.max(0,num(it.min_qty)*2-Math.max(0,num(it.qty))-inc);
    if(short<=0)return null;
    const bq=num(it.buy_qty)||1;
    return {it,need:short,have:Math.max(0,num(it.qty)),inc,short,
      buyN:Math.ceil(short/bq-1e-9),orderBy:todayStr(),produceD:addDays(todayStr(),num(it.lead_days)||1)};
  }).filter(Boolean);
  if(!window._bwRows.length){toast(t('pl_no_short'));return;}
  bomPoStep();
}
</script>
<script>
/* ============================================================
   🛒 สั่งซื้อของ (ใบสั่งซื้อ + รับของ)
   ============================================================ */
RENDER.buy=function(el){
  let h='';

    '<button class="btn gh" onclick="kpBuyWizard()">🛒 '+t('kf_s5')+'</button>'+

    (nDraft?'<button class="btn gh" onclick="poSendAllModal()">📤 '+t('kf_send_all')+' ('+nDraft+')</button>':'')+'</div>';
  h+=apHtml(8)+billsRecentHtml();
  const open=S.pos.filter(p=>p.status==='draft'||p.status==='ordered');
  const done=S.pos.filter(p=>p.status==='received').slice(0,20);

function poTotal(p){return (S.poItems[p.id]||[]).reduce((s,l)=>s+num(l.qty)*num(l.price),0);}
function poCard(p){
  const lines=S.poItems[p.id]||[];
  const stMap={draft:['st-draft','📝 '+t('st_draft')],ordered:['st-ordered','📤 '+t('st_ordered')],received:['st-received','✅ '+t('st_received')]};
  const stm=stMap[p.status]||['st-draft',esc(p.status)];
  const late=p.order_by&&p.status==='draft'&&p.order_by<=todayStr();
  let h='<div class="card"><h3>'+esc(p.po_no||'')+' · '+esc(p.sup||'–')+
    '<span class="sp">'+(p.order_by&&p.status==='draft'?'<span class="chip '+(late?'bad':'warn')+'">⏰ '+t('pl_order_by')+' '+dispDate(p.order_by)+'</span> ':'')+
    '<span class="stpill '+stm[0]+'">'+stm[1]+'</span></span></h3>'+
    '<div class="xs mut" style="margin-bottom:8px">'+t('po_d_order')+' '+dispDate(p.d_order)+' · '+t('po_d_due')+' '+dispDate(p.d_due)+
    (p.note?' · '+esc(p.note):'')+'</div>';
  h+='<div class="twrap"><table class="t"><tr><th>'+t('nav_items')+'</th><th class="right">'+t('qty')+'</th><th class="right">'+t('price')+'</th><th class="right">'+t('total')+'</th></tr>';
  lines.forEach(l=>{h+='<tr><td>'+esc(l.name||'')+'</td><td class="n">'+fmtI(p.status==='received'?(l.received_qty??l.qty):l.qty)+' '+esc(trUnit(l.unit||''))+'</td>'+
    '<td class="n">'+fmt(l.price,2)+'</td><td class="n">'+fmt(num(p.status==='received'?(l.received_qty??l.qty):l.qty)*num(l.price),2)+'</td></tr>';});
  h+='<tr class="tot"><td colspan="3">'+t('total')+'</td><td class="n">฿'+fmt(p.status==='received'?num(p.total):poTotal(p),2)+'</td></tr></table></div>';
  if(canKitchen()){
    h+='<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">';
    if(p.status==='draft'||p.status==='ordered')h+='<button class="btn gh sm2" data-id="'+esc(p.id)+'" onclick="poCopy(this.dataset.id)">📋 '+t('kf_copy')+'</button>'+
      '<button class="btn sm2" style="background:#EAF4EC;color:#2E5B3C;border:1.5px solid #9DBFA6" data-id="'+esc(p.id)+'" onclick="poSendLine(this.dataset.id)">📤 '+(supLineId(p.sup)?t('kf_send_line'):t('kf_send_line_nog'))+'</button>';
    if(p.status==='draft')h+='<button class="btn gh sm2" onclick="poModal(\''+p.id+'\')">✎ '+t('edit')+'</button>'+
      '<button class="btn sm2" onclick="poMarkOrdered(\''+p.id+'\')">'+t('po_mark_ordered')+'</button>'+
      '<button class="btn gh sm2" onclick="poDel(\''+p.id+'\')">🗑</button>';
    if(p.status==='ordered')h+='<button class="btn ok sm2" onclick="poReceiveModal(\''+p.id+'\')">'+t('po_receive')+'</button>'+
      '<button class="btn gh sm2" onclick="poModal(\''+p.id+'\')">✎ '+t('edit')+'</button>';
    if(p.status==='received')h+='<button class="btn gh sm2" onclick="poUnreceive(\''+p.id+'\')">'+t('undo_recv')+'</button>';
    h+='</div>';}
  return h+'</div>';
}
let PO_DRAFT=null;
function poModal(id){
  if(!canKitchen())return;
  const p=id?S.pos.find(x=>x.id===id):null;
  PO_DRAFT=p?{id:p.id,po_no:p.po_no,sup:p.sup||'',d_order:p.d_order,d_due:p.d_due,note:p.note||'',status:p.status,
      lines:(S.poItems[p.id]||[]).map(l=>({item_id:l.item_id,name:l.name,unit:l.unit,qty:num(l.qty),price:l.price==null?null:num(l.price)}))}
    :{id:null,po_no:nextPoNo(),sup:'',d_order:todayStr(),d_due:addDays(todayStr(),1),note:'',status:'draft',lines:[]};
  paintPoModal();
}
function paintPoModal(){
  const d=PO_DRAFT;
  const supOpts='<option value=""></option>'+S.sups.filter(s=>s.active!==false).map(s=>'<option '+(s.name===d.sup?'selected':'')+'>'+esc(s.name)+'</option>').join('')
    +(d.sup&&!S.sups.some(s=>s.name===d.sup)?'<option selected>'+esc(d.sup)+'</option>':'');
  let h='<h3>🛒 '+esc(d.po_no)+'</h3>'+
    '<div class="grid2"><div class="fld"><label>'+t('po_sup')+'</label><select id="poSup" onchange="PO_DRAFT.sup=this.value">'+supOpts+'</select></div>'+
    '<div class="fld"><label>'+t('po_d_due')+'</label><input type="date" id="poDue" value="'+esc(d.d_due||'')+'" onchange="PO_DRAFT.d_due=this.value"></div></div>'+
    '<div class="fld"><label>'+t('note')+'</label><input id="poNote" value="'+esc(d.note)+'" onchange="PO_DRAFT.note=this.value"></div>'+
    '<div class="secbar">'+t('nav_items')+'<span class="sp">'+d.lines.length+'</span></div>';
  d.lines.forEach((l,i)=>{
    h+='<div class="rowline"><div class="grow"><b>'+esc(l.name)+'</b><div class="xs mut">'+esc(l.unit||'')+'</div></div>'+
      '<input style="width:76px" inputmode="decimal" value="'+fmtI(l.qty)+'" onchange="PO_DRAFT.lines['+i+'].qty=num(this.value)">'+
      '<input style="width:90px" inputmode="decimal" placeholder="'+t('price')+'" value="'+(l.price==null?'':l.price)+'" onchange="PO_DRAFT.lines['+i+'].price=this.value===\'\'?null:num(this.value)">'+
      '<button class="btn gh sm2" onclick="PO_DRAFT.lines.splice('+i+',1);paintPoModal()">🗑</button></div>';});
  h+='<button class="btn gh" style="width:100%;margin-top:8px" onclick="poAddItem()">'+t('po_add_item')+'</button>'+
    '<button class="btn big" style="margin-top:12px" onclick="poSave()">'+t('save')+'</button>';
  openModal(h,true);
}
function poAddItem(){
  pickItem(iid=>{const it=itemById(iid);if(!it)return;
    PO_DRAFT.lines.push({item_id:it.id,name:it.name,unit:it.buy_unit||it.unit||'',qty:1,price:it.price==null?null:num(it.price)});
    if(!PO_DRAFT.sup&&it.sup)PO_DRAFT.sup=it.sup;
    paintPoModal();});
}
async function poSave(){await once(async()=>{
  const d=PO_DRAFT;if(!d)return;
  if(!d.lines.length){toast(t('po_add_item'),true);return;}
  const row={po_no:d.po_no,sup:d.sup,d_order:d.d_order,d_due:d.d_due||null,note:d.note||null,status:d.status};
  let pid=d.id;
  let oldIds=[];
  if(pid){await dbi(()=>sb.from('ck_pos').update(row).eq('id',pid));
    Object.assign(S.pos.find(x=>x.id===pid),row);
    oldIds=(S.poItems[pid]||[]).map(l=>l.id).filter(x=>x!=null);}
  else{pid=uid('po');row.id=pid;row.by_name=S.user.name;

async function poReceive(id){await once(async()=>{
  const p=S.pos.find(x=>x.id===id);if(!p||p.status!=='ordered')return;
  const lines=S.poItems[id]||[];
  const today=bizTodayISO();const moves=[];let total=0;
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    const rq=num(document.getElementById('rcQ'+i).value);
    const pv=document.getElementById('rcP'+i).value;
    const price=pv===''?null:num(pv);
    l.received_qty=rq;l.price=price;
    await dbi(()=>sb.from('ck_po_items').update({received_qty:rq,price}).eq('id',l.id));
    const it=itemById(l.item_id);
    if(it&&rq>0){
      const stockIn=rq*(num(it.buy_qty)||1);
      moves.push({d:today,kind:'buy',item_kind:'item',ref_id:it.id,name:it.name,qty:stockIn,
        cost:price!=null?rq*price:null,ref:p.id});
      if(price!=null&&num(price)!==num(it.price)){
        it.price=price;
        await dbi(()=>sb.from('ck_items').update({price}).eq('id',it.id));
        await dbi(()=>sb.from('ck_price_log').insert({item_id:it.id,d:today,price,buy_unit:l.unit||it.buy_unit,source:'po'}));
      }else if(price!=null){
        await dbi(()=>sb.from('ck_price_log').insert({item_id:it.id,d:today,price,buy_unit:l.unit||it.buy_unit,source:'po'}));
      }
    }
    total+=rq*num(price);
  }
  await pushMoves(moves);
  p.status='received';p.total=rnd2(total);
  await dbi(()=>sb.from('ck_pos').update({status:'received',total:p.total}).eq('id',id));
  closeModal();applyChrome();toast(t('po_recv_ok'));show(S.tab);
});}
async function poUnreceive(id){ // รับของผิด — คืนสต๊อกแล้วกลับเป็นสถานะสั่งแล้ว
  if(!canKitchen())return;
  const bl=(S.bills||[]).find(b=>b.po_id===id);
  if(bl){await billOpen(bl.id);return;}   // รับผ่านบิล → แก้/ลบที่บิล
  if(!confirm(t('undo_confirm')))return;
  await once(async()=>{
    const p=S.pos.find(x=>x.id===id);if(!p||p.status!=='received')return;
    const mv=await dbi(()=>sb.from('ck_moves').select('*').eq('ref',id).eq('kind','buy'));
    await dbi(()=>sb.from('ck_moves').delete().eq('ref',id).eq('kind','buy'));
    for(const m of (mv||[])){
      const o=itemById(m.ref_id);
      const v=await addQty('item',m.ref_id,-num(m.qty));
      if(o)o.qty=v!=null?v:rnd2(num(o.qty)-num(m.qty));
    }
    for(const l of (S.poItems[id]||[])){
      l.received_qty=null;
      await dbi(()=>sb.from('ck_po_items').update({received_qty:null}).eq('id',l.id));
    }
    p.status='ordered';p.total=null;
    await dbi(()=>sb.from('ck_pos').update({status:'ordered',total:null}).eq('id',id));
    applyChrome();toast(t('sv_ok'));show(S.tab);
  });}

function produceModal(rid,qtyPre,planId,dPre){
  if(!canKitchen())return;
  PR_DRAFT={rid:rid||null,qty:qtyPre||null,planId:planId||null,d:dPre||bizTodayISO(),lines:null,actual:null,actualTouched:false};
  if(rid)prBuildLines();

function prBuildLines(){
  const d=PR_DRAFT;const r=recipeById(d.rid);if(!r)return;
  if(d.qty==null)d.qty=num(r.yield_qty)||1;
  const batches=num(d.qty)/(num(r.yield_qty)||1);
  const old={};(d.lines||[]).forEach(l=>{if(l.touched)old[l.item_id]=l;});
  d.lines=bomOf(r).map(l=>{const it=itemById(l.item_id);
    if(old[l.item_id])return old[l.item_id]; // เก็บไลน์ที่ผู้ใช้แก้มือไว้ ไม่ทับ
    return {item_id:l.item_id,name:it.name,unit:it.unit||'',qty:rnd2(batches*num(l.qty))};});
}

async function produceSave(){await once(async()=>{
  const d=PR_DRAFT;if(!d)return;const r=recipeById(d.rid);
  if(!r||!num(d.qty)){toast(t('need_qty'),true);return;}
  const actual=prActual(d);   // ผลิตได้จริง (ต้นทุน/หน่วย คิดจากยอดนี้) · สั่งผลิต = d.qty (วัตถุดิบคิดตามนี้)
  if(!(actual>0)){toast(t('kf_need_actual'),true);return;}
  if(d.editId&&editDenied('prod',d.d0))return;
  const today=d.d||bizTodayISO();
  if(!canEditRec('prod',today)){toast(t('kf_locked'),true);return;}
  const prodId=d.editId||uid('pr');
  if(d.editId)await prodReverse(d.editId,false);   // แก้ไข = ย้อนของเดิมก่อน แล้วลงใหม่ด้วย id เดิม
  let mat=0;const prodLines=[];const moves=[];
  (d.lines||[]).forEach(l=>{
    const it=itemById(l.item_id);if(!it||!num(l.qty))return;
    const c=unitCost(it);const cost=c!=null?rnd2(num(l.qty)*c):0;
    mat+=cost;
    prodLines.push({item_id:it.id,name:it.name,unit:it.unit||'',qty:num(l.qty),cost});
    moves.push({d:today,kind:'use',item_kind:'item',ref_id:it.id,name:it.name,qty:-num(l.qty),cost,ref:prodId});
  });
  const extra=rnd2(num(r.extra_cost)*(num(d.qty)/(num(r.yield_qty)||1)));
  const total=rnd2(mat+extra);
  const perUnit=rnd4(total/actual);
  const prod={id:prodId,d:today,recipe_id:r.id,name:r.name,qty:actual,plan_qty:num(d.qty),
    cost_mat:rnd2(mat),cost_extra:extra,cost_total:total,cost_unit:perUnit,
    plan_id:d.planId||null,by_name:S.user.name};
  // ต้นทุน/หน่วยของที่ผลิตแล้วในสต๊อก = ถัวเฉลี่ยกับของเดิม (ราคาขายสาขาคิดจากตัวนี้)
  const oldQ=Math.max(0,num(r.qty)),oldC=r.unit_cost!=null?num(r.unit_cost):null;
  const avg=(oldC!=null&&oldQ>0)?(oldQ*oldC+total)/(oldQ+actual):total/actual;
  await insFallback('ck_productions',[prod],['plan_qty']);
  if(prodLines.length)await dbi(()=>sb.from('ck_prod_items').insert(prodLines.map(l=>Object.assign({prod_id:prod.id},l))));
  moves.push({d:today,kind:'made',item_kind:'recipe',ref_id:r.id,name:r.name,qty:actual,cost:total,ref:prod.id});
  await pushMoves(moves);
  r.unit_cost=rnd4(avg);
  await dbi(()=>sb.from('ck_recipes').update({unit_cost:r.unit_cost}).eq('id',r.id));
  if(d.planId){await dbi(()=>sb.from('ck_plans').update({status:'done'}).eq('id',d.planId));
    const p=S.plans.find(x=>x.id===d.planId);if(p)p.status='done';}
  S.prods=S.prods.filter(x=>x.id!==prodId);S.prods.unshift(prod);
  S.prods.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
  PR_DRAFT=null;closeModal();toast(t('pr_ok'));show(S.tab);
});}

async function orderStatus(id,st){
  if(st!=='done'&&!canKitchen())return; // สาขากดยืนยัน 'รับแล้ว' ได้อย่างเดียว
  if(!S.orders.some(x=>x.id===id))return; // ออเดอร์ที่ไม่อยู่ในรายการ (สาขาที่ไม่มีสิทธิ์) ห้ามแก้ — เช็คก่อนเขียน
  await once(async()=>{
    await dbi(()=>sb.from('ck_orders').update({status:st}).eq('id',id));
    const o=S.orders.find(x=>x.id===id);if(o)o.status=st;
    closeModal();applyChrome();show(S.tab);
  });}
async function orderSend(id){
  if(!canKitchen())return;
  const o=S.orders.find(x=>x.id===id);const lines=S.orderItems[id]||[];
  if(!o||o.status!=='prep')return;
  // เช็คของพอ/ยืนยัน ก่อนเขียนข้อมูลใดๆ
  const short=lines.some(l=>{const r=recipeById(l.recipe_id);return r&&num(l.qty)>num(r.qty);});
  if(!confirm(t('or_send_confirm')+(short?'\n'+t('or_stock_short'):'')))return;
  await once(async()=>{
  const today=bizTodayISO();const moves=[];let total=0,totalSell=0,sellOk=true;
  for(const l of lines){
    const r=recipeById(l.recipe_id);if(!r)continue;
    const cu=recipeUnitCost(r);
    const sp=recipeSellPrice(r);
    const amount=cu!=null?rnd2(num(l.qty)*cu):null;
    const amountSell=sp!=null?rnd2(num(l.qty)*sp):null;
    l.cost_unit=cu;l.amount=amount;if(amount!=null)total+=amount;
    if(amountSell!=null)totalSell+=amountSell;
    if(sellOk){try{await dbi(()=>sb.from('ck_order_items').update({cost_unit:cu,amount,sell_unit:sp,amount_sell:amountSell}).eq('id',l.id));}
      catch(e){if(!/sell_unit|amount_sell/.test(String((e&&e.message)||e)))throw e;
        sellOk=false;await dbi(()=>sb.from('ck_order_items').update({cost_unit:cu,amount}).eq('id',l.id));}}
    else await dbi(()=>sb.from('ck_order_items').update({cost_unit:cu,amount}).eq('id',l.id));
    moves.push({d:today,kind:'send',item_kind:'recipe',ref_id:r.id,name:r.name,qty:-num(l.qty),
      cost:amount,ref:o.id,branch:o.branch});
  }
  await pushMoves(moves);
  o.status='sent';o.total=rnd2(total);o.total_sell=rnd2(totalSell);
  try{await dbi(()=>sb.from('ck_orders').update({status:'sent',total:o.total,total_sell:rnd2(totalSell)}).eq('id',id));}
  catch(e){if(!/total_sell/.test(String((e&&e.message)||e)))throw e;
    await dbi(()=>sb.from('ck_orders').update({status:'sent',total:o.total}).eq('id',id));}
  await billNoAssign(o);
  closeModal();applyChrome();toast(t('or_sent_ok')+(o.bill_no?' · 🧾 '+o.bill_no:''));show(S.tab);
  });}
async function orderUnsend(id){ // ส่งผิด — คืนสต๊อกของที่ผลิตแล้ว กลับสถานะกำลังจัด
  if(!canKitchen())return;
  const o0=S.orders.find(x=>x.id===id);if(o0&&editDenied('send',o0.d))return;
  if(!confirm(t('undo_confirm')))return;
  await once(async()=>{
    const o=S.orders.find(x=>x.id===id);if(!o||o.status!=='sent')return;
    const mv=await dbi(()=>sb.from('ck_moves').select('*').eq('ref',id).eq('kind','send'));
    await dbi(()=>sb.from('ck_moves').delete().eq('ref',id).eq('kind','send'));
    for(const m of (mv||[])){
      const r=recipeById(m.ref_id);
      const v=await addQty('recipe',m.ref_id,-num(m.qty)); // qty ของ move เป็นลบ — ลบลบ = บวกคืน
      if(r)r.qty=v!=null?v:rnd2(num(r.qty)-num(m.qty));
    }
    const fromCount=String(o.note||'').startsWith('📋');   // ส่งตามยอดนับสาขา — ยกเลิกทั้งใบ แล้วส่งใหม่จากการ์ดยอดนับ
    const st=fromCount?'cancel':'prep';
    o.status=st;o.total=null;
    await dbi(()=>sb.from('ck_orders').update({status:st,total:null}).eq('id',id));
    if(fromCount){try{await brUnsendHook(o);}catch(e){}}
    closeModal();applyChrome();toast(t('sv_ok'));show(S.tab);
  });}

    '<table><tr><th style="width:30px">#</th><th>'+t('nav_menus')+'</th><th class="n">'+t('qty')+'</th><th class="n">'+t('price')+'/'+t('unit')+'</th><th class="n">'+t('total')+'</th></tr>'+rows+
    '<tr><td colspan="4" style="text-align:right;font-weight:700">'+t('kf_bill_amt')+'</td><td class="n" style="font-weight:700">'+fmt(o.total_sell!=null?num(o.total_sell):tot,2)+'</td></tr></table>'+

  window.print();
}

        rows.map(x=>esc(x.name)+' '+fmtI(Math.abs(num(x.qty)))).join(' · ')+'</div></div>'+
        '<b>฿'+fmt(val,2)+'</b></div>';});
  }
  h+='</div>';

  // รับเข้าวันนี้
  h+='<div class="card"><h3>📥 '+t('td_recv_today')+'</h3>';
  if(!recv.length)h+='<div class="empty">'+t('td_none')+'</div>';
  else recv.forEach(x=>{const it=itemById(x.ref_id);const isBill=String(x.ref||'').startsWith('bl');const fromPo=x.ref&&!String(x.ref).startsWith('qr')&&!isBill;
    h+='<div class="rowline">'+thumbHtml(it,ITEM_CAT_IC[it&&it.cat]||'🥬')+
