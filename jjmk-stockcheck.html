<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JJ เช็คสต๊อก · จริงใจหมูกระทะ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#C62127;--dk:#7E1013;--wine:#6B0F12;--ink:#2E2119;--mut:#8A7A66;--line:#E8DFCC;--card:#FFFDF7;--bg:#F6F1E5;--green:#1F7A43;--amber:#A66A00;--blue:#5B7FA6;--gold:#E5B03C;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Sarabun',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:86px}
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--dk),#690C0F);color:#fff;padding:10px 16px 8px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hrow{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-family:'Prompt';font-size:17px;font-weight:700;white-space:nowrap}
.seg{display:flex;gap:6px}
.seg button{padding:7px 14px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#F2DCDC;font-weight:700;font-size:13.5px;font-family:'Prompt';cursor:pointer}
.seg button.on{background:#fff;color:var(--dk)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{padding:7px 13px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#F2DCDC;font-weight:700;font-size:13px;font-family:'Prompt';cursor:pointer}
.tabs button.on{background:var(--gold);color:#5A3E00}
header input[type=date],header input[type=text]{padding:7px 9px;border:0;border-radius:10px;font-size:13.5px}
/* ---- แถบแผนก (pills) ---- */
.deptbar{position:sticky;top:0;z-index:25;background:var(--bg);border-bottom:3px solid var(--gold);padding:10px 16px 8px}
.deptbar .in{max-width:1220px;margin:0 auto}
#pills{display:flex;flex-direction:column;gap:3px}
.zrow{display:flex;align-items:flex-start;gap:10px}
.zlb{flex:none;font-family:'Prompt';font-weight:700;font-size:12px;color:var(--wine);background:#F6E7E7;border-radius:8px;padding:7px 11px;margin-top:2px;white-space:nowrap}
.zsel{margin-left:6px;padding:5px 8px;border:1.5px solid var(--line);border-radius:9px;font-size:12px;background:#fff;font-family:'Sarabun'}
.hlogo{width:28px;height:28px;border-radius:9px;border:1.5px solid #E9B44C;object-fit:cover;vertical-align:-7px;margin-right:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:4px}
@media(max-width:640px){.pills{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}}
.pill{flex:none;display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:99px;border:1.8px solid var(--wine);background:#fff;color:var(--wine);font-family:'Prompt';font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--wine);color:#fff}
.pill .bdg{background:#F6E7E7;color:var(--wine);border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:700}
.pill.on .bdg{background:rgba(255,255,255,.22);color:#fff}
.pill .ok{color:var(--green);font-size:13px}
.pill.on .ok{color:#B9E8C5}
.srch{width:100%;padding:11px 16px;border:1.5px solid var(--line);border-radius:99px;font-size:15px;background:#fff;margin-top:4px}
main{max-width:1220px;margin:0 auto;padding:14px 16px}
.dhead{display:flex;align-items:center;gap:12px;margin:6px 0 14px;font-family:'Prompt';font-weight:700;font-size:17px;color:var(--wine)}
.dhead::after{content:'';flex:1;height:2px;background:var(--gold);border-radius:2px}
.note{background:#FDF6E7;border:1.5px dashed #D9BE85;border-radius:12px;padding:8px 14px;font-size:12.5px;color:#7A6234;margin-bottom:12px}
/* ---- การ์ดนับ ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:#fff;border:1.8px solid var(--wine);border-radius:var(--r);padding:12px 14px}
.pcard.done{border-color:#9DBFA6;background:#FBFDFA}
.pcard .top{display:flex;align-items:flex-start;gap:10px}
.pimg{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#F3ECE0;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:1px solid var(--line);flex:none}
.pcard .t{font-family:'Prompt';font-weight:700;font-size:15px}
.pcard .st-n{font-size:11.5px;color:var(--amber);font-weight:700}
.pcard .st-y{font-size:11.5px;color:var(--green);font-weight:700}
.pcard .cn{font-size:11.5px;color:var(--blue)}
.pcard .cam{margin-left:auto;border:0;background:none;font-size:15px;cursor:pointer;opacity:.5}
.pcard .mid{display:flex;align-items:center;gap:8px;margin-top:12px}
.chip{border:1.5px solid var(--line);background:#FBF6EA;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--wine)}
.step{display:flex;gap:6px;margin-left:auto;align-items:center}
.step button{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:#FBF6EA;color:var(--mut);font-size:19px;cursor:pointer}
.step button.plus{background:var(--wine);border-color:var(--wine);color:#fff}
.step input{width:64px;height:40px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;text-align:center;background:#FBF6EA}
.step input.has{border-color:var(--green);background:#F0F8F1;font-weight:700}
.pcard .bot{display:flex;align-items:center;margin-top:10px}
.pcard .bst{font-size:12.5px;color:var(--mut)}
.pcard .bst b{color:var(--green)}
.outb{margin-left:auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 16px;font-size:13px;color:var(--mut);cursor:pointer}
.outb.on{background:#FBEAEA;border-color:#E4A6A6;color:var(--red);font-weight:700}
/* ---- หน้าผูกชื่อ / Safety ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card>.h{display:flex;align-items:center;gap:9px;padding:11px 15px;font-family:'Prompt';font-weight:700;font-size:15px;background:#FBF6EA;border-bottom:1px solid #F0E8D6}
.card>.h .n{margin-left:auto;font-size:12px;color:var(--mut);font-weight:600}
.lrow{display:grid;grid-template-columns:46px minmax(160px,1fr) minmax(160px,1fr) 130px;gap:10px;align-items:center;padding:8px 15px;border-bottom:1px solid #F5EFE1;font-size:14px}
.lrow:last-child{border-bottom:0}
.lhd{display:grid;grid-template-columns:46px minmax(160px,1fr) minmax(160px,1fr) 130px;gap:10px;padding:7px 15px;font-size:11px;color:var(--mut);font-weight:700;border-bottom:1px solid #F2EBDB}
.okt{color:var(--green);font-weight:700;font-size:12.5px}
.wat{color:var(--amber);font-weight:700;font-size:12.5px}
.hd2,.row2{display:grid;grid-template-columns:46px minmax(190px,1fr) 150px 90px 90px 90px;gap:10px;align-items:center;padding:8px 15px}
.hd2{font-size:11px;color:var(--mut);font-weight:700;border-bottom:1px solid #F2EBDB;padding:7px 15px}
.row2{border-bottom:1px solid #F5EFE1}
.row2:last-child{border-bottom:0}
.nm .t{font-weight:700;font-size:14.5px}
.nm .s{font-size:11.5px;color:var(--mut)}
.nm .s .cn{color:var(--blue)}
.ri{width:100%;max-width:86px;padding:8px 6px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;text-align:center;background:#fff}
.ri.dirty{border-color:var(--amber);background:#FFFBEF;font-weight:700}
.di{width:100%;padding:8px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;background:#fff}
.di.dirty{border-color:var(--amber);background:#FFFBEF}
.zsel.dirty{border-color:var(--amber);background:#FFFBEF}
.brchip{display:inline-flex;align-items:center;gap:5px;background:#F2EDE0;border:1.5px solid var(--line);color:var(--mut);border-radius:99px;padding:4px 10px;font-size:12px;margin:2px 3px 2px 0}
.brchip.on{background:#EAF4EC;border-color:#9DBFA6;color:#2E5B3C;font-weight:700}
.brchip button{border:0;background:none;color:var(--red);cursor:pointer;font-size:12px;padding:0 1px;font-weight:700}
.lrow.dim{opacity:.62}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px;margin-bottom:13px}
.dtile{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.dtile .ic{font-size:23px;flex:none}
.dtile .lb{font-size:12px;color:var(--mut);font-weight:600}
.dtile .v{font-family:'Prompt';font-weight:700;font-size:22px;line-height:1.15}
.dtile .sb{font-size:11.5px;color:var(--mut)}
.pbar{height:9px;background:#EFE7D6;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px}
.bchip{display:inline-block;background:#F1E7D2;border:1.5px solid #D9BE85;color:#6B4E14;border-radius:9px;padding:6px 12px;font-weight:700;font-size:13.5px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(0,0,0,.07);z-index:20}
.foot .in{max-width:1220px;margin:0 auto;display:flex;gap:12px;align-items:center}
.foot .st{flex:1;font-size:13.5px;color:var(--mut)}
.foot .st b{color:var(--ink)}
.savebtn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-family:'Prompt';font-weight:700;font-size:15px;box-shadow:0 3px 10px rgba(198,33,39,.3);cursor:pointer}
.savebtn:disabled{opacity:.5}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#ctl input[type=text]{padding:7px 9px;border:0;border-radius:10px;font-size:13.5px;width:110px}
#sideNav #ctl{flex-direction:column;align-items:stretch;margin:6px 0 12px;gap:7px}
#sideNav #ctl input{width:100%;border:0}
.clb{display:none}
#sideNav #ctl .clb{display:block;font-family:'Prompt';font-weight:600;font-size:10.5px;color:#F2DCDC;opacity:.8;letter-spacing:.06em;margin:2px 2px -2px}
#sideNav #ctl input[type=date]{background:rgba(255,255,255,.14);color:#fff;font-family:'Prompt';font-weight:600;font-size:14px;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.22);color-scheme:dark;cursor:pointer}
#sideNav #ctl input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.9;cursor:pointer}
#sideNav #ctl input[type=date]:hover{background:rgba(255,255,255,.2)}
#sideNav #ctl input[type=text]{background:rgba(255,255,255,.14);color:#fff;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.22);font-size:14px}
#sideNav #ctl input[type=text]::placeholder{color:rgba(255,255,255,.55)}
header #ctl input[type=date]{border-radius:10px;padding:7px 9px;font-size:13.5px;border:0}
#sideNav #ctl .seg button{flex:1}
#cfgBox{margin-top:auto}
#cfgSub{display:none;margin:2px 0 4px}
#cfgSub.on{display:block}
.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.stb{padding:9px 14px;border-radius:99px;border:1.8px solid var(--wine);background:#fff;color:var(--wine);font-family:'Prompt';font-weight:700;font-size:13.5px;cursor:pointer}
.stb.on{background:var(--wine);color:#fff}
@media(min-width:821px){
  .subtabs{display:none}
  #sideNav .ni .ic{flex:none;width:22px;text-align:center;font-size:15px}
  #sideNav .ni.head.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
  #sideNav .ni.sub{font-size:13.5px;font-weight:600;color:#EFD9D9;padding:9px 10px 9px 12px;margin:2px 0 2px 14px;
    border-left:2px solid rgba(255,255,255,.2);border-radius:0 10px 10px 0;line-height:1.35}
  #sideNav .ni.sub .ic{width:20px;font-size:14px}
  #sideNav .ni.sub:hover{background:rgba(255,255,255,.08);color:#fff}
  #sideNav .ni.sub.on{background:rgba(255,255,255,.2);color:#fff;border-left-color:var(--gold);box-shadow:none}
}
#uchip{display:none;color:#F2DCDC;font-size:12.5px;padding:10px 4px 2px;border-top:1px solid rgba(255,255,255,.15)}
#uchip b{color:#fff}
#uchip a{color:#F1C40F;cursor:pointer;font-weight:700;margin-left:8px}
#loginOv{position:fixed;inset:0;background:linear-gradient(180deg,#7E1013,#4E090B);z-index:100;display:none;align-items:center;justify-content:center}
#loginOv.on{display:flex}
.lgcard{background:#fff;border-radius:18px;padding:26px 24px;width:min(92vw,360px);text-align:center}
.lgcard img{width:64px;height:64px;border-radius:16px;border:2px solid #E9B44C;margin-bottom:8px}
.lgcard h2{font-family:'Prompt';font-size:18px;margin-bottom:12px}
.lgcard input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;margin-bottom:9px}
.lgcard button{width:100%;padding:12px;border:0;border-radius:11px;background:var(--red);color:#fff;font-family:'Prompt';font-weight:700;font-size:15px;cursor:pointer}
.lgmsg{color:var(--red);font-size:12.5px;min-height:17px;margin-bottom:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:86px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:92vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
#ptr{position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-64px);background:var(--wine);color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;z-index:99;transition:.2s;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#ptr.on{transform:translateX(-50%) translateY(0)}
#sideNav{display:none}
@media(min-width:821px){
  body{padding-left:222px}
  #sideNav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:222px;z-index:60;background:linear-gradient(180deg,#7E1013,#690C0F);padding:18px 13px;gap:3px}
  #sideNav .brand{font-family:'Prompt';font-weight:700;color:#fff;font-size:17px;display:flex;align-items:center;gap:8px}
  #sideNav .brand img{width:32px;height:32px;border-radius:10px;border:1.5px solid #E9B44C;object-fit:cover}
  #sideNav .bsub{font-size:11px;color:#F2DCDC;margin-bottom:14px}
  #sideNav .ni{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:#F2DCDC;font-family:'Prompt';font-weight:600;font-size:14.5px;padding:11px 12px;border-radius:11px;cursor:pointer}
  #sideNav .ni:hover{background:rgba(255,255,255,.09)}
  #sideNav .ni.on{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.28)}
  .tabs{display:none}
  header h1{display:none}
  .foot{left:222px}
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr 1fr;gap:9px}
  .pcard{padding:10px}
  .pcard .t{font-size:13.5px}
  .step input{width:52px}
  .step button{width:36px;height:36px}
  .chip{padding:7px 10px;font-size:12px}
  .lrow,.lhd{grid-template-columns:38px 1fr 1fr 92px;font-size:12.5px}
  .hd2{display:none}
  .row2{grid-template-columns:46px 1fr;row-gap:6px}
  .row2 .lbl::before{content:attr(data-l);display:block;font-size:10px;color:var(--mut)}
}
</style>
</head>
<body>
<nav id="sideNav">
  <div class="brand"><img id="scLogo" alt="จริงใจ">JJ เช็คสต๊อก</div>
  <div class="bsub">จริงใจหมูกระทะ · เชื่อมระบบนับ + P&amp;L</div>
  <div id="scSlot"></div>
  <button class="ni on" data-t="dash">📊 แดชบอร์ด</button>
  <button class="ni" data-t="count">📋 นับสต๊อก</button>
  <button class="ni" data-t="order">🛒 สั่งของ</button>
  <button class="ni" data-t="link">🔗 ผูกชื่อ</button>
  <button class="ni" data-t="set">🛟 Safety</button>
  <button class="ni" data-t="sched">🚚 รอบสั่งซัพ</button>
  <button class="ni" data-t="items">📦 รายการสินค้า</button>
  <div id="cfgBox">
    <button class="ni head" data-t="cfg"><span class="ic">⚙️</span>ตั้งค่า</button>
    <div id="cfgSub">
      <button class="ni sub" data-t="cfgu"><span class="ic">👤</span>สิทธิ์การใช้งานพนักงาน</button>
      <button class="ni sub" data-t="cfgd"><span class="ic">🗂</span>แผนก</button>
      <button class="ni sub" data-t="cfgn"><span class="ic">📐</span>หน่วยซื้อ–หน่วยนับ</button>
      <button class="ni sub" data-t="cfgl"><span class="ic">🏭</span>ซัพพลายเออร์</button>
    </div>
  </div>
  <div id="uchip"></div>
</nav>
<header>
  <div class="hrow">
    <h1><img class="hlogo" id="hdLogo" alt="">JJ เช็คสต๊อก</h1>
    <div id="hcSlot"><div id="ctl">
      <span class="clb">📅 วันที่นับ</span>
      <input type="date" id="cd">
      <span class="clb">🏪 สาขา</span>
      <div class="seg" id="brSeg"></div>
      <span class="clb">👤 ผู้นับ</span>
      <input type="text" id="who" placeholder="ชื่อผู้นับ">
    </div></div>
    <div class="tabs">
      <button id="tabDash" data-t="dash" class="on">📊</button>
      <button id="tabCount" data-t="count">📋 นับสต๊อก</button>
      <button id="tabOrder" data-t="order">🛒</button>
      <button id="tabLink" data-t="link">🔗 ผูกชื่อ</button>
      <button id="tabSet" data-t="set">🛟 Safety</button>
      <button id="tabSched" data-t="sched">🚚</button>
      <button id="tabItems" data-t="items">📦</button>
      <button id="tabCfg" data-t="cfg">⚙️</button>
    </div>
  </div>
</header>
<div class="deptbar" id="deptbar">
  <div class="in">
    <div id="pills"></div>
    <input class="srch" id="q" placeholder="🔍 พิมพ์ชื่อสินค้าค้นหา (ทุกแผนก)...">
  </div>
</div>
<main><div id="list"><div class="empty">กำลังโหลด...</div></div></main>
<div class="foot"><div class="in">
  <div class="st" id="st">–</div>
  <button class="savebtn" id="save">💾 บันทึก</button>
</div></div>
<input type="file" id="imgFile" accept="image/*" style="display:none">
<div id="loginOv"><div class="lgcard">
  <img id="lgLogo" alt="จริงใจ"><h2>JJ เช็คสต๊อก</h2>
  <input id="lgU" placeholder="ชื่อผู้ใช้" autocomplete="username">
  <input id="lgP" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
  <div class="lgmsg" id="lgMsg"></div>
  <button id="lgBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
</div></div>
<div id="toast"></div>
<div id="ptr">↓ ลากลงเพื่อรีเฟรช</div>
<script>
/* ============ JJ เช็คสต๊อก v3 ============
   หน้า: 📋 นับสต๊อก · 🔗 ผูกชื่อ · 🛟 Safety (อัตราใช้/วัน) · 🚚 รอบสั่งซัพ · 📦 รายการสินค้า (ทุกสาขา) · ⚙️ ตั้งค่า แยกหน้าละหัวข้อ (👤 สิทธิ์ผู้ใช้ · 🗂 แผนก · 📐 หน่วยซื้อ↔หน่วยนับ)

function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const enc=new TextEncoder().encode(str);
  const l=enc.length, bitLen=l*8;
  const withOne=l+1, total=(Math.ceil((withOne+8)/64))*64;
  const M=new Uint8Array(total); M.set(enc); M[l]=0x80;
  const dv=new DataView(M.buffer);
  dv.setUint32(total-4, bitLen>>>0); dv.setUint32(total-8, Math.floor(bitLen/4294967296));
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  const w=new Array(64);
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){
      const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3);
      const s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[t]+w[t])>>>0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}

    cat_label:r.it.cat_label||deptOf(r.it),unit:r.it.unit||'',sup:sp,order_date:od,ordered:num(r.order)}));
  if(!rows.length)return;
  await api('POST','stock_receipts?on_conflict=branch_id,product_id,order_date',rows,'resolution=merge-duplicates,return=minimal')
    .catch(e=>{toast('ส่งไลน์สำเร็จ แต่บันทึกยอดสั่งไม่ได้ — '+String(e.message||e).slice(0,90),true);});
  S.sentToday=S.sentToday||{}; S.sentToday[sp]=od;
}
function copyOrder(sp){
  const t=orderText(sp); if(!t){toast('ไม่มีรายการต้องสั่ง',true);return;}
  const done=()=>toast('✅ คัดลอกใบสั่ง '+sp+' แล้ว — วางในไลน์กลุ่มซัพได้เลย');
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));}
    else fallbackCopy(t,done); }catch(e){ fallbackCopy(t,done); }
}
function fallbackCopy(t,done){
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){toast('คัดลอกไม่ได้ — ก็อปจากกล่องข้อความแทนครับ',true);}
  ta.remove();
}

  // การผูกต้องตรงกันทั้งสองทาง (เช็ครวม 2 สาขา):

function supObj(n){const e=S.supEdit=S.supEdit||{};
  if(!e[n]){const x=supSched(n)||{};
    e[n]={exists:!!supSched(n),mode:supModeOf(x),
      lead:(parseInt(x.lead_days,10)>=1?parseInt(x.lead_days,10):1),schedule:{...(x.schedule||{})}};}
  return e[n];}
function supSetMode(i,v){supObj(S.supList[i]).mode=v;render();}
function supSetLead(i,v){supObj(S.supList[i]).lead=Math.max(1,parseInt(v,10)||1);render();}

async function supSave(i){

function billOfName(e){ // ชื่อบิลของสินค้า (จากการผูกของสาขาใดก็ได้)

async function delProd(id){ // เอาสินค้าออกจากสาขาเดียว (soft delete)

  const br=Object.keys(STK_BR).find(b=>STK_BR[b]===r.branch_id)||'';
  if(!confirm('เอา "'+r.name+'" ออกจากสาขา'+(BR_NAME[br]||'')+'?\n\nจะไม่ขึ้นหน้านับสต๊อกของสาขานี้อีก (ยอดนับเดิมยังอยู่)'))return;

function supCount(n){ // จำนวนสินค้าที่ใช้ซัพนี้ (ทุกสาขา ถ้าโหลดแล้ว)

async function supAdd(nm){
  const el=document.getElementById('nsName');
  const name=String(nm||(el&&el.value)||'').trim();
  if(!name){toast('พิมพ์ชื่อซัพก่อนครับ',true);return;}
  if(supSched(name)){toast('มีซัพ "'+name+'" อยู่แล้ว',true);return;}
  try{
    await api('POST','suppliers',{name,order_mode:'any',lead_days:1},'return=minimal');
    (S.sups=S.sups||[]).push({name,order_mode:'any',lead_days:1,line_group_id:null});
    if(el&&!nm)el.value='';
    toast('✅ เพิ่มซัพ "'+name+'" แล้ว — ผูกกลุ่มไลน์และตั้งรอบสั่งได้เลย');render();
  }catch(e){toast('เพิ่มซัพไม่สำเร็จ — '+errMsg(e),true);}
}
async function supRename(old){
  const x=supSched(old);
  const nn=(prompt('เปลี่ยนชื่อซัพ "'+old+'" เป็น\n(จะแก้ชื่อซัพในสินค้าทุกสาขาให้ด้วย)',old)||'').trim();
  if(!nn||nn===old)return;
  if(supKey(nn)!==supKey(old)&&supSched(nn)){toast('มีซัพชื่อ "'+nn+'" อยู่แล้ว',true);return;}
  try{
    if(x)await api('PATCH','suppliers?name=eq.'+encodeURIComponent(x.name),{name:nn},'return=minimal');
    await api('PATCH','products?sup=eq.'+encodeURIComponent(old),{sup:nn},'return=minimal').catch(()=>{});
    if(x)x.name=nn;
    [S.all,S.allBr].forEach(arr=>(arr||[]).forEach(p2=>{if(supKey(p2.sup)===supKey(old))p2.sup=nn;}));
    toast('✅ เปลี่ยนชื่อซัพ "'+old+'" → "'+nn+'" (แก้ในสินค้าทุกสาขาแล้ว)');render();
  }catch(e){toast('เปลี่ยนชื่อไม่สำเร็จ — '+errMsg(e),true);}
}
async function supMove(from){
  const others=(S._lineSups||[]).filter(x=>supKey(x)!==supKey(from));
  const to=(prompt('ย้ายสินค้าของ "'+from+'" ('+supCount(from)+' ตัว) ไปซัพไหน?\n\nซัพที่มี: '+others.join(', '),'')||'').trim();
  if(!to)return;
  if(!supSched(to)&&!others.some(x=>supKey(x)===supKey(to))){toast('ไม่พบซัพ "'+to+'" — เพิ่มซัพก่อนครับ',true);return;}
  try{
    await api('PATCH','products?sup=eq.'+encodeURIComponent(from),{sup:to},'return=minimal');
    [S.all,S.allBr].forEach(arr=>(arr||[]).forEach(p2=>{if(supKey(p2.sup)===supKey(from))p2.sup=to;}));
    toast('✅ ย้ายสินค้าของ "'+from+'" → "'+to+'" แล้ว');render();
  }catch(e){toast('ย้ายไม่สำเร็จ — '+errMsg(e),true);}
}
async function supDel(name){

  try{
    await api('DELETE','suppliers?name=eq.'+encodeURIComponent(name),null,'return=minimal');

}
async function lineSave(i){ // เขียนลง suppliers.line_group_id (ชุดเดียวกับแอพนับเดิม)

async function addDept(){

  if(!nm){toast('พิมพ์ชื่อแผนกก่อนครับ',true);return;}
  if((S.depts||[]).some(d2=>String(d2.name||'').trim()===nm)||S.all.some(x=>deptOf(x)===nm)){toast('มีแผนก "'+nm+'" อยู่แล้ว',true);return;}
  if(!S.deptTbl){toast('ต้องรัน sql/jjmk_stockcheck_depts.sql ก่อนถึงเพิ่มแผนกเปล่าได้ครับ',true);return;}
  try{
    const r=await api('POST','sc_depts',{branch_id:STK_BR[S.br],name:nm,sort:(S.depts||[]).length+1},'return=representation');

async function delDept(nm){
  const ids=deptIds(nm),cnt=ids.length;
  if(!confirm('ลบแผนก "'+nm+'" ของสาขา'+BR_NAME[S.br]+'?'+(cnt?('\n\nของ '+cnt+' รายการในแผนกนี้จะถูกย้ายไป "ยังไม่จัดแผนก" (ไม่ได้ลบสินค้า)'):''))) return;
  try{
    if(cnt)await patchIds(ids,{dept:null}); // ล้างเฉพาะ dept — ห้ามแตะ cat_label (แอพนับเดิมใช้จัดหมวดและบันทึกลง stock_counts)
    const d2=(S.depts||[]).find(x=>String(x.name||'').trim()===nm);
    if(d2&&d2.id!=null)await api('DELETE','sc_depts?id=eq.'+d2.id,null,'return=minimal');
    S.all.forEach(x=>{if(ids.includes(x.id))x.dept=null;});

  }catch(e){toast('ลบแผนกไม่สำเร็จ — '+String(e.message||e).slice(0,100),true);}
}
async function moveDept(id,v){
  if(v==='__keep')return;
  const it=S.all.find(x=>x.id===id); if(!it)return;
  let nd=v==='__none'?'':v;
  if(v==='__new'){nd=(prompt('ชื่อแผนกใหม่')||'').trim();if(!nd){render();return;}}
  try{
    await api('PATCH','products?id=eq.'+encodeURIComponent(it.id),{dept:nd||null},'return=minimal'); // แผนกแยกสาขา → แก้เฉพาะตัวนี้
    if(nd&&S.deptTbl&&!(S.depts||[]).some(x=>String(x.name||'').trim()===nd)){
      const r=await api('POST','sc_depts',{branch_id:STK_BR[S.br],name:nd,sort:(S.depts||[]).length+1},'return=representation').catch(()=>null);
      (S.depts=S.depts||[]).push((r&&r[0])||{name:nd,branch_id:STK_BR[S.br]});
    }

}
const deptIds=name=>S.all.filter(x=>deptOf(x)===name).map(x=>x.id);
async function patchIds(ids,body){ // PATCH เป็นชุด ๆ กัน URL ยาวเกิน
  for(let i=0;i<ids.length;i+=40){
    await api('PATCH','products?id=in.('+ids.slice(i,i+40).map(encodeURIComponent).join(',')+')',body,'return=minimal');
  }

async function adoptDepts(){ // เอา "หมวดเดิม" ของแอพนับมาเป็นแผนกจริงของสาขานี้
  const todo=S.all.filter(x=>!String(x.dept||'').trim()&&String(x.cat_label||'').trim());
  if(!todo.length){toast('ทุกตัวตั้งแผนกจริงแล้ว ✓');return;}
  if(!confirm('ใช้หมวดเดิมจากแอพนับเป็นแผนกจริงของสาขา'+BR_NAME[S.br]+' '+todo.length+' รายการ?\n(ชื่อกลุ่มเหมือนเดิม แต่จะแก้/ย้าย/ลบ ได้จากหน้านี้)'))return;
  const byCat={}; todo.forEach(x=>{(byCat[String(x.cat_label).trim()]=byCat[String(x.cat_label).trim()]||[]).push(x);});
  try{
    for(const k of Object.keys(byCat)){
      await patchIds(byCat[k].map(x=>x.id),{dept:k});
      byCat[k].forEach(x=>{x.dept=k;});
      if(S.deptTbl&&!(S.depts||[]).some(d2=>String(d2.name||'').trim()===k)){
        const r=await api('POST','sc_depts',{branch_id:STK_BR[S.br],name:k,sort:(S.depts||[]).length+1},'return=representation').catch(()=>null);
        (S.depts=S.depts||[]).push((r&&r[0])||{name:k,branch_id:STK_BR[S.br]});
      }
    }
    toast('✅ ตั้งแผนกจริงให้ '+todo.length+' รายการแล้ว');render();
  }catch(e){toast('ตั้งแผนกไม่สำเร็จ — '+String(e.message||e).slice(0,100),true);}
}
async function renameDept(old){
  const nn=(prompt('เปลี่ยนชื่อแผนก "'+old+'" เป็น',old)||'').trim();
  if(!nn||nn===old)return;
  try{
    const ids=deptIds(old);
    if(ids.length)await patchIds(ids,{dept:nn}); // เขียน dept ตรง ๆ (รองรับกลุ่มที่มาจากหมวดเดิม)
    const d2=(S.depts||[]).find(x=>String(x.name||'').trim()===old);
    if(d2&&d2.id!=null){await api('PATCH','sc_depts?id=eq.'+d2.id,{name:nn},'return=minimal').catch(()=>{});d2.name=nn;}
    S.all.forEach(x=>{if(ids.includes(x.id))x.dept=nn;});
    if(S.deptOpen&&S.deptOpen[old]){S.deptOpen[nn]=true;delete S.deptOpen[old];}
    if(localStorage.getItem('jjsc_dept')===old)localStorage.setItem('jjsc_dept',nn);
    toast('✅ เปลี่ยนชื่อแผนก "'+old+'" → "'+nn+'" (สาขา'+BR_NAME[S.br]+')');render();
  }catch(e){toast('เปลี่ยนชื่อแผนกไม่สำเร็จ — '+String(e.message||e).slice(0,100),true);}
}
async function ensureBillUnits(force){ // หน่วยซื้อ = หน่วยที่ลงบิลจริง (pnl_bill_items) แยกตามซัพ + ตัวคูณจาก pnl_unit_conv
  if((S.billUnits&&!force)||S._buLoading)return;
  S._buLoading=true;
  try{
    const to=($('#cd')&&$('#cd').value)||bizToday(),dt=new Date(to+'T12:00:00');
    dt.setDate(dt.getDate()-180); const p2=n=>String(n).padStart(2,'0');
    const from=dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate());
    const [rows,sups,conv]=await Promise.all([
      selAll('pnl_bill_items?select=item,unit,d,supplier_id&branch=eq.'+S.br+'&d=gte.'+from+'&order=d.desc'),
      selAll('pnl_suppliers?select=id,name&order=id').catch(()=>[]),
      selAll('pnl_unit_conv?select=item,from_unit,to_unit,factor&order=id').catch(()=>[])
    ]);
    const supName={}; sups.forEach(x=>{supName[String(x.id)]=String(x.name||'').trim();});
    const acc={},bySup={};
    rows.forEach(r=>{
      const k=String(r.item||'').trim(),u=String(r.unit||'').trim(); if(!k||!u)return;
      const sp=supName[String(r.supplier_id)]||'(ไม่ระบุซัพ)',d2=String(r.d||'');
      const e=acc[k]=acc[k]||{n:{},last:{}};
      e.n[u]=(e.n[u]||0)+1; if(!e.last[u]||d2>e.last[u])e.last[u]=d2;
      const g=bySup[sp]=bySup[sp]||{};
      const gi=g[k]=g[k]||{};
      const gu=gi[u]=gi[u]||{n:0,last:''};
      gu.n++; if(d2>gu.last)gu.last=d2;
    });
    const out={};
    Object.keys(acc).forEach(k=>{const e=acc[k];
      const list=Object.keys(e.n).map(u=>({u,n:e.n[u],last:e.last[u]})).sort((a,b)=>b.n-a.n||(a.last<b.last?1:-1));
      out[k]={list,top:list[0].u,last:list[0].last};});
    S.billUnits=out; S.billSup=bySup; S.buFrom=from; S.buErr=null;
    S.conv={}; conv.forEach(r=>{S.conv[String(r.item||'').trim()+'|'+String(r.from_unit||'').trim()]={to:String(r.to_unit||'').trim(),f:num(r.factor)};});
  }catch(e){ S.billUnits={}; S.billSup={}; S.conv=S.conv||{}; S.buErr=String(e.message||e).slice(0,90); }
  S._buLoading=false;
  if(isCfgTab(S.tab)||S.tab==='items'||S.tab==='order'||S.tab==='dash')render(); // โหลดเสร็จแล้ววาดใหม่
}
const buOf=n=>(S.billUnits||{})[String(n||'').trim()]||null;
/* ---- ลำดับรายการมาตรฐาน (ใช้ทุกเมนู): ของที่มีครบทุกสาขาก่อน เรียงตามชื่อ · ของที่มีบางสาขาไว้ท้ายกลุ่ม ---- */
const nBr=n=>(S.nameBrN||{})[String(n||'').trim()]||Object.keys(STK_BR).length;

async function convSave(i){ // เซฟหน่วยนับ (ตามชื่อ=2 สาขา) + ตัวคูณของหน่วยซื้อนั้น (pnl_unit_conv)
  const r=(S._uRows||[])[i]; if(!r)return;
  const it=S.all.find(x=>x.id===r.pid); if(!it)return;
  const cuEl=document.getElementById('cu_'+i),fxEl=document.getElementById('fx_'+i);
  const cu=((cuEl&&cuEl.value)||'').trim()||String(it.unit||'');
  try{
    if(cu&&cu!==String(it.unit||'')){ // หน่วยนับ: ชื่อเดียวทั้ง 2 สาขา
      await api('PATCH','products?name=eq.'+encodeURIComponent(it.name),{unit:cu},'return=minimal');
      await api('PATCH','pnl_stock_map?product_name=eq.'+encodeURIComponent(it.name),{stock_unit:cu},'return=minimal').catch(()=>{});
      S.all.forEach(x=>{if(x.name===it.name)x.unit=cu;});
      (S.mapRows||[]).forEach(x=>{if(x.product_name===it.name)x.stock_unit=cu;});
    }
    if(r.unit&&r.unit!==cu&&fxEl&&!fxEl.disabled){
      const f=num(fxEl.value);
      if(!f){toast('ใส่ตัวคูณก่อนครับ (1 '+r.unit+' = กี่ '+cu+')',true);return;}
      await api('POST','pnl_unit_conv?on_conflict=item,from_unit',
        [{item:r.item,from_unit:r.unit,to_unit:cu,factor:f}],'resolution=merge-duplicates,return=minimal');
      (S.conv=S.conv||{})[r.item+'|'+r.unit]={to:cu,f};
      toast('✅ 1 '+r.unit+' = '+fq(f)+' '+cu+' ('+r.item+')');
    }else toast('✅ บันทึกหน่วยนับ '+it.name+' = '+cu);
    render();

function shrink(file){return new Promise(res=>{
  const img=new Image();img.onload=()=>{
    const M=640,k=Math.min(1,M/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>res(b),'image/jpeg',0.8);
  };img.onerror=()=>res(null);img.src=URL.createObjectURL(file);});}

  await api('PATCH','products?name=eq.'+encodeURIComponent(name),{image_url:url},'return=minimal');

async function upImg(file){
  const it=S.all.find(x=>x.id===S.imgTarget);if(!it||!file)return;
  toast('⏳ กำลังอัปโหลดรูป...');
  try{
    const blob=await shrink(file);if(!blob)throw new Error('อ่านรูปไม่สำเร็จ');
    const path='p/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    const r=await fetch(CONFIG.URL+'/storage/v1/object/product-images/'+path,{method:'POST',
      headers:{apikey:CONFIG.KEY,Authorization:'Bearer '+CONFIG.KEY,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
    if(!r.ok)throw new Error(await r.text().catch(()=>r.status));
    await setImgUrl(it.name,CONFIG.URL+'/storage/v1/object/public/product-images/'+path);
    toast('✅ ใส่รูป '+billName(it)+' แล้ว (เห็นทั้ง 2 สาขา)');render();
  }catch(e){toast('อัปโหลดรูปไม่สำเร็จ — '+String(e.message||e).slice(0,100),true);}
}
/* ---- บันทึก ---- */
async function saveAll(){
  const btn=$('#save');btn.disabled=true;const old=btn.textContent;btn.textContent='⏳ กำลังบันทึก...';
  try{
    if(S.tab==='count'){
      const who=($('#who').value||'').trim();localStorage.setItem('jjsc_who',who);
      const hash=cntHash;
      const picked=S.items.filter(it=>counted(it)&&hash(it)!==it._saved);
      if(!picked.length){toast('ทุกแถวเหมือนที่บันทึกไว้แล้ว ✓ ไม่ต้องเซฟซ้ำ');btn.disabled=false;btn.textContent=old;refresh();return;}
      const cd=$('#cd').value||bizToday(),bid=STK_BR[S.br];
      const hist=picked.map(it=>({branch_id:bid,branch_name:BR_NAME[S.br],count_date:cd,counter:who||null,
        cat_label:deptOf(it),product_id:it.id,name:it.name,unit:it.unit||'',
        sup:it.sup||'',qty:num(it.qty),out_of_stock:!!it.out,safety:it.safety??null,max:it.max??null}));
      const cur=picked.map(it=>({branch_id:bid,product_id:it.id,qty:num(it.qty),counter:who||null,updated_at:new Date().toISOString()}));
      await api('POST','stock_counts',hist,'return=minimal');
      await api('POST','stock_current?on_conflict=branch_id,product_id',cur,'resolution=merge-duplicates,return=minimal');
      picked.forEach(it=>{S.cur[it.id]={product_id:it.id,qty:num(it.qty)};it._saved=String(num(it.qty))+'|'+(it.out?1:0);});
      draftSave();
      toast('✅ บันทึกการนับ '+picked.length+' รายการ');
    }else if(S.tab==='set'){
      const dirty=S.items.filter(isDirty);
      for(const it of dirty){
        const d2={...it.dirty};
        const dept=d2.dept; delete d2.dept;
        if(dept!==undefined)d2.dept=dept||null; // แผนกแยกสาขา → ไปกับ PATCH by id ตัวเดียวกัน
        if(Object.keys(d2).length)await api('PATCH','products?id=eq.'+encodeURIComponent(it.id),d2,'return=minimal');
        if(dept!==undefined)it.dept=dept||null;
        Object.assign(it,Object.fromEntries(Object.entries(it.dirty).filter(([k])=>k!=='dept')));
        it.dirty={};
      }
      toast('✅ บันทึกตั้งค่า '+dirty.length+' รายการ');
    }
    render();
  }catch(e){toast('บันทึกไม่สำเร็จ — '+String(e.message||e).slice(0,140),true);}
  btn.disabled=false;btn.textContent=old;refresh();
}
function setTab(t){
  if((t==='set'||t==='sched'||t==='items'||isCfgTab(t))&&S.user&&S.user.role!=='admin'){toast('หน้านี้สำหรับแอดมินเท่านั้น',true);return;}
  if(t==='cfg')t=localStorage.getItem('jjsc_cfg')||'cfgu'; // กดหัวข้อ "ตั้งค่า" = เข้าหัวข้อย่อยล่าสุด
  S.tab=t;localStorage.setItem('jjsc_tab',t);
  if(isCfgTab(t))localStorage.setItem('jjsc_cfg',t);
  markNav(t);
  render();}
function markNav(t){
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t||(b.dataset.t==='cfg'&&isCfgTab(t))));
  const sub=$('#cfgSub'); if(sub)sub.classList.toggle('on',isCfgTab(t));
}

async function initAuth(){
  try{ await api('GET','sc_users?select=id&limit=1'); S.authOn=true; }
  catch(e){ S.authOn=false; return; } // ยังไม่ได้รัน sql ผู้ใช้ = โหมดเปิด
  const saved=JSON.parse(localStorage.getItem('jjsc_auth')||'null');
  if(saved){
    const rows=await api('GET','sc_users?select=*&active=is.true&username=eq.'+encodeURIComponent(saved.u)).catch(()=>[]);
    if(rows[0]&&rows[0].pass_hash===saved.h){ S.user=rows[0]; return; }
  }
  showLogin();
}
function showLogin(){ $('#loginOv').classList.add('on'); const el=$('#lgU'); if(el)setTimeout(()=>el.focus(),50); }
async function doLogin(){
  const u=($('#lgU').value||'').trim(),p=$('#lgP').value||'';
  if(!u||!p){$('#lgMsg').textContent='ใส่ชื่อผู้ใช้และรหัสผ่านก่อนครับ';return;}
  const rows=await api('GET','sc_users?select=*&active=is.true&username=eq.'+encodeURIComponent(u)).catch(()=>[]);
  if(!rows[0]||rows[0].pass_hash!==pwHash(u,p)){$('#lgMsg').textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return;}
  S.user=rows[0]; localStorage.setItem('jjsc_auth',JSON.stringify({u,h:rows[0].pass_hash}));
  $('#loginOv').classList.remove('on'); $('#lgP').value='';
  applyAuth(); await loadAll();
}
function logout(){ localStorage.removeItem('jjsc_auth'); S.user=null; S.users=null; showLogin(); applyAuth(); }
const allowedBr=()=>{const u=S.user;const all=Object.keys(STK_BR);
  return (u&&Array.isArray(u.branches)&&u.branches.length)?all.filter(b=>u.branches.includes(b)):all;};
const canDept=d=>{const u=S.user;
  return !u||u.role==='admin'||!Array.isArray(u.depts)||!u.depts.length||u.depts.includes(d);};
function renderBr(){
  const bs=allowedBr();
  if(!bs.includes(S.br))S.br=bs[0]||'JJRD';
  $('#brSeg').innerHTML=bs.map(b=>'<button data-br="'+b+'" class="'+(S.br===b?'on':'')+'">'+BR_NAME[b]+'</button>').join('');
}
function applyAuth(){
  renderBr();
  const u=S.user;
  if(u){$('#who').value=u.username;$('#who').readOnly=true;} // ผู้นับ = username ที่ล็อกอิน ล็อกแก้ไม่ได้
  else $('#who').readOnly=false;
  $('#uchip').style.display=u?'block':'none';
  if(u)$('#uchip').innerHTML='👤 <b>'+esc(u.display_name||u.username)+'</b> · '+(u.role==='admin'?'แอดมิน':'พนักงาน')+'<a onclick="logout()">ออก</a>';
  const noAdm=!!(u&&u.role!=='admin');
  document.querySelectorAll('[data-t="set"],[data-t="sched"],[data-t="items"],[data-t="cfg"],#cfgBox').forEach(b=>{b.style.display=noAdm?'none':'';}); // Safety/รอบสั่งซัพ/ตั้งค่า เฉพาะแอดมิน
}
function placeCtl(){
  const c=$('#ctl'),t=window.innerWidth>=821?$('#scSlot'):$('#hcSlot');
  if(c&&t&&c.parentElement!==t)t.appendChild(c);
}
function boot(){
  ['scLogo','hdLogo','lgLogo'].forEach(id=>{const el=document.getElementById(id);if(el)el.src=LOGO_B64;});
  ['icon','apple-touch-icon'].forEach(rel=>{const l=document.createElement('link');l.rel=rel;l.href=LOGO_B64;document.head.appendChild(l);});
  renderBr(); placeCtl(); window.addEventListener('resize',placeCtl);
  $('#lgP')&&($('#lgP').onkeydown=e=>{if(e.key==='Enter')doLogin();});
  $('#brSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.br=b.dataset.br;localStorage.setItem('jjsc_br',S.br);
    document.querySelectorAll('#brSeg button').forEach(x=>x.classList.toggle('on',x.dataset.br===S.br));loadAll();};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  $('#cd').value=bizToday();
  $('#who').value=localStorage.getItem('jjsc_who')||'';
  $('#q').oninput=e=>{S.q=e.target.value;render();};
  $('#pills').addEventListener('wheel',e=>{const p=e.target.closest('.pills');
    if(p&&p.scrollWidth>p.clientWidth){p.scrollLeft+=(e.deltaY||e.deltaX);e.preventDefault();}},{passive:false});
  $('#cd').onchange=()=>{S._cdManual=true;loadAll();};
  setInterval(()=>{ // ข้ามตี 6 = วันขายใหม่ → รีเซ็ตหน้านับอัตโนมัติ (ถ้าไม่ได้เลือกวันเองไว้)
    if(!S._cdManual&&$('#cd').value!==bizToday()){$('#cd').value=bizToday();loadAll();}
  },60000);
  $('#save').onclick=saveAll;
  $('#imgFile').onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';upImg(f);};
  initPtr();
  initAuth().then(()=>{applyAuth();restoreTab();return loadAll();})
    .catch(e=>{$('#list').innerHTML='<div class="empty">โหลดไม่สำเร็จ — '+esc(e.message||e)+'</div>';});
}
boot();
