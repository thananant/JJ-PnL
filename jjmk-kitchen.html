      '<div class="xs mut">'+fmtQ(x.qty)+' '+esc(trUnit(it?it.unit||'':''))+(x.note?' ('+esc(x.note)+')':'')+(fromPo?' · '+t('td_from_po'):'')+'</div></div>'+
      (x.cost!=null?'<b>฿'+fmt(x.cost,2)+'</b>':'')+
      (isBill?'<button class="btn gh sm2" data-id="'+esc(x.ref)+'" onclick="billOpen(this.dataset.id)">🧾</button>':
       (K&&!fromPo?'<button class="btn gh sm2" onclick="mvUndo('+x.id+')">↩</button>':''))+'</div>';});
  h+='</div>';

  // ของผลิตคงเหลือ — "ควรเหลือเท่าไร"
  const madeBy={},sentBy={};
  mv.filter(x=>x.kind==='made').forEach(x=>{madeBy[x.ref_id]=(madeBy[x.ref_id]||0)+num(x.qty);});
  sends.forEach(x=>{sentBy[x.ref_id]=(sentBy[x.ref_id]||0)+Math.abs(num(x.qty));});
  const showRecs=S.recipes.filter(r=>num(r.qty)!==0||madeBy[r.id]||sentBy[r.id]);
  h+='<div class="card"><h3>🍲 '+t('td_left')+'</h3>';
  if(!showRecs.length)h+='<div class="empty">'+t('td_none')+'</div>';
  else{h+='<div class="twrap"><table class="t"><tr><th>'+t('nav_menus')+'</th><th class="right">'+t('stt_made')+'</th><th class="right">'+t('stt_send')+'</th><th class="right"><b>'+t('sk_now')+'</b></th></tr>';
    showRecs.forEach(r=>{
      h+='<tr><td>'+esc(dispName(r))+'</td><td class="n">'+(madeBy[r.id]?fmtI(madeBy[r.id]):'–')+'</td>'+
        '<td class="n">'+(sentBy[r.id]?fmtI(sentBy[r.id]):'–')+'</td>'+
        '<td class="n"><b>'+fmtI(r.qty)+' '+esc(trUnit(r.yield_unit||''))+'</b></td></tr>';});
    h+='</table></div>';}
  h+='<button class="btn dk" style="margin-top:10px" onclick="todayPrint()">'+t('td_print')+'</button></div>';

};

/* ---------- ↩ ยกเลิกรายการเคลื่อนไหวเดี่ยว (รับเข้าเร็ว) ---------- */
async function mvUndo(id){
  if(!canKitchen())return;
  if(!confirm(t('undo_confirm')))return;
  await once(async()=>{
    const rows=await dbi(()=>sb.from('ck_moves').select('*').eq('id',id));
    const m=rows&&rows[0];if(!m)return;
    if(editDenied('bill',m.d))return;
    await dbi(()=>sb.from('ck_moves').delete().eq('id',id));
    const o=m.item_kind==='item'?itemById(m.ref_id):recipeById(m.ref_id);
    const v=await addQty(m.item_kind,m.ref_id,-num(m.qty));
    if(o)o.qty=v!=null?v:rnd2(num(o.qty)-num(m.qty));
    toast(t('sv_ok'));show(S.tab);
  });}

/* ---------- 📥 รับของเข้าเร็ว (ไม่ต้องมีใบสั่งซื้อ) — ใส่ได้หลายหน่วย เช่น 10 ชุด + 2 กก. ---------- */
let QR=null;
function qrBlank(){return {iid:null,lines:[],price:'',pu:'',auto:true,def:null};}
function qrModal(){if(!canKitchen())return;QR=qrBlank();paintQr();}
function qrPick(){
  pickItem(iid=>{const it=itemById(iid);QR.iid=iid;QR.def=null;QR.auto=true;
    const base=(it&&it.unit)||'';
    const bu=it&&it.buy_unit&&it.buy_unit!==base?it.buy_unit:null;
    QR.lines=bu?[{q:'',u:bu},{q:'',u:base}]:[{q:'',u:base}];   // ตั้งต้น: หน่วยซื้อ + เศษเป็นหน่วยใช้ (แบบเดิม)
    QR.pu=bu||base;qrAutoPrice();paintQr();},paintQr);
}
function qrPriceF(it,u){ // 1 u = ? หน่วยใช้ — ฝั่งราคาใช้ buy_qty ตรง ๆ ให้ตรงกับ unitCost()
  return u===(it.buy_unit||it.unit)?(num(it.buy_qty)||1):unitFactor(it,u);}
function qrPriceUnits(it){const out=[];const push=u=>{if(u&&!out.includes(u)&&qrPriceF(it,u)!=null)out.push(u);};
  push(it.buy_unit);QR.lines.forEach(l=>push(l.u));push(it.unit);out.push('__total');return out;}
function qrAutoPrice(){ // ยังไม่ได้พิมพ์ราคาเอง = เติมจากราคาเดิมให้ตรงกับหน่วยที่เลือก
  const d=QR,it=d&&itemById(d.iid);if(!it||!d.auto)return;
  const bp=unitCost(it);
  if(bp==null){d.price='';return;}
  if(d.pu===(it.buy_unit||it.unit)){d.price=String(num(it.price));return;}
  if(d.pu==='__total'){const c=qrCalc(true);d.price=c.total>0?String(rnd2(bp*c.total)):'';return;}
  const f=qrPriceF(it,d.pu);d.price=f!=null?String(rnd4(bp*f)):'';}
function qrCalc(noPrice){
  const d=QR,it=itemById(d.iid);
  let total=0;const miss=[],raw=[],disp=[];
  d.lines.forEach(l=>{const q=num(l.q);if(!(q>0))return;
    const f=unitFactor(it,l.u);if(f==null){if(!miss.includes(l.u))miss.push(l.u);return;}
    total+=q*f;raw.push(fmtQ(q)+' '+l.u);disp.push(fmtQ(q)+' '+trUnit(l.u));});
  total=rnd4(total);
  const r={total,miss,raw,disp,price:null,bp:null,cost:null,newPrice:null,bu:it.buy_unit||it.unit};
  if(noPrice)return r;
  const ps=String(d.price).trim();r.price=ps===''?null:num(ps);
  if(r.price!=null&&total>0){
    if(d.pu==='__total'){r.bp=r.price/total;r.cost=rnd2(r.price);}
    else{const f=qrPriceF(it,d.pu);if(f){r.bp=r.price/f;r.cost=rnd2(r.bp*total);}}
    if(r.bp!=null)r.newPrice=d.pu===r.bu?r.price:rnd4(r.bp*(num(it.buy_qty)||1));}
  return r;}
const fmtP=v=>Math.abs(v)<1&&v!==0?Number(v).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:4}):fmt(v,2);
function qrUnitOpts(it,sel){
  const base=it.unit||'';const known=itemUnits(it);
  const other=allUnits().filter(u=>!known.includes(u));
  if(sel&&!known.includes(sel)&&!other.includes(sel))other.unshift(sel);
  return known.map(u=>'<option value="'+esc(u)+'"'+(u===sel?' selected':'')+'>'+esc(trUnit(u))+
      (u!==base?' (= '+fmtQ(unitFactor(it,u))+' '+esc(trUnit(base))+')':'')+'</option>').join('')+
    (other.length?'<optgroup label="'+esc(t('qr_other'))+'">'+other.map(u=>'<option value="'+esc(u)+'"'+(u===sel?' selected':'')+'>'+esc(trUnit(u))+' (?)</option>').join('')+'</optgroup>':'')+
    '<option value="__new">'+t('qr_new_unit')+'</option>';}
function paintQr(){
  const d=QR;if(!d)return;
  const it=d.iid?itemById(d.iid):null;
  let h=(d.bill?tkHead('📥 '+t('kf_add_item'),''):'<h3>📥 '+t('td_receive')+' · '+dispDate(bizTodayISO())+'</h3>')+
    (d.bill&&BL&&BL.sup?'<div class="xs mut" style="margin-bottom:6px">🧾 '+esc(BL.sup)+(BL.bill_no?' #'+esc(BL.bill_no):'')+'</div>':'')+
    '<div class="fld"><label>'+t('nav_items')+'</label>'+
    '<button class="btn gh" style="width:100%;justify-content:flex-start" onclick="qrPick()">'+
    (it?thumbHtml(it,ITEM_CAT_IC[it.cat]||'🥬')+' <b>'+esc(dispName(it))+'</b>':t('search'))+'</button></div>';
  if(it){
    const base=it.unit||'';
    h+='<div class="fld"><label>'+t('qty')+' · '+t('qr_unit')+'</label>';
    d.lines.forEach((l,i)=>{
      h+='<div class="qrline"><input inputmode="decimal" placeholder="0" value="'+esc(l.q)+'" oninput="QR.lines['+i+'].q=this.value;qrSum()">'+
        '<select onchange="qrUnit('+i+',this.value)">'+qrUnitOpts(it,l.u)+'</select>'+
        (d.lines.length>1?'<button class="btn gh sm2" aria-label="del" onclick="qrDelLine('+i+')">✕</button>':'')+'</div>';
      if(l.u&&unitFactor(it,l.u)==null)   // หน่วยที่ยังไม่รู้ขนาด — ถามตรงนี้เลย แล้วจำไว้กับสินค้า
        h+='<div class="qrdef"><span>1 '+esc(trUnit(l.u))+' =</span><input id="qrDefQ'+i+'" inputmode="decimal" placeholder="?">'+
          '<span>'+esc(trUnit(base))+'</span><button class="btn sm2" onclick="qrDefSave('+i+')">'+t('qr_def_save')+'</button></div>';
    });
    if(d.def)h+='<div class="qrdef col"><div class="xs mut">'+t('qr_new_hint')+'</div>'+
      '<div class="qrline"><span>1</span><input id="qrNewN" placeholder="'+esc(t('un_name_ph'))+'" value="'+esc(d.def.n)+'" oninput="QR.def.n=this.value">'+
      '<span>=</span><input id="qrNewQ" inputmode="decimal" placeholder="?" value="'+esc(d.def.q)+'" oninput="QR.def.q=this.value"><span>'+esc(trUnit(base))+'</span></div>'+
      '<div style="display:flex;gap:8px"><button class="btn gh sm2" style="flex:1" onclick="QR.def=null;paintQr()">'+t('cancel')+'</button>'+
      '<button class="btn sm2" style="flex:1" onclick="qrNewSave()">'+t('qr_def_save')+'</button></div></div>';
    h+='<button class="btn gh sm2" onclick="qrAddLine()">'+t('qr_add_line')+'</button></div>';
    h+='<div class="fld"><label>'+t('price')+'</label><div class="qrline">'+
      '<input id="qrPrice" inputmode="decimal" value="'+esc(d.price)+'" oninput="QR.price=this.value;QR.auto=false;qrSum()">'+
      '<select onchange="QR.pu=this.value;qrAutoPrice();paintQr()">'+qrPriceUnits(it).map(u=>'<option value="'+esc(u)+'"'+(u===d.pu?' selected':'')+'>'+
        (u==='__total'?t('qr_price_total'):t('qr_price_per')+' '+esc(trUnit(u)))+'</option>').join('')+'</select></div></div>';
    h+='<div id="qrSum"></div>';
    h+='<div style="display:flex;gap:8px;margin-top:10px">'+
      (d.bill?'<button class="btn gh" style="flex:1" onclick="qrSave(true)">'+t('kf_line_next')+'</button>'+
        '<button class="btn ok" style="flex:1" onclick="qrSave(false)">✓ '+t('kf_line_add')+'</button>'
      :'<button class="btn gh" style="flex:1" onclick="qrSave(true)">'+t('td_save_next')+'</button>'+
        '<button class="btn" style="flex:1" onclick="qrSave(false)">'+t('save')+'</button>')+'</div>';
  }
  openModal(h);taskify();
  if(d.bill)MODAL_BACK=paintBill;   // ปิดหน้านี้ = กลับไปหน้าบิล (ไม่ทิ้งรายการที่ใส่ไว้)
  if(it)qrSum();
}
function qrSum(){
  const el=document.getElementById('qrSum');const d=QR;if(!el||!d)return;
  const it=itemById(d.iid);if(!it){el.innerHTML='';return;}
  if(d.auto&&d.pu==='__total'){qrAutoPrice();const p=document.getElementById('qrPrice');if(p)p.value=d.price;}
  const c=qrCalc();const base=it.unit||'';let h='';
  if(c.miss.length)h+='<div class="qrwarn">'+t('qr_need_def',{u:esc(trUnit(c.miss[0])),b:esc(trUnit(base))})+'</div>';
  if(c.total>0){
    const mixed=c.disp.length>1||d.lines.some(l=>num(l.q)>0&&l.u!==base);
    h+='<div class="okbox">'+t('qr_in')+' <b>'+fmtQ(c.total)+' '+esc(trUnit(base))+'</b>'+
      (mixed?' <span class="xs mut">('+esc(c.disp.join(' + '))+')</span>':'')+
      (c.cost!=null?'<div>฿'+fmt(c.cost,2)+' · ฿'+fmtP(c.bp)+'/'+esc(trUnit(base))+'</div>':'')+
      (c.newPrice!=null&&it.price!=null&&Math.abs(c.newPrice-num(it.price))>1e-9?
        '<div class="xs">'+t('qr_new_price')+': ฿'+fmtP(c.newPrice)+'/'+esc(trUnit(c.bu))+' <span class="mut">('+t('qr_old')+' ฿'+fmtP(num(it.price))+')</span></div>':'')+
      '</div>';}
  el.innerHTML=h;}
function qrUnit(i,v){const d=QR;if(!d)return;
  if(v==='__new'){d.def={i,n:'',q:''};paintQr();const n=document.getElementById('qrNewN');if(n)n.focus();return;}
  d.lines[i].u=v;d.def=null;
  const it=itemById(d.iid);if(it&&!qrPriceUnits(it).includes(d.pu)){d.pu=it.buy_unit||it.unit;d.auto=true;}
  qrAutoPrice();paintQr();}
function qrAddLine(){const d=QR,it=d&&itemById(d.iid);if(!it)return;
  const used=d.lines.map(l=>l.u);const u=itemUnits(it).find(x=>!used.includes(x))||it.unit||'';
  d.lines.push({q:'',u});paintQr();
  const ins=document.querySelectorAll('#modalBox .qrline input');const last=ins[d.lines.length-1];if(last)last.focus();}
function qrDelLine(i){const d=QR;if(!d||d.lines.length<2)return;d.lines.splice(i,1);
  const it=itemById(d.iid);if(it&&!qrPriceUnits(it).includes(d.pu)){d.pu=it.buy_unit||it.unit;d.auto=true;}
  qrAutoPrice();paintQr();}
async function qrDefSave(i){
  const d=QR,it=d&&itemById(d.iid);if(!it||!d.lines[i])return;
  const el=document.getElementById('qrDefQ'+i);const q=num(el&&el.value);
  if(!(q>0)){toast(t('un_conv_bad'),true);return;}
  const u=d.lines[i].u;
  await once(async()=>{
    const ok=await itemPackSet(it,u,q);
    toast(ok?t('sv_ok'):t('un_need_sql'),!ok);
    qrAutoPrice();paintQr();});}
async function qrNewSave(){
  const d=QR,it=d&&itemById(d.iid);if(!it||!d.def)return;
  const n=String(d.def.n||'').trim().replace(/\s+/g,' ');const q=num(d.def.q);
  if(!n){toast(t('need_name'),true);return;}
  const i=Math.min(d.def.i,d.lines.length-1);
  if(unitFactor(it,n)!=null){   // หน่วยนี้รู้ขนาดอยู่แล้ว — เลือกให้เลย ไม่ตั้งซ้ำ
    d.lines[i].u=n;d.def=null;toast(t('un_dup')+' · '+unitEqTxt(it,n));qrAutoPrice();paintQr();return;}
  if(!(q>0)){toast(t('un_conv_bad'),true);return;}
  await once(async()=>{
    const ok=await itemPackSet(it,n,q);
    try{await unitRegister(n);}catch(e){}
    d.lines[i].u=n;d.def=null;
    toast(ok?t('sv_ok'):t('un_need_sql'),!ok);
    qrAutoPrice();paintQr();});}
async function qrSave(next){await once(async()=>{
  const d=QR;if(!d)return;
  const it=d.iid?itemById(d.iid):null;
  if(!it){toast(t('need_name'),true);return;}
  const c=qrCalc();
  if(c.miss.length){toast(t('qr_need_def',{u:trUnit(c.miss[0]),b:trUnit(it.unit||'')}),true);return;}
  if(c.total<=0){toast(t('need_qty'),true);return;}
  if(d.bill){   // อยู่ในบิล: ยังไม่ลงสต๊อก — ลงทีเดียวตอนบันทึกบิล
    if(!BL){QR=null;closeModal();return;}
    blFromQr(c,it);
    if(next){QR=blQrBase();qrPick();}
    else{QR=null;MODAL_BACK=null;paintBill();}
    return;}
  const D=bizTodayISO();const base=it.unit||'';
  const mixed=c.raw.length>1||d.lines.some(l=>num(l.q)>0&&l.u!==base);
  await pushMoves([{d:D,kind:'buy',item_kind:'item',ref_id:it.id,name:it.name,qty:c.total,cost:c.cost,
    ref:'qr'+Date.now().toString(36),note:mixed?c.raw.join(' + '):null}]);
  if(c.newPrice!=null){
    if(it.price==null||Math.abs(c.newPrice-num(it.price))>1e-9){it.price=c.newPrice;
      await dbi(()=>sb.from('ck_items').update({price:c.newPrice}).eq('id',it.id));}
    await dbi(()=>sb.from('ck_price_log').insert({item_id:it.id,d:D,price:c.newPrice,buy_unit:c.bu,source:'manual'}));
  }
  toast(t('sv_ok'));
  if(next){QR=qrBlank();qrPick();}
  else{QR=null;closeModal();show(S.tab);}
});}

/* ---------- 🚚 ส่งสาขาเร็ว (ขั้นตอนเดียว: สร้าง+ตัดสต๊อก+คิดต้นทุน) ---------- */
let QS=null;
function qsModal(){if(!canKitchen())return;
  if(!S.branches.length){toast(t('br_noaccess'),true);return;}
  QS={branch:(S.branches[0]||{}).code||'',lines:[]};paintQs();}
function paintQs(){
  const d=QS;if(!d)return;
  let h='<h3>🚚 '+t('td_send')+' · '+dispDate(bizTodayISO())+'</h3>'+
    '<div class="fld"><label>'+t('or_branch')+'</label><select onchange="QS.branch=this.value">'+

      '<div class="stepper"><button onclick="QS.lines['+i+'].qty=Math.max(0,rnd2(num(QS.lines['+i+'].qty)-1));paintQs()">−</button>'+
      '<input inputmode="decimal" value="'+fmtI(l.qty)+'" onchange="QS.lines['+i+'].qty=num(this.value)">'+

      '<button class="btn gh sm2" onclick="QS.lines.splice('+i+',1);paintQs()">🗑</button></div>';});
  h+='<button class="btn gh" style="width:100%;margin-top:8px" onclick="qsAdd()">'+t('or_add_menu')+'</button>'+

}
function qsAdd(){
  pickRecipe(rid=>{const r=recipeById(rid);if(!r)return;
    const ex=QS.lines.find(l=>l.recipe_id===rid);
    if(ex)ex.qty=rnd2(num(ex.qty)+1);
    else QS.lines.push({recipe_id:rid,name:r.name,qty:1});

}
async function qsSend(){
  const d=QS;if(!d)return;
  if(!inBr(d.branch)||!S.branches.some(b=>b.code===d.branch)){toast(t('br_noaccess'),true);return;}   // ส่งได้เฉพาะสาขาที่ได้สิทธิ์
  const lines=d.lines.filter(l=>num(l.qty)>0);
  if(!lines.length){toast(t('or_add_menu'),true);return;}
  const short=lines.some(l=>{const r=recipeById(l.recipe_id);return r&&num(l.qty)>num(r.qty);});
  if(!confirm(t('or_send_confirm')+(short?'\n'+t('or_stock_short'):'')))return;
  await once(async()=>{
    const D=bizTodayISO();
    const oid=uid('or');
    const row={id:oid,branch:d.branch,branch_name:branchName(d.branch),d:D,status:'sent',by_name:S.user.name};
    await dbi(()=>sb.from('ck_orders').insert(row));
    const moves=[];let total=0,totalSell=0;
    const items=lines.map((l,i)=>{
      const r=recipeById(l.recipe_id);
      const cu=r?recipeUnitCost(r):null;
      const sp=r?recipeSellPrice(r):null;
      const amount=cu!=null?rnd2(num(l.qty)*cu):null;
      const amountSell=sp!=null?rnd2(num(l.qty)*sp):null;
      if(amount!=null)total+=amount;
      if(amountSell!=null)totalSell+=amountSell;
      if(r)moves.push({d:D,kind:'send',item_kind:'recipe',ref_id:r.id,name:r.name,qty:-num(l.qty),
        cost:amount,ref:oid,branch:d.branch});
      return {order_id:oid,recipe_id:l.recipe_id,name:l.name,unit:r?r.yield_unit||'':'',qty:num(l.qty),
        cost_unit:cu,amount,sell_unit:sp,amount_sell:amountSell,sort:i};});
    let ins2;
    try{ins2=await dbi(()=>sb.from('ck_order_items').insert(items).select());}
    catch(e){ // DB เก่ายังไม่มีคอลัมน์ราคาขาย — ตัดออกแล้วลองใหม่
      if(!/sell_unit|amount_sell/.test(String((e&&e.message)||e)))throw e;
      items.forEach(x=>{delete x.sell_unit;delete x.amount_sell;});
      ins2=await dbi(()=>sb.from('ck_order_items').insert(items).select());}
    await pushMoves(moves);
    row.total=rnd2(total);
    try{await dbi(()=>sb.from('ck_orders').update({total:row.total,total_sell:rnd2(totalSell)}).eq('id',oid));}
    catch(e){if(!/total_sell/.test(String((e&&e.message)||e)))throw e;
      await dbi(()=>sb.from('ck_orders').update({total:row.total}).eq('id',oid));}
    row.total_sell=rnd2(totalSell);
    S.orders.unshift(row);S.orderItems[oid]=ins2;
    await billNoAssign(row);
    QS=null;applyChrome();closeModal();toast(t('or_sent_ok')+(row.bill_no?' · 🧾 '+row.bill_no:''));show(S.tab);
  });}

/* ---------- 🌐 แปลชื่อที่ยังไม่มีคำแปลอัตโนมัติ (รันเงียบๆ หลังโหลด) ---------- */
let BF_RUN=false;
async function autoBackfillI18n(){
  if(BF_RUN)return;BF_RUN=true;
  try{
    const needs=o=>!(o.i18n&&o.i18n.en&&o.i18n.lo&&o.i18n.my);
    let did=0;
    for(const it of S.items){
      if(!needs(it))continue;
      const o=await autoI18n(it.name,it.i18n);
      if(o){it.i18n=o;did++;await sb.from('ck_items').update({i18n:o}).eq('id',it.id);}
    }
    for(const r of S.recipes){
      if(!needs(r))continue;
      const o=await autoI18n(r.name,r.i18n);
      if(o){r.i18n=o;did++;await sb.from('ck_recipes').update({i18n:o}).eq('id',r.id);}
    }
    if((S.expCats||[]).some(needs)){ // ประเภทค่าใช้จ่ายที่เพิ่มเอง — อ่านใหม่ก่อนเขียน กันทับของเครื่องอื่น
      const list=await expCatsFresh();let ch=false;
      for(const c of list){if(!needs(c))continue;const o=await autoI18n(c.n,c.i18n);if(o){c.i18n=o;ch=true;}}
      if(ch){await sb.from('ck_settings').upsert({key:'exp_cats',value:list});S.expCats=list;did++;}
    }
    if(((S.units&&S.units.list)||[]).some(needs)){ // หน่วยที่เพิ่มเอง — อ่านใหม่ก่อนเขียนเหมือนกัน
      const v=await unitsFresh();let ch=false;
      for(const c of v.list){if(!needs(c))continue;const o=await autoI18n(c.n,c.i18n);if(o){c.i18n=o;ch=true;}}
      if(ch){await sb.from('ck_settings').upsert({key:'units',value:v});S.units=v;did++;}
    }
    // แปลเสร็จแล้วรีเฟรชหน้าปัจจุบัน (เฉพาะตอนไม่ได้เปิดฟอร์มค้าง)
    if(did&&LANG!=='th'&&!document.getElementById('modalWrap').classList.contains('on'))show(S.tab);
  }catch(e){}
  finally{BF_RUN=false;}
}

<script>
/* ============================================================
   💰 บัญชีครัวกลาง — รายรับขายสาขา − ซื้อวัตถุดิบ − ค่าใช้จ่าย = กำไร
   (เกณฑ์เงินสดแบบเดียวกับแอพ P&L สาขา · เลือกดูรายเดือน)
   ============================================================ */
const EXP_CATS=[['ค่าแรง','👷'],['ค่าไฟ','⚡'],['ค่าน้ำ','💧'],['ค่าแก๊ส','🔥'],['ค่าเช่า','🏠'],['ค่าขนส่ง','🛻'],['อื่นๆ','🧾']];
const EXP_ICONS=['🧾','📶','📱','💡','🧹','🧴','🔧','🧯','🚚','📦','🧊','🍽️','🪣','🧺','🏦','📣','🛡️','🎁'];
const EXP_OTHER='อื่นๆ';
function expCats(){ // [[ชื่อ,ไอคอน],…] พื้นฐาน + ที่เพิ่มเอง · "อื่นๆ" อยู่ท้ายสุดเสมอ
  const base=EXP_CATS.filter(c=>c[0]!==EXP_OTHER);
  const mine=(S.expCats||[]).filter(c=>!EXP_CATS.some(b=>b[0]===c.n)).map(c=>[c.n,c.ic||'🧾']);
  return base.concat(mine,[[EXP_OTHER,'🧾']]);
}
function expIc(c){const f=expCats().find(x=>x[0]===c);return f?f[1]:'🧾';}
const isBuiltinCat=c=>EXP_CATS.some(b=>b[0]===c);

let ACC_TOK=0;
RENDER.acc=async function(el){
  const m=S.statsM;

  el.innerHTML='<div class="spin"></div>';

  catch(e){if(tok===ACC_TOK)el.innerHTML='<div class="card empty">⚠ '+esc((e&&e.message)||e)+'</div>';return;}
  if(tok!==ACC_TOK)return;
  const {exps,ords,rev,revByBr,revByMenu,cogs,buys,buyVal,expByCat,expVal,profit,stockVal,expMissing}=A;
  S._exps=exps;
  const K=canKitchen();

  let h='<div class="card"><h3>💰 '+t('ac_pl')+
    '<span class="sp"><button class="btn gh sm2" onclick="S.statsM=prevMonth(S.statsM);show(\'acc\')">‹</button> <b>'+dispMonth(m)+'</b> <button class="btn gh sm2" onclick="S.statsM=nextMonth(S.statsM);show(\'acc\')">›</button></span></h3>'+
    '<div class="xs mut">'+t('ac_sell_hint')+'</div></div>';
  if(brScoped())h+='<div class="hintbox">'+t('ac_scope',{b:esc(brScopeTxt()||'—')})+'</div>';
  if(expMissing)h+='<div class="hintbox">🛠 ตาราง ck_expenses ยังไม่ถูกติดตั้ง — รัน <b>jjmk_kitchen_setup.sql</b> เวอร์ชันล่าสุดใน SQL Editor อีกครั้ง (คัดลอกได้ที่ ⚙️ ตั้งค่า)</div>';
  h+='<div class="kpis">'+
    '<div class="kpi hero"><div class="t">💵 '+t('ac_rev')+'</div><div class="kpi-v">฿'+fmt(rev)+'</div><div class="s">'+ords.length+' '+t('items_n')+'</div></div>'+
    '<div class="kpi"><div class="t">🛒 '+t('ac_buy')+'</div><div class="kpi-v">฿'+fmt(buyVal)+'</div><div class="s mut">'+buys.length+' '+t('items_n')+'</div></div>'+
    '<div class="kpi"><div class="t">🧾 '+t('ac_exp')+'</div><div class="kpi-v">฿'+fmt(expVal)+'</div><div class="s mut">'+exps.length+' '+t('items_n')+'</div></div>'+
    '<div class="kpi" style="'+(profit>=0?'background:linear-gradient(135deg,var(--ok),#136A42);border:none;color:#fff':'background:linear-gradient(135deg,var(--bad),#8F1B1B);border:none;color:#fff')+'">'+
      '<div class="t" style="color:rgba(255,255,255,.8)">'+(profit>=0?'📈':'📉')+' '+t('ac_profit')+'</div>'+
      '<div class="kpi-v">฿'+fmt(profit)+'</div><div class="s" style="color:rgba(255,255,255,.8)">'+dispMonth(m)+'</div></div></div>';

  // งบกำไรขาดทุนแบบบรรทัด
  h+='<div class="card"><h3>📄 '+t('ac_pl')+'</h3><div class="twrap"><table class="t">';
  h+='<tr><td><b>💵 '+t('ac_rev')+'</b></td><td class="n"><b>'+fmt(rev,2)+'</b></td></tr>';
  Object.keys(revByBr).forEach(k=>{const v=revByBr[k];
    h+='<tr><td class="mut" style="padding-left:24px">🏪 '+esc(v.name)+' <span class="xs">('+v.n+' '+t('kf_bill_n')+')</span></td><td class="n">'+fmt(v.amt,2)+'</td></tr>';});
  h+='<tr><td><b>🛒 '+t('ac_buy')+'</b></td><td class="n" style="color:var(--bad)">−'+fmt(buyVal,2)+'</td></tr>';
  h+='<tr><td><b>🧾 '+t('ac_exp')+'</b></td><td class="n" style="color:var(--bad)">−'+fmt(expVal,2)+'</td></tr>';
  const cats=expCats();
  cats.forEach(([c,ic])=>{if(expByCat[c])
    h+='<tr><td class="mut" style="padding-left:24px">'+ic+' '+esc(trCat(c))+'</td><td class="n">'+fmt(expByCat[c],2)+'</td></tr>';});
  Object.keys(expByCat).filter(c=>!cats.some(x=>x[0]===c)).forEach(c=>{ // ประเภทที่ถูกลบไปแล้วแต่ยังมีรายการเก่า
    h+='<tr><td class="mut" style="padding-left:24px">🧾 '+esc(c)+'</td><td class="n">'+fmt(expByCat[c],2)+'</td></tr>';});
  h+='<tr class="tot"><td><b>'+(profit>=0?'📈':'📉')+' '+t('ac_profit')+'</b></td><td class="n"><b style="color:var(--'+(profit>=0?'ok':'bad')+')">'+fmt(profit,2)+'</b></td></tr>';
  h+='</table></div>'+
    '<div class="xs mut" style="margin-top:8px">'+t('ac_sent_cost')+': ฿'+fmt(cogs,2)+' · '+t('ac_stock_now')+': ฿'+fmt(stockVal,2)+'</div></div>';

  h+=allocHtml(A)+brBillsHtml(A)+supBillsHtml(A)+apHtml(0);
  // รายรับแยกเมนู
  const mks=Object.keys(revByMenu).sort((a,b)=>revByMenu[b].amt-revByMenu[a].amt);
  if(mks.length){
    h+='<div class="card"><h3>🍲 '+t('nav_menus')+' — '+t('ac_rev')+'</h3><div class="twrap"><table class="t"><tr><th>'+t('nav_menus')+'</th><th class="right">'+t('qty')+'</th><th class="right">'+t('total')+' ฿</th></tr>';
    mks.forEach(k=>{const v=revByMenu[k];
      h+='<tr><td>'+esc(v.name)+'</td><td class="n">'+fmtI(v.qty)+'</td><td class="n">'+fmt(v.amt,2)+'</td></tr>';});
    h+='</table></div></div>';}

  // รายการค่าใช้จ่าย
  h+='<div class="card"><h3>🧾 '+t('ac_exp_list')+
    (K&&!expMissing?'<span class="sp"><button class="btn sm2" onclick="expModal()">'+t('ac_add')+'</button></span>':'')+'</h3>';
  if(!exps.length)h+='<div class="empty">'+t('ac_none')+'</div>';
  else exps.slice().reverse().forEach(x=>{
    h+='<div class="rowline"><div class="mthumb">'+expIc(x.cat)+'</div>'+

      '<div class="xs mut">'+dispDate(x.d)+(x.by_name?' · '+esc(x.by_name):'')+(x.note?' · '+esc(x.note):'')+'</div></div>'+
      '<b>฿'+fmt(x.amount,2)+'</b>'+
      (canEditRec('exp',x.d)?'<button class="btn gh sm2" data-id="'+esc(x.id)+'" onclick="expModal(this.dataset.id)">✎</button>'+
        '<button class="btn gh sm2" onclick="expDel(\''+esc(x.id)+'\')">🗑</button>':'')+'</div>';});

  el.innerHTML=h;
};

/* ---------- เพิ่ม/ลบค่าใช้จ่าย ---------- */
let EX=null;
function expModal(id){if(!canKitchen())return;
  const x=id?(S._exps||[]).find(e=>e.id===id):null;
  if(id&&!x)return;
  if(x&&editDenied('exp',x.d))return;
  EX=x?{id:x.id,d0:x.d,cat:x.cat||EXP_OTHER,d:x.d,name:x.name||'',amount:String(num(x.amount)),note:x.note||'',adding:false,newName:'',newIc:'🧾'}
    :{cat:'ค่าแรง',d:bizTodayISO(),name:'',amount:'',note:'',adding:false,newName:'',newIc:'🧾'};paintExp();}
function paintExp(){
  const d=EX;if(!d)return;
  let h='<h3>🧾 '+(d.id?'✎ '+t('edit'):t('ac_add'))+'</h3>'+
    '<div class="catwrap" onclick="expCatClick(event)">'+
    expCats().map(([c,ic])=>'<button data-cat="'+esc(c)+'" class="'+(d.cat===c&&!d.adding?'on':'')+'">'+ic+' '+esc(trCat(c))+'</button>').join('')+
    '<button data-add="1" class="add'+(d.adding?' on':'')+'">➕ '+esc(t('ac_cat_add'))+'</button></div>';
  if(d.adding){
    const mine=S.expCats||[];
    h+='<div class="catnew">'+
      '<div class="fld"><label>'+t('ac_cat_new')+'</label>'+
        '<input id="exNewCat" maxlength="30" value="'+esc(d.newName)+'" oninput="EX.newName=this.value" '+
        'onkeydown="if(event.key===\'Enter\')expCatAdd()" placeholder="'+esc(t('ac_cat_eg'))+'"></div>'+
      '<div class="fld"><label>'+t('ac_cat_ic')+'</label><div class="icpick" onclick="expIcClick(event)">'+
        EXP_ICONS.map(ic=>'<button data-ic="'+ic+'" class="'+(d.newIc===ic?'on':'')+'">'+ic+'</button>').join('')+'</div></div>'+
      '<div class="grid2"><button class="btn gh" onclick="EX.adding=false;paintExp()">'+t('cancel')+'</button>'+
        '<button class="btn" onclick="expCatAdd()">➕ '+t('add')+'</button></div>'+
      (mine.length?'<div class="xs mut" style="margin:12px 0 6px">'+t('ac_cat_mine')+'</div>'+
        mine.map(c=>'<div class="rowline" style="padding:6px 0"><div class="mthumb">'+(c.ic||'🧾')+'</div>'+
          '<div class="grow"><b>'+esc(trCat(c.n))+'</b></div>'+
          '<button class="btn gh sm2" data-del="'+esc(c.n)+'" onclick="expCatDel(this.dataset.del)">🗑</button></div>').join(''):'')+
      '</div>';
    openModal(h);
    setTimeout(()=>{const f=document.getElementById('exNewCat');f&&f.focus();},60);
    return;
  }
  h+='<div class="grid2"><div class="fld"><label>'+t('date')+'</label><input type="date" value="'+esc(d.d)+'" oninput="EX.d=this.value"></div>'+
    '<div class="fld"><label>'+t('ac_amount')+'</label><input inputmode="decimal" value="'+esc(d.amount)+'" oninput="EX.amount=this.value"></div></div>'+
    '<div class="fld"><label>'+t('name')+'</label><input value="'+esc(d.name)+'" oninput="EX.name=this.value" placeholder="'+esc(trCat(d.cat))+'"></div>'+
    '<div class="fld"><label>'+t('note')+'</label><input value="'+esc(d.note)+'" oninput="EX.note=this.value"></div>'+
    '<button class="btn big" onclick="expSave()">'+t('save')+'</button>';
  openModal(h);
}
function expCatClick(e){
  const b=e.target.closest('button');if(!b||!EX)return;
  if(b.dataset.add){EX.adding=!EX.adding;paintExp();return;}
  EX.cat=b.dataset.cat;EX.adding=false;paintExp();
}
function expIcClick(e){const b=e.target.closest('button');if(!b||!EX)return;EX.newIc=b.dataset.ic;paintExp();}

/* ---------- ประเภทค่าใช้จ่ายที่เพิ่มเอง — เก็บใน ck_settings (key=exp_cats) ใช้ร่วมกันทุกเครื่อง ---------- */
async function expCatsFresh(){ // อ่านใหม่จากฐานข้อมูลก่อนแก้ทุกครั้ง กันอีกเครื่องเพิ่มพร้อมกันแล้วทับกัน
  const r=await sb.from('ck_settings').select('value').eq('key','exp_cats').maybeSingle();
  if(r&&r.error)throw r.error;
  return (r&&r.data&&Array.isArray(r.data.value))?r.data.value.filter(c=>c&&c.n):[];
}
async function expCatsSave(list){
  await dbi(()=>sb.from('ck_settings').upsert({key:'exp_cats',value:list}));
  S.expCats=list;
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
async function expCatAdd(){
  if(!canKitchen()||!EX)return;
  const n=(EX.newName||'').trim().replace(/\s+/g,' ');
  if(!n){toast(t('need_name'),true);return;}
  const dup=expCats().find(x=>x[0].toLowerCase()===n.toLowerCase());
  if(dup){EX.cat=dup[0];EX.adding=false;EX.newName='';paintExp();toast(t('ac_cat_dup'));return;}
  await once(async()=>{
    // แปลชื่อประเภทใหม่เป็น 3 ภาษาเลย (รอไม่เกิน 4 วิ — ไม่ทันก็เติมให้ทีหลังตอนเปิดแอพ)
    const i18n=await withTimeout(autoI18n(n,null),4000);
    const list=await expCatsFresh();
    if(!list.some(c=>c.n.toLowerCase()===n.toLowerCase()))list.push({n,ic:EX.newIc||'🧾',i18n:i18n||null});
    await expCatsSave(list);
    EX.cat=n;EX.adding=false;EX.newName='';EX.newIc='🧾';
    paintExp();toast(t('ac_cat_ok'));
  });
}
async function expCatDel(n){
  if(!canKitchen()||!n||isBuiltinCat(n))return;
  if(!confirm(t('ac_cat_del_q',{n:trCat(n)})))return;
  await once(async()=>{
    const list=(await expCatsFresh()).filter(c=>c.n!==n);
    await expCatsSave(list);

<script>
/* ============================================================
   🖼 หารูปอัตโนมัติ — ค้นรูปจากแหล่งฟรี (TheMealDB / Wikimedia Commons)
   ให้เฉพาะรายการที่ยังไม่มีรูป แล้วอัพโหลดเก็บใน Supabase ของเราเอง
   (ค้น–โหลดจากเบราว์เซอร์ผู้ใช้ ไม่ต้องใช้ API key)
   ============================================================ */
let AI=null,AI_TOK=0,AI_MEALS;
function aiAlive(tok){return AI&&AI.tok===tok&&document.getElementById('aiGrid')&&
  document.getElementById('modalWrap').classList.contains('on');}

function autoImgWizard(kind){
  if(!canKitchen())return;
  const src=kind==='recipe'?S.recipes:S.items;
  const list=src.filter(o=>o.active!==false&&!o.image_url)
    .sort((a,b)=>(a.name||'').localeCompare(b.name||'','th'))
    .map(o=>({kind,id:o.id,o,q:'',cands:[],idx:0,st:'wait',skip:false}));
  if(!list.length){toast(t('ai_all_have'));return;}
  AI={tok:++AI_TOK,kind,list,running:true,done:0};
  let h='<h3>'+t('ai_btn')+'</h3><div class="hintbox">'+t('ai_hint')+'</div>'+
    '<div id="aiGrid" class="igrid">'+list.map((e,i)=>aiCardHtml(e,i)).join('')+'</div>'+
    '<div id="aiFoot" style="margin-top:10px"></div>';
  openModal(h,true);
  aiPaintFoot();
  aiRun();
}
function aiCardHtml(e,i){
  let th;
  if(e.st==='wait')th='⏳';
  else if(e.st==='search')th='<div class="spin" style="margin:0 auto"></div>';
  else if(e.st==='ok'&&e.cands[e.idx])
    th='<img src="'+esc(e.cands[e.idx])+'" loading="lazy" onerror="aiImgErr('+i+')" '+
      'onclick="zoomImg(\''+esc(e.cands[e.idx])+'\');event.stopPropagation()">';
  else th='🚫';
  const acts=(e.st==='ok'&&e.cands.length>1?'<button class="btn gh sm2" onclick="aiNext('+i+')">'+t('ai_next')+'</button>':'')+
    (e.st==='ok'?'<button class="btn gh sm2" onclick="aiSkip('+i+')">'+(e.skip?'↩':'✖ '+t('ai_skip'))+'</button>':'');
  return '<div class="icard" id="aiC'+i+'" style="'+(e.skip?'opacity:.35':'')+'">'+
    '<div class="ithumb">'+th+'</div>'+
    '<div class="iname">'+esc(dispName(e.o))+'</div>'+
    (e.st==='none'?'<div class="xs mut">'+t('ai_none')+'</div>':'')+
    '<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">'+acts+'</div></div>';
}
function aiPaintCard(i){const el=document.getElementById('aiC'+i);if(!el)return;
  el.outerHTML=aiCardHtml(AI.list[i],i);}
function aiPaintFoot(){const el=document.getElementById('aiFoot');if(!el||!AI)return;
  if(AI.running){el.innerHTML='<div class="sm mut">'+t('ai_search',{a:AI.done,b:AI.list.length})+'</div>';return;}
  const n=AI.list.filter(e=>e.st==='ok'&&!e.skip&&e.cands[e.idx]).length;
  el.innerHTML=n?'<button class="btn big" onclick="aiSaveAll()">'+t('ai_save',{n:n})+'</button>'
    :'<div class="sm mut">'+t('ai_none')+'</div>';}
function aiNext(i){const e=AI&&AI.list[i];if(!e||!e.cands.length)return;
  e.idx=(e.idx+1)%e.cands.length;aiPaintCard(i);}
function aiSkip(i){const e=AI&&AI.list[i];if(!e)return;
  e.skip=!e.skip;aiPaintCard(i);aiPaintFoot();}
function aiImgErr(i){const e=AI&&AI.list[i];if(!e)return; // รูปเสีย/โหลดไม่ได้ → ลองรูปถัดไป
  e.cands.splice(e.idx,1);
  if(e.idx>=e.cands.length)e.idx=0;
  if(!e.cands.length)e.st='none';
  aiPaintCard(i);aiPaintFoot();}

async function aiRun(){
  const my=AI.tok;
  for(let i=0;i<AI.list.length;i++){
    if(!aiAlive(my))return;
    AI.done=i;aiPaintFoot();
    const e=AI.list[i];e.st='search';aiPaintCard(i);
    try{await aiSearch(e);}catch(err){e.st='none';}
    if(!aiAlive(my))return;
    aiPaintCard(i);
    await new Promise(r=>setTimeout(r,120)); // เว้นจังหวะ ไม่ยิงรัว
  }
  AI.running=false;AI.done=AI.list.length;aiPaintFoot();
}
async function aiSearch(e){
  let q=(e.o.i18n&&e.o.i18n.en)||await gtx(e.o.name,'en')||e.o.name;
  q=String(q).replace(/[()"']/g,' ').replace(/\s+/g,' ').trim();
  e.q=q;
  const cands=[];
  if(e.kind==='item'){const m=await aiMealdb(q);if(m)cands.push(m);} // รูปวัตถุดิบพื้นขาว สวยสุดถ้าตรงชื่อ
  try{
    const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*'+
      '&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=10&gsrnamespace=6'+
      '&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=480');
    const j=await r.json();
    const pages=j&&j.query&&j.query.pages?Object.values(j.query.pages):[];
    pages.sort((a,b)=>(a.index||0)-(b.index||0));
    pages.forEach(p=>{const ii=p.imageinfo&&p.imageinfo[0];
      if(ii&&/^image\/(jpeg|png)$/.test(ii.mime||'')&&(ii.thumburl||ii.url))cands.push(ii.thumburl||ii.url);});
  }catch(err){}
  e.cands=cands.slice(0,8);e.idx=0;e.st=e.cands.length?'ok':'none';
}
async function aiMealdb(q){
  if(AI_MEALS===undefined){
    try{const r=await fetch('https://www.themealdb.com/api/json/v1/1/list.php?i=list');
      const j=await r.json();AI_MEALS=(j.meals||[]).map(x=>x.strIngredient).filter(Boolean);}
    catch(err){AI_MEALS=null;}}
  if(!AI_MEALS)return null;
  const ql=q.toLowerCase();let best=null;
  for(const n of AI_MEALS){const nl=n.toLowerCase();
    if(nl===ql){best=n;break;}
    if(nl.length>=4&&ql.includes(nl)&&(!best||nl.length>best.length))best=n;}
  return best?'https://www.themealdb.com/images/ingredients/'+encodeURIComponent(best)+'.png':null;
}
async function aiSaveAll(){await once(async()=>{
  if(!AI||AI.running)return;
  const my=AI.tok;
  const picks=AI.list.filter(e=>e.st==='ok'&&!e.skip&&e.cands[e.idx]);
  if(!picks.length)return;
  const foot=document.getElementById('aiFoot');
  let saved=0;
  for(let i=0;i<picks.length;i++){
    if(!AI||AI.tok!==my)return;
    if(foot)foot.innerHTML='<div class="sm mut"><div class="spin" style="display:inline-block;vertical-align:middle"></div> '+t('ai_saving',{a:i+1,b:picks.length})+'</div>';
    const e=picks[i];let final=e.cands[e.idx];
    try{ // โหลดรูปมาย่อ แล้วเก็บใน storage ของเราเอง — ถ้าโหลดข้ามเว็บไม่ได้ ใช้ลิงก์ตรงแทน
      const r=await fetch(final,{mode:'cors'});
      if(r.ok){const bl=await r.blob();
        const du=await new Promise(res=>processImage(bl,res));
        if(du){const b2=await (await fetch(du)).blob();
          const path='ck/auto-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
          const up=await sb.storage.from('product-images').upload(path,b2,{contentType:'image/jpeg',upsert:true});
          if(!up.error)final=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;}}
    }catch(err){}
    try{
      const tbl=e.kind==='recipe'?'ck_recipes':'ck_items';
      await dbi(()=>sb.from(tbl).update({image_url:final}).eq('id',e.id));
      e.o.image_url=final;saved++;
    }catch(err){}
  }
  AI=null;closeModal();toast(t('ai_done',{n:saved}));show(S.tab);
});}
</script>
<script>
/* ============================================================
   🏪 ยอดที่สาขาต้องการ — อ่านยอดนับจากแอพนับสต๊อก (jjmk-stockcheck.html) แล้วคิดว่าต้องส่งเท่าไร
   สูตรเดียวกับหน้า "🛒 สั่งของ" ของแอพนับสต๊อกทุกบรรทัด (orderPlan/deliveryDate/nextDeliveryAfter/
   sumRate/inTransit) — แก้สูตรที่แอพนับสต๊อก ต้องแก้ที่นี่ให้ตรงกันด้วย
     ต้องส่ง = ยอดใช้ตั้งแต่วันของถึงจนถึงก่อนรอบถัดไป − (ที่นับได้ − ใช้ไประหว่างรอ + ของที่กำลังมา)
   ตาราง: products · stock_counts · stock_receipts · suppliers (ของแอพนับสต๊อก — อ่านอย่างเดียว
   ยกเว้น stock_receipts ที่เขียน "ส่งจริง" กลับไปให้แอพนับรู้ว่าของกำลังไป)
   บันทึกของครัว: ck_br_needs (สาขา × รอบนับ × สินค้า: นับได้ / ต้องส่ง / ส่งจริง)
   ============================================================ */
const STK_BR={JJRD:'b19f0a17b4472',JJLP:'b19f0a17b448212'};   // ต้องตรงกับ STK_BR ของแอพนับสต๊อก
/* SPD-BEGIN วันพิเศษจากปฏิทิน — บล็อกนี้ต้องเหมือนกันทุกไบต์ใน jjmk-stockcheck.html + jjmk-kitchen.html (ซิงก์ด้วยสคริปต์ อย่าแก้มือทีละไฟล์)
   ที่มา: ตาราง cal_special_days ของ JJ Calendar (แท็บ 🎌 วันพิเศษ) · เจ้าของตัดสินใจ 2026-09-29: "วันขายดี = คิดยอดใช้วันนั้นแบบเสาร์–อาทิตย์"
   order_rate_group: 2 = ส–อา (rate_we) · 1 = ศุกร์ (rate_fri) · 0 = วันธรรมดา (rate_wk) · order_branches null = ทุกสาขา
   ไม่มีวันพิเศษ / ยังไม่รัน SQL / อ่านไม่ได้ = ตัวเลขเหมือนเดิมทุกหลัก (spdHit คืน null) */
var SPD={rows:[],off:false};
function spdSet(rows){SPD.rows=(rows||[]).filter(function(r){return r&&!r.cancelled&&r.day_from&&r.day_to&&(r.order_rate_group===0||r.order_rate_group===1||r.order_rate_group===2);});}
function spdCode(bid){for(var k in STK_BR){if(STK_BR[k]===bid)return k;}return '';}
function spdFor(r,code){return !(r.order_branches&&r.order_branches.length)||r.order_branches.indexOf(code)>=0;}
/* วันพิเศษที่มีผลกับสาขานี้ในวัน ds → {g:กลุ่มวันที่ใช้แทน, r:แถว} · ไม่มี = null
   หลายแถวทับกัน: แถวที่เจาะจงสาขาชนะแถวทุกสาขา · เท่ากันเอากลุ่มเลขมากกว่า */
function spdHit(bid,ds){
  if(SPD.off||!ds||!SPD.rows.length)return null;
  var code=spdCode(bid),best=null;
  for(var i=0;i<SPD.rows.length;i++){var r=SPD.rows[i];
    if(r.day_from>ds||r.day_to<ds||!spdFor(r,code))continue;
    var sc=(r.order_branches&&r.order_branches.length?10:0)+r.order_rate_group;
    if(!best||sc>best.sc)best={sc:sc,g:r.order_rate_group,r:r};}
  return best;}
function spdBaseline(fn){SPD.off=true;try{return fn();}finally{SPD.off=false;}}
/* ชื่อวันพิเศษของสาขานี้ที่อยู่ในช่วง [from,to] — ไว้บอกเหตุผลบนจอ (ไม่ใช้คิดตัวเลข) */
function spdNames(bid,from,to){
  var code=spdCode(bid),out=[];
  SPD.rows.forEach(function(r){if(r.day_to<from||r.day_from>to||!spdFor(r,code))return;if(out.indexOf(r.name)<0)out.push(r.name);});
  return out;}
/* SPD-END */
const BR_DOW=['sun','mon','tue','wed','thu','fri','sat'];
const BR_SRC_RE=/ครัวกลาง|jjck|central\s*kitchen/i;
S.br={t:0,data:null,loading:null,err:null,src:null,links:{},sups:[],needTbl:true};

/* ---------- สูตรพอร์ตจากแอพนับสต๊อก (ห้ามเปลี่ยนพฤติกรรม) ---------- */
function brAddDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);
  const p2=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
const brDowKey=ds=>BR_DOW[new Date(ds+'T12:00:00').getDay()];
function brNextDow(ds,key){const want=BR_DOW.indexOf(key);if(want<0)return '';
  for(let i=1;i<=7;i++){const d2=brAddDays(ds,i);if(new Date(d2+'T12:00:00').getDay()===want)return d2;}return '';}
function brDayGrp(ds){const g=new Date(ds+'T12:00:00').getDay();return g===5?1:(g===0||g===6?2:0);}
function brRateOn(p,ds){const h=spdHit(p.branch_id,ds),g=h?h.g:brDayGrp(ds);return num(g===1?p.rate_fri:g===2?p.rate_we:p.rate_wk);}   // วันขายดีในปฏิทิน = ใช้อัตรา ส–อา (ต้องตรงกับ rateOn ของแอพนับสต๊อก)
const brSupKey=n=>String(n||'').replace(/\s+/g,' ').trim().toLowerCase();
function brSup(n){const k=brSupKey(n);if(!k)return null;return (S.br.sups||[]).find(x=>brSupKey(x.name)===k)||null;}
function brMode(x){return (x.order_mode==='fixed'||(!x.order_mode&&x.schedule&&Object.keys(x.schedule||{}).length))?'fixed':(x.order_mode||'any');}
const brAhead=x=>Math.max(0,Math.min(6,parseInt(x&&x.order_ahead,10)||0));
function brDelivery(sup,cd){
  const x=brSup(sup);
  if(!x)return {d:brAddDays(cd,1),od:cd,ahead:0,mode:'any',lead:1,unset:true};
  if(brMode(x)==='fixed'){
    const ah=brAhead(x);
    for(let k=0;k<=ah;k++){const od=brAddDays(cd,k),dd=(x.schedule||{})[brDowKey(od)];
      if(dd)return {d:brNextDow(od,dd),od:od,ahead:k,mode:'fixed'};}
    return {d:'',od:'',ahead:0,mode:'fixed'};
  }
  const l=parseInt(x.lead_days,10)>=1?parseInt(x.lead_days,10):1;
  return {d:brAddDays(cd,l),od:cd,ahead:0,mode:'any',lead:l};
}
function brNextAfter(sup,od,curD){
  const x=brSup(sup);if(!x||!curD)return brAddDays(curD||od,1);
  if(brMode(x)==='fixed'){
    for(let k=1;k<=8;k++){const d2=brAddDays(od,k),dd=(x.schedule||{})[brDowKey(d2)];
      if(dd){const del=brNextDow(d2,dd);if(del>curD)return del;}}
    return brAddDays(curD,1);
  }
  return brAddDays(curD,1);
}
function brSumRate(p,from,to){let s=0,n=0;if(!from||!to)return {sum:0,days:0};
  for(let d2=from;d2<to&&n<31;d2=brAddDays(d2,1),n++)s+=brRateOn(p,d2);
  return {sum:+s.toFixed(3),days:n};}
function brInTransit(sup,p,cd,delD,recv){
  const rc=(recv||{})[p.id];if(!rc||!delD)return 0;
  let s=0;
  Object.keys(rc).forEach(od=>{if(od>=cd)return;
    const dd=(brDelivery(sup,od)||{}).d;
    if(dd&&dd>cd&&dd<delD)s+=num(rc[od]);});
  return +s.toFixed(3);
}
/* หนึ่งบรรทัดของใบสั่ง — เหมือน rows ใน orderPlan() ของแอพนับสต๊อก */
function brRow(p,cnt,cd,recv){
  const c=cnt[p.id];
  const have=c?(c.out?0:num(c.qty)):null;
  const dl=brDelivery(p.sup,cd);
  const nx=dl.d?brNextAfter(p.sup,dl.od||cd,dl.d):'';
  const gap=brAddDays(cd,1);
  const cov=dl.d?brSumRate(p,dl.d,nx||brAddDays(dl.d,1)):{sum:0,days:0};
  const pre=dl.d?brSumRate(p,gap,dl.d):{sum:0,days:0};
  const need=cov.sum;
  const onWay=brInTransit(p.sup,p,cd,dl.d,recv);
  const left=have==null?null:Math.max(0,+(have-pre.sum+onWay).toFixed(3));
  const order=(have==null||!need)?null:Math.max(0,+(need-left).toFixed(3));
  return {have,need,order,left,onWay,cov,pre,dl};
}

/* ---------- ของจากครัวกลาง + ผูกกับสูตร ---------- */
const brNorm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
const brDeptOf=p=>String(p.dept||'').trim()||String(p.cat_label||'').trim();
function brIsKitchen(p){
  const L=(S.br.links||{})[brNorm(p.name)];
  if(L&&L.r)return true;                                      // ผูกกับสูตรไว้เอง = ของครัวแน่นอน
  const src=S.br.src;
  if(src&&!src.auto)return (src.sups||[]).includes(String(p.sup||'').trim())||(src.depts||[]).includes(brDeptOf(p));
  return BR_SRC_RE.test(p.sup||'')||BR_SRC_RE.test(brDeptOf(p));
}
const BR_U={'กก':'kg','กก.':'kg','กิโล':'kg','กิโลกรัม':'kg','kg':'kg','ก':'g','ก.':'g','กรัม':'g','g':'g',
  'ล':'l','ล.':'l','ลิตร':'l','l':'l','มล':'ml','มล.':'ml','มิลลิลิตร':'ml','ml':'ml'};
function brUKey(u){const k=String(u||'').trim().toLowerCase();return BR_U[k]||k.replace(/\.$/,'');}
function brUFactor(from,to){const a=brUKey(from),b=brUKey(to);if(!a||!b)return null;if(a===b)return 1;
  const T={'g>kg':0.001,'kg>g':1000,'ml>l':0.001,'l>ml':1000};return T[a+'>'+b]!=null?T[a+'>'+b]:null;}
const brContinuous=u=>['kg','g','l','ml'].includes(brUKey(u));
function brLinkOf(p){ // {r:สูตร|null, f:1 หน่วยสาขา = f หน่วยสูตร | null}
  const k=brNorm(p.name),L=(S.br.links||{})[k];
  if(L){
    if(!L.r)return {r:null,f:null,none:true,manual:true};
    const r=recipeById(L.r);if(!r)return {r:null,f:null};
    const f=(L.f!=null&&L.f!=='')?num(L.f):brUFactor(p.unit,r.yield_unit);
    return {r,f:f>0?f:null,manual:true};
  }
  const r=S.recipes.find(x=>brNorm(x.name)===k||String(x.stock_name||'').split(/[,|]/).some(s=>s.trim()&&brNorm(s)===k));
  if(!r)return {r:null,f:null};
  return {r,f:brUFactor(p.unit,r.yield_unit),auto:true};
}

/* ---------- โหลดข้อมูลจากแอพนับสต๊อก ---------- */
const brQ=async b=>{const r=await b;if(r&&r.error)throw r.error;return (r&&r.data)||[];};
async function brSettingsLoad(){
  const rows=await brQ(sb.from('ck_settings').select('key,value').in('key',['br_src','br_links'])).catch(()=>[]);
  const g=k=>{const x=rows.find(r=>r.key===k);return x?x.value:null;};
  S.br.src=g('br_src');S.br.links=g('br_links')||{};
}
async function brLoadBranch(code,today){
  const bid=STK_BR[code];
  const base='id,branch_id,name,unit,sup,cat_label,rate_wk,rate_fri,rate_we,sort,image_url';
  let prods;
  try{prods=await sbAll(()=>sb.from('products').select(base+',dept').is('deleted_at',null).eq('branch_id',bid).order('sort').order('id'));}
  catch(e){prods=await sbAll(()=>sb.from('products').select(base).is('deleted_at',null).eq('branch_id',bid).order('sort').order('id'));}
  const from=brAddDays(today,-3);
  const cntRows=await sbAll(()=>sb.from('stock_counts').select('product_id,qty,out_of_stock,created_at,count_date')
    .eq('branch_id',bid).gte('count_date',from).order('created_at',{ascending:false}).order('id'));
  let cd=null;cntRows.forEach(r=>{const d=String(r.count_date||'').slice(0,10);if(d&&d<=today&&(!cd||d>cd))cd=d;});
  const cnt={};let lastAt=null;
  cntRows.forEach(r=>{if(String(r.count_date||'').slice(0,10)!==cd||cnt[r.product_id])return;
    cnt[r.product_id]={qty:r.qty,out:!!r.out_of_stock};
    if(!lastAt||String(r.created_at)>lastAt)lastAt=String(r.created_at||'');});
  const recv={};
  if(cd){
    const rr=await sbAll(()=>sb.from('stock_receipts').select('product_id,order_date,ordered')
      .eq('branch_id',bid).gte('order_date',brAddDays(cd,-10)).lte('order_date',cd).order('order_date')).catch(()=>[]);
    rr.forEach(r=>{const q=num(r.ordered);if(!r.product_id||!q)return;
      (recv[r.product_id]=recv[r.product_id]||{})[String(r.order_date).slice(0,10)]=q;});
  }
  const needs={};
  if(cd&&S.br.needTbl!==false){
    const r=await sb.from('ck_br_needs').select('*').eq('branch',code).eq('count_date',cd);
    if(r.error){if(MISSING_TBL(r.error))S.br.needTbl=false;}
    else (r.data||[]).forEach(x=>needs[x.product_id]=x);
  }
  return {code,bid,prods,cnt,cd,lastAt,recv,needs};
}
async function brLoad(force){
  if(!force&&S.br.data&&Date.now()-S.br.t<60000)return S.br.data;
  if(S.br.loading)return S.br.loading;
  S.br.loading=(async()=>{
    try{
      const today=bizTodayISO();
      await brSettingsLoad();
      S.br.sups=await brQ(sb.from('suppliers').select('name,order_mode,schedule,lead_days,order_ahead'))
        .catch(()=>brQ(sb.from('suppliers').select('name,order_mode,schedule,lead_days'))).catch(()=>[]);
      // 🎌 วันขายดีจากปฏิทิน — ยังไม่รัน SQL / อ่านไม่ได้ = ไม่มีวันพิเศษ ตัวเลขเหมือนเดิม
      spdSet(await brQ(sb.from('cal_special_days').select('id,name,day_from,day_to,order_rate_group,order_branches,cancelled')
        .eq('cancelled',false).not('order_rate_group','is',null)
        .gte('day_to',brAddDays(today,-16)).lte('day_from',brAddDays(today,50))).catch(()=>[]));
      const data=[];
      for(const code of stkCodes())data.push(await brLoadBranch(code,today));   // เห็นเฉพาะสาขา = โหลดเฉพาะสาขาที่ได้สิทธิ์
      S.br.data=data;S.br.err=null;S.br.t=Date.now();
    }catch(e){S.br.err=(e&&e.message)||String(e);S.br.data=null;}
    finally{S.br.loading=null;}
    return S.br.data;
  })();
  return S.br.loading;
}
const brBranch=code=>(S.br.data||[]).find(b=>b.code===code)||null;
function brPlan(B){
  const all=B.prods.filter(brIsKitchen);
  const rows=B.cd?all.map(p=>Object.assign({p,link:brLinkOf(p),saved:B.needs[p.id]||null},brRow(p,B.cnt,B.cd,B.recv))):[];
  const counted=rows.filter(x=>x.have!=null).length;
  const need=rows.filter(x=>x.order>0);
  const sentRows=rows.filter(x=>x.saved&&(x.saved.order_id||x.saved.sent!=null));
  const legacySent=!sentRows.length&&B.cd&&S.orders.some(o=>o.branch===B.code&&o.status!=='cancel'&&String(o.note||'').startsWith('📋')&&String(o.note||'').includes(B.cd));
  const dl=rows.length?rows[0].dl:null;
  return {rows,all,counted,need,sent:sentRows.length>0||legacySent,sentRows,dl};
}
const brSentQty=x=>x.saved&&x.saved.sent!=null?num(x.saved.sent):null;
function brDefault(x){ // ค่าเริ่มต้นช่อง "ส่งจริง" — หน่วยนับเป็นชิ้น/ถุง ปัดขึ้นเป็นจำนวนเต็ม
  if(!(x.order>0))return '';
  return String(brContinuous(x.p.unit)?rnd2(x.order):Math.ceil(x.order-1e-9));
}

function brWhen(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(+d))return '';

function brBillPaint(){ // ยอดบิลสด: เฉพาะรายการที่ติ๊กแล้ว (ราคาขายสาขา = ทุนจริง + %)

      '<div class="brq"><div class="xs mut">'+t('br_need')+'</div><b>'+(x.order>0?fmtI(Math.ceil(x.order*100)/100):'–')+'</b></div>'+

async function brSend(){await once(async()=>{
  const d=BR_DRAFT;if(!d||d.ro)return;
  if(!inBr(d.code)){toast(t('br_noaccess'),true);return;}   // ส่งได้เฉพาะสาขาที่ได้สิทธิ์
  const B=brBranch(d.code);if(!B||!B.cd)return;
  const rows=brPlan(B).rows;
  const val=x=>{const n=num(d.v[x.p.id]);return n>0&&d.tick[x.p.id]?n:0;};   // ส่งเฉพาะรายการที่ติ๊กแล้ว
  const lines=rows.filter(x=>val(x)>0);
  const unt=rows.filter(x=>num(d.v[x.p.id])>0&&!d.tick[x.p.id]).length;
  if(unt&&!confirm(t('kf_untick_q',{n:unt})))return;
  if(!lines.length&&!confirm(t('br_none_sent_q')))return;
  const D=bizTodayISO();let oid=null;
  if(lines.length){
    oid=uid('or');
    const row={id:oid,branch:d.code,branch_name:branchName(d.code),d:D,status:'sent',
      note:'📋 '+t('br_note')+' '+B.cd,by_name:S.user.name};
    await dbi(()=>sb.from('ck_orders').insert(row));
    const moves=[];let total=0,totalSell=0;
    const items=lines.map((x,i)=>{
      const L=x.link,q0=val(x);
      if(L.r&&L.f){
        const r=L.r,q=rnd2(q0*L.f),cu=recipeUnitCost(r),sp=recipeSellPrice(r);
        const amount=cu!=null?rnd2(q*cu):null,amountSell=sp!=null?rnd2(q*sp):null;
        if(amount!=null)total+=amount;if(amountSell!=null)totalSell+=amountSell;
        moves.push({d:D,kind:'send',item_kind:'recipe',ref_id:r.id,name:r.name,qty:-q,cost:amount,ref:oid,branch:d.code});
        return {order_id:oid,recipe_id:r.id,name:r.name,unit:r.yield_unit||'',qty:q,cost_unit:cu,amount,sell_unit:sp,amount_sell:amountSell,sort:i};
      }
      return {order_id:oid,recipe_id:null,name:x.p.name,unit:x.p.unit||'',qty:q0,cost_unit:null,amount:null,sort:i};
    });
    let ins;
    try{ins=await dbi(()=>sb.from('ck_order_items').insert(items).select());}
    catch(e){if(!/sell_unit|amount_sell/.test(String((e&&e.message)||e)))throw e;
      items.forEach(x=>{delete x.sell_unit;delete x.amount_sell;});
      ins=await dbi(()=>sb.from('ck_order_items').insert(items).select());}
    await pushMoves(moves);
    row.total=rnd2(total);
    try{await dbi(()=>sb.from('ck_orders').update({total:row.total,total_sell:rnd2(totalSell)}).eq('id',oid));}
    catch(e){if(!/total_sell/.test(String((e&&e.message)||e)))throw e;
      await dbi(()=>sb.from('ck_orders').update({total:row.total}).eq('id',oid));}
    row.total_sell=rnd2(totalSell);
    S.orders.unshift(row);S.orderItems[oid]=ins||items;
    await billNoAssign(row);
  }
  // เก็บ "ต้องส่ง vs ส่งจริง" ทุกบรรทัดที่เกี่ยว (รวมที่ส่ง 0 = ส่งขาด) — ไว้ใช้วางแผนผลิต/สั่งของ
  const recs=rows.filter(x=>x.order>0||val(x)>0).map(x=>({branch:d.code,count_date:B.cd,product_id:x.p.id,
    name:x.p.name,unit:x.p.unit||'',have:x.have,need:x.order,sent:val(x),
    recipe_id:x.link.r?x.link.r.id:null,factor:x.link.f,d_send:D,order_id:oid,by_name:S.user.name}));
  let warn='';
  if(recs.length&&S.br.needTbl!==false){
    const r=await sb.from('ck_br_needs').upsert(recs,{onConflict:'branch,count_date,product_id'});
    if(r&&r.error){if(MISSING_TBL(r.error))S.br.needTbl=false;else warn=r.error.message||'';}
  }
  // บอกแอพนับสต๊อกว่าของกำลังไป — รอบนับถัดไปจะได้ไม่สั่งซ้ำ (ช่อง "ของที่กำลังมา")
  if(lines.length){
    const r=await sb.from('stock_receipts').upsert(lines.map(x=>({branch_id:B.bid,branch_name:branchName(d.code),
      product_id:x.p.id,name:x.p.name,cat_label:x.p.cat_label||brDeptOf(x.p)||null,unit:x.p.unit||'',
      sup:x.p.sup||'',order_date:B.cd,ordered:val(x)})),{onConflict:'branch_id,product_id,order_date'});
    if(r&&r.error)warn=warn||r.error.message||'';
  }
  BR_DRAFT=null;
  await brLoad(true);   // โหลดยอดใหม่ก่อนปิด — กลับไปหน้ารายการสาขาจะได้เห็นว่าส่งแล้ว
  closeModal();applyChrome();
  const bn=oid&&(S.orders.find(o=>o.id===oid)||{}).bill_no;
  toast((warn?t('br_done')+' · ⚠ '+warn:t('br_done'))+(bn?' · 🧾 '+bn:''),!!warn);
  show(S.tab);
});}
/* ยกเลิกการส่งที่มาจากยอดนับ (เรียกจาก orderUnsend) — ให้ยอดต้องส่งกลับมาโชว์ และแอพนับไม่นับว่าของกำลังมา */
async function brUnsendHook(o){
  const r=await sb.from('ck_br_needs').select('product_id,count_date').eq('order_id',o.id);
  const rows=(r&&!r.error&&r.data)||[];
  if(rows.length){
    await sb.from('ck_br_needs').update({sent:null,order_id:null,d_send:null}).eq('order_id',o.id);
    const bid=STK_BR[o.branch],cd=rows[0].count_date;
    if(bid&&cd)await sb.from('stock_receipts').update({ordered:0}).eq('branch_id',bid).eq('order_date',cd)
      .in('product_id',rows.map(x=>x.product_id));
  }
  S.br.t=0;
}

/* ---------- ผูกสินค้าสาขากับสูตรครัว ---------- */
let BR_LINK=null;
function brFindProd(pid){for(const B of (S.br.data||[])){const p=B.prods.find(x=>x.id===pid);if(p)return p;}return null;}
function brLinkModal(pid){
  if(!isAdminish())return;
  const p=brFindProd(pid);if(!p)return;
  const L=brLinkOf(p);
  BR_LINK={pid,name:p.name,unit:p.unit||'',r:L.r?L.r.id:'',f:L.f!=null?String(L.f):'',none:!!L.none};
  brPaintLink();
}
function brPaintLink(){
  const d=BR_LINK;if(!d)return;
  const r=d.r?recipeById(d.r):null;
  let h='<h3>🔗 '+t('br_link_title',{n:esc(d.name)})+'</h3>'+
    '<div class="fld"><label>'+t('nav_menus')+'</label><select onchange="BR_LINK.r=this.value;BR_LINK.none=false;'+
      'const r=recipeById(this.value);BR_LINK.f=r?String(brUFactor(BR_LINK.unit,r.yield_unit)||\'\'):\'\';brPaintLink()"'+(d.none?' disabled':'')+'>'+
      '<option value="">—</option>'+S.recipes.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===d.r?' selected':'')+'>'+esc(dispName(x))+'</option>').join('')+'</select></div>';
  if(r&&!d.none)h+='<div class="fld"><label>'+t('br_factor',{a:esc(trUnit(d.unit)),b:esc(trUnit(r.yield_unit||''))})+'</label>'+
      '<input inputmode="decimal" value="'+esc(d.f)+'" oninput="BR_LINK.f=this.value"></div>';
  h+='<label class="fld" style="display:flex;gap:9px;align-items:center"><input type="checkbox" style="width:20px;height:20px"'+(d.none?' checked':'')+
    ' onchange="BR_LINK.none=this.checked;brPaintLink()"><span>'+t('br_not_ours')+'</span></label>'+
    '<div class="grid2"><button class="btn gh" onclick="brLinkBack()">'+t('back')+'</button>'+
    '<button class="btn" onclick="brLinkSave()">'+t('save')+'</button></div>';
  openModal(h);
}
function brLinkBack(){BR_LINK=null;if(BR_DRAFT)brPaintSend();else closeModal();}
async function brLinkSave(){await once(async()=>{
  const d=BR_LINK;if(!d)return;
  if(!d.none&&!d.r){toast(t('br_pick_menu'),true);return;}
  if(!d.none&&!(num(d.f)>0)){toast(t('br_need_factor'),true);return;}
  const cur=await brQ(sb.from('ck_settings').select('value').eq('key','br_links'));
  const links=(cur[0]&&cur[0].value&&typeof cur[0].value==='object')?cur[0].value:{};
  links[brNorm(d.name)]=d.none?{r:null}:{r:d.r,f:num(d.f)};
  await dbi(()=>sb.from('ck_settings').upsert({key:'br_links',value:links}));
  S.br.links=links;BR_LINK=null;toast(t('sv_ok'));
  if(BR_DRAFT)brPaintSend();else{closeModal();brPaintAll();}
});}

/* ---------- เลือกว่าซัพ/แผนกไหนในแอพนับ = ของจากครัวกลาง ---------- */
let BR_SRC=null;
function brSrcModal(){
  if(!isAdminish())return;
  const sups=new Set(),depts=new Set();
  (S.br.data||[]).forEach(B=>B.prods.forEach(p=>{const s=String(p.sup||'').trim();if(s)sups.add(s);const dp=brDeptOf(p);if(dp)depts.add(dp);}));
  const src=S.br.src&&!S.br.src.auto?S.br.src:null;
  BR_SRC={sups:[...sups].sort((a,b)=>a.localeCompare(b,'th')),depts:[...depts].sort((a,b)=>a.localeCompare(b,'th')),
    selS:new Set(src?src.sups||[]:[...sups].filter(s=>BR_SRC_RE.test(s))),
    selD:new Set(src?src.depts||[]:[...depts].filter(s=>BR_SRC_RE.test(s)))};
  brPaintSrc();
}
function brPaintSrc(){
  const d=BR_SRC;if(!d)return;
  const chips=(arr,sel,kind)=>arr.length?'<div class="catwrap">'+arr.map(n=>'<button data-k="'+kind+'" data-n="'+esc(n)+'" class="'+(sel.has(n)?'on':'')+'" onclick="brSrcTog(this)">'+esc(n)+'</button>').join('')+'</div>':'<div class="xs mut">–</div>';
  openModal('<h3>⚙️ '+t('br_src')+'</h3><div class="xs mut" style="margin-bottom:10px">'+t('br_src_hint')+'</div>'+
    '<div class="xs mut" style="margin:6px 0">'+t('br_sup')+'</div>'+chips(d.sups,d.selS,'s')+
    '<div class="xs mut" style="margin:6px 0">'+t('br_dept')+'</div>'+chips(d.depts,d.selD,'d')+
    '<div class="grid2"><button class="btn gh" onclick="brSrcSave(true)">'+t('br_src_auto')+'</button>'+
    '<button class="btn" onclick="brSrcSave(false)">'+t('save')+'</button></div>');
}
function brSrcTog(b){const s=b.dataset.k==='s'?BR_SRC.selS:BR_SRC.selD,n=b.dataset.n;s.has(n)?s.delete(n):s.add(n);brPaintSrc();}
async function brSrcSave(auto){await once(async()=>{
  const v=auto?{auto:true}:{sups:[...BR_SRC.selS],depts:[...BR_SRC.selD]};
  await dbi(()=>sb.from('ck_settings').upsert({key:'br_src',value:v}));
  S.br.src=v;BR_SRC=null;closeModal();toast(t('sv_ok'));brPaintAll();
});}
</script>
<script>
/* ============================================================
   📦 สต๊อกครัวกลาง
   ============================================================ */
let SK_MODE='table', SK_CNT={}, SK_Q='';
RENDER.stock=function(el){
  if(SK_MODE==='count'){renderStockCount(el);return;}
  let h='<div class="card"><h3>🥬 '+t('sk_items')+
    '<span class="sp">'+(canKitchen()?'<button class="btn sm2" onclick="skCountStart()">'+t('skc_start')+'</button> ':'')+
    '<button class="btn gh sm2" onclick="ledgerOpen()">📒 '+t('lg_btn')+'</button> '+
    S.items.length+' '+t('items_n')+'</span></h3>';
  if(!S.items.length)h+='<div class="empty">'+t('it_none')+'</div>';
  else{h+='<div class="twrap"><table class="t"><tr><th>'+t('nav_items')+'</th><th class="right">'+t('sk_now')+'</th><th class="right">'+t('sk_min')+'</th><th class="right">'+t('sk_val')+'</th><th></th></tr>';
    S.items.forEach(i=>{const c=unitCost(i);const low=i.min_qty!=null&&num(i.qty)<=num(i.min_qty);
      h+='<tr><td>'+esc(dispName(i))+'</td>'+
        '<td class="n"'+(low?' style="color:var(--bad);font-weight:700"':'')+'>'+fmtI(i.qty)+' '+esc(trUnit(i.unit||''))+'</td>'+
        '<td class="n">'+(i.min_qty!=null?fmtI(i.min_qty):'–')+'</td>'+
        '<td class="n">'+(c!=null?'฿'+fmt(num(i.qty)*c,2):'–')+'</td>'+
        '<td class="right">'+(canKitchen()?'<button class="btn gh sm2" onclick="adjModal(\'item\',\''+i.id+'\')">'+t('sk_adjust')+'</button>':'')+'</td></tr>';});
    const val=S.items.reduce((s,i)=>{const c=unitCost(i);return s+(c!=null?num(i.qty)*c:0);},0);
    h+='<tr class="tot"><td>'+t('total')+'</td><td></td><td></td><td class="n">฿'+fmt(val,2)+'</td><td></td></tr></table></div>';}
  h+='</div>';
  h+='<div class="card"><h3>🍲 '+t('sk_menus')+'<span class="sp">'+S.recipes.length+' '+t('items_n')+'</span></h3>';
  if(!S.recipes.length)h+='<div class="empty">'+t('mn_none')+'</div>';
  else{h+='<div class="twrap"><table class="t"><tr><th>'+t('nav_menus')+'</th><th class="right">'+t('sk_now')+'</th><th class="right">'+t('pr_cost_unit')+'</th><th class="right">'+t('sk_val')+'</th><th></th></tr>';
    S.recipes.forEach(r=>{const c=recipeUnitCost(r);
      h+='<tr><td>'+esc(dispName(r))+'</td><td class="n">'+fmtI(r.qty)+' '+esc(trUnit(r.yield_unit||''))+'</td>'+
        '<td class="n">'+(c!=null?'฿'+fmt(c,2):'–')+'</td>'+
        '<td class="n">'+(c!=null?'฿'+fmt(num(r.qty)*c,2):'–')+'</td>'+
        '<td class="right">'+(canKitchen()?'<button class="btn gh sm2" onclick="adjModal(\'recipe\',\''+r.id+'\')">'+t('sk_adjust')+'</button>':'')+'</td></tr>';});
    h+='</table></div>';}
  h+='</div>';
  el.innerHTML=h;
};
function adjModal(kind,id){
  const o=kind==='item'?itemById(id):recipeById(id);if(!o)return;
  openModal('<h3>'+t('sk_adj_title')+' · '+esc(dispName(o))+'</h3>'+
    '<div class="fld"><label>'+t('sk_now')+'</label><div class="b" style="font-size:18px">'+fmtI(o.qty)+' '+esc(trUnit((kind==='item'?o.unit:o.yield_unit)||''))+'</div></div>'+
    '<div class="fld"><label>'+t('sk_new_qty')+'</label><input id="adjQ" inputmode="decimal" value="'+fmtI(o.qty)+'"></div>'+
    '<div class="fld"><label>'+t('sk_adj_note')+'</label><input id="adjN"></div>'+
    '<button class="btn big" onclick="adjSave(\''+kind+'\',\''+id+'\')">'+t('save')+'</button>');
}
async function adjSave(kind,id){await once(async()=>{
  const o=kind==='item'?itemById(id):recipeById(id);if(!o)return;
  const nv=num(document.getElementById('adjQ').value);
  const delta=rnd2(nv-num(o.qty));
  if(delta!==0){
    await pushMoves([{d:bizTodayISO(),kind:'adjust',item_kind:kind,ref_id:id,name:o.name,qty:delta,
      note:document.getElementById('adjN').value.trim()||null}]);
  }
  closeModal();toast(t('sv_ok'));show(S.tab);
});}

/* ---------- 📋 โหมดนับสต๊อกครัวกลาง (นับของสำรองที่สั่งมาเก็บไว้) ---------- */
function skCountStart(){if(!canKitchen())return;SK_MODE='count';SK_CNT={};SK_Q='';show('stock');}
function skCountExit(){SK_MODE='table';SK_CNT={};show('stock');}
function skEnt(kind,id){const k=kind+'|'+id;return SK_CNT[k]||(SK_CNT[k]={kind,id,v:''});}
function skIsCounted(e){return !!e&&String(e.v==null?'':e.v).trim()!=='';}
function skUnit(kind,o){ // หน่วยที่นับ + 1 หน่วยนับ = กี่หน่วยใช้
  if(kind!=='item')return {u:o.yield_unit||'',f:1};
  const u=countUnitOf(o);return {u,f:unitFactor(o,u)||1};}
function skTotal(e,o,kind){return rnd4(num(e.v)*skUnit(kind,o).f);}   // แปลงเป็นหน่วยใช้ก่อนเก็บ
function skInput(kind,id,el){ // พิมพ์แล้วไม่วาดหน้าใหม่ (คีย์บอร์ดมือถือไม่หุบ) — อัปเดตเฉพาะการ์ดนี้กับตัวนับ
  const e=skEnt(kind,id);e.v=el.value;
  const card=el.closest('.icard');if(card)card.classList.toggle('cnt',skIsCounted(e));
  const o=kind==='item'?itemById(id):recipeById(id);const eq=card&&card.querySelector('.skeq');
  if(eq&&o){const U=skUnit(kind,o),base=kind==='item'?(o.unit||''):(o.yield_unit||'');
    eq.textContent=skIsCounted(e)&&U.u!==base?'= '+fmtQ(skTotal(e,o,kind))+' '+trUnit(base):'';}
  skPaintMeta();}
function skPaintMeta(){
  const n=Object.values(SK_CNT).filter(skIsCounted).length,all=S.items.filter(i=>i.active!==false).length+S.recipes.filter(r=>r.active!==false).length;
  const v=document.getElementById('skN');if(v)v.textContent=t('skc_counted',{a:n,b:all});
  const b=document.getElementById('skGo');if(b)b.disabled=!n;
  document.querySelectorAll('#view-stock .catbar button[data-c]').forEach(x=>{const c=x.dataset.c;if(!c)return;
    const L=c==='__menu'?S.recipes.filter(r=>r.active!==false).map(r=>'recipe|'+r.id):S.items.filter(i=>i.active!==false&&(i.cat||'อื่นๆ')===c).map(i=>'item|'+i.id);
    const k=L.filter(id=>skIsCounted(SK_CNT[id])).length;const sp=x.querySelector('.skcn');if(sp)sp.textContent=k+'/'+L.length;});}
function skCountCard(kind,o){
  const e=SK_CNT[kind+'|'+o.id];const counted=skIsCounted(e);
  const base=kind==='item'?(o.unit||''):(o.yield_unit||'');
  const U=skUnit(kind,o);
  const ic=kind==='item'?catIc(o.cat):'🍲';
  return '<div class="icard skcard'+(counted?' cnt':'')+'">'+
    '<div class="ithumb" style="height:64px">'+(o.image_url?'<img src="'+esc(o.image_url)+'" loading="lazy">':ic)+'</div>'+
    '<div class="iname" style="min-height:auto">'+esc(dispName(o))+'</div>'+
    '<div class="isub">'+t('skc_sys')+' '+fmtQ(rnd2(num(o.qty)/U.f))+' '+esc(trUnit(U.u))+'</div>'+
    (U.u!==base&&kind==='item'?'<div class="xs mut">'+esc(unitEqTxt(o,U.u))+'</div>':'')+
    '<div class="skin"><input inputmode="decimal" placeholder="0" value="'+esc(e?e.v:'')+'" oninput="skInput(\''+kind+'\',\''+esc(o.id)+'\',this)"><span>'+esc(trUnit(U.u))+'</span></div>'+
    '<div class="xs b skeq" style="color:var(--gold)">'+(counted&&U.u!==base?'= '+fmtQ(skTotal(e,o,kind))+' '+esc(trUnit(base)):'')+'</div></div>';}
let SK_CAT=LS.get('jjck_skcat','')||'';
function skSetCat(c){SK_CAT=c;LS.set('jjck_skcat',c);show('stock');}
function renderStockCount(el){
  const q=supKey(SK_Q);
  const m=o=>!q||supKey(o.name).includes(q)||supKey(dispName(o)).includes(q);
  const actI=S.items.filter(i=>i.active!==false),actR=S.recipes.filter(r=>r.active!==false);
  const cats=allItemCats().filter(c=>actI.some(i=>(i.cat||'อื่นๆ')===c));
  if(SK_CAT&&SK_CAT!=='__menu'&&!cats.includes(SK_CAT))SK_CAT='';
  if(SK_CAT==='__menu'&&!actR.length)SK_CAT='';
  const cnt=(L,k)=>L.filter(o=>skIsCounted(SK_CNT[k+'|'+o.id])).length;
  let h='<div class="hintbox">'+t('skc_hint')+'</div>'+
    (canKitchen()?'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn gh sm2" onclick="cuSetup()">⚙️ '+t('cu_setup')+'</button></div>':'')+
    '<div class="catbar skcats"><button data-c="" class="'+(SK_CAT===''?'on':'')+'" onclick="skSetCat(\'\')">'+t('all')+'</button>'+
    cats.map(c=>{const L=actI.filter(i=>(i.cat||'อื่นๆ')===c);
      return '<button data-c="'+esc(c)+'" class="'+(SK_CAT===c?'on':'')+'" onclick="skSetCat(this.dataset.c)">'+catIc(c)+' '+esc(trCat(c))+' <span class="skcn">'+cnt(L,'item')+'/'+L.length+'</span></button>';}).join('')+
    (actR.length?'<button data-c="__menu" class="'+(SK_CAT==='__menu'?'on':'')+'" onclick="skSetCat(\'__menu\')">🍲 '+t('skc_menus')+' <span class="skcn">'+cnt(actR,'recipe')+'/'+actR.length+'</span></button>':'')+'</div>'+
    '<input placeholder="🔎 '+t('search')+'" value="'+esc(SK_Q)+'" oninput="SK_Q=this.value;show(\'stock\')" style="margin-bottom:10px">';
  let shown=0;
  if(SK_CAT!=='__menu')cats.filter(c=>!SK_CAT||c===SK_CAT).forEach(c=>{
    const L=actI.filter(i=>(i.cat||'อื่นๆ')===c&&m(i)).sort((a,b)=>dispName(a).localeCompare(dispName(b),'th'));
    if(!L.length)return;shown+=L.length;
    h+='<div class="secbar">'+catIc(c)+' '+esc(trCat(c))+'<span class="sp">'+L.length+'</span></div>'+
      '<div class="igrid" style="margin-bottom:14px">'+L.map(i=>skCountCard('item',i)).join('')+'</div>';});
  if(!SK_CAT||SK_CAT==='__menu'){const R=actR.filter(m);
    if(R.length){shown+=R.length;h+='<div class="secbar">🍲 '+t('skc_menus')+'<span class="sp">'+R.length+'</span></div>'+
      '<div class="igrid" style="margin-bottom:14px">'+R.map(r=>skCountCard('recipe',r)).join('')+'</div>';}}
  if(!shown)h+='<div class="card empty">'+t('no_data')+'</div>';
  const n=Object.values(SK_CNT).filter(skIsCounted).length;
  h+='<div class="stickysum"><span class="v" id="skN">'+t('skc_counted',{a:n,b:actI.length+actR.length})+'</span>'+
    '<span style="margin-left:auto;display:flex;gap:8px">'+
    '<button class="btn gh sm2" onclick="skCountExit()">'+t('cancel')+'</button>'+
    '<button class="btn ok" id="skGo" onclick="skCountSum()" '+(n?'':'disabled')+'>'+t('skc_save')+'</button></span></div>';
  el.innerHTML=h;
}
function skCountSum(){ // สรุปเฉพาะตัวที่ต่างจากระบบ ก่อนปรับจริง
  const diffs=[];
  Object.values(SK_CNT).forEach(e=>{
    if(!skIsCounted(e))return;
    const o=e.kind==='item'?itemById(e.id):recipeById(e.id);if(!o)return;
    const total=skTotal(e,o,e.kind);
    const delta=rnd2(total-num(o.qty));
    const U=skUnit(e.kind,o);
    if(delta!==0)diffs.push({kind:e.kind,id:e.id,name:o.name,disp:dispName(o),
      unit:U.u,f:U.f,sys:num(o.qty),cnt:total,delta});
  });
  window._skDiffs=diffs;
  if(!diffs.length){openModal('<h3>📋 '+t('skc_start')+'</h3><div class="okbox">'+t('skc_none')+'</div>'+
    '<button class="btn big" onclick="closeModal();skCountExit()">'+t('done')+'</button>');return;}
  let h='<h3>📋 '+t('skc_sum')+'</h3><div class="twrap"><table class="t">'+
    '<tr><th>'+t('nav_items')+'</th><th class="right">'+t('skc_sys')+'</th><th class="right">'+t('skc_start').replace('📋 ','')+'</th><th class="right">'+t('skc_diff')+'</th></tr>';
  diffs.forEach(d=>{const v=x=>fmtQ(rnd2(x/d.f));
    h+='<tr><td>'+esc(d.disp)+'</td><td class="n">'+v(d.sys)+' '+esc(trUnit(d.unit))+'</td>'+
    '<td class="n">'+v(d.cnt)+'</td>'+
    '<td class="n" style="color:var(--'+(d.delta>0?'ok':'bad')+');font-weight:700">'+(d.delta>0?'+':'')+v(d.delta)+'</td></tr>';});
  h+='</table></div><button class="btn ok big" style="margin-top:12px" onclick="skCountApply()">'+t('skc_apply')+' ('+diffs.length+')</button>';
  openModal(h,true);
}
async function skCountApply(){await once(async()=>{
  const diffs=window._skDiffs||[];if(!diffs.length)return;
  const today=bizTodayISO();
  await pushMoves(diffs.map(d=>({d:today,kind:'adjust',item_kind:d.kind,ref_id:d.id,name:d.name,
    qty:d.delta,note:'นับสต๊อก'})));
  closeModal();toast(t('sv_ok'));skCountExit();
});}

/* ============================================================
   📖 เมนู & สูตร
   ============================================================ */
let MN_CAT='';
RENDER.menus=function(el){
  let h='';
  if(canKitchen())h+='<div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="menuEdit()">'+t('mn_new')+'</button>'+
    (S.recipes.some(r=>r.active!==false&&!r.image_url)?'<button class="btn gh" onclick="autoImgWizard(\'recipe\')">'+t('ai_btn')+'</button>':'')+'</div>';
  const cats=[...new Set(S.recipes.map(r=>r.cat||'อื่นๆ'))];
  h+='<div class="catbar" onclick="const b=event.target.closest(\'button\');if(b){MN_CAT=b.dataset.cat||\'\';show(\'menus\')}">'+
    '<button data-cat="" class="'+(MN_CAT===''?'on':'')+'">'+t('all')+'</button>'+
    cats.map(c=>'<button data-cat="'+esc(c)+'" class="'+(MN_CAT===c?'on':'')+'">'+(MENU_CAT_IC[c]||'🍱')+' '+esc(trCat(c))+'</button>').join('')+'</div>';
  const list=S.recipes.filter(r=>!MN_CAT||(r.cat||'อื่นๆ')===MN_CAT);

function menuCalcPaint(id){
  const r=recipeById(id);const q=num(document.getElementById('mcQ').value);
  const batches=q/(num(r.yield_qty)||1);
  let mat=0,h='<div class="secbar">'+t('mn_calc_need')+'</div><div class="twrap"><table class="t"><tr><th>'+t('nav_items')+'</th><th class="right">'+t('qty')+'</th><th class="right">'+t('pl_have')+'</th><th class="right">'+t('cost')+'</th></tr>';
  bomOf(r).forEach(l=>{const it=itemById(l.item_id);const need=rnd2(batches*num(l.qty));const uc=unitCost(it);
    const enough=num(it.qty)>=need;
    if(uc!=null)mat+=need*uc;
    h+='<tr><td>'+esc(dispName(it))+'</td><td class="n">'+fmtI(need)+' '+esc(trUnit(it.unit||''))+'</td>'+
      '<td class="n">'+(enough?'<span class="chip ok">'+fmtI(it.qty)+'</span>':'<span class="chip bad">'+fmtI(it.qty)+'</span>')+'</td>'+
      '<td class="n">'+(uc!=null?'฿'+fmt(need*uc,2):'–')+'</td></tr>';});
  const total=mat+num(r.extra_cost)*batches;
  h+='<tr class="tot"><td>'+t('pr_cost_total')+'</td><td></td><td></td><td class="n">฿'+fmt(total,2)+'</td></tr>'+
    '<tr class="tot"><td><b>'+t('mn_cost_per')+'</b></td><td></td><td></td><td class="n"><b style="color:var(--red)">฿'+fmt(q?total/q:0,2)+'</b></td></tr></table></div>';

async function menuSave(){await once(async()=>{
  const d=MN_DRAFT;if(!d)return;
  d.name=(document.getElementById('mnName').value||'').trim();
  if(!d.name){toast(t('need_name'),true);return;}
  const nb=v=>String(v==null?'':v).trim()===''?null:num(v);
  if([d.markup_pct,d.safety_days,d.safety_qty].some(v=>String(v==null?'':v).trim()!==''&&!(num(v)>=0&&isFinite(Number(String(v).replace(/,/g,'')))))){toast(t('kf_set_bad'),true);return;}
  const row={name:d.name,cat:d.cat,yield_qty:d.yield_qty||1,yield_unit:d.yield_unit,
    extra_cost:d.extra_cost||0,markup_pct:nb(d.markup_pct),safety_days:nb(d.safety_days),safety_qty:nb(d.safety_qty),note:d.note||null};
  const NEWC=['markup_pct','safety_days','safety_qty'];
  let rid=d.id;let renamed=false;
  if(rid){const old=recipeById(rid);renamed=old&&old.name!==d.name;
    if(renamed)row.i18n=null; // เปลี่ยนชื่อ — ล้างคำแปลเก่าแล้วแปลใหม่
    await updFallback('ck_recipes',row,rid,NEWC);   // ยังไม่รัน jjmk_kitchen_flow.sql = บันทึกช่องอื่นไปก่อน
    Object.assign(recipeById(rid),row);
    const oldIds=(S.boms[rid]||[]).map(l=>l.id).filter(x=>x!=null);
    const lines=d.bom.filter(l=>num(l.qty)>0).map((l,i)=>({recipe_id:rid,item_id:l.item_id,qty:l.qty,sort:i}));
    const ins=lines.length?await dbi(()=>sb.from('ck_recipe_items').insert(lines).select()):[];
    if(oldIds.length)await dbi(()=>sb.from('ck_recipe_items').delete().in('id',oldIds));
    S.boms[rid]=ins;}
  else{rid=uid('rc');row.id=rid;row.qty=0;
    await insFallback('ck_recipes',[row],NEWC);
    S.recipes.push(row);
    const lines=d.bom.filter(l=>num(l.qty)>0).map((l,i)=>({recipe_id:rid,item_id:l.item_id,qty:l.qty,sort:i}));
    const ins=lines.length?await dbi(()=>sb.from('ck_recipe_items').insert(lines).select()):[];
    S.boms[rid]=ins;}
  MN_DRAFT=null;closeModal();
  if(S.flowSql===false&&NEWC.some(c=>row[c]!=null))toast(t('kf_need_sql'),true);else toast(t('sv_ok'));
  show('menus');
  // แปลชื่ออัตโนมัติ (พื้นหลัง — เติมเฉพาะช่องว่าง)
  const r=recipeById(rid);
  autoI18n(row.name,renamed?null:(r&&r.i18n)).then(o=>{if(o&&r){r.i18n=o;
    sb.from('ck_recipes').update({i18n:o}).eq('id',rid).then(()=>{},()=>{});}}).catch(()=>{});
});}
