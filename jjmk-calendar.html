    <div class="fld"><label>ชื่อวัน *</label><input id="sdName" maxlength="80" value="${x?esc(x.name):''}" placeholder="เช่น สงกรานต์ / วันแม่ / วาเลนไทน์">
      <div class="pick" style="margin-top:6px">${SD_NAMES.map(n=>`<span class="chip" onclick="$('#sdName').value='${n}'">${n}</span>`).join('')}</div></div>
    <div class="grid2">
      <div class="fld"><label>ตั้งแต่ *</label><input type="date" id="sdFrom" value="${d1}" onchange="if($('#sdTo').value<this.value)$('#sdTo').value=this.value"></div>
      <div class="fld"><label>ถึง</label><input type="date" id="sdTo" value="${d2}"></div>
    </div>
    ${K==='pay'?`<div class="fld"><label>ค่าแรงวันนั้น</label>
      <div class="pick" id="sdMult">${SD_PAY.map(([v,t])=>`<span class="chip${pay===v?' on':''}" data-sv="${v}" onclick="sdPick(this)">${t}</span>`).join('')}</div>
      <div class="sdnote">×2 = ได้เพิ่มอีก 1 เท่าของค่าแรงวัน · ×3 = เพิ่ม 2 เท่า · ×1.5 = เพิ่มครึ่งเท่า</div></div>`:''}
    ${K==='order'?`<div class="fld"><label>สาขาที่ขายดี</label>
      <div class="pick" id="sdBr"><span class="chip${!obr.length?' on':''}" data-sv="" onclick="sdBrPick(this)">ทุกสาขา</span>${SD_ORD_BR.map(([c,n])=>`<span class="chip${obr.includes(c)?' on':''}" data-sv="${c}" onclick="sdBrPick(this)">${n}</span>`).join('')}</div></div>`:''}
    <div class="fld"><label>หมายเหตุ</label><input id="sdNote" maxlength="200" value="${x?esc(x.note||''):''}" placeholder="(ไม่บังคับ)"></div>
    <div class="acts">
      <button class="btn" id="sdSave" onclick="saveDay(${x?`'${x.id}'`:'null'},'${K}')">💾 บันทึก</button>
      ${x?`<button class="btn gh" onclick="cancelDay('${x.id}')">🗑 ${conv?'ลบป้ายนี้':'ยกเลิกวันนี้'}</button>`:''}
      <button class="btn gh" onclick="closeModal()">ปิด</button>
    </div>`);
}
function sdPick(el){el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el))}
function sdBrPick(el){
  const box=el.parentNode, all=box.querySelector('[data-sv=""]');
  if(el===all){box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===all));return}
  el.classList.toggle('on'); all.classList.remove('on');
  if(![...box.querySelectorAll('.chip.on')].length)all.classList.add('on');
}
function sdErr(e){
  const t=String(e&&e.message||e);
  if(/cal_sd_off_once/.test(t))return 'มีวันใน🏢 ปฏิทินออฟฟิศหยุดครอบวันนี้อยู่แล้ว — แก้รายการเดิม หรือเลือกวันอื่นครับ';
  if(/cal_sd_pay_once|exclusion/i.test(t))return 'มีวันใน💰 ปฏิทินค่าแรง ×2 ครอบวันนี้อยู่แล้ว — แก้รายการเดิม หรือเลือกวันอื่นครับ';
  if(/cal_sd_range/.test(t))return 'ช่วงวันไม่ถูกต้อง (วันสุดท้ายต้องไม่ก่อนวันแรก และยาวไม่เกิน 32 วัน)';
  if(/"kind"|'kind'|cal_sd_kind/.test(t))return 'ต้องรัน jjmk-calendar-days.sql รุ่นล่าสุดใน Supabase ก่อน (แยก 3 ปฏิทิน)';
  if(/cal_special_days|relation|schema cache/i.test(t))return 'ยังไม่ได้รัน jjmk-calendar-days.sql ใน Supabase';
  return 'บันทึกไม่สำเร็จ: '+t.slice(0,140);
}
/* สถานะฝั่งเงินเดือน — แก้อะไรที่กระทบเงินต้องให้ระบบเงินเดือนยืนยันใหม่เสมอ */
function sdPayStatus(old,nw){
  if(sdPayEff(nw)){
    if(!old)return 'pending';
    const same=sdKind(old)===sdKind(nw)&&(+old.pay_multiplier||0)===(+nw.pay_multiplier||0)&&old.name===nw.name&&old.day_from===nw.day_from&&old.day_to===nw.day_to;
    return same?old.pay_status:'pending';
  }
  /* ไม่เกี่ยวเงินเดือนแล้ว: ถ้าเงินเดือนเคยยืนยันไปแล้ว ต้องให้เงินเดือนเอาออกด้วย */
  if(old&&(old.pay_snapshot||old.pay_status==='confirmed'))return 'pending';
  return 'none';
}
async function saveDay(id,K){
  if(!SD_K[K])return;
  const old=id?(S.days||[]).find(r=>r.id===id):null, D=SD_K[K];
  const name=$('#sdName').value.trim(), from=$('#sdFrom').value, to=$('#sdTo').value||from;
  if(!name){toast('ใส่ชื่อวันก่อนครับ',true);return}
  if(!from){toast('เลือกวันที่ก่อนครับ',true);return}
  if(to<from){toast('วันสุดท้ายต้องไม่ก่อนวันแรก',true);return}
  if(sdSpan(from,to)>31){toast('ยาวได้ไม่เกิน 32 วัน',true);return}
  const mEl=document.querySelector('#sdMult .chip.on'), mult=K==='pay'?(+(mEl?mEl.dataset.sv:2)||2):null;
  const brs=K==='order'?[...document.querySelectorAll('#sdBr .chip.on')].map(c=>c.dataset.sv).filter(Boolean):[];
  const body={name,kind:K,day_from:from,day_to:to,pay_multiplier:mult,pay_scope:K==='office'?'office':K==='pay'?'store':'all',
    order_rate_group:K==='order'?2:null,order_branches:K==='order'&&brs.length?brs:null,note:$('#sdNote').value.trim()||null,updated_by:S.user.username};
  body.pay_status=sdPayStatus(old,body);
  /* สรุปผลให้เห็นก่อนบันทึก */
  const fx=K==='office'?'🏢 พนักงานสาขา OFFICE ได้หยุด นับเป็นวันทำงาน · หน้าร้านทำงานปกติ'
    :K==='pay'?`💰 หน้าร้านได้ค่าแรง ×${mult} · วันนั้นห้ามหยุด · ออฟฟิศทำงานปกติ`
    :`📦 สั่งของแบบ ส–อา · ${brs.length?brs.map(brLabel).join('·'):'ทุกสาขา'}`;
  let msg=`${D.ic} ${D.tl}\n${name} · ${sdWhen(body)}\n${fx}`;
  if(K!=='order')msg+='\n(รอยืนยันในระบบเงินเดือนก่อนถึงจะมีผล)';
  if(body.pay_status==='pending'&&from<dkey(new Date()))msg+='\n\n⚠️ มีวันที่ผ่านมาแล้ว — ถ้ายืนยันในระบบเงินเดือน สลิปของงวดนั้นจะเปลี่ยน';
  if(!confirm(msg+'\n\nบันทึกไหม?'))return;
  const btn=$('#sdSave'); if(btn.disabled)return; btn.disabled=true;
  try{
    if(old){
      /* แก้พร้อมกันหลายเครื่อง: เขียนเฉพาะถ้ายังเป็นฉบับที่เปิดดูอยู่ */
      const r=await api('PATCH','cal_special_days?id=eq.'+old.id+'&updated_at=eq.'+encodeURIComponent(old.updated_at),body,'return=representation');
      if(!r||!r.length){toast('มีคนแก้วันนี้พร้อมกัน — โหลดใหม่แล้วลองอีกครั้งครับ',true);await loadDays();closeModal();show(S.tab);return}
    }else{
      await api('POST','cal_special_days',Object.assign({created_by:S.user.username,created_name:S.user.display_name||S.user.username},body),'return=minimal');
    }
    S.sdk=K; LS.set('jjcal_sdk',K);
    await loadDays(); closeModal(); toast('บันทึกแล้ว ✓'); S.dayYear=+from.slice(0,4); show(S.tab);
  }catch(e){ toast(sdErr(e),true); }
  finally{ if(btn.isConnected)btn.disabled=false; }
}
async function cancelDay(id){
  const x=(S.days||[]).find(r=>r.id===id); if(!x)return;
  const wasPaid=!!(x.pay_snapshot||x.pay_status==='confirmed');
  if(!confirm(`ยกเลิก "${x.name}" (${sdWhen(x)})?`+(wasPaid?'\n\n💰 วันนี้ระบบเงินเดือนยืนยันไปแล้ว — จะต้องไปกดยืนยันเอาออกในหน้า 🎌 ของระบบเงินเดือนอีกครั้ง':'')))return;
  try{
    await api('PATCH','cal_special_days?id=eq.'+x.id,{cancelled:true,pay_status:wasPaid?'pending':'none',updated_by:S.user.username},'return=minimal');
    await loadDays(); closeModal(); toast('ยกเลิกแล้ว'); show(S.tab);
  }catch(e){ toast(sdErr(e),true); }
}
async function sdHistory(id){
  let rows=[];
  try{ rows=await sel('cal_special_days_log','select=at,op,by_user,before,after&day_id=eq.'+id+'&order=at.desc&limit=50')||[]; }
  catch(e){ toast('อ่านประวัติไม่ได้',true); return; }
  const F={name:'ชื่อ',kind:'ปฏิทิน',day_from:'ตั้งแต่',day_to:'ถึง',pay_multiplier:'ค่าแรง',pay_status:'สถานะเงินเดือน',order_rate_group:'ขายดี',order_branches:'สาขา',note:'หมายเหตุ',cancelled:'ยกเลิก'};
  const show1=(v,k)=>v==null?'—':k==='kind'?(SD_K[v]?SD_K[v].ic+' '+SD_K[v].t:String(v)):Array.isArray(v)?v.join('·'):String(v);
  openModal(`<h3>🕘 ประวัติการแก้</h3>${rows.length?rows.map(r=>{
    const a=r.after||{},b=r.before||{};
    const ch=r.op==='INSERT'?'สร้าง':Object.keys(F).filter(k=>JSON.stringify(a[k])!==JSON.stringify(b[k])).map(k=>`${F[k]}: ${esc(show1(b[k],k))} → <b>${esc(show1(a[k],k))}</b>`).join('<br>')||'—';
    const t=new Date(r.at);
    return `<div class="sdcard" style="border-left-color:#8C8278"><div class="when">${thDate(t,true)} ${thTime(t)} น. · ${esc(nameOf(r.by_user||'?'))}</div><div class="sdnote" style="margin:0">${ch}</div></div>`;
  }).join(''):'<div class="empty">ยังไม่มีประวัติ</div>'}<div class="acts"><button class="btn gh" onclick="closeModal()">ปิด</button></div>`);
}

/* ---------- 📋 เลือกจากวันหยุดราชการ (ใส่ลงปฏิทินที่เปิดอยู่ · ตั้งต้นไม่ติ๊กอะไร — เจ้าของเลือกเองทุกวัน) ---------- */
function openPresetSheet(K){
  if(!isBoss()||!S.daysReady||!S.sdKindCol)return;
  K=SD_K[K]?K:(SD_K[S.sdk]?S.sdk:'office'); const D=SD_K[K], y=S.dayYear;
  const have=(n,f)=>(S.days||[]).some(x=>sdKind(x)===K&&(x.day_from===y+'-'+f||(x.name===n&&x.day_from.slice(0,4)===String(y))));
  openModal(`<h3>📋 ใส่ลง${D.tl} ปี ${y+543}</h3>
    <p class="xs mut" style="margin:0 0 6px;line-height:1.6">ติ๊กวันที่จะใส่ลง<b>${D.ic} ${D.tl}</b>${K==='pay'?' (ใส่เป็น ×2 — แก้ทีละวันได้ภายหลัง)':K==='order'?' (ทุกสาขา — แก้ทีละวันได้ภายหลัง)':''}<br>
    วันพระ · ลอยกระทง · ตรุษจีน · วันหยุดชดเชย เลื่อนทุกปี — ใส่เองด้วยปุ่ม ${D.add}</p>
    <div style="margin:4px 0 6px"><button type="button" class="btn gh sm" onclick="document.querySelectorAll('.psOn:not(:disabled)').forEach(c=>c.checked=true)">☑ ติ๊กทุกวันที่ยังไม่มี</button></div>
    <div id="psList">${SD_PRESET.map(([a,b,n],i)=>{
      const f=y+'-'+a, t=y+'-'+b, h=have(n,a);
      return `<label class="psrow${h?' have':''}"><input type="checkbox" class="psOn" data-i="${i}" ${h?'disabled':''}>
        <div>${esc(n)}<div class="d">${sdWhen({day_from:f,day_to:t})}${h?' · มีในปฏิทินนี้แล้ว':''}</div></div></label>`;
    }).join('')}</div>
    <div class="acts"><button class="btn" id="psGo" onclick="savePreset('${K}')">＋ ใส่วันที่ติ๊กไว้</button><button class="btn gh" onclick="closeModal()">ปิด</button></div>`);
}
async function savePreset(K){
  if(!SD_K[K])return;
  const y=S.dayYear, btn=$('#psGo'), D=SD_K[K]; if(btn.disabled)return;
  const pick=[...document.querySelectorAll('.psOn:checked:not(:disabled)')].map(c=>+c.dataset.i);
  if(!pick.length){toast('ยังไม่ได้ติ๊กวันไหนเลย',true);return}
  if(!confirm(`ใส่ ${pick.length} วัน ลง${D.tl}`+(K!=='order'?'\n(ต้องไปกดยืนยันในระบบเงินเดือนอีกที ถึงจะมีผล)':'')+'\nบันทึกไหม?'))return;
  btn.disabled=true; let ok=0; const bad=[];
  for(const i of pick){
    const [a,b,n]=SD_PRESET[i];
    try{
      await api('POST','cal_special_days',{name:n,kind:K,day_from:y+'-'+a,day_to:y+'-'+b,pay_multiplier:K==='pay'?2:null,
        pay_scope:K==='office'?'office':K==='pay'?'store':'all',pay_status:K==='order'?'none':'pending',
        order_rate_group:K==='order'?2:null,order_branches:null,created_by:S.user.username,created_name:S.user.display_name||S.user.username,updated_by:S.user.username},'return=minimal');
      ok++;
    }catch(e){ bad.push(n+' — '+sdErr(e)); }
  }
  await loadDays(); closeModal(); show(S.tab);
  if(bad.length)alert('ใส่ได้ '+ok+' วัน · ไม่สำเร็จ '+bad.length+' วัน:\n'+bad.join('\n'));
  else toast('ใส่แล้ว '+ok+' วัน ✓');
}

/* ---------- boot ---------- */
async function startApp(){
  $('#login').style.display='none';$('#app').style.display='block';
  $('#mineBtn').classList.toggle('on',S.mine);
  fLoad();
  applyUser(S.user);   // สาขาที่เห็น (apps.calendar._br) — อ่านจากข้อมูลบัญชีล่าสุดที่เพิ่งตรวจกับ pnl_users
  const lock=SCOPE?` · <span title="เห็นเฉพาะ ${esc(SCOPE.map(brLabel).join(', '))}">🔒 ${esc(SCOPE.join(','))}</span>`:'';
  $('#hdUser').innerHTML=`<span id="rtDot" title="สถานะการเชื่อมต่อสด">⚪</span>👤 ${esc(S.user.display_name||S.user.username)}${lock} · <a class="hintlink" href="javascript:hardReload()">🔄 โหลดใหม่</a> · <a class="hintlink" href="javascript:logout()">ออก</a>`;
  await loadBranches();
  if(SCOPE&&!myBranches().length){   // ได้สิทธิ์เฉพาะสาขาที่ไม่มีในปฏิทิน — บอกให้ชัด ไม่โชว์ปฏิทินว่าง ๆ
    ['#brSeg','#mineBtn','.tabbar','#fab'].forEach(s=>{const x=$(s);if(x)x.style.display='none'});
    $('main').innerHTML=`<div class="card" style="max-width:520px;margin:30px auto;text-align:center">
      <h3>🔒 ยังไม่มีสาขาที่เปิดให้บัญชีนี้</h3>
      <p class="sm mut" style="margin:0">บัญชี <b>${esc(S.user.display_name||S.user.username)}</b> ได้สิทธิ์เห็นเฉพาะ ${esc(SCOPE.join(', '))} ซึ่งยังไม่มีในปฏิทิน — ให้ผู้ดูแลระบบตั้งสาขาที่หน้า 🔑 JJ Access</p>
      <p style="margin:14px 0 0"><a class="hintlink" href="javascript:logout()">เข้าด้วยบัญชีอื่น</a></p></div>`;
    return;
  }
  await Promise.all([loadUsers(),loadEvents(true),loadToken()]);
  loadDays().then(()=>{ if(S.tab!=='sync')show(S.tab); });   // วันพิเศษโหลดแยก ไม่ขวางการเปิดปฏิทิน (ยังไม่รัน SQL ก็เปิดได้)
  const t0=LS.get('jjcal_tab','month');
  show(['month','agenda','days','sync'].includes(t0)?t0:'month');   // เปิดมาที่หน้าเดิมก่อนรีเฟรช
  notifTick();setInterval(notifTick,30000);
  rtStart();
  document.addEventListener('visibilitychange',async()=>{
    if(!document.hidden&&!$('#modalWrap').classList.contains('on')){await Promise.all([loadDays(),loadEvents(true)]);if(S.tab!=='sync')show(S.tab)}
  });
}
(async function init(){
  const sess=LS.get('jjcal_sess',null);
  /* JJ Gate — เข้าทางลิงก์ตรง = ต้องใส่รหัสใหม่ */
  if(sess&&sess.username&&JJGate.ok(sess.username)){
    /* ตรวจบัญชีกับ pnl_users ทุกครั้งที่เปิด/รีเฟรช (2026-09-29) — เดิมเชื่อ session ในเครื่องอย่างเดียว
       ทำให้คนที่ถูกกด 🚪 ออกงาน / ลบบัญชี / ลดระดับ ใน JJ Access ยังใช้ปฏิทินต่อได้ถ้าเปิดแท็บค้างไว้
       เน็ตล่ม/อ่านไม่ได้ = ใช้ข้อมูลเดิมไปก่อน (แอพโหลดนัดไม่ได้อยู่ดี จะขึ้นข้อผิดพลาดของมันเอง) */
    try{
      const rows=await sel('pnl_users',`select=*&username=eq.${encodeURIComponent(sess.username)}&limit=1`);
      const u=rows&&rows[0];
      if(!u||u.active===false||(u.status!=null&&u.status!=='active')){
        localStorage.removeItem('jjcal_sess');
        $('#login').style.display='block';
        toast(u?'บัญชีนี้ถูกปิดการใช้งาน — แจ้งผู้ดูแลระบบครับ':'ไม่พบบัญชีนี้แล้ว — เข้าสู่ระบบใหม่ครับ',true);
        return;
      }
      S.user={username:u.username,display_name:u.display_name,role:u.role,apps:u.apps||null};   // ระดับ/ชื่อ/สิทธิ์ล่าสุดจากฐานข้อมูล (admin แก้สาขาที่เห็นแล้วมีผลตอนรีเฟรช)
      LS.set('jjcal_sess',S.user);
    }catch(e){ S.user=sess; }
    startApp();
  }
  else{
    $('#login').style.display='block';
    if(sess&&sess.username)JJGate.note(sess.username,'liUser','liPass');
  }
})();

/* ============================================================
   ลากหน้าลง = รีเฟรช (pull-to-refresh) — ใช้ได้บนมือถือทุกแบบ
   จำเป็นเพราะแอปที่ "เพิ่มไปยังหน้าจอโฮม" (PWA) ไม่มีปุ่ม/ท่ารีเฟรชของเบราว์เซอร์
   แตะที่ยอดสุดของหน้าแล้วลากลงเกิน 70px → ปล่อยนิ้ว = โหลดหน้าใหม่
   ============================================================ */
(function(){
  if(!('ontouchstart' in window))return;              // เฉพาะจอสัมผัส
  var TH=70, MAX=110, y0=0, dy=0, pulling=false, ready=false, bar=null;

  function el(){
    if(bar)return bar;
    bar=document.createElement('div');
    bar.setAttribute('aria-hidden','true');
    bar.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;display:flex;'+
      'align-items:center;justify-content:center;pointer-events:none;'+
      'height:0;overflow:hidden;transition:none;'+
      'font:600 13px/1.2 "Prompt","Sarabun",system-ui,sans-serif;color:#F2CF7A;'+
      'background:linear-gradient(180deg,rgba(163,27,36,.95),rgba(163,27,36,0));';
    bar.innerHTML='<span id="__ptrTxt">ลากลงเพื่อรีเฟรช</span>';
    document.body.appendChild(bar);
    return bar;
  }
  function atTop(){
    var d=document.scrollingElement||document.documentElement;
    return (window.pageYOffset||d.scrollTop||0)<=0;
  }
  /* ลากอยู่ในกล่องที่เลื่อนได้เอง (ตาราง/ลิสต์) ไม่นับ */
  function inScrollable(node){
    for(var n=node;n&&n!==document.body;n=n.parentElement){
      var st=getComputedStyle(n), oy=st.overflowY;
      if((oy==='auto'||oy==='scroll')&&n.scrollHeight>n.clientHeight&&n.scrollTop>0)return true;
    }
    return false;
  }
  /* โหมด kiosk (แท็บเล็ตหน้าร้านให้ลูกค้ากด) ห้ามรีเฟรช — คะแนนที่กดค้างไว้จะหาย */
  function kiosk(){
    return document.body.classList.contains('kiosk') ||
           /[?&]kiosk=/.test(location.search);
  }
  document.addEventListener('touchstart',function(e){
    if(kiosk()){pulling=false;return;}
    if(e.touches.length!==1||!atTop()||inScrollable(e.target)){pulling=false;return;}
    y0=e.touches[0].clientY; dy=0; pulling=true; ready=false;
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(!pulling)return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0||!atTop()){ if(bar){bar.style.height='0';} return; }
    if(e.cancelable)e.preventDefault();                // กันหน้าเด้งตามนิ้ว
    var h=Math.min(dy*0.5,MAX), b=el();
    b.style.height=h+'px';
    ready = dy>TH;
    var t=b.querySelector('#__ptrTxt');
    if(t)t.textContent = ready ? 'ปล่อยเพื่อรีเฟรช' : 'ลากลงเพื่อรีเฟรช';
  },{passive:false});

  document.addEventListener('touchend',function(){
    if(!pulling)return; pulling=false;
    var b=el();
    if(ready){
      b.style.height='44px';
      var t=b.querySelector('#__ptrTxt'); if(t)t.textContent='กำลังโหลด…';
      setTimeout(function(){ location.reload(); },120);
    }else{
      b.style.transition='height .2s'; b.style.height='0';
      setTimeout(function(){ b.style.transition='none'; },220);
    }
  },{passive:true});
})();
</script>
