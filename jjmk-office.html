<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>ออฟฟิศ AI — จริงใจหมูกระทะ</title>
<meta name="theme-color" content="#d8d1c6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23A31B24'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle'%3E%F0%9F%8F%A2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ออฟฟิศ AI — ผังออฟฟิศสามมิติ (canvas) + HUD ลอยตามมุมจอ + แผงรายงาน agent ด้านขวา (มือถือ = ล่าง) */
:root{
  --ground:#d8d1c6; --ground2:#cbc3b6;
  --card:#fffdf9; --card2:#f5efe6; --line:#e6ddd0;
  --ink:#2b211c; --muted:#7d6e62;
  --red:#c62127; --red2:#8e1419; --gold:#c9962b; --gold2:#f2cf7a;
  --ok:#2f8f5b; --warn:#d98a16; --crit:#c62127; --info:#4a78b5; --err:#8a7f76;
  --display:'Prompt','Noto Sans Thai',system-ui,sans-serif;
  --body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --shadow:0 6px 22px rgba(60,40,25,.14),0 1px 3px rgba(60,40,25,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(120% 90% at 50% 40%,var(--ground) 0%,var(--ground2) 100%);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#scene3{position:fixed;inset:0;width:100%;height:100%;display:block}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.drag{cursor:grabbing}
#scene.hot{cursor:pointer}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.hud{position:fixed;z-index:5;display:flex;gap:10px;align-items:flex-start}
.tl{top:calc(14px + env(safe-area-inset-top,0px));left:16px;flex-wrap:wrap;max-width:calc(100% - 420px)}
.tr{top:calc(14px + env(safe-area-inset-top,0px));right:16px;flex-direction:column;align-items:flex-end}
.br{bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px}
.bl{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.me{display:flex;gap:12px;align-items:center;padding:10px 14px 10px 10px;min-width:0}
.ava{position:relative;width:52px;height:52px;flex:none;border-radius:50%;background:linear-gradient(145deg,var(--red),var(--red2));border:3px solid var(--gold2);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:19px}
.ava b{position:absolute;left:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid var(--card);font-family:var(--body);font-weight:700}
.meT{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.meT h1{margin:0;font-family:var(--display);font-weight:500;font-size:18px;white-space:nowrap}
.meT h1 em{font-style:normal;color:var(--red)}
.stat{display:inline-flex;gap:5px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.coin{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe39a,var(--gold) 70%);box-shadow:inset 0 0 0 1.5px #a8781c}
.stat.c{color:#8a6414;font-weight:700}
.xp{margin-top:6px;height:6px;border-radius:6px;background:var(--card2);overflow:hidden;width:100%}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:6px;transition:width .5s}
.lv{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lv .who{color:var(--ink);font-weight:600}
.lv button{color:var(--red);font-weight:600;font-size:12px;padding:2px 0;min-height:24px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;font-weight:600;min-height:44px;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#a59a90;flex:none}
.chip .dot.live{background:#2f8f5b;box-shadow:0 0 0 3px rgba(47,143,91,.18)}
.chip .dot.busy{background:var(--warn);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.35}}
.chip small{color:var(--muted);font-weight:500}
.bell{position:relative;width:52px;height:52px;display:grid;place-items:center}
.bell svg{width:22px;height:22px}
.badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.mis{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;width:300px;text-align:left}
.ring{width:40px;height:40px;flex:none;position:relative}
.ring svg{width:40px;height:40px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.mis h2{margin:0;font-family:var(--display);font-weight:500;font-size:16px}
.mis small{color:var(--muted);font-size:12.5px}
.mis .chev{margin-left:auto;color:var(--muted)}
.drop{width:340px;max-height:min(62vh,560px);overflow:auto;padding:8px}
.drop h3{margin:6px 8px 6px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.drop .empty{padding:10px;color:var(--muted)}
.mrow{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 8px;border-radius:12px;text-align:left}
.mrow:hover{background:var(--card2)}
.mrow .ic{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:15px}
.mrow p{margin:0;font-size:14px;line-height:1.4}
.mrow small{color:var(--muted);font-size:12px}
.mrow.done p{text-decoration:line-through;color:var(--muted)}
.sev{width:4px;align-self:stretch;border-radius:4px;flex:none}
.ctl{display:flex;align-items:center;padding:6px}
.ctl button{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#4b3d34}
.ctl button:hover{background:var(--card2)}
.ctl svg{width:20px;height:20px}
.ctl .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.ctl .spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meet{display:flex;align-items:center;gap:10px;padding:12px 18px 12px 12px;background:linear-gradient(145deg,var(--red),var(--red2));color:#fff;min-height:52px;text-align:left}
.meet .k{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.meet b{font-family:var(--display);font-weight:500;font-size:16px;display:block}
.meet small{opacity:.8;font-size:12px}
.meet:disabled{opacity:.6;cursor:default}
#sheet{position:fixed;z-index:8;top:calc(12px + env(safe-area-inset-top,0px));right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:410px;max-width:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden;transform:translateX(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
.shHead{padding:18px 18px 14px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line)}
.tile{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.shHead h2{margin:0;font-family:var(--display);font-weight:500;font-size:20px;line-height:1.25}
.shHead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.x{margin-left:auto;align-self:flex-start;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--muted);flex:none}
.x:hover{background:var(--card2)}
.shBody{overflow:auto;padding:14px 18px 22px;display:flex;flex-direction:column;gap:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12.5px;font-weight:700}
.pill.crit{background:#fbe3e3;color:#a31b20}.pill.warn{background:#fdf0d9;color:#8f5a08}.pill.ok{background:#e1f2e8;color:#1f6b42}.pill.err,.pill.lock,.pill.load{background:#eee8e1;color:#6b5f56}
.say{background:var(--card2);border-radius:4px 16px 16px 16px;padding:12px 14px;line-height:1.6;font-size:14.5px}
.say b{font-weight:700}
.sec h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.item{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.item+.item{margin-top:8px}
.item .tx{min-width:0;flex:1}
.item p{margin:0;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.item small{display:block;color:var(--muted);font-size:13px;line-height:1.55;margin-top:3px;overflow-wrap:anywhere}
.item .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.item.done{opacity:.6}
.item.done p{text-decoration:line-through}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none}
.btn.sm{min-height:40px;padding:0 14px;font-size:13.5px}
.btn.p{background:var(--ink);color:#fff}
.btn.g{background:var(--card2);color:var(--ink)}
.btn.r{background:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.can{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.can li{display:flex;gap:8px;line-height:1.5}
.can li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:8px;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--card2);padding:3px 8px;border-radius:7px}
.mode{font-size:13px;color:var(--muted);line-height:1.55}
#veil{position:fixed;inset:0;z-index:9;background:rgba(43,33,28,.38);display:grid;place-items:center;padding:16px}
.modal{width:min(580px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px}
.modal h2{margin:0 0 4px;font-family:var(--display);font-weight:500;font-size:22px;text-wrap:balance}
.modal .sub{color:var(--muted);margin:0 0 14px}
.brow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.brow .tile{width:36px;height:36px;border-radius:10px;font-size:17px}
.brow p{margin:0;line-height:1.5}
.brow small{color:var(--muted)}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;align-items:center}
.lgrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.lgrow label{font-size:13px;color:var(--muted);font-weight:600}
.lgrow select{font:inherit;font-size:16px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 10px;max-width:100%;flex:1;min-width:0}
#toast{position:fixed;z-index:10;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .g{color:var(--gold2)}
@media (max-width:980px){.tl{max-width:calc(100% - 90px)}.tl .chip{display:none}.mis{width:auto;padding:8px}.mis .mt,.mis .chev{display:none}}
@media (max-width:760px){
  .me{padding:8px 12px 8px 8px;gap:10px}
  .ava{width:42px;height:42px;font-size:16px}
  .meT h1{font-size:16px}
  .meT{gap:8px}
  .drop{position:fixed;left:16px;right:16px;width:auto;top:calc(130px + env(safe-area-inset-top,0px))}
  .ctl .opt{display:none}
  .ctl button{width:44px;height:44px}
  #sheet{top:auto;left:8px;right:8px;width:auto;max-width:none;height:78%;transform:translateY(110%);bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  #sheet.on{transform:none}
  .meet small{display:none}
}
@media (prefers-reduced-motion:reduce){#sheet,#toast,.xp i{transition:none}}
</style>
<style>
/* JJ Gate — ช่องล็อกอินบนมือถือต้องไม่ต่ำกว่า 16px ไม่งั้น iPhone จะซูมหน้าจอเองตอนกดพิมพ์ */
@media (max-width:640px){
  #lgU,#lgP,#liUser,#liPass{font-size:16px !important}
  .jjgate-note{font-size:13px !important}
}
</style>
<script>
/* ============================================================
   JJ Gate — ด่านกันคนเข้าทางลิงก์ตรง (เจ้าของสั่ง 2026-09-21)
   · เข้าจากหน้าศูนย์รวมแอพ (index.html) หลังล็อกอิน = ผ่านได้เลยตามสิทธิ์
   · เข้าด้วย URL ตรง / ลิงก์ที่ถูกส่งต่อ = ต้องใส่รหัสผ่านใหม่ทุกครั้ง
   ใบผ่านมี 2 แบบ:
   · ใบผ่านครั้งเดียว (localStorage 'jjhub_pass') หน้าศูนย์รวมแอพออกให้ตอนกดไอคอน
     อายุ 2 นาที · ผูกกับชื่อผู้ใช้ + ชื่อแอพ · ใช้แล้วลบทิ้งทันที
   · ใบผ่านประจำแท็บ (sessionStorage) — รีเฟรช/กดลากลงยังอยู่ แต่แท็บใหม่ไม่มี
   *** บล็อกนี้เหมือนกันทุกแอพ (ต่างแค่ชื่อแอพบรรทัดแรก) แก้ที่ไหนต้องแก้ให้ครบทุกไฟล์ ***
   ============================================================ */
window.JJGate=(function(){
  var APP='office';                 /* ชื่อแอพนี้ — ต้องตรงกับ data-app ในหน้าศูนย์รวมแอพ */
  var TAB='jjgate_'+APP, TICKET='jjhub_pass', ALT='jjsso_ticket';
  var IDLE=30*60*1000;               /* ทิ้งไว้เกิน 30 นาทีแล้วรีเฟรช = ยืนยันรหัสใหม่ (กติกาเดียวกับ P&L) */
  var TTL=2*60*1000;                 /* ใบผ่านจากหน้าศูนย์รวมแอพ อายุ 2 นาที */
  function j(s){ try{ return JSON.parse(s||'null'); }catch(e){ return null; } }
  function readTab(){ try{ return j(sessionStorage.getItem(TAB)); }catch(e){ return null; } }
  function grant(user){ try{ sessionStorage.setItem(TAB,JSON.stringify({u:user||'',t:Date.now()})); }catch(e){} }
  /* ใช้ใบผ่านแล้วต้องลบให้เกลี้ยงทั้ง 2 แบบ ไม่งั้นใบที่เหลือจะถูกเอาไปเปิดแท็บใหม่ได้อีก
     (ลบเฉพาะใบที่จ่าหน้าถึงแอพนี้ — ใบของแอพอื่นต้องไม่โดนลบไปด้วย) */
  function burn(){
    try{ localStorage.removeItem(TICKET); }catch(e){}
    var o=null; try{ o=j(localStorage.getItem(ALT)); }catch(e){}
    if(!o||!o.app||o.app===APP){ try{ localStorage.removeItem(ALT); }catch(e){} }
  }
  function takeTicket(){
    var t=null; try{ t=j(localStorage.getItem(TICKET)); }catch(e){}
    if(t&&t.app===APP&&t.u&&t.exp&&t.exp>=Date.now()){ burn(); return t; }
    /* รับใบผ่านอีกแบบของหน้าศูนย์รวมแอพด้วย (jjsso_ticket — ระบบเดียวกับที่ JJ Social/ซ่อมบำรุงใช้) */
    var o=null; try{ o=j(localStorage.getItem(ALT)); }catch(e){}
    if(o&&o.u&&(!o.app||o.app===APP)&&(Date.now()-(+o.t||0))<TTL){ burn(); return {app:APP,u:o.u,exp:Date.now()+TTL}; }
    return null;
  }
  /* เปิดจากไอคอนที่ติดตั้งไว้บนหน้าจอมือถือ (PWA) = เครื่องของเจ้าตัวเอง ไม่ใช่ลิงก์ที่ถูกส่งต่อ → ผ่านได้
     (ลิงก์ที่ส่งต่อทางแชทจะเปิดในเบราว์เซอร์ธรรมดา ไม่ใช่โหมดนี้ — ยังโดนถามรหัสเหมือนเดิม) */
  function installed(){
    try{
      if(navigator.standalone===true)return true;                                   /* iPhone/iPad */
      return !!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches
             || window.matchMedia&&window.matchMedia('(display-mode: fullscreen)').matches);  /* Android */
    }catch(e){ return false; }
  }
  /* เรียกก่อนจะยอมรับ session ที่ค้างอยู่ในเครื่อง — false = ให้แสดงหน้าล็อกอิน
     ผ่านได้ 3 ทาง: ใบผ่านประจำแท็บ (รวมถึงการดึงหน้าลงรีเฟรช) · ใบผ่านจากหน้าศูนย์รวมแอพ · เปิดจากไอคอนบนมือถือ */
  function ok(user){
    var g=readTab();
    if(g&&(Date.now()-(g.t||0))<IDLE&&(!user||g.u===user)){ grant(g.u||user); return true; }
    var t=takeTicket();
    if(t&&(!user||t.u===user)){ grant(t.u); return true; }
    if(installed()){ grant(user||''); return true; }
    return false;
  }
  /* ออกใบผ่านก่อนพาไปอีกแอพ (หน้าศูนย์รวมแอพ + ลิงก์ข้ามแอพ) — ไม่รู้ชื่อผู้ใช้ = ไม่ออกให้ */
  function issue(app,user){
    if(!app||!user)return false;
    try{ localStorage.setItem(TICKET,JSON.stringify({app:app,u:user,exp:Date.now()+TTL})); return true; }catch(e){ return false; }
  }
  /* แปะข้อความ "เปิดจากลิงก์ตรง" บนหน้าล็อกอินของแอพ + เติมชื่อผู้ใช้ให้ เหลือแค่พิมพ์รหัส */
  function note(user,userId,passId){
    try{
      var u=userId?document.getElementById(userId):null, pw=passId?document.getElementById(passId):null;
      if(u&&user)u.value=user;
      /* หน้าล็อกอินมาตรฐาน (JJ Login) มีแถบ 🔒 ของตัวเองอยู่แล้ว */
      if(window.JJLogin&&document.getElementById('jjlgLock')){
        JJLogin.lock('<b>เปิดจากลิงก์ตรง</b> — ยืนยันรหัสผ่านอีกครั้งเพื่อความปลอดภัย<br>'+
          '<span style="opacity:.85">เข้าจาก<a href="index.html" style="color:inherit;font-weight:600"> หน้าศูนย์รวมแอพ </a>จะไม่ต้องกรอกซ้ำ</span>');
        if(pw)setTimeout(function(){ try{ pw.focus(); }catch(e){} },90);
        return;
      }
      var card=(u&&u.closest)?u.closest('.logincard,.lgc,.card,#login,#loginWrap'):null;
      if(card&&!card.querySelector('.jjgate-note')){
        var d=document.createElement('div');

const it=(id,sev,t,d,extra)=>Object.assign({id,sev,t,d:d||''},extra||{});
const list=(arr,n)=>arr.slice(0,n).join(' · ')+(arr.length>n?` · และอีก ${arr.length-n}`:'');

async function chkPnl(){
  const T=bkk(0),Y=bkk(-1),from=bkk(-7);
  let brs=(await opt(sel('pnl_branches','select=*&order=sort')))||[];
  brs=brs.filter(b=>b&&b.code&&!b.is_central);
  if(!brs.length)brs=[{code:'JJRD',name:'รัชดา'},{code:'JJLP',name:'ลาดพร้าว'}];
  brs=brs.filter(b=>brOK('pnl',b.code));
  const F=['sales_pos','deposit','cash_drawer','transfer_total','reserve_acct'];
  const cols='branch,d,'+F.map(f=>f+'_am,'+f+'_pm').join(',');
  const m0=T.slice(0,8)+'01';const lo=m0<from?m0:from;
  const rows=await sel('pnl_income_daily',`select=${cols}&d=gte.${lo}&d=lte.${Y}&limit=5000`);
  const n=v=>Number(v)||0, has=r=>F.some(f=>n(r[f+'_am'])||n(r[f+'_pm']));
  const out=[];
  for(const b of brs){
    const mine=rows.filter(r=>r.branch===b.code);
    const ok=new Set(mine.filter(has).map(r=>r.d));
    const miss=[];for(let d=from;d<=Y;d=addD(d,1))if(!ok.has(d))miss.push(d);
    const nm=b.name||brName(b.code);
    if(miss.includes(Y))out.push(it(`p_miss_${b.code}_${Y}`,'crit',`${nm} ยังไม่ลงยอดขายเมื่อวาน (${thD(Y)})`,
      miss.length>1?`ย้อนหลัง 7 วันยังขาด ${miss.length} วัน: ${list(miss.map(thD),5)}`:'กำไรเดือนนี้จะต่ำกว่าจริงจนกว่าจะลงครบ',{br:b.code}));
    else if(miss.length)out.push(it(`p_miss_${b.code}_${miss[miss.length-1]}`,'warn',`${nm} ยังไม่ลงยอดขาย ${miss.length} วัน`,list(miss.map(thD),5),{br:b.code}));
  }
  // ยอดขายหน้าร้านเดือนนี้ (ไม่รวม VAT) + ค่าหมวดอาหาร
  if(m0<=Y){
    const exp=await opt(sel('pnl_expense_daily',`select=branch,supplier_id,amount&d=gte.${m0}&d=lte.${Y}&limit=10000`));
    const sups=await opt(sel('pnl_suppliers','select=id,category'));
    const cat={};(sups||[]).forEach(s=>cat[s.id]=s.category||'อาหาร');
    for(const b of brs){
      const rev=rows.filter(r=>r.branch===b.code&&r.d>=m0).reduce((s,r)=>s+(n(r.sales_pos_am)+n(r.sales_pos_pm))*100/107,0);
      if(!rev)continue;
      let txt=`ยอดขายหน้าร้าน (POS ไม่รวม VAT) ${thD(m0)}–${thD(Y)}`;
      if(exp&&sups){const food=exp.filter(e=>e.branch===b.code&&(cat[e.supplier_id]||'อาหาร')==='อาหาร').reduce((s,e)=>s+n(e.amount),0);
        txt+=` · ค่าซัพหมวดอาหาร ฿${fmt(food)} (${(food/rev*100).toFixed(1)}% ของยอดขาย)`;}
      out.push(it(`p_rev_${b.code}`,'info',`${b.name||brName(b.code)} เดือนนี้ ฿${fmt(rev)}`,txt+' · ยังไม่รวม Grab/LINE MAN และค่าใช้จ่ายอื่น',{br:b.code}));
    }
  }
  return out;
}

const INV_SENDING='กำลังส่ง',INV_CANCEL='ยกเลิก';
const invBr=no=>(String(no||'').match(/^[A-Za-z]+/)||[''])[0].toUpperCase();
async function chkInvoice(){
  const out=[];
  const [sending,failed,nasq,st]=await Promise.all([
    sel('inv_invoices',`select=bill_no,status,email_sent_at,updated_at&email_status=eq.${enc(INV_SENDING)}&limit=500`),
    sel('inv_invoices',`select=bill_no,status,issued_at&email_status=in.(${enc('"ส่งไม่สำเร็จ"')},${enc('"ผิดพลาด"')})&limit=2000`),
    sel('inv_invoices','select=bill_no&nas_path=is.null&limit=2000'),
    opt(sel('inv_settings','select=key,value&key=in.(gas_check_last,gas_check_info,nas_sync_last,nas_sync_info)'))]);
  const S={};(st||[]).forEach(r=>S[r.key]=r.value);
  const mine=v=>brOK('invoice',invBr(v.bill_no));
  const stuck=sending.filter(v=>v.status!==INV_CANCEL&&mine(v)&&(ageMin(v.email_sent_at||v.updated_at)||1e9)>40);
  const gasAge=ageMin(S.gas_check_last),gasBad=/^ผิดพลาด/.test(S.gas_check_info||'')||gasAge==null||gasAge>15;
  if(stuck.length)out.push(it('i_stuck_'+stuck.map(v=>v.bill_no).sort().join(','),'warn',`บิลค้าง "กำลังส่ง" เกิน 40 นาที ${stuck.length} ใบ`,
    list(stuck.map(v=>v.bill_no),6)+(gasBad?` · ตัวตรวจอีเมล (Apps Script) ${gasAge==null?'ยังไม่เคยรายงานตัว':'เงียบไป '+fmt(gasAge)+' นาที'} — กด 🔎 ตรวจสถานะอีเมล ในหน้าตั้งค่าของแอพ`:'')));
  const since=Date.now()-14*864e5;
  const fl=failed.filter(v=>v.status!==INV_CANCEL&&mine(v));
  const recent=fl.filter(v=>Date.parse(v.issued_at)>=since),old=fl.length-recent.length;
  if(recent.length)out.push(it('i_fail_'+recent.length+'_'+bkk(0),'warn',`อีเมลส่งไม่ถึงลูกค้า ${recent.length} ใบ (14 วันล่าสุด)`,
    list(recent.map(v=>v.bill_no),6)+' · ดูในแท็บ ⚠ ส่งไม่สำเร็จ'));
  if(old)out.push(it('i_fail_old','info',`ส่งไม่สำเร็จที่เก่ากว่า 14 วัน ${old} ใบ`,'ส่วนใหญ่มาจากบิลระบบเดิมที่นำเข้ามา'));
  const nq=nasq.filter(mine).length,na=ageMin(S.nas_sync_last),nasOk=na!=null&&na>=-10&&na<=30&&!/^ผิดพลาด/.test(S.nas_sync_info||'');
  if(nq&&!nasOk)out.push(it('i_nas_'+bkk(0),'warn',`ไฟล์ PDF รอเก็บลง NAS ${nq} ใบ แต่ NAS ไม่รายงานตัว`,
    na==null?'ยังไม่เคยรายงานตัว — ตรวจ Task Scheduler บน Synology':`รายงานตัวล่าสุด ${fmt(na)} นาทีที่แล้ว${/^ผิดพลาด/.test(S.nas_sync_info||'')?' · '+String(S.nas_sync_info).slice(0,80):''}`));
  else out.push(it('i_nas_ok','info',nasOk?'NAS เก็บไฟล์อยู่ปกติ':'NAS',`${nq?'รอเก็บ '+nq+' ใบ · ':''}รายงานตัวล่าสุด ${na==null?'-':fmt(na)+' นาทีที่แล้ว'}`));
  return out;
}

async function chkPayroll(){
  const out=[];
  // วันทำงานล่าสุดที่จบแล้ว: ช่วง 06:00 ของวันนั้น ถึง 05:59 ของวันถัดไป (ตาม cutoff ของระบบเงินเดือน)
  const W=bkkHour()>=6?bkk(-1):bkk(-2),W1=addD(W,1);
  const [emps,pun]=await Promise.all([
    sel('employees','select=code,nick,full_name,branch,active&active=is.true'),
    sel('punches',`select=emp_code,punch_date,punch_time&punch_date=gte.${W}&punch_date=lte.${W1}&limit=10000`)]);
  const g={};
  for(const p of pun){const t=String(p.punch_time||'').slice(0,5);const h=+t.slice(0,2);
    const inDay=(p.punch_date===W&&h>=6)||(p.punch_date===W1&&h<6);if(!inDay)continue;
    (g[p.emp_code]=g[p.emp_code]||new Set()).add(t)}
  const byCode={};emps.forEach(e=>{if(e.code!=null)byCode[String(e.code)]=e});
  const single=Object.keys(g).filter(c=>g[c].size===1&&byCode[c]&&brOK('payroll',byCode[c].branch)).map(c=>byCode[c]);
  if(single.length){const by={};single.forEach(e=>{(by[e.branch]=by[e.branch]||[]).push(e.nick||e.full_name||e.code)});
    out.push(it(`h_single_${W}_${single.length}`,'crit',`สแกนครั้งเดียว ${single.length} คน (${DW[dow(W)]} ${thD(W)})`,
      Object.keys(by).map(b=>`${brName(b)}: ${list(by[b],5)}`).join(' · ')+' — ลืมสแกนเข้าหรือออก ให้หัวหน้าลงเวลาให้ก่อนปิดงวด'));}
  else out.push(it('h_ok','info',`สแกนครบทุกคน (${thD(W)})`,`มีคนสแกน ${Object.keys(g).length} คน`));
  // วันค่าแรงพิเศษที่รอยืนยัน
  const sd=await opt(sel('cal_special_days',`select=id,name,day_from,day_to,pay_multiplier&kind=eq.pay&pay_status=eq.pending&cancelled=eq.false&day_to=gte.${bkk(0)}&order=day_from.asc`));
  (sd||[]).forEach(d=>out.push(it('h_sd_'+d.id,'warn',`${thD(d.day_from)}${d.day_to!==d.day_from?'–'+thD(d.day_to):''} ${d.name} ค่าแรง ×${d.pay_multiplier||2} ยังไม่ยืนยัน`,
    'ลงไว้ในปฏิทินแล้ว รอกด ✅ ในหน้า 🎌 ของระบบเงินเดือน')));
  const T=bkk(0),[y,m,dd]=T.split('-').map(Number);
  const end=dd>=26?new Date(Date.UTC(y,m,25)).toISOString().slice(0,10):`${T.slice(0,8)}25`;
  out.push(it('h_period','info',`งวดนี้ปิดวันที่ ${thD(end)} · เหลือ ${diffD(T,end)} วัน`,'งวดเงินเดือน 26 เดือนก่อน → 25 เดือนนี้'));
  return out;
}

async function chkSocial(){
  const out=[],since=new Date(Date.now()-3*864e5).toISOString();
  const [m,chats,st]=await Promise.all([
    sel('social_mentions',`select=id,branch,rating,reply_status,channel,text,posted_at,kind&kind=neq.message&posted_at=gte.${enc(since)}&order=posted_at.desc&limit=500`),
    opt(sel('social_chat_log','select=channel,thread_id,direction,meta,created_at&order=created_at.desc&limit=600')),
    opt(sel('social_settings','select=id,val&id=eq.cron'))]);
  const sc=scoped('social');
  const rows=m.filter(r=>r.branch?brOK('social',r.branch):!sc);
  const pend=rows.filter(r=>r.reply_status==='pending');
  const low=pend.filter(r=>r.rating!=null&&Number(r.rating)<=2);
  low.slice(0,4).forEach(r=>out.push(it('s_low_'+r.id,'crit',`รีวิว ${Number(r.rating)} ดาว ${r.branch?brName(r.branch):''} (${r.channel||'-'}) ยังไม่ได้ตอบ`,
    String(r.text||'(ไม่มีข้อความ)').slice(0,140))));
  if(low.length>4)out.push(it('s_low_more','crit',`รีวิวคะแนนต่ำยังไม่ได้ตอบอีก ${low.length-4} รายการ`,'ดูในแอพ JJ Social'));
  const pn=pend.length-low.length;
  if(pn)out.push(it('s_pend_'+pn+'_'+bkk(0),'warn',`รีวิว/คอมเมนต์รอตอบ ${pn} รายการ (3 วันล่าสุด)`,'คะแนน 3 ดาวขึ้นไปหรือไม่มีคะแนน'));
  if(chats){const th={};[...chats].sort((x,y)=>String(x.created_at).localeCompare(String(y.created_at))).forEach(c=>{const k=c.channel+'|'+c.thread_id;(th[k]=th[k]||[]).push(c)});
    const failed=x=>x.meta&&x.meta.auto&&x.meta.sent===false, hand=x=>x.meta&&(x.meta.draft||x.meta.fallback||x.meta.needs_human||failed(x));
    let w=0;for(const k in th){const ms=th[k];const man=ms.map(x=>x.direction==='out'&&!(x.meta&&(x.meta.auto||x.meta.draft))).lastIndexOf(true);
      const lastReal=[...ms].reverse().find(x=>!(x.meta&&x.meta.draft)&&!failed(x));
      if((lastReal&&lastReal.direction==='in')||ms.slice(man+1).some(hand))w++}
    if(w)out.push(it('s_chat_'+w+'_'+bkk(0),'warn',`แชทรอคนตอบ ${w} ห้อง`,'นับจากแชท 600 ข้อความล่าสุด'))}
  const cr=st&&st[0]&&st[0].val,ca=cr?ageMin(cr.cron_at):null;
  if(cr&&ca!=null&&ca>45)out.push(it('s_cron_'+bkk(0),'warn',`ระบบดึงรีวิวอัตโนมัติเงียบไป ${fmt(ca)} นาที`,'ดูการ์ด 🩺 สถานะระบบ ในหน้าตั้งค่าของ JJ Social'));
  const rated=rows.filter(r=>r.rating!=null);
  if(rated.length)out.push(it('s_avg','info',`3 วันล่าสุด ${rows.length} รายการ · เฉลี่ย ${(rated.reduce((s,r)=>s+Number(r.rating),0)/rated.length).toFixed(1)} ดาว`,`จาก ${rated.length} รีวิวที่มีคะแนน`));
  return out;
}

async function chkKpi(){
  const out=[],to=bizDay(5),from=addD(to,-6);

    sel('kpi_daily',`select=branch,biz_date,n,avg_score&biz_date=gte.${from}&biz_date=lte.${to}&limit=5000`),
    opt(sel('kpi_daily_responses',`select=branch,biz_date,n_responses&biz_date=gte.${from}&biz_date=lte.${to}`)),
    opt(sel('kpi_staff_daily',`select=staff_id,votes,branch&biz_date=gte.${from}&biz_date=lte.${to}`)),
    opt(sel('kpi_staff','select=id,name,nickname'))]);
  for(const b of ['JJRD','JJLP']){if(!brOK('kpi',b))continue;
    const r=daily.filter(x=>x.branch===b);const n=r.reduce((s,x)=>s+(Number(x.n)||0),0);if(!n)continue;
    const avg=r.reduce((s,x)=>s+(Number(x.avg_score)||0)*(Number(x.n)||0),0)/n;

    const sum={};(sv||[]).filter(x=>x.branch===b&&x.staff_id).forEach(x=>sum[x.staff_id]=(sum[x.staff_id]||0)+(Number(x.votes)||0));
    const top=Object.keys(sum).sort((a,c)=>sum[c]-sum[a])[0],tn=top&&(staff||[]).find(s=>String(s.id)===String(top));
    const d=`${thD(from)}–${thD(to)}${nr?` · ลูกค้ากด ${fmt(nr)} ครั้ง`:''}${tn?` · ถูกชมมากสุด: ${tn.nickname||tn.name} (${sum[top]} ครั้ง)`:''}`;
    out.push(it(`k_avg_${b}_${to}`,avg<4?'warn':'info',`คะแนน${brName(b)} 7 วัน ${avg.toFixed(2)} / 5${avg<4?' — ต่ำกว่า 4.0':''}`,d,{br:b}));
  }
  if(!out.length)out.push(it('k_none','info','ยังไม่มีคะแนนใน 7 วันล่าสุด','เช็คว่าแท็บเล็ตหน้าร้านเปิดหน้า kiosk อยู่'));
  return out;
}

  if(camT){const k=.16;cam.s+=(camT.s-cam.s)*k;cam.x+=(camT.x-cam.x)*k;cam.y+=(camT.y-cam.y)*k;if(Math.abs(camT.s-cam.s)<.001&&Math.abs(camT.x-cam.x)<.5)camT=null}
  step(t);
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  if(MODE==='3d')render3(t);else{
  c.setTransform(dpr*cam.s,0,0,dpr*cam.s,dpr*cam.x,dpr*cam.y);
  const L=ST.slice();for(const p of PPL)L.push({k:p.x+p.y+.01,f:()=>drawPerson(p,t)});
  L.sort((a,b)=>a.k-b.k);for(const d of L)d.f();
  const hl=sel_||hover;
  if(hl&&hl.room&&!hl.boss){const r=hl.room;c.save();poly([P(r[0]+.05,r[1]+.05),P(r[2]-.05,r[1]+.05),P(r[2]-.05,r[3]-.05),P(r[0]+.05,r[3]-.05)]);
    c.strokeStyle=sel_===hl?'#c62127':'rgba(198,33,39,.55)';c.lineWidth=2.4/cam.s;c.setLineDash([6/cam.s,4/cam.s]);c.stroke();c.restore()}}
  c.setTransform(dpr,0,0,dpr,0,0);pills=[];
  const fs=W<760?11.5:12.5,F=`600 ${fs}px Sarabun,sans-serif`;
  c.font=F;c.textBaseline='middle';c.textAlign='center';
  for(const a of AG){
    const r=a.room,[sx,sy]=proj((r[0]+r[2])/2,(r[1]+r[3])/2,3.0),wv=worst(a);
    const label=(wv==='lock'?'🔒 ':a.ic+' ')+a.short,w=c.measureText(label).width+20,h=fs+13;
    c.fillStyle=sel_===a?'#2b211c':wv==='lock'?'rgba(236,230,222,.92)':'rgba(255,253,249,.95)';
    c.shadowColor='rgba(60,40,25,.18)';c.shadowBlur=8;rr(sx-w/2,sy-h/2,w,h,h/2);c.fill();c.shadowBlur=0;
    c.fillStyle=sel_===a?'#fff':wv==='lock'?'#8a7f76':'#2b211c';c.fillText(label,sx,sy+1);
    pills.push({a,x:sx-w/2,y:sy-h/2,w,h});
    if(wv==='crit'||wv==='warn'||wv==='err'){const by=sy-h/2-16+(RM?0:Math.sin(t*3+r[0])*3),bx=sx;
      c.fillStyle=SEVC[wv];c.strokeStyle='#fff';c.lineWidth=2;
      c.beginPath();c.moveTo(bx,by-12);c.lineTo(bx+12,by);c.lineTo(bx,by+12);c.lineTo(bx-12,by);c.closePath();c.fill();c.stroke();
      c.fillStyle='#fff';c.font='700 13px Sarabun,sans-serif';c.fillText(wv==='err'?'?':'!',bx,by+1);c.font=F;
      const n=openItems(a).length;if(n>1&&wv!=='err'){c.fillStyle='#2b211c';c.beginPath();c.arc(bx+11,by-9,8,0,7);c.fill();c.fillStyle='#fff';c.font='700 10px Sarabun,sans-serif';c.fillText(n,bx+11,by-8.5);c.font=F}
      pills.push({a,x:bx-13,y:by-13,w:26,h:26})}
    if(wv==='load'){const by=sy-h/2-14;c.strokeStyle='#8a7f76';c.lineWidth=2.5;c.beginPath();c.arc(sx,by,7,t*5,t*5+4.2);c.stroke()}
  }
  {const [sx,sy]=proj(BOSS.seat[0],BOSS.seat[1],3.1),label='🐷 ผู้จัดการ AI',w=c.measureText(label).width+20,h=fs+13;
   c.fillStyle='#c62127';rr(sx-w/2,sy-h/2,w,h,h/2);c.fill();c.fillStyle='#fff';c.fillText(label,sx,sy+1);pills.push({a:BOSS,x:sx-w/2,y:sy-h/2,w,h})}
  c.font='500 12px Sarabun,sans-serif';
  for(const p of PPL){if(!p.bubble||t>p.bubble.until)continue;const g2=proj(p.x,p.y,2.3),sx=g2[0],sy=g2[1]-10;
    const w=Math.min(240,c.measureText(p.bubble.text).width+18);
    c.fillStyle='#fff';c.shadowColor='rgba(60,40,25,.2)';c.shadowBlur=8;rr(sx-w/2,sy-30,w,24,10);c.fill();c.shadowBlur=0;c.beginPath();c.moveTo(sx-5,sy-6);c.lineTo(sx+5,sy-6);c.lineTo(sx,sy);c.fill();
    c.fillStyle='#2b211c';c.fillText(p.bubble.text,sx,sy-17,w-12)}
  requestAnimationFrame(frame);
}

/* ---------- เดินไปห้องประชุม ---------- */
let lastT=0,nextBubble=2,meeting=0;
const SEATS=[[19.4,1.6],[20.4,1.6],[21.4,1.6],[22.4,1.6],[19.4,4.35],[20.4,4.35],[21.4,4.35],[22.4,4.35],[18.55,3],[23.55,3]];
function routeToMeeting(p,i){const s=SEATS[i],r=[...p.a.door.map(q=>[...q]),[17.5,7.2],[17.5,5.3]];
  if(s[1]<3||s[0]<19)r.push([18.4,5.3],[18.4,s[1]]);else if(s[0]>23)r.push([23.55,5.3]);else r.push([s[0],5.3]);r.push(s);return r}
function step(t){
  const dt=Math.min(.3,t-lastT||0);lastT=t;let moving=0;   // dt สูงสุด .3 วิ = เครื่องช้าก็ยังเดินถึงเท่าเดิม
  for(const p of PPL){if(!p.path.length){p.walk=0;continue}moving++;p.walk=1;const [tx,ty]=p.path[0],dx=tx-p.x,dy=ty-p.y,dd=Math.hypot(dx,dy),v=(RM?6:2.6)*dt;
    if(dd<=v){p.x=tx;p.y=ty;p.path.shift()}else{p.x+=dx/dd*v;p.y+=dy/dd*v}}
  if(meeting===1&&!moving){meeting=2;showBrief()}
  if(meeting===3&&!moving){meeting=0;$('meetBtn').disabled=false}
  if(t>nextBubble&&!meeting){const idle=PPL.filter(p=>!p.walk&&(!p.a.app||visible(p.a)));const p=idle[Math.floor(Math.random()*idle.length)];
    if(p){const o=p.a.app?openItems(p.a):[];p.bubble={text:p.a.state==='load'?'กำลังตรวจข้อมูล…':(o[0]?o[0].t:p.a.doing+'…'),until:t+3.4}}nextBubble=t+4.5}
}
function startMeeting(){if(meeting)return;closeSheet();beep(520,.08);meeting=1;$('meetBtn').disabled=true;PPL.forEach(p=>p.bubble=null);
  PPL.forEach((p,i)=>{p.path=routeToMeeting(p,i)});
  const s=Math.max(cam.s,fitS*(W<760?1.7:1.25)),cp=VS(20.5,3,0);camT={s,x:W/2-cp[0]*s,y:H*.48-cp[1]*s};if(RM){cam=camT;camT=null}}
function sendHome(){PPL.forEach((p,i)=>{const back=routeToMeeting(p,i).slice(0,-1).reverse();back.push(p.home);p.path=back});meeting=3}

/* ---------- แตะ/ลาก/ซูม ---------- */
const ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:0};
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s:cam.s};drag=null}});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);zoom(pinch.s*d/pinch.d/cam.s,(a[0]+b[0])/2,(a[1]+b[1])/2);return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));if(drag.moved>6){cam.x=drag.cx+dx;cam.y=drag.cy+dy;camT=null;cv.classList.add('drag')}return}
  hover=hit(e.clientX,e.clientY);cv.classList.toggle('hot',!!hover)});
cv.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);cv.classList.remove('drag');
  if(drag&&drag.moved<=6){const h=hit(e.clientX,e.clientY);if(h)openAgent(h);else closeSheet()}
  if(ptrs.size<2)pinch=null;drag=null});
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;pinch=null});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
function hit(x,y){for(let i=pills.length-1;i>=0;i--){const p=pills[i];if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h)return p.a}
  if(meeting)return null;const [gx,gy]=toGrid(x,y);
  for(const a of [...AG,BOSS]){const r=a.room;if(gx>=r[0]&&gx<r[2]&&gy>=r[1]&&gy<r[3])return a}return null}

  const vis=AG.filter(a=>visible(a)),ms=MISSIONS(),open=ms.filter(m=>!isDone(m.i.id));
  const rows=vis.map(a=>{const o=openItems(a);const top=o.find(i=>i.sev==='crit')||o[0]||(a.items||[]).find(i=>i.sev==='info');
    const st=a.state==='load'?'กำลังตรวจ…':a.state==='err'?'อ่านข้อมูลไม่ได้':o.length?`ค้าง ${o.length} เรื่อง`:'ไม่มีเรื่องค้าง';
    return `<div class="brow"><div class="tile" style="background:linear-gradient(145deg,${a.g[0]},${a.g[1]})">${a.ic}</div><div><p>${a.state==='ok'&&top?esc(top.t):esc(st)}</p><small>${esc(a.name)} · ${st}</small></div></div>`}).join('');
  modal(`<h2>ประชุมเช้า · ${thLong()}</h2><p class="sub">น้องจริงใจสรุปจาก ${vis.length} ห้องที่คุณมีสิทธิ์ · ค้าง ${open.length} เรื่อง (ด่วน ${open.filter(m=>m.i.sev==='crit').length})</p>${rows}
   ${canSend()?`<div class="lgrow"><label for="lgSel">ส่งสรุปเข้ากลุ่มไลน์</label><select id="lgSel"><option value="">กำลังโหลดรายชื่อกลุ่ม…</option></select><button class="btn g" id="lgSend" disabled>📤 ส่ง</button></div><p class="mode" id="lgNote" style="margin:8px 0 0">ส่งผ่านบอทของร้านตัวเดียวกับระบบนับสต๊อก · ระวังเลือกกลุ่มซัพพลายเออร์</p>`:''}
   <div class="mfoot"><button class="btn g" id="cpBrief">📋 คัดลอกข้อความ</button><button class="btn r" data-close>เริ่มงาน</button></div>`);
  if(canSend()){const cfg=await lineCfg();const s=$('lgSel');if(!s)return;
    const saved=LS.get('jjoffice_lg','')||cfg.def;
    const opts=cfg.groups.map(g=>`<option value="${esc(g.group_id)}"${g.group_id===saved?' selected':''}>${esc(g.name||String(g.group_id).slice(0,12)+'…')}${g.group_id===cfg.def?' (กลุ่มแจ้งใบสมัคร)':''}</option>`);
    if(saved&&!cfg.groups.some(g=>g.group_id===saved))opts.unshift(`<option value="${esc(saved)}" selected>${esc(saved.slice(0,12))}… (กลุ่มแจ้งใบสมัคร)</option>`);
    s.innerHTML='<option value="">— เลือกกลุ่ม —</option>'+opts.join('');$('lgSend').disabled=!s.value;
    s.onchange=()=>{$('lgSend').disabled=!s.value}}
}
async function sendBrief(btn){
  const gid=$('lgSel').value;if(!gid)return;const name=$('lgSel').selectedOptions[0].textContent;
  if(!confirm(`ส่งสรุปประชุมเช้าเข้ากลุ่ม "${name}" ?`))return;
  btn.disabled=true;btn.textContent='กำลังส่ง…';
  try{const cfg=await lineCfg();
    const r=await fetch(cfg.ep,{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.KEY,Authorization:'Bearer '+CFG.KEY},body:JSON.stringify({to:gid,text:briefText()})});
    const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.error||j.message||('HTTP '+r.status));
    LS.set('jjoffice_lg',gid);toast('✅ ส่งสรุปเข้ากลุ่ม '+esc(name)+' แล้ว');btn.textContent='✅ ส่งแล้ว';
  }catch(e){toast('ส่งไม่สำเร็จ — '+esc(String(e.message||e).slice(0,100)));btn.disabled=false;btn.textContent='📤 ส่ง'}
}
function copyBrief(){const tx=briefText();const ok=()=>toast('คัดลอกข้อความสรุปแล้ว');
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(ok,()=>fb());return}}catch(e){}fb();
  function fb(){const ta=document.createElement('textarea');ta.value=tx;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){toast('คัดลอกไม่ได้')}ta.remove()}}

/* ---------- ดึงข้อมูลจริง ---------- */
let busy=false,lastRun=null;
async function runAll(){
  if(busy)return;busy=true;$('reBtn').classList.add('spin');$('liveDot').className='dot busy';$('liveTxt').textContent='กำลังตรวจข้อมูล…';
  await Promise.all(AG.map(async a=>{
    if(!visible(a)){a.state='lock';a.items=[];return}
    if(!a.items.length)a.state='load';
    try{a.items=await a.check();a.state='ok';a.err=''}catch(e){a.state='err';a.err=String(e.message||e).slice(0,160);a.items=[]}
    a.at=new Date();paintHud();if(sel_===a)openAgent(a);
  }));
  busy=false;lastRun=new Date();$('reBtn').classList.remove('spin');
  const bad=AG.filter(a=>a.state==='err').length;
  $('liveDot').className='dot live';$('liveTxt').innerHTML=`ข้อมูลจริง · ${bkkTime(lastRun.toISOString())} น.${bad?` <small>· อ่านไม่ได้ ${bad} ห้อง</small>`:''}`;
  paintHud();if(sel_)openAgent(sel_);
}

/* ---------- ล็อกอิน (pnl_users · JJ Login + JJ Gate) ---------- */
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const enc=new TextEncoder().encode(str);
  const l=enc.length,bitLen=l*8,withOne=l+1,total=(Math.ceil((withOne+8)/64))*64;
  const M=new Uint8Array(total);M.set(enc);M[l]=0x80;
  const dv=new DataView(M.buffer);
  dv.setUint32(total-4,bitLen>>>0);dv.setUint32(total-8,Math.floor(bitLen/4294967296));
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));const w=new Array(64);
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3),s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[t]+w[t])>>>0,S0=rr(a,2)^rr(a,13)^rr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
const pwHash=(u,p)=>sha256hex(u+'|'+p+'|JJPNL');
const userReady=u=>!!u&&u.active!==false&&(u.status==null||u.status==='active');
async function fetchUser(name){const r=await sel('pnl_users',`select=id,username,display_name,role,active,status,pass_hash,apps,unit&username=eq.${enc(name)}&limit=1`);return r&&r[0]}
async function doLogin(){
  const u=($('liUser').value||'').trim(),p=$('liPass').value||'',msg=$('liMsg'),btn=$('liBtn');
  const say=t=>{if(msg){msg.textContent=t;msg.style.display='block'}};
  if(!u||!p)return say('กรอกชื่อผู้ใช้และรหัสผ่าน');
  if(btn)btn.disabled=true;
  try{const usr=await fetchUser(u);
    if(!usr||usr.pass_hash!==pwHash(u,p))return say('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    if(!userReady(usr))return say(usr.status==='pending'?'บัญชีนี้ยังรอผู้ดูแลอนุมัติ':'บัญชีนี้ถูกปิดการใช้งาน');
    JJGate.grant(usr.username);enter(usr);
  }catch(e){say('เชื่อมต่อฐานข้อมูลไม่ได้ — '+String(e.message||e).slice(0,80))}
  finally{if(btn)btn.disabled=false}
}
function enter(usr){
  ME={username:usr.username,display_name:usr.display_name||usr.username,role:usr.role||'',apps:usr.apps||null};
  LS.set('jjoffice_sess',{username:ME.username,display_name:ME.display_name,role:ME.role});
  if(!canApp('office')){$('login').style.display='block';const m=$('liMsg');if(m){m.textContent='บัญชีนี้ยังไม่ได้รับสิทธิ์เข้าออฟฟิศ AI — ขอสิทธิ์ที่ 🔑 JJ Access';m.style.display='block'}LS.del('jjoffice_sess');ME=null;return}
  $('login').style.display='none';$('app').hidden=false;
  $('who').textContent='👤 '+ME.display_name+(isBoss(ME)?'':'');
  loadProgress();startApp();
}
function logout(){LS.del('jjoffice_sess');location.reload()}
async function init(){
  const sess=LS.get('jjoffice_sess',null);
  if(sess&&sess.username&&JJGate.ok(sess.username)){
    try{const u=await fetchUser(sess.username);
      if(!userReady(u)){LS.del('jjoffice_sess');$('login').style.display='block';return}
      enter(u);
    }catch(e){$('login').style.display='block';const m=$('liMsg');if(m){m.textContent='เชื่อมต่อฐานข้อมูลไม่ได้ ลองใหม่อีกครั้ง';m.style.display='block'}}
  }else{$('login').style.display='block';if(sess&&sess.username)JJGate.note(sess.username,'liUser','liPass')}
}

/* ---------- เริ่มแอพ ---------- */
let started=false;
function startApp(){
  if(started)return;started=true;
  MODE=init3D()?'3d':'2d';if(MODE!=='3d')$('scene3').hidden=true;
  resize();paintHud();paintSnd();requestAnimationFrame(frame);
  const v=LS.get('jjoffice_view','');const a=[...AG,BOSS].find(x=>x.id===v);if(a)setTimeout(()=>openAgent(a),50);
  runAll();setInterval(()=>{if(!document.hidden)runAll()},5*60e3);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&lastRun&&Date.now()-lastRun>60e3)runAll()});
}
$('meetBtn').onclick=startMeeting;
$('misBtn').onclick=()=>toggleDrop('mis');$('bellBtn').onclick=()=>toggleDrop('bell');
$('drop').onclick=e=>{const b=e.target.closest('[data-ag]');if(!b)return;$('drop').hidden=true;openAgent(AG.find(x=>x.id===b.dataset.ag))};
$('veil').onclick=e=>{if(e.target.id==='veil'||e.target.closest('[data-close]'))return closeModal();
  if(e.target.closest('#lgSend'))return sendBrief(e.target.closest('#lgSend'));if(e.target.closest('#cpBrief'))return copyBrief()};
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('veil').hidden)closeModal();else if(!$('drop').hidden)$('drop').hidden=true;else closeSheet()});
$('zoIn').onclick=()=>zoom(1.2);$('zoOut').onclick=()=>zoom(1/1.2);$('fitBtn').onclick=()=>{closeSheet();fit()};
$('reBtn').onclick=$('liveChip').onclick=()=>runAll();
$('sndBtn').onclick=()=>{SND=!SND;LS.set('jjoffice_snd',SND);paintSnd();beep(700,.08)};
$('outBtn').onclick=logout;
$('fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast('เปิดเต็มจอไม่ได้'))}catch(e){toast('เปิดเต็มจอไม่ได้')}};
addEventListener('resize',()=>{if(started)resize()});
init();
</script>
<script>
/* ============================================================
   ลากหน้าลง = รีเฟรช (pull-to-refresh) — ใช้ได้บนมือถือทุกแบบ
   จำเป็นเพราะแอปที่ "เพิ่มไปยังหน้าจอโฮม" (PWA) ไม่มีปุ่ม/ท่ารีเฟรชของเบราว์เซอร์
   แตะที่ยอดสุดของหน้าแล้วลากลงเกิน 70px → ปล่อยนิ้ว = โหลดหน้าใหม่
   ============================================================ */
(function(){
  if(!('ontouchstart' in window))return;              // เฉพาะจอสัมผัส
  var TH=70, MAX=110, y0=0, dy=0, pulling=false, ready=false, bar=null;

  function el(){
    if(bar)return bar;
    bar=document.createElement('div');
    bar.setAttribute('aria-hidden','true');
    bar.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;display:flex;'+
      'align-items:center;justify-content:center;pointer-events:none;'+
      'height:0;overflow:hidden;transition:none;'+
      'font:600 13px/1.2 "Prompt","Sarabun",system-ui,sans-serif;color:#F2CF7A;'+
      'background:linear-gradient(180deg,rgba(163,27,36,.95),rgba(163,27,36,0));';
    bar.innerHTML='<span id="__ptrTxt">ลากลงเพื่อรีเฟรช</span>';
    document.body.appendChild(bar);
    return bar;
  }
  function atTop(){
    var d=document.scrollingElement||document.documentElement;
    return (window.pageYOffset||d.scrollTop||0)<=0;
  }
  /* ลากอยู่ในกล่องที่เลื่อนได้เอง (ตาราง/ลิสต์) ไม่นับ */
  function inScrollable(node){
    for(var n=node;n&&n!==document.body;n=n.parentElement){
      var st=getComputedStyle(n), oy=st.overflowY;
      if((oy==='auto'||oy==='scroll')&&n.scrollHeight>n.clientHeight&&n.scrollTop>0)return true;
    }
    return false;
  }
  /* โหมด kiosk (แท็บเล็ตหน้าร้านให้ลูกค้ากด) ห้ามรีเฟรช — คะแนนที่กดค้างไว้จะหาย */
  function kiosk(){
    return document.body.classList.contains('kiosk') ||
           /[?&]kiosk=/.test(location.search);
  }
  document.addEventListener('touchstart',function(e){
    if(kiosk()){pulling=false;return;}
    if(e.touches.length!==1||!atTop()||inScrollable(e.target)){pulling=false;return;}
    /* ออฟฟิศ AI: ลากบนผังออฟฟิศ = เลื่อนผัง ไม่ใช่รีเฟรช */
    if(e.target&&e.target.closest&&e.target.closest('#scene,#sheet,#veil,.drop')){pulling=false;return;}
    y0=e.touches[0].clientY; dy=0; pulling=true; ready=false;
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(!pulling)return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0||!atTop()){ if(bar){bar.style.height='0';} return; }
    if(e.cancelable)e.preventDefault();                // กันหน้าเด้งตามนิ้ว
    var h=Math.min(dy*0.5,MAX), b=el();
    b.style.height=h+'px';
    ready = dy>TH;
    var t=b.querySelector('#__ptrTxt');
    if(t)t.textContent = ready ? 'ปล่อยเพื่อรีเฟรช' : 'ลากลงเพื่อรีเฟรช';
  },{passive:false});

  document.addEventListener('touchend',function(){
    if(!pulling)return; pulling=false;
    var b=el();
    if(ready){
      b.style.height='44px';
      var t=b.querySelector('#__ptrTxt'); if(t)t.textContent='กำลังโหลด…';
      setTimeout(function(){ location.reload(); },120);
    }else{
      b.style.transition='height .2s'; b.style.height='0';
      setTimeout(function(){ b.style.transition='none'; },220);
    }
  },{passive:true});
})();
</script>
