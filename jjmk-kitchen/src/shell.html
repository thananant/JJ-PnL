<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>JJ ครัวกลาง — จริงใจหมูกระทะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=Noto+Sans+Lao+Looped:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ===== JJ Kitchen v2 — CI เดียวกับแอพนับสต๊อก (jjmk-stockcheck.html) ===== */
:root{
  --fh:'Prompt','Noto Sans Lao Looped','Noto Sans Myanmar',sans-serif;
  --red:#C62127; --red-d:#A31B20; --red-t:#FBEBEB; --dk:#7E1013; --wine:#6B0F12; --goldf:#E5B03C;
  --ink:#2E2119; --mut:#8A7A66; --bg:#F6F1E5; --card:#FFFDF7; --line:#E8DFCC;
  --green:#1F7A43; --amber:#A66A00; --ok:#1F7A43; --ok-t:#EAF4EC; --bad:#D23B3B; --bad-t:#FCE9E8; --gold:#A66A00; --gold-t:#FBF6EA;
  --blue:#5B7FA6; --blue-t:#EAF3FC;
  --r:16px; --sh:0 1px 2px rgba(35,25,20,.05),0 4px 14px rgba(35,25,20,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{font-family:'Sarabun','Noto Sans Lao Looped','Noto Sans Myanmar',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100dvh}
h1,h2,h3,.num,.kpi-v{font-family:var(--fh)}
body[data-lang="lo"]{--fh:'Noto Sans Lao Looped','Prompt',sans-serif;font-family:'Noto Sans Lao Looped','Sarabun',sans-serif}
body[data-lang="my"]{--fh:'Noto Sans Myanmar','Prompt',sans-serif;font-family:'Noto Sans Myanmar','Sarabun',sans-serif;line-height:1.5}
.num,td.n,input[type=number],.kpi-v,.money{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:15px;color:var(--ink)}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
input[type=number]{text-align:right}
input,select,textarea{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none;min-height:44px}
textarea{min-height:80px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
input::placeholder{color:#C5BEB5}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--red)}
::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-thumb{background:#D8D1C7;border-radius:3px}

/* ---------- Header (แอพนับสต๊อก) ---------- */
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--dk),#690C0F);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);
  padding-top:env(safe-area-inset-top)}   /* เปิดจากไอคอนหน้าจอโฮม iPhone: แถบสถานะโปร่ง — ห้ามทับปุ่มบนหัวแอป */
.hrow{display:flex;align-items:center;gap:10px;padding:10px max(clamp(14px,1.6vw,28px),env(safe-area-inset-right)) 6px max(clamp(14px,1.6vw,28px),env(safe-area-inset-left));margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-weight:700;font-size:17px;letter-spacing:.2px;color:#fff;min-width:0}
.brand .hlogo{width:28px;height:28px;border-radius:9px;border:1.5px solid #E9B44C;background:var(--red);object-fit:cover;flex:none}
.brand small{font-weight:500;color:#F2DCDC;font-size:11px;display:block;line-height:1}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle{display:none}
.hbtn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap;font-family:var(--fh);min-height:44px;flex:none}   /* ปุ่มหัวแอป ≥44px (แอพนับใช้ 36 — ตรวจอิสระขอให้ตามกติกา 44) */
#refreshBtn{min-width:44px;justify-content:center;padding-left:8px;padding-right:8px}
.hbtn:active{transform:scale(.96)}
#langBtn{margin-left:auto}
#syncDot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;transition:.2s}
#syncDot.busy{background:var(--gold);animation:pul 1s infinite}
#syncDot.err{background:var(--bad)}
@keyframes pul{50%{opacity:.35}}
/* แถบแท็บ: ทุกหน้าอยู่ในแถบเดียว เลื่อนข้างได้ · แท็บที่เปิดสีทอง (ไม่มี ☰ เมนู) */
.tabbar{display:flex;gap:6px;overflow-x:auto;padding:2px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));margin:0 auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:none;padding:8px 14px;border-radius:10px;font-weight:700;font-family:var(--fh);color:#F2DCDC;background:rgba(255,255,255,.14);font-size:13.5px;display:inline-flex;align-items:center;gap:5px;min-height:44px;white-space:nowrap}
.tabbar button.on{background:var(--goldf);color:#5A3E00}
.tabbar button .bdg{background:#fff;color:var(--red);border-radius:99px;font-size:11px;line-height:1;padding:3px 6px;font-weight:800}

/* ---------- Sidebar (≥900px) ---------- */
#sideNav{display:none}
@media(min-width:900px){
  #app{width:auto;max-width:1220px;margin:0 0 0 max(236px,calc(50vw - 492px));padding:20px 36px calc(36px + env(safe-area-inset-bottom))}
  header{padding-left:236px}
  #sideNav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:236px;z-index:60;
    background:linear-gradient(180deg,#7E1013 0%,#690C0F 100%);padding:calc(14px + env(safe-area-inset-top)) 13px calc(12px + env(safe-area-inset-bottom)) max(13px,env(safe-area-inset-left));overflow-y:auto}
  #sideNav::-webkit-scrollbar{width:0}
  .sb-logo{display:flex;align-items:center;gap:10px;margin:2px 4px 10px}
  .sb-logo img{width:47px;height:47px;border-radius:13px;border:2px solid #E9B44C;box-shadow:0 2px 10px rgba(0,0,0,.35);object-fit:cover;flex:none}
  .sb-logo b{display:block;color:#fff;font-family:var(--fh);font-size:15px;line-height:1.2}
  .sb-logo small{color:#EFC6C6;font-size:11px;font-weight:500}
  .sb-sec{color:rgba(255,255,255,.42);font-size:10.5px;letter-spacing:.2em;font-weight:700;margin:8px 8px 4px;font-family:var(--fh)}
  .sb-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;color:#F2DCDC;font-family:var(--fh);font-weight:600;font-size:14.5px;padding:9px 12px;border-radius:11px;margin-bottom:1px;min-height:44px;transition:background .12s}
  .sb-item .ic{width:22px;text-align:center;flex:none;font-size:16px}
  .sb-item:hover{background:rgba(255,255,255,.09)}
  .sb-item.on{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.28)}
  .sbadge{margin-left:auto;background:#fff;color:var(--red);border-radius:99px;font-size:11px;line-height:1;padding:3px 7px;font-weight:800}
  .sb-foot{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
  #sbUser{color:#F2DCDC;font-size:12.5px;padding:4px 8px 8px;word-break:break-word}
  #sbUser a{color:#F3C74F;font-weight:700;cursor:pointer;display:inline-block;padding:10px 4px;margin:-10px 0 -10px 2px;min-height:44px;line-height:24px;box-sizing:border-box}   /* ที่แตะ 44px (iPad) ตำแหน่งตัวหนังสือเท่าเดิม (ยังอยู่บรรทัดเดียวกับชื่อ) */
  header .brand{display:none}
  .tabbar{display:none}
  .hrow{padding:13px 36px 11px;max-width:1220px;margin:0 auto}
  .ptitle{display:block;font-family:var(--fh);font-weight:700;font-size:20px;margin-right:auto;color:#fff}
}
@media(min-width:900px) and (max-height:900px){ /* iPad แนวนอน/จอเตี้ย: ทุกหน้า + ผู้ใช้ต้องอยู่ในจอโดยไม่ต้องเลื่อน (ปุ่มยังสูง 44px) */
  #sideNav{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .sb-logo{margin:0 4px 4px}.sb-logo img{width:40px;height:40px}
  .sb-sec{margin:3px 8px 1px;font-size:10px}
  .sb-item{margin-bottom:0;padding:7px 12px}
  .sb-foot{padding-top:5px}#sbUser{padding:2px 8px 4px}
}

/* ---------- Layout ---------- */
main{width:100%;margin:0 auto;padding:14px max(clamp(14px,1.6vw,28px),env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) max(clamp(14px,1.6vw,28px),env(safe-area-inset-left))}
.view{display:none}.view.on{display:block;animation:fin .18s ease}
.view.hasbar{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
@keyframes fin{from{opacity:0}to{opacity:1}}   /* opacity เท่านั้น — transform จะทำให้ .pinbar (fixed) ยึดกับ section แทนจอ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card h3{margin:-14px -14px 12px;padding:10px 14px;font-size:15px;font-weight:700;font-family:var(--fh);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#FBF6EA;border-bottom:1px solid #F0E8D6;border-radius:var(--r) var(--r) 0 0}
.card h3 .sp{margin-left:auto;font-weight:500;color:var(--mut);font-size:12.5px}
.card.tap{cursor:pointer}.card.tap:active{transform:scale(.995)}
.card.hot{border-color:#F2C27B;background:#FFF8EC}
.card.warn{border-color:#F2C4C2;background:#FFF5F4}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11.5px}.b{font-weight:700}.right{text-align:right}.center{text-align:center}
.red{color:var(--red)}.green{color:var(--ok)}.amber{color:var(--gold)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{background:var(--red);color:#fff;font-weight:600;font-family:var(--fh);padding:10px 16px;border-radius:11px;box-shadow:0 2px 8px rgba(198,33,39,.3);display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:44px}
.btn:active{transform:scale(.97)}
.btn.gh{background:#fff;color:var(--wine);border:1.5px solid var(--line);box-shadow:none}
.btn.dk{background:var(--ink);box-shadow:none;color:#fff}
.btn.ok{background:var(--ok);box-shadow:0 2px 8px rgba(30,142,90,.3)}
.btn.sm2{padding:7px 12px;font-size:13.5px;border-radius:9px;min-height:44px}
.btn.big{width:100%;padding:14px 16px;font-size:17px;border-radius:14px;min-height:56px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:var(--ok-t);color:var(--ok)}.chip.bad{background:var(--bad-t);color:var(--bad)}
.chip.mid{background:#EFEBE4;color:var(--mut)}.chip.warn,.chip.gold{background:var(--gold-t);color:var(--gold)}.chip.blue{background:var(--blue-t);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);min-width:0}
.kpi .t{font-size:12px;color:var(--mut);font-weight:600}
.kpi-v{font-size:22px;font-weight:700;margin-top:2px;line-height:1.15;overflow-wrap:anywhere}
.kpi .s{font-size:12px;margin-top:3px}
.kpi.hero{background:linear-gradient(135deg,var(--dk),var(--wine));border:none;color:#fff}
.kpi.hero .t{color:rgba(255,255,255,.75)}.kpi.hero .s{color:rgba(255,255,255,.8)}
.kpi.tap{cursor:pointer}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:13.5px}
.fld{margin-bottom:9px}
.fld label{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:3px}
.md2{display:block}
@media(min-width:760px){.md2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:339px){.grid2,.grid3{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}}
.hintbox{background:var(--gold-t);border:1.5px solid #E9D9A8;border-radius:12px;padding:10px 12px;margin:8px 0 10px;font-size:13px}
.okbox{background:var(--ok-t);border:1.5px solid #BFE3CE;border-radius:12px;padding:10px 12px;margin:8px 0 10px;font-size:13px}
.badbox{background:var(--bad-t);border:1.5px solid #F2C4C2;border-radius:12px;padding:10px 12px;margin:8px 0 10px;font-size:13px}
.note{background:#FDF6E7;border:1.5px dashed #D9BE85;border-radius:12px;padding:8px 14px;font-size:12.5px;color:#7A6234;margin-bottom:12px}
/* หัวหมวด: ตัวหนังสือสีไวน์ + เส้นทอง */
.dhead{display:flex;align-items:center;gap:12px;margin:4px 0 12px;font-family:var(--fh);font-weight:700;font-size:17px;color:var(--wine)}
.dhead::after{content:'';flex:1;height:2px;background:var(--goldf);border-radius:2px;order:1}
.dhead .sp{order:2;font-weight:600;font-size:12.5px;color:var(--mut)}
/* pills (ชิป) — ขอบไวน์ / เปิด = ไวน์เต็ม */
.pills{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:6px;margin-bottom:6px}
.pills.scroll,.catbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pills.scroll::-webkit-scrollbar,.catbar::-webkit-scrollbar{display:none}
.catbar{display:flex;gap:6px;padding:2px 0 8px}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:99px;border:1.8px solid var(--wine);background:#fff;color:var(--wine);font-family:var(--fh);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;min-height:44px}
.pill.on{background:var(--wine);color:#fff}
.pill .bdg{background:#F6E7E7;color:var(--wine);border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:700}
.pill.on .bdg{background:rgba(255,255,255,.22);color:#fff}
.pill.add{border-style:dashed;color:var(--red);border-color:var(--red)}
.pill.needc{border-color:var(--red);color:var(--red)}.pill.needc.on{background:var(--red);border-color:var(--red);color:#fff}
.srch{width:100%;padding:11px 16px;border:1.5px solid var(--line);border-radius:99px;font-size:16px;background:#fff;margin:4px 0 10px}
/* ตาราง */
.twrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11.5px;color:var(--mut);font-weight:700;text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap;font-family:var(--fh)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot{border-top:2px solid var(--ink);background:#FBFAF7;font-weight:700}
table.t tr.tap{cursor:pointer}table.t tr.tap:hover{background:#FFF8F3}
table.t input,table.t select{min-height:40px;padding:6px 8px}
/* รายการแบบแถว */
.rowline{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rowline:last-child{border-bottom:0}.rowline .grow{flex:1;min-width:120px}.rowline.tap{cursor:pointer}
.mthumb{width:44px;height:44px;border-radius:10px;background:#F3ECE0;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex:none;cursor:pointer}
.mthumb img{width:100%;height:100%;object-fit:cover}
/* การ์ดรูป / การ์ดนับ */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
@media(max-width:430px){.igrid{grid-template-columns:1fr 1fr}}
@media(max-width:339px){.igrid{grid-template-columns:1fr}}
.icard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.icard.low{border-color:var(--bad);background:#FFF7F6}
.icard.tap{cursor:pointer}
.icard .ithumb{width:100%;height:92px;border-radius:11px;background:#F3ECE0;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;cursor:pointer}
.icard .ithumb img{width:100%;height:100%;object-fit:cover}
.icard .iname{font-weight:700;font-size:14px;line-height:1.25;min-height:2.2em;overflow-wrap:anywhere}
.icard .isub{font-size:11.5px;color:var(--mut)}
.icard .iqty{font-family:var(--fh);font-weight:700;font-size:16px}
.icard .edit-dot{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:var(--sh);z-index:2}
.icard.skcard{border:1.8px solid var(--wine)}.icard.skcard.cnt{border-color:#9DBFA6;background:#FBFDFA;box-shadow:none}
.skstep{display:flex;align-items:center;gap:6px;margin-top:8px}
.skstep button{width:44px;height:44px;min-height:44px;border-radius:11px;border:1.5px solid var(--line);background:#FBF6EA;color:var(--mut);font-size:22px;font-weight:700;flex:none;padding:0;line-height:1}
.skstep button.plus{background:var(--wine);border-color:var(--wine);color:#fff}
.skstep input{flex:1;min-width:58px;width:0;height:44px;min-height:44px;font-size:18px;font-weight:700;text-align:center;background:#FBF6EA;padding:0 4px}
.skstep input.has{border-color:var(--ok);background:#F0F8F1}
.skfoot{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--mut);min-height:36px;flex-wrap:wrap}
.skfoot .outb{margin-left:auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:13px;color:var(--mut);min-height:36px;flex:none}
.skfoot .outb.on{background:#FBEAEA;border-color:#E4A6A6;color:var(--red);font-weight:700}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.pick{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;text-align:center;min-width:0}
.pick.on{border-color:var(--red);background:var(--red-t);box-shadow:0 0 0 2px var(--red-t)}
.pick .pthumb{width:100%;height:74px;border-radius:9px;background:#F3ECE0;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
.pick .pthumb img{width:100%;height:100%;object-fit:cover}
.pick .pname{font-size:12.5px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
/* stepper ใหญ่ (จำนวนรอบ/ล็อต) */
.bq{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 12px}
.bq button{width:64px;height:64px;border-radius:50%;font-size:34px;font-weight:800;background:var(--bg);color:var(--ink);flex:none}
.bq button.plus{background:var(--wine);color:#fff}
.bq input{width:120px;height:64px;font-size:30px;text-align:center;font-weight:800;border-radius:18px}
/* แถบติดล่าง (บันทึก/สรุป) */
.pinbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;color:var(--ink);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-shadow:0 -3px 12px rgba(0,0,0,.07);z-index:30;font-family:var(--fh)}
.pinbar .v{font-weight:700;font-size:16px}.pinbar .btn{margin-left:auto}
@media(min-width:900px){.pinbar{left:236px}}
/* ขั้นตอน / สถานะ */
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps .st{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding:8px 4px;border-radius:10px;background:#EFEBE4;font-family:var(--fh)}
.steps .st.on{background:var(--red);color:#fff}.steps .st.ok{background:var(--ok-t);color:var(--ok)}
.stpill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:700}
.st-draft{background:#EFEBE4;color:var(--mut)}.st-sent{background:var(--blue-t);color:var(--blue)}.st-paid,.st-received,.st-done{background:var(--ok-t);color:var(--ok)}
.st-void{background:#EFEBE4;color:var(--mut);text-decoration:line-through}.st-new{background:var(--red-t);color:var(--red)}.st-wait{background:var(--gold-t);color:var(--gold)}
/* หน้า วันนี้: การ์ดใหญ่แตะได้ */
.bigacts{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
@media(min-width:760px){.bigacts{grid-template-columns:1fr 1fr}}
.bigact{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--card);min-height:84px;font:inherit;color:var(--ink);cursor:pointer;box-shadow:var(--sh)}
.bigact .bi{font-size:36px;line-height:1;flex:none}
.bigact .btx{min-width:0;flex:1}.bigact b{display:block;font-size:18px;font-family:var(--fh);line-height:1.25}
.bigact small{display:block;font-size:14px;color:var(--mut);margin-top:3px}
.bigact .bgo{font-size:28px;color:var(--mut);flex:none}
.bigact.hot{border-color:var(--red);background:#FFF5F4}.bigact.hot .bgo{color:var(--red)}
.bigact.ok{border-color:#9FD3B6;background:var(--ok-t)}
.bigact:active{transform:scale(.98)}
/* วิธีทำ */
.tmsteps{border:2px solid var(--line);border-radius:16px;padding:4px 12px;margin-bottom:6px}
.tmstep{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.45}
.tmstep:last-child{border-bottom:0}
.tmstep .n{flex:none;min-width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.tmstep.tip{color:var(--mut);font-size:15px}.tmstep.tip .n{background:none;color:inherit;font-size:18px}
.tmhead{font-weight:800;font-size:16px;color:var(--red);padding:12px 0 6px;border-bottom:1px solid var(--line)}
.tmhead:first-child{padding-top:8px}
/* Modal · toast · confirm */
#modalWrap,#cfmWrap{position:fixed;inset:0;background:rgba(30,24,20,.45);z-index:100;display:none;align-items:flex-end;justify-content:center;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#cfmWrap{z-index:150;align-items:center;padding:18px}
@media(min-width:640px){#modalWrap{align-items:center}}
#modalWrap.on,#cfmWrap.on{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{border-radius:18px}}
.modal.wide{max-width:760px}.modal.task{max-width:680px;font-size:16px}
@media(max-width:639px){.modal.task{max-height:calc(100dvh - env(safe-area-inset-top));height:calc(100dvh - env(safe-area-inset-top));border-radius:0;padding-top:10px}}   /* กล่องเริ่มใต้แถบสถานะ — เลื่อนถึงท้ายแล้วปุ่มไม่มุดใต้แถบ (padding-top อยู่ในกล่องเลื่อน จึงกันไม่ได้) */
.modal h3{margin:0 0 14px;font-size:17px;font-family:var(--fh)}
.cfm{background:#fff;border-radius:18px;padding:20px 18px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.cfm .msg{font-size:16px;line-height:1.5;white-space:pre-wrap;margin-bottom:16px}
.cfm .btns{display:flex;gap:8px}.cfm .btns .btn{flex:1}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:200;transition:.25s;opacity:0;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}   /* pointer-events:none = ไม่กินปุ่มใต้ toast (เหมือนแอพนับสต๊อก) */
#toast.on{transform:translateX(-50%);opacity:1}#toast.err{background:var(--bad)}#toast.warn{background:var(--amber)}
#toast.err,#toast.warn{white-space:normal;text-align:center;line-height:1.35;border-radius:18px}   /* ข้อความเหตุผลยาว = พับบรรทัด ไม่ตัดด้วย … */
body.haspin #toast{bottom:calc(88px + env(safe-area-inset-bottom))}   /* มีแถบติดล่าง = ยกขึ้นไม่ให้บังปุ่มบันทึก/ยอดรวม */
.imgzoom{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px}
.imgzoom img{max-width:96vw;max-height:88vh;border-radius:14px}
/* ภาษา */
.langrow{display:flex;gap:6px;flex-wrap:wrap}
.langrow button{flex:1;min-width:110px;padding:13px 10px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px}
.langrow button .fl{font-size:24px}.langrow button.on{border-color:var(--red);background:var(--red-t);color:var(--red-d)}
/* Login */
#loginOv{position:fixed;inset:0;background:linear-gradient(150deg,#2E1414,#5A1E20);display:none;align-items:center;justify-content:center;z-index:999;padding:18px}   /* JJLogin.mount วาด .jjlg-in (fixed · overflow-y:auto · การ์ด margin:auto) ทับอีกชั้น — จอเตี้ย/แนวนอนเลื่อนในชั้นนั้น */
#loginOv.on{display:flex}
#lgMsg{font-size:12px;color:var(--bad);margin-top:8px;min-height:16px;text-align:center;white-space:pre-wrap}
.lkwho{display:flex;align-items:center;justify-content:center;gap:8px;background:#F7F1E3;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:8px}
.lkhint{font-size:12px;color:var(--mut);text-align:center;margin-bottom:12px;line-height:1.45}
.loginlang{display:flex;gap:5px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.loginlang button{padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--mut);background:#fff}
.loginlang button.on{background:var(--red);border-color:var(--red);color:#fff}
/* 📲 ดึงหน้าลงเพื่อโหลดใหม่ */
#ptr{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;gap:9px;justify-content:center;pointer-events:none;transform:translateY(-60px);transition:transform .22s cubic-bezier(.2,.9,.3,1)}
#ptr.drag{transition:none}
#ptr .ptr-c{width:40px;height:40px;border-radius:50%;background:#fff;border:1.5px solid var(--line);box-shadow:0 4px 14px rgba(35,25,20,.18);display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--mut);transition:color .15s,border-color .15s}
#ptr.rdy .ptr-c{color:var(--red);border-color:var(--red)}
#ptr .ptr-t{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--mut);box-shadow:0 4px 14px rgba(35,25,20,.18);white-space:nowrap}
#ptr.rdy .ptr-t,#ptr.sp .ptr-t{color:var(--red);border-color:var(--red)}
#ptr.sp .ptr-c{color:var(--red);border-color:var(--red);animation:ptrsp .7s linear infinite}
@keyframes ptrsp{to{transform:rotate(360deg)}}
#sqlBox{font-family:ui-monospace,monospace;font-size:11px;height:200px;white-space:pre}
.soon{text-align:center;padding:28px 16px 24px}.soon .bi{font-size:46px;line-height:1}.soon h2{font-family:var(--fh);color:var(--wine);font-size:20px;margin:10px 0 4px}.soon p{margin:4px auto;max-width:520px;line-height:1.55}.soon .btn{margin-top:14px}

      if(o.beforeFields)h+=o.beforeFields;

        h+='<div class="jjlg-f"><label for="'+uid+'">ชื่อผู้ใช้</label>'

      }
      if(o.keepId)h+='<label class="jjlg-keep"><input type="checkbox" id="'+o.keepId+'"> '

    mount:function(el,o){

      var b=document.getElementById(o.btnId||'lgBtn'); if(b&&go)b.addEventListener('click',run);
      [o.uid||'lgU',o.pid||'lgP'].forEach(function(id){

<!-- JJBR-BEGIN ทะเบียนสาขากลาง · บล็อกนี้ต้องเหมือนกันทุกไฟล์ทุกตัวอักษร (แก้ที่ไฟล์ใดไฟล์หนึ่งแล้ว sync ด้วยสคริปต์) -->
<script>
/* JJBR — ทะเบียนสาขากลาง (ตาราง pnl_branches) ใช้ร่วมทุกแอพ (เจ้าของสั่ง 2026-10-15: "เพิ่มสาขาใหม่ ให้เพิ่มไปในทุกระบบเลย แบบปุ่มเดียว")
   · สาขาหน้าร้านมาจากตาราง pnl_branches (ปุ่ม 🏪 เปิดสาขาใหม่ ใน JJ Access เพิ่มให้) · ครัวกลาง JJCK / ออฟฟิศ OFFICE เป็นหน่วยงานคงที่
   · ไม่ต้องรอเน็ต: เริ่มจากแคชในเครื่อง (localStorage.jjbr_cache) → ไม่มีแคช = JJRD/JJLP · JJBR.load() อ่านของจริงแล้วแจ้ง onChange
   · ออฟฟิศ: บัญชี/สิทธิ์ใช้ OFFICE · P&L ใช้ JJOF → JJBR.canon('JJOF')='OFFICE' · JJBR.pnl('OFFICE')='JJOF'
   · แอพเดิมยังใช้ชื่อ/สีของตัวเองกับสาขาเดิมได้ — ใช้ JJBR.extra(รหัสที่แอพรู้จักแล้ว) เติมเฉพาะสาขาที่แอพยังไม่รู้จัก */
(function(){
  var VER='2026-10-15.1', CK='jjbr_cache', MAXAGE=90*864e5;
  var BASE=[
    {code:'JJRD',name:'สาขารัชดา',short:'รัชดา',kind:'store',sort:1,stk_id:'b19f0a17b4472'},
    {code:'JJLP',name:'สาขาลาดพร้าว',short:'ลาดพร้าว',kind:'store',sort:2,stk_id:'b19f0a17b448212'}];
  var UNITS=[
    {code:'JJCK',name:'ครัวกลาง',short:'ครัวกลาง',kind:'kitchen',sort:900},
    {code:'OFFICE',name:'ออฟฟิศ',short:'ออฟฟิศ',kind:'office',sort:901}];
  var STK={JJRD:'b19f0a17b4472',JJLP:'b19f0a17b448212'};
  var PALETTE=['#2E8B57','#8E44AD','#D35400','#16A085','#2C3E50','#B7950B','#C0392B','#1F618D'];
  function s(v,n){ return v==null?'':String(v).trim().slice(0,n||80); }
  function norm(r){
    if(!r||typeof r!=='object')return null;
    var code=s(r.code,12).toUpperCase();
    if(!/^[A-Z][A-Z0-9_]{1,11}$/.test(code))return null;
    var kind=r.kind==='store'||r.kind==='office'||r.kind==='kitchen'?r.kind:
      (code==='JJOF'||code==='OFFICE'?'office':code==='JJCK'?'kitchen':r.is_central?'office':'store');
    var name=s(r.name||r.display_name,60)||code;
    var short=s(r.short,30)||name.replace(/^สาขา\s*/,'')||code;
    return {code:code,name:name,short:short,kind:kind,sort:isFinite(+r.sort)?+r.sort:0,
      stk_id:s(r.stk_id,40)||STK[code]||'',color:/^#[0-9A-Fa-f]{6}$/.test(s(r.color))?s(r.color):'',
      active:r.active!==false,is_central:kind!=='store',tax_branch:/^[0-9]{5}$/.test(s(r.tax_branch))?s(r.tax_branch):'',
      addr:s(r.addr,300),opened_on:/^\d{4}-\d{2}-\d{2}/.test(s(r.opened_on))?s(r.opened_on).slice(0,10):''};
  }
  function clean(arr){
    var out=[],seen={};
    (Array.isArray(arr)?arr:[]).forEach(function(r){ var x=norm(r); if(x&&!seen[x.code]){seen[x.code]=1;out.push(x);} });
    return out;
  }
  function bySort(a,b){ return (a.sort-b.sort)||(a.code<b.code?-1:a.code>b.code?1:0); }
  var J={VER:VER,rows:clean(BASE),src:'base',cols:false,at:0,_cb:[],_p:null};
  try{
    var c=JSON.parse(localStorage.getItem(CK)||'null');
    if(c&&Array.isArray(c.rows)&&c.rows.length&&Date.now()-(+c.t||0)<MAXAGE){ J.rows=clean(c.rows); J.src='cache'; J.cols=!!c.cols; J.at=+c.t||0; }
  }catch(e){}
  /* สาขาหน้าร้านที่เปิดอยู่ (เรียงตาม sort แล้วรหัส) */
  J.stores=function(all){ return J.rows.filter(function(r){ return r.kind==='store'&&(all||r.active); }).sort(bySort); };
  J.storeCodes=function(all){ return J.stores(all).map(function(r){ return r.code; }); };
  /* สาขาหน้าร้าน + ครัวกลาง + ออฟฟิศ (ตัวเลือก "ประจำที่"/สิทธิ์รายสาขา) — ใช้รหัส OFFICE ไม่ใช่ JJOF */
  J.units=function(){ return J.stores().concat(UNITS.map(function(u){ var r=J.get(u.code); return r&&r.kind===u.kind?Object.assign({},u,{name:r.name||u.name,short:r.short||u.short}):u; })); };
  J.unitCodes=function(){ return J.units().map(function(r){ return r.code; }); };
  J.canon=function(c){ c=s(c,12).toUpperCase(); return c==='JJOF'?'OFFICE':c; };
  J.pnl=function(c){ c=s(c,12).toUpperCase(); return c==='OFFICE'?'JJOF':c; };
  J.get=function(c){
    c=s(c,12).toUpperCase(); if(!c)return null;
    var r=null,i;
    for(i=0;i<J.rows.length;i++){ if(J.rows[i].code===c){ r=J.rows[i]; break; } }
    if(!r&&(c==='OFFICE'||c==='JJOF')){ for(i=0;i<J.rows.length;i++){ if(J.rows[i].code===(c==='OFFICE'?'JJOF':'OFFICE')){ r=J.rows[i]; break; } } }
    if(!r){ for(i=0;i<UNITS.length;i++){ if(UNITS[i].code===J.canon(c)){ r=UNITS[i]; break; } } }
    return r;
  };
  J.known=function(c){ return !!J.get(c); };
  J.isStore=function(c){ var r=J.get(c); return !!(r&&r.kind==='store'); };
  J.name=function(c,fb){ var r=J.get(c); return r?r.name:(fb!=null?fb:s(c)); };
  J.short=function(c,fb){ var r=J.get(c); return r?r.short:(fb!=null?fb:s(c)); };
  J.stk=function(c){ var r=J.get(c); return (r&&r.stk_id)||STK[s(c,12).toUpperCase()]||''; };
  J.byStk=function(id){ id=s(id,40); if(!id)return null; for(var i=0;i<J.rows.length;i++){ if(J.rows[i].stk_id===id)return J.rows[i]; } for(var k in STK){ if(STK[k]===id)return J.get(k); } return null; };
  J.color=function(c,i){ var r=J.get(c); if(r&&r.color)return r.color; var st=J.storeCodes(true),k=st.indexOf(s(c,12).toUpperCase()); return PALETTE[(k<0?(i||0):k)%PALETTE.length]; };
  /* สาขาหน้าร้านที่แอพยังไม่รู้จัก (known = รายการรหัส หรือ object ที่มีรหัสเป็น key) */
  J.extra=function(known){
    var have={}; (Array.isArray(known)?known:Object.keys(known||{})).forEach(function(k){ have[s(k,12).toUpperCase()]=1; });
    return J.stores().filter(function(r){ return !have[r.code]; });
  };
  /* รหัสสาขาใหม่ที่ใช้ได้: อังกฤษพิมพ์ใหญ่ล้วน 2–8 ตัว (ใช้เป็นตัวหน้าเลขใบกำกับภาษีด้วย) */
  J.codeOk=function(c){ return /^[A-Z]{2,8}$/.test(s(c,12)); };
  J.onChange=function(fn){ if(typeof fn==='function')J._cb.push(fn); };
  /* อ่านทะเบียนจริง (ไม่ throw) — url/key ของ Supabase · opts.force = อ่านใหม่แม้เพิ่งอ่าน · คืน rows */
  J.load=function(url,key,opts){
    opts=opts||{};
    if(J._p&&!opts.force)return J._p;
    if(J.src==='db'&&!opts.force&&Date.now()-J.at<60000)return Promise.resolve(J.rows);
    url=s(url,300).replace(/\/+$/,''); key=s(key,500);
    if(!url||!key||typeof fetch!=='function')return Promise.resolve(J.rows);
    var get=function(q){
      var ac=typeof AbortController==='function'?new AbortController():null, tm=ac?setTimeout(function(){ ac.abort(); },opts.timeout||8000):0;
      return fetch(url+'/rest/v1/pnl_branches?'+q,{headers:{apikey:key,Authorization:'Bearer '+key},signal:ac?ac.signal:undefined,cache:'no-store'})
        .then(function(r){ if(tm)clearTimeout(tm); if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); });
    };
    /* ลองแบบไม่เรียงตาม sort เฉพาะตอนเซิร์ฟเวอร์ตอบ 4xx (เช่นตารางไม่มีช่อง sort) · หมดเวลา/เน็ตหลุด = ไม่ลองซ้ำ (ไม่ให้แอพรอนานเป็น 2 เท่า) */
    J._p=get('select=*&order=sort.asc,code.asc').catch(function(e){ if(!/^HTTP 4/.test(String(e&&e.message)))throw e; return get('select=*&order=code.asc'); })
      .then(function(d){
        if(!Array.isArray(d))throw new Error('bad');
        var rows=clean(d), before=JSON.stringify(J.rows);
        if(!rows.some(function(r){ return r.kind==='store'; }))rows=rows.concat(clean(BASE)); /* ตารางว่าง/มีแต่ออฟฟิศ = ใช้สาขาเดิมไปก่อน */
        J.rows=rows; J.src='db'; J.at=Date.now(); J.cols=d.length>0&&d.every(function(r){ return r&&Object.prototype.hasOwnProperty.call(r,'kind'); });
        try{ localStorage.setItem(CK,JSON.stringify({t:J.at,cols:J.cols,rows:d})); }catch(e){}
        if(JSON.stringify(J.rows)!==before)J._cb.forEach(function(fn){ try{ fn(J); }catch(e){ if(window.console)console.error(e); } });
        return J.rows;
      })
      .catch(function(){ return J.rows; })
      .then(function(r){ J._p=null; return r; });
    return J._p;
  };
  window.JJBR=J;
})();
</script>

/* ============================================================
   Units — หน่วยหลักของสินค้า (unit) + ตัวแปลงมาตรฐาน + ขนาดบรรจุต่อสินค้า (buy_unit/buy_qty, packs[{u,q}])
   unitFactor(it,u) = 1 u กี่หน่วยหลัก · unitList(it) = หน่วยที่แปลงได้ · convert(it,qty,from,to)
   ============================================================ */
const UNIT_STD=[['กก.',1000,'กรัม'],['ขีด',100,'กรัม'],['ลิตร',1000,'มล.'],['โหล',12,'ชิ้น']];   // ตัวแปลงพื้นฐาน (แก้ไม่ได้)
function packsOf(it){const base=it&&it.unit||'';const out=[];
  if(it&&it.buy_unit&&it.buy_unit!==base&&num(it.buy_qty)>0)out.push({u:it.buy_unit,q:num(it.buy_qty)});
  (it&&Array.isArray(it.packs)?it.packs:[]).forEach(p=>{if(p&&p.u&&p.u!==base&&num(p.q)>0&&!out.some(x=>x.u===p.u))out.push({u:p.u,q:num(p.q)});});
  return out;}
function unitGraph(it){const g={};const add=(a,b,f)=>{f=num(f);if(!a||!b||a===b||!(f>0))return;(g[a]=g[a]||[]).push([b,f]);(g[b]=g[b]||[]).push([a,1/f]);};
  if(it)packsOf(it).forEach(p=>add(p.u,it.unit||'',p.q));
  UNIT_STD.forEach(x=>add(x[0],x[2],x[1]));return g;}
function unitConv(it,from,to){ // 1 from = ? to · แปลงไม่ได้ = null
  if(!from||!to)return null;if(from===to)return 1;
  const g=unitGraph(it);const seen={};seen[from]=1;let q=[[from,1]];
  while(q.length){const nx=[];for(const [u,f] of q)for(const [v,k] of (g[u]||[])){if(seen[v])continue;seen[v]=1;const ff=f*k;
      if(v===to)return Math.round(ff*1e9)/1e9;nx.push([v,ff]);}q=nx;}
  return null;}
function unitFactor(it,u){return it?unitConv(it,u||it.unit,it.unit||''):null;}   // 1 u = ? หน่วยหลักของสินค้า (null = ไม่รู้จัก)
function convert(it,qty,from,to){const f=unitConv(it,from||it.unit,to||it.unit);return f==null?null:rnd4(num(qty)*f);}
function unitList(it){ // หน่วยที่ใช้กับสินค้านี้ได้: หน่วยหลัก · บรรจุ · ที่แปลงผ่านตัวแปลงมาตรฐาน
  const out=[];const push=u=>{if(u&&!out.includes(u)&&unitFactor(it,u)!=null)out.push(u);};
  push(it.unit);packsOf(it).forEach(p=>push(p.u));UNIT_STD.forEach(x=>{push(x[0]);push(x[2]);});
  ((S.cfg&&S.cfg.units)||[]).forEach(push);return out;}
function unitOptions(list,sel){list=list||UNITS;const L=list.slice();if(sel&&!L.includes(sel))L.push(sel);
  return L.map(u=>'<option value="'+esc(u)+'"'+(u===sel?' selected':'')+'>'+esc(trUnit(u))+'</option>').join('');}
function allUnits(){return UNITS.concat(((S.cfg&&S.cfg.units)||[]).filter(u=>u&&!UNITS.includes(u)));}
function countUnitOf(it){ // หน่วยนับ: ตั้งเอง → บรรจุเล็กสุด (ถ้าหน่วยหลักเป็นชั่ง/ตวง) → หน่วยหลัก
  if(it.count_unit&&unitFactor(it,it.count_unit)!=null)return it.count_unit;
  const base=it.unit||'';
  if(['กรัม','กก.','ขีด','มล.','ลิตร'].includes(base)){const ps=packsOf(it).filter(p=>!['กรัม','กก.','ขีด','มล.','ลิตร'].includes(p.u)).sort((a,b)=>a.q-b.q);
    if(ps.length)return ps[0].u;if(base==='กรัม')return 'กก.';if(base==='มล.')return 'ลิตร';}
  return base;}

async function cfgSave(patch){ // อ่านใหม่ → รวม → เขียน (กันเครื่องอื่นแก้พร้อมกัน)

function itemById(id){return S.items.find(x=>x.id===id)||null;}

function bomOf(r){ // บรรทัดสูตรที่ยังมีวัตถุดิบ + จำนวนเป็นหน่วยหลัก (qty_base) · unit null = หน่วยหลัก
  const id=r&&r.id!=null?(typeof r==='object'?r.id:r):r;
  return (S.boms[id]||[]).map(l=>{const it=itemById(l.item_id);if(!it)return null;
    const f=l.unit?unitFactor(it,l.unit):1;return Object.assign({},l,{item:it,unit_disp:l.unit||it.unit,qty_base:f==null?null:rnd4(num(l.qty)*f)});}).filter(Boolean);}

/* ---------- เคลื่อนไหวสต๊อก: ทุกการเปลี่ยนยอด = kc_moves + ck_add_qty ---------- */
async function addQty(kind,id,delta){ // บวก/ลบยอดแบบ atomic ผ่าน RPC
  try{const {data,error}=await sb.rpc('ck_add_qty',{p_kind:kind,p_id:id,p_delta:delta});if(error)throw error;return data==null?null:+data;}
  catch(e){const tbl=kind==='item'?'ck_items':'ck_recipes';   // RPC ล้ม — อ่านยอดล่าสุดแล้วเขียนทับ
    const cur=await db(()=>sb.from(tbl).select('qty').eq('id',id).maybeSingle());const v=rnd4(num(cur&&cur.qty)+delta);
    await db(()=>sb.from(tbl).update({qty:v}).eq('id',id));return v;}
}
let PUSH_LAST={inserted:false,applied:[]};   // สิ่งที่ pushMoves รอบล่าสุดทำไปแล้ว (ไว้ถอนตอนบันทึกเอกสารไม่ครบ)
async function pushMoves(moves){ // moves: [{d?,kind,ref_kind:'item'|'recipe',ref_id,name?,qty(+/-),cost?,ref_table?,ref_id2?,note?}]
  moves=(moves||[]).filter(m=>m&&m.ref_id&&num(m.qty)!==0);PUSH_LAST={inserted:false,applied:[]};if(!moves.length)return;
  const by=S.user&&S.user.name,d0=bizTodayISO();
  const rows=moves.map(m=>{const o=m.ref_kind==='item'?itemById(m.ref_id):recipeById(m.ref_id);
    return {d:m.d||d0,kind:m.kind,ref_kind:m.ref_kind,ref_id:m.ref_id,name:m.name||(o&&o.name)||'',qty:rnd4(m.qty),cost:m.cost==null?null:rnd4(m.cost),
      ref_table:m.ref_table||null,ref_id2:m.ref_id2==null?null:String(m.ref_id2),note:m.note||null,by_name:by};});
  await db(()=>sb.from('kc_moves').insert(rows));PUSH_LAST.inserted=true;
  const agg={};moves.forEach(m=>{const k=m.ref_kind+'|'+m.ref_id;agg[k]=(agg[k]||0)+num(m.qty);});
  for(const k of Object.keys(agg)){const [kind,id]=k.split('|');const o=kind==='item'?itemById(id):recipeById(id);const dl=rnd4(agg[k]);
    const v=await addQty(kind,id,dl);PUSH_LAST.applied.push({kind,id,delta:dl});if(o)o.qty=v!=null?v:rnd4(num(o.qty)+dl);}
}
async function pushMovesUndo(refTable,refId2){ // ถอนรอบล่าสุดของ pushMoves (เอกสารบันทึกไม่ครบ → สต๊อก/สมุดต้องกลับเท่าเดิม) · best effort ไม่ throw
  const L=PUSH_LAST;PUSH_LAST={inserted:false,applied:[]};
  for(const a of L.applied){try{const o=a.kind==='item'?itemById(a.id):recipeById(a.id);const v=await addQty(a.kind,a.id,-a.delta);if(o)o.qty=v!=null?v:rnd4(num(o.qty)-a.delta);}catch(e){}}
  if(L.inserted&&refTable){try{await sb.from('kc_moves').delete().eq('ref_table',refTable).eq('ref_id2',String(refId2));}catch(e){}}}

/* ---------- ต้นทุน (กติกาเจ้าของ: ราคาจริงตามล็อต) ---------- */
function itemCost(it){ // ต้นทุน/หน่วยหลักของวัตถุดิบ: avg_cost → last_price → ราคาเดิม/ขนาดซื้อ → null
  if(!it)return null;if(it.avg_cost!=null&&num(it.avg_cost)>0)return num(it.avg_cost);
  if(it.last_price!=null&&num(it.last_price)>0)return num(it.last_price);
  if(it.price!=null&&num(it.price)>0)return num(it.price)/(num(it.buy_qty)||1);return null;}
function avgCostItem(it,qtyBase,priceBase,qty0){ // ถัวเฉลี่ยกับของเดิมในสต๊อก (ไม่มีของเดิม/ไม่มีราคาเดิม = ราคาใหม่) · qty0 = ยอดก่อนรับ (ไม่ส่ง = ยอดในแคช)
  const q0=Math.max(0,num(qty0==null?(it&&it.qty):qty0)),c0=it&&it.avg_cost!=null?num(it.avg_cost):null;qtyBase=num(qtyBase);priceBase=num(priceBase);
  if(c0==null||q0<=0||qtyBase<=0)return rnd4(priceBase);return rnd4((q0*c0+qtyBase*priceBase)/(q0+qtyBase));}
function avgCostRecipe(r,qty,costUnit,qty0){const q0=Math.max(0,num(qty0==null?(r&&r.qty):qty0)),c0=r&&r.avg_cost!=null?num(r.avg_cost):null;qty=num(qty);costUnit=num(costUnit);
  if(c0==null||q0<=0||qty<=0)return rnd4(costUnit);return rnd4((q0*c0+qty*costUnit)/(q0+qty));}
function recipeCost(r,lots){ // ต้นทุนตามสูตร ณ ราคาปัจจุบัน: {items,overhead,extra,total,perUnit,missing:[ชื่อ]}
  lots=num(lots)||1;let items=0;const missing=[];
  bomOf(r).forEach(l=>{const c=itemCost(l.item);if(c==null||l.qty_base==null){missing.push(l.item.name);return;}items+=l.qty_base*lots*c;});
  const yq=num(r.yield_qty)*lots||1,extra=num(r.extra_cost)*lots,oh=overheadFor(items,yq);
  const total=items+extra+oh;return {items:rnd2(items),overhead:rnd2(oh),extra:rnd2(extra),total:rnd2(total),perUnit:rnd4(total/yq),yield:yq,missing};}
function overheadFor(costItems,qty){const c=S.cfg||CFG_DEF;return c.overhead_mode==='pct'?num(costItems)*num(c.overhead_value)/100:num(qty)*num(c.overhead_value);}
function markupOf(r){return r&&r.markup_pct!=null?num(r.markup_pct):num((S.cfg||CFG_DEF).markup_pct);}
function recipeUnitCost(r){ // ต้นทุน/หน่วยที่ใช้ตั้งราคา: avg_cost (ถัวเฉลี่ยล็อต) → unit_cost ล็อตล่าสุด → คำนวณจากสูตร
  if(!r)return null;if(r.avg_cost!=null&&num(r.avg_cost)>0)return num(r.avg_cost);if(r.unit_cost!=null&&num(r.unit_cost)>0)return num(r.unit_cost);
  const c=recipeCost(r,1);return (c.items>0&&!c.missing.length)?c.perUnit:null;}
function sellPrice(r){const c=recipeUnitCost(r);return c==null?null:rnd4(c*(1+markupOf(r)/100));}
async function applyItemReceipt(it,qtyBase,priceBase,d,qty0){ // หลังรับของ: ราคาล่าสุด + ถัวเฉลี่ย (เรียกก่อน pushMoves · qty0 = ยอดก่อนรับที่อ่านสด ถ้ามี)
  const avg=avgCostItem(it,qtyBase,priceBase,qty0);const patch={avg_cost:avg,last_price:rnd4(priceBase),last_price_at:d||bizTodayISO()};
  try{await db(()=>sb.from('ck_items').update(patch).eq('id',it.id));}catch(e){if(!MISSING_TBL(e))throw e;S.kcSql=false;}
  Object.assign(it,patch);return avg;}
async function applyRecipeLot(r,qty,costUnit,qty0){ // หลังผลิต: ถัวเฉลี่ยกับของเดิม + unit_cost = ล็อตล่าสุด (เรียกก่อน pushMoves)
  const avg=avgCostRecipe(r,qty,costUnit,qty0);const patch={avg_cost:avg,unit_cost:rnd4(costUnit)};
  try{await db(()=>sb.from('ck_recipes').update(patch).eq('id',r.id));}catch(e){if(!MISSING_TBL(e))throw e;S.kcSql=false;await db(()=>sb.from('ck_recipes').update({unit_cost:rnd4(costUnit)}).eq('id',r.id));}
  Object.assign(r,patch);return avg;}

/* ---------- ยกเลิกเอกสาร: ต้นทุนหลังยกเลิก (ตรวจอิสระ 2026-10-16: ยกเลิกใบเก่าแล้วห้ามลบผลของใบที่มาทีหลัง) ----------
   ไม่มีเอกสารของสินค้านั้นหลังใบที่ยกเลิก = คืนค่าที่จดไว้ก่อนรับ/ก่อนผลิต (prev_*)
   มี = เล่นซ้ำจากค่าที่จดไว้ด้วยใบที่เหลือ: ยอดก่อนใบถัดไป = prev_qty ของใบนั้น − ยอดของใบที่ยกเลิก (ตัดที่ 0) · แถวเก่าไม่มี prev_qty = ถอดน้ำหนักออกจากถัวเฉลี่ยปัจจุบัน */
function replayAfterVoid(snap,voidQty,later){ // snap={avg,last,last_at} ที่ใบที่ยกเลิกจดไว้ · later=[{prev_qty,qty,price,d,…}] เรียงตามเวลา (ทุกแถวมี prev_qty)
  // → {avg,last,last_at, fixes:[{L,prev_qty,prev_avg,prev_last,prev_last_at}]} = ค่าใหม่ + ค่าที่ใบหลัง ๆ ต้องจดใหม่ (เหมือนใบที่ยกเลิกไม่เคยมี — ยกเลิกใบไหนก่อนหลังก็ลงเอยเท่ากัน)
  let avg=snap.avg==null?null:num(snap.avg),last=snap.last==null?null:num(snap.last),last_at=snap.last_at||null;const fixes=[];
  for(const L of later){const q0=Math.max(0,num(L.prev_qty)-num(voidQty)),q=num(L.qty),p=num(L.price);
    fixes.push({L,prev_qty:rnd4(q0),prev_avg:avg,prev_last:last,prev_last_at:last_at});
    avg=(avg==null||q0<=0||q<=0)?rnd4(p):rnd4((q0*avg+q*p)/(q0+q));last=rnd4(p);last_at=L.d||null;}
  return {avg,last,last_at,fixes};}
function unweighAvg(qtyNow,avgNow,voidQty,voidPrice){ // ถอดใบที่ยกเลิกออกจากถัวเฉลี่ยปัจจุบัน (ยอดปัจจุบันยังรวมใบนั้นอยู่)
  const d=num(qtyNow)-num(voidQty);if(avgNow==null)return null;if(!(d>0))return num(avgNow);
  const v=(num(qtyNow)*num(avgNow)-num(voidQty)*num(voidPrice))/d;return v>0?rnd4(v):num(avgNow);}
function costAfterVoid(o,snap,voidQty,voidPrice,later){ // → {avg,last,last_at,fixes} · later=null (อ่านไม่ได้) หรือแถวเก่าไม่มี prev_qty = ถอดน้ำหนักจากถัวเฉลี่ยปัจจุบัน (ไม่แตะราคาล่าสุด)
  if(later&&!later.length)return {avg:snap.avg==null?null:num(snap.avg),last:snap.last==null?null:num(snap.last),last_at:snap.last_at||null,fixes:[]};
  if(!later||!later.every(L=>L.prev_qty!=null))return {avg:unweighAvg(o&&o.qty,o&&o.avg_cost,voidQty,voidPrice),unknown:true,fixes:[]};
  return replayAfterVoid(snap,voidQty,later);}
async function refreshRows(kind,ids){ // อ่านยอด/ต้นทุนสดของรายการที่กำลังจะเขียน (กันแคชค้างตอนอีกเครื่องเพิ่งรับ/ทำ/นับ) · fail-soft → false
  ids=[...new Set((ids||[]).filter(Boolean))];if(!ids.length)return true;
  const tbl=kind==='item'?'ck_items':'ck_recipes',cols=kind==='item'?'id,qty,avg_cost,last_price,last_price_at':'id,qty,avg_cost,unit_cost';

/* ---------- รูปภาพ (bucket product-images ใช้ร่วมกับแอพนับสต๊อก) ---------- */
function processImage(file,cb){const reader=new FileReader();
  reader.onload=()=>{const im=new Image();
    im.onload=()=>{let w=im.width,h=im.height;const sc=Math.min(1,480/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0,w,h);
      try{cb(cv.toDataURL('image/jpeg',.72))}catch(e){cb(null)}};
    im.onerror=()=>cb(null);im.src=reader.result};
  reader.onerror=()=>cb(null);reader.readAsDataURL(file)}
async function uploadPhoto(file){ // → public URL (throw ถ้าพลาด)
  const dataUrl=await new Promise(res=>processImage(file,res));if(!dataUrl)throw new Error(t('img_fail'));
  const blob=await (await fetch(dataUrl)).blob();const path='ck/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const up=await sb.storage.from('product-images').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;
  return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;}

  inp.onchange=async()=>{const f=inp.files&&inp.files[0];inp.value='';if(!f)return;let url=null;
    try{url=await uploadPhoto(f);const tbl=kind==='item'?'ck_items':'ck_recipes';
      if(id){await db(()=>sb.from(tbl).update({image_url:url}).eq('id',id));const o=kind==='item'?itemById(id):recipeById(id);if(o)o.image_url=url;}
      toast(t('sv_ok'));}
    catch(e){toast(t('sv_err')+((e&&e.message)||e),true);return;}
    if(after)try{after(url)}catch(e){}};
  inp.click();}

const CK_SESS='jjck_sess';                 // sessionStorage — ใบอนุญาตของแท็บนี้
function pwHash(u,p){ return sha256hex(u+'|'+p+'|JJPNL'); }
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const enc=new TextEncoder().encode(str), l=enc.length, bitLen=l*8;
  const total=(Math.ceil((l+1+8)/64))*64, M=new Uint8Array(total); M.set(enc); M[l]=0x80;
  const dv=new DataView(M.buffer);
  dv.setUint32(total-4,bitLen>>>0); dv.setUint32(total-8,Math.floor(bitLen/4294967296));
  const rr=(x,n)=>(x>>>n)|(x<<(32-n)), w=new Array(64);
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){
      const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3), s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+w[t])>>>0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
/* ผู้ใช้ต้องได้รับสิทธิ์แอพครัวกลาง — ยังไม่เคยตั้งสิทธิ์เลย (apps ว่าง) = ไม่ล็อกใคร */
function kitchenAllowed(u){
  const apps=(u&&u.apps&&typeof u.apps==='object')?u.apps:{};
  if(u.role==='admin'||u.role==='owner')return true;
  if(!Object.keys(apps).length)return true;
  const k=apps.kitchen;
  return !!(k&&typeof k==='object'&&Object.keys(k).some(x=>String(k[x]||'').indexOf('v')>=0));
}
/* บัญชีกลาง → โปรไฟล์ของแอพ: ผู้ดูแล/เจ้าของ = owner · ผู้จัดการ หรือมีสิทธิ์หน้าตั้งค่า/บัญชี = manager · ที่เหลือ = warehouse */
function mapCentralProf(u){
  const apps=(u&&u.apps&&typeof u.apps==='object')?u.apps:{};
  const k=apps.kitchen&&typeof apps.kitchen==='object'?apps.kitchen:null;
  const see=x=>!!(k&&String(k[x]||'').indexOf('v')>=0);
  const boss=u.role==='admin'||u.role==='owner';
  const role = boss ? 'owner'
             : (u.role==='manager'||see('set')||see('acc')) ? 'manager' : 'warehouse';
  const brRaw=boss?'':String((k&&k._br)||'');   // เห็นเฉพาะสาขา (apps.kitchen._br) — ผู้ดูแล/เจ้าของ = ทุกสาขา
  const brScope=brScopeOf(brRaw);
  return {username:u.username, name:u.display_name||u.username, role, status:'active',
          auth_uid:'central:'+u.username, branch_ids:brScope||[], brScope, brRaw, perms:{}, central:true,
          unit:u.unit||'ALL', apps:apps, kitchenPerm:k, pass_hash:u.pass_hash};
}
/* _br → รายการสาขาที่เห็น · null = ทุกสาขา · ตั้งไว้แต่ไม่เหลือรหัสที่รู้จัก = [] (ห้ามกลายเป็นทุกสาขา) */
function brScopeOf(raw){
  if(!String(raw||'').trim())return null;
  const ok=['JJLP','JJRD','JJCK','OFFICE'].concat(JJBR.unitCodes());
  return String(raw).split(',').map(x=>x.trim()).filter(x=>ok.includes(x));
}
async function centralUser(username){
  const {data,error}=await sb.from('pnl_users').select('username,display_name,role,unit,active,apps,pass_hash').eq('active',true).eq('username',username).maybeSingle();
  if(error)throw error;return data||null;}
async function sbProfile(){ // โปรไฟล์จากใบอนุญาตของแท็บนี้ (ตรวจกับ pnl_users ใหม่ทุกครั้ง)
  let sess=null;try{ sess=JSON.parse(sessionStorage.getItem(CK_SESS)||'null'); }catch(e){}
  if(!sess||!sess.u)return null;
  const u=await centralUser(sess.u).catch(()=>null);
  if(!u||u.pass_hash!==sess.h)return null;
  return kitchenAllowed(u)?mapCentralProf(u):null;}
const TICKET='jjsso_ticket';   // ใบผ่านจากศูนย์รวมแอพ — อายุ 2 นาที ใช้ครั้งเดียว
const TICKET_TTL=120000;
const KEEP_KEY='jjck_keep',KEEP_MS=12*3600*1000;   // "จำไว้ในเครื่องนี้ 12 ชม."
let LOCK=null;                 // {username,name} ระหว่างล็อกหน้าจอ
function keepRead(){let k=null;try{k=JSON.parse(localStorage.getItem(KEEP_KEY)||'null');}catch(e){}
  if(!k||!k.u||!k.h||!(k.exp>Date.now())){if(k)try{localStorage.removeItem(KEEP_KEY)}catch(e){}return null;}return k;}
function keepOk(username){const k=keepRead();return !!k&&String(k.u).trim().toLowerCase()===String(username||'').trim().toLowerCase();}
function setKeep(username,on,hash){try{(on&&hash)?localStorage.setItem(KEEP_KEY,JSON.stringify({u:username,h:hash,exp:Date.now()+KEEP_MS})):localStorage.removeItem(KEEP_KEY);}catch(e){}}
function unlockedThisTab(){try{return sessionStorage.getItem('jjck_unlocked')==='1'}catch(e){return false}}
function markUnlocked(){try{sessionStorage.setItem('jjck_unlocked','1')}catch(e){}}
function sessWrite(usr){try{ sessionStorage.setItem(CK_SESS,JSON.stringify({u:usr.username,h:usr.pass_hash})); }catch(e){}}
function lockScreen(prof){LOCK={username:prof.username,name:prof.name||prof.username};
  document.getElementById('loginOv').classList.add('on');paintLogin();S.booted=true;setTimeout(()=>{const f=document.getElementById('lgP');f&&f.focus();},60);}
async function doUnlock(){
  const p=document.getElementById('lgP').value;const msg=document.getElementById('lgMsg');msg.textContent='';
  if(!p){msg.textContent=t('lg_pass');return;}
  const btn=document.getElementById('lgGo');btn.disabled=true;
  try{const usr=await centralUser(LOCK.username).catch(()=>null);
    if(!usr||usr.pass_hash!==pwHash(LOCK.username,p)){msg.textContent=t('lk_wrong');return;}
    if(!kitchenAllowed(usr)){LOCK=null;paintLogin();msg.textContent=t('no_perm');return;}
    sessWrite(usr);setKeep(LOCK.username,document.getElementById('lgKeep').checked,usr.pass_hash);
    LOCK=null;markUnlocked();document.getElementById('lgP').value='';await enterApp(mapCentralProf(usr));
  }catch(e){msg.textContent=(e&&e.message)||String(e);}finally{btn.disabled=false;}
}

    if(!kitchenAllowed(usr)){ msg.textContent=t('no_perm'); return; }

    markUnlocked(); LOCK=null;document.getElementById('lgP').value='';await enterApp(mapCentralProf(usr));
  }catch(e){msg.textContent=(e&&e.message)||String(e);}finally{ if(btn)btn.disabled=false; }
}

/* ============================================================
   Components (คืน HTML string · ปุ่มเรียกฟังก์ชัน global หรือ closure ผ่าน hreg)
   ============================================================ */
const HREG=[];
function hreg(fn){HREG.push(fn);return 'hcall('+(HREG.length-1)+',this,event)';}   // onclick="${hreg(()=>…)}"
function hcall(i,el,ev){const f=HREG[i];return f?f(el,ev):undefined;}
const callOf=(fn,arg)=>typeof fn==='function'?hreg(el=>fn(arg,el)):(fn+'('+esc(JSON.stringify(arg))+')');   // esc: ค่าอยู่ใน onclick="…" (HTML ถอด &quot; ให้ก่อนรัน JS)
function pillBar(items,cur,fn,o){ // items [{k,lb,n?,ic?,cls?}] · fn = ชื่อฟังก์ชัน global (รับ k) หรือ function(k)
  o=o||{};return '<div class="pills'+(o.scroll?' scroll':'')+(o.cls?' '+o.cls:'')+'">'+items.map(it=>'<button class="pill'+(it.k===cur?' on':'')+(it.cls?' '+it.cls:'')+'" data-k="'+esc(it.k)+'" onclick="'+callOf(fn,it.k)+'">'+
    (it.ic?it.ic+' ':'')+esc(it.lb)+(it.n!=null?' <span class="bdg">'+esc(it.n)+'</span>':'')+'</button>').join('')+'</div>';}
function dhead(txt,extra){return '<div class="dhead">'+txt+(extra?'<span class="sp">'+extra+'</span>':'')+'</div>';}
function card(title,body,o){o=o||{};return '<div class="card'+(o.cls?' '+o.cls:'')+'"'+(o.id?' id="'+esc(o.id)+'"':'')+(o.onclick?' onclick="'+o.onclick+'"':'')+'>'+
  (title?'<h3>'+title+(o.sp?'<span class="sp">'+o.sp+'</span>':'')+'</h3>':'')+body+'</div>';}
function stepper(id,val,o){ // − [input] ＋ · o:{step,min,max,unit,on (ชื่อฟังก์ชัน global หรือ fn(value,id)),big,ph}
  o=o||{};const cls=o.big?'bq':'skstep';const call=typeof o.on==='function'?hreg(el=>o.on(numIn(el.value),id)):(o.on?o.on+'(numIn(this.value),'+esc(JSON.stringify(id))+')':'');
  return '<div class="'+cls+'" data-step="'+esc(id)+'"><button type="button" onclick="stepBump(\''+esc(id)+'\',-1)">−</button>'+
    '<input id="'+esc(id)+'" type="text" inputmode="decimal" value="'+esc(val==null?'':val)+'" placeholder="'+esc(o.ph||'')+'" data-min="'+esc(o.min==null?0:o.min)+'" data-max="'+esc(o.max==null?'':o.max)+'" data-stepv="'+esc(o.step||1)+'"'+(call?' oninput="'+call+'" onchange="'+call+'"':'')+'>'+
    '<button type="button" class="plus" onclick="stepBump(\''+esc(id)+'\',1)">＋</button>'+(o.unit?'<span class="b" style="flex:none">'+esc(trUnit(o.unit))+'</span>':'')+'</div>';}
function stepBump(id,dir){const inp=document.getElementById(id);if(!inp)return;const st=num(inp.dataset.stepv)||1,mn=inp.dataset.min===''?-Infinity:num(inp.dataset.min),mx=inp.dataset.max===''?Infinity:num(inp.dataset.max);
  let v=rnd4(numIn(inp.value)+dir*st);v=Math.max(mn,Math.min(mx,v));inp.value=v;inp.classList.add('has');inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}));}
function pinnedBar(html,view){ // แถบติดขอบล่าง (null = เอาออก) · view = element ของหน้า (ตั้งต้น = หน้าที่เปิดอยู่)

/* ============================================================
   Boot
   ============================================================ */
(function(){const LOGO=(function(){const m=document.documentElement.innerHTML.match(/var LOGO='(data:image\/png;base64,[^']+)'/);return m?m[1]:'';})();
  if(LOGO){for(const id of ['sbLogo','hdLogo']){const el=document.getElementById(id);if(el)el.src=LOGO;}
    for(const rel of ['icon','apple-touch-icon']){const l=document.createElement('link');l.rel=rel;l.href=LOGO;document.head.appendChild(l);}}})();
async function enterApp(prof){
  S.prof=prof;S.user={id:prof.auth_uid,name:prof.name||prof.username||'?'};
  hideLogin();
  try{await loadAll();}
  catch(e){document.getElementById('view-today').innerHTML='<div class="card"><div class="empty">⚠ '+esc((e&&e.message)||e)+'</div><button class="btn big" onclick="location.reload()">'+t('setup_retry')+'</button></div>';
    applyChrome();S.booted=true;return;}
  applyChrome();
  const savedTab=LS.get('jjck_tab','today');
  show(VIEWS.includes(savedTab)?savedTab:'today');S.booted=true;
  document.dispatchEvent(new CustomEvent('kc:booted'));   // โมดูลที่ต้องทำงานตั้งแต่บูตไม่ว่าเปิดแท็บไหน (ป้าย 🚚 ของส่งสาขา) ฟังอีเวนต์นี้
}
async function boot(){
  document.body.setAttribute('data-lang',LANG);document.documentElement.lang=LANG;
  applyChrome();paintLogin();
  if(!sb){showLogin(t('lg_lib'));return;}
  try{
    /* 1) ใบผ่านสดจากหน้าศูนย์รวมแอพ — กินแล้วลบทิ้ง ตรวจกับ pnl_users จริงอีกชั้น */
    let tk=null;try{ tk=JSON.parse(localStorage.getItem(TICKET)||'null'); }catch(e){}
    if(tk&&tk.u&&tk.h&&tk.t&&(!tk.app||tk.app==='kitchen')&&Date.now()-Number(tk.t)<=TICKET_TTL){
      try{ localStorage.removeItem(TICKET); }catch(e){}
      const usr=await centralUser(tk.u).catch(()=>null);
      if(usr&&usr.pass_hash===tk.h){
        if(!kitchenAllowed(usr)){showLogin(t('no_perm'));return;}
        sessWrite(usr);markUnlocked();await enterApp(mapCentralProf(usr));return;}
    }
    /* 2) ใบอนุญาตของแท็บนี้ (รีเฟรช/ลากหน้าลงแล้วยังอยู่) */
    const prof=await sbProfile();
    if(prof){if(unlockedThisTab()||keepOk(prof.username)){markUnlocked();await enterApp(prof);return;}lockScreen(prof);return;}
    /* 3) "จำไว้ในเครื่องนี้ 12 ชม." — ตรวจรหัสกับ pnl_users ใหม่ทุกครั้ง */
    const kp=keepRead();
    if(kp){const usr=await centralUser(kp.u).catch(()=>null);
      if(usr&&usr.pass_hash===kp.h&&kitchenAllowed(usr)){sessWrite(usr);markUnlocked();await enterApp(mapCentralProf(usr));return;}
      setKeep(null,false);}
    /* 4) เปิดลิงก์ตรง → ต้องกรอกรหัส */
    showLogin();
  }catch(e){showLogin((e&&e.message)||String(e));}
}
/* K2:PTR-BEGIN (byte-identical to jjmk-kitchen.html — ลากหน้าลง = รีเฟรช) */
/* ============================================================
   📲 ดึงหน้าลงเพื่อโหลดใหม่ (มือถือ) — ท่าเดียวกับแอพอื่นในเครือ
   จำเป็นเพราะแอพที่ "เพิ่มไปยังหน้าจอโฮม" ไม่มีปุ่มรีเฟรชของเบราว์เซอร์
   ต่างจากแอพอื่นตรงที่โหลดเฉพาะข้อมูลใหม่ ไม่โหลดทั้งหน้า — อยู่หน้าเดิม ไม่ต้องปลดล็อกซ้ำ
   ============================================================ */
(function(){
  if(!('ontouchstart' in window))return;              // เฉพาะจอสัมผัส
  const GO=70,MAX=108;                                // ดึงเกิน 70px = โหลดใหม่
  const bar=document.createElement('div');bar.id='ptr';bar.setAttribute('aria-hidden','true');
  bar.innerHTML='<div class="ptr-c">⟳</div><span class="ptr-t"></span>';
  document.body.appendChild(bar);
  const txt=bar.querySelector('.ptr-t');
  let y0=0,d=0,on=false,busy=false;
  const atTop=()=>{const e=document.scrollingElement||document.documentElement;
    return (window.pageYOffset||e.scrollTop||0)<=0;};
  /* ดึงอยู่ในกล่องที่เลื่อนได้เอง (ตารางกว้าง/ลิสต์ในกล่อง) ไม่นับเป็นท่าดึงรีเฟรช */
  const inScrollable=node=>{
    for(let n=(node&&node.nodeType===1)?node:null;n&&n!==document.body;n=n.parentElement){
      const oy=getComputedStyle(n).overflowY;
      if((oy==='auto'||oy==='scroll')&&n.scrollHeight>n.clientHeight&&n.scrollTop>0)return true;}
    return false;};
  const blocked=()=>busy||document.getElementById('modalWrap').classList.contains('on')||
    document.getElementById('loginOv').classList.contains('on');
  /* แถบสถานะ iPhone (เปิดจากหน้าจอโฮม) บังวงหมุน — เลื่อนลงตามความสูงแถบสถานะ ค่อย ๆ เพิ่มตอนดึง ซ่อนอยู่ = พ้นจอเหมือนเดิม */
  let SA=0;
  const saTop=()=>{const p=document.createElement('div');p.style.cssText='position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';
    document.body.appendChild(p);const h=p.getBoundingClientRect().height||0;p.remove();return h;};
  const set=px=>{bar.style.transform='translateY('+(px+SA*Math.max(0,Math.min(1,(px+60)/60)))+'px)';};
  document.addEventListener('touchstart',e=>{
    if(blocked()||e.touches.length!==1||!atTop()||inScrollable(e.target)){on=false;return;}
    y0=e.touches[0].clientY;d=0;on=true;SA=saTop();
    bar.classList.add('drag');bar.classList.remove('rdy');
    txt.textContent=t('ptr_pull');
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!on)return;
    d=e.touches[0].clientY-y0;
    if(d<=0){set(-60);return;}                        // เลื่อนขึ้น = ปล่อยให้หน้าเลื่อนตามปกติ
    if(!atTop()){on=false;set(-60);return;}
    if(e.cancelable)e.preventDefault();               // กำลังดึงลงจากบนสุด — กันหน้าเด้ง
    const pull=Math.min(d*0.5,MAX);
    set(pull-60);
    const rdy=d>GO;
    bar.classList.toggle('rdy',rdy);
    txt.textContent=t(rdy?'ptr_go':'ptr_pull');
  },{passive:false});
  const end=async()=>{
    if(!on)return;
    on=false;bar.classList.remove('drag');
    if(d<=GO||busy){set(-60);bar.classList.remove('rdy');return;}
    busy=true;bar.classList.add('sp');txt.textContent=t('ptr_load');set(14);
    try{await reloadAll();}catch(e){}
    busy=false;bar.classList.remove('sp','rdy');set(-60);
  };
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',()=>{on=false;bar.classList.remove('drag','rdy');set(-60);},{passive:true});
})();
/* K2:PTR-END */
document.querySelectorAll('.tabbar button[data-v],.sb-item[data-v]').forEach(b=>{b.addEventListener('click',()=>show(b.dataset.v));});
boot();
