<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100F">
<title>JJ Owner — จริงใจหมูกระทะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   JJ Owner — ศูนย์บัญชาการเจ้าของ จริงใจหมูกระทะ
   ธีม Executive: ดำ-ทอง-แดง (CI เดิม เพิ่มความอลังการ)
   ============================================================ */
:root{
  --red:#C62127; --red-d:#8E1215; --red-deep:#690C0F;
  --gold:#E9B44C; --gold-d:#C9962E; --gold-soft:#F1D6A2; --gold-hi:#F6DFA9;
  --bg:#14100F; --card:#1E1716; --card2:#261D1B;
  --line:rgba(233,180,76,.16); --line-hi:rgba(233,180,76,.42);
  --ink:#F5EFE6; --mut:#A5988B;
  --ok:#4CC38A; --bad:#F26D6D;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Sarabun',sans-serif;color:var(--ink);font-size:15px;min-height:100dvh;
  background:
    radial-gradient(1200px 500px at 50% -100px, rgba(198,33,39,.16), transparent 70%),
    radial-gradient(900px 420px at 85% 20%, rgba(233,180,76,.06), transparent 65%),
    var(--bg);
}
h1,h2,h3,.num{font-family:'Prompt',sans-serif}
.num,td.n{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:15px;color:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--ink);background:#171110;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--gold)}
input::placeholder{color:#6E625A}
input[type=number]{text-align:right}
::-webkit-scrollbar{height:7px;width:7px}
::-webkit-scrollbar-thumb{background:#3A2E28;border-radius:4px}
a{color:var(--gold-soft)}

/* ---------- ตัวหนังสือทองไล่เฉด ---------- */
.gold-txt{
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 48%,#B97F1E 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* ---------- Header / Crest ---------- */
.crest{position:relative;text-align:center;padding:34px 16px 6px}
.crest .ring{
  width:92px;height:92px;border-radius:26px;margin:0 auto;position:relative;
  padding:4px;background:linear-gradient(160deg,var(--gold-hi),#8A621B 60%,var(--gold));
  box-shadow:0 0 0 1px rgba(233,180,76,.25), 0 0 44px rgba(233,180,76,.28), 0 14px 34px rgba(0,0,0,.55);
}
.crest .ring img{width:100%;height:100%;object-fit:cover;border-radius:22px;display:block;background:var(--red)}
.crest h1{margin:16px 0 2px;font-size:clamp(26px,4.4vw,40px);font-weight:800;letter-spacing:.02em}
.crest .sub{color:var(--gold-soft);font-family:'Prompt';font-weight:600;font-size:clamp(12px,1.7vw,14.5px);letter-spacing:.42em;text-transform:uppercase;margin-left:.42em}
.crest .desc{color:var(--mut);font-size:13.5px;margin-top:7px}
.orn{display:flex;align-items:center;gap:14px;justify-content:center;margin:20px auto 4px;max-width:520px;color:var(--gold)}
.orn::before,.orn::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line-hi))}
.orn::after{background:linear-gradient(90deg,var(--line-hi),transparent)}
.orn span{font-size:13px;letter-spacing:.3em;margin-left:.3em}

/* ---------- แถบควบคุม ปี/สาขา ---------- */
.ctrlbar{position:sticky;top:0;z-index:40;background:rgba(20,16,15,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);margin-top:18px}
.ctrl-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px clamp(14px,3vw,28px);flex-wrap:wrap}
.yearbox{display:flex;align-items:center;gap:4px;background:#1B1413;border:1.5px solid var(--line);border-radius:14px;padding:4px}
.yearbox button{width:38px;height:38px;border-radius:10px;font-size:17px;color:var(--gold-soft);font-weight:700}
.yearbox button:hover{background:rgba(233,180,76,.1)}
.yearbox button:disabled{opacity:.25}
.yearbox .ylab{font-family:'Prompt';font-weight:800;font-size:19px;padding:0 10px;min-width:120px;text-align:center}
.yearbox .ylab small{display:block;font-size:10.5px;color:var(--mut);font-weight:500;letter-spacing:.12em}
.brseg{display:flex;background:#1B1413;border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:3px;flex-wrap:wrap}
.brseg button{padding:8px 16px;border-radius:10px;font-weight:600;color:var(--mut);font-size:14px;font-family:'Prompt';white-space:nowrap}
.brseg button.on{background:linear-gradient(160deg,var(--red),var(--red-d));color:#fff;box-shadow:0 3px 12px rgba(198,33,39,.45)}
#syncDot{width:9px;height:9px;border-radius:50%;background:var(--ok);margin-left:auto;flex:none;transition:.2s}
#syncDot.busy{background:var(--gold);animation:pul 1s infinite}
#syncDot.err{background:var(--bad)}
@keyframes pul{50%{opacity:.3}}
.uchip{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px}
.uchip b{color:var(--gold-soft);font-family:'Prompt'}
.lo-btn{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.lo-btn:hover{color:var(--bad);border-color:var(--bad)}

/* ---------- โครงหน้า ---------- */
main{max-width:1180px;margin:0 auto;padding:26px clamp(14px,3vw,28px) 70px}
section{margin-bottom:40px;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
section.vis{opacity:1;transform:none}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
.sec-h h2{margin:0;font-size:clamp(19px,2.6vw,25px);font-weight:800}
.sec-h .en{color:var(--mut);font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;font-family:'Prompt';font-weight:600}
.sec-sub{color:var(--mut);font-size:13px;margin:0 0 16px}

/* ---------- การ์ด ---------- */
.card{position:relative;background:linear-gradient(175deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:var(--r);padding:20px 22px;box-shadow:0 10px 34px rgba(0,0,0,.4)}
.card.gold{border:1px solid transparent;background:
  linear-gradient(175deg,var(--card2),var(--card)) padding-box,
  linear-gradient(150deg,rgba(233,180,76,.75),rgba(233,180,76,.08) 42%,rgba(233,180,76,.5)) border-box}
.card h3{margin:0 0 14px;font-size:15.5px;font-weight:700;color:var(--gold-soft);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{color:var(--mut);font-weight:500;font-size:12px;margin-left:auto}

/* ---------- HERO KPI ---------- */
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:980px){.hero{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.hero{grid-template-columns:1fr}}
.kpi{position:relative;overflow:hidden;padding:22px 22px 18px}
.kpi::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(233,180,76,.07) 46%,transparent 60%);
  transform:translateX(-100%);animation:shine 5.5s ease-in-out infinite}
@keyframes shine{12%,100%{transform:translateX(100%)}}
.kpi .lab{font-size:12.5px;font-weight:700;color:var(--mut);letter-spacing:.06em;font-family:'Prompt';display:flex;align-items:center;gap:7px}
.kpi .lab .ic{font-size:15px}
.kpi .v{font-family:'Prompt';font-weight:800;font-size:clamp(26px,3vw,34px);line-height:1.15;margin:8px 0 2px;white-space:nowrap}
.kpi .v small{font-size:.52em;font-weight:600;color:var(--mut);-webkit-text-fill-color:var(--mut)}
.kpi .foot{font-size:12px;color:var(--mut);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:20px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;font-family:'Prompt';border-radius:99px;padding:3px 9px}
.chip.up{background:rgba(76,195,138,.14);color:var(--ok)}
.chip.dn{background:rgba(242,109,109,.13);color:var(--bad)}
.chip.mid{background:rgba(165,152,139,.14);color:var(--mut)}
.chip.gd{background:rgba(233,180,76,.14);color:var(--gold)}

.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:#1B1413;border:1px solid var(--line);border-radius:13px;padding:9px 15px;font-size:12.5px;color:var(--mut)}
.stat b{color:var(--ink);font-family:'Prompt';font-size:14px;display:block;margin-top:1px}
.stat b.gold-txt{display:block}

/* ---------- กราฟ ---------- */
.chartbox{position:relative;height:clamp(280px,38vh,400px);width:100%}
.chartbox.sm{height:clamp(230px,30vh,300px)}
.chartbox canvas{width:100%!important;height:100%!important}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:stretch}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* ---------- ตาราง ---------- */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:860px}
th{font-family:'Prompt';font-weight:700;font-size:11.5px;color:var(--gold-soft);letter-spacing:.05em;
  background:rgba(233,180,76,.07);padding:11px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th.right,td.n{text-align:right}
td{padding:10px 12px;border-bottom:1px solid rgba(233,180,76,.07);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.dim td{opacity:.55}
tr.tot td{background:rgba(233,180,76,.08);font-weight:800;font-family:'Prompt';border-top:1.5px solid var(--line-hi);font-size:14px}
td .tag{font-size:10px;font-weight:700;font-family:'Prompt';color:var(--gold);background:rgba(233,180,76,.12);border-radius:6px;padding:2px 7px;margin-left:6px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
tbody tr:hover td{background:rgba(233,180,76,.04)}

/* ---------- ผ่อนชำระ ---------- */
.inst-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
@media(max-width:760px){.inst-sum{grid-template-columns:1fr}}
.inst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.inst{padding:18px 20px 16px}
.inst .top{display:flex;align-items:flex-start;gap:10px}
.inst .nm{font-family:'Prompt';font-weight:700;font-size:16.5px}
.inst .who{color:var(--mut);font-size:12px;margin-top:2px}
.inst .edit{margin-left:auto;flex:none;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:9px;padding:4px 10px}
.inst .edit:hover{color:var(--gold);border-color:var(--gold)}
.pbar{height:10px;border-radius:99px;background:#120D0C;border:1px solid rgba(233,180,76,.12);overflow:hidden;margin:14px 0 8px}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8A621B,var(--gold) 60%,var(--gold-hi));
  box-shadow:0 0 12px rgba(233,180,76,.5);transition:width 1s ease}
.inst.done .pbar i{background:linear-gradient(90deg,#1E7A50,var(--ok))}
.inst .prow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.inst .prow b{color:var(--ink);font-family:'Prompt'}
.inst .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--mut)}
.inst .grid b{display:block;color:var(--ink);font-family:'Prompt';font-size:14.5px}
.badge-done{font-size:11px;font-weight:700;font-family:'Prompt';color:var(--ok);background:rgba(76,195,138,.13);border-radius:99px;padding:3px 10px}
.badge-late{font-size:11px;font-weight:700;font-family:'Prompt';color:var(--gold);background:rgba(233,180,76,.13);border-radius:99px;padding:3px 10px}
.addbtn{display:inline-flex;align-items:center;gap:8px;font-family:'Prompt';font-weight:700;font-size:14px;color:#1A1207;
  background:linear-gradient(160deg,var(--gold-hi),var(--gold) 55%,var(--gold-d));border-radius:12px;padding:10px 20px;
  box-shadow:0 6px 20px rgba(233,180,76,.35)}
.addbtn:active{transform:scale(.98)}
.ghost{font-size:13px;font-weight:600;color:var(--gold-soft);border:1.5px solid var(--line-hi);border-radius:12px;padding:9px 18px;font-family:'Prompt'}
.ghost:hover{background:rgba(233,180,76,.08)}
.empty{text-align:center;color:var(--mut);padding:34px 12px;font-size:13.5px}

/* ---------- Modal ---------- */
#modalWrap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(10,7,6,.78);backdrop-filter:blur(6px);padding:16px}
#modalWrap.on{display:flex}
#modalBox{width:min(480px,100%);max-height:92dvh;overflow-y:auto;background:linear-gradient(175deg,var(--card2),var(--card));
  border:1px solid var(--line-hi);border-radius:20px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#modalBox h3{margin:0 0 16px;font-family:'Prompt';font-size:18px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px;font-family:'Prompt'}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns{display:flex;gap:10px;margin-top:18px}
.mbtns .addbtn{flex:1;justify-content:center}
.del-link{font-size:12.5px;color:var(--bad);opacity:.85}

/* ---------- Login ---------- */
#loginOv{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:var(--bg);padding:16px;
  background:radial-gradient(900px 480px at 50% 18%, rgba(198,33,39,.2), transparent 70%),var(--bg)}
.logincard{width:min(400px,100%);text-align:center;background:linear-gradient(175deg,var(--card2),var(--card));
  border:1px solid var(--line-hi);border-radius:24px;padding:36px 30px;box-shadow:0 30px 90px rgba(0,0,0,.65)}
.logincard .ring{width:74px;height:74px;border-radius:21px;margin:0 auto 14px;padding:3px;
  background:linear-gradient(160deg,var(--gold-hi),#8A621B 60%,var(--gold));box-shadow:0 0 34px rgba(233,180,76,.3)}
.logincard .ring img{width:100%;height:100%;object-fit:cover;border-radius:18px;display:block;background:var(--red)}
.logincard h2{margin:0;font-size:21px;font-weight:800}
.logincard .fld{text-align:left}
.logincard .msg{font-size:12.5px;color:var(--bad);margin-top:10px;min-height:16px}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:120;background:#2A211E;color:var(--ink);
  border:1px solid var(--line-hi);border-radius:13px;padding:11px 20px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;max-width:88vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--bad);color:#FFD9D9}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.backlink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);text-decoration:none;margin-top:24px}
.backlink:hover{color:var(--gold-soft)}
footer{text-align:center;color:#6E625A;font-size:12px;padding:10px 16px 46px}
footer .orn{margin-bottom:14px}
</style>
</head>
<body>

<div id="loginOv"></div>

<div id="app" style="display:none">
  <div class="crest">
    <div class="ring"><img id="crestLogo" alt="จริงใจหมูกระทะ"></div>
    <h1 class="gold-txt">จริงใจหมูกระทะ</h1>
    <div class="sub">Owner Executive Suite</div>
    <div class="desc">ภาพรวมยอดขายทั้งปี · กำไรสะสม · งบกำไรขาดทุน · การผ่อนชำระ</div>
    <div class="orn"><span>✦ ✦ ✦</span></div>
  </div>

  <div class="ctrlbar"><div class="ctrl-in">
    <div class="yearbox">
      <button onclick="chYear(-1)" title="ปีก่อนหน้า">‹</button>
      <div class="ylab" id="yearLab"></div>
      <button id="yNext" onclick="chYear(1)" title="ปีถัดไป">›</button>
    </div>
    <div class="brseg" id="brSeg"></div>
    <div class="uchip" style="margin-left:auto"><span id="uName"></span><button class="lo-btn" onclick="logout()">ออกจากระบบ</button></div>
    <div id="syncDot"></div>
  </div></div>

  <main id="mainBody"><div class="spin"></div></main>

  <footer>
    <div class="orn"><span>✦</span></div>
    JJ Owner Executive Suite — จริงใจหมูกระทะ · ข้อมูลจากระบบ JJ P&amp;L (Supabase)<br>
    <a class="backlink" href="jjmk-pnl.html">← กลับสู่ระบบบัญชี P&amp;L</a>
  </footer>
</div>

<div id="modalWrap" onclick="if(event.target===this)closeModal()"><div id="modalBox"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
   JJ Owner — จริงใจหมูกระทะ (อ่านข้อมูลจากระบบ JJ P&L เดิม)
   สูตรคำนวณตรงกับ jjmk-pnl.html:
     ยอดขายรวม VAT = POS เช้า+เย็น · รายได้ = ยอดขาย×100/107 + Grab + Lineman

/* ---------- SHA-256 (เหมือน jjmk-pnl.html เพื่อใช้ login ร่วมกัน) ---------- */
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const enc=new TextEncoder().encode(str);
  const l=enc.length, bitLen=l*8;
  const withOne=l+1, total=(Math.ceil((withOne+8)/64))*64;
  const M=new Uint8Array(total); M.set(enc); M[l]=0x80;
  const dv=new DataView(M.buffer);
  dv.setUint32(total-4, bitLen>>>0); dv.setUint32(total-8, Math.floor(bitLen/4294967296));
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  const w=new Array(64);
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){
      const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3);
      const s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[t]+w[t])>>>0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function pwHash(u,p){ return sha256hex(u+'|'+p+'|JJPNL'); }

let busyCount=0;
function setBusy(b){ busyCount+=b?1:-1; if(busyCount<0)busyCount=0;
  const d=document.getElementById('syncDot'); if(d)d.className=busyCount>0?'busy':''; }
async function api(method,path,body,prefer,quiet){
  const {url,key}=cfg();
  setBusy(true);
  try{
    const r=await fetch(url+'/rest/v1/'+path,{
      method,
      headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json',
        'Prefer':prefer||(method==='GET'?'':'return=representation')},
      body:body?JSON.stringify(body):undefined
    });
    if(!r.ok){ const t=await r.text(); throw new Error(r.status+' '+t.slice(0,180)); }
    if(method!=='GET'){
      const what=String(path).startsWith('pnl_owner_monthly')?'ยอดใส่เอง (Owner)':'ผ่อนชำระ (Owner)';
      api('POST','pnl_activity_log',{username:(S.user&&S.user.username)||'ไม่ระบุ',branch:'OWNER',
        action:(method==='DELETE'?'ลบ':'บันทึก')+what,detail:String(path).slice(0,150)},'return=minimal',true).catch(()=>{});
    }
    if(r.status===204) return [];
    const txt=await r.text();
    return txt?JSON.parse(txt):[];
  }catch(e){
    if(!quiet){ const d=document.getElementById('syncDot'); if(d)d.className='err'; toast('โหลด/บันทึกไม่สำเร็จ: '+e.message,true); }
    throw e;
  }finally{ setBusy(false); }
}
const sel =(t,q)=>api('GET',t+'?'+q);

async function selAll(t,q,page){ // ดึงครบทุกแถวแม้เกินเพดานต่อคำขอ (q ต้องมี order)
  page=page||1000; const out=[]; let off=0;
  for(;;){ const r=await sel(t,`${q}&limit=${page}&offset=${off}`); out.push(...r); if(r.length<page)return out; off+=page; }
}

/* ============ Login (ใช้บัญชี pnl_users ร่วมกับระบบ P&L) ============ */
async function authGate(){
  const {url,key}=cfg();
  let probe;
  try{
    const r=await fetch(url+'/rest/v1/pnl_users?select=id&limit=1',{headers:{apikey:key,Authorization:'Bearer '+key}});
    if(!r.ok)throw 0;
    probe=await r.json();
  }catch(e){ // ยังไม่ได้เปิดระบบผู้ใช้ → เข้าได้เลย (โหมดเดิม)
    S.user={username:'legacy',display_name:'เจ้าของ',role:'admin',perms:{},legacy:true};
    return true;
  }
  if(probe.length===0){ showLogin(true); return false; }
  const saved=LS.get('jjpnl_auth',null);
  const IDLE_MS=30*60*1000;
  if(saved&&saved.u){
    if(!saved.t||Date.now()-saved.t>IDLE_MS){ LS.set('jjpnl_auth',null); }
    else{
      try{
        const rows=await selQ('pnl_users','select=*&username=eq.'+encodeURIComponent(saved.u));
        const u=rows[0];
        if(u&&u.active&&u.pass_hash===saved.h){ setUser(u); return true; }
      }catch(e){}
      LS.set('jjpnl_auth',null);
    }
  }
  showLogin(false);
  return false;
}
function setUser(u){
  S.user={id:u.id,username:u.username,display_name:u.display_name,role:u.role,perms:u.perms||{}};
  LS.set('jjpnl_auth',{u:u.username,h:u.pass_hash,t:Date.now()});
  startIdleWatch();
}
function touchAuth(){
  if(!S.user||S.user.legacy)return;
  const now=Date.now();

    selAll('pnl_cash_expenses',`select=d,branch,amount&d=gte.${from}&d=lte.${to}&order=d,id`),
    selAll('pnl_shopee',`select=d,branch,price,qty,shipping&d=gte.${from}&d=lte.${to}&order=d,id`),
    selAll('pnl_extra_expenses',`select=d,branch,amount&d=gte.${from}&d=lte.${to}&order=d,id`),

    selAll('pnl_fixed_monthly',`select=branch,month,item_id,amount&${mF}&order=month,item_id`),

/* ============ คำนวณรายเดือน (สูตรเดียวกับหน้า P&L) ============ */
function keepBr(b){ return S.br==='ALL'||b===S.br; }
/* สาขา "ส่วนกลาง" (ออฟฟิศ) — มีเฉพาะรายจ่าย: รวมต้นทุนในยอดรวม แต่ไม่โชว์เป็นสาขาให้เลือก/เทียบ */
function isCen(code){ const b=S.branches.find(x=>x.code===code); return !!(b&&b.is_central); }
function realBranches(){ return S.branches.filter(b=>!b.is_central); }
/* ยอดใส่เอง (pnl_owner_monthly): เดือนไหนเจ้าของคีย์มือ ตัวเลขมือชนะค่าคำนวณ
   มุมมองทุกสาขา → ใช้แถว branch='ALL' ก่อน ไม่มีก็รวมแถวรายสาขา · มุมมองสาขา → เฉพาะแถวสาขานั้น */
function pickManual(list,mo){
  const rs=(list||[]).filter(r=>r.month===mo&&(r.sales!=null||r.profit!=null));
  if(!rs.length)return null;
  const V=(r,k)=>r[k]!=null?num(r[k]):null;
  if(S.br!=='ALL'){
    const r=rs.find(x=>x.branch===S.br);
    return r?{sales:V(r,'sales'),profit:V(r,'profit')}:null;
  }
  const all=rs.find(x=>x.branch==='ALL');
  if(all)return {sales:V(all,'sales'),profit:V(all,'profit')};
  const br=rs.filter(x=>x.branch!=='ALL');
  if(!br.length)return null;
  const sum=k=>br.some(x=>x[k]!=null)?br.reduce((a,x)=>a+(x[k]!=null?num(x[k]):0),0):null;
  return {sales:sum('sales'),profit:sum('profit')};
}
function buildMonths(y,bundle){
  const M={};
  const get=mo=>M[mo]??(M[mo]={pos:0,grab:0,lineman:0,vcSup:0,cash:0,shopee:0,extra:0,byCat:{},fixByBr:{},hRev:0,hasH:false,hItems:{}});
  const addCat=(t,cat,a)=>{t.byCat[cat]=(t.byCat[cat]||0)+a;};
  bundle.inc.forEach(r=>{ if(!keepBr(r.branch))return;
    get(r.d.slice(0,7)).pos+=num(r.sales_pos_am)+num(r.sales_pos_pm); });
  bundle.meta.forEach(r=>{ if(!keepBr(r.branch))return;
    const t=get(r.month); t.grab+=num(r.grab); t.lineman+=num(r.lineman); });
  bundle.exp.forEach(r=>{ if(!keepBr(r.branch))return;
    const a=num(r.amount); if(!a)return;
    const t=get(r.d.slice(0,7)); t.vcSup+=a;
    addCat(t,(S.supById[r.supplier_id]||{}).category||'อื่นๆ',a); });
  bundle.cash.forEach(r=>{ if(!keepBr(r.branch))return;
    const a=num(r.amount); if(!a)return;
    const t=get(r.d.slice(0,7)); t.cash+=a; addCat(t,'เงินสดหน้าร้าน',a); });
  bundle.shop.forEach(r=>{ if(!keepBr(r.branch))return;
    const a=num(r.price)*num(r.qty)+num(r.shipping); if(!a)return;
    const t=get(r.d.slice(0,7)); t.shopee+=a; addCat(t,'Shopee',a); });
  bundle.extra.forEach(r=>{ if(!keepBr(r.branch))return;
    get(r.d.slice(0,7)).extra+=num(r.amount); });
  const fixOv={}; // override: month|branch|item_id -> amount
  bundle.fixm.forEach(r=>{ fixOv[r.month+'|'+r.branch+'|'+r.item_id]=r.amount; });
  bundle.hist.forEach(r=>{ if(!keepBr(r.branch))return;
    const t=get(r.month); t.hRev+=num(r.revenue); t.hasH=true; });
  bundle.histI.forEach(r=>{ if(!keepBr(r.branch))return;
    get(r.month).hItems[r.name]=(get(r.month).hItems[r.name]||0)+num(r.amount); });

  const brs=S.br==='ALL'?S.branches.map(b=>b.code):[S.br];
  const out=[];
  for(let m=1;m<=12;m++){
    const mo=y+'-'+String(m).padStart(2,'0');
    const t=M[mo];
    const row={mo,mIdx:m-1,src:null,incVat:0,revenue:0,vc:0,fix:null,extra:0,net:null,byCat:{},grab:0,lineman:0};
    if(t&&t.pos>0){ // เดือนที่มีข้อมูลจริงรายวัน
      row.src='real';
      row.incVat=t.pos+ t.grab + t.lineman; // ยอดขายรวม (POS รวม VAT + เดลิเวอรี่)
      row.posVat=t.pos;
      row.grab=t.grab; row.lineman=t.lineman;
      row.revenue=t.pos*100/107+t.grab+t.lineman;
      row.vc=t.vcSup+t.cash+t.shopee;
      row.extra=t.extra;
      row.byCat=t.byCat;
      // Fix cost: override รายเดือน ?? ค่าตั้งต้น (เฉพาะรายการ active ของสาขา)
      let fx=0;
      brs.forEach(b=>{
        S.fixed.filter(f=>f.branch===b&&f.active).forEach(f=>{
          const k=mo+'|'+b+'|'+f.id;
          const v=(k in fixOv)?num(fixOv[k]):(f.default_amount!=null?num(f.default_amount):null);
          if(v!=null)fx+=v;
        });
      });
      row.fix=fx;
      row.net=row.revenue-row.vc-fx-row.extra;
    }else if(t&&t.hasH&&t.hRev>0){ // ข้อมูลย้อนหลัง (มีเฉพาะรายได้ + VC)
      row.src='hist';
      row.revenue=t.hRev;
      const cats={};
      for(const[nm,a]of Object.entries(t.hItems)){
        const cat= nm==='กะเช้า'||nm==='กะเย็น'?'เงินสดหน้าร้าน': nm==='Shopee'?'Shopee':
          ((S.supByName[nm]||{}).category||'อื่นๆ');
        cats[cat]=(cats[cat]||0)+a;
        row.vc+=a;
      }
      row.byCat=cats;
    }
    // ยอดใส่เอง ชนะค่าคำนวณ (ใส่เฉพาะช่องที่คีย์ — ช่องว่างใช้ค่าระบบ)
    const man=pickManual(bundle.manual,mo);
    if(man){
      row.manual=true;
      if(man.sales!=null){ row.incVat=man.sales; row.revenue=man.sales; }
      if(man.profit!=null) row.net=man.profit;
      if(!row.src) row.src='manual';
    }
    out.push(row);
  }
  return out;
}
/* รายได้แยกสาขา (ไว้วาดกราฟเทียบสาขา — ไม่รวมส่วนกลางที่ไม่มีรายรับ) */
function buildBranchSeries(y,bundle){
  const res={};
  realBranches().forEach(b=>res[b.code]=new Array(12).fill(0));
  bundle.inc.forEach(r=>{
    const m=Number(r.d.slice(5,7))-1;
    if(res[r.branch])res[r.branch][m]+=(num(r.sales_pos_am)+num(r.sales_pos_pm))*100/107;
  });
  bundle.meta.forEach(r=>{
    const m=Number(r.month.slice(5,7))-1;
    if(res[r.branch])res[r.branch][m]+=num(r.grab)+num(r.lineman);
  });
  bundle.hist.forEach(r=>{
    const m=Number(r.month.slice(5,7))-1;
    if(res[r.branch]&&res[r.branch][m]===0)res[r.branch][m]+=num(r.revenue);
  });
  return res;
}
/* สรุปปีก่อน (รายได้รวม เทียบ YoY — ยอดใส่เองของปีก่อนก็ชนะค่าคำนวณเช่นกัน) */
function prevYearTotals(py,pb){
  let rev=0,inc=0;
  const per={}; // month->pos
  pb.inc.forEach(r=>{ if(!keepBr(r.branch))return;
    const mo=r.d.slice(0,7); per[mo]=(per[mo]||0)+num(r.sales_pos_am)+num(r.sales_pos_pm); });
  const meta={};
  pb.meta.forEach(r=>{ if(!keepBr(r.branch))return;
    meta[r.month]=(meta[r.month]||0)+num(r.grab)+num(r.lineman); });
  const histPer={};
  pb.hist.forEach(r=>{ if(!keepBr(r.branch))return; histPer[r.month]=(histPer[r.month]||0)+num(r.revenue); });
  for(let m=1;m<=12;m++){
    const mo=py+'-'+String(m).padStart(2,'0');
    const man=pickManual(pb.manual,mo);
    if(man&&man.sales!=null){ rev+=man.sales; inc+=man.sales; continue; }
    const pos=per[mo]||0, dl=meta[mo]||0;
    if(pos>0){ rev+=pos*100/107+dl; inc+=pos+dl; }
    else if(histPer[mo]){ rev+=histPer[mo]; inc+=histPer[mo]; }
  }
  return {rev,inc};
}

}

    if(upRows.length)await ups('pnl_owner_monthly',upRows,'branch,month');

/* ============ ผ่อนชำระ ============ */
function instCalc(r){
  const monthly=num(r.monthly_amount), nTot=Math.max(1,parseInt(r.months_total)||1);
  const total=num(r.total_amount)||monthly*nTot;
  const cur=todayStr().slice(0,7);
  let elapsed=0;
  if(r.start_month){
    const [sy,sm]=r.start_month.split('-').map(Number);
    const [cy,cm]=cur.split('-').map(Number);
    elapsed=(cy-sy)*12+(cm-sm)+1;
  }
  let paidN=(r.months_paid!=null&&r.months_paid!=='')?parseInt(r.months_paid):elapsed;
  paidN=Math.min(Math.max(paidN,0),nTot);
  const paidAmt=Math.min(paidN*monthly+num(r.paid_extra),total);
  const remain=Math.max(total-paidAmt,0);
  const done=paidN>=nTot||remain<=0;
  let endM=null;
  if(r.start_month){
    const [sy,sm]=r.start_month.split('-').map(Number);
    const t=sy*12+(sm-1)+nTot-1;
    endM=Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0');
  }
  return {monthly,nTot,total,paidN,paidAmt,remain,done,endM};
}

  <div class="f2">
    <div class="fld"><label>ค่างวด/เดือน (บาท) *</label><input id="ifMonthly" type="number" inputmode="decimal" value="${v('monthly_amount')}" placeholder="0"></div>
    <div class="fld"><label>จำนวนงวดทั้งหมด *</label><input id="ifN" type="number" inputmode="numeric" value="${v('months_total')}" placeholder="เช่น 48"></div>
  </div>
  <div class="f2">
    <div class="fld"><label>งวดแรก (เดือน) *</label><input id="ifStart" type="month" value="${v('start_month')}"></div>
    <div class="fld"><label>ยอดรวมสัญญา (บาท)</label><input id="ifTotal" type="number" inputmode="decimal" value="${v('total_amount')}" placeholder="ว่าง = ค่างวด×จำนวนงวด"></div>
  </div>
  <div class="f2">
    <div class="fld"><label>จ่ายแล้ว (งวด)</label><input id="ifPaid" type="number" inputmode="numeric" value="${r&&r.months_paid!=null?r.months_paid:''}" placeholder="ว่าง = นับอัตโนมัติ"></div>
    <div class="fld"><label>โปะเพิ่ม (บาท)</label><input id="ifExtra" type="number" inputmode="decimal" value="${v('paid_extra')}" placeholder="0"></div>
  </div>
  <div class="fld"><label>หมายเหตุ</label><input id="ifNote" value="${v('note')}"></div>
  ${r?`<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer">
    <input type="checkbox" id="ifActive" style="width:auto" ${r.active?'checked':''}> ใช้งานอยู่ (เอาติ๊กออก = ปิดสัญญา/ย้ายไปประวัติ)</label>`:''}
  <div class="mbtns">
    <button class="ghost" onclick="closeModal()">ยกเลิก</button>
    <button class="addbtn" onclick="instSave(${r?r.id:'null'})">บันทึก</button>
  </div>
  ${r?`<div style="text-align:center;margin-top:14px"><button class="del-link" onclick="instDel(${r.id})">ลบรายการนี้ถาวร</button></div>`:''}
  `);
  setTimeout(()=>{const f=document.getElementById('ifName');f&&f.focus();},60);
}
async function instSave(id){
  const g=i=>document.getElementById(i);
  const name=(g('ifName').value||'').trim();
  const monthly=num(g('ifMonthly').value), nTot=parseInt(g('ifN').value)||0;
  const start=g('ifStart').value;
  if(!name||monthly<=0||nTot<1||!start){toast('กรอก ชื่อ, ค่างวด, จำนวนงวด และงวดแรก ให้ครบก่อนครับ',true);return;}
  const body={
    name, lender:(g('ifLender').value||'').trim(), branch:g('ifBranch').value||null,
    monthly_amount:monthly, months_total:nTot, start_month:start,
    total_amount:g('ifTotal').value?num(g('ifTotal').value):null,
    months_paid:g('ifPaid').value===''?null:Math.max(0,parseInt(g('ifPaid').value)||0),
    paid_extra:num(g('ifExtra').value)||0,
    note:(g('ifNote').value||'').trim(),
    active: id?!!(g('ifActive')&&g('ifActive').checked):true
  };
  try{
    if(id)await upd('pnl_installments','id=eq.'+id,body);
    else await ins('pnl_installments',body);
    closeModal(); toast('บันทึกเรียบร้อย ✓');
    await loadInstallments(); render();
  }catch(e){}
}
async function instDel(id){
  if(!confirm('ลบรายการผ่อนนี้ถาวร?'))return;
  try{
    await delQ('pnl_installments','id=eq.'+id);
    closeModal(); toast('ลบแล้ว');
    await loadInstallments(); render();
  }catch(e){}
}

/* ============ กราฟ ============ */
function killChart(k){ if(S.charts[k]){S.charts[k].destroy();delete S.charts[k];} }
function drawCharts(rows,brSeries){
  if(typeof Chart==='undefined')return;
  Chart.defaults.color='#A5988B';
  Chart.defaults.font.family="'Prompt',sans-serif";
  Chart.defaults.borderColor='rgba(233,180,76,.08)';
  const labels=TH_M;
  const money=v=>'฿'+fmt(v,0);
  /* --- กราฟหลัก: รายได้/เดือน + กำไรสะสม --- */
  killChart('main');
  const cm=document.getElementById('chMain');
  if(cm){
    const revD=rows.map(r=>r.src?r.revenue:null);
    let cum=0; const cumD=rows.map(r=>{ if(r.net!=null){cum+=r.net;return cum;} return r.src?cum:null; });
    const ctx=cm.getContext('2d');
    const grad=ctx.createLinearGradient(0,0,0,360);
    grad.addColorStop(0,'rgba(198,33,39,.95)');grad.addColorStop(1,'rgba(105,12,15,.75)');
    S.charts.main=new Chart(cm,{
      data:{labels,datasets:[
        {type:'line',label:'กำไรสะสม',data:cumD,yAxisID:'y2',borderColor:'#E9B44C',
          backgroundColor:'rgba(233,180,76,.12)',borderWidth:3,pointRadius:4,pointBackgroundColor:'#F6DFA9',
          pointBorderColor:'#8A621B',tension:.35,spanGaps:true,fill:false},
        {type:'bar',label:'รายได้/เดือน',data:revD,backgroundColor:grad,borderRadius:9,
          hoverBackgroundColor:'#E9B44C',maxBarThickness:46}
      ]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{labels:{usePointStyle:true,boxWidth:8,padding:18}},
          tooltip:{backgroundColor:'#241B19',borderColor:'rgba(233,180,76,.4)',borderWidth:1,padding:12,titleFont:{weight:'700'},
            callbacks:{label:c=>` ${c.dataset.label}: ${money(c.parsed.y)}`}}},
        scales:{y:{ticks:{callback:money},grid:{color:'rgba(233,180,76,.07)'}},
          y2:{position:'right',ticks:{callback:money},grid:{drawOnChartArea:false}},
          x:{grid:{display:false}}}}
    });
  }
  /* --- เทียบสาขา --- */
  killChart('br');
  const cb=document.getElementById('chBr');
  if(cb){
    const cols=['#C62127','#E9B44C','#5E96A8','#8AA05E'];
    S.charts.br=new Chart(cb,{type:'bar',
      data:{labels,datasets:realBranches().map((b,i)=>({label:BRNAME[b.code]||b.code,
        data:(brSeries[b.code]||[]).map(v=>v||null),backgroundColor:cols[i%cols.length],borderRadius:6,maxBarThickness:26}))},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{usePointStyle:true,boxWidth:8}},
          tooltip:{backgroundColor:'#241B19',borderColor:'rgba(233,180,76,.4)',borderWidth:1,
            callbacks:{label:c=>` ${c.dataset.label}: ${money(c.parsed.y)}`}}},
        scales:{y:{ticks:{callback:money},grid:{color:'rgba(233,180,76,.07)'}},x:{grid:{display:false}}}}
    });
  }
  /* --- โดนัทโครงสร้างงบ --- */
  killChart('dou');
  const cd=document.getElementById('chDou');
  if(cd){
    const has=rows.filter(r=>r.src), real=rows.filter(r=>r.src==='real');
    const cats={};
    has.forEach(r=>{for(const[c,a]of Object.entries(r.byCat))cats[c]=(cats[c]||0)+a;});
    const fixT=real.reduce((a,r)=>a+r.fix,0), exT=real.reduce((a,r)=>a+r.extra,0), net=real.reduce((a,r)=>a+r.net,0);
    const items=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
    if(fixT)items.push(['Fix cost',fixT]);
    if(exT)items.push(['รายจ่ายอื่นๆ',exT]);
    if(net>0)items.push(['กำไรสุทธิ',net]);
    S.charts.dou=new Chart(cd,{type:'doughnut',
      data:{labels:items.map(x=>x[0]),
        datasets:[{data:items.map(x=>x[1]),
          backgroundColor:items.map(x=>x[0]==='กำไรสุทธิ'?'#4CC38A':x[0]==='Fix cost'?'#E9B44C':x[0]==='รายจ่ายอื่นๆ'?'#6E625A':catColor(x[0])),
          borderColor:'#1E1716',borderWidth:3,hoverOffset:8}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
        plugins:{legend:{position:'right',labels:{usePointStyle:true,boxWidth:8,font:{size:11}}},
          tooltip:{backgroundColor:'#241B19',borderColor:'rgba(233,180,76,.4)',borderWidth:1,
            callbacks:{label:c=>` ${c.label}: ${money(c.parsed)}`}}}}
    });
  }
}

/* ============ เอฟเฟกต์ ============ */
function countUpAll(){
  document.querySelectorAll('.cu').forEach(el=>{
    const target=Number(el.dataset.v)||0;
    const t0=performance.now(), dur=1100;
    const step=t=>{
      const p=Math.min((t-t0)/dur,1), e=1-Math.pow(1-p,3);
      el.textContent='฿'+fmtI(target*e);
      if(p<1)requestAnimationFrame(step);
      else el.textContent='฿'+fmtI(target);
    };
    requestAnimationFrame(step);
  });
}
function revealSections(){
  const obs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target);} }),{threshold:.08});
  document.querySelectorAll('section').forEach(s=>obs.observe(s));
}

/* ============ Boot ============ */
async function enter(){
  document.getElementById('loginOv').style.display='none';
  if(S.user&&!S.user.legacy&&S.user.role!=='admin'){ showLogin(false,true); return; }
  document.getElementById('app').style.display='';
  try{
    await loadCore();
    await loadInstallments();
    render();
  }catch(e){
    document.getElementById('mainBody').innerHTML=`<div class="card"><div class="empty">เชื่อมต่อฐานข้อมูลไม่ได้ — ${esc(e.message)}</div></div>`;
  }
}
(async function boot(){
  document.getElementById('crestLogo').src=LOGO_B64;
  for(const rel of ['icon','apple-touch-icon']){const l=document.createElement('link');l.rel=rel;l.href=LOGO_B64;document.head.appendChild(l);}
  const ok=await authGate();
  if(ok)enter();
})();
</script>
