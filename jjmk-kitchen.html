    '<div class="fld"><label>'+t('it_min')+'</label><input inputmode="decimal" value="'+(d.min_qty==null?'':d.min_qty)+'" onchange="IT_DRAFT.min_qty=this.value===\'\'?null:num(this.value)"></div></div>';
  h+=itPacksHtml(d);
  {const tmp={unit:d.unit,buy_unit:d.buy_unit,buy_qty:d.buy_qty,packs:(d.packs||[]).map(p=>({u:p.u,q:num(p.q)})).filter(p=>p.u&&p.q>0)};
   h+='<div class="fld"><label>📋 '+t('cu_lb')+'</label>'+(S.scSql===false?'<div class="xs mut">'+t('cu_need_sql')+'</div>':
     '<select onchange="IT_DRAFT.count_unit=this.value"><option value="">'+esc(t('cu_auto',{u:trUnit(countUnitOf(tmp))}))+'</option>'+
     itemUnits(tmp).map(u=>'<option value="'+esc(u)+'"'+(d.count_unit===u?' selected':'')+'>'+esc(trUnit(u))+'</option>').join('')+'</select>'+
     '<div class="xs mut">'+t('cu_hint')+'</div>')+'</div>';}
  if(d.id)h+='<button class="btn gh sm2" onclick="priceHist(\''+d.id+'\')">📉 '+t('it_price_hist')+'</button>';
  h+='<div style="display:flex;gap:8px;margin-top:12px">'+
    (d.id?'<button class="btn gh" onclick="itemDel(\''+d.id+'\')">🗑</button>':'')+
    '<button class="btn big" style="flex:1" onclick="itemSave()">'+t('save')+'</button></div>';
  openModal(h,true);
}
function itCatChange(v){const d=IT_DRAFT;if(!d)return;
  if(v==='__new'){const n=String(prompt(t('cu_new_cat_q'))||'').trim();if(n)d.cat=n;paintItemEdit();return;}
  d.cat=v;}
function itUnitChange(v){const d=IT_DRAFT;if(!d)return;
  const f=unitConv(null,d.unit,v);   // ขนาดหน่วยบรรจุเขียนเป็นหน่วยใช้ — เปลี่ยนหน่วยใช้แล้วแปลงตามให้ถ้าแปลงได้ (กรัม↔กก.)
  if(f!=null)(d.packs||[]).forEach(p=>{if(num(p.q)>0)p.q=rnd4(num(p.q)*f);});
  d.unit=v;paintItemEdit();}
function itPacksHtml(d){
  const base=d.unit||'';
  const tmp={unit:base,buy_unit:d.buy_unit,buy_qty:d.buy_qty,packs:(d.packs||[]).map(p=>({u:p.u,q:num(p.q)}))};
  const can=itemUnits(tmp).filter(u=>u!==base);
  return '<div class="fld"><label>📏 '+t('it_packs')+'</label><div class="xs mut" style="margin-bottom:6px">'+t('it_pack_hint')+'</div>'+
    (d.packs||[]).map((p,i)=>'<div class="qrline"><span>1</span><select onchange="IT_DRAFT.packs['+i+'].u=this.value;paintItemEdit()"><option value=""></option>'+unitOptions(p.u)+'</select>'+
      '<span>=</span><input inputmode="decimal" placeholder="?" value="'+esc(p.q)+'" onchange="IT_DRAFT.packs['+i+'].q=this.value;paintItemEdit()">'+
      '<span>'+esc(trUnit(base))+'</span><button class="btn gh sm2" aria-label="del" onclick="IT_DRAFT.packs.splice('+i+',1);paintItemEdit()">✕</button></div>').join('')+
    '<button class="btn gh sm2" onclick="IT_DRAFT.packs=IT_DRAFT.packs||[];IT_DRAFT.packs.push({u:\'\',q:\'\'});paintItemEdit()">'+t('it_pack_add')+'</button>'+
    (can.length?'<div class="xs mut" style="margin-top:6px">'+t('it_pack_can')+': '+can.map(u=>esc(unitEqTxt(tmp,u))).join(' · ')+'</div>':'')+'</div>';}
function itPacksClean(d){ // null = มีแถวผิด
  const out=[],seen={};
  for(const p of (d.packs||[])){const u=String(p.u||'').trim();const q=num(p.q);
    if(!u&&String(p.q==null?'':p.q).trim()==='')continue;   // แถวว่าง ข้ามไป
    if(!u||!(q>0)||u===d.unit||(d.buy_unit&&u===d.buy_unit)||seen[u])return null;
    seen[u]=1;out.push({u,q});}
  return out;}
async function itemWriteRow(build,row){ // ยังไม่รัน SQL เพิ่ม ck_items.packs = บันทึกช่องอื่นไปก่อน (ขนาดหน่วยจำได้แค่รอบนี้)
  return dbi(async()=>{let r=await build(row);
    if(r&&r.error&&('packs' in row)&&packsColErr(r.error)){PACKS_OK=false;const x=Object.assign({},row);delete x.packs;r=await build(x);}
    return r;});}
async function itemSave(){await once(async()=>{
  const d=IT_DRAFT;if(!d)return;
  d.name=(document.getElementById('itName').value||'').trim();
  if(!d.name){toast(t('need_name'),true);return;}
  const row={name:d.name,cat:d.cat,unit:d.unit,buy_unit:d.buy_unit||null,buy_qty:d.buy_qty||1,
    price:d.price,sup:d.sup||'',lead_days:d.lead_days||1,min_qty:d.min_qty};
  if(S.scSql)row.count_unit=d.count_unit||null;
  const packs=itPacksClean(d);if(!packs){toast(t('it_pack_bad'),true);return;}
  row.packs=packs;
  let iid=d.id;let renamed=false;
  const oldPrice=iid?num(itemById(iid).price):null;
  if(iid){const old=itemById(iid);renamed=old&&old.name!==d.name;
    if(renamed)row.i18n=null; // เปลี่ยนชื่อ — ล้างคำแปลเก่าแล้วแปลใหม่
    await itemWriteRow(x=>sb.from('ck_items').update(x).eq('id',iid),row);
    Object.assign(itemById(iid),row);
    if(d.price!=null&&num(d.price)!==oldPrice)
      await dbi(()=>sb.from('ck_price_log').insert({item_id:iid,d:todayStr(),price:d.price,buy_unit:d.buy_unit||d.unit,source:'manual'}));}
  else{iid=uid('it');row.id=iid;row.qty=0;
    await itemWriteRow(x=>sb.from('ck_items').insert(x),row);S.items.push(row);
    if(d.price!=null)await dbi(()=>sb.from('ck_price_log').insert({item_id:iid,d:todayStr(),price:d.price,buy_unit:d.buy_unit||d.unit,source:'manual'}));}
  const fromSp=!!d._fromSp;
  IT_DRAFT=null;closeModal();
  if(packs.length&&!PACKS_OK)toast(t('un_need_sql'),true);else toast(t('sv_ok'));
  show(fromSp||S.tab==='set'?S.tab:'items');
  if(fromSp&&!document.getElementById('modalWrap').classList.contains('on'))paintSp();
  const it=itemById(iid);
  autoI18n(row.name,renamed?null:(it&&it.i18n)).then(o=>{if(o&&it){it.i18n=o;
    sb.from('ck_items').update({i18n:o}).eq('id',iid).then(()=>{},()=>{});}}).catch(()=>{});
});}
async function itemDel(id){if(!confirm(t('confirm_del')))return;
  await once(async()=>{
    await dbi(()=>sb.from('ck_items').update({deleted_at:new Date().toISOString()}).eq('id',id));
    const fromSp=!!(IT_DRAFT&&IT_DRAFT._fromSp);
    S.items=S.items.filter(x=>x.id!==id);IT_DRAFT=null;MODAL_BACK=null;closeModal();show(fromSp||S.tab==='set'?S.tab:'items');
    if(fromSp)paintSp();});}
async function priceHist(id){
  const it=itemById(id);
  const logs=await dbi(()=>sb.from('ck_price_log').select('*').eq('item_id',id).order('created_at',{ascending:false}).limit(30));
  openModal('<h3>📉 '+t('it_price_hist')+' · '+esc(dispName(it))+'</h3>'+
    (logs.length?'<div class="twrap"><table class="t"><tr><th>'+t('date')+'</th><th class="right">'+t('price')+'</th><th></th></tr>'+
    logs.map(l=>'<tr><td>'+dispDate(l.d)+'</td><td class="n">฿'+fmt(l.price,2)+'/'+esc(trUnit(l.buy_unit||''))+'</td><td class="xs mut">'+esc(l.source||'')+'</td></tr>').join('')+
    '</table></div>':'<div class="empty">'+t('no_data')+'</div>'));
}
function supsModal(){show('sups');}   // หน้าร้านค้าแยกแล้ว (🏷️) — ชื่อเดิมไว้ให้ปุ่มเก่า
async function supEdit(id){
  if(!canKitchen())return;
  const s=id?S.sups.find(x=>x.id===id):null;
  openModal('<h3>🏷️ '+(s?t('sp_edit_info'):t('sp_new'))+'</h3>'+
    '<div class="fld"><label>'+t('name')+'</label><input id="spName" value="'+esc(s?s.name:'')+'"></div>'+
    '<div class="fld"><label>'+t('it_phone')+'</label><input id="spPhone" inputmode="tel" value="'+esc(s?s.phone||'':'')+'"></div>'+
    '<div class="fld"><label>📅 '+t('sd_days_lb')+'</label><div class="wdpick" id="spDays">'+
      wdNames().map((w,i)=>'<button type="button" data-d="'+i+'" class="'+(supDaysOf(s).includes(i)?'on':'')+'" onclick="this.classList.toggle(\'on\')">'+esc(w)+'</button>').join('')+'</div>'+
      '<div class="xs mut">'+(S.scSql===false?t('sd_need_sql'):t('sd_days_hint'))+'</div></div>'+
    '<div class="fld"><label>🚚 '+t('sd_wait')+'</label><input id="spLead" inputmode="numeric" value="'+supLeadOf(s)+'"><div class="xs mut">'+t('sd_wait_hint')+'</div></div>'+
    '<div class="fld"><label>💳 '+t('kf_sup_credit')+'</label><input id="spCredit" inputmode="numeric" value="'+(s?Math.max(0,parseInt(s.credit_days,10)||0):0)+'">'+
      '<div class="xs mut">'+t('kf_sup_credit_hint')+'</div></div>'+
    '<div class="fld"><label>'+t('note')+'</label><input id="spNote" value="'+esc(s?s.note||'':'')+'"></div>'+
    '<div style="display:flex;gap:8px;margin-top:10px">'+
    (s?'<button class="btn gh" data-id="'+esc(s.id)+'" onclick="supDel(this.dataset.id)">🗑</button>':'')+
    '<button class="btn big" style="flex:1" data-id="'+esc(s?s.id:'')+'" onclick="supSave(this.dataset.id)">'+t('save')+'</button></div>');
}
async function supSave(id){
  if(!canKitchen())return;
  await once(async()=>{
    const name=(document.getElementById('spName').value||'').trim();
    if(!name){toast(t('need_name'),true);return;}
    if(S.sups.some(x=>x.id!==id&&supKey(x.name)===supKey(name))){toast(t('sp_dup'),true);return;}
    const lv=document.getElementById('spLead').value.trim();
    const days=[...document.querySelectorAll('#spDays button.on')].map(b=>+b.dataset.d).sort();
    const row={name,phone:document.getElementById('spPhone').value.trim()||null,
      lead_days:lv===''?1:Math.max(0,parseInt(lv,10)||0),
      note:document.getElementById('spNote').value.trim()||null,
      credit_days:Math.max(0,parseInt(document.getElementById('spCredit').value,10)||0)};
    if(S.scSql)row.order_days=days.length&&days.length<7?days:null;
    else if(days.length)toast(t('sd_need_sql'),true);
    const NC=['credit_days'];const isNew=!id;
    if(id){const s=S.sups.find(x=>x.id===id);const old=s&&s.name;
      await updFallback('ck_sups',row,id,NC);Object.assign(s,row);
      if(old&&old!==name)await supRenameCascade(old,name);}
    else{row.id=uid('sp');await insFallback('ck_sups',[row],NC);S.sups.push(row);id=row.id;}
    S.sups.sort((a,b)=>(a.name||'')<(b.name||'')?-1:1);
    if(S.flowSql===false&&row.credit_days)toast(t('kf_need_sql'),true);else toast(isNew?t('sp_line_after'):t('sv_ok'));
    MODAL_BACK=null;closeModal();
    if(S.tab==='sups')show('sups');
    supPage(id,SP&&SP.id===id?SP.back:null);   // บันทึกแล้วไปหน้าร้าน (ร้านใหม่ = ตั้งกลุ่มไลน์ต่อได้เลย)
  });}
async function supRenameCascade(old,nw){ // เปลี่ยนชื่อร้าน = วัตถุดิบ + ใบสั่งที่ยังไม่รับของ ตามชื่อใหม่ (บิลเก่าคงชื่อตามบิล)
  await dbi(()=>sb.from('ck_items').update({sup:nw}).eq('sup',old));
  S.items.forEach(i=>{if(i.sup===old)i.sup=nw;});
  const open=S.pos.filter(p=>p.sup===old&&p.status!=='received').map(p=>p.id);
  if(open.length){await dbi(()=>sb.from('ck_pos').update({sup:nw}).in('id',open));
    S.pos.forEach(p=>{if(open.includes(p.id))p.sup=nw;});}}
async function supDel(id){
  if(!canKitchen())return;
  const s=S.sups.find(x=>x.id===id);if(!s)return;
  const its=S.items.filter(i=>(i.sup||'')===s.name);
  if(!confirm(its.length?t('sp_del_q_items',{s:s.name,n:its.length}):t('confirm_del')))return;
  await once(async()=>{
    if(its.length){await dbi(()=>sb.from('ck_items').update({sup:''}).eq('sup',s.name));its.forEach(i=>{i.sup='';});}
    await dbi(()=>sb.from('ck_sups').delete().eq('id',id));
    S.sups=S.sups.filter(x=>x.id!==id);SP=null;MODAL_BACK=null;closeModal();show('sups');});}
</script>
<script>
/* ============================================================
   📈 สถิติการใช้ / ผลิต / ส่ง
   ============================================================ */
async function loadMoves(m){ // เดือน YYYY-MM
  const rows=await dbi(()=>sbAll(()=>sb.from('ck_moves').select('*')
    .gte('d',m+'-01').lte('d',dstr(m,monthDays(m))).order('d').order('id'),100).then(data=>({data})));
  return (rows||[]).filter(x=>x.kind!=='send'||inBr(x.branch));   // เห็นเฉพาะสาขา: ยอดส่งของสาขาอื่นไม่นับ
}
let STATS_TOK=0;
RENDER.stats=async function(el){
  const m=S.statsM;
  const tok=++STATS_TOK; // กันผลเดือนเก่าที่มาช้าทับเดือนที่เลือกล่าสุด
  el.innerHTML='<div class="spin"></div>';
  let moves=[],prev=[];
  try{[moves,prev]=await Promise.all([loadMoves(m),loadMoves(prevMonth(m))]);}
  catch(e){if(tok===STATS_TOK)el.innerHTML='<div class="card empty">⚠ '+esc((e&&e.message)||e)+'</div>';return;}
  if(tok!==STATS_TOK)return;
  S._mv=moves;
  const useMv=moves.filter(x=>x.kind==='use');
  const madeMv=moves.filter(x=>x.kind==='made');
  const sendMv=moves.filter(x=>x.kind==='send');
  const useVal=useMv.reduce((s,x)=>s+num(x.cost),0);
  const madeVal=madeMv.reduce((s,x)=>s+num(x.cost),0);
  const sendVal=sendMv.reduce((s,x)=>s+Math.abs(num(x.cost)),0);
  const days=[...new Set(useMv.map(x=>x.d))].length||1; // นับเฉพาะวันที่มีการใช้ของจริง
  let h='<div class="card"><h3>📈 '+t('nav_stats')+
    '<span class="sp"><button class="btn gh sm2" onclick="S.statsM=prevMonth(S.statsM);show(\'stats\')">‹</button> <b>'+dispMonth(m)+'</b> <button class="btn gh sm2" onclick="S.statsM=nextMonth(S.statsM);show(\'stats\')">›</button></span></h3></div>';
  h+='<div class="kpis">'+
    '<div class="kpi hero"><div class="t">🍳 '+t('stt_produced')+'</div><div class="kpi-v">฿'+fmt(madeVal)+'</div><div class="s">'+fmt(madeMv.reduce((s,x)=>s+num(x.qty),0))+' '+t('unit')+'</div></div>'+
    '<div class="kpi"><div class="t">🥬 '+t('stt_use_month')+'</div><div class="kpi-v">฿'+fmt(useVal)+'</div><div class="s mut">฿'+fmt(useVal/days)+' '+t('per_day')+'</div></div>'+
    '<div class="kpi"><div class="t">🚚 '+t('stt_sent')+'</div><div class="kpi-v">฿'+fmt(sendVal)+'</div><div class="s mut">'+sendMv.length+' '+t('items_n')+'</div></div>'+
    '<div class="kpi"><div class="t">📅 '+t('stt_use_day')+'</div><div class="kpi-v">฿'+fmt(useVal/days)+'</div><div class="s mut">'+days+' 📆</div></div></div>';
  if(!moves.length){h+='<div class="card empty">'+t('stt_none')+'</div>';el.innerHTML=h;return;}
  // กราฟมูลค่าผลิตรายวัน
  h+='<div class="card"><h3>📊 '+t('stt_chart')+'</h3><div style="height:210px"><canvas id="stChart"></canvas></div></div>';
  // การใช้วัตถุดิบ
  const byItem={};
  useMv.forEach(x=>{const k=x.ref_id;
    if(!byItem[k])byItem[k]={name:x.name,qty:0,val:0,days:{}};
    byItem[k].qty+=Math.abs(num(x.qty));byItem[k].val+=num(x.cost);byItem[k].days[x.d]=1;});
  const prevByItem={};
  prev.filter(x=>x.kind==='use').forEach(x=>{prevByItem[x.ref_id]=(prevByItem[x.ref_id]||0)+Math.abs(num(x.qty));});
  h+='<div class="card"><h3>🥬 '+t('stt_by_item')+'</h3><div class="twrap"><table class="t">'+
    '<tr><th>'+t('nav_items')+'</th><th class="right">'+t('stt_use_month')+'</th><th class="right">'+t('stt_use_day')+'</th><th class="right">'+t('stt_prev')+'</th><th class="right">'+t('stt_value')+'</th></tr>';
  Object.keys(byItem).sort((a,b)=>byItem[b].val-byItem[a].val).forEach(k=>{
    const v=byItem[k];const it=itemById(k);const pq=prevByItem[k];
    h+='<tr class="tap" onclick="statHist(\''+k+'\',\'use\')"><td>'+esc(it?dispName(it):v.name||'')+'</td>'+
      '<td class="n">'+fmtI(v.qty)+' '+esc(trUnit(it?it.unit||'':''))+'</td>'+
      '<td class="n">'+fmtI(v.qty/(Object.keys(v.days).length||1))+'</td>'+
      '<td class="n">'+(pq!=null?fmtI(pq):'–')+'</td>'+
      '<td class="n">฿'+fmt(v.val,2)+'</td></tr>';});
  h+='</table></div></div>';
  // ผลิต & ส่งตามเมนู
  const byMenu={};
  madeMv.forEach(x=>{const k=x.ref_id;
    if(!byMenu[k])byMenu[k]={name:x.name,made:0,sent:0,val:0};
    byMenu[k].made+=num(x.qty);byMenu[k].val+=num(x.cost);});
  sendMv.forEach(x=>{const k=x.ref_id;
    if(!byMenu[k])byMenu[k]={name:x.name,made:0,sent:0,val:0};
    byMenu[k].sent+=Math.abs(num(x.qty));});
  h+='<div class="card"><h3>🍲 '+t('stt_by_menu')+'</h3><div class="twrap"><table class="t">'+
    '<tr><th>'+t('nav_menus')+'</th><th class="right">'+t('stt_made')+'</th><th class="right">'+t('stt_send')+'</th><th class="right">'+t('stt_value')+'</th></tr>';
  Object.keys(byMenu).sort((a,b)=>byMenu[b].val-byMenu[a].val).forEach(k=>{
    const v=byMenu[k];const r=recipeById(k);
    h+='<tr class="tap" onclick="statHist(\''+k+'\',\'made\')"><td>'+esc(r?dispName(r):v.name||'')+'</td>'+
      '<td class="n">'+fmtI(v.made)+' '+esc(trUnit(r?r.yield_unit||'':''))+'</td>'+
      '<td class="n">'+fmtI(v.sent)+'</td><td class="n">฿'+fmt(v.val,2)+'</td></tr>';});
  h+='</table></div></div>';
  el.innerHTML=h;
  // วาดกราฟ
  const dim=monthDays(m);const labels=[],vals=[];
  for(let d=1;d<=dim;d++){labels.push(d);
    vals.push(rnd2(madeMv.filter(x=>x.d===dstr(m,d)).reduce((s,x)=>s+num(x.cost),0)));}
  if(S.charts.st)S.charts.st.destroy();
  const cv=document.getElementById('stChart');
  if(cv&&window.Chart)S.charts.st=new Chart(cv,{type:'bar',
    data:{labels,datasets:[{data:vals,backgroundColor:'#C62127',borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false}},y:{ticks:{callback:v=>'฿'+fmt(v)}}}}});
};
function statHist(refId,kind){
  const list=(S._mv||[]).filter(x=>x.ref_id===refId&&x.kind===kind);
  if(!list.length)return;
  const o=kind==='use'?itemById(refId):recipeById(refId);
  const byD={};list.forEach(x=>{if(!byD[x.d])byD[x.d]={qty:0,val:0};
    byD[x.d].qty+=Math.abs(num(x.qty));byD[x.d].val+=Math.abs(num(x.cost));});
  let h='<h3>📅 '+t('stt_hist')+' · '+esc(o?dispName(o):list[0].name||'')+'</h3>'+
    '<div class="twrap"><table class="t"><tr><th>'+t('date')+'</th><th class="right">'+t('qty')+'</th><th class="right">'+t('stt_value')+'</th></tr>';
  Object.keys(byD).sort().forEach(d=>{
    h+='<tr><td>'+dispDate(d)+'</td><td class="n">'+fmtI(byD[d].qty)+'</td><td class="n">฿'+fmt(byD[d].val,2)+'</td></tr>';});
  h+='</table></div>';
  openModal(h);
}

function unitUses(n){let c=0;
  S.items.forEach(i=>{if(i.unit===n||i.buy_unit===n||itemPacks(i).some(p=>p.u===n))c++;});
  S.recipes.forEach(r=>{if(r.yield_unit===n)c++;});
  ((S.units&&S.units.conv)||[]).forEach(x=>{if(x.a===n||x.b===n)c++;});
  return c;}
function unitsCardHtml(){
  const ed=canKitchen();const U=S.units||{list:[],conv:[]};
  let h='<div class="card" id="unitsCard"><h3>📏 '+t('un_title')+'</h3><div class="xs mut" style="margin-bottom:10px">'+t('un_hint')+'</div>';
  h+='<div class="unsec">'+t('un_list')+'</div><div class="unchips">'+
    UNITS.map(u=>'<span class="chip">'+esc(trUnit(u))+'</span>').join('')+
    U.list.map(c=>'<span class="chip blue">'+esc(trUnit(c.n))+
      (ed?'<button class="unx" aria-label="del" data-n="'+esc(c.n)+'" onclick="unitDel(this.dataset.n)">✕</button>':'')+'</span>').join('')+'</div>';
  if(ed)h+='<div class="qrline" style="margin-top:8px"><input id="unNew" placeholder="'+esc(t('un_name_ph'))+'" maxlength="24" onkeydown="if(event.key===&#39;Enter&#39;)unitAdd()">'+
    '<button class="btn sm2" onclick="unitAdd()">'+t('un_add')+'</button></div>';
  h+='<div class="unsec">'+t('un_conv')+'</div>'+
    unitConvs().map(c=>'<div class="rowline"><div class="grow">1 '+esc(trUnit(c.a))+' = <b>'+fmtQ(c.f)+'</b> '+esc(trUnit(c.b))+'</div>'+
      (c.std?'<span class="xs mut">🔒 '+t('un_std')+'</span>':
        (ed?'<button class="btn gh sm2" aria-label="del" data-a="'+esc(c.a)+'" data-b="'+esc(c.b)+'" onclick="convDel(this.dataset.a,this.dataset.b)">🗑</button>':''))+'</div>').join('');
  if(ed)h+='<div class="qrline" style="margin-top:8px"><span>1</span><select id="cvA"><option value=""></option>'+unitOptions('')+'</select>'+
    '<span>=</span><input id="cvF" inputmode="decimal" placeholder="?" style="max-width:90px"><select id="cvB"><option value=""></option>'+unitOptions('')+'</select></div>'+
    '<button class="btn sm2" onclick="convAdd()">'+t('un_conv_add')+'</button>';
  const its=S.items.filter(i=>i.active!==false&&((i.buy_unit&&i.buy_unit!==i.unit)||itemPacks(i).length))
    .sort((a,b)=>dispName(a).localeCompare(dispName(b),'th'));
  h+='<div class="unsec">'+t('un_items')+'</div><div class="xs mut" style="margin-bottom:6px">'+t('un_items_hint')+'</div>';
  if(!its.length)h+='<div class="xs mut">'+t('no_data')+'</div>';
  its.forEach(i=>{const us=[];if(i.buy_unit&&i.buy_unit!==i.unit)us.push(i.buy_unit);itemPacks(i).forEach(p=>{if(!us.includes(p.u))us.push(p.u);});
    h+='<div class="rowline">'+thumbHtml(i,ITEM_CAT_IC[i.cat]||'🥬')+'<div class="grow"><b>'+esc(dispName(i))+'</b>'+
      '<div class="xs mut">'+us.map(u=>esc(unitEqTxt(i,u))).filter(Boolean).join(' · ')+'</div></div>'+
      (ed?'<button class="btn gh sm2" onclick="itemEdit(&#39;'+esc(i.id)+'&#39;)">✎</button>':'')+'</div>';});
  if(!PACKS_OK)h+='<div class="qrwarn" style="margin-top:8px">'+t('un_need_sql')+'</div>';
  return h+'</div>';}
async function unitAdd(){if(!canKitchen())return;
  const el=document.getElementById('unNew');const n=String(el&&el.value||'').trim().replace(/\s+/g,' ');
  if(!n){toast(t('need_name'),true);return;}
  if(allUnits().some(u=>u.toLowerCase()===n.toLowerCase())){toast(t('un_dup'),true);return;}
  await once(async()=>{
    const i18n=await withTimeout(autoI18n(n,null),4000);   // แปล 3 ภาษาเลย (ไม่ทันก็เติมให้ทีหลังตอนเปิดแอพ)
    const v=await unitsFresh();
    if(!v.list.some(x=>x.n.toLowerCase()===n.toLowerCase()))v.list.push({n,i18n:i18n||null});
    await unitsSave(v);toast(t('sv_ok'));show('set');});}
async function unitDel(n){if(!canKitchen()||!n||UNITS.includes(n))return;
  const c=unitUses(n);if(c){toast(t('un_inuse',{n:c}),true);return;}
  if(!confirm(t('un_del_q',{n:trUnit(n)})))return;
  await once(async()=>{const v=await unitsFresh();v.list=v.list.filter(x=>x.n!==n);
    await unitsSave(v);toast(t('sv_ok'));show('set');});}
async function convAdd(){if(!canKitchen())return;
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const a=g('cvA'),b=g('cvB'),f=num(g('cvF'));
  if(!a||!b||a===b||!(f>0)){toast(t('un_conv_bad'),true);return;}
  const has=unitConv(null,a,b);   // แปลงกันได้อยู่แล้ว (ตรง ๆ หรือผ่านหน่วยอื่น) — ไม่ให้ตั้งซ้อน กันตัวเลขขัดกัน
  if(has!=null){toast(t('un_conv_has',{a:trUnit(a),f:fmtQ(has),b:trUnit(b)}),true);return;}
  await once(async()=>{const v=await unitsFresh();S.units=v;
    const has2=unitConv(null,a,b);
    if(has2!=null){toast(t('un_conv_has',{a:trUnit(a),f:fmtQ(has2),b:trUnit(b)}),true);show('set');return;}
    v.conv.push({a,f,b});await unitsSave(v);toast(t('sv_ok'));show('set');});}
async function convDel(a,b){if(!canKitchen())return;
  if(!confirm(t('un_conv_del_q',{a:trUnit(a),b:trUnit(b)})))return;
  await once(async()=>{const v=await unitsFresh();v.conv=v.conv.filter(x=>!(x.a===a&&x.b===b));
    await unitsSave(v);toast(t('sv_ok'));show('set');});}

async function backfillI18n(){ // เติมคำแปลที่ขาดให้ทุกชื่อ
  let n=0;
  for(const it of S.items){
    if(it.i18n&&it.i18n.en&&it.i18n.lo&&it.i18n.my)continue;
    const o=await autoI18n(it.name,it.i18n);
    if(o){it.i18n=o;await sb.from('ck_items').update({i18n:o}).eq('id',it.id);n++;}
  }
  for(const r of S.recipes){
    if(r.i18n&&r.i18n.en&&r.i18n.lo&&r.i18n.my)continue;
    const o=await autoI18n(r.name,r.i18n);
    if(o){r.i18n=o;await sb.from('ck_recipes').update({i18n:o}).eq('id',r.id);n++;}
  }
  toast(t('se_backfill_done')+' ('+n+')');
}

/* ============================================================
   🏭 flow ประจำวันของครัวกลาง (เจ้าของสั่ง 2026-10-06)
   ① เช็คของ+ผลิตด่วน → ② ส่งของตามสาขา (ติ๊ก+บิล) → ③ ผลิตเติมสต๊อก → ④ นับสต๊อก
   → ⑤ สั่งวัตถุดิบ (แยกซัพ ส่งไลน์) → ⑥ รับของ+บิลซัพ (เครดิต/โอน) · บัญชี · แดชบอร์ด
   ค่าตั้ง: ck_settings key=kplan {safety_days,avg_days,markup} · key=editlock {bill,prod,send,exp,before}
   ============================================================ */
const KP_DEF={safety_days:2,avg_days:14,markup:0};
function kpClean(v){v=(v&&typeof v==='object')?v:{};
  const n=(x,d,lo,hi)=>{const y=Number(x);return (x!==null&&x!==''&&x!==undefined&&isFinite(y)&&y>=lo&&y<=hi)?y:d;};
  return {safety_days:n(v.safety_days,KP_DEF.safety_days,0,60),avg_days:Math.round(n(v.avg_days,KP_DEF.avg_days,3,90)),
    markup:n(v.markup,KP_DEF.markup,0,1000)};}
const EL_TYPES=['bill','prod','send','exp'];
function elClean(v){v=(v&&typeof v==='object')?v:{};const o={};
  EL_TYPES.forEach(k=>{o[k]=v[k]!==false;});
  o.before=/^\d{4}-\d{2}-\d{2}$/.test(String(v.before||''))?String(v.before):'';
  return o;}
const kpCfg=()=>S.kp||kpClean(null);
const blankNum=v=>v==null||v==='';
function ckBoss(){return !!(S.prof&&S.prof.role==='owner');}   // ผู้ดูแลระบบ/เจ้าของ (mapCentralProf แปลงเป็น owner)
/* แก้/ลบข้อมูลที่บันทึกแล้ว — เจ้าของ/ผู้ดูแลระบบได้เสมอ · คนอื่นตามหน้าตั้งค่า 🔒 (ปิดเป็นเรื่อง ๆ + ล็อกก่อนวันที่) */
function canEditRec(type,d){
  if(!canKitchen())return false;
  if(ckBoss())return true;
  const L=S.editlock||elClean(null);
  if(L[type]===false)return false;
  if(L.before&&d&&String(d).slice(0,10)<L.before)return false;
  return true;}
function editDenied(type,d){if(canEditRec(type,d))return false;toast(t('kf_locked'),true);return true;}
/* คอลัมน์ใหม่ยังไม่มี (ยังไม่ได้รัน jjmk_kitchen_flow.sql) = บันทึกช่องอื่นไปก่อน */
const colErr=(e,cols)=>!!e&&cols.some(c=>String(e.message||e).indexOf(c)>=0);
async function insFallback(tbl,rows,cols,sel){
  return dbi(async()=>{
    const run=rr=>sel?sb.from(tbl).insert(rr).select():sb.from(tbl).insert(rr);
    let r=await run(rows);
    if(r&&r.error&&colErr(r.error,cols)){S.flowSql=false;
      r=await run(rows.map(x=>{const y=Object.assign({},x);cols.forEach(c=>delete y[c]);return y;}));}
    return r;});}
async function updFallback(tbl,row,id,cols){
  return dbi(async()=>{
    let r=await sb.from(tbl).update(row).eq('id',id);
    if(r&&r.error&&colErr(r.error,cols)){S.flowSql=false;const y=Object.assign({},row);cols.forEach(c=>delete y[c]);
      r=Object.keys(y).length?await sb.from(tbl).update(y).eq('id',id):{data:null,error:null};}
    return r;});}

/* ---------- ราคาขายสาขา = ต้นทุนจริงต่อหน่วย + % (ตั้งค่ากลางในหน้าตั้งค่า · ตั้งรายเมนูทับได้) ---------- */
function markupOf(r){return (r&&!blankNum(r.markup_pct))?num(r.markup_pct):kpCfg().markup;}

/* ---------- สต๊อกสำรอง (safety) ของที่ผลิต = วัน × ยอดส่งเฉลี่ยต่อวัน · ใส่ตัวเลขตายตัวทับได้ ---------- */
function kpAvgOf(rid){return num(((S.kpAvg||{}).by||{})[rid]);}
function safetyOf(r){
  if(r&&!blankNum(r.safety_qty))return {q:num(r.safety_qty),fixed:true,days:null};
  const days=(r&&!blankNum(r.safety_days))?num(r.safety_days):kpCfg().safety_days;
  return {q:days*kpAvgOf(r&&r.id),fixed:false,days};}
async function kpAvgLoad(force){ // ยอดส่งสาขาย้อนหลัง N วัน (ไม่นับวันนี้ที่ยังส่งไม่ครบ) ÷ N
  if(!force&&S.kpAvg&&Date.now()-S.kpAvg.t<300000)return S.kpAvg;
  const n=kpCfg().avg_days,to=bizTodayISO(),from=addDays(to,-n);
  let rows=[];
  try{rows=await sbAll(()=>sb.from('ck_moves').select('ref_id,qty,d').eq('kind','send').eq('item_kind','recipe')
    .gte('d',from).lt('d',to).order('id'),20);}catch(e){rows=[];}
  const by={};rows.forEach(m=>{by[m.ref_id]=(by[m.ref_id]||0)+Math.abs(num(m.qty));});
  Object.keys(by).forEach(k=>{by[k]=by[k]/n;});
  S.kpAvg={t:Date.now(),by,n};return S.kpAvg;}
function kpRound(r,q){ // ผลิตเป็นจำนวนเต็ม — หน่วยชั่ง/ตวง (กก. ลิตร) ปัดขึ้น 2 ตำแหน่ง
  if(!(q>1e-9))return 0;
  return brContinuous(r&&r.yield_unit)?Math.ceil(q*100-1e-6)/100:Math.ceil(q-1e-9);}
/* ยอดที่สาขาสั่ง (ยังไม่ได้ส่ง) ต่อสูตร — จากยอดนับของแอพนับสต๊อก (+ ออเดอร์ที่กดเองค้างถึงวันนี้) */
function kpBranchNeed(){
  const need={},by={};let unl=0;const D=bizTodayISO();
  (S.br.data||[]).forEach(B=>{if(!B.cd)return;const P=brPlan(B);if(P.sent)return;
    P.need.forEach(x=>{const L=x.link;
      if(!L.r||!L.f){if(!L.none)unl++;return;}
      const q=num(x.order)*L.f;
      need[L.r.id]=(need[L.r.id]||0)+q;
      (by[L.r.id]=by[L.r.id]||{})[B.code]=((by[L.r.id]||{})[B.code]||0)+q;});});
  S.orders.filter(o=>(o.status==='new'||o.status==='prep')&&o.d<=D).forEach(o=>(S.orderItems[o.id]||[]).forEach(l=>{
    if(!l.recipe_id)return;need[l.recipe_id]=(need[l.recipe_id]||0)+num(l.qty);
    (by[l.recipe_id]=by[l.recipe_id]||{})[o.branch]=((by[l.recipe_id]||{})[o.branch]||0)+num(l.qty);}));
  return {need,by,unl};}
/* ต่อสูตร: ด่วน = ต้องส่งวันนี้ − มี · เติม = สำรอง − (มี − ต้องส่ง) · หักใบสั่งผลิตที่ค้างอยู่แล้ว */
function kpPlan(){
  const bn=kpBranchNeed();const D=bizTodayISO();
  const open={};S.plans.filter(p=>p.status==='plan'&&p.d<=D).forEach(p=>{open[p.recipe_id]=(open[p.recipe_id]||0)+num(p.qty);});
  const rows=S.recipes.filter(r=>r.active!==false).map(r=>{
    const have=num(r.qty),need=num(bn.need[r.id]),sf=safetyOf(r),op=num(open[r.id]);
    const urgent=Math.max(0,need-have);
    const refill=Math.max(0,sf.q-Math.max(0,have-need));
    const uLeft=Math.max(0,urgent-op);
    const rLeft=Math.max(0,refill-Math.max(0,op-urgent));
    return {r,have,need,sf,open:op,urgent,refill,uLeft:kpRound(r,uLeft),rLeft:kpRound(r,rLeft),by:bn.by[r.id]||{}};
  }).filter(x=>x.need>0||x.sf.q>0||x.open>0);
  return {rows,unl:bn.unl};}

/* ---------- 🧾 เลขบิลส่งสาขา: <สาขา>-<ปปดดวว>-<ลำดับของวันนั้น> เช่น JJRD-261006-1 ---------- */
async function billNoAssign(o){
  if(!o||o.bill_no||S.billNoCol===false)return null;
  try{
    const r=await sb.from('ck_orders').select('bill_no').eq('branch',o.branch).eq('d',o.d);
    if(r.error){if(colErr(r.error,['bill_no']))S.billNoCol=false;return null;}
    const pre=o.branch+'-'+String(o.d).slice(2,10).split('-').join('')+'-';
    let n=0;(r.data||[]).forEach(x=>{const m=String(x.bill_no||'');
      if(m.startsWith(pre)){const k=parseInt(m.slice(pre.length),10);if(k>n)n=k;}});
    const no=pre+(n+1);
    const u=await sb.from('ck_orders').update({bill_no:no}).eq('id',o.id);
    if(u.error){if(colErr(u.error,['bill_no']))S.billNoCol=false;return null;}
    o.bill_no=no;return no;
  }catch(e){return null;}}
const orderSell=o=>o.total_sell!=null?num(o.total_sell):(S.orderItems[o.id]||[]).reduce((s,l)=>s+num(l.amount_sell!=null?l.amount_sell:l.amount),0);

/* ---------- 🛒 สั่งวัตถุดิบ (พรุ่งนี้) — จากใบสั่งผลิตที่ค้าง + ที่คาดว่าจะผลิต (ยอดส่งเฉลี่ย/วัน) ผ่าน BOM ---------- */
function kpBuyRows(){ // ยอดที่ต้องสั่ง — สั่งให้พอใช้ถึงวันก่อนที่ของรอบถัดไปของร้านนั้นจะมา (ตามวันสั่ง + วันรอของ)
  const today=bizTodayISO(),tmr=addDays(today,1);
  const planNeed={},daily={},firstD={};
  const first=(iid,d)=>{if(!firstD[iid]||d<firstD[iid])firstD[iid]=d;};
  S.plans.filter(p=>p.status==='plan').forEach(p=>{const r=recipeById(p.recipe_id);if(!r)return;
    const b=num(p.qty)/(num(r.yield_qty)||1),d=p.d<today?today:p.d;
    bomOf(r).forEach(l=>{planNeed[l.item_id]=(planNeed[l.item_id]||0)+b*num(l.qty);first(l.item_id,d);});});
  S.recipes.forEach(r=>{const a=kpAvgOf(r.id);if(!(a>0))return;const b=a/(num(r.yield_qty)||1);   // ใช้ต่อวันโดยเฉลี่ย
    bomOf(r).forEach(l=>{daily[l.item_id]=(daily[l.item_id]||0)+b*num(l.qty);first(l.item_id,tmr);});});
  const incoming={};
  S.pos.filter(p=>p.status==='ordered'||p.status==='draft').forEach(p=>{(S.poItems[p.id]||[]).forEach(l=>{
    const it=itemById(l.item_id);if(!it)return;
    incoming[l.item_id]=(incoming[l.item_id]||0)+num(l.qty)*(num(it.buy_qty)||1);});});
  const ids=new Set([...Object.keys(planNeed),...Object.keys(daily)]);
  S.items.forEach(it=>{if(it.active!==false&&it.min_qty!=null)ids.add(it.id);});
  return [...ids].map(iid=>{
    const it=itemById(iid);if(!it)return null;
    const lead=Math.max(num(it.lead_days)||0,supLeadOf(supByName(it.sup)));
    const P=supPlanOf(it.sup,lead,today);
    const days=Math.max(1,dayDiff(today,P.nextArrive)-1);
    const pn=num(planNeed[iid]),dl=num(daily[iid]);
    const have=Math.max(0,num(it.qty)),inc=incoming[iid]||0,nd=pn+dl*days,mn=num(it.min_qty);
    const short=Math.max(0,+(nd+mn-have-inc).toFixed(4));
    if(!nd&&!short)return null;
    const bq=num(it.buy_qty)||1;
    const runOut=!P.orderToday&&have+inc<pn+dl*Math.max(0,dayDiff(today,P.arrive)-1)-1e-9;   // ของหมดก่อนรอบสั่งปกติจะมา
    return {it,need:nd,min:mn,have,inc,short,buyN:Math.ceil(short/bq-1e-9),orderBy:P.oDay,produceD:firstD[iid]||tmr,
      lead,days,daily:dl,orderToday:P.orderToday,oDay:P.oDay,arrive:P.arrive,nextArrive:P.nextArrive,runOut};
  }).filter(Boolean).sort((a,b)=>String(a.it.sup||'').localeCompare(String(b.it.sup||''),'th')||dispName(a.it).localeCompare(dispName(b.it),'th'));}

/* ---------- 📤 ส่งใบสั่งซื้อแยกตามซัพ เข้ากลุ่มไลน์ของซัพ (แบบแอพนับสต๊อก — ฟังก์ชัน line-order ตัวเดียวกัน) ---------- */

function blQrBase(){return Object.assign(qrBlank(),{bill:true,bi:-1});}
function blAddLine(){if(!BL)return;QR=blQrBase();qrPick();}
function blParseNote(it,note,qty){ // "2 ลัง + 3 ขวด" (หมายเหตุของรายการรับเข้า) → [{q,u}] — ต้องรวมแล้วเท่ากับจำนวนจริงเท่านั้น
  if(!it||!note)return null;
  const parts=String(note).split(' · ')[0].split(' + ').map(x=>{const m=x.trim().match(/^([\d.,]+)\s+(.+)$/);
    return m?{q:m[1].replace(/,/g,''),u:m[2].trim()}:null;});
  if(!parts.length||parts.some(x=>!x))return null;
  let tot=0;for(const x of parts){const f=unitFactor(it,x.u);if(f==null)return null;tot+=num(x.q)*f;}
  return Math.abs(tot-num(qty))<=1e-6*Math.max(1,Math.abs(num(qty)))?parts:null;}
function blEditLine(i){const l=BL&&BL.lines[i];if(!l)return;const it=itemById(l.iid);if(!it){toast(t('menu_deleted'),true);return;}
  let lines,price,pu;
  if(l.q&&Array.isArray(l.q.lines)){lines=l.q.lines.map(x=>({q:x.q,u:x.u}));price=String(l.q.price==null?'':l.q.price);pu=l.q.pu;}
  else{ // บิลที่บันทึกแล้ว: กู้หน่วยเดิมจากหมายเหตุ (เช่น 2 ลัง) + ราคาต่อหน่วยนั้น · กู้ไม่ได้ = ใช้หน่วยใช้ + ราคารวม
    const ps=blParseNote(it,l.note,l.qty);
    lines=ps||[{q:String(l.qty),u:it.unit||''}];
    if(l.cost==null){price='';pu=it.buy_unit||it.unit||'';}
    else if(lines.length===1&&num(lines[0].q)>0){pu=lines[0].u;price=String(rnd4(num(l.cost)/num(lines[0].q)));}
    else{pu='__total';price=String(l.cost);}}
  QR=Object.assign(blQrBase(),{bi:i,iid:l.iid,auto:false,lines,price,pu});
  paintQr();}
function blFromQr(c,it){ // บรรทัดในบิลจากหน้ารับของ (หลายหน่วย)
  const base=it.unit||'',d=QR;
  const mixed=c.raw.length>1||d.lines.some(l=>num(l.q)>0&&l.u!==base);
  const line={iid:it.id,name:it.name,qty:c.total,cost:c.cost,note:mixed?c.raw.join(' + '):null,newPrice:c.newPrice,bu:c.bu,
    q:{lines:d.lines.map(l=>({q:l.q,u:l.u})),price:d.price,pu:d.pu}};
  if(d.bi>=0&&BL.lines[d.bi])BL.lines[d.bi]=line;else BL.lines.push(line);
  blSaveDraft();}

async function billDel(id){

/* ---------- 💰 ข้อมูลบัญชีรายเดือน (ใช้ทั้งหน้าบัญชีและแดชบอร์ด) ---------- */
async function accData(m){
  const F=m+'-01',T=dstr(m,monthDays(m));
  let [exps,mv,ords,bills]=await Promise.all([
    dbi(()=>sbAll(()=>sb.from('ck_expenses').select('*').gte('d',F).lte('d',T).order('d').order('id'),50).then(data=>({data})))
      .catch(e=>{if(MISSING_TBL(e))return null;throw e;}),
    dbi(()=>sbAll(()=>sb.from('ck_moves').select('d,kind,ref_id,name,qty,cost,branch,ref').gte('d',F).lte('d',T).order('d').order('id'),100).then(data=>({data}))),
    dbi(()=>sbAll(()=>brQin(sb.from('ck_orders').select('*').in('status',['sent','done']).gte('d',F).lte('d',T),'branch').order('d').order('id'),50).then(data=>({data}))),
    S.billsOk===false?Promise.resolve(null):sbAll(()=>sb.from('ck_bills').select('*').gte('d',F).lte('d',T).order('d').order('id'),20)
      .catch(e=>{if(MISSING_TBL(e))S.billsOk=false;return null;})
  ]);
  ords=ords.filter(o=>inBr(o.branch));                     // เห็นเฉพาะสาขา
  mv=mv.filter(x=>x.kind!=='send'||inBr(x.branch));
  const items=[];const ids=ords.map(o=>o.id);
  for(let i=0;i<ids.length;i+=80)
    items.push(...await dbi(()=>sbAll(()=>sb.from('ck_order_items').select('*').in('order_id',ids.slice(i,i+80)).order('id'),20).then(data=>({data}))));
  const expMissing=exps===null;if(expMissing)exps=[];
  // รายรับ = ราคาขายที่ล็อกไว้ตอนส่ง (ของเก่าไม่มี → คำนวณจากราคาขาย/ต้นทุนปัจจุบัน)
  const oMap={};ords.forEach(o=>oMap[o.id]=o);
  const revByBr={},revByMenu={};let rev=0,cogs=0;
  items.forEach(l=>{const o=oMap[l.order_id];if(!o)return;
    const r=l.recipe_id?recipeById(l.recipe_id):null;
    let a=l.amount_sell;
    if(a==null){const sp=r?recipeSellPrice(r):(l.cost_unit!=null?num(l.cost_unit):null);
      a=sp!=null?rnd2(num(l.qty)*sp):0;}
    rev+=num(a);cogs+=num(l.amount);
    const bk=o.branch||o.branch_name||'?';
    if(!revByBr[bk])revByBr[bk]={code:o.branch,name:o.branch_name||branchName(o.branch),amt:0,n:0,bills:[]};
    revByBr[bk].amt+=num(a);
    const mk=l.recipe_id||l.name;
    if(!revByMenu[mk])revByMenu[mk]={name:(r?dispName(r):l.name),qty:0,amt:0};
    revByMenu[mk].qty+=num(l.qty);revByMenu[mk].amt+=num(a);});
  ords.forEach(o=>{const bk=o.branch||o.branch_name||'?';const B=revByBr[bk];if(!B)return;
    B.n++;B.bills.push({id:o.id,no:o.bill_no||'',d:o.d,amt:(S.orderItems[o.id]?orderSell(o):(o.total_sell!=null?num(o.total_sell):num(o.total)))});});
  const buys=mv.filter(x=>x.kind==='buy');
  const buyVal=buys.reduce((s,x)=>s+num(x.cost),0);
  const expByCat={};let expVal=0;
  exps.forEach(x=>{const c=x.cat||EXP_OTHER;expByCat[c]=(expByCat[c]||0)+num(x.amount);expVal+=num(x.amount);});
  const profit=rev-buyVal-expVal;
  const stockVal=S.items.reduce((s,i)=>{const c=unitCost(i);return s+(c!=null?num(i.qty)*c:0);},0);
  const fgVal=S.recipes.reduce((s,r)=>{const c=recipeUnitCost(r);return s+(c!=null&&num(r.qty)>0?num(r.qty)*c:0);},0);
  // บิลซัพของเดือนนี้ แยกซัพ (จ่ายทันที / เครดิต / ค้างจ่าย)
  const bySup={};let billTot=0;
  (bills||[]).forEach(b=>{const k=b.sup||'-';const x=bySup[k]=bySup[k]||{sup:k,tot:0,cash:0,credit:0,unpaid:0,n:0};
    const a=num(b.total);x.tot+=a;x.n++;billTot+=a;
    if(num(b.credit_days)>0){x.credit+=a;if(!b.paid_at)x.unpaid+=a;}else x.cash+=a;});
  // ค่าใช้จ่ายอื่น (ไม่ใช่วัตถุดิบ) หารให้สาขาตามสัดส่วนยอดที่ส่ง (เจ้าของเลือก 2026-10-06)
  const alloc=Object.keys(revByBr).map(k=>{const B=revByBr[k];const sh=rev>0?B.amt/rev:0;
    return {k,name:B.name,amt:B.amt,share:sh,exp:rnd2(expVal*sh),total:rnd2(B.amt+expVal*sh)};})
    .sort((a,b)=>b.amt-a.amt);
  return {m,exps,mv,ords,items,rev,revByBr,revByMenu,cogs,buys,buyVal,expByCat,expVal,profit,stockVal,fgVal,
    expMissing,bills,bySup,billTot,alloc};}

async function prodReverse(id,resetPlan){
  const p=S.prods.find(x=>x.id===id);
  const mv=await dbi(()=>sb.from('ck_moves').select('*').eq('ref',id));
  await dbi(()=>sb.from('ck_moves').delete().eq('ref',id));
  for(const m of (mv||[])){
    const o=m.item_kind==='item'?itemById(m.ref_id):recipeById(m.ref_id);
    const v=await addQty(m.item_kind,m.ref_id,-num(m.qty));
    if(o)o.qty=v!=null?v:rnd2(num(o.qty)-num(m.qty));}
  await dbi(()=>sb.from('ck_prod_items').delete().eq('prod_id',id));
  await dbi(()=>sb.from('ck_productions').delete().eq('id',id));
  if(resetPlan&&p&&p.plan_id){try{await dbi(()=>sb.from('ck_plans').update({status:'plan'}).eq('id',p.plan_id));
    const pl=S.plans.find(x=>x.id===p.plan_id);if(pl)pl.status='plan';}catch(e){}}
  S.prods=S.prods.filter(x=>x.id!==id);}
async function prodEdit(id){
  const p=S.prods.find(x=>x.id===id);if(!p)return;
  if(editDenied('prod',p.d))return;
  const r=recipeById(p.recipe_id);if(!r){toast(t('menu_deleted'),true);return;}
  let lines=[];try{lines=await dbi(()=>sb.from('ck_prod_items').select('*').eq('prod_id',id).order('id'));}catch(e){return;}
  const pq=prodPlanQty(p);
  PR_DRAFT={editId:id,d0:p.d,rid:r.id,qty:pq!=null?pq:num(p.qty),actual:String(num(p.qty)),actualTouched:true,
    planId:p.plan_id||null,d:p.d,
    lines:(lines||[]).filter(l=>itemById(l.item_id)).map(l=>({item_id:l.item_id,name:l.name,unit:l.unit||'',qty:num(l.qty),touched:true}))};
  paintProduceModal();}

let TK=null,TM=null;
function tkItems(kind){
  const D=bizTodayISO(),out=[];
  S.plans.filter(p=>p.status==='plan'&&p.d<=D&&(kpKind(p)||'refill')===kind).forEach(p=>{
    const r=recipeById(p.recipe_id);if(r)out.push({r,q:num(p.qty),planId:p.id});});
  kpPlan().rows.forEach(x=>{const q=kind==='urgent'?x.uLeft:x.rLeft;if(q>0)out.push({r:x.r,q,planId:null});});
  return out;}
async function taskMake(kind){
  if(!canKitchen())return;
  const title=(kind==='urgent'?'⚡ ':'🍳 ')+t(kind==='urgent'?'sx_s1':'sx_s3');
  const hint=t(kind==='urgent'?'sx_s1_hint':'sx_s3_hint');
  if(!S.kpAvg||(kind==='urgent'&&stkCodes().length&&!S.br.data)){
    openTask(tkHead(title,hint)+'<div class="spin"></div>');
    try{await Promise.all([kpAvgLoad(),stkCodes().length?brLoad():null]);}catch(e){}}
  const D=bizTodayISO(),items=tkItems(kind);
  const done=S.prods.filter(p=>{if(p.d!==D)return false;const pl=p.plan_id&&S.plans.find(x=>x.id===p.plan_id);
    return ((pl&&kpKind(pl))||'refill')===kind;});
  TK={kind,items};
  let h=tkHead(title,hint);
  if(!items.length)h+=tkEmpty(t('sx_nothing'));
  items.forEach((x,i)=>{h+='<button class="tkcard" onclick="taskMakeOne('+i+')">'+thumbHtml(x.r,'🍲')+
    '<div class="tkmid"><div class="tkname">'+esc(dispName(x.r))+'</div>'+
    '<div class="tkqty">'+t('sx_make_n',{q:fmtQ(x.q),u:esc(trUnit(x.r.yield_unit||''))})+'</div></div><span class="tkgo">›</span></button>';});
  if(done.length){h+='<div class="tksec">✅ '+t('sx_done_today')+'</div>';
    done.forEach(p=>{const r=recipeById(p.recipe_id);
      h+='<div class="tkcard done small">'+thumbHtml(r,'🍲')+'<div class="tkmid"><div class="tkname">'+esc(r?dispName(r):p.name||'')+'</div>'+
        '<div>'+fmtQ(p.qty)+' '+esc(trUnit(r?r.yield_unit||'':''))+'</div></div><span class="tkgo">✓</span></div>';});}
  openTask(h);}
function taskMakeOne(i){
  const x=TK&&TK.items[i];if(!x)return;
  TM={kind:TK.kind,rid:x.r.id,ordered:x.q,actual:String(x.q),planId:x.planId,editQ:false,busy:false};
  paintTm();}
function tmStepOf(r){return brContinuous(r&&r.yield_unit)?0.5:1;}
function paintTm(){
  const d=TM;if(!d)return;const r=recipeById(d.rid);if(!r)return;
  const u=esc(trUnit(r.yield_unit||'')),b=num(d.ordered)/(num(r.yield_qty)||1);
  let h=tkHead('🍲 '+esc(dispName(r)),'',"taskMake('"+d.kind+"')");
  h+='<div class="tmtop">'+thumbHtml(r,'🍲')+'<div><div class="xs mut">'+t('sx_need')+'</div>'+
    '<div class="tmneed">'+fmtQ(d.ordered)+' <small>'+u+'</small></div>'+
    '<button class="btn gh sm2" onclick="TM.editQ=!TM.editQ;paintTm()">✎ '+t('sx_edit_q')+'</button></div></div>';
  if(d.editQ)h+='<div class="bq"><button onclick="tmOrd(-1)">−</button><input id="tmQ" inputmode="decimal" value="'+esc(d.ordered)+'" onchange="TM.ordered=Math.max(0,num(this.value));TM.actual=String(TM.ordered);paintTm()"><button onclick="tmOrd(1)">＋</button></div>';
  const bom=bomOf(r);
  if(bom.length){h+='<div class="tksec">🥣 '+t('sx_use')+'</div><div class="tmuse">';
    bom.forEach(l=>{const it=itemById(l.item_id);const q=rnd4(b*num(l.qty));const short=num(it.qty)<q-1e-9;
      h+='<div class="tmline'+(short?' short':'')+'"><span>'+esc(dispName(it))+'</span><b>'+fmtQ(q)+' '+esc(trUnit(it.unit||''))+'</b>'+
        (short?'<em>⚠ '+t('sx_short')+' ('+t('sx_have',{q:fmtQ(Math.max(0,num(it.qty)))})+')</em>':'')+'</div>';});
    h+='</div>';}
  h+=methodHtml(r,b,'tksec');
  h+='<div class="tksec">✅ '+t('sx_got_q',{u})+'</div>'+
    '<div class="bq"><button onclick="tmAct(-1)">−</button><input id="tmA" inputmode="decimal" value="'+esc(d.actual)+'" oninput="TM.actual=this.value"><button onclick="tmAct(1)">＋</button></div>'+
    '<button class="btn big ok tksave" onclick="tmSave()">✓ '+t('sx_save')+'</button>';
  openTask(h);}
function tmOrd(dir){const r=recipeById(TM.rid);TM.ordered=Math.max(0,rnd2(num(TM.ordered)+dir*tmStepOf(r)));TM.actual=String(TM.ordered);paintTm();}
function tmAct(dir){const r=recipeById(TM.rid);const el=document.getElementById('tmA');
  TM.actual=String(Math.max(0,rnd2(num(el?el.value:TM.actual)+dir*tmStepOf(r))));if(el)el.value=TM.actual;}
async function tmSave(){
  const d=TM;if(!d||d.busy)return;
  const el=document.getElementById('tmA');const a=num(el?el.value:d.actual);
  if(!(a>0)){toast(t('kf_need_actual'),true);return;}
  if(!(num(d.ordered)>0)){toast(t('need_qty'),true);return;}
  const r=recipeById(d.rid);if(!r)return;
  d.busy=true;
  try{
    let pid=d.planId;
    if(!pid){ // ระบบคิดให้ = ยอดสั่งผลิต → เก็บเป็นใบสั่งผลิตก่อน (ไว้เทียบกับที่ทำได้จริง)
      const row={id:uid('pl'),d:bizTodayISO(),recipe_id:r.id,qty:num(d.ordered),status:'plan',kind:d.kind,
        note:(d.kind==='urgent'?'⚡ ':'🔄 ')+I18N.th[d.kind==='urgent'?'kf_urgent':'kf_refill'],by_name:S.user.name};
      await insFallback('ck_plans',[row],['kind']);S.plans.push(row);pid=row.id;d.planId=pid;}
    else{const p=S.plans.find(x=>x.id===pid);
      if(p&&num(p.qty)!==num(d.ordered)){await dbi(()=>sb.from('ck_plans').update({qty:num(d.ordered)}).eq('id',pid));p.qty=num(d.ordered);}}
    PR_DRAFT={rid:r.id,qty:num(d.ordered),planId:pid,d:bizTodayISO(),lines:null,actual:String(a),actualTouched:true};
    prBuildLines();
    await produceSave();
  }finally{d.busy=false;}
  if(PR_DRAFT)return;   // บันทึกไม่ผ่าน — อยู่หน้าเดิม
  TM=null;
  if(tkItems(d.kind).length)taskMake(d.kind);else toast('🎉 '+t('sx_all_done'));}

async function taskSend(){
  if(!canKitchen())return;
  const head=tkHead('🚚 '+t('sx_s2'),t('sx_s2_hint'));
  if(!S.br.data){openTask(head+'<div class="spin"></div>');try{await brLoad();}catch(e){}}
  const D=bizTodayISO();let h=head;
  if(S.br.err)h+=brErrHtml();
  const data=S.br.data||[];
  data.forEach(B=>{const P=brPlan(B);
    const o=S.orders.find(x=>x.branch===B.code&&x.d===D&&String(x.note||'').startsWith('📋'));
    let cls='',sub='',go=true;
    if(!B.cd){cls='wait';sub='⏳ '+t('sx_br_wait');go=false;}
    else if(P.sent){cls='done';sub='✓ '+t('sx_br_sent')+(o&&o.bill_no?' · 🧾 '+esc(o.bill_no):'');}
    else if(!P.need.length){cls='done';sub=t('sx_br_nothing');go=false;}
    else sub='<span class="tkqty">'+t('sx_br_send_n',{n:P.need.length})+'</span>';
    h+=(go?'<button class="tkcard '+cls+'" data-br="'+esc(B.code)+'" onclick="brSendFromTask(this.dataset.br)">':'<div class="tkcard '+cls+'">')+
      '<div class="mthumb">🏪</div><div class="tkmid"><div class="tkname">'+esc(branchName(B.code))+'</div><div>'+sub+'</div></div>'+
      '<span class="tkgo">'+(cls==='done'?'✓':go?'›':'')+'</span>'+(go?'</button>':'</div>');});
  const man=S.orders.filter(o=>(o.status==='new'||o.status==='prep')&&o.d<=D);
  if(man.length){h+='<div class="tksec">📝 '+t('sx_order_manual')+'</div>';
    man.forEach(o=>{h+='<button class="tkcard" data-id="'+esc(o.id)+'" onclick="orderDetail(this.dataset.id)"><div class="mthumb">🏪</div>'+
      '<div class="tkmid"><div class="tkname">'+esc(o.branch_name||branchName(o.branch))+'</div><div>'+t('sx_items_n',{n:(S.orderItems[o.id]||[]).length})+'</div></div><span class="tkgo">›</span></button>';});}
  if(!data.length&&!man.length)h+=tkEmpty(t('sx_br_none'));
  openTask(h);}

let TB=null;
async function taskBuy(){
  if(!canKitchen())return;
  const head=tkHead('🛒 '+t('sx_s5'),t('sx_s5_hint'));
  if(!S.kpAvg){openTask(head+'<div class="spin"></div>');try{await kpAvgLoad();}catch(e){}}
  const by={};const g=s=>(by[s]=by[s]||{sup:s,rows:[],po:null});
  kpBuyRows().filter(r=>r.short>0).forEach(r=>g(r.it.sup||'').rows.push(r));
  S.pos.filter(p=>p.status==='draft'&&(S.poItems[p.id]||[]).length).forEach(p=>{g(p.sup||'').po=p;});
  TB=by;
  const ks=Object.keys(by).sort((a,b)=>a.localeCompare(b,'th'));
  ks.forEach(k=>{const x=by[k];
    x.today=!x.rows.length||x.rows.some(r=>r.orderToday);x.runOut=x.rows.some(r=>r.runOut);
    x.oDay=x.rows.length?x.rows.map(r=>r.oDay).sort()[0]:bizTodayISO();
    x.arrive=x.rows.length?x.rows.map(r=>r.arrive).sort()[0]:null;});
  const now=ks.filter(k=>by[k].today||by[k].runOut),later=ks.filter(k=>!by[k].today&&!by[k].runOut);
  let h=head;
  if(!now.length)h+=tkEmpty(t('sx_buy_none'));
  now.forEach(k=>{h+=buyCardHtml(k,by[k]);});
  if(later.length)h+='<details class="tdmore sdlater"><summary>📅 '+t('sd_later')+' ('+later.length+')</summary>'+later.map(k=>buyCardHtml(k,by[k])).join('')+'</details>';
  const sent=S.pos.filter(p=>p.status==='ordered'&&p.d_order===bizTodayISO());
  if(sent.length){h+='<div class="tksec">✅ '+t('sx_buy_sent')+'</div>';
    sent.forEach(p=>{h+='<div class="tkcard done small"><div class="tkmid"><div class="tkname">🏷️ '+esc(p.sup||'-')+'</div><div>'+t('sx_items_n',{n:(S.poItems[p.id]||[]).length})+'</div></div><span class="tkgo">✓</span></div>';});}
  openTask(h);}

let TB_BUSY=false;
function buyText(x){ // ข้อความใบสั่งจากรายการบนจอ (ไม่ต้องรอบันทึก) — แบบเดียวกับ poText
  if(x.po)return poText(x.po);
  const due=x.rows.map(r=>r.arrive||r.produceD).sort()[0];
  const L=['🛒 จริงใจหมูกระทะ','🏭 ครัวกลาง','🏷️ '+(x.sup||'-'),'📅 สั่งวันที่ '+thDate(bizTodayISO()),'🚚 ส่งวันที่ '+(due?thDate(due):'-'),''];
  x.rows.forEach(r=>L.push('• '+r.it.name+' — '+fmtQ(r.buyN)+' '+(r.it.buy_unit||r.it.unit||'')));
  L.push('','รวม '+x.rows.length+' รายการ');return L.join('\n');}
async function buyEnsurePo(x){ // ยังไม่มีใบสั่ง → ทำใบสั่งของร้านนี้ (เหมือนปุ่มสร้างใบสั่งซื้อเดิม)
  if(x.po||!x.rows.length)return x.po;
  const po={id:uid('po'),po_no:nextPoNo(),sup:x.sup,d_order:bizTodayISO(),d_due:x.rows.map(r=>r.arrive||r.produceD).sort()[0],
    order_by:x.rows.map(r=>r.orderBy).sort()[0],status:'draft',by_name:S.user.name,note:t('pr_from_plan')};
  await insFallback('ck_pos',[po],['order_by']);
  const lines=x.rows.map((r,i)=>({po_id:po.id,item_id:r.it.id,name:r.it.name,unit:r.it.buy_unit||r.it.unit||'',qty:r.buyN,price:r.it.price,sort:i}));
  const ins=await dbi(()=>sb.from('ck_po_items').insert(lines).select());
  S.pos.unshift(po);S.poItems[po.id]=ins||lines;x.po=po;return po;}
async function buySupGo(sup,copy){
  const x=TB&&TB[sup];if(!x||TB_BUSY)return;
  const gid=supLineId(sup);
  if(copy||!gid){ // คัดลอก / เปิดไลน์ต้องทำทันทีตอนกด (มือถือบล็อกถ้ารอบันทึกก่อน) แล้วค่อยถามว่าส่งแล้วหรือยัง
    const tx=buyText(x);
    if(copy)copyText(tx,()=>toast('✅ '+t('kf_copied',{s:sup})));
    else{try{window.open('https://line.me/R/share?text='+encodeURIComponent(tx),'_blank');}catch(e){}}
    TB_BUSY=true;
    try{const po=await buyEnsurePo(x);
      if(po&&po.status==='draft'&&confirm(t('sx_sent_q',{s:sup}))){await poSetOrdered(po);toast('✅ '+t('sx_marked'));}}
    finally{TB_BUSY=false;}
    applyChrome();taskBuy();return;}
  TB_BUSY=true;let po=null;
  try{po=await buyEnsurePo(x);}finally{TB_BUSY=false;}
  if(po)await poSendLine(po.id);
  applyChrome();taskBuy();}

function taskRecv(){
  if(!canKitchen())return;
  const D=bizTodayISO();
  const pos=S.pos.filter(p=>p.status==='ordered').sort((a,b)=>String(a.d_due||'').localeCompare(String(b.d_due||'')));
  let h=tkHead('📥 '+t('sx_s6'),t('sx_s6_hint'));
  if(!pos.length)h+='<div class="tkhint">'+t('sx_recv_none')+'</div>';
  pos.forEach(p=>{h+='<button class="tkcard" data-id="'+esc(p.id)+'" onclick="billFromPo(this.dataset.id)"><div class="mthumb">🚚</div>'+
    '<div class="tkmid"><div class="tkname">🏷️ '+esc(p.sup||'-')+'</div><div>'+t('sx_items_n',{n:(S.poItems[p.id]||[]).length})+
    (p.d_due?' · '+t('sx_recv_due',{d:dispDate(p.d_due)}):'')+'</div></div><span class="tkgo">›</span></button>';});
  h+='<button class="btn big tkother" onclick="billNew()">＋ '+t('sx_recv_other')+'</button>';
  const today=(S.bills||[]).filter(b=>b.d===D);
  if(today.length){h+='<div class="tksec">✅ '+t('sx_recv_today')+'</div>';
    today.forEach(b=>{h+='<button class="tkcard done small" data-id="'+esc(b.id)+'" onclick="billOpen(this.dataset.id)"><div class="tkmid"><div class="tkname">🏷️ '+esc(b.sup||'-')+'</div>'+
      '<div>฿'+fmt(b.total,2)+(b.bill_no?' · #'+esc(b.bill_no):'')+'</div></div><span class="tkgo">✓</span></button>';});}
  openTask(h);}

/* ============================================================
   🏷️ ร้านค้า (ซัพ) — กลุ่มไลน์ของแต่ละร้าน + วัตถุดิบที่ซื้อร้านนั้น (เจ้าของสั่ง 2026-10-06:
   "กลุ่มไลน์ตั้งตรงไหน อยากให้มีหน้าตั้งค่า supplier พร้อมตั้งกลุ่มไลน์ และเพิ่มวัตถุดิบเข้าแต่ละซัพ
    และเชื่อมบอทตัวเดียวกับระบบสต๊อก")
   บอทตัวเดียวกับแอพนับสต๊อก: ส่งผ่าน Edge Function line-order (หรือ sc_config.line_endpoint ถ้าแอพนับตั้งไว้) ·
   รายชื่อกลุ่ม = line_groups · ดึงกลุ่มใหม่ = sync-line-groups · ชื่อกลุ่มที่ตั้งเอง = line_groups.name (สองแอพเห็นชื่อเดียวกัน) ·
   ร้านเดียวกันในแอพนับ (suppliers.line_group_id ชื่อตรงกัน) = แนะนำกลุ่มให้กดใช้ได้เลย
   ============================================================ */
const supKey=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const lgNamed=gid=>{const g=(S.lineGroups||[]).find(x=>String(x.group_id)===String(gid));return !!(g&&g.name&&String(g.name).trim());};
function supItems(name){return S.items.filter(i=>i.active!==false&&(i.sup||'')===name);}
async function stkSupsLoad(force){ // ซัพของแอพนับสต๊อก — อ่านอย่างเดียว เอากลุ่มไลน์ที่ผูกไว้แล้วมาแนะนำ
  if(S.stkSups&&!force)return S.stkSups;
  let r=null;try{r=await sb.from('suppliers').select('name,line_group_id');}catch(e){r=null;}
  S.stkSups=(r&&!r.error&&r.data)||[];return S.stkSups;}
function stkGroupOf(name){const k=supKey(name);if(!k)return null;
  const x=(S.stkSups||[]).find(s=>supKey(s.name)===k&&s.line_group_id);return x?String(x.line_group_id):null;}
const LG_SYNC_MS=6*3600*1000;   // แอพนับสต๊อกใช้คีย์เดียวกัน (jjsc_lgsync — โดเมนเดียวกัน) สองแอพจึงไม่ดึงซ้ำกัน
async function lgSync(auto){ // ดึงกลุ่มที่บอทอยู่ + ชื่อกลุ่มล่าสุด (Edge Function ของแอพนับสต๊อก)
  if(S._lgSyncing)return;S._lgSyncing=true;
  if(!auto)toast('⏳ '+t('sp_lg_syncing'));
  const before={};(S.lineGroups||[]).forEach(g=>{before[String(g.group_id)]=String(g.name||'');});
  try{await fetch(SB_URL+'/functions/v1/sync-line-groups',{method:'POST',
    headers:{'Content-Type':'application/json',apikey:SB_ANON,Authorization:'Bearer '+SB_ANON},body:'{}'});}catch(e){}
  try{await lineGroupsLoad(true);}catch(e){}
  (S.lineGroups||[]).forEach(g=>{const o=before[String(g.group_id)];if(o&&!String(g.name||'').trim())g.name=o;}); // ไลน์ไม่ส่งชื่อมา = คงชื่อเดิม
  try{localStorage.setItem('jjsc_lgsync',String(Date.now()));}catch(e){}
  S._lgSyncing=false;
  const n=(S.lineGroups||[]).length;
  if(!auto)toast(n?t('sp_lg_found',{n}):t('sp_lg_none'),!n);
  const after={};(S.lineGroups||[]).forEach(g=>{after[String(g.group_id)]=String(g.name||'');});
  if(!auto||JSON.stringify(after)!==JSON.stringify(before))spRepaint();}   // ดึงเองเบื้องหลังแล้วไม่มีอะไรเปลี่ยน = ไม่วาดทับหน้าที่ใช้อยู่
function lgAutoSync(){let last=0;try{last=+(localStorage.getItem('jjsc_lgsync')||0)||0;}catch(e){}
  if(Date.now()-last>=LG_SYNC_MS)lgSync(true);}
async function lgRename(gid){
  if(!canKitchen())return;
  const g=(S.lineGroups||[]).find(x=>String(x.group_id)===String(gid));
  const nn=String(prompt(t('sp_lg_rename_q'),(g&&g.name)||'')||'').trim();if(!nn)return;
  await once(async()=>{
    let r=null;try{r=await sb.from('line_groups').update({name:nn}).eq('group_id',gid).select();}catch(e){r={error:e};}
    if(!r||r.error||!(r.data||[]).length){toast(t('sp_lg_rename_fail')+(r&&r.error?' — '+String(r.error.message||r.error).slice(0,80):''),true);return;}
    if(g)g.name=nn;toast('✅ '+t('sv_ok'));spRepaint();});}
function spRepaint(){ // หลังดึงกลุ่ม/ตั้งชื่อ — วาดหน้าที่เปิดอยู่ใหม่
  const box=document.getElementById('modalBox'),open=document.getElementById('modalWrap').classList.contains('on');
  if(S.tab==='sups')show('sups');
  if(open&&SP&&box&&box.querySelector('[data-sp]'))paintSp();}

      '<div class="xs mut">'+supSchedLine(s)+'</div></div>'+
      '<span class="tkgo">›</span></button>';}).join('')+'</div>';
  if(orphans.length){h+='<div class="tksec">🏷️ '+t('sp_orphans')+'</div>';
    orphans.forEach(n=>{h+='<div class="tkcard small"><div class="mthumb">🏷️</div><div class="tkmid"><div class="tkname">'+esc(n)+'</div>'+

function spFilter(){const q=supKey(SP_Q);
  document.querySelectorAll('#spList .spcard').forEach(b=>{b.style.display=!q||b.dataset.n.indexOf(q)>=0?'':'none';});}
function spHowHtml(){return '<ol class="spsteps"><li>'+t('sp_how1')+'</li><li>'+t('sp_how2')+'</li><li>'+t('sp_how3')+'</li><li>'+t('sp_how4')+'</li></ol>';}
async function spUseStock(){ // ร้านที่ยังไม่มีกลุ่ม แต่แอพนับสต๊อกผูกร้านชื่อเดียวกันไว้แล้ว → ใช้กลุ่มเดียวกัน
  if(!canKitchen())return;
  const list=S.sups.filter(s=>!s.line_group_id&&stkGroupOf(s.name));if(!list.length)return;
  if(!confirm(t('sp_use_stock_q',{n:list.length})+'\n\n'+list.map(s=>'• '+s.name+' → '+lgName(stkGroupOf(s.name))).join('\n')))return;
  await once(async()=>{let n=0;
    for(const s of list){const gid=stkGroupOf(s.name);
      await updFallback('ck_sups',{line_group_id:gid},s.id,['line_group_id']);
      if(S.flowSql===false)break;
      s.line_group_id=gid;n++;}
    if(S.flowSql===false)toast(t('kf_need_sql'),true);else toast('✅ '+t('sp_use_stock_ok',{n}));
    show('sups');});}
async function spAddName(name){ // ชื่อร้านที่มีในวัตถุดิบ แต่ยังไม่มีในรายการร้าน
  if(!canKitchen())return;name=String(name||'').trim();if(!name)return;
  let s=S.sups.find(x=>x.name===name);
  if(!s)await once(async()=>{const row={id:uid('sp'),name,lead_days:1};
    await dbi(()=>sb.from('ck_sups').insert(row));S.sups.push(row);s=row;});
  if(!s)return;
  if(S.tab==='sups')show('sups');
  supPage(s.id,SP&&SP.back);}

async function spSetGroup(v){
  const s=SP&&S.sups.find(x=>x.id===SP.id);if(!s||!canKitchen())return;
  const gid=String(v||'').trim()||null;
  await once(async()=>{
    try{await updFallback('ck_sups',{line_group_id:gid},s.id,['line_group_id']);}catch(e){paintSp();return;}
    if(S.flowSql===false){toast(t('kf_need_sql'),true);paintSp();return;}
    s.line_group_id=gid;
    toast(gid?'✅ '+t('sp_line_saved',{g:lgName(gid)}):t('sp_line_cleared'));
    if(S.tab==='sups')show('sups');
    paintSp();});}

  await lineGroupsLoad();

    try{await lineSend(String(gid),'🔔 ทดสอบจากระบบครัวกลาง JJ\nกลุ่มนี้จะได้รับใบสั่งของของร้าน "'+s.name+'" ครับ');
      toast('✅ '+t('sp_test_ok',{g:lgName(gid)}));}
    catch(e){toast(t('kf_line_fail')+' — '+String(e.message||e).slice(0,100),true);}});}
async function spItemOff(id){
  const s=SP&&S.sups.find(x=>x.id===SP.id),it=itemById(id);if(!s||!it||!canKitchen())return;
  if(!confirm(t('sp_item_off_q',{n:dispName(it),s:s.name})))return;
  await once(async()=>{
    await dbi(()=>sb.from('ck_items').update({sup:''}).eq('id',id));
    it.sup='';paintSp();});}
function spItemEdit(id){itemEdit(id);if(!IT_DRAFT)return;IT_DRAFT._fromSp=true;MODAL_BACK=paintSp;}   // บันทึก/ปิด = กลับหน้าร้าน
function spNewItem(){const s=SP&&S.sups.find(x=>x.id===SP.id);if(!s)return;
  itemEdit();if(!IT_DRAFT)return;IT_DRAFT.sup=s.name;IT_DRAFT._fromSp=true;paintItemEdit();MODAL_BACK=paintSp;}
function spEditInfo(){const s=SP&&S.sups.find(x=>x.id===SP.id);if(!s)return;
  supEdit(s.id).then(()=>{MODAL_BACK=paintSp;});}

/* ---------- เลือกวัตถุดิบเข้าร้าน ---------- */
let SPK=null;
function spPick(){SPK={sel:{},q:''};paintSpk();}
function paintSpk(){
  const s=SP&&S.sups.find(x=>x.id===SP.id);if(!s||!SPK)return;
  const list=S.items.filter(i=>i.active!==false&&(i.sup||'')!==s.name)
    .sort((a,b)=>(a.sup?1:0)-(b.sup?1:0)||dispName(a).localeCompare(dispName(b),'th'));   // ยังไม่มีร้าน ขึ้นก่อน
  let h=tkHead('＋ '+t('sp_add_items'),t('sp_pick_hint',{s:esc(s.name)}),'SPK=null;paintSp()');
  if(list.length>6)h+='<input id="spkQ" placeholder="🔎 '+t('search')+'" value="'+esc(SPK.q)+'" oninput="SPK.q=this.value;spkFilter()" style="margin-bottom:10px">';
  h+='<div id="spkList">'+list.map(i=>'<label class="tkcard small spk" data-n="'+esc(supKey(dispName(i)+' '+i.name))+'">'+
    '<input type="checkbox" class="spkcb" data-id="'+esc(i.id)+'"'+(SPK.sel[i.id]?' checked':'')+' onchange="spkTick(this)">'+thumbHtml(i,'🥬')+
    '<div class="tkmid"><div class="tkname">'+esc(dispName(i))+'</div><div class="xs '+(i.sup?'mut':'spok')+'">'+
    (i.sup?t('sp_now_at',{s:esc(i.sup)}):t('sp_no_shop'))+'</div></div></label>').join('')+'</div>';
  if(!list.length)h+=tkEmpty(t('sp_pick_none'));
  else h+='<div class="spkfoot"><button class="btn big ok" id="spkGo" onclick="spPickSave()" disabled></button></div>';
  openTask(h);spkTick();spkFilter();}
function spkTick(cb){if(cb&&SPK)SPK.sel[cb.dataset.id]=cb.checked;
  const n=SPK?Object.keys(SPK.sel).filter(k=>SPK.sel[k]).length:0;
  const b=document.getElementById('spkGo');if(b){b.disabled=!n;b.textContent='✓ '+t('sp_pick_go',{n});}}
function spkFilter(){const q=supKey(SPK&&SPK.q);
  document.querySelectorAll('#spkList .spk').forEach(r=>{r.style.display=!q||r.dataset.n.indexOf(q)>=0?'':'none';});}
async function spPickSave(){
  const s=SP&&S.sups.find(x=>x.id===SP.id);if(!s||!SPK||!canKitchen())return;
  const ids=Object.keys(SPK.sel).filter(k=>SPK.sel[k]&&itemById(k));if(!ids.length)return;
  const moving=ids.map(itemById).filter(i=>i.sup&&i.sup!==s.name);
  if(moving.length&&!confirm(t('sp_move_q',{n:moving.length,s:s.name})+'\n\n'+moving.slice(0,8).map(i=>'• '+dispName(i)+' ('+i.sup+')').join('\n')))return;
  await once(async()=>{
    await dbi(()=>sb.from('ck_items').update({sup:s.name}).in('id',ids));
    ids.forEach(id=>{const i=itemById(id);if(i)i.sup=s.name;});
    SPK=null;toast('✅ '+t('sp_added',{n:ids.length}));
    if(S.tab==='sups')show('sups');
    paintSp();});}

function methodSteps(note){
  return String(note||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>{
    if(/^[*※]/.test(x))return {tip:true,tx:x.replace(/^[*※\s]+|[*\s]+$/g,'')};
    return {tip:false,tx:x.replace(/^\d+(?:\.\d+)*[.)](?!\d)\s*/,'')};}).filter(x=>x.tx);}
function methodHtml(r,b,secCls){
  const st=methodSteps(r&&r.note);if(!st.length)return '';
  let n=0;
  return '<div class="'+(secCls||'secbar')+'">📝 '+t('sx_method')+'</div>'+
    (b!=null&&Math.abs(num(b)-1)>1e-9?'<div class="tkhint">'+t('sx_method_scale',{y:fmtQ(r.yield_qty)+' '+esc(trUnit(r.yield_unit||''))})+'</div>':'')+
    '<div class="tmsteps">'+st.map(x=>'<div class="tmstep'+(x.tip?' tip':'')+'"><span class="n">'+(x.tip?'💡':(++n))+'</span><span>'+esc(x.tx)+'</span></div>').join('')+'</div>';}

function wdNames(){return (I18N[LANG]&&I18N[LANG].wd)||I18N.th.wd;}
function wdOf(ds){const p=String(ds).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getDay();}
function dayDiff(a,b){const pa=String(a).split('-').map(Number),pb=String(b).split('-').map(Number);
  return Math.round((new Date(pb[0],pb[1]-1,pb[2])-new Date(pa[0],pa[1]-1,pa[2]))/864e5);}
function supDaysOf(s){return [...new Set((s&&Array.isArray(s.order_days)?s.order_days:[]).map(Number))].filter(d=>Number.isInteger(d)&&d>=0&&d<=6).sort();}
function supLeadOf(s){const v=s&&s.lead_days;return (v==null||String(v).trim()==='')?1:Math.max(0,parseInt(v,10)||0);}
function canOrderOn(days,ds){return !days.length||days.includes(wdOf(ds));}
function nextOrderDay(days,ds){for(let i=1;i<=14;i++){const d=addDays(ds,i);if(canOrderOn(days,d))return d;}return addDays(ds,1);}
function supPlanOf(name,lead,today){ // วันสั่ง · วันของมา · วันของรอบถัดไปมา
  const days=supDaysOf(supByName(name));
  const oDay=canOrderOn(days,today)?today:nextOrderDay(days,today);
  return {days,oDay,orderToday:oDay===today,arrive:addDays(oDay,lead),nextArrive:addDays(nextOrderDay(days,oDay),lead)};}
function supDaysTxt(s){const d=supDaysOf(s);if(!d.length)return t('sd_every');const W=wdNames();return d.map(x=>W[x]).join(' · ');}
function shortDate(ds){const p=String(ds).split('-').map(Number);const L=I18N[LANG]||I18N.th;
  return wdNames()[wdOf(ds)]+' '+p[2]+' '+((L.mo||I18N.th.mo)[p[1]-1]);}

/* ============================================================
   📋 นับสต๊อกเป็นหน่วยของสินค้า (เจ้าของสั่ง 2026-10-06: "น้ำปลา ขวดละ 1500 มล. แต่เวลานับจะนับเป็นชิ้น เป็นขวด เป็นแกลลอน"
   + "อยากให้แยกเป็นหมวดหมู่") — ck_items.count_unit (ว่าง = ระบบเลือก: ภาชนะเล็กสุดที่รู้ขนาด เช่น ขวด ก่อน ลัง)
   ============================================================ */
const WV_UNITS=['กก.','ขีด','กรัม','ลิตร','มล.'];   // หน่วยชั่ง/ตวง
function countUnitAuto(it){
  const base=(it&&it.unit)||'';
  if(base&&!WV_UNITS.includes(base))return base;   // นับเป็นชิ้นอยู่แล้ว (ฟอง ขวด ถุง)
  const c=[];if(it.buy_unit&&it.buy_unit!==base&&num(it.buy_qty)>1)c.push([it.buy_unit,num(it.buy_qty)]);
  itemPacks(it).forEach(p=>c.push([p.u,num(p.q)]));
  const best=c.filter(x=>x[1]>1&&!WV_UNITS.includes(x[0])).sort((a,b)=>a[1]-b[1])[0];
  if(best)return best[0];
  return base==='กรัม'?'กก.':base==='มล.'?'ลิตร':base;}
function countUnitOf(it){if(!it)return '';
  if(it.count_unit&&unitFactor(it,it.count_unit)!=null)return it.count_unit;
  const u=countUnitAuto(it);return unitFactor(it,u)!=null?u:(it.unit||'');}
function allItemCats(){const out=ITEM_CATS.slice();S.items.forEach(i=>{const c=i.cat||'อื่นๆ';if(!out.includes(c))out.push(c);});return out;}
function catIc(c){return ITEM_CAT_IC[c]||'🧺';}

  cats.forEach(c=>{const list=S.items.filter(i=>i.active!==false&&(i.cat||'อื่นๆ')===c).sort((a,b)=>dispName(a).localeCompare(dispName(b),'th'));

  openTask(h);cuFilter();

function cuRow(i,cats){
  const cu=countUnitOf(i),base=i.unit||'';

  return '<div class="curow" data-n="'+esc(supKey(dispName(i)+' '+i.name))+'">'+thumbHtml(i,catIc(i.cat))+

    '<label><span>'+t('it_cat')+'</span><select data-id="'+esc(i.id)+'" onchange="cuSetCat(this)">'+
      cats.map(c=>'<option value="'+esc(c)+'"'+(c===(i.cat||'อื่นๆ')?' selected':'')+'>'+esc(trCat(c))+'</option>').join('')+
      '<option value="__new">＋ '+esc(t('cu_new_cat'))+'</option></select></label>'+
    '<label><span>'+t('cu_lb')+'</span><select data-id="'+esc(i.id)+'" onchange="cuSetUnit(this)"'+(S.scSql===false?' disabled':'')+'>'+
      '<option value=""'+(!i.count_unit?' selected':'')+'>'+esc(t('cu_auto',{u:trUnit(auto)}))+'</option>'+
      itemUnits(i).map(u=>'<option value="'+esc(u)+'"'+(i.count_unit===u?' selected':'')+'>'+esc(trUnit(u))+'</option>').join('')+
      '<option value="__new">＋ '+esc(t('cu_new_unit'))+'</option></select></label></div>'+
    '<div class="xs mut">'+(cu!==base?esc(unitEqTxt(i,cu))+' · ':'')+esc(t('cu_base',{u:trUnit(base)}))+'</div></div></div>';}
function cuFilter(){const q=supKey(CU_Q);
  document.querySelectorAll('#modalBox .curow').forEach(r=>{r.style.display=!q||r.dataset.n.indexOf(q)>=0?'':'none';});}
async function cuSetCat(sel){
  const it=itemById(sel.dataset.id);if(!it||!canKitchen())return;

async function countUnitSave(it,u){ // false = ยังไม่ได้รัน SQL (ไม่มีคอลัมน์ count_unit)
  const r=await sb.from('ck_items').update({count_unit:u||null}).eq('id',it.id);
  if(r&&r.error){if(/count_unit/.test(String(r.error.message||r.error))){S.scSql=false;toast(t('cu_need_sql'),true);return false;}
    toast(t('sv_err')+(r.error.message||r.error),true);return false;}
  it.count_unit=u||null;return true;}
async function cuSetUnit(sel){
  const it=itemById(sel.dataset.id);if(!it||!canKitchen())return;
  let v=sel.value;
  await once(async()=>{
    if(v==='__new'){
      const u=String(prompt(t('cu_new_unit_q'))||'').trim();if(!u){paintCu(true);return;}
      if(unitFactor(it,u)==null){
        const q=num(String(prompt(t('cu_size_q',{u,b:trUnit(it.unit||'')}))||'').replace(/,/g,''));
        if(!(q>0)){toast(t('need_qty'),true);paintCu(true);return;}

    paintCu(true);});}

/* ============================================================
   📒 สมุดสต๊อก — ยกมา + รับเข้า − ใช้ = ควรเหลือ · เทียบกับที่นับได้ (เจ้าของสั่ง 2026-10-06
   "อย่าลืมเก็บข้อมูลพวก รับของ+สต๊อกเดิม-ใช้=สต๊อก") — คิดจาก ck_moves ที่เก็บทุกความเคลื่อนไหวอยู่แล้ว
   คงเหลือ ณ วันสุดท้าย = ยอดตอนนี้ − ความเคลื่อนไหวหลังวันนั้น · ยกมา = คงเหลือ − ความเคลื่อนไหวในช่วง
   ============================================================ */
let LG={range:'7d',from:'',to:'',q:'',cat:'',rows:null,a:'',b:''};
function lgRange(){const today=bizTodayISO();
  if(LG.range==='today')return [today,today];
  if(LG.range==='month')return [today.slice(0,8)+'01',today];
  if(LG.range==='custom'&&LG.from&&LG.to)return LG.from<=LG.to?[LG.from,LG.to]:[LG.to,LG.from];
  return [addDays(today,-6),today];}
async function ledgerOpen(){LG.range=LS.get('jjck_lgr','7d')||'7d';LG.rows=null;await ledgerLoad();}
async function ledgerLoad(){
  const [a,b]=lgRange();LG.a=a;LG.b=b;
  openTask(tkHead('📒 '+t('lg_title'),t('lg_hint'),"closeModal();show(S.tab)")+'<div class="spin"></div>');
  let mv=[];
  try{mv=await dbi(()=>sbAll(()=>sb.from('ck_moves').select('d,kind,item_kind,ref_id,qty').gte('d',a).order('d').order('id'),200).then(data=>({data})));}
  catch(e){mv=null;}
  LG.rows=mv?lgCompute(mv,a,b):[];LG.err=!mv;paintLg();}
function lgCompute(mv,a,b){
  const R={};
  const g=(k,id)=>{const key=k+'|'+id;if(R[key])return R[key];const o=k==='recipe'?recipeById(id):itemById(id);if(!o)return null;
    return (R[key]={k,o,after:0,rec:0,use:0,made:0,send:0,adj:0,oth:0});};
  S.items.forEach(i=>g('item',i.id));S.recipes.forEach(r=>g('recipe',r.id));
  mv.forEach(m=>{const x=g(m.item_kind==='recipe'?'recipe':'item',m.ref_id);if(!x||m.d<a)return;const q=num(m.qty);
    if(m.d>b){x.after+=q;return;}
    if(m.kind==='buy')x.rec+=q;else if(m.kind==='use')x.use-=q;else if(m.kind==='made')x.made+=q;
    else if(m.kind==='send')x.send-=q;else if(m.kind==='adjust')x.adj+=q;else x.oth+=q;});
  const z=v=>Math.abs(v)<1e-9;
  return Object.values(R).map(x=>{x.close=rnd4(num(x.o.qty)-x.after);
    x.expect=rnd4(x.close-x.adj);x.open=rnd4(x.expect-(x.rec-x.use+x.made-x.send+x.oth));return x;})
    .filter(x=>!(z(x.open)&&z(x.rec)&&z(x.use)&&z(x.made)&&z(x.send)&&z(x.adj)&&z(x.oth)&&z(x.close)));}
function lgUnit(x){if(x.k==='recipe')return {u:x.o.yield_unit||'',f:1};const u=countUnitOf(x.o);return {u,f:unitFactor(x.o,u)||1};}
function lgCat(x){return x.k==='recipe'?'__menu':(x.o.cat||'อื่นๆ');}
function lgRowHtml(x){
  const U=lgUnit(x),v=n=>fmtQ(rnd2(n/U.f)),u=esc(trUnit(U.u));
  const parts=['<span class="lgc"><small>'+t('lg_open')+'</small><b>'+v(x.open)+'</b></span>'];
  if(x.k==='item'){parts.push('<span class="lgc in"><small>+ '+t('lg_rec')+'</small><b>'+v(x.rec)+'</b></span>');
    parts.push('<span class="lgc out"><small>− '+t('lg_use')+'</small><b>'+v(x.use)+'</b></span>');}
  else{parts.push('<span class="lgc in"><small>+ '+t('lg_made')+'</small><b>'+v(x.made)+'</b></span>');
    parts.push('<span class="lgc out"><small>− '+t('lg_send')+'</small><b>'+v(x.send)+'</b></span>');
    if(Math.abs(x.use)>1e-9)parts.push('<span class="lgc out"><small>− '+t('lg_use')+'</small><b>'+v(x.use)+'</b></span>');}
  if(Math.abs(x.oth)>1e-9)parts.push('<span class="lgc"><small>± '+t('lg_oth')+'</small><b>'+v(x.oth)+'</b></span>');
  parts.push('<span class="lgc eq"><small>= '+t('lg_expect')+'</small><b>'+v(x.expect)+'</b></span>');
  const adj=rnd2(x.adj/U.f);
  return '<div class="lgrow" data-n="'+esc(supKey(dispName(x.o)+' '+x.o.name))+'"><div class="lgname">'+esc(dispName(x.o))+' <span class="xs mut">('+u+')</span></div>'+
    '<div class="lgeq">'+parts.join('')+'</div>'+
    (Math.abs(adj)>1e-9?'<div class="lgadj '+(adj<0?'bad':'ok')+'">📋 '+t('lg_count')+' '+v(x.close)+' · '+(adj<0?t('lg_short',{v:fmtQ(-adj)}):t('lg_over',{v:fmtQ(adj)}))+'</div>'
      :'<div class="xs mut">'+t('lg_close')+' '+v(x.close)+'</div>')+'</div>';}
function paintLg(){
  const rows=LG.rows||[];const q=supKey(LG.q);
  const cats=allItemCats().concat(['__menu']).filter(c=>rows.some(x=>lgCat(x)===c));
  if(LG.cat&&!cats.includes(LG.cat))LG.cat='';
  let h=tkHead('📒 '+t('lg_title'),t('lg_hint'),"closeModal();show(S.tab)");

  if(LG.range==='custom')h+='<div class="grid2" style="margin-bottom:8px"><input type="date" id="lgF" value="'+esc(LG.from||LG.a)+'" onchange="LG.from=this.value;ledgerLoad()">'+
    '<input type="date" id="lgT" value="'+esc(LG.to||LG.b)+'" onchange="LG.to=this.value;ledgerLoad()"></div>';
  h+='<div class="xs mut" style="margin-bottom:8px">📅 '+esc(dispDate(LG.a))+(LG.a!==LG.b?' – '+esc(dispDate(LG.b)):'')+'</div>';
  if(LG.err)h+='<div class="badbox">'+t('sv_err')+'</div>';
  if(cats.length>1)h+='<div class="catbar">'+'<button class="'+(LG.cat===''?'on':'')+'" data-c="" onclick="LG.cat=this.dataset.c;paintLg()">'+t('all')+'</button>'+
    cats.map(c=>'<button class="'+(LG.cat===c?'on':'')+'" data-c="'+esc(c)+'" onclick="LG.cat=this.dataset.c;paintLg()">'+(c==='__menu'?'🍲 '+t('skc_menus'):catIc(c)+' '+esc(trCat(c)))+'</button>').join('')+'</div>';
  h+='<input placeholder="🔎 '+t('search')+'" value="'+esc(LG.q)+'" oninput="LG.q=this.value;lgFilter()" style="margin-bottom:8px">';
  const show1=x=>!LG.cat||lgCat(x)===LG.cat;
  const list=rows.filter(show1);
  if(!list.length)h+=tkEmpty(t('lg_none'));
  cats.filter(c=>!LG.cat||c===LG.cat).forEach(c=>{const L=list.filter(x=>lgCat(x)===c).sort((a,b)=>dispName(a.o).localeCompare(dispName(b.o),'th'));
    if(!L.length)return;
    h+='<div class="tksec">'+(c==='__menu'?'🍲 '+t('skc_menus'):catIc(c)+' '+esc(trCat(c)))+'</div>'+L.map(lgRowHtml).join('');});
  if(list.length)h+='<button class="btn gh" style="width:100%;margin-top:10px" onclick="lgCsvDl()">⬇ '+t('lg_csv')+'</button>';
  openTask(h);lgFilter();}
function lgFilter(){const q=supKey(LG.q);document.querySelectorAll('#modalBox .lgrow').forEach(r=>{r.style.display=!q||r.dataset.n.indexOf(q)>=0?'':'none';});}
function lgSetRange(r){LG.range=r;LS.set('jjck_lgr',r);if(r==='custom'&&!LG.from){LG.from=LG.a;LG.to=LG.b;}ledgerLoad();}
function lgCsv(){ // ภาษาไทยเสมอ (ไฟล์ให้บัญชี) · หน่วยเดียวกับที่นับ
  const cell=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const L=[['หมวด','ชื่อ','หน่วย','ยกมา','รับเข้า','ผลิตได้','ใช้','ส่งสาขา','อื่นๆ','ควรเหลือ','นับ/ปรับ (+เกิน −ขาด)','คงเหลือ'].join(',')];
  (LG.rows||[]).filter(x=>!LG.cat||lgCat(x)===LG.cat).sort((a,b)=>String(lgCat(a)).localeCompare(String(lgCat(b)),'th')||String(a.o.name).localeCompare(String(b.o.name),'th'))
    .forEach(x=>{const U=lgUnit(x),v=n=>rnd2(n/U.f);
      L.push([x.k==='recipe'?'ของที่ทำเสร็จ':(x.o.cat||'อื่นๆ'),x.o.name,U.u,v(x.open),v(x.rec),v(x.made),v(x.use),v(x.send),v(x.oth),v(x.expect),v(x.adj),v(x.close)].map(cell).join(','));});
  return '﻿'+L.join('\r\n');}
function lgCsvDl(){
  const blob=new Blob([lgCsv()],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='สมุดสต๊อก_'+LG.a+'_'+LG.b+'.csv';document.body.appendChild(a);a.click();

/* ============================================================
   Boot + events
   ============================================================ */
async function enterApp(prof){
  S.prof=prof;
  S.user={id:prof.auth_uid,name:prof.name||prof.username||'?'};
  hideLogin();
  try{await loadAll();}
  catch(e){ // โหลดข้อมูลพลาด (เน็ตหลุด ฯลฯ) — ไม่เด้งกลับหน้า login ให้กดลองใหม่
    document.getElementById('view-dash').innerHTML=
      '<div class="card"><div class="empty">⚠ '+esc((e&&e.message)||e)+'</div>'+
      '<button class="btn big" onclick="location.reload()">'+t('setup_retry')+'</button></div>';
    applyChrome();return;}
  applyChrome();
  const savedTab=LS.get('jjck_tab','today');
  show(VIEWS.includes(savedTab)?savedTab:'today');
  autoBackfillI18n(); // แปลชื่อที่ยังขาดให้เองเงียบๆ (ของที่เพิ่มจากภายนอก/อัพเดทระบบ)
}
async function boot(){
  document.body.setAttribute('data-lang',LANG);
  document.documentElement.lang=LANG;
  applyChrome();paintLogin();
  if(!sb){showLogin();document.getElementById('lgMsg').textContent=t('lg_lib');return;}
  try{
    /* 1) ใบผ่านสดจากหน้าศูนย์รวมแอพ — กินแล้วลบทิ้ง ตรวจกับ pnl_users จริงอีกชั้น */
    let tk=null;
    try{ tk=JSON.parse(localStorage.getItem(TICKET)||'null'); }catch(e){}
    // ต้องมีทั้ง hash และเวลาออกใบ — ใบที่พิมพ์เองในคอนโซล ({u:'admin'}) ห้ามผ่าน
    if(tk&&tk.u&&tk.h&&tk.t&&(!tk.app||tk.app==='kitchen')&&Date.now()-Number(tk.t)<=TICKET_TTL){
      try{ localStorage.removeItem(TICKET); }catch(e){}
      const usr=await centralUser(tk.u).catch(()=>null);
      if(usr&&usr.pass_hash===tk.h&&kitchenAllowed(usr)){
        try{ sessionStorage.setItem(CK_SESS,JSON.stringify({u:usr.username,h:usr.pass_hash})); }catch(e){}
        markUnlocked(); await enterApp(mapCentralProf(usr)); return;
      }
    }
    /* 2) ใบอนุญาตของแท็บนี้ (รีเฟรช/ลากหน้าลงแล้วยังอยู่) */
    const prof=await sbProfile();
    if(prof){
      if(unlockedThisTab()||keepOk(prof.username)){ markUnlocked(); await enterApp(prof); return; }
      lockScreen(prof,''); return;   // เคยล็อกอินในแท็บนี้แต่ยังไม่ปลดล็อก → ขอรหัสซ้ำ
    }
    /* 3) ติ๊ก "จำไว้ในเครื่องนี้ 12 ชม." ไว้ — ตรวจรหัสกับ pnl_users ใหม่ทุกครั้ง (รหัสเปลี่ยน/ถูกปิดสิทธิ์ = ใช้ไม่ได้) */
    const kp=keepRead();
    if(kp){
      const usr=await centralUser(kp.u).catch(()=>null);
      if(usr&&usr.pass_hash===kp.h&&kitchenAllowed(usr)){
        try{ sessionStorage.setItem(CK_SESS,JSON.stringify({u:usr.username,h:usr.pass_hash})); }catch(e){}
        markUnlocked(); await enterApp(mapCentralProf(usr)); return;
      }
      setKeep(null,false);
    }
    /* 4) เปิดลิงก์ตรง → ต้องกรอกรหัส */
    showLogin();
  }catch(e){showLogin();
    document.getElementById('lgMsg').textContent=(e&&e.message)||String(e);}
}
/* ============================================================
   📲 ดึงหน้าลงเพื่อโหลดใหม่ (มือถือ) — ท่าเดียวกับแอพอื่นในเครือ
   จำเป็นเพราะแอพที่ "เพิ่มไปยังหน้าจอโฮม" ไม่มีปุ่มรีเฟรชของเบราว์เซอร์
   ต่างจากแอพอื่นตรงที่โหลดเฉพาะข้อมูลใหม่ ไม่โหลดทั้งหน้า — อยู่หน้าเดิม ไม่ต้องปลดล็อกซ้ำ
   ============================================================ */
(function(){
  if(!('ontouchstart' in window))return;              // เฉพาะจอสัมผัส
  const GO=70,MAX=108;                                // ดึงเกิน 70px = โหลดใหม่
  const bar=document.createElement('div');bar.id='ptr';bar.setAttribute('aria-hidden','true');
  bar.innerHTML='<div class="ptr-c">⟳</div><span class="ptr-t"></span>';
  document.body.appendChild(bar);
  const txt=bar.querySelector('.ptr-t');
  let y0=0,d=0,on=false,busy=false;
  const atTop=()=>{const e=document.scrollingElement||document.documentElement;
    return (window.pageYOffset||e.scrollTop||0)<=0;};
  /* ดึงอยู่ในกล่องที่เลื่อนได้เอง (ตารางกว้าง/ลิสต์ในกล่อง) ไม่นับเป็นท่าดึงรีเฟรช */
  const inScrollable=node=>{
    for(let n=(node&&node.nodeType===1)?node:null;n&&n!==document.body;n=n.parentElement){
      const oy=getComputedStyle(n).overflowY;
      if((oy==='auto'||oy==='scroll')&&n.scrollHeight>n.clientHeight&&n.scrollTop>0)return true;}
    return false;};
  const blocked=()=>busy||document.getElementById('modalWrap').classList.contains('on')||
    document.getElementById('loginOv').classList.contains('on');
  const set=px=>{bar.style.transform='translateY('+px+'px)';};
  document.addEventListener('touchstart',e=>{
    if(blocked()||e.touches.length!==1||!atTop()||inScrollable(e.target)){on=false;return;}
    y0=e.touches[0].clientY;d=0;on=true;
    bar.classList.add('drag');bar.classList.remove('rdy');
    txt.textContent=t('ptr_pull');
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!on)return;
    d=e.touches[0].clientY-y0;
    if(d<=0){set(-60);return;}                        // เลื่อนขึ้น = ปล่อยให้หน้าเลื่อนตามปกติ
    if(!atTop()){on=false;set(-60);return;}
    if(e.cancelable)e.preventDefault();               // กำลังดึงลงจากบนสุด — กันหน้าเด้ง
    const pull=Math.min(d*0.5,MAX);
    set(pull-60);
    const rdy=d>GO;
    bar.classList.toggle('rdy',rdy);
    txt.textContent=t(rdy?'ptr_go':'ptr_pull');
  },{passive:false});
  const end=async()=>{
    if(!on)return;
    on=false;bar.classList.remove('drag');
    if(d<=GO||busy){set(-60);bar.classList.remove('rdy');return;}
    busy=true;bar.classList.add('sp');txt.textContent=t('ptr_load');set(14);
    try{await reloadAll();}catch(e){}
    busy=false;bar.classList.remove('sp','rdy');set(-60);
  };
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',()=>{on=false;bar.classList.remove('drag','rdy');set(-60);},{passive:true});
})();

// nav: แถบบน (มือถือ) + sidebar (จอใหญ่)
document.querySelectorAll('.tabbar button[data-v],.sb-item[data-v]').forEach(b=>{
  b.addEventListener('click',()=>show(b.dataset.v));
});
boot();
</script>
