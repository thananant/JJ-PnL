<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0C0A09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JJ Social">
<title>JJ Social — จริงใจหมูกระทะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --red:#FF4046; --red-d:#C62127; --red-t:rgba(255,64,70,.15);
  --gold:#FFC643; --gold-t:rgba(255,198,67,.13);
  --ink:#F4EFE8; --mut:#A89E93; --bg:#0C0A09; --card:rgba(255,255,255,.035); --line:rgba(255,255,255,.10);
  --ok:#2FE08A; --ok-t:rgba(47,224,138,.13); --bad:#FF5C5C; --bad-t:rgba(255,92,92,.13);
  --blu:#58B0FF; --blu-t:rgba(88,176,255,.13);
  --r:16px; --sh:0 2px 20px rgba(0,0,0,.35); --glow:0 0 18px rgba(255,64,70,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:contain}
html{overscroll-behavior-y:contain}
::selection{background:rgba(255,64,70,.4)}
/* ---------- พื้นหลัง: ออโรร่าแดง-ทอง + เส้นกริดจางๆ ---------- */
body::before{content:'';position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:radial-gradient(38% 30% at 12% 8%,rgba(198,33,39,.25),transparent 60%),
             radial-gradient(30% 26% at 88% 12%,rgba(255,198,67,.11),transparent 60%),
             radial-gradient(42% 36% at 78% 92%,rgba(198,33,39,.16),transparent 60%);
  animation:aur 26s ease-in-out infinite alternate}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(75% 65% at 50% 28%,#000 0%,transparent 100%);
  mask-image:radial-gradient(75% 65% at 50% 28%,#000 0%,transparent 100%)}
@keyframes aur{to{transform:translate3d(3%,4%,0) scale(1.07)}}
h1,h2,h3,.num,.kpi-v{font-family:'Prompt',sans-serif}
.num,.kpi-v{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:15px;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
input,select,textarea{background:rgba(255,255,255,.05);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;width:100%;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,64,70,.14)}
input::placeholder,textarea::placeholder{color:#6E655C}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
select option{background:#1A1512;color:var(--ink)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
::-webkit-scrollbar{height:7px;width:7px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,64,70,.45)}

/* ---------- layout ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(14,11,10,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
header::after{content:'';display:block;height:2px;margin-top:-1px;
  background:linear-gradient(90deg,transparent,var(--red) 18%,var(--gold) 50%,var(--red) 82%,transparent);
  background-size:220% 100%;animation:scan 6s linear infinite;opacity:.85}
@keyframes scan{to{background-position:-220% 0}}
.hrow{display:flex;align-items:center;gap:10px;padding:10px clamp(14px,1.6vw,28px) 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:'Prompt';font-weight:700;font-size:18px}
.brand .hlogo{width:34px;height:34px;border-radius:10px;box-shadow:0 0 14px rgba(255,198,67,.35)}
.brand>span{background:linear-gradient(90deg,#FFF3E0 0%,var(--gold) 45%,#FFF3E0 90%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.brand small{font-weight:500;font-size:11px;display:block;line-height:1;-webkit-text-fill-color:var(--mut);color:var(--mut)}
@keyframes shine{to{background-position:-200% 0}}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 13px;border-radius:9px;font-weight:600;color:var(--mut);font-size:14px;white-space:nowrap;transition:.15s}
.seg button.on{background:linear-gradient(135deg,var(--red-d),var(--red));color:#fff;box-shadow:var(--glow)}
#daysPick{width:auto;padding:7px 30px 7px 10px;font-weight:600;font-size:14px}
#syncDot{width:10px;height:10px;border-radius:50%;background:var(--ok);margin-left:auto;flex:none;position:relative}
#syncDot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--ok);animation:ping 1.8s ease-out infinite}
#syncDot.busy{background:var(--gold)}#syncDot.busy::after{border-color:var(--gold)}
#syncDot.err{background:var(--bad)}#syncDot.err::after{border-color:var(--bad)}
@keyframes ping{0%{transform:scale(.55);opacity:.9}80%,100%{transform:scale(1.9);opacity:0}}
.tabbar{display:flex;gap:4px;overflow-x:auto;padding:4px 10px 9px;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:none;padding:8px 14px;border-radius:99px;font-weight:600;color:var(--mut);font-size:14px;position:relative;border:1px solid transparent}
.tabbar button.on{background:linear-gradient(135deg,var(--red-d),var(--red));color:#fff;box-shadow:var(--glow)}
main{padding:16px clamp(12px,1.6vw,28px) 60px;max-width:1280px;margin:0 auto;position:relative}
.view{display:none}.view.on{display:block;animation:vin .3s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
aside#sideNav{display:none;position:fixed;left:0;top:0;bottom:0;width:225px;background:rgba(17,13,11,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);flex-direction:column;padding:16px 10px 12px;z-index:50;overflow-y:auto}
@media(min-width:1080px){
  aside#sideNav{display:flex}
  header,main{margin-left:225px}
  .tabbar{display:none}
  main{max-width:1180px}
}
.sb-logo{display:flex;gap:10px;align-items:center;padding:2px 8px 14px;font-family:'Prompt'}
.sb-logo img{width:42px;height:42px;border-radius:12px;animation:logoglow 3.5s ease-in-out infinite alternate}
@keyframes logoglow{from{box-shadow:0 0 8px rgba(255,198,67,.25)}to{box-shadow:0 0 22px rgba(255,198,67,.55)}}
.sb-logo b{font-size:15px;display:block;line-height:1.2}
.sb-logo small{color:var(--mut);font-size:11px;font-weight:500}
.sb-sec{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:#6E655C;padding:13px 10px 5px;font-family:'Prompt';text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border-radius:11px;font-weight:600;color:#C9BFB4;font-size:14px;position:relative;transition:.15s}
.sb-item svg,.sb-item .em{width:19px;text-align:center;flex:none}
.sb-item:hover{background:rgba(255,255,255,.06);transform:translateX(2px)}
.sb-item.on{background:var(--red-t);color:var(--red);box-shadow:inset 0 0 0 1px rgba(255,64,70,.32),0 0 16px rgba(255,64,70,.12)}
.sb-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
#sbUser{font-size:12px;color:var(--mut);padding:4px 10px 8px}
.badge{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-family:'Prompt';box-shadow:0 0 10px rgba(255,64,70,.6)}
.tabbar .badge{position:static;transform:none;margin-left:5px}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .2s}
.card:hover{border-color:rgba(255,255,255,.18)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{font-weight:500;color:var(--mut);font-size:12px}
.grid{display:grid;gap:12px}
@media(min-width:840px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;backdrop-filter:blur(8px);transition:.2s}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red),var(--gold));opacity:.8}
.kpi:hover{transform:translateY(-2px);border-color:rgba(255,64,70,.4);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.kpi .t{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi-v{font-size:24px;font-weight:700;margin-top:2px;text-shadow:0 0 18px rgba(255,244,230,.25)}
.kpi .s{font-size:11px;color:var(--mut);margin-top:1px}
.kpi.good .kpi-v{color:var(--ok);text-shadow:0 0 16px rgba(47,224,138,.55)}
.kpi.warn .kpi-v{color:var(--gold);text-shadow:0 0 16px rgba(255,198,67,.5)}
.kpi.bad .kpi-v{color:var(--bad);text-shadow:0 0 16px rgba(255,92,92,.55)}
.btn{background:linear-gradient(135deg,var(--red-d),var(--red));color:#fff;border-radius:11px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 14px rgba(255,64,70,.3);transition:.18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 24px rgba(255,64,70,.5)}
.btn.dk{background:linear-gradient(135deg,#2B2420,#3C312B);box-shadow:0 2px 12px rgba(0,0,0,.45)}
.btn.gh{background:rgba(255,255,255,.05);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.gh:hover{border-color:rgba(255,64,70,.5);box-shadow:0 0 14px rgba(255,64,70,.18)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2.5px 9px;background:rgba(255,255,255,.07);color:#CFC6BB;border:1px solid rgba(255,255,255,.08);white-space:nowrap}
.chip.pos{background:var(--ok-t);color:var(--ok);border-color:rgba(47,224,138,.35)}
.chip.neg{background:var(--bad-t);color:var(--bad);border-color:rgba(255,92,92,.35)}
.chip.neu{background:var(--gold-t);color:var(--gold);border-color:rgba(255,198,67,.35)}
.chip.br{background:var(--blu-t);color:var(--blu);border-color:rgba(88,176,255,.35)}
.chip.sev3{background:var(--bad);color:#fff;border-color:transparent;box-shadow:0 0 12px rgba(255,92,92,.65);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.6}}
.mut{color:var(--mut)} .xs{font-size:11.5px} .sm{font-size:13px} .b{font-weight:700}
.right{text-align:right}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px;font-family:'Prompt'}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.2)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:transparent}
th{background:rgba(255,255,255,.05);text-align:left;font-size:11.5px;color:var(--mut);font-family:'Prompt';padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tr:hover td{background:rgba(255,255,255,.025)}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:13.5px}
.spin{width:24px;height:24px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite;margin:30px auto;box-shadow:0 0 18px rgba(255,64,70,.25)}
@keyframes sp{to{transform:rotate(360deg)}}
canvas{max-width:100%}
.chartbox{position:relative;height:240px}
.chartbox canvas{width:100%!important;height:100%!important}

/* ---------- feed ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select,.filters input{width:auto;padding:7px 10px;font-size:14px}
.filters select{padding-right:30px}
.filters input{flex:1;min-width:140px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:13px 15px;margin-bottom:12px;backdrop-filter:blur(8px);transition:.2s}
.mcard:hover{border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.mcard.neg{border-left:3px solid var(--bad);box-shadow:-8px 0 22px -10px rgba(255,92,92,.55),var(--sh)}
.mcard.pos{border-left:3px solid var(--ok);box-shadow:-8px 0 22px -10px rgba(47,224,138,.5),var(--sh)}
.mcard.neu{border-left:3px solid var(--gold);box-shadow:-8px 0 22px -10px rgba(255,198,67,.45),var(--sh)}
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.mhead .who{font-weight:700;font-family:'Prompt';font-size:14px}
.mhead .when{color:var(--mut);font-size:12px;margin-left:auto}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px;text-shadow:0 0 10px rgba(255,198,67,.55)}
.mtext{white-space:pre-wrap;line-height:1.55;margin:4px 0 8px;color:#E6DFD5}
.mchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.aisum{font-size:13px;color:#DCD3C7;background:linear-gradient(135deg,rgba(255,64,70,.09),rgba(255,198,67,.06));border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:7px 10px;margin-bottom:8px}
.ilist{font-size:12.5px;margin:0 0 8px;padding-left:0;list-style:none}
.ilist li{padding:2px 0}
.replybox{border-top:1.5px dashed rgba(255,255,255,.15);padding-top:9px;margin-top:4px}
.replybox textarea{font-size:14px}
.racts{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.sentline{font-size:12.5px;color:var(--ok);background:var(--ok-t);border:1px solid rgba(47,224,138,.3);border-radius:10px;padding:7px 10px}

/* ---------- chat ---------- */
.chatwrap{display:grid;gap:12px}
@media(min-width:900px){.chatwrap{grid-template-columns:300px 1fr;align-items:start}}
.threads{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-height:70vh;overflow-y:auto;backdrop-filter:blur(8px)}
.thr{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;display:flex;gap:8px;align-items:center;transition:.15s}
.thr:hover{background:rgba(255,255,255,.05)}
.thr.on{background:var(--red-t);box-shadow:inset 3px 0 0 var(--red)}
.thr .nm{font-weight:700;font-size:13.5px;font-family:'Prompt'}
.thr .lst{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.thr .wait{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;margin-left:auto;box-shadow:0 0 8px rgba(255,64,70,.8);animation:blink 1.4s ease-in-out infinite}
.convo{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:70vh;backdrop-filter:blur(8px)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.bub.in{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.07);align-self:flex-start;border-bottom-left-radius:4px}
.bub.out{background:linear-gradient(135deg,var(--red-d),var(--red));color:#fff;align-self:flex-end;border-bottom-right-radius:4px;box-shadow:0 2px 14px rgba(255,64,70,.3)}
.bub.draft{background:var(--gold-t);color:var(--gold);border:1.5px dashed rgba(255,198,67,.55);align-self:flex-end}
.bub .bmeta{display:block;font-size:10.5px;opacity:.8;margin-top:3px}
.chatin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chatin textarea{min-height:42px;max-height:120px}

/* ---------- misc ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);background:rgba(24,19,16,.92);backdrop-filter:blur(10px);border:1px solid rgba(255,64,70,.4);color:#fff;font-size:13.5px;font-weight:600;border-radius:13px;padding:11px 18px;transition:.28s;z-index:99;max-width:88vw;text-align:center;box-shadow:0 6px 30px rgba(0,0,0,.5),0 0 20px rgba(255,64,70,.15)}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--bad);box-shadow:0 6px 30px rgba(0,0,0,.5),0 0 24px rgba(255,92,92,.35)}
#modalWrap{position:fixed;inset:0;background:rgba(5,3,2,.7);backdrop-filter:blur(6px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow-y:auto}
#modalWrap.on{display:flex}
.modal{background:#181310;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px 18px 16px;width:100%;max-width:520px;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 40px rgba(255,64,70,.08);animation:vin .25s ease}
.modal h3{margin:0 0 12px;font-size:16px}
.modal .card{background:rgba(255,255,255,.04)}
#boot{display:none;align-items:center;justify-content:center;min-height:100dvh;text-align:center}
#login{max-width:340px;margin:9vh auto;text-align:center;padding:0 16px;position:relative}
#login .lg,#login .loginlogo{width:76px;height:76px;border-radius:20px;margin:0 auto 14px;display:block;animation:logoglow 3.5s ease-in-out infinite alternate}
#login .lg{background:linear-gradient(135deg,var(--red-d),var(--red));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;font-family:'Prompt'}
#login h1{background:linear-gradient(90deg,#FFF3E0,var(--gold) 50%,#FFF3E0);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.codebx{background:#14100D;border:1px solid rgba(255,255,255,.09);color:#E8DFD3;font-family:ui-monospace,Menlo,monospace;font-size:12px;border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.6}
.copyline{display:flex;gap:7px;align-items:center;margin:6px 0}
.copyline input{font-size:12.5px;font-family:ui-monospace,monospace;background:rgba(0,0,0,.28)}
.hintlink{color:var(--blu);font-weight:600;font-size:13px;text-decoration:underline dotted;text-underline-offset:3px}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:12px;padding:9px 11px;text-align:center;background:rgba(255,255,255,.03);transition:.2s}
.slot:hover{border-color:rgba(255,198,67,.4);transform:translateY(-2px)}
.slot .sv{font-family:'Prompt';font-weight:700;font-size:19px;text-shadow:0 0 14px currentColor}
.faqrow{display:grid;grid-template-columns:1fr 1fr 34px;gap:7px;margin-bottom:7px}
.icb{width:34px;height:38px;border-radius:9px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--bad);font-size:15px}

  .bub{max-width:88%}

  table{font-size:12.5px}

}

/* ---------- login (บัญชีเดียวกับ P&L: ตาราง pnl_users) ---------- */
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const enc=new TextEncoder().encode(str);
  const l=enc.length,bitLen=l*8,withOne=l+1,total=(Math.ceil((withOne+8)/64))*64;
  const M=new Uint8Array(total);M.set(enc);M[l]=0x80;
  const dv=new DataView(M.buffer);
  dv.setUint32(total-4,bitLen>>>0);dv.setUint32(total-8,Math.floor(bitLen/4294967296));
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));const w=new Array(64);
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3),s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[t]+w[t])>>>0,S0=rr(a,2)^rr(a,13)^rr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function pwHash(u,p){return sha256hex(u+'|'+p+'|JJPNL')}
/* ============================================================
   สิทธิ์ & การเข้าสู่ระบบ
   - เข้าจากหน้ารวมระบบ (index.html) → มี "ใบผ่าน" ให้ เข้าได้เลยตามสิทธิ์

   - ใบอนุญาตของแท็บเก็บใน sessionStorage: ปิดแท็บ/ปิดเบราว์เซอร์ = หลุดเอง
   - บัญชี/สิทธิ์ทั้งหมดมาจากตาราง pnl_users ชุดเดียวกับระบบกลาง
   ============================================================ */
const SESS='jjsocial_auth';        // sessionStorage — เฉพาะแท็บนี้
const TICKET='jjsso_ticket';       // localStorage — ใบผ่านจากหน้ารวมระบบ (ใช้ครั้งเดียว)
const TICKET_TTL=120000;           // ใบผ่านอายุ 2 นาที
function sessGet(){try{return JSON.parse(sessionStorage.getItem(SESS)||'null')}catch(e){return null}}
function sessSet(u){try{sessionStorage.setItem(SESS,JSON.stringify(u))}catch(e){}}
function sessClear(){try{sessionStorage.removeItem(SESS)}catch(e){}}

async function fetchUser(username){   // select=* กันพังเวลาคอลัมน์ apps/unit ยังไม่มีในฐานข้อมูล
  const rows=await sel('pnl_users',`select=*&username=eq.${encodeURIComponent(username)}&limit=1`);
  return rows&&rows[0]?rows[0]:null;
}
function useUser(usr){               // เก็บเฉพาะที่ใช้ + แฮชไว้ตรวจซ้ำตอนรีเฟรช
  S.user={username:usr.username,display_name:usr.display_name||usr.username,
    role:usr.role||'staff',unit:usr.unit||'ALL',apps:usr.apps||null,h:usr.pass_hash};
  S.scope=scopeOf(S.user);
  sessSet(S.user);
}
function showLogin(msg){
  $('#boot').style.display='none';
  $('#login').style.display='block';
  if(msg)$('#liMsg').textContent=msg;
  setTimeout(()=>{const el=$('#liUser');if(el)el.focus()},60);
}
async function doLogin(){
  const u=$('#liUser').value.trim(),p=$('#liPass').value,btn=$('#liBtn'),msg=$('#liMsg');
  msg.textContent='';
  if(!u||!p){msg.textContent='กรอกชื่อผู้ใช้และรหัสผ่านก่อนครับ';return}
  btn.disabled=true;btn.textContent='กำลังเข้าสู่ระบบ…';
  try{
    const usr=await fetchUser(u);
    if(!usr||usr.pass_hash!==pwHash(u,p)){msg.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return}
    if(usr.active===false){msg.textContent='บัญชีนี้ถูกปิดการใช้งาน';return}
    useUser(usr);
    if(!firstAllowedTab()){sessClear();msg.textContent=noAccessMsg()+' — แจ้งผู้ดูแลระบบครับ';return}
    $('#login').style.display='none';
    startApp();
  }catch(e){msg.textContent='เชื่อมต่อฐานข้อมูลไม่ได้: '+e.message;console.error(e)}
  finally{btn.disabled=false;btn.textContent='เข้าสู่ระบบ'}
}
function logout(){sessClear();try{localStorage.removeItem(TICKET)}catch(e){}location.href='index.html'}

function fromHub(){   // กดลิงก์มาจากหน้ารวมระบบของเราเอง (เว็บอื่นปลอม referrer ข้ามโดเมนไม่ได้)
  try{
    const r=document.referrer; if(!r)return false;
    const a=new URL(r), me=new URL(location.href);
    if(a.origin!==me.origin)return false;
    const base=me.pathname.replace(/[^/]*$/,'');
    return a.pathname===base||a.pathname===base+'index.html';
  }catch(e){return false}
}

/* ---------- เปิดหน้า: ตัดสินว่าเข้ามาทางไหน ---------- */
async function authBoot(){
  try{localStorage.removeItem('jjsocial_sess')}catch(e){}   // ล้างใบเก่าแบบไม่ตรวจรหัส (เลิกใช้แล้ว)
  // 1) ใบผ่านจากหน้ารวมระบบ — ใช้ได้ครั้งเดียว อายุสั้น แล้วตรวจกับฐานข้อมูลจริงอีกชั้น
  let t=null; try{t=JSON.parse(localStorage.getItem(TICKET)||'null')}catch(e){}
  if(t&&t.u&&(!t.app||t.app==='social')&&Date.now()-(+t.t||0)<TICKET_TTL){
    try{localStorage.removeItem(TICKET)}catch(e){}
    const usr=await fetchUser(t.u).catch(()=>null);
    if(usr&&usr.active!==false&&usr.pass_hash===t.h){
      useUser(usr);
      if(!firstAllowedTab())return showLogin(noAccessMsg());
      return startApp();
    }
  }
  // 1.5) เผื่อหน้ารวมระบบเวอร์ชันเก่าที่ยังไม่ออกใบผ่าน — กดมาจากหน้ารวมระบบจริง + ใบล็อกอินกลางตรงกับฐานข้อมูล
  if(!sessGet()&&fromHub()){
    let a=null; try{a=JSON.parse(localStorage.getItem('jjpnl_auth')||'null')}catch(e){}
    if(a&&a.u){
      const usr=await fetchUser(a.u).catch(()=>null);
      if(usr&&usr.active!==false&&usr.pass_hash===a.h){
        useUser(usr);
        if(!firstAllowedTab())return showLogin(noAccessMsg());
        return startApp();
      }
    }
  }
  // 2) แท็บนี้ล็อกอินไปแล้ว (รีเฟรชหน้า) — ตรวจซ้ำกันสิทธิ์เปลี่ยน/บัญชีถูกปิด
  const s=sessGet();
  if(s&&s.username){
    let usr;
    try{usr=await fetchUser(s.username)}
    catch(e){ S.user=s; S.scope=scopeOf(s); return startApp(); }      // เน็ตสะดุด → ใช้ของเดิมในแท็บไปก่อน
    if(usr&&usr.active!==false&&usr.pass_hash===s.h){
      useUser(usr);
      if(!firstAllowedTab())return showLogin(noBranch()?noAccessMsg():'สิทธิ์ของบัญชีนี้ถูกเปลี่ยน — ติดต่อผู้ดูแลระบบ');
      return startApp();
    }
    sessClear();
    return showLogin('เซสชันหมดอายุหรือรหัสผ่านถูกเปลี่ยน — เข้าสู่ระบบใหม่ครับ');
  }
  // 3) เปิดจากลิงก์ตรง → ต้องใส่รหัส
  showLogin();
}

/* ---------- สิทธิ์รายเมนู (คอลัมน์ apps ของ pnl_users → apps.social) ---------- */
const VIEWS=['dash','feed','chat','insight','bot','ch','set'];
const MENU_LABEL={dash:'แดชบอร์ด',feed:'เสียงลูกค้า',chat:'แชทลูกค้า',insight:'สรุป & ประเด็น',
  bot:'ตั้งค่าแชทบอท',ch:'เชื่อมต่อช่องทาง',set:'ตั้งค่า'};
const ROLE_LABEL={admin:'ผู้ดูแลระบบ',owner:'เจ้าของ',manager:'ผู้จัดการ',staff:'พนักงาน'};
const UNIT_LABEL={ALL:'',OFFICE:'ออฟฟิศ',JJCK:'ครัวกลาง',JJLP:'สาขาลาดพร้าว',JJRD:'สาขารัชดา'};
function isAdmin(){return !!(S.user&&(S.user.role==='admin'||S.user.role==='owner'))}
function permOf(v){                 // 'edit' | 'view' | 'none'
  const u=S.user; if(!u)return 'none';
  if(isAdmin())return 'edit';
  const apps=u.apps;
  if(!apps||typeof apps!=='object'||!Object.keys(apps).length)return 'edit'; // ยังไม่เคยตั้งสิทธิ์ = ไม่ล็อกใคร (กติกาเดียวกับหน้ารวมระบบ)
  const a=apps.social; if(!a||typeof a!=='object')return 'none';
  const f=String(a[v]||'');
  if(/[aed]/.test(f))return S.scope&&GLOBAL_VIEWS.includes(v)?'view':'edit';   // ค่ากลางทุกสาขา: คนที่เห็นเฉพาะบางสาขาดูได้อย่างเดียว
  return f.includes('v')?'view':'none';
}
function firstAllowedTab(){return noBranch()?null:(VIEWS.find(v=>permOf(v)!=='none')||null)}
function noAccessMsg(){
  return noBranch()
    ?'บัญชีนี้ได้สิทธิ์เฉพาะ '+S.scope.map(c=>UNIT_LABEL[c]||c).join(', ')+' ซึ่งไม่มีข้อมูลใน JJ Social'
    :'บัญชีนี้ยังไม่ได้รับสิทธิ์ใช้ JJ Social';
}

/* ---------- เห็นเฉพาะสาขา (เจ้าของสั่ง 2026-10-02 "อยากให้ทุกระบบ กำหนดได้เลยว่า ใครเห็นของสาขาไหนได้บ้าง แบบ payroll") ----------
   ตั้งที่ 🔑 JJ Access → กล่อง JJ Social → apps.social._br = 'JJRD' หรือ 'JJLP,JJRD' · ไม่ตั้ง = ทุกสาขา
   - ผู้ดูแลระบบ/เจ้าของ = ทุกสาขาเสมอ · apps ว่าง = ไม่จำกัด (กติกาเดียวกับ permOf)
   - เสียงลูกค้า: ดึงเฉพาะสาขาที่ดูแล (loadMentions) + กรองซ้ำที่ brFilter · รายการที่ไม่ระบุสาขา (เช่น คอมเมนต์ FB/IG ที่ไม่รู้สาขา) ไม่โชว์
   - สรุป AI แบบรวมทุกสาขา (social_daily branch='ALL') ไม่โชว์ — โชว์เฉพาะสรุปรายสาขา
   - "ตั้งค่าแชทบอท"/"เชื่อมต่อช่องทาง" เป็นค่ากลางทุกสาขา → ดูได้อย่างเดียว (permOf)
   - รายชื่อพนักงาน: เห็นสาขาที่ดูแล + คนที่ตั้งเป็น "ทุกสาขา" (ดูได้ แก้ไม่ได้)
   - แชทลูกค้า (social_chat_log) ไม่มีช่องสาขา → ยังเห็นทุกแชทเหมือนเดิม
   - กันเขียนข้ามสาขาที่ api() จุดเดียว (scopeDeny) + brain('send_reply')
   ⚠️ ข้อมูลยังอ่านได้ด้วยคีย์สาธารณะ (ข้อจำกัดของทั้งระบบ) — นี่คือการจำกัดในแอพ แบบเดียวกับระบบเงินเดือน */
const ALL_BR=['JJLP','JJRD','JJCK','OFFICE'];
const GLOBAL_VIEWS=['bot','ch'];
function scopeOf(u){
  if(!u||u.role==='admin'||u.role==='owner')return null;
  const apps=u.apps;
  if(!apps||typeof apps!=='object'||!Object.keys(apps).length)return null;
  const a=apps.social; if(!a||typeof a!=='object')return null;
  const br=String(a._br||'').split(',').map(x=>x.trim()).filter(x=>ALL_BR.includes(x));
  return br.length?br:null;
}
function myBranches(){return S.branches.filter(b=>!S.scope||S.scope.includes(b.code))}
function inScope(code){return !S.scope||S.scope.includes(code)}       // null/ไม่ระบุสาขา = ไม่ผ่าน (เมื่อถูกจำกัด)
function noBranch(){return !!S.scope&&!myBranches().length}            // ได้แค่สาขาที่ไม่มีใน JJ Social (ครัวกลาง/ออฟฟิศ)
function scopeLabel(){return (S.scope||[]).map(c=>brName(c)).join(', ')}
function permErr(m){const e=new Error(m);e.perm=true;return e}
/* ตัวเลือกสาขาในฟอร์ม — ถูกจำกัด = เฉพาะสาขาที่ดูแล ไม่มีตัวเลือกว่าง (สร้างรายการที่ตัวเองมองไม่เห็นไม่ได้) */
function brOpts(cur,emptyLabel){
  return (S.scope?'':`<option value="">${emptyLabel}</option>`)+
    myBranches().map(b=>`<option value="${esc(b.code)}" ${cur===b.code?'selected':''}>${esc(b.name)}</option>`).join('');
}
function scopeDeny(method,path,body){   // '' = ผ่าน · ข้อความ = ห้ามเขียน
  if(!S.scope||method==='GET')return '';
  const t=path.split('?')[0];
  for(const r of (body==null?[]:Array.isArray(body)?body:[body]))
    if(r&&typeof r==='object'&&'branch' in r&&!inScope(r.branch))
      return 'บัญชีนี้บันทึกได้เฉพาะสาขา '+scopeLabel();
  if(t==='social_mentions'||t==='social_staff'){
    const m=path.match(/[?&]id=eq\.(\d+)(&|$)/);
    if(!m)return method==='POST'?'':'บัญชีนี้แก้ทีละหลายรายการไม่ได้ (เห็นเฉพาะสาขา '+scopeLabel()+')';
    const id=+m[1], br=t==='social_mentions'?S.mBr[id]:(S.staff.find(x=>x.id===id)||{}).branch;
    if(!inScope(br))return 'บัญชีนี้แก้ได้เฉพาะรายการของสาขา '+scopeLabel();
  }
  return '';
}
/* ข้อความ "ไม่มีสิทธิ์" ที่โยนจาก api()/brain() ให้ขึ้นเป็น toast (ปุ่มส่วนใหญ่ไม่ได้ดักเอง) */
window.addEventListener('unhandledrejection',e=>{if(e.reason&&e.reason.perm){toast(e.reason.message,true);e.preventDefault()}});
function needEdit(){                // กันเขียนทับสิทธิ์ (ใช้ในปุ่มที่บันทึกข้อมูล)
  if(permOf(S.tab)==='edit')return true;
  toast('สิทธิ์ของคุณดูได้อย่างเดียวในหน้านี้',true); return false;
}

/* ---------- nav ---------- */
function applyPerms(){
  document.querySelectorAll('[data-v]').forEach(b=>{
    b.style.display=permOf(b.dataset.v)==='none'?'none':'';
  });
  document.querySelectorAll('.sb-sec').forEach(sec=>{
    let el=sec.nextElementSibling,any=false;
    while(el&&!el.classList.contains('sb-sec')&&!el.classList.contains('sb-foot')){
      if(el.classList.contains('sb-item')&&el.style.display!=='none')any=true;
      el=el.nextElementSibling;
    }
    sec.style.display=any?'':'none';
  });
  paintUser();
}
function paintUser(){
  const u=S.user,un=UNIT_LABEL[u.unit]||'';
  $('#sbUser').innerHTML=`👤 ${esc(u.display_name)} · ${esc(ROLE_LABEL[u.role]||'พนักงาน')}${un?' · '+esc(un):''}`+
    (S.scope?` · <span title="เห็นเฉพาะสาขาที่ตั้งไว้ใน JJ Access">🔒 ${esc(scopeLabel())}</span>`:'')+
    ` · <a class="hintlink" href="index.html">ทุกระบบ</a> · <a class="hintlink" href="javascript:logout()">ออก</a>`;
}
async function show(v){
  if(permOf(v)==='none'){const f=firstAllowedTab(); if(!f)return; v=f;}
  S.tab=v; LS.set('jjsocial_tab',v);   // จำหน้าที่เปิดอยู่ — รีเฟรชแล้วกลับมาหน้าเดิม
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='view-'+v));
  const el=$('#view-'+v);
  try{
    if(v==='dash')await vDash(el);
    else if(v==='feed')await vFeed(el);
    else if(v==='chat')await vChat(el);
    else if(v==='insight')await vInsight(el);
    else if(v==='bot')await vBot(el);
    else if(v==='ch')await vCh(el);
    else if(v==='set')await vSet(el);
  }catch(e){el.innerHTML='<div class="empty">โหลดไม่ได้: '+esc(e.message)+'<br><span class="xs">ถ้ายังไม่ได้ติดตั้ง ให้รัน jjmk_social_setup.sql ใน Supabase ก่อนครับ</span></div>';console.error(e)}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-v]'); if(b)show(b.dataset.v);
});

/* ---------- data ---------- */
function sinceIso(){return new Date(Date.now()-S.days*86400000).toISOString()}
async function loadMentions(force){
  const key='m'+S.days;
  if(!force&&S.cache[key])return S.cache[key];
  const rows=await sel('social_mentions',`select=*&posted_at=gte.${sinceIso()}${scopeQ()}&order=posted_at.desc&limit=1000`);
  S.cache[key]=rows||[]; S.cache[key].forEach(r=>{S.mBr[r.id]=r.branch});
  return S.cache[key];
}
/* เห็นเฉพาะสาขา: ให้ฐานข้อมูลส่งมาแค่สาขาที่ดูแล (รายการไม่ระบุสาขาไม่มา) */
function scopeQ(){return S.scope?'&branch=in.('+S.scope.map(encodeURIComponent).join(',')+')':''}
function brFilter(rows){
  if(S.br==='ALL')return S.scope?rows.filter(r=>inScope(r.branch)):rows;
  return rows.filter(r=>r.branch===S.br&&inScope(r.branch));
}
async function loadSettings(){
  const rows=await sel('social_settings','select=*');
  S.settings={};(rows||[]).forEach(r=>S.settings[r.id]=r.val||{});
  return S.settings;
}
async function loadStaff(){S.staff=await sel('social_staff','select=*&order=id')||[];return S.staff}
async function refreshBadges(){
  try{
    const p=await sel('social_mentions',`select=id&reply_status=eq.pending&kind=neq.message&posted_at=gte.${sinceIso()}${scopeQ()}&limit=100`);
    const n=(p||[]).length;
    ['bdFeed','bdFeed2'].forEach(id=>{const b=$('#'+id);if(b){b.style.display=n?'':'none';b.textContent=n>99?'99+':n}});
    const chats=await loadThreads();
    const w=chats.filter(t=>t.waiting).length;
    ['bdChat','bdChat2'].forEach(id=>{const b=$('#'+id);if(b){b.style.display=w?'':'none';b.textContent=w}});
  }catch(e){}
}

/* ============ แดชบอร์ด ============ */
let _charts=[];
function killCharts(){_charts.forEach(c=>{try{c.destroy()}catch(e){}});_charts=[]}
async function vDash(el){
  el.innerHTML='<div class="spin"></div>';
  const all=brFilter(await loadMentions());
  const rows=all.filter(r=>r.kind!=='message');
  const an=rows.filter(r=>r.analyzed_at);
  const rated=rows.filter(r=>r.rating!=null);
  const avgStar=rated.length?(rated.reduce((s,r)=>s+num(r.rating),0)/rated.length):null;
  const avgScore=an.length?Math.round(an.reduce((s,r)=>s+num(r.ai_score),0)/an.length):null;
  const pos=an.filter(r=>r.sentiment==='pos').length,neg=an.filter(r=>r.sentiment==='neg').length,neu=an.length-pos-neg;
  const pending=rows.filter(r=>r.reply_status==='pending').length;
  const urgent=an.filter(r=>(r.issues||[]).some(i=>num(i.severity)>=3));
  const today=new Date();today.setHours(0,0,0,0);
  const todayN=rows.filter(r=>new Date(r.posted_at)>=today).length;

  killCharts();
  el.innerHTML=`
  <div class="kpis">
    <div class="kpi"><div class="t">เสียงลูกค้า (${daysLabel()})</div><div class="kpi-v">${rows.length}</div><div class="s">วันนี้ ${todayN} รายการ</div></div>
    <div class="kpi ${avgStar!=null?(avgStar>=4?'good':avgStar>=3?'warn':'bad'):''}"><div class="t">คะแนนดาวเฉลี่ย</div><div class="kpi-v">${avgStar!=null?avgStar.toFixed(2)+' ★':'—'}</div><div class="s">จาก ${rated.length} รีวิวที่ให้ดาว</div></div>
    <div class="kpi ${avgScore!=null?(avgScore>=75?'good':avgScore>=55?'warn':'bad'):''}"><div class="t">ความพึงพอใจ (AI)</div><div class="kpi-v">${avgScore!=null?avgScore+'/100':'—'}</div><div class="s">ชม ${pos} · กลางๆ ${neu} · ตำหนิ ${neg}</div></div>
    <div class="kpi ${pending?'warn':'good'}"><div class="t">รอตอบกลับ</div><div class="kpi-v">${pending}</div><div class="s"><a class="hintlink" href="javascript:show('feed')">ไปที่ฟีด →</a></div></div>
    <div class="kpi ${urgent.length?'bad':'good'}"><div class="t">ปัญหาเร่งด่วน</div><div class="kpi-v">${urgent.length}</div><div class="s">ความรุนแรงระดับ 3</div></div>
  </div>
  ${urgent.length?`<div class="card" style="border-left:4px solid var(--bad)"><h3>🚨 ต้องดูด่วน</h3>${urgent.slice(0,5).map(r=>`
    <div style="padding:6px 0;border-bottom:1px dashed var(--line)"><span class="chip neg">${esc((r.issues||[]).filter(i=>num(i.severity)>=3).map(i=>i.topic).join(', '))}</span>
    <span class="sm">${esc(r.ai_summary||r.text.slice(0,120))}</span> <span class="xs mut">· ${CH_META[r.channel]?.em||''} ${esc(brName(r.branch))} · ${timeago(r.posted_at)}</span></div>`).join('')}</div>`:''}
  <div class="grid g2">

function djb2(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)}
function parseCSV(txt){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n')i++;
      row.push(cur);cur=''; if(row.length>1||row[0].trim()!=='')rows.push(row); row=[] }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);if(row.length>1||row[0].trim()!=='')rows.push(row)}
  return rows;
}
function impPick(o,keys){
  const lk={};Object.keys(o).forEach(k=>lk[k.toLowerCase().trim()]=o[k]);
  for(const k of keys){const v=lk[k];if(v!=null&&String(v).trim()!=='')return v}
  return null;
}
function impNorm(o){
  const author=impPick(o,['author_title','author_name','reviewer','user_name','username','display_name','author'])??(o.user&&o.user.name)??impPick(o,['name']);
  const text=impPick(o,['review_text','text','snippet','review','comment','content','body']);
  let rating=impPick(o,['review_rating','rating','stars','score','star_rating']);
  rating=rating!=null?parseFloat(String(rating).replace(/[^\d.]/g,'')):null;
  if(rating!=null&&(isNaN(rating)||rating<0||rating>5))rating=null;
  const dt=impPick(o,['review_datetime_utc','review_timestamp','iso_date','datetime','published_at','publishedatdate','created_at','date','time']);
  let posted=null;
  if(dt!=null){const s=String(dt).trim();
    if(/^\d{13}$/.test(s))posted=new Date(+s);
    else if(/^\d{10}$/.test(s))posted=new Date(+s*1000);
    else{const d=new Date(s);if(!isNaN(d))posted=d}}
  const url=impPick(o,['review_link','link','url']);
  const rid=impPick(o,['review_id','id'])||url;
  if(!text&&rating==null)return null;
  return {author:author?String(author):null,text:text?String(text):'',rating,
    posted:posted?posted.toISOString():null,url:url?String(url):null,rid:rid?String(rid):null,raw:o};
}
async function impParse(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const txt=await f.text(); let objs=[];
  try{
    if(/^\s*[\[{]/.test(txt)){const j=JSON.parse(txt);objs=Array.isArray(j)?j:(j.reviews||j.data||j.results||[])}
    else{const rows=parseCSV(txt);const head=(rows.shift()||[]).map(h=>String(h).trim());
      objs=rows.map(r=>{const o={};head.forEach((h,i)=>o[h]=r[i]);return o})}
  }catch(e){$('#impPrev').textContent='อ่านไฟล์ไม่ได้: '+e.message;return}
  const mapped=objs.map(impNorm).filter(Boolean);

async function impDoImport(){

function provTxt(p){
  if(!p)return '';
  const parts=[p.claude?`Claude ${p.claude}`:null,p.gemini?`Gemini ฟรี ${p.gemini}`:null,p.rules?`เบื้องต้น ${p.rules}`:null].filter(Boolean);
  return parts.length?' ('+parts.join(' · ')+')':'';
}

/* ============ แชทลูกค้า ============ */
async function loadThreads(){
  const rows=await sel('social_chat_log','select=*&order=created_at.desc&limit=600')||[];
  const map={};
  rows.forEach(r=>{
    const k=r.channel+'|'+r.thread_id;
    if(!map[k])map[k]={channel:r.channel,thread_id:r.thread_id,name:null,last:r,msgs:[]};
    map[k].msgs.unshift(r);
    if(!map[k].name&&r.direction==='in'&&r.author)map[k].name=r.author;
  });
  const list=Object.values(map);
  list.forEach(t=>{
    const last=t.msgs[t.msgs.length-1];
    // รอตอบ = ลูกค้าพูดล่าสุด หรือหลังจากคนตอบเองครั้งล่าสุด มีเรื่องที่บอทส่งต่อคน (ร่าง/ข้อความขอเวลา/ส่งไม่สำเร็จ)
    // บอทตอบข้อความถัดไปของลูกค้า ("ขอบคุณค่ะ") ไม่ได้แปลว่าเรื่องที่ส่งต่อคนจบแล้ว
    const failed=m=>m.meta&&m.meta.auto&&m.meta.sent===false;
    const handoff=m=>m.meta&&(m.meta.draft||m.meta.fallback||m.meta.needs_human||failed(m));
    const manualAt=t.msgs.map(m=>m.direction==='out'&&!(m.meta&&(m.meta.auto||m.meta.draft))).lastIndexOf(true);
    const since=t.msgs.slice(manualAt+1);
    const lastReal=[...t.msgs].reverse().find(m=>!(m.meta&&m.meta.draft)&&!failed(m));
    t.waiting=!!((lastReal&&lastReal.direction==='in')||since.some(handoff));
    t.lastAt=t.msgs[t.msgs.length-1].created_at;
  });
  list.sort((a,b)=>b.lastAt.localeCompare(a.lastAt));
  S._threads=list; return list;
}
async function vChat(el){
  el.innerHTML='<div class="spin"></div>';

  if(!threads.length){el.innerHTML=`<div class="empty">ยังไม่มีแชทเข้ามา<br><span class="xs">เชื่อมต่อ LINE OA / Facebook ที่หน้า “เชื่อมต่อช่องทาง” แล้วข้อความลูกค้าจะเด้งมาที่นี่แบบเรียลไทม์<br>ตั้งโหมดบอท (ร่างให้ตรวจ/ตอบอัตโนมัติ) ได้ที่หน้า “ตั้งค่าแชทบอท”</span></div>`;return}
  if(!S.chatThread||!threads.find(t=>t.channel+'|'+t.thread_id===S.chatThread))S.chatThread=threads[0].channel+'|'+threads[0].thread_id;
  el.innerHTML=`<div class="chatwrap">
    <div class="threads">${threads.map(t=>{
      const k=t.channel+'|'+t.thread_id;
      return `<div class="thr ${k===S.chatThread?'on':''}" data-k="${esc(k)}" onclick="S.chatThread=this.dataset.k;vChat($('#view-chat'))">

        ${t.waiting?'<span class="wait" title="รอตอบ"></span>':''}</div>`}).join('')}
    </div>
    <div class="convo">
      <div class="msgs" id="msgs"></div>
      <div class="chatin">
        <textarea id="chatText" placeholder="พิมพ์ตอบลูกค้า..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend()}"></textarea>
        <button class="btn" onclick="chatSend()">ส่ง</button>

function renderConvo(){
  const t=(S._threads||[]).find(x=>x.channel+'|'+x.thread_id===S.chatThread); if(!t)return;
  $('#msgs').innerHTML=t.msgs.map(m=>{
    const failed=m.meta&&m.meta.auto&&m.meta.sent===false;
    const draft=(m.meta&&m.meta.draft)||failed;
    return `<div class="bub ${m.direction==='in'?'in':draft?'draft':'out'}">${esc(m.text)}
      <span class="bmeta">${failed?'⚠️ บอทส่งไม่สำเร็จ — ลูกค้ายังไม่ได้รับ · ':draft?'🤖 ร่างจากบอท — ยังไม่ส่ง'+(m.meta.reason&&/ไม่สำเร็จ/.test(m.meta.reason)?' ('+esc(String(m.meta.reason).slice(0,90))+')':'')+' · ':''}${m.direction==='out'&&!draft?(m.meta&&m.meta.auto?'🤖 บอท':'👤 '+esc(m.author||'แอดมิน'))+' · ':''}${new Date(m.created_at).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
      ${draft?`<a class="hintlink" href="javascript:useDraft(${m.id})">ใช้ร่างนี้</a>`:''}</span></div>`;
  }).join('');
  const box=$('#msgs');box.scrollTop=box.scrollHeight;
  const lastDraft=[...t.msgs].reverse().find(m=>m.meta&&(m.meta.draft||(m.meta.auto&&m.meta.sent===false)));
  if(lastDraft&&!$('#chatText').value)$('#chatText').value=lastDraft.text;
}
function useDraft(id){
  const t=(S._threads||[]).find(x=>x.channel+'|'+x.thread_id===S.chatThread);
  const m=t&&t.msgs.find(x=>x.id===id); if(m){$('#chatText').value=m.text;$('#chatText').focus()}

async function chatSend(){
  const txt=$('#chatText').value.trim(); if(!txt)return;
  const t=(S._threads||[]).find(x=>x.channel+'|'+x.thread_id===S.chatThread); if(!t)return;
  try{
    const r=await brain('send_chat',{channel:t.channel,thread_id:t.thread_id,text:txt,by:S.user.username});
    if(r.ok){$('#chatText').value='';await vChat($('#view-chat'));refreshBadges()}

  }catch(e){toast('ส่งไม่ได้: '+e.message,true)}
}

async function genDigest(span){
  $('#digestBox').innerHTML='<div class="spin"></div>';
  try{
    const today=new Date(Date.now()+7*3600000).toISOString().slice(0,10);
    const r=await brain('summary',{date:today,span,wait:true});
    if(!r.ok){$('#digestBox').innerHTML='<div class="empty">'+esc(r.reason||'สรุปไม่ได้')+'</div>';return}
    await vInsight($('#view-insight'));toast('สรุปเสร็จแล้ว ✓');
  }catch(e){$('#digestBox').innerHTML='<div class="empty">สรุปไม่ได้: '+esc(e.message)+'</div>'}
}

async function candMut(i,add){
  const items=[...((S.settings.faq_candidates&&S.settings.faq_candidates.items)||[])];
  const c=items[i];if(!c)return;
  if(add){
    $('#faqList').insertAdjacentHTML('beforeend',
      faqRow({q:c.q,a:/^\(ร้านยังไม่เคยตอบ/.test(c.a)?'':c.a},Date.now()));
    toast('เพิ่มเข้า FAQ ด้านบนแล้ว — ตรวจ/แก้คำตอบ แล้วอย่าลืมกด "บันทึกการตั้งค่าบอท"');
  }
  items.splice(i,1);
  await api('POST','social_settings',[{id:'faq_candidates',val:{items,updated_at:new Date().toISOString()},updated_at:new Date().toISOString()}],'resolution=merge-duplicates');
  S.settings.faq_candidates={items};
  renderCands();
}

async function saveBot(){

function renderBotTest(){
  const b=$('#btMsgs'); if(!b)return;
  b.innerHTML=S.botTest.map(m=>`<div class="bub ${m.role==='user'?'out':'in'}">${esc(m.text)}${m.needs_human?'<span class="bmeta">⚠️ บอทจะส่งต่อให้คน (needs_human)</span>':''}</div>`).join('')||'<div class="empty xs">ยังไม่มีบทสนทนา — พิมพ์ทดสอบด้านล่าง</div>';
  b.scrollTop=b.scrollHeight;
}
async function botTestSend(){
  const t=$('#btIn').value.trim(); if(!t)return;
  S.botTest.push({role:'user',text:t});$('#btIn').value='';renderBotTest();
  try{
    const r=await brain('chat_test',{history:S.botTest.map(m=>({role:m.role==='user'?'user':'assistant',text:m.text}))});
    S.botTest.push({role:'bot',text:r.reply||'(บอทเลือกไม่ตอบ)',needs_human:r.needs_human});
  }catch(e){S.botTest.push({role:'bot',text:'ทดสอบไม่ได้: '+e.message})}
  renderBotTest();
}

async function gbpConnect(){
  try{
    const r=await brain('gbp_auth_url',{u:S.user&&S.user.username,h:S.user&&S.user.h});   // เซิร์ฟเวอร์ตรวจว่าเป็นผู้ดูแล/เจ้าของ
    if(r.ok){toast('เปิดหน้าล็อกอิน Google — เลือกบัญชีที่ดูแลเพจร้าน');window.open(r.url,'_blank')}
    else toast(r.reason||'ยังตั้งค่าไม่ครบ',true);
  }catch(e){toast(e.message,true)}
}
async function gbpSync(full){
  toast(full?'กำลังซิงค์รีวิวทั้งหมด — ประวัติเยอะจะทำเป็นรอบ ๆ (รอบละไม่เกิน 2 นาที) เปิดหน้านี้ทิ้งไว้ได้...':'กำลังซิงค์รีวิวล่าสุด...');
  let added=0,upgraded=0,seen=0,rounds=0,r=null;const errs={};
  try{
    // ซิงค์ทั้งหมดรอบเดียวไม่ทัน → เซิร์ฟเวอร์จำจุดที่ค้างไว้ วนต่อให้เองจนครบ
    // (ทำต่อจากจุดเดิมถ้าค้างไม่เกิน 2 ชม. — เกินกว่านั้นเซิร์ฟเวอร์เริ่มใหม่เอง)
    do{
      if(rounds&&r&&r.loc_errors)await new Promise(ok=>setTimeout(ok,5000)); // Google ตอบผิดพลาด → เว้นจังหวะก่อนลองรอบต่อไป
      r=await brain('gbp_sync',{full,resume:true});
      Object.entries(r.loc_errors||{}).forEach(([id,e])=>errs[id]=e);
      if(!r.ok)break;
      added+=r.added||0;upgraded+=r.upgraded||0;seen+=r.seen||0;rounds++;
      if(r.partial)toast(`ซิงค์ย้อนหลังรอบที่ ${rounds} · ได้รีวิวใหม่แล้ว ${added} · ยังไม่ครบ กำลังดึงต่อ...`);
    }while(full&&r.partial&&rounds<30);
    S.cache={};refreshBadges();await loadSettings();show('ch');
    if(!r.ok){toast('⚠️ '+(r.reason||'ซิงค์ไม่ได้')+(added?` (ก่อนหน้านั้นได้รีวิวใหม่ ${added})`:''),true);return}
    const um=(r.unmapped||[]).length, gaps=r.history_gaps||[], ne=Object.keys(errs).length;
    toast(`ซิงค์แล้ว ✓ รีวิวใหม่ ${added}${upgraded?` · รวมกับของเดิม ${upgraded}`:''} · เห็นทั้งหมด ${seen}`
      +(r.partial?' · ยังไม่ครบ กดซิงค์ทั้งหมดอีกครั้งเพื่อดึงต่อ':'')
      +(gaps.length?` · ⚠️ ประวัติของ ${gaps.join(', ')} ดึงไม่ครบ (Google ไม่ให้ดึง) — ดูข้อความใต้ชื่อโปรไฟล์`:ne&&!r.partial?` · ⚠️ มี ${ne} โปรไฟล์ที่ Google ตอบผิดพลาดระหว่างทาง`:'')
      +(um?` · มี ${um} โปรไฟล์ที่ยังไม่เลือกสาขา (ยังไม่ดึง) — เลือกสาขาด้านล่างแล้วกดบันทึก`:''),!!(r.partial||um||gaps.length||ne));
    if(added&&confirm(`ให้ AI เริ่มไล่วิเคราะห์ ${added} รายการเลยไหม? (เปิดหน้าจอทิ้งไว้ได้)`))analyzeAllPending();
  }catch(e){toast('ซิงค์ไม่ได้: '+e.message+(added?` (ได้รีวิวใหม่ไปแล้ว ${added} — กดซิงค์ทั้งหมดอีกครั้งเพื่อทำต่อ)`:''),true)}
}
async function gbpSaveMap(){
  try{await loadSettings()}catch(e){}   // เอาค่าล่าสุดก่อน กันทับสถานะที่ระบบเพิ่งบันทึก
  const chs={...(S.settings.channels||{})};const gbp={...(chs.gbp||{})};
  const locs=(gbp.locations||[]).map(l=>({...l})), newly=[];
  const gaps={...(gbp.history_gaps||{})};
  document.querySelectorAll('[data-gbpbr]').forEach(sel=>{
    const i=+sel.dataset.gbpbr, v=sel.value||null;
    if(!locs[i])return;
    const was=locs[i].branch;
    if(v&&v!=='skip'&&(!was||was==='skip')){   // เพิ่งเลือกสาขา → ประวัติย้อนหลังยังไม่ได้ดึง
      newly.push(locs[i]);
      gaps[locs[i].id]={title:locs[i].title||locs[i].id,reason:'ยังไม่ได้ดึงรีวิวย้อนหลัง',at:new Date().toISOString()};
    }
    if(!v||v==='skip')delete gaps[locs[i].id];
    if(was!==v&&gbp.full_progress&&gbp.full_progress.locs){   // เปลี่ยนการเลือก → ลืมจุดค้างของโปรไฟล์นี้ ซิงค์รอบหน้าดึงใหม่
      gbp.full_progress={...gbp.full_progress,locs:{...gbp.full_progress.locs}};delete gbp.full_progress.locs[locs[i].id];
    }
    locs[i].branch=v;
  });
  gbp.locations=locs;gbp.history_gaps=gaps;chs.gbp=gbp;
  await api('POST','social_settings',[{id:'channels',val:chs,updated_at:new Date().toISOString()}],'resolution=merge-duplicates');
  S.settings.channels=chs;
  const lp=l=>encodeURIComponent((l.account||gbp.account)+'/'+l.id);
  // รีวิวที่ดึงมาแล้ว → ให้สาขาตรงกับที่เลือก (ทำทุกโปรไฟล์ทุกครั้ง กดซ้ำได้ ถ้าครั้งก่อนสะดุดก็ตามแก้ให้)
  let moved=0,removed=0;
  try{
    for(const l of locs){
      if(!l.branch||l.branch==='skip')continue;
      const rows=await api('PATCH',`social_mentions?channel=eq.google&raw->>gbp=eq.${lp(l)}&or=(branch.is.null,branch.neq.${encodeURIComponent(l.branch)})&select=id`,{branch:l.branch},'return=representation');
      moved+=(rows||[]).length;
    }
    // โปรไฟล์ "ไม่ดึง" ที่ยังมีรีวิวในระบบ → ถามก่อนลบ (รีวิวบน Google ไม่หาย) · เช็คทุกครั้งที่บันทึก เผื่อซิงค์ที่วิ่งค้างเพิ่มกลับมา
    for(const l of locs.filter(x=>x.branch==='skip')){
      const have=await sel('social_mentions',`select=id&channel=eq.google&raw->>gbp=eq.${lp(l)}&limit=5000`)||[];
      if(!have.length)continue;
      if(!confirm(`"${l.title||l.id}" ตั้งเป็น "ไม่ดึง" แล้ว\nมีรีวิวของโปรไฟล์นี้ในระบบ ${have.length} รายการ — ลบออกจากระบบไหม?\n(รีวิวบน Google ไม่หาย · ถ้าเปลี่ยนใจภายหลัง เลือกสาขาแล้วกดซิงค์ทั้งหมดจะดึงกลับมาได้)`))continue;
      const rows=await api('DELETE',`social_mentions?channel=eq.google&raw->>gbp=eq.${lp(l)}&select=id`,null,'return=representation');
      removed+=(rows||[]).length;
    }
  }catch(e){toast('บันทึกสาขาแล้ว แต่ปรับรีวิวเดิมไม่ครบ: '+e.message+' — กดบันทึกอีกครั้งได้',true);S.cache={};return}
  S.cache={};toast('บันทึกสาขาแล้ว ✓'+(moved?` · ย้ายรีวิวเดิม ${moved} รายการไปสาขาที่เลือก`:'')+(removed?` · ลบรีวิวของโปรไฟล์ที่ไม่ดึง ${removed} รายการ`:''));
  // เพิ่งเลือกสาขา → cron ดึงแค่รีวิวล่าสุด ต้องซิงค์ทั้งหมดหนึ่งครั้งถึงจะได้ประวัติย้อนหลัง
  if(newly.length&&confirm(`ดึงรีวิวย้อนหลังของ ${newly.map(l=>l.title||l.id).join(', ')} เลยไหม?\n(ถ้าไม่ดึงตอนนี้ ระบบจะได้แค่รีวิวใหม่ ๆ — กด "⟳ ซิงค์รีวิวทั้งหมด" ทีหลังได้)`))gbpSync(true);
  else show('ch');
}

async function saveGp(silent){

  try{await loadSettings()}catch(e){}   // เอาค่าล่าสุดก่อน กันทับสถานะที่ระบบเพิ่งบันทึก
  const chs={...(S.settings.channels||{}),google_places:rows};
  await api('POST','social_settings',[{id:'channels',val:chs,updated_at:new Date().toISOString()}],'resolution=merge-duplicates');

    openModal(`<h3>🔎 ผลการดึงรีวิว Google</h3>
      <p class="sm" style="margin:0 0 10px">รีวิวใหม่เข้าระบบ <b style="font-size:17px">${r.added}</b> รายการ</p>`

          <div class="sm">รอบนี้ Google ส่งมา <b>${d.reviews_from_google}</b> รายการ${d.newest_api?` (มีชุดล่าสุด ${d.newest_api})`:' (ยังไม่ได้ชุด "ล่าสุด" — เปิด Legacy Places API ใน Google Cloud จะได้เพิ่ม)'}
          · ใหม่ ${d.inserted} · ซ้ำของเดิม ${d.duplicated}</div>

      </div>`).join('')

/* ---------- สถานะระบบ & ค่าใช้จ่าย ---------- */
function fnVersion(id){
  const t=(document.getElementById(id)||{}).textContent||'';
  const m=t.match(/const VERSION = "([^"]+)"/); return m?m[1]:'—';
}
async function copyFn(id,name){
  const code=((document.getElementById(id)||{}).textContent||'').replace(/^\n/,'');
  if(!code){toast('ไม่พบโค้ดในแอป',true);return}
  try{await navigator.clipboard.writeText(code)}
  catch(e){  // เบราว์เซอร์ไม่ให้ใช้ clipboard API → ใช้วิธีเลือกข้อความแทน
    const ta=document.createElement('textarea');ta.value=code;ta.style.cssText='position:fixed;top:-2000px';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove();
  }
  toast(`คัดลอกโค้ด ${name} แล้ว ✓ (${code.split('\n').length} บรรทัด) — ไปวางใน Supabase ได้เลย`);
}
function hRow(st,title,detail,cost){
  const ic={ok:'✅',warn:'⚠️',bad:'❌',off:'⚪'}[st]||'⚪';
  const cc=cost?`<span class="chip ${/เสียเงิน/.test(cost)?'neg':/ฟรี/.test(cost)?'pos':''}" style="margin-left:auto">${esc(cost)}</span>`:'';
  return `<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)">
    <div style="font-size:17px;line-height:1.2">${ic}</div>
    <div style="flex:1;min-width:0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(title)}</b>${cc}</div>
    <div class="xs mut" style="margin-top:2px;line-height:1.6">${detail}</div></div></div>`;
}
function ago(iso){return iso?timeago(iso):'—'}
function ageMin(iso){const t=Date.parse(iso||'');return isNaN(t)?Infinity:(Date.now()-t)/60000}

      busy:'Gemini ช้า/ล่มชั่วคราว — ยังไม่ได้แตะรายการไหน ระบบจะลองใหม่รอบหน้าเอง',
      quota:'โควต้าฟรีของ Gemini วันนี้หมดแล้ว — ระบบทำต่อให้เองหลังรีเซ็ต (ราว 14:00–15:00)',
      key:'คีย์ Gemini ใช้ไม่ได้ — ดูแถว AI ในการ์ดนี้',unsupported:'ยังไม่มีรุ่น Gemini ที่คีย์นี้ใช้ได้ — ดูแถว AI ในการ์ดนี้',
      empty:'ไม่มีรายการ [เบื้องต้น] เหลือแล้ว ✓'}[r.reason];

      :(why||(r.skipped?`Gemini ตอบกลับมาแต่ใช้ไม่ได้ ${r.skipped} รายการ (เช่นถูกบล็อก) — ติดป้ายไว้ ไม่ให้ขวางคิว กด "ลองใหม่" ได้`:'ตอนนี้ AI ยังไม่ว่าง — ระบบจะทำต่อให้เอง')),!r.analyzed&&r.reason!=='empty');
    S.cache={};renderHealth();

            :/ยังไม่ได้เลือกสาขา/.test(String(g.gbp_last_error))?'เชื่อมบัญชีแล้ว เจอโปรไฟล์ร้านแล้ว แต่<b>ยังไม่ได้เลือกสาขา</b> → หน้าเชื่อมต่อช่องทาง เลือกสาขาให้แต่ละโปรไฟล์ (ที่ไม่ใช่ของร้านเลือก "ไม่ดึง") แล้วกด 💾 บันทึกสาขา'
            :!g.gbp_last_sync?'เชื่อมบัญชีแล้ว แต่ Google ยังไม่อนุมัติสิทธิ์ใช้ API (โควต้ายัง 0 — ปกติรอ 2–6 สัปดาห์) · ระหว่างนี้ใช้ Place ID ด้านล่างไปก่อน<br><span class="xs">ข้อความล่าสุด: '+esc(String(g.gbp_last_error).slice(0,160))+'</span>'

          +(le?`<br>มี ${le} โปรไฟล์ที่ดึงรีวิวไม่ได้ (สาขานั้นลองใช้ Place ID แทน — ดูแถว Place ID ด้านล่าง) → หน้าเชื่อมต่อช่องทาง ดูข้อความใต้ชื่อโปรไฟล์ ถ้าไม่ใช่ของร้านเลือก "ไม่ดึง"`:'')

          +(um?`<br>มี ${um} โปรไฟล์ที่ยังไม่เลือกสาขา — <b>ยังไม่ถูกดึง</b> → หน้าเชื่อมต่อช่องทาง เลือกสาขาแล้วกด 💾 บันทึกสาขา`:'')
          +(g.gbp_full_pending?'<br>ซิงค์ย้อนหลังยังไม่ครบ → หน้าเชื่อมต่อช่องทาง กด "⟳ ซิงค์รีวิวทั้งหมด" อีกครั้ง (ทำต่อจากจุดเดิมถ้าค้างไม่เกิน 2 ชม. เกินนั้นเริ่มใหม่ — ของที่มีแล้วข้ามเร็ว)':''),'ฟรี'));

      const lr=g.places_last_result||null, dg=(lr&&lr.diag)||[];
      const httpBad=dg.filter(d=>d.http!==200), noNew=dg.length&&dg.every(d=>!d.newest_api);
      let s3='ok',d3='';
      if(!sc.google_places){s3=g.gbp_connected?'off':'bad';d3='ยังไม่มี secret <b>GOOGLE_MAPS_API_KEY</b>'+(g.gbp_connected?' (ไม่จำเป็นถ้า Business Profile ใช้ได้แล้ว)':'')}
      else if(!g.places){s3=g.gbp_connected?'off':'bad';d3='ยังไม่ได้ใส่ Place ID ในหน้าเชื่อมต่อช่องทาง'}
      else if(httpBad.length){s3='bad';d3='ดึงรอบล่าสุดไม่สำเร็จ: '+httpBad.map(d=>esc(brName(d.branch))+' HTTP '+esc(String(d.http))+' '+esc(String(d.error||'').slice(0,120))).join(' · ')+'<br>ส่วนใหญ่คือยังไม่ผูกบัตรกับโปรเจกต์ Google Cloud หรือจำกัดคีย์ไม่ให้ใช้ Places API'}
      else if(noNew){s3='warn';d3=`ได้แค่ 5 รีวิวเด่นซ้ำ ๆ ไม่ได้รีวิวใหม่ล่าสุด (Legacy: ${esc(dg.map(d=>d.legacy||'?').join(', '))}) → เปิด <a href="https://console.cloud.google.com/apis/library/places-backend.googleapis.com" target="_blank" rel="noopener">Places API (Legacy)</a> ในโปรเจกต์เดียวกับคีย์ และอนุญาตในข้อจำกัดของคีย์`}
      else d3=`ดึงอัตโนมัติทุก 3 ชม. (${Number(g.places)||0} สาขา)`+(g.places_last_poll?' · ดึงล่าสุด '+ago(g.places_last_poll):' · ยังไม่เคยดึง');
      if(s3!=='off')d3+='<br><span class="xs">ค่าใช้จ่าย: ~480 ครั้ง/เดือน อยู่ในโควต้าฟรี 1,000 ครั้ง · ต้องผูกบัตร → ตั้งเพดาน Quotas <b>รายวัน</b> ไม่เกิน 30 ครั้ง ต่อ API (ถ้าตั้งได้แค่รายนาที จะกันเกินรายเดือนไม่ได้) · งบ US$1 แค่ส่งอีเมลเตือน ไม่ได้ตัดการใช้งาน</span>';
      rows.push(hRow(s3,'รีวิว Google — Place ID'+(g.gbp_connected?' (สำรองระหว่างรอ Business Profile)':''),d3,s3==='off'?'':'ฟรีในโควต้า'));
    }
  }
  // --- LINE / Facebook ---
  if(wh&&wh.version){
    const ln=st&&st.line;
    let s4=wh.line?'ok':'off',d4='';
    if(!wh.line)d4='ยังไม่เชื่อม → ตั้ง secret <b>LINE_CHANNEL_SECRET</b> + <b>LINE_CHANNEL_ACCESS_TOKEN</b> ของ OA หน้าร้าน แล้วใส่ Webhook URL ในหน้าเชื่อมต่อช่องทาง';
    else if(ln&&ln.ok===false){s4='bad';d4=esc(ln.error||'ตรวจ token ไม่ผ่าน')}
    else{
      d4='บอทตอบผ่าน reply = <b>ฟรีไม่นับโควต้า</b> · แอดมินกดส่งจากแอป/โหมดร่าง = push (นับโควต้ารายเดือน)';
      if(ln&&ln.type==='limited'&&ln.limit){
        const pct=(ln.used||0)/ln.limit;
        if(pct>=0.8)s4='warn';
        d4+=` · เดือนนี้ใช้ push ไป <b>${ln.used??'?'}/${ln.limit}</b>`+(pct>=1?' — <b>หมดแล้ว</b> ส่งจากแอปไม่ได้จนต้นเดือน':pct>=0.8?' — ใกล้หมด':'');
      }else if(ln&&ln.type==='none')d4+=' · แพ็กเกจนี้ไม่จำกัดจำนวน push'+(ln.used!=null?` (เดือนนี้ใช้ไป ${ln.used})`:'');
    }
    rows.push(hRow(s4,'LINE OA',d4,'ฟรี'));
    const fb=st&&st.facebook;
    let s5=wh.facebook?'ok':'off',d5='';
    if(!wh.facebook)d5='ยังไม่เชื่อม → ตั้ง secret <b>FB_APP_SECRET</b> + <b>FB_PAGE_TOKEN</b> + <b>FB_VERIFY_TOKEN</b> แล้วใส่ Webhook URL';
    else if(fb&&fb.ok===false){s5='bad';d5=esc(fb.error||'Page token ใช้ไม่ได้')}
    else d5='ตั้งค่าครบ'+(fb&&fb.page?' · เพจ <b>'+esc(fb.page)+'</b> token ยังใช้ได้':'')+' · Messenger + คอมเมนต์เข้าระบบแบบเรียลไทม์ (รีวิวเพจ Meta ปิดไปแล้ว) · ต้องเปิดแอป Meta เป็น Live ลูกค้าทั่วไปจึงทักเข้ามาได้';
    rows.push(hRow(s5,'Facebook / Instagram',d5,'ฟรี'));
  }
  box.innerHTML=rows.join('')+
    `<div class="xs mut" style="margin-top:10px;line-height:1.7">สรุป: ใช้<b>โหมด AI ประหยัด</b> (Gemini ฟรี) + <b>Google Business Profile</b> (หรือ Place ID ทุก 3 ชม. ที่มีเพดานกันเกิน) ระบบนี้<b>ไม่มีค่าใช้จ่ายรายเดือน</b> · ที่เสียเงินได้มีแค่ Claude (ถ้าเลือกโหมดคุณภาพสูงสุด) และแพ็กเกจ LINE OA ถ้าแอดมินส่งข้อความเองเกินโควต้าแพ็กเกจฟรี</div>`;
}

async function saveStaff(id){
  const row={name:$('#stName').value.trim(),
    aliases:$('#stAlias').value.split(',').map(x=>x.trim()).filter(Boolean),
    branch:$('#stBr').value||null,shift:$('#stShift').value,
    active:id?$('#stActive').checked:true};
  if(!row.name){toast('ใส่ชื่อก่อนครับ',true);return}
  if(id)await api('PATCH','social_staff?id=eq.'+id,row);
  else await api('POST','social_staff',row);
  closeModal();show('set');
}
async function delStaff(id){
  if(!confirm('ลบรายชื่อนี้?'))return;
  await api('DELETE','social_staff?id=eq.'+id);closeModal();show('set');
}

/* ---------- realtime ---------- */
let _rtLive=false,_rtT=null;
function rtStart(){
  try{
    if(window.supabase&&window.supabase.createClient){
      const c=cfg();const sb=window.supabase.createClient(c.url,c.key);
      sb.channel('jjsocial-live')
        .on('postgres_changes',{event:'*',schema:'public',table:'social_mentions'},rtEvent)
        .on('postgres_changes',{event:'*',schema:'public',table:'social_chat_log'},rtEvent)
        .subscribe(st=>{_rtLive=(st==='SUBSCRIBED')});
    }
  }catch(e){}
  setInterval(()=>{if(!_rtLive&&!document.hidden)rtApply()},90000); // โพลสำรอง
}
function rtEvent(){clearTimeout(_rtT);_rtT=setTimeout(rtApply,1200)}
async function rtApply(){
  if(document.hidden)return;
  const a=document.activeElement;
  if(a&&['TEXTAREA','INPUT'].includes(a.tagName)&&a.value){rtBanner();return} // ไม่ทับของที่พิมพ์ค้าง
  S.cache={};
  refreshBadges();
  if(['dash','feed','chat','insight'].includes(S.tab))await show(S.tab);
}
function rtBanner(){
  let b=document.getElementById('rtBar');
  if(!b){b=document.createElement('div');b.id='rtBar';
    b.innerHTML='🔄 มีข้อมูลใหม่เข้ามา — <b>แตะเพื่อโหลด</b>';
    b.onclick=()=>{b.style.display='none';S.cache={};refreshBadges();show(S.tab)};
    document.body.appendChild(b)}
  b.style.display='block';
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){S.cache={};refreshBadges();if(['dash','feed','chat'].includes(S.tab))show(S.tab)}});

async function loadBranches(){
  try{
    const rows=await sel('pnl_branches','select=*');
    const bs=(rows||[]).map(r=>({code:r.code||r.id,name:r.name||r.display_name||r.code})).filter(b=>b.code);
    if(bs.length)S.branches=bs;
  }catch(e){}
  const my=myBranches();   // เห็นเฉพาะสาขา: ปุ่มเหลือเฉพาะสาขาที่ดูแล · สาขาเดียว = ล็อกไว้ ไม่มี "ทุกสาขา"
  if(!localStorage.getItem('jjsocial_br')&&S.user&&my.find(b=>b.code===S.user.unit))S.br=S.user.unit;  // สังกัดสาขาไหน เปิดมาที่สาขานั้น
  if(S.br!=='ALL'&&!my.find(b=>b.code===S.br))S.br='ALL';
  if(S.scope&&my.length===1)S.br=my[0].code;
  const lock=S.scope&&my.length===1?'🔒 ':'';
  $('#brSeg').innerHTML=[...my.map(b=>`<button data-br="${esc(b.code)}" ${S.br===b.code?'class="on"':''}${lock?' title="บัญชีนี้เห็นเฉพาะสาขานี้"':''}>${lock}${esc(b.name.replace('สาขา',''))}</button>`),
    ...(!S.scope||my.length>1?[`<button data-br="ALL" ${S.br==='ALL'?'class="on"':''}>${S.scope?'ทุกสาขาที่ดูแล':'ทุกสาขา'}</button>`]:[])].join('');
  paintUser();
  $('#brSeg').addEventListener('click',e=>{
    const b=e.target.closest('[data-br]');if(!b)return;
    S.br=b.dataset.br;localStorage.setItem('jjsocial_br',S.br);
    document.querySelectorAll('#brSeg button').forEach(x=>x.classList.toggle('on',x===b));
    show(S.tab);
  });
}
async function startApp(){
  $('#boot').style.display='none';$('#login').style.display='none';$('#app').style.display='block';
  $('#daysPick').value=String(S.days);
  applyPerms();
  await loadBranches();
  if(!firstAllowedTab()){$('#app').style.display='none';return showLogin(noAccessMsg()+' — แจ้งผู้ดูแลระบบครับ')}   // ได้แค่สาขาที่ไม่มีใน JJ Social
  rtStart();refreshBadges();
  if(S._gbpResult){
    const g=S._gbpResult;S._gbpResult=null;
    if(g.ok){toast('✅ เชื่อมต่อ Google Business สำเร็จ — กด "ซิงค์รีวิวทั้งหมด" ได้เลย');await loadSettings();show('ch');return}
    toast('เชื่อมต่อ Google ไม่สำเร็จ: '+g.msg,true);
  }
  let t0=LS.get('jjsocial_tab','dash');
  if(permOf(t0)==='none')t0=firstAllowedTab()||'dash';
  show(t0);   // เปิดมาที่หน้าเดิมก่อนรีเฟรช (เท่าที่มีสิทธิ์)

/* ============================================================
   ลากหน้าลง = รีเฟรช (pull-to-refresh) — ใช้ได้บนมือถือทุกแบบ
   จำเป็นเพราะแอปที่ "เพิ่มไปยังหน้าจอโฮม" (PWA) ไม่มีปุ่ม/ท่ารีเฟรชของเบราว์เซอร์
   แตะที่ยอดสุดของหน้าแล้วลากลงเกิน 70px → ปล่อยนิ้ว = โหลดหน้าใหม่
   ============================================================ */
(function(){
  if(!('ontouchstart' in window))return;              // เฉพาะจอสัมผัส
  var TH=70, MAX=110, y0=0, dy=0, pulling=false, ready=false, bar=null;

  function el(){
    if(bar)return bar;
    bar=document.createElement('div');
    bar.setAttribute('aria-hidden','true');
    bar.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;display:flex;'+
      'align-items:center;justify-content:center;pointer-events:none;'+
      'height:0;overflow:hidden;transition:none;'+
      'font:600 13px/1.2 "Prompt","Sarabun",system-ui,sans-serif;color:#F2CF7A;'+
      'background:linear-gradient(180deg,rgba(163,27,36,.95),rgba(163,27,36,0));';
    bar.innerHTML='<span id="__ptrTxt">ลากลงเพื่อรีเฟรช</span>';
    document.body.appendChild(bar);
    return bar;
  }
  function atTop(){
    var d=document.scrollingElement||document.documentElement;
    return (window.pageYOffset||d.scrollTop||0)<=0;
  }
  /* ลากอยู่ในกล่องที่เลื่อนได้เอง (ตาราง/ลิสต์) ไม่นับ */
  function inScrollable(node){
    for(var n=node;n&&n!==document.body;n=n.parentElement){
      var st=getComputedStyle(n), oy=st.overflowY;
      if((oy==='auto'||oy==='scroll')&&n.scrollHeight>n.clientHeight&&n.scrollTop>0)return true;
    }
    return false;
  }
  /* โหมด kiosk (แท็บเล็ตหน้าร้านให้ลูกค้ากด) ห้ามรีเฟรช — คะแนนที่กดค้างไว้จะหาย */
  function kiosk(){
    return document.body.classList.contains('kiosk') ||
           /[?&]kiosk=/.test(location.search);
  }
  document.addEventListener('touchstart',function(e){
    if(kiosk()){pulling=false;return;}
    if(e.touches.length!==1||!atTop()||inScrollable(e.target)){pulling=false;return;}
    y0=e.touches[0].clientY; dy=0; pulling=true; ready=false;
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(!pulling)return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0||!atTop()){ if(bar){bar.style.height='0';} return; }
    if(e.cancelable)e.preventDefault();                // กันหน้าเด้งตามนิ้ว
    var h=Math.min(dy*0.5,MAX), b=el();
    b.style.height=h+'px';
    ready = dy>TH;
    var t=b.querySelector('#__ptrTxt');
    if(t)t.textContent = ready ? 'ปล่อยเพื่อรีเฟรช' : 'ลากลงเพื่อรีเฟรช';
  },{passive:false});

  document.addEventListener('touchend',function(){
    if(!pulling)return; pulling=false;
    var b=el();
    if(ready){
      b.style.height='44px';
      var t=b.querySelector('#__ptrTxt'); if(t)t.textContent='กำลังโหลด…';
      setTimeout(function(){ location.reload(); },120);
    }else{
      b.style.transition='height .2s'; b.style.height='0';
      setTimeout(function(){ b.style.transition='none'; },220);
    }
  },{passive:true});
})();

async function sha8(s: string) {
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)));

// ทำข้อความให้เทียบกันได้: ตัวเล็ก ตัดช่องว่าง/เครื่องหมาย และคำลงท้าย (เฉพาะท้ายประโยค)
const faqNorm = (t: string) => String(t ?? "").toLowerCase().replace(/[\s\p{P}\p{S}ๆ]+/gu, "")
  .replace(/(ครับ|คับ|ค่ะ|คะ|นะ|จ้า|จ้ะ|ป่ะ|มั้ย|ไหม|หรอ|เหรอ|บ้าง|หน่อย)+$/, "");
function bigrams(t: string) {
  const s = faqNorm(t);
  const out = new Map<string, number>();
  for (let i = 0; i < s.length - 1; i++) { const k = s.slice(i, i + 2); out.set(k, (out.get(k) ?? 0) + 1); }
  return out;
}
function faqMatch(text: string, faq: { q: string; a: string }[]): { q: string; a: string; score: number; cover: number } | null {
  const A = bigrams(text);
  const na = [...A.values()].reduce((x, y) => x + y, 0);
  if (na < 2) return null;
  let best: { q: string; a: string; score: number; cover: number } | null = null;
  for (const f of faq ?? []) {
    if (!f?.q || !f?.a) continue;
    const B = bigrams(f.q);
    const nb = [...B.values()].reduce((x, y) => x + y, 0);
    if (!nb) continue;
    let inter = 0;
    for (const [k, v] of A) inter += Math.min(v, B.get(k) ?? 0);
    const score = (2 * inter) / (na + nb); // Dice coefficient
    const cover = inter / nb;               // คำถามใน FAQ อยู่ในข้อความลูกค้าครบแค่ไหน
    if (!best || score > best.score) best = { q: f.q, a: f.a, score, cover };
  }
  return best && best.score >= 0.6 ? best : null;
}

const FAQ_NEG = ["ไม่", "ยกเลิก", "แย่", "ทำไม", "ช้า", "ผิด", "เสีย", "หาย", "โกง", "คืนเงิน", "ร้องเรียน", "แพง"];
// ตรงเป๊ะ (ข้อความเหมือนคำถามใน FAQ หลังตัดช่องว่าง/คำลงท้าย) = ตอบเองได้ · คล้าย ๆ = เก็บเป็นร่างให้คนกดส่ง
// (เทียบแบบคล้ายอย่างเดียวไม่พอ — "เปิดกี่โมง" มีคำว่า "ปิดกี่โมง" อยู่ข้างในทั้งก้อน)
function faqReply(text: string, faq: { q: string; a: string }[], escalate: string[]) {
  if ((escalate ?? []).some((k) => k && text.includes(k))) return null;
  const hit = faqMatch(text, faq);
  if (!hit) return null;
  const negExtra = FAQ_NEG.some((w) => text.includes(w) && !hit.q.includes(w));
  const sure = faqNorm(text) === faqNorm(hit.q) && !negExtra;
  return { reply: hit.a, needs_human: !sure, reason: `${sure ? "faq-match" : "faq-match-uncertain"} ${hit.score.toFixed(2)}: ${hit.q}` };
}

function splitSegs(t: string): string[] {
  const s = t.split(/\n+|\s{2,}/).map((x) => x.trim()).filter((x) => x.length > 3);
  return s.length ? s : [t];
}
function ruleAnalyze(r: any, staff: any[]): z.infer<typeof Analysis> {
  const text = String(r.text ?? "");
  const segs = splitSegs(text);
  const issues: any[] = [], praises: any[] = [], topicsSet = new Set<string>(), staffOut: any[] = [];
  let posN = 0, negN = 0;
  for (const seg of segs) {
    const p = LEX.pos.filter((w) => seg.includes(w)).length;
    const ng = LEX.neg.filter((w) => seg.includes(w)).length;
    posN += p; negN += ng;
    const segTopics = Object.entries(TOPIC_KW).filter(([, kws]) => kws.some((w) => seg.includes(w))).map(([t]) => t);
    segTopics.forEach((t) => topicsSet.add(t));
    const detail = seg.slice(0, 140);
    if (ng > p) for (const t of (segTopics.length ? segTopics : ["อื่นๆ"])) issues.push({ topic: t, detail, severity: DANGER.some((w) => seg.includes(w)) ? 3 : 2 });
    else if (p > 0) for (const t of segTopics) praises.push({ topic: t, detail });
    for (const st of staff) {
      const names = [st.name, ...(st.aliases ?? [])].filter(Boolean);
      if (names.some((nm: string) => nm.length > 1 && seg.includes(nm)) && !staffOut.find((x) => x.name === st.name))
        staffOut.push({ name: st.name, sentiment: ng > p ? "neg" : p > 0 ? "pos" : "neu", detail });
    }
  }
  const seenI = new Set(), seenP = new Set();
  const issues2 = issues.filter((i) => !seenI.has(i.topic) && seenI.add(i.topic)).slice(0, 6);
  const praises2 = praises.filter((p) => !seenP.has(p.topic) && seenP.add(p.topic)).slice(0, 6);
  let score = r.rating != null ? Number(r.rating) * 20 : 50;
  score += 4 * posN - 6 * negN;
  score = Math.max(0, Math.min(100, Math.round(score)));
  const sentiment: "pos" | "neu" | "neg" = r.rating != null
    ? (Number(r.rating) >= 4 && negN <= posN ? "pos" : Number(r.rating) <= 2 ? "neg" : score >= 60 ? "pos" : score <= 45 ? "neg" : "neu")
    : (score >= 62 ? "pos" : score <= 45 ? "neg" : "neu");
  let slot = "unknown";
  if (/ดึก|ตี\s?[1-5]|เที่ยงคืน|[3-5]\s?ทุ่ม|2[2-3]:|เกือบปิด/.test(text)) slot = "late";
  else if (/เย็น|ค่ำ|[1-2]\s?ทุ่ม|1[89]:|20:|มื้อค่ำ/.test(text)) slot = "dinner";
  else if (/บ่าย|1[5-7]:/.test(text)) slot = "afternoon";
  else if (/เที่ยง|กลางวัน|1[12]:/.test(text)) slot = "lunch";
  const issueTopics = issues2.map((i) => i.topic), praiseTopics = praises2.map((p) => p.topic);
  const summary = `[เบื้องต้น] ${sentiment === "pos" ? "ลูกค้าพอใจ" : sentiment === "neg" ? "ลูกค้าไม่พอใจ" : "ความเห็นกลางๆ"}${praiseTopics.length ? " · ชม: " + praiseTopics.join(", ") : ""}${issueTopics.length ? " · ติ: " + issueTopics.join(", ") : ""}`;
  const reply = sentiment === "neg"
    ? `ขออภัยอย่างยิ่งสำหรับประสบการณ์ครั้งนี้ครับ ทางร้านขอน้อมรับ${issueTopics.length ? "เรื่อง" + issueTopics.join("และ") : "ทุกคำติชม"}ไปปรับปรุงโดยเร็วที่สุด และขอโอกาสดูแลให้ดีขึ้นในครั้งหน้านะครับ 🙏`
    : sentiment === "pos"
      ? "ขอบคุณมากๆ เลยครับ 🙏 ทีมงานดีใจสุดๆ แล้วมาให้เราดูแลอีกนะครับ"
      : "ขอบคุณสำหรับคำติชมครับ ทางร้านจะนำไปพัฒนาให้ดียิ่งขึ้นครับ 🙏";
  return { sentiment, ai_score: score, topics: [...topicsSet], issues: issues2, praises: praises2, staff: staffOut, visit_slot: slot as any, branch: r.branch ?? "unknown", summary, reply };
}
function normAnalysis(j: any): z.infer<typeof Analysis> | null {
  if (!j || typeof j !== "object") return null;
  try {
    return {
      sentiment: ["pos", "neu", "neg"].includes(j.sentiment) ? j.sentiment : "neu",
      ai_score: Math.max(0, Math.min(100, Number(j.ai_score ?? j.score ?? 50) || 50)),
      topics: Array.isArray(j.topics) ? j.topics.map(String) : [],

      staff: Array.isArray(j.staff) ? j.staff.map((s: any) => ({ name: String(s?.name ?? ""), sentiment: ["pos", "neu", "neg"].includes(s?.sentiment) ? s.sentiment : "neu", detail: String(s?.detail ?? "") })).filter((s: any) => s.name) : [],
      visit_slot: ["lunch", "afternoon", "dinner", "late", "unknown"].includes(j.visit_slot) ? j.visit_slot : "unknown",
      branch: String(j.branch ?? "unknown"),

  } catch { return null; }
}
const GEMINI_SCHEMA_ANALYSIS = `\n\nตอบเป็น JSON ล้วนตามโครงสร้างนี้เท่านั้น (ห้ามมีข้อความอื่น):

const GEMINI_SCHEMA_DIGEST = `\n\nตอบเป็น JSON ล้วนตามโครงสร้างนี้เท่านั้น:

function ruleDigest(set: any[]): z.infer<typeof Digest> {
  const ic: Record<string, { n: number; sev: number; ex: string }> = {}, pc: Record<string, { n: number; ex: string }> = {};
  const sg: Record<string, number> = {}, sbad: Record<string, number> = {};
  const slots: Record<string, { n: number; sum: number }> = {};
  let pos = 0, neg = 0;
  for (const r of set) {
    if (r.sentiment === "pos") pos++; if (r.sentiment === "neg") neg++;
    (r.issues ?? []).forEach((i: any) => { const k = i?.topic ?? "อื่นๆ"; ic[k] = ic[k] ?? { n: 0, sev: 1, ex: i?.detail ?? "" }; ic[k].n++; ic[k].sev = Math.max(ic[k].sev, Number(i?.severity) || 1); });
    (r.praises ?? []).forEach((p: any) => { const k = p?.topic ?? "อื่นๆ"; pc[k] = pc[k] ?? { n: 0, ex: p?.detail ?? "" }; pc[k].n++; });
    (r.staff ?? []).forEach((s: any) => { if (s?.sentiment === "neg") sbad[s.name] = (sbad[s.name] ?? 0) + 1; else if (s?.sentiment === "pos") sg[s.name] = (sg[s.name] ?? 0) + 1; });
    const sl = r.visit_slot ?? "unknown";
