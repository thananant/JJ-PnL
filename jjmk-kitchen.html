  const n=Object.keys(P.sel).filter(x=>P.sel[x]).length;
  let h='<h3>'+esc(t('sp_add_items'))+' · '+esc(s.name)+'</h3><div class="hintbox">'+esc(t('sp_pick_hint',{s:s.name}))+'</div>'+
    '<input class="srch" id="spPq" type="search" placeholder="'+esc(t('search'))+'" value="'+esc(P.q)+'" oninput="SP_PICK.q=this.value;spPickList()" autocomplete="off"><div id="spPickList"></div>'+
    '<div class="row" style="margin-top:12px"><button class="btn gh" onclick="spPickBack()">'+esc(t('back'))+'</button><button class="btn ok grow" id="spPickGo" onclick="spPickGo()"'+(n?'':' disabled')+'>'+esc(t('sp_pick_go',{n}))+'</button></div>';
  MODAL_BACK=null;openModal(h,'task');spPickList(list);
}
function spPickList(list){
  const s=SP&&supById(SP.id),P=SP_PICK,box=document.getElementById('spPickList');if(!s||!P||!box)return;
  if(!list){const q=supKey(P.q),k=supKey(s.name);list=activeItems().filter(i=>supKey(i.sup)!==k&&(!q||supKey(i.name).includes(q)||supKey(dispName(i)).includes(q))).sort((a,b)=>((a.sup?1:0)-(b.sup?1:0))||dispName(a).localeCompare(dispName(b),'th'));}
  box.innerHTML=list.length?list.map(i=>'<div class="sppick'+(P.sel[i.id]?' on':'')+'" data-id="'+esc(i.id)+'" onclick="spPickToggle(this.dataset.id,this)"><span class="ck">✓</span><div class="grow"><div class="b">'+esc(dispName(i))+'</div><div class="xs '+(i.sup?'amber':'mut')+'">'+esc(i.sup?t('sp_now_at',{s:i.sup}):t('sp_no_shop'))+'</div></div></div>').join('')
    :'<div class="empty">'+esc(t('sp_pick_none'))+'</div>';
}
function spPickToggle(id,el){const P=SP_PICK;if(!P)return;P.sel[id]=!P.sel[id];if(el)el.classList.toggle('on',!!P.sel[id]);
  const n=Object.keys(P.sel).filter(x=>P.sel[x]).length,b=document.getElementById('spPickGo');if(b){b.textContent=t('sp_pick_go',{n});b.disabled=!n;}}
function spPickBack(){SP_PICK=null;spPaint();}
async function spPickGo(){
  const s=SP&&supById(SP.id),P=SP_PICK;if(!s||!P||!canKitchen())return;
  const ids=Object.keys(P.sel).filter(x=>P.sel[x]&&itemById(x));if(!ids.length)return;
  const moved=ids.filter(x=>String(itemById(x).sup||'').trim());
  if(moved.length&&!await confirm2(t('sp_move_q',{n:moved.length,s:s.name})))return;
  await once(async()=>{await db(()=>sb.from('ck_items').update({sup:s.name}).in('id',ids));ids.forEach(x=>{itemById(x).sup=s.name;});
    toast(t('sp_added',{n:ids.length}));SP_PICK=null;spPaint();});
}

function spEdit(id){
  if(!canKitchen())return;const s=id?supById(id):null;if(id&&!s)return;
  const days=spDays(s);
  let h='<h3>🏷️ '+esc(s?t('sp_edit_info'):t('sp_new'))+'</h3>'+
    fld(t('name'),'<input id="spName" value="'+esc(s?s.name:'')+'">')+
    fld(t('sp_phone'),'<input id="spPhone" type="tel" inputmode="tel" value="'+esc(s?s.phone||'':'')+'">')+
    '<div class="grid2">'+fld(t('sp_credit'),'<input id="spCredit" type="text" inputmode="numeric" value="'+(s?Math.max(0,parseInt(s.credit_days,10)||0):0)+'"><div class="xs mut">'+esc(t('sp_credit_hint'))+'</div>')+
      fld(t('sp_lead'),'<input id="spLead" type="text" inputmode="numeric" value="'+(s&&s.lead_days!=null?Math.max(0,parseInt(s.lead_days,10)||0):1)+'"><div class="xs mut">'+esc(t('sp_lead_hint'))+'</div>')+'</div>'+
    fld('📅 '+t('sp_days'),'<div class="wdpick" id="spDays">'+t('wd').map((w,i)=>'<button type="button" data-d="'+i+'" class="'+(days.includes(i)?'on':'')+'" onclick="this.classList.toggle(\'on\')">'+esc(w)+'</button>').join('')+'</div><div class="xs mut">'+esc(t('sp_days_hint'))+'</div>')+
    fld(t('note'),'<input id="spNote" value="'+esc(s?s.note||'':'')+'">')+
    '<div class="row" style="margin-top:12px">'+(s?'<button class="btn gh" onclick="spActiveSet(\''+esc(s.id)+'\','+(s.active===false?'true':'false')+')">'+esc(s.active===false?t('sp_restore'):t('sp_off'))+'</button>'+
      (isAdminish()?'<button class="btn gh" onclick="spDel(\''+esc(s.id)+'\')">'+esc(t('sp_del'))+'</button>':''):'')+
    '<button class="btn big grow" style="min-width:140px" onclick="spSave(\''+esc(s?s.id:'')+'\')">💾 '+esc(t('save'))+'</button></div>';
  MODAL_BACK=(s&&SP&&SP.id===s.id)?()=>spPaint():null;openModal(h);
}
async function spSave(id){
  if(!canKitchen())return;
  await once(async()=>{
    const name=String(document.getElementById('spName').value||'').trim();if(!name){toast(t('need_name'),true);return;}
    if(S.sups.some(x=>x.id!==id&&supKey(x.name)===supKey(name))){toast(t('sp_dup'),true);return;}
    const days=[...document.querySelectorAll('#spDays button.on')].map(b=>+b.dataset.d).sort((a,b)=>a-b);
    const row={name,phone:String(document.getElementById('spPhone').value||'').trim()||null,credit_days:Math.max(0,parseInt(document.getElementById('spCredit').value,10)||0),
      lead_days:Math.max(0,parseInt(document.getElementById('spLead').value,10)||0),order_days:(days.length&&days.length<7)?days:null,note:String(document.getElementById('spNote').value||'').trim()||null};
    let s=id?supById(id):null,isNew=!s;
    if(s){const old=s.name;await spWrite(x=>sb.from('ck_sups').update(x).eq('id',s.id),row);Object.assign(s,row);if(old!==name)await spRenameCascade(s,old,name);}
    else{row.id=uid('sp');row.active=true;await spWrite(x=>sb.from('ck_sups').insert(x),row);if(!('active' in row))row.active=true;s=row;S.sups.push(s);}
    S.sups.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'th'));
    toast(isNew?t('sp_line_after'):t('sv_ok'));MODAL_BACK=null;closeModal();
    if(S.tab==='sups')show('sups');
    spOpen(s.id);   // บันทึกแล้วไปหน้าร้าน (ร้านใหม่ = ตั้งกลุ่มไลน์ต่อได้เลย)
  });
}
async function spRenameCascade(s,old,nw){ // เปลี่ยนชื่อร้าน = วัตถุดิบที่ซื้อร้านนี้ + ใบสั่งซื้อที่ยังไม่รับของ ตามชื่อใหม่ (บิลเก่าคงชื่อเดิม)
  const k=supKey(old),ids=S.items.filter(i=>supKey(i.sup)===k).map(i=>i.id);
  if(ids.length){await db(()=>sb.from('ck_items').update({sup:nw}).in('id',ids));S.items.forEach(i=>{if(ids.includes(i.id))i.sup=nw;});}
  try{await sb.from('kc_pos').update({sup_name:nw}).eq('sup_id',s.id).neq('status','received');}catch(e){}}
async function spEnsure(name){ // หาร้านตามชื่อ (ไม่สนตัวพิมพ์/ช่องว่าง) — ไม่มี = สร้างให้
  name=String(name||'').trim();if(!name)return null;const ex=supByName(name);if(ex)return ex;
  const row={id:uid('sp'),name,phone:null,credit_days:0,lead_days:1,order_days:null,note:null,active:true};
  await spWrite(x=>sb.from('ck_sups').insert(x),row);S.sups.push(row);S.sups.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'th'));return row;}
async function spAddName(name){if(!canKitchen())return;await once(async()=>{const s=await spEnsure(name);if(!s)return;toast(t('sv_ok'));if(S.tab==='sups')show('sups');spOpen(s.id);});}
async function spActiveSet(id,on){ // 🗄️ ไม่ใช้แล้ว / ↩️ ใช้ต่อ (ไม่ลบ)
  if(!canKitchen())return;const s=supById(id);if(!s)return;
  if(!on&&!await confirm2(t('sp_off_q',{s:s.name}),{ok:t('sp_off'),danger:true}))return;
  await once(async()=>{await spWrite(x=>sb.from('ck_sups').update(x).eq('id',id),{active:!!on});s.active=!!on;
    toast(on?t('sp_restore'):t('sp_off'));SP=null;MODAL_BACK=null;closeModal();if(S.tab==='sups')show('sups');});}
async function spDel(id){ // ลบถาวร — เฉพาะหัวหน้า
  if(!isAdminish())return;const s=supById(id);if(!s)return;const its=spItemsOf(s.name);
  if(!await confirm2(t('sp_del_q',{s:s.name,n:its.length}),{ok:t('delete'),danger:true}))return;
  await once(async()=>{
    if(its.length){await db(()=>sb.from('ck_items').update({sup:''}).in('id',its.map(i=>i.id)));its.forEach(i=>{i.sup='';});}
    await db(()=>sb.from('ck_sups').delete().eq('id',id));S.sups=S.sups.filter(x=>x.id!==id);
    SP=null;MODAL_BACK=null;closeModal();toast(t('done'));if(S.tab==='sups')show('sups');});}

function acBrIdx(code){const i=(S.branchesAll||[]).findIndex(b=>b.code===code);return i<0?999:i;}
function acCalc(A){ // ตัวเลขทั้งหมดของเดือน (ใช้ทั้งหน้า + CSV + เทส)
  const dls=A.dl.rows.filter(d=>d.status!=='void'&&inBr(d.branch)),ids=new Set(dls.map(d=>String(d.id))),byId={};dls.forEach(d=>{byId[String(d.id)]=d;});
  const rev={};dls.forEach(d=>{const k=d.branch||'?';const r=rev[k]||(rev[k]={code:k,name:d.branch_name||branchName(k),n:0,total:0,cogs:0});r.n++;r.total+=num(d.total);});
  let cogs=0;A.dll.rows.forEach(l=>{if(!ids.has(String(l.delivery_id)))return;const c=num(l.sent)*num(l.unit_cost);cogs+=c;const d=byId[String(l.delivery_id)];if(d&&rev[d.branch||'?'])rev[d.branch||'?'].cogs+=c;});
  const revRows=Object.values(rev).map(r=>Object.assign(r,{total:rnd2(r.total),cogs:rnd2(r.cogs),gross:rnd2(r.total-r.cogs)})).sort((a,b)=>acBrIdx(a.code)-acBrIdx(b.code)||a.name.localeCompare(b.name,'th'));
  const revTotal=rnd2(revRows.reduce((a,r)=>a+r.total,0)),purch=rnd2(A.rc.rows.reduce((a,r)=>a+num(r.total),0)),exp=rnd2(A.ex.rows.reduce((a,r)=>a+num(r.amount),0));
  const units=rnd4(A.pd.rows.reduce((a,p)=>a+num(p.actual_qty!=null?p.actual_qty:p.plan_qty),0)),lots=A.pd.rows.length;
  const un={};A.un.rows.filter(d=>d.status==='sent'&&inBr(d.branch)).forEach(d=>{const k=d.branch||'?';const u=un[k]||(un[k]={code:k,name:d.branch_name||branchName(k),n:0,total:0,oldest:null});u.n++;u.total+=num(d.total);const dd=String(d.d).slice(0,10);if(!u.oldest||dd<u.oldest)u.oldest=dd;});
  const unRows=Object.values(un).map(u=>Object.assign(u,{total:rnd2(u.total)})).sort((a,b)=>acBrIdx(a.code)-acBrIdx(b.code)||a.name.localeCompare(b.name,'th'));
  return {rev:revRows,revTotal,bills:dls.length,cogs:rnd2(cogs),gross:rnd2(revTotal-cogs),purch,rcpts:A.rc.rows.length,exp,expN:A.ex.rows.length,net:rnd2(revTotal-purch-exp),
    units,lots,ohSug:(units>0&&exp>0)?rnd2(exp/units):null,unpaid:unRows,unpaidTotal:rnd2(unRows.reduce((a,u)=>a+u.total,0))};
}

const HS_LIMIT=400;

function hsRange(){const td=bizTodayISO();

function hsPillsPaint(){ // สลับ .on ในที่ — วาดแถบใหม่ทำให้แถบที่เลื่อนไว้เด้งกลับซ้ายสุด ชิปที่เพิ่งกดหลุดจอบนโทรศัพท์ (ผู้ตรวจ V2 2026-10-17) · โครงไม่ครบ = วาดใหม่

let HS_SEQ=0;
async function hsLoad(){
  const seq=++HS_SEQ;const b=document.getElementById('hsBody');if(!b)return;b.innerHTML='<div class="spin"></div>';
  const [a,z]=hsRange();HS_PART=false;HS_CAP=false;
  const get=(tb,build)=>build(sb.from(tb).select('*').gte('d',a).lte('d',z)).order('created_at',{ascending:false}).limit(HS_LIMIT).then(r=>{if(r.error){HS_PART=true;return [];}const d=r.data||[];if(d.length>=HS_LIMIT)HS_CAP=true;return d;}).catch(()=>{HS_PART=true;return [];});
  const [rc,pd,dl,ct,mv]=await Promise.all([get('kc_receipts',q=>q),get('kc_productions',q=>q),get('kc_deliveries',q=>q),get('kc_counts',q=>q),get('kc_moves',q=>q.in('kind',['adjust','waste']))]);

function hsStTxt(st){const k='hs_st_'+st;return I18N.th[k]?t(k):(st||'');}
function hsUnitOf(m){const o=m.ref_kind==='recipe'?recipeById(m.ref_id):itemById(m.ref_id);return o?(m.ref_kind==='recipe'?o.yield_unit:o.unit)||'':'';}
function hsMatch(e){if(HS.type!=='all'&&e.k!==HS.type)return false;const q=supKey(HS.q);if(!q)return true;return (e.txt||[]).concat([e.tt,e.sb]).some(x=>supKey(x).includes(q));}
function hsPaint(){
  const b=document.getElementById('hsBody');if(!b)return;const rows=HS_EV.filter(hsMatch);
  const c=document.getElementById('hsCount');if(c)c.textContent=t('hs_n_events',{n:rows.length});
  let h=(HS_PART?'<div class="badbox">⚠ '+esc(t('hs_load_part'))+'</div>':'')+(HS_CAP?'<div class="badbox">⚠ '+esc(t('hs_load_cap'))+'</div>':'');
  if(!rows.length){b.innerHTML=h+emptyBox(t('hs_empty'));return;}
  const td=bizTodayISO();let last='';
  rows.slice(0,HS_SHOW).forEach(e=>{if(e.d!==last){last=e.d;h+='<div class="hs-day">'+esc(dispDate(e.d))+(e.d===td?' · '+esc(t('today')):'')+'<span class="sp">'+rows.filter(x=>x.d===e.d).length+'</span></div>';}
    h+='<div class="hs-ev k-'+esc(e.k)+(e.cls?' '+esc(e.cls):'')+'" data-k="'+esc(e.k)+'" data-id="'+esc(String(e.id))+'" onclick="hsOpen(this.dataset.k,this.dataset.id)"><div class="ic">'+e.ic+'</div><div class="tx"><div class="tt">'+esc(e.tt)+'</div><div class="sb">'+esc(e.sb)+(e.ts?' · '+esc(dispTime(e.ts)):'')+'</div></div>'+
      '<div class="amt">'+esc(e.amt||'')+(e.amt2?'<small>'+esc(e.amt2)+'</small>':'')+'</div></div>';});
  if(rows.length>HS_SHOW)h+='<button class="btn gh" style="width:100%" onclick="HS_SHOW+=60;hsPaint()">'+esc(t('hs_more'))+' ('+(rows.length-HS_SHOW)+')</button>';
  b.innerHTML=h;}
function hsOpen(k,id){
  const e=HS_EV.find(x=>x.k===k&&String(x.id)===String(id));
  if(k==='receive'){if(e&&e.mv)return hsMoveModal(e.mv);if(typeof rcDetail==='function')return rcDetail(id);}
  if(k==='produce'){if(typeof mkDetail==='function')return mkDetail(id);return hsGeneric('kc_productions','kc_production_lines','production_id',id,'🍳 '+t('hs_t_produce'),hsProdHtml);}
  if(k==='send'){if(typeof blDetail==='function')return blDetail(id);return hsGeneric('kc_deliveries','kc_delivery_lines','delivery_id',id,'🚚 '+t('hs_t_send'),hsDelivHtml);}
  if(k==='count'){if(typeof ctDetail==='function')return ctDetail(id);return hsGeneric('kc_counts','kc_count_lines','count_id',id,'📋 '+t('hs_t_count'),hsCountHtml);}
  if(e&&e.mv)return hsMoveModal(e.mv);}
async function hsGeneric(tb,ltb,fk,id,title,body){
  let r=null,lines=[];try{r=await db(()=>sb.from(tb).select('*').eq('id',id).maybeSingle());if(r)lines=await db(()=>sb.from(ltb).select('*').eq(fk,id).order('sort').order('id'));}catch(e){return;}
  if(!r){toast(t('empty'));return;}
  openModal('<h3>'+title+'</h3>'+body(r,lines)+'<div class="row" style="margin-top:12px"><button class="btn" style="margin-left:auto" onclick="closeModal()">'+esc(t('close'))+'</button></div>');}

function stBrHtml(){const gl=S.lineGroups||[];const rows=(S.branchesAll||[]);

    '<select data-br="'+esc(b.code)+'" onchange="stBrSet(this.dataset.br,this.value)"><option value="">'+esc(t('st_line_none'))+'</option>'+gl.map(g=>'<option value="'+esc(g.group_id)+'"'+(String(ST_W.branch_line[b.code]||'')===String(g.group_id)?' selected':'')+'>'+esc(lgName(g.group_id))+'</option>').join('')+
    (ST_W.branch_line[b.code]&&!gl.some(g=>String(g.group_id)===String(ST_W.branch_line[b.code]))?'<option value="'+esc(ST_W.branch_line[b.code])+'" selected>'+esc(lgName(ST_W.branch_line[b.code]))+'</option>':'')+'</select>'+
    '<button type="button" class="btn gh sm2" data-br="'+esc(b.code)+'" onclick="stBrTest(this.dataset.br)">'+esc(t('st_test'))+'</button></div>').join('')+(gl.length?'':'<div class="hintbox">'+esc(t('st_no_groups'))+'</div>');}
function stBrSet(code,v){if(!ST_W)return;v=String(v||'').trim();if(v)ST_W.branch_line[code]=v;else delete ST_W.branch_line[code];stDirty();}

  await once(async()=>{try{await lineSend(gid,t('st_test_txt',{b:branchName(code)})+'\n'+thDate(bizTodayISO())+' '+dispTime(new Date().toISOString()));toast(t('st_test_ok',{g:lgName(gid)}));}
    catch(e){toast(t('line_fail')+': '+((e&&e.message)||e),true);}});}
function stSupChips(){return ST_W.ck_sup_names.map((n,i)=>'<span class="stchip">'+esc(n)+'<button type="button" onclick="stSupDel('+i+')" aria-label="remove">✕</button></span>').join('');}
function stSupAdd(){const inp=document.getElementById('stSupNew');const n=String((inp&&inp.value)||'').trim();if(!n)return;
  if(ST_W.ck_sup_names.some(x=>supKey(x)===supKey(n))){toast(t('st_sup_dup'),true);return;}

  const u=document.getElementById('stOhU');if(u)u.textContent=ST_W.overhead_mode==='pct'?'%':t('baht');stDirty();stExample();}
function stExampleHtml(){ // ตัวอย่างสด: เมนูแรกที่คิดต้นทุนได้ ด้วยค่าที่กำลังแก้ (ยังไม่บันทึก)
  const r=activeRecipes().map(x=>({r:x,c:recipeCost(x,1)})).find(x=>x.c.items>0&&!x.c.missing.length);
  if(!r)return '<div class="stex mut">'+esc(t('st_ex_none'))+'</div>';
  const items=r.c.items,yq=num(r.r.yield_qty)||1,extra=num(r.r.extra_cost),v=num(ST_W.overhead_value);
  const oh=rnd2(ST_W.overhead_mode==='pct'?items*v/100:yq*v),total=rnd2(items+oh+extra),unit=rnd4(total/yq),mk=r.r.markup_pct!=null?num(r.r.markup_pct):num(ST_W.markup_pct),sell=rnd4(unit*(1+mk/100));
  return '<div class="stex"><div class="b" style="margin-bottom:4px">'+esc(t('st_ex_t',{r:dispName(r.r),y:fmtQ(yq),u:trUnit(r.r.yield_unit)}))+'</div><table>'+
    '<tr><td>'+esc(t('st_ex_items'))+'</td><td class="n">'+esc(money(items))+'</td></tr><tr><td>'+esc(t('st_ex_oh'))+' ('+(ST_W.overhead_mode==='pct'?fmtQ(v)+'%':fmtQ(v)+' × '+fmtQ(yq))+')</td><td class="n">'+esc(money(oh))+'</td></tr>'+
    (extra?'<tr><td>'+esc(t('st_ex_extra'))+'</td><td class="n">'+esc(money(extra))+'</td></tr>':'')+
    '<tr class="tot"><td>'+esc(t('st_ex_total'))+'</td><td class="n">'+esc(money(total))+'</td></tr><tr><td>'+esc(t('st_ex_unit'))+'</td><td class="n">฿'+fmtQ(unit)+'</td></tr>'+
    '<tr><td>'+esc(t('st_ex_sell'))+' (+'+fmtQ(mk)+'%)</td><td class="n">฿'+fmtQ(sell)+'</td></tr></table></div>';}
function stExample(){const el=document.getElementById('stEx');if(el&&ST_W)el.innerHTML=stExampleHtml();}
function stUnitChips(){return ST_W.units.map((u,i)=>'<span class="stchip">'+esc(u)+'<button type="button" onclick="stUnitDel('+i+')" aria-label="remove">✕</button></span>').join('');}

  const savedTab=LS.get('jjck_tab','today');
  show(VIEWS.includes(savedTab)?savedTab:'today');S.booted=true;
  document.dispatchEvent(new CustomEvent('kc:booted'));   // โมดูลที่ต้องทำงานตั้งแต่บูตไม่ว่าเปิดแท็บไหน (ป้าย 🚚 ของส่งสาขา) ฟังอีเวนต์นี้
}
async function boot(){
  document.body.setAttribute('data-lang',LANG);document.documentElement.lang=LANG;
  applyChrome();paintLogin();
  if(!sb){showLogin(t('lg_lib'));return;}
  try{
    /* 1) ใบผ่านสดจากหน้าศูนย์รวมแอพ — กินแล้วลบทิ้ง ตรวจกับ pnl_users จริงอีกชั้น */
    let tk=null;try{ tk=JSON.parse(localStorage.getItem(TICKET)||'null'); }catch(e){}
    if(tk&&tk.u&&tk.h&&tk.t&&(!tk.app||tk.app==='kitchen')&&Date.now()-Number(tk.t)<=TICKET_TTL){
      try{ localStorage.removeItem(TICKET); }catch(e){}
      const usr=await centralUser(tk.u).catch(()=>null);
      if(usr&&usr.pass_hash===tk.h){
        if(!kitchenAllowed(usr)){showLogin(t('no_perm'));return;}
        sessWrite(usr);markUnlocked();await enterApp(mapCentralProf(usr));return;}
    }
    /* 2) ใบอนุญาตของแท็บนี้ (รีเฟรช/ลากหน้าลงแล้วยังอยู่) */
    const prof=await sbProfile();
    if(prof){if(unlockedThisTab()||keepOk(prof.username)){markUnlocked();await enterApp(prof);return;}lockScreen(prof);return;}
    /* 3) "จำไว้ในเครื่องนี้ 12 ชม." — ตรวจรหัสกับ pnl_users ใหม่ทุกครั้ง */
    const kp=keepRead();
    if(kp){const usr=await centralUser(kp.u).catch(()=>null);
      if(usr&&usr.pass_hash===kp.h&&kitchenAllowed(usr)){sessWrite(usr);markUnlocked();await enterApp(mapCentralProf(usr));return;}
      setKeep(null,false);}
    /* 4) เปิดลิงก์ตรง → ต้องกรอกรหัส */
    showLogin();
  }catch(e){showLogin((e&&e.message)||String(e));}
}
/* K2:PTR-BEGIN (byte-identical to jjmk-kitchen.html — ลากหน้าลง = รีเฟรช) */
/* ============================================================
   📲 ดึงหน้าลงเพื่อโหลดใหม่ (มือถือ) — ท่าเดียวกับแอพอื่นในเครือ
   จำเป็นเพราะแอพที่ "เพิ่มไปยังหน้าจอโฮม" ไม่มีปุ่มรีเฟรชของเบราว์เซอร์
   ต่างจากแอพอื่นตรงที่โหลดเฉพาะข้อมูลใหม่ ไม่โหลดทั้งหน้า — อยู่หน้าเดิม ไม่ต้องปลดล็อกซ้ำ
   ============================================================ */
(function(){
  if(!('ontouchstart' in window))return;              // เฉพาะจอสัมผัส
  const GO=70,MAX=108;                                // ดึงเกิน 70px = โหลดใหม่
  const bar=document.createElement('div');bar.id='ptr';bar.setAttribute('aria-hidden','true');
  bar.innerHTML='<div class="ptr-c">⟳</div><span class="ptr-t"></span>';
  document.body.appendChild(bar);
  const txt=bar.querySelector('.ptr-t');
  let y0=0,x0=0,d=0,on=false,busy=false,axis=0;   // axis: 0 = ยังไม่รู้ทิศ · 1 = ดึงลง · -1 = ปัดข้าง (ปล่อยให้เบราว์เซอร์เลื่อนแถบ/ตารางเอง)
  const atTop=()=>{const e=document.scrollingElement||document.documentElement;
    return (window.pageYOffset||e.scrollTop||0)<=0;};
  /* ดึงอยู่ในกล่องที่เลื่อนได้เอง (ตารางกว้าง/ลิสต์ในกล่อง · แถบชิป/แถบแท็บที่เลื่อนข้างได้) ไม่นับเป็นท่าดึงรีเฟรช
     — เดิมเช็คเฉพาะแนวตั้ง: ปัดแถบชิป 📜/แถบแท็บตอนหน้าอยู่บนสุดโดยนิ้วเอียงลงนิดเดียว = preventDefault ทุก touchmove แถบไม่เลื่อน
     (ผู้ตรวจรอบ 2 2026-10-17 · เจ้าของว่า "ปุ่มพวกนี้เหมือนใช้ไม่ได้เลย") */
  const inScrollable=node=>{
    for(let n=(node&&node.nodeType===1)?node:null;n&&n!==document.body;n=n.parentElement){
      const cs=getComputedStyle(n),oy=cs.overflowY,ox=cs.overflowX;
      if((oy==='auto'||oy==='scroll')&&n.scrollHeight>n.clientHeight&&n.scrollTop>0)return true;
      if((ox==='auto'||ox==='scroll')&&n.scrollWidth>n.clientWidth+1)return true;}
    return false;};
  const blocked=()=>busy||document.getElementById('modalWrap').classList.contains('on')||
    document.getElementById('loginOv').classList.contains('on');
  /* แถบสถานะ iPhone (เปิดจากหน้าจอโฮม) บังวงหมุน — เลื่อนลงตามความสูงแถบสถานะ ค่อย ๆ เพิ่มตอนดึง ซ่อนอยู่ = พ้นจอเหมือนเดิม */
  let SA=0;
  const saTop=()=>{const p=document.createElement('div');p.style.cssText='position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';
    document.body.appendChild(p);const h=p.getBoundingClientRect().height||0;p.remove();return h;};
  const set=px=>{bar.style.transform='translateY('+(px+SA*Math.max(0,Math.min(1,(px+60)/60)))+'px)';};
  document.addEventListener('touchstart',e=>{
    if(blocked()||e.touches.length!==1||!atTop()||inScrollable(e.target)){on=false;return;}
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;d=0;on=true;axis=0;SA=saTop();
    bar.classList.add('drag');bar.classList.remove('rdy');
    txt.textContent=t('ptr_pull');
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!on)return;
    const tc=e.touches[0];d=tc.clientY-y0;
    if(!axis){const dx=Math.abs(tc.clientX-x0);axis=dx>Math.abs(d)?-1:1;}   // ทิศตัดสินจากการขยับครั้งแรก (เบราว์เซอร์ก็ตัดสินตอนนั้น)
    if(axis<0){on=false;set(-60);return;}             // ปัดข้างมากกว่าลง = ไม่ใช่ท่าดึงรีเฟรช — ไม่ preventDefault ให้แถบชิป/ตารางเลื่อนตามปกติ
    if(d<=0){set(-60);return;}                        // เลื่อนขึ้น = ปล่อยให้หน้าเลื่อนตามปกติ
    if(!atTop()){on=false;set(-60);return;}
    if(e.cancelable)e.preventDefault();               // กำลังดึงลงจากบนสุด — กันหน้าเด้ง
    const pull=Math.min(d*0.5,MAX);
    set(pull-60);
    const rdy=d>GO;
    bar.classList.toggle('rdy',rdy);
    txt.textContent=t(rdy?'ptr_go':'ptr_pull');
  },{passive:false});
  const end=async()=>{
    if(!on)return;
    on=false;bar.classList.remove('drag');
    if(d<=GO||busy){set(-60);bar.classList.remove('rdy');return;}
    busy=true;bar.classList.add('sp');txt.textContent=t('ptr_load');set(14);
    try{await reloadAll();}catch(e){}
    busy=false;bar.classList.remove('sp','rdy');set(-60);
  };
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',()=>{on=false;bar.classList.remove('drag','rdy');set(-60);},{passive:true});
})();
/* K2:PTR-END */
document.querySelectorAll('.tabbar button[data-v],.sb-item[data-v]').forEach(b=>{b.addEventListener('click',()=>show(b.dataset.v));});
boot();
</script>
