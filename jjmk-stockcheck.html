<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JJ เช็คสต๊อก · จริงใจหมูกระทะ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#C62127;--dk:#7E1013;--wine:#6B0F12;--ink:#2E2119;--mut:#8A7A66;--line:#E8DFCC;--card:#FFFDF7;--bg:#F6F1E5;--green:#1F7A43;--amber:#A66A00;--blue:#5B7FA6;--gold:#E5B03C;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Sarabun',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:86px}
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--dk),#690C0F);color:#fff;padding:10px 16px 8px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hrow{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-family:'Prompt';font-size:17px;font-weight:700;white-space:nowrap}
.seg{display:flex;gap:6px}
.seg button{padding:7px 14px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#F2DCDC;font-weight:700;font-size:13.5px;font-family:'Prompt';cursor:pointer}
.seg button.on{background:#fff;color:var(--dk)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{padding:7px 13px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#F2DCDC;font-weight:700;font-size:13px;font-family:'Prompt';cursor:pointer}
.tabs button.on{background:var(--gold);color:#5A3E00}
header input[type=date],header input[type=text]{padding:7px 9px;border:0;border-radius:10px;font-size:13.5px}
/* ---- แถบแผนก (pills) ---- */
.deptbar{position:sticky;top:0;z-index:25;background:var(--bg);border-bottom:3px solid var(--gold);padding:10px 16px 8px}
.deptbar .in{max-width:1220px;margin:0 auto}
.pills{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:6px}
@media(max-width:640px){.pills{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}}
.pill{flex:none;display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:99px;border:1.8px solid var(--wine);background:#fff;color:var(--wine);font-family:'Prompt';font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--wine);color:#fff}
.pill .bdg{background:#F6E7E7;color:var(--wine);border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:700}
.pill.on .bdg{background:rgba(255,255,255,.22);color:#fff}
.pill .ok{color:var(--green);font-size:13px}
.pill.on .ok{color:#B9E8C5}
.srch{width:100%;padding:11px 16px;border:1.5px solid var(--line);border-radius:99px;font-size:15px;background:#fff;margin-top:4px}
main{max-width:1220px;margin:0 auto;padding:14px 16px}
.dhead{display:flex;align-items:center;gap:12px;margin:6px 0 14px;font-family:'Prompt';font-weight:700;font-size:17px;color:var(--wine)}
.dhead::after{content:'';flex:1;height:2px;background:var(--gold);border-radius:2px}
.note{background:#FDF6E7;border:1.5px dashed #D9BE85;border-radius:12px;padding:8px 14px;font-size:12.5px;color:#7A6234;margin-bottom:12px}
/* ---- การ์ดนับ ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:#fff;border:1.8px solid var(--wine);border-radius:var(--r);padding:12px 14px}
.pcard.done{border-color:#9DBFA6;background:#FBFDFA}
.pcard .top{display:flex;align-items:flex-start;gap:10px}
.pimg{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#F3ECE0;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:1px solid var(--line);flex:none}
.pcard .t{font-family:'Prompt';font-weight:700;font-size:15px}
.pcard .st-n{font-size:11.5px;color:var(--amber);font-weight:700}
.pcard .st-y{font-size:11.5px;color:var(--green);font-weight:700}
.pcard .cn{font-size:11.5px;color:var(--blue)}
.pcard .cam{margin-left:auto;border:0;background:none;font-size:15px;cursor:pointer;opacity:.5}
.pcard .mid{display:flex;align-items:center;gap:8px;margin-top:12px}
.chip{border:1.5px solid var(--line);background:#FBF6EA;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--wine)}
.step{display:flex;gap:6px;margin-left:auto;align-items:center}
.step button{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:#FBF6EA;color:var(--mut);font-size:19px;cursor:pointer}
.step button.plus{background:var(--wine);border-color:var(--wine);color:#fff}
.step input{width:64px;height:40px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;text-align:center;background:#FBF6EA}
.step input.has{border-color:var(--green);background:#F0F8F1;font-weight:700}
.pcard .bot{display:flex;align-items:center;margin-top:10px}
.pcard .bst{font-size:12.5px;color:var(--mut)}
.pcard .bst b{color:var(--green)}
.outb{margin-left:auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 16px;font-size:13px;color:var(--mut);cursor:pointer}
.outb.on{background:#FBEAEA;border-color:#E4A6A6;color:var(--red);font-weight:700}
/* ---- หน้าผูกชื่อ / Safety ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card>.h{display:flex;align-items:center;gap:9px;padding:11px 15px;font-family:'Prompt';font-weight:700;font-size:15px;background:#FBF6EA;border-bottom:1px solid #F0E8D6}
.card>.h .n{margin-left:auto;font-size:12px;color:var(--mut);font-weight:600}
.lrow{display:grid;grid-template-columns:46px minmax(160px,1fr) minmax(160px,1fr) 130px;gap:10px;align-items:center;padding:8px 15px;border-bottom:1px solid #F5EFE1;font-size:14px}
.lrow:last-child{border-bottom:0}
.lhd{display:grid;grid-template-columns:46px minmax(160px,1fr) minmax(160px,1fr) 130px;gap:10px;padding:7px 15px;font-size:11px;color:var(--mut);font-weight:700;border-bottom:1px solid #F2EBDB}
.okt{color:var(--green);font-weight:700;font-size:12.5px}
.wat{color:var(--amber);font-weight:700;font-size:12.5px}
.hd2,.row2{display:grid;grid-template-columns:46px minmax(190px,1fr) 140px 84px 84px 84px 84px 84px;gap:10px;align-items:center;padding:8px 15px}
.hd2{font-size:11px;color:var(--mut);font-weight:700;border-bottom:1px solid #F2EBDB;padding:7px 15px}
.row2{border-bottom:1px solid #F5EFE1}
.row2:last-child{border-bottom:0}
.nm .t{font-weight:700;font-size:14.5px}
.nm .s{font-size:11.5px;color:var(--mut)}
.nm .s .cn{color:var(--blue)}
.ri{width:100%;max-width:86px;padding:8px 6px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;text-align:center;background:#fff}
.ri.dirty{border-color:var(--amber);background:#FFFBEF;font-weight:700}
.di{width:100%;padding:8px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;background:#fff}
.di.dirty{border-color:var(--amber);background:#FFFBEF}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(0,0,0,.07);z-index:20}
.foot .in{max-width:1220px;margin:0 auto;display:flex;gap:12px;align-items:center}
.foot .st{flex:1;font-size:13.5px;color:var(--mut)}
.foot .st b{color:var(--ink)}
.savebtn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-family:'Prompt';font-weight:700;font-size:15px;box-shadow:0 3px 10px rgba(198,33,39,.3);cursor:pointer}
.savebtn:disabled{opacity:.5}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:86px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:92vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
@media(max-width:640px){
  .grid{grid-template-columns:1fr 1fr;gap:9px}
  .pcard{padding:10px}
  .pcard .t{font-size:13.5px}
  .step input{width:52px}
  .step button{width:36px;height:36px}
  .chip{padding:7px 10px;font-size:12px}
  .lrow,.lhd{grid-template-columns:38px 1fr 1fr 92px;font-size:12.5px}
  .hd2{display:none}
  .row2{grid-template-columns:46px 1fr;row-gap:6px}
  .row2 .lbl::before{content:attr(data-l);display:block;font-size:10px;color:var(--mut)}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>📋 JJ เช็คสต๊อก</h1>
    <div class="seg" id="brSeg"></div>
    <input type="date" id="cd">
    <input type="text" id="who" placeholder="ชื่อผู้นับ" style="width:100px">
    <div class="tabs">
      <button id="tabCount" class="on">📋 นับสต๊อก</button>
      <button id="tabLink">🔗 ผูกชื่อ</button>
      <button id="tabSet">🛟 Safety</button>
    </div>
  </div>
</header>
<div class="deptbar" id="deptbar">
  <div class="in">
    <div class="pills" id="pills"></div>
    <input class="srch" id="q" placeholder="🔍 พิมพ์ชื่อสินค้าค้นหา (ทุกแผนก)...">
  </div>
</div>
<main><div id="list"><div class="empty">กำลังโหลด...</div></div></main>
<div class="foot"><div class="in">
  <div class="st" id="st">–</div>
  <button class="savebtn" id="save">💾 บันทึก</button>
</div></div>
<input type="file" id="imgFile" accept="image/*" style="display:none">
<div id="toast"></div>
<script>
/* ============ JJ เช็คสต๊อก v3 ============
   3 หน้า: 📋 นับสต๊อก (แถบแผนก + ค้นหา + การ์ดนับ) · 🔗 ผูกชื่อ (ชื่อจริง↔ชื่อนับ รายสาขา) · 🛟 Safety (อัตราใช้/วัน)
   - นับเฉพาะรายการที่ผูกชื่อบิล P&L แล้ว · ชื่อจริง = ชื่อบิล · จัดกลุ่มตามแผนก (products.dept)
   - บันทึกรูปแบบเดียวกับแอพนับ (stock_counts + stock_current) · รูปใช้ bucket product-images ร่วมกัน */
const CONFIG={URL:'https://aikyxvluaiubdidqxwnd.supabase.co',KEY:'sb_publishable_Bn6BMtcjasoPT3RZ_ekyOg_SLWWp-nm'};
const STK_BR={JJRD:'b19f0a17b4472',JJLP:'b19f0a17b448212'};
const BR_NAME={JJRD:'รัชดา',JJLP:'ลาดพร้าว'};
const DEPT_IC={'บาร์น้ำ':'🥤','ครัว':'🍳','ครัวกลาง':'🍲','หน้าเตา':'🔥','ล้างจาน':'🧽','ของหวาน':'🍧','ผัก':'🥬','เนื้อสัตว์':'🥩'};
const S={br:localStorage.getItem('jjsc_br')||'JJRD',tab:'count',items:[],all:[],map:{},cur:{},q:'',dept:null,deptOk:true,imgTarget:null};
const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isNaN(n)?0:n;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fq=v=>v==null||v===''?'':String(+(+v).toFixed(3));
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2800);}
async function api(method,path,body,prefer,raw){
  const r=await fetch(CONFIG.URL+(raw?'':'/rest/v1/')+path,{method,
    headers:{apikey:CONFIG.KEY,Authorization:'Bearer '+CONFIG.KEY,
      ...(raw?{}:{'Content-Type':'application/json'}),...(prefer?{Prefer:prefer}:{})},
    body:raw?body:(body?JSON.stringify(body):undefined)});
  if(!r.ok)throw new Error(await r.text().catch(()=>r.status));
  const tx=await r.text();return tx?JSON.parse(tx):[];
}
async function selAll(path){ let out=[],off=0;
  for(;;){const rows=await api('GET',path+'&limit=1000&offset='+off);out=out.concat(rows);if(rows.length<1000)break;off+=1000;}
  return out;
}
function bizToday(now){const d=new Date(now||Date.now());if(d.getHours()<6)d.setDate(d.getDate()-1);
  const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function dayGrp(ds){const g=new Date(ds+'T12:00:00').getDay();return g===5?1:(g===0||g===6?2:0);}
async function loadAll(){
  $('#list').innerHTML='<div class="empty">กำลังโหลด...</div>';
  const bid=STK_BR[S.br];
  const base='products?select=id,branch_id,cat_label,name,unit,sup,safety,max,rate_wk,rate_fri,rate_we,image_url,sort';
  let prods;
  try{ prods=await selAll(base+',dept&deleted_at=is.null&branch_id=eq.'+bid+'&order=sort'); S.deptOk=true; }
  catch(e){ prods=await selAll(base+'&deleted_at=is.null&branch_id=eq.'+bid+'&order=sort'); S.deptOk=false; }
  const [map,cur]=await Promise.all([
    selAll('pnl_stock_names?select=*&order=id').catch(()=>selAll('pnl_stock_map?select=*&order=id')).catch(()=>[]),
    selAll('stock_current?select=product_id,qty,updated_at&branch_id=eq.'+bid).catch(()=>[])
  ]);
  S.map={}; map.forEach(r=>{ if(r.product_id&&!String(r.product_id).startsWith('none')&&r.pnl_item&&r.pnl_item!=='-')S.map[r.product_id]=r; });
  S.all=prods.map(p=>({...p,qty:null,out:false,dirty:{}}));
  S.items=S.all.filter(p=>S.map[p.id]);       // นับเฉพาะที่มีชื่อบิล
  S.cur={}; cur.forEach(r=>{S.cur[r.product_id]=r;});
  S.dept=null;
  render();
}
const billName=it=>{const m=S.map[it.id];return m?m.pnl_item:it.name;};
const deptOf=it=>(S.deptOk&&it.dept)?it.dept:(it.cat_label||'ยังไม่จัดแผนก');
const counted=it=>it.out||(it.qty!=null&&it.qty!=='');
const isDirty=it=>Object.keys(it.dirty).length>0;
function deptList(){
  const m={};
  S.items.forEach(it=>{const k=deptOf(it);(m[k]=m[k]||{label:k,items:[]}).items.push(it);});
  return Object.values(m);
}
function matches(it){const q=S.q.trim().toLowerCase();
  return !q||it.name.toLowerCase().includes(q)||billName(it).toLowerCase().includes(q)||(it.sup||'').toLowerCase().includes(q);}
function imgCell(it){
  return it.image_url
    ?'<img class="pimg" src="'+esc(it.image_url)+'" loading="lazy" onclick="pickImg(\''+it.id+'\')" title="แตะเพื่อเปลี่ยนรูป">'
    :'<div class="pimg" onclick="pickImg(\''+it.id+'\')" title="แตะเพื่อใส่รูป">📷</div>';
}
function render(){
  $('#deptbar').style.display=S.tab==='count'?'':'none';
  if(S.tab==='count')renderCount();
  else if(S.tab==='link')renderLink();
  else renderSet();
  refresh();
}
/* ---- 📋 หน้านับ: แถบแผนก + การ์ด ---- */
function renderCount(){
  const ds=deptList();
  if(!ds.length){$('#pills').innerHTML='';$('#list').innerHTML='<div class="empty">สาขานี้ยังไม่มีรายการที่ผูกชื่อบิล — ดูหน้า 🔗 ผูกชื่อ</div>';return;}
  if(!S.dept||!ds.some(d2=>d2.label===S.dept))S.dept=ds[0].label;
  $('#pills').innerHTML=ds.map(dp=>{
    const done=dp.items.filter(counted).length,all=dp.items.length;
    return '<button class="pill'+(dp.label===S.dept?' on':'')+'" onclick="pickDept(\''+esc(dp.label).replace(/'/g,"\\'")+'\')">'
      +(DEPT_IC[dp.label]||'🗂')+' '+esc(dp.label)
      +' <span class="bdg">'+(done<all?(all-done):all)+'</span>'+(done===all?' <span class="ok">✓</span>':'')+'</button>';
  }).join('');
  const q=S.q.trim();
  const show=q?S.items.filter(matches):(deptList().find(d2=>d2.label===S.dept)||{items:[]}).items;
  const hidden=S.all.length-S.items.length;
  $('#list').innerHTML=
    '<div class="dhead">'+(q?('🔍 ผลค้นหา "'+esc(q)+'" (ทุกแผนก)'):(DEPT_IC[S.dept]||'🗂')+' '+esc(S.dept))+'</div>'
    +(hidden?'<div class="note">🔗 ซ่อน '+hidden+' รายการที่ยังไม่ผูกชื่อบิล — ดูที่หน้า "ผูกชื่อ"'+(S.deptOk?'':' · ⚠ ยังไม่ได้รัน sql/jjmk_stockcheck_dept.sql ใช้หมวดเดิมแทนแผนก')+'</div>':'')
    +(show.length?'<div class="grid">'+show.map(it=>{
      const cur=S.cur[it.id],cn=it.name!==billName(it),ok=counted(it);
      return '<div class="pcard'+(ok?' done':'')+'">'
        +'<div class="top">'+imgCell(it)
        +'<div><div class="t">'+esc(billName(it))+' '+(ok?(it.out?'<span class="st-n" style="color:var(--red)">✗ หมด</span>':'<span class="st-y">✓ นับแล้ว</span>'):'<span class="st-n">⚠ ยังไม่นับ</span>')+'</div>'
        +(cn?'<div class="cn">นับ: '+esc(it.name)+'</div>':'')+'</div>'
        +'<button class="cam" onclick="pickImg(\''+it.id+'\')">✏️</button></div>'
        +'<div class="mid"><span class="chip">'+esc(it.unit||'หน่วย')+'</span>'
        +'<div class="step"><button onclick="bump(\''+it.id+'\',-1)">−</button>'
        +'<input class="'+(it.qty!=null&&it.qty!==''?'has':'')+'" type="text" inputmode="decimal" value="'+(it.qty??'')+'" onchange="setQ(\''+it.id+'\',this.value)">'
        +'<button class="plus" onclick="bump(\''+it.id+'\',1)">+</button></div></div>'
        +'<div class="bot"><span class="bst">'+(ok?(it.out?'ของหมดสต๊อก':'นับได้ <b>'+it.qty+' '+esc(it.unit||'')+'</b>'):'ยังไม่นับ')+(cur?' · ครั้งก่อน '+cur.qty:'')+'</span>'
        +'<button class="outb'+(it.out?' on':'')+'" onclick="setOut(\''+it.id+'\')">หมด</button></div>'
        +'</div>';
    }).join('')+'</div>':'<div class="empty">ไม่พบ "'+esc(q)+'"</div>');
}
/* ---- 🔗 หน้าผูกชื่อ: ชื่อจริง (บิล) ↔ ชื่อนับ รายสาขา ---- */
function renderLink(){
  const ok=S.all.filter(it=>S.map[it.id]),no=S.all.filter(it=>!S.map[it.id]);
  const row=it=>{const m=S.map[it.id];
    return '<div class="lrow">'+imgCell(it)
      +'<div><b>'+(m?esc(m.pnl_item):'–')+'</b><div style="font-size:11px;color:var(--mut)">ชื่อจริง (บิล P&L)</div></div>'
      +'<div>'+esc(it.name)+'<div style="font-size:11px;color:var(--mut)">ชื่อนับ · '+esc(deptOf(it))+'</div></div>'
      +(m?'<span class="okt">✓ ผูกแล้ว</span>':'<span class="wat">⚠ ยังไม่ผูก</span>')+'</div>';};
  $('#list').innerHTML=
    '<div class="dhead">🔗 การผูกชื่อ · สาขา'+BR_NAME[S.br]+'</div>'
    +'<div class="note">ผูกแล้ว <b>'+ok.length+'</b> / ทั้งหมด '+S.all.length+' รายการ · ตัวที่ยังไม่ผูกจะไม่ขึ้นหน้านับ — ไปผูกที่แอพ P&L หน้า "ใช้จริง (สต๊อก)" แล้วกลับมารีเฟรช</div>'
    +(no.length?'<div class="card"><div class="h">⚠ ยังไม่ผูก <span class="n">'+no.length+' รายการ</span></div>'
      +'<div class="lhd"><span></span><span>ชื่อจริง (บิล)</span><span>ชื่อนับ</span><span></span></div>'+no.map(row).join('')+'</div>':'')
    +'<div class="card"><div class="h">✓ ผูกแล้ว <span class="n">'+ok.length+' รายการ</span></div>'
    +'<div class="lhd"><span></span><span>ชื่อจริง (บิล)</span><span>ชื่อนับ</span><span></span></div>'+ok.map(row).join('')+'</div>';
}
/* ---- 🛟 หน้า Safety: อัตราใช้/วัน + safety/max + แผนก ---- */
function renderSet(){
  const G=dayGrp($('#cd').value||bizToday());
  const hl=i=>i===G?'background:#FFF9E4':'';
  const ds={};
  S.items.filter(matchesAll).forEach(it=>{const k=deptOf(it);(ds[k]=ds[k]||[]).push(it);});
  function matchesAll(it){return matches(it);}
  const keys=Object.keys(ds);
  $('#list').innerHTML='<div class="dhead">🛟 Safety · อัตราใช้ต่อวัน + จุดสั่งของ · สาขา'+BR_NAME[S.br]+'</div>'
    +'<div class="note">จ–พฤ / ศ / ส–อา = ใช้ของกี่หน่วยต่อวัน (ช่องเหลือง = กลุ่มของวันนี้) · ค่าลงช่องเดิมของแอพนับ → ระบบคำนวณสั่งของ + ส่ง LINE ซัพใช้ต่อได้เลย · แผนก/รูปใช้ร่วม 2 สาขา ที่เหลือแยกสาขา'+(S.deptOk?'':' · ⚠ รัน sql/jjmk_stockcheck_dept.sql ก่อนถึงตั้งแผนกได้')+'</div>'
    +(keys.length?keys.map(k=>{
      const rows=ds[k].map(it=>{
        const cn=it.name!==billName(it);
        const ri=(f,i)=>'<span class="lbl" data-l="'+['จ–พฤ/วัน','ศ/วัน','ส–อา/วัน','safety','max'][i]+'"><input class="ri'+(it.dirty[f]!==undefined?' dirty':'')+'" type="text" inputmode="decimal" value="'+fq(it[f])+'" style="'+(i<3?hl(i):'')+'" onchange="setF(\''+it.id+'\',\''+f+'\',this.value)"></span>';
        return '<div class="row2">'+imgCell(it)
          +'<div class="nm"><div class="t">'+esc(billName(it))+'</div><div class="s">'+(cn?'<span class="cn">นับ: '+esc(it.name)+'</span> · ':'')+esc(it.sup||'')+'</div></div>'
          +'<span class="lbl" data-l="แผนก"><input class="di'+(it.dirty.dept!==undefined?' dirty':'')+'" list="deptList" value="'+esc(it.dept||'')+'" placeholder="เช่น ครัว" '+(S.deptOk?'':'disabled')+' onchange="setF(\''+it.id+'\',\'dept\',this.value)"></span>'
          +ri('rate_wk',0)+ri('rate_fri',1)+ri('rate_we',2)+ri('safety',3)+ri('max',4)+'</div>';
      }).join('');
      return '<div class="card"><div class="h">'+(DEPT_IC[k]||'🗂')+' '+esc(k)+' <span class="n">'+ds[k].length+' รายการ</span></div>'
        +'<div class="hd2"><span></span><span>สินค้า</span><span>แผนก</span><span style="text-align:center">จ–พฤ/วัน</span><span style="text-align:center">ศ/วัน</span><span style="text-align:center">ส–อา/วัน</span><span style="text-align:center">safety</span><span style="text-align:center">max</span></div>'
        +rows+'</div>';
    }).join('')+'<datalist id="deptList">'+[...new Set(S.items.map(i=>i.dept).filter(Boolean))].map(d2=>'<option value="'+esc(d2)+'">').join('')+'</datalist>'
    :'<div class="empty">ไม่มีรายการ</div>');
}
function refresh(){
  if(S.tab==='count'){
    const n=S.items.filter(counted).length;
    $('#st').innerHTML='นับแล้ว <b>'+n+'</b>/'+S.items.length+' · '+BR_NAME[S.br]+' · '+($('#cd').value||'');
    $('#save').textContent='💾 บันทึกการนับ';$('#save').style.display='';$('#save').disabled=!n;
  }else if(S.tab==='set'){
    const n=S.items.filter(isDirty).length;
    $('#st').innerHTML='แก้ตั้งค่า <b>'+n+'</b> รายการ · '+BR_NAME[S.br];
    $('#save').textContent='💾 บันทึกตั้งค่า';$('#save').style.display='';$('#save').disabled=!n;
  }else{
    $('#st').innerHTML='หน้าดูสถานะการผูกชื่อ — แก้การผูกที่แอพ P&L';
    $('#save').style.display='none';
  }
}
function pickDept(l){S.dept=l;S.q='';$('#q').value='';render();}
function bump(id,dl){const it=S.items.find(x=>x.id===id);if(!it)return;
  it.qty=Math.max(0,num(it.qty)+dl);it.out=false;render();}
function setQ(id,v){const it=S.items.find(x=>x.id===id);if(!it)return;
  it.qty=v===''?null:num(v);if(it.qty!=null)it.out=false;render();}
function setOut(id){const it=S.items.find(x=>x.id===id);if(!it)return;
  it.out=!it.out;if(it.out)it.qty=0;render();}
function setF(id,f,v){const it=S.items.find(x=>x.id===id);if(!it)return;
  it.dirty[f]=(f==='dept')?String(v).trim():(v===''?null:num(v));render();}
/* ---- รูปสินค้า (bucket เดียวกับแอพนับ, อัปเดตตามชื่อ = 2 สาขา 2 ระบบ) ---- */
function pickImg(id){S.imgTarget=id;$('#imgFile').click();}
function shrink(file){return new Promise(res=>{
  const img=new Image();img.onload=()=>{
    const M=640,k=Math.min(1,M/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>res(b),'image/jpeg',0.8);
  };img.onerror=()=>res(null);img.src=URL.createObjectURL(file);});}
async function setImgUrl(name,url){
  await api('PATCH','products?name=eq.'+encodeURIComponent(name),{image_url:url},'return=minimal');
  S.all.forEach(x=>{if(x.name===name)x.image_url=url;});
}
async function upImg(file){
  const it=S.all.find(x=>x.id===S.imgTarget);if(!it||!file)return;
  toast('⏳ กำลังอัปโหลดรูป...');
  try{
    const blob=await shrink(file);if(!blob)throw new Error('อ่านรูปไม่สำเร็จ');
    const path='p/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    const r=await fetch(CONFIG.URL+'/storage/v1/object/product-images/'+path,{method:'POST',
      headers:{apikey:CONFIG.KEY,Authorization:'Bearer '+CONFIG.KEY,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
    if(!r.ok)throw new Error(await r.text().catch(()=>r.status));
    await setImgUrl(it.name,CONFIG.URL+'/storage/v1/object/public/product-images/'+path);
    toast('✅ ใส่รูป '+billName(it)+' แล้ว (เห็นทั้ง 2 สาขา)');render();
  }catch(e){toast('อัปโหลดรูปไม่สำเร็จ — '+String(e.message||e).slice(0,100),true);}
}
/* ---- บันทึก ---- */
async function saveAll(){
  const btn=$('#save');btn.disabled=true;const old=btn.textContent;btn.textContent='⏳ กำลังบันทึก...';
  try{
    if(S.tab==='count'){
      const who=($('#who').value||'').trim();localStorage.setItem('jjsc_who',who);
      const picked=S.items.filter(counted);
      const cd=$('#cd').value||bizToday(),bid=STK_BR[S.br];
      const hist=picked.map(it=>({branch_id:bid,branch_name:BR_NAME[S.br],count_date:cd,counter:who||null,
        cat_label:deptOf(it),product_id:it.id,name:it.name,unit:it.unit||'',
        sup:it.sup||'',qty:num(it.qty),out_of_stock:!!it.out,safety:it.safety??null,max:it.max??null}));
      const cur=picked.map(it=>({branch_id:bid,product_id:it.id,qty:num(it.qty),counter:who||null,updated_at:new Date().toISOString()}));
      await api('POST','stock_counts',hist,'return=minimal');
      await api('POST','stock_current?on_conflict=branch_id,product_id',cur,'resolution=merge-duplicates,return=minimal');
      picked.forEach(it=>{S.cur[it.id]={product_id:it.id,qty:num(it.qty)};});
      toast('✅ บันทึกการนับ '+picked.length+' รายการ');
    }else if(S.tab==='set'){
      const dirty=S.items.filter(isDirty);
      for(const it of dirty){
        const d2={...it.dirty};
        const dept=d2.dept; delete d2.dept;
        if(Object.keys(d2).length)await api('PATCH','products?id=eq.'+encodeURIComponent(it.id),d2,'return=minimal');
        if(dept!==undefined){await api('PATCH','products?name=eq.'+encodeURIComponent(it.name),{dept:dept||null},'return=minimal');
          S.all.forEach(x=>{if(x.name===it.name)x.dept=dept||null;});}
        Object.assign(it,Object.fromEntries(Object.entries(it.dirty).filter(([k])=>k!=='dept')));
        it.dirty={};
      }
      toast('✅ บันทึกตั้งค่า '+dirty.length+' รายการ');
    }
    render();
  }catch(e){toast('บันทึกไม่สำเร็จ — '+String(e.message||e).slice(0,140),true);}
  btn.disabled=false;btn.textContent=old;refresh();
}
function setTab(t){S.tab=t;
  [['tabCount','count'],['tabLink','link'],['tabSet','set']].forEach(([id,k])=>$('#'+id).classList.toggle('on',k===t));
  render();}
function boot(){
  $('#brSeg').innerHTML=Object.keys(STK_BR).map(b=>'<button data-br="'+b+'" class="'+(S.br===b?'on':'')+'">'+BR_NAME[b]+'</button>').join('');
  $('#brSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.br=b.dataset.br;localStorage.setItem('jjsc_br',S.br);
    document.querySelectorAll('#brSeg button').forEach(x=>x.classList.toggle('on',x.dataset.br===S.br));loadAll();};
  $('#tabCount').onclick=()=>setTab('count');
  $('#tabLink').onclick=()=>setTab('link');
  $('#tabSet').onclick=()=>setTab('set');
  $('#cd').value=bizToday();
  $('#who').value=localStorage.getItem('jjsc_who')||'';
  $('#q').oninput=e=>{S.q=e.target.value;render();};
  $('#pills').addEventListener('wheel',e=>{const p=$('#pills');
    if(p.scrollWidth>p.clientWidth){p.scrollLeft+=(e.deltaY||e.deltaX);e.preventDefault();}},{passive:false});
  $('#cd').onchange=render;
  $('#save').onclick=saveAll;
  $('#imgFile').onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';upImg(f);};
  loadAll().catch(e=>{$('#list').innerHTML='<div class="empty">โหลดไม่สำเร็จ — '+esc(e.message||e)+'</div>';});
}
boot();
</script>
