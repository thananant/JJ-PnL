<style>
/* JJ Allergy — ข้อมูลแพ้อาหาร · ธีมเดียวกับแอปหน้าร้าน (แดง/ทอง/ครีม) */
:root{--red:#C62127;--dk:#7E1013;--wine:#6B0F12;--ink:#2E2119;--mut:#8A7A66;--line:#E8DFCC;--card:#FFFDF7;--bg:#F6F1E5;
  --green:#1F7A43;--gbg:#E8F5EC;--amber:#A66A00;--abg:#FFF4DC;--rbg:#FDE9E9;--gray:#6F675E;--gybg:#EFEAE2;--gold:#E5B03C;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Sarabun',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--dk),#690C0F);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1000px;margin:0 auto}
.brand{font-family:'Prompt';font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.brand small{display:block;font-weight:500;font-size:11.5px;opacity:.8}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;opacity:.95}
.who button{min-height:36px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:4px 10px;font-size:13px}
.tabs{display:flex;gap:6px;margin:8px auto 0;overflow-x:auto;scrollbar-width:none;max-width:1000px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:44px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px}
.tabs button.on{background:var(--gold);color:var(--wine)}
main{padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));max-width:1000px;margin:0 auto}
.view{display:none}.view.on{display:block}
h2{font-family:'Prompt';font-size:16px;color:var(--wine);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
h2 small{font-family:'Sarabun';font-weight:500;color:var(--mut);font-size:13px}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.note{background:#FFF9EA;border:1.5px dashed #E5C97A;border-radius:12px;padding:9px 12px;font-size:13px;color:#6B5A2E;margin-bottom:12px;line-height:1.55}
.note.bad{background:var(--rbg);border-color:#E9A3A3;color:#7E1013}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ach{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-weight:600;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.ach.on{background:var(--red);border-color:var(--red);color:#fff}
.ach.may{background:var(--abg);border-color:#E5B54A;color:#6B4600}
.ach.has{background:var(--rbg);border-color:var(--red);color:var(--wine)}
.ach small{font-weight:500;font-size:11.5px;opacity:.8}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);min-height:44px;width:100%}
textarea{min-height:76px;resize:vertical}
label.f{display:block;font-weight:700;font-size:13.5px;margin:10px 0 4px;color:var(--wine)}
.btn{min-height:44px;border:0;border-radius:12px;padding:10px 16px;font-family:'Prompt';font-weight:700;font-size:15px;color:#fff;background:var(--red)}
.btn.o{background:#fff;color:var(--wine);border:1.5px solid var(--wine)}
.btn.g{background:var(--green)}
.btn.sm{font-size:13.5px;padding:8px 12px}
.btn:disabled{opacity:.5}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-weight:600;font-size:13.5px;color:var(--mut)}
.seg button.on{background:var(--wine);border-color:var(--wine);color:#fff}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.sum div{border-radius:12px;padding:8px;text-align:center;font-size:12.5px;font-weight:600}
.sum b{display:block;font-family:'Prompt';font-size:22px}
.s-no{background:var(--rbg);color:var(--wine)} .s-may{background:var(--abg);color:#6B4600} .s-unk{background:var(--gybg);color:var(--gray)} .s-ok{background:var(--gbg);color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.it{background:var(--card);border:1.5px solid var(--line);border-left-width:6px;border-radius:14px;padding:10px 12px;min-width:0}
.it.no{border-left-color:var(--red);background:#FFF8F8} .it.may{border-left-color:#E5B54A} .it.unk{border-left-color:#B9B0A4} .it.ok{border-left-color:var(--green)}
.it .h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.it .nm{font-weight:700;font-size:15.5px;word-break:break-word}
.it .nm small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.it .why{font-size:13px;margin-top:4px;font-weight:600}
.it.no .why{color:var(--red)} .it.may .why{color:#8A5A00} .it.unk .why{color:var(--gray)} .it.ok .why{color:var(--green)}
.it .ing{font-size:12.5px;color:var(--mut);margin-top:4px;word-break:break-word}
.it .ing mark{background:#FFD9D9;color:var(--wine);border-radius:4px;padding:0 2px}
.bd{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:8px;padding:2px 7px;margin:4px 4px 0 0}
.bd.has{background:var(--rbg);color:var(--wine)} .bd.may{background:var(--abg);color:#6B4600}
.bd.ok{background:var(--gbg);color:var(--green)} .bd.unk{background:var(--gybg);color:var(--gray)} .bd.off{background:#333;color:#fff}
.ed{flex:none;min-width:44px;min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:17px}
.msg{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--mut);margin:16px 0}
.msg b{display:block;color:var(--wine);font-family:'Prompt';font-size:17px;margin-bottom:6px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
#ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
#ovl.on{display:flex}
.sheet{background:#fff;width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-height:92vh;overflow:auto}
.sheet h3{font-family:'Prompt';color:var(--wine);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sheet h3 button{margin-left:auto}
.foot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:#fff;padding:12px 0 calc(4px + env(safe-area-inset-bottom));margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.foot .btn{flex:1}
.ck{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:700;margin-top:10px}
.ck input{width:24px;height:24px;min-height:0;flex:none}
.lg{font-size:13px;border-bottom:1px dashed var(--line);padding:8px 0}
.lg b{color:var(--wine)} .lg span{color:var(--mut);font-size:12px}
.imp{display:flex;gap:10px;align-items:center;min-height:44px;border-bottom:1px dashed var(--line);font-size:14px}
.imp input{width:22px;height:22px;min-height:0;flex:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2E2119;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)} #toast.err{background:var(--red)}
@media(max-width:560px){
  .sum{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .who span{display:none}
}
</style>
<style>
/* JJ Gate — ช่องล็อกอินบนมือถือต้องไม่ต่ำกว่า 16px ไม่งั้น iPhone จะซูมหน้าจอเองตอนกดพิมพ์ */
@media (max-width:640px){
  #lgU,#lgP,#liUser,#liPass{font-size:16px !important}
  .jjgate-note{font-size:13px !important}
}
</style>
<script>
/* ============================================================
   JJ Gate — ด่านกันคนเข้าทางลิงก์ตรง (เจ้าของสั่ง 2026-09-21)
   · เข้าจากหน้าศูนย์รวมแอพ (index.html) หลังล็อกอิน = ผ่านได้เลยตามสิทธิ์
   · เข้าด้วย URL ตรง / ลิงก์ที่ถูกส่งต่อ = ต้องใส่รหัสผ่านใหม่ทุกครั้ง
   ใบผ่านมี 2 แบบ:
   · ใบผ่านครั้งเดียว (localStorage 'jjhub_pass') หน้าศูนย์รวมแอพออกให้ตอนกดไอคอน
     อายุ 2 นาที · ผูกกับชื่อผู้ใช้ + ชื่อแอพ · ใช้แล้วลบทิ้งทันที
   · ใบผ่านประจำแท็บ (sessionStorage) — รีเฟรช/กดลากลงยังอยู่ แต่แท็บใหม่ไม่มี
   *** บล็อกนี้เหมือนกันทุกแอพ (ต่างแค่ชื่อแอพบรรทัดแรก) แก้ที่ไหนต้องแก้ให้ครบทุกไฟล์ ***
   ============================================================ */
window.JJGate=(function(){
  var APP='allergy';                 /* ชื่อแอพนี้ — ต้องตรงกับ data-app ในหน้าศูนย์รวมแอพ */
  var TAB='jjgate_'+APP, TICKET='jjhub_pass', ALT='jjsso_ticket';
  var IDLE=30*60*1000;               /* ทิ้งไว้เกิน 30 นาทีแล้วรีเฟรช = ยืนยันรหัสใหม่ (กติกาเดียวกับ P&L) */
  var TTL=2*60*1000;                 /* ใบผ่านจากหน้าศูนย์รวมแอพ อายุ 2 นาที */
  function j(s){ try{ return JSON.parse(s||'null'); }catch(e){ return null; } }
  function readTab(){ try{ return j(sessionStorage.getItem(TAB)); }catch(e){ return null; } }
  function grant(user){ try{ sessionStorage.setItem(TAB,JSON.stringify({u:user||'',t:Date.now()})); }catch(e){} }
  /* ใช้ใบผ่านแล้วต้องลบให้เกลี้ยงทั้ง 2 แบบ ไม่งั้นใบที่เหลือจะถูกเอาไปเปิดแท็บใหม่ได้อีก
     (ลบเฉพาะใบที่จ่าหน้าถึงแอพนี้ — ใบของแอพอื่นต้องไม่โดนลบไปด้วย) */
  function burn(){
    try{ localStorage.removeItem(TICKET); }catch(e){}
    var o=null; try{ o=j(localStorage.getItem(ALT)); }catch(e){}
    if(!o||!o.app||o.app===APP){ try{ localStorage.removeItem(ALT); }catch(e){} }
  }
  function takeTicket(){
    var t=null; try{ t=j(localStorage.getItem(TICKET)); }catch(e){}
    if(t&&t.app===APP&&t.u&&t.exp&&t.exp>=Date.now()){ burn(); return t; }
    /* รับใบผ่านอีกแบบของหน้าศูนย์รวมแอพด้วย (jjsso_ticket — ระบบเดียวกับที่ JJ Social/ซ่อมบำรุงใช้) */
    var o=null; try{ o=j(localStorage.getItem(ALT)); }catch(e){}
    if(o&&o.u&&(!o.app||o.app===APP)&&(Date.now()-(+o.t||0))<TTL){ burn(); return {app:APP,u:o.u,exp:Date.now()+TTL}; }
    return null;
  }
  /* เปิดจากไอคอนที่ติดตั้งไว้บนหน้าจอมือถือ (PWA) = เครื่องของเจ้าตัวเอง ไม่ใช่ลิงก์ที่ถูกส่งต่อ → ผ่านได้
     (ลิงก์ที่ส่งต่อทางแชทจะเปิดในเบราว์เซอร์ธรรมดา ไม่ใช่โหมดนี้ — ยังโดนถามรหัสเหมือนเดิม) */
  function installed(){
    try{
      if(navigator.standalone===true)return true;                                   /* iPhone/iPad */
      return !!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches
             || window.matchMedia&&window.matchMedia('(display-mode: fullscreen)').matches);  /* Android */
    }catch(e){ return false; }
  }
  /* เรียกก่อนจะยอมรับ session ที่ค้างอยู่ในเครื่อง — false = ให้แสดงหน้าล็อกอิน
     ผ่านได้ 3 ทาง: ใบผ่านประจำแท็บ (รวมถึงการดึงหน้าลงรีเฟรช) · ใบผ่านจากหน้าศูนย์รวมแอพ · เปิดจากไอคอนบนมือถือ */
  function ok(user){
    var g=readTab();
    if(g&&(Date.now()-(g.t||0))<IDLE&&(!user||g.u===user)){ grant(g.u||user); return true; }
    var t=takeTicket();
    if(t&&(!user||t.u===user)){ grant(t.u); return true; }
    if(installed()){ grant(user||''); return true; }
    return false;
  }
  /* ออกใบผ่านก่อนพาไปอีกแอพ (หน้าศูนย์รวมแอพ + ลิงก์ข้ามแอพ) — ไม่รู้ชื่อผู้ใช้ = ไม่ออกให้ */
  function issue(app,user){
    if(!app||!user)return false;
    try{ localStorage.setItem(TICKET,JSON.stringify({app:app,u:user,exp:Date.now()+TTL})); return true; }catch(e){ return false; }
  }
  /* แปะข้อความ "เปิดจากลิงก์ตรง" บนหน้าล็อกอินของแอพ + เติมชื่อผู้ใช้ให้ เหลือแค่พิมพ์รหัส */
  function note(user,userId,passId){
    try{
      var u=userId?document.getElementById(userId):null, pw=passId?document.getElementById(passId):null;
      if(u&&user)u.value=user;
      /* หน้าล็อกอินมาตรฐาน (JJ Login) มีแถบ 🔒 ของตัวเองอยู่แล้ว */
      if(window.JJLogin&&document.getElementById('jjlgLock')){
        JJLogin.lock('<b>เปิดจากลิงก์ตรง</b> — ยืนยันรหัสผ่านอีกครั้งเพื่อความปลอดภัย<br>'+
          '<span style="opacity:.85">เข้าจาก<a href="index.html" style="color:inherit;font-weight:600"> หน้าศูนย์รวมแอพ </a>จะไม่ต้องกรอกซ้ำ</span>');
        if(pw)setTimeout(function(){ try{ pw.focus(); }catch(e){} },90);
        return;
      }
      var card=(u&&u.closest)?u.closest('.logincard,.lgc,.card,#login,#loginWrap'):null;
      if(card&&!card.querySelector('.jjgate-note')){
        var d=document.createElement('div');
        d.className='jjgate-note';
        d.style.cssText='margin:0 0 13px;padding:10px 12px;border-radius:11px;font-size:12.5px;line-height:1.55;text-align:left;'+
          'background:rgba(217,164,65,.13);border:1px solid rgba(217,164,65,.5);color:#C79A3E';
        d.innerHTML='🔒 <b>เปิดจากลิงก์ตรง</b> — ยืนยันรหัสผ่านอีกครั้งเพื่อความปลอดภัย<br>'+
          '<span style="opacity:.85">เข้าจาก<a href="index.html" style="color:inherit;font-weight:600"> หน้าศูนย์รวมแอพ </a>จะไม่ต้องกรอกซ้ำ</span>';
        card.insertBefore(d,card.firstChild);
      }
      if(pw)setTimeout(function(){ try{ pw.focus(); }catch(e){} },90);
    }catch(e){}
  }
  /* ต่ออายุใบผ่านของแท็บนี้เมื่อมีการใช้งาน */
  ['click','keydown','pointerdown','touchstart'].forEach(function(ev){
    try{ document.addEventListener(ev,function(){ var g=readTab(); if(g&&(Date.now()-(g.t||0))<IDLE)grant(g.u); },{passive:true,capture:true}); }catch(e){}
  });
  return {ok:ok,grant:grant,issue:issue,note:note,installed:installed,app:APP};
})();
</script>
<!-- ===== JJ Login — หน้าล็อกอินมาตรฐานทุกแอพ (เจ้าของเลือกแบบ A 2026-09-28) =====
     บล็อกนี้เหมือนกันทุกไฟล์ ต่างแค่ var APP= บรรทัดแรก — แก้ที่ไหนต้องแก้ให้ครบทุกไฟล์
     ไอคอน+สีประจำแอพชุดเดียวกับหน้าศูนย์รวมแอพ (index.html) เพื่อเตือนว่ากำลังเข้าแอพไหน
     วิธีใช้: JJLogin.mount('loginOv',{submit:'doLogin()'}) แล้วแอพยังใช้ #lgU/#lgP/#lgMsg/#lgBtn เหมือนเดิม -->
<script>

<!-- JJBR-BEGIN ทะเบียนสาขากลาง · บล็อกนี้ต้องเหมือนกันทุกไฟล์ทุกตัวอักษร (แก้ที่ไฟล์ใดไฟล์หนึ่งแล้ว sync ด้วยสคริปต์) -->
<script>
/* JJBR — ทะเบียนสาขากลาง (ตาราง pnl_branches) ใช้ร่วมทุกแอพ (เจ้าของสั่ง 2026-10-15: "เพิ่มสาขาใหม่ ให้เพิ่มไปในทุกระบบเลย แบบปุ่มเดียว")
   · สาขาหน้าร้านมาจากตาราง pnl_branches (ปุ่ม 🏪 เปิดสาขาใหม่ ใน JJ Access เพิ่มให้) · ครัวกลาง JJCK / ออฟฟิศ OFFICE เป็นหน่วยงานคงที่
   · ไม่ต้องรอเน็ต: เริ่มจากแคชในเครื่อง (localStorage.jjbr_cache) → ไม่มีแคช = JJRD/JJLP · JJBR.load() อ่านของจริงแล้วแจ้ง onChange
   · ออฟฟิศ: บัญชี/สิทธิ์ใช้ OFFICE · P&L ใช้ JJOF → JJBR.canon('JJOF')='OFFICE' · JJBR.pnl('OFFICE')='JJOF'
   · แอพเดิมยังใช้ชื่อ/สีของตัวเองกับสาขาเดิมได้ — ใช้ JJBR.extra(รหัสที่แอพรู้จักแล้ว) เติมเฉพาะสาขาที่แอพยังไม่รู้จัก */
(function(){
  var VER='2026-10-15.1', CK='jjbr_cache', MAXAGE=90*864e5;
  var BASE=[
    {code:'JJRD',name:'สาขารัชดา',short:'รัชดา',kind:'store',sort:1,stk_id:'b19f0a17b4472'},
    {code:'JJLP',name:'สาขาลาดพร้าว',short:'ลาดพร้าว',kind:'store',sort:2,stk_id:'b19f0a17b448212'}];
  var UNITS=[
    {code:'JJCK',name:'ครัวกลาง',short:'ครัวกลาง',kind:'kitchen',sort:900},
    {code:'OFFICE',name:'ออฟฟิศ',short:'ออฟฟิศ',kind:'office',sort:901}];
  var STK={JJRD:'b19f0a17b4472',JJLP:'b19f0a17b448212'};
  var PALETTE=['#2E8B57','#8E44AD','#D35400','#16A085','#2C3E50','#B7950B','#C0392B','#1F618D'];
  function s(v,n){ return v==null?'':String(v).trim().slice(0,n||80); }
  function norm(r){
    if(!r||typeof r!=='object')return null;
    var code=s(r.code,12).toUpperCase();
    if(!/^[A-Z][A-Z0-9_]{1,11}$/.test(code))return null;
    var kind=r.kind==='store'||r.kind==='office'||r.kind==='kitchen'?r.kind:
      (code==='JJOF'||code==='OFFICE'?'office':code==='JJCK'?'kitchen':r.is_central?'office':'store');
    var name=s(r.name||r.display_name,60)||code;
    var short=s(r.short,30)||name.replace(/^สาขา\s*/,'')||code;
    return {code:code,name:name,short:short,kind:kind,sort:isFinite(+r.sort)?+r.sort:0,
      stk_id:s(r.stk_id,40)||STK[code]||'',color:/^#[0-9A-Fa-f]{6}$/.test(s(r.color))?s(r.color):'',
      active:r.active!==false,is_central:kind!=='store',tax_branch:/^[0-9]{5}$/.test(s(r.tax_branch))?s(r.tax_branch):'',
      addr:s(r.addr,300),opened_on:/^\d{4}-\d{2}-\d{2}/.test(s(r.opened_on))?s(r.opened_on).slice(0,10):''};
  }
  function clean(arr){
    var out=[],seen={};
    (Array.isArray(arr)?arr:[]).forEach(function(r){ var x=norm(r); if(x&&!seen[x.code]){seen[x.code]=1;out.push(x);} });
    return out;
  }
  function bySort(a,b){ return (a.sort-b.sort)||(a.code<b.code?-1:a.code>b.code?1:0); }
  var J={VER:VER,rows:clean(BASE),src:'base',cols:false,at:0,_cb:[],_p:null};
  try{
    var c=JSON.parse(localStorage.getItem(CK)||'null');
    if(c&&Array.isArray(c.rows)&&c.rows.length&&Date.now()-(+c.t||0)<MAXAGE){ J.rows=clean(c.rows); J.src='cache'; J.cols=!!c.cols; J.at=+c.t||0; }
  }catch(e){}
  /* สาขาหน้าร้านที่เปิดอยู่ (เรียงตาม sort แล้วรหัส) */
  J.stores=function(all){ return J.rows.filter(function(r){ return r.kind==='store'&&(all||r.active); }).sort(bySort); };
  J.storeCodes=function(all){ return J.stores(all).map(function(r){ return r.code; }); };
  /* สาขาหน้าร้าน + ครัวกลาง + ออฟฟิศ (ตัวเลือก "ประจำที่"/สิทธิ์รายสาขา) — ใช้รหัส OFFICE ไม่ใช่ JJOF */
  J.units=function(){ return J.stores().concat(UNITS.map(function(u){ var r=J.get(u.code); return r&&r.kind===u.kind?Object.assign({},u,{name:r.name||u.name,short:r.short||u.short}):u; })); };
  J.unitCodes=function(){ return J.units().map(function(r){ return r.code; }); };
  J.canon=function(c){ c=s(c,12).toUpperCase(); return c==='JJOF'?'OFFICE':c; };
  J.pnl=function(c){ c=s(c,12).toUpperCase(); return c==='OFFICE'?'JJOF':c; };
  J.get=function(c){
    c=s(c,12).toUpperCase(); if(!c)return null;
    var r=null,i;
    for(i=0;i<J.rows.length;i++){ if(J.rows[i].code===c){ r=J.rows[i]; break; } }
    if(!r&&(c==='OFFICE'||c==='JJOF')){ for(i=0;i<J.rows.length;i++){ if(J.rows[i].code===(c==='OFFICE'?'JJOF':'OFFICE')){ r=J.rows[i]; break; } } }
    if(!r){ for(i=0;i<UNITS.length;i++){ if(UNITS[i].code===J.canon(c)){ r=UNITS[i]; break; } } }
    return r;
  };
  J.known=function(c){ return !!J.get(c); };
  J.isStore=function(c){ var r=J.get(c); return !!(r&&r.kind==='store'); };
  J.name=function(c,fb){ var r=J.get(c); return r?r.name:(fb!=null?fb:s(c)); };
  J.short=function(c,fb){ var r=J.get(c); return r?r.short:(fb!=null?fb:s(c)); };
  J.stk=function(c){ var r=J.get(c); return (r&&r.stk_id)||STK[s(c,12).toUpperCase()]||''; };
  J.byStk=function(id){ id=s(id,40); if(!id)return null; for(var i=0;i<J.rows.length;i++){ if(J.rows[i].stk_id===id)return J.rows[i]; } for(var k in STK){ if(STK[k]===id)return J.get(k); } return null; };
  J.color=function(c,i){ var r=J.get(c); if(r&&r.color)return r.color; var st=J.storeCodes(true),k=st.indexOf(s(c,12).toUpperCase()); return PALETTE[(k<0?(i||0):k)%PALETTE.length]; };
  /* สาขาหน้าร้านที่แอพยังไม่รู้จัก (known = รายการรหัส หรือ object ที่มีรหัสเป็น key) */
  J.extra=function(known){
    var have={}; (Array.isArray(known)?known:Object.keys(known||{})).forEach(function(k){ have[s(k,12).toUpperCase()]=1; });
    return J.stores().filter(function(r){ return !have[r.code]; });
  };
  /* รหัสสาขาใหม่ที่ใช้ได้: อังกฤษพิมพ์ใหญ่ล้วน 2–8 ตัว (ใช้เป็นตัวหน้าเลขใบกำกับภาษีด้วย) */
  J.codeOk=function(c){ return /^[A-Z]{2,8}$/.test(s(c,12)); };
  J.onChange=function(fn){ if(typeof fn==='function')J._cb.push(fn); };
  /* อ่านทะเบียนจริง (ไม่ throw) — url/key ของ Supabase · opts.force = อ่านใหม่แม้เพิ่งอ่าน · คืน rows */
  J.load=function(url,key,opts){
    opts=opts||{};
    if(J._p&&!opts.force)return J._p;
    if(J.src==='db'&&!opts.force&&Date.now()-J.at<60000)return Promise.resolve(J.rows);
    url=s(url,300).replace(/\/+$/,''); key=s(key,500);
    if(!url||!key||typeof fetch!=='function')return Promise.resolve(J.rows);
    var get=function(q){
      var ac=typeof AbortController==='function'?new AbortController():null, tm=ac?setTimeout(function(){ ac.abort(); },opts.timeout||8000):0;
      return fetch(url+'/rest/v1/pnl_branches?'+q,{headers:{apikey:key,Authorization:'Bearer '+key},signal:ac?ac.signal:undefined,cache:'no-store'})
        .then(function(r){ if(tm)clearTimeout(tm); if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); });
    };
    /* ลองแบบไม่เรียงตาม sort เฉพาะตอนเซิร์ฟเวอร์ตอบ 4xx (เช่นตารางไม่มีช่อง sort) · หมดเวลา/เน็ตหลุด = ไม่ลองซ้ำ (ไม่ให้แอพรอนานเป็น 2 เท่า) */
    J._p=get('select=*&order=sort.asc,code.asc').catch(function(e){ if(!/^HTTP 4/.test(String(e&&e.message)))throw e; return get('select=*&order=code.asc'); })
      .then(function(d){
        if(!Array.isArray(d))throw new Error('bad');
        var rows=clean(d), before=JSON.stringify(J.rows);
        if(!rows.some(function(r){ return r.kind==='store'; }))rows=rows.concat(clean(BASE)); /* ตารางว่าง/มีแต่ออฟฟิศ = ใช้สาขาเดิมไปก่อน */
        J.rows=rows; J.src='db'; J.at=Date.now(); J.cols=d.length>0&&d.every(function(r){ return r&&Object.prototype.hasOwnProperty.call(r,'kind'); });
        try{ localStorage.setItem(CK,JSON.stringify({t:J.at,cols:J.cols,rows:d})); }catch(e){}
        if(JSON.stringify(J.rows)!==before)J._cb.forEach(function(fn){ try{ fn(J); }catch(e){ if(window.console)console.error(e); } });
        return J.rows;
      })
      .catch(function(){ return J.rows; })
      .then(function(r){ J._p=null; return r; });
    return J._p;
  };
  window.JJBR=J;
})();
</script>

];
const algNorm=s=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
/* คำที่พิมพ์ → รายการคำ (คั่นด้วย , ، / ช่องว่าง ขึ้นบรรทัด) · สั้นกว่า 2 ตัวอักษรไม่นับ (กันเจอทุกเมนู) */
function algWords(q){return [...new Set(String(q||'').split(/[,،/\n\r\t ]+|และ/).map(algNorm).filter(w=>w.length>=2))]}
/* คำ → สิ่งที่แพ้ในรายการ (ชื่อ/คำพ้อง ครอบกันทางใดทางหนึ่ง = นับ — เผื่อไว้ก่อน) */
function algResolve(words,list){
  const out=[];
  for(const a of list){
    const keys=[a.n,...(a.kw||[])].map(algNorm).filter(Boolean);
    if(words.some(w=>keys.some(k=>k.includes(w)||w.includes(k))))out.push(a.k);
  }
  return out;
}
/* ตัดสินอาหาร 1 อย่าง: codes = สิ่งที่แพ้ที่เลือก · words = คำที่พิมพ์
   → {st:'no'|'may'|'unk'|'ok'|'none', has:[รหัส], may:[รหัส], words:[คำที่เจอ]} */
function algClassify(it,codes,words){
  codes=codes||[];words=words||[];
  const has=(it.contains||[]).filter(c=>codes.includes(c));
  const txt=algNorm([it.name,it.ingredients,it.note].join(' '));
  const wh=words.filter(w=>txt.includes(w));
  const may=(it.may||[]).filter(c=>codes.includes(c)&&!has.includes(c));
  if(!codes.length&&!words.length)return {st:'none',has:[],may:[],words:[]};
  if(has.length||wh.length)return {st:'no',has,may,words:wh};
  if(may.length)return {st:'may',has,may,words:wh};
  if(!it.checked)return {st:'unk',has,may,words:wh};
  return {st:'ok',has,may,words:wh};
}
/* ALG-CORE-END */

function hl(text,words){   // ไฮไลต์คำที่เจอ (หาในข้อความดิบ แล้วค่อย esc ทีละท่อน — ไม่ไปตัดกลาง &amp;)
  const t=String(text==null?'':text),lo=t.toLowerCase(),ws=(words||[]).filter(Boolean);
  if(!ws.length)return esc(t);
  let h='',i=0;
  while(i<t.length){
    let best=-1,len=0;
    for(const w of ws){const k=lo.indexOf(w,i);if(k>=0&&(best<0||k<best||(k===best&&w.length>len))){best=k;len=w.length}}
    if(best<0){h+=esc(t.slice(i));break}
    h+=esc(t.slice(i,best))+'<mark>'+esc(t.slice(best,best+len))+'</mark>';i=best+len;
  }
  return h;
}

function card(it,r,words){
  const st=r?r.st:(it.checked?'':'unk');
  let why='';
  if(r){
    if(st==='no')why='❌ '+[...r.has.map(k=>algOf(k).ic+' '+algOf(k).n),...r.words.map(w=>'“'+w+'”')].map(esc).join(' · ');
    else if(st==='may')why='⚠️ อาจปนเปื้อน: '+r.may.map(k=>algOf(k).ic+' '+algOf(k).n).map(esc).join(' · ');
    else if(st==='unk')why='❔ ยังไม่ยืนยันข้อมูล — ถามครัวก่อนเสิร์ฟ';
    else why='✅ ไม่มีสิ่งที่ลูกค้าแพ้';
  }
  const bds=(it.contains||[]).map(k=>badge(k,'has')).join('')+(it.may||[]).map(k=>badge(k,'may')).join('');
  return `<div class="it ${st}"><div class="h"><div class="nm">${esc(it.name)}<small>${kindName(it.kind)}${it.cat?' · '+esc(it.cat):''}</small></div>
    ${can('items','e')?`<button class="ed" title="แก้ไข" onclick="openForm(${it.id})">✏️</button>`:''}</div>
    ${why?`<div class="why">${why}</div>`:''}
    <div>${bds||(it.checked&&st!=='no'?'<span class="bd ok">✅ ไม่มีสารก่อภูมิแพ้ในรายการ</span>':'')}${it.checked?'':'<span class="bd unk">❔ ยังไม่ยืนยัน</span>'}${it.active===false?'<span class="bd off">เลิกขาย</span>':''}</div>
    ${it.ingredients?`<div class="ing">ส่วนผสม: ${hl(it.ingredients,words)}</div>`:''}
    ${it.note?`<div class="ing">📝 ${hl(it.note,words)}</div>`:''}</div>`;
}

    +[...F.contains,...F.may].filter(k=>!ALGS().some(a=>a.k===k)).map(k=>`<button type="button" class="ach has" data-p="${esc(k)}">❔ ${esc(k)} <small>ไม่อยู่ในรายการแล้ว</small></button>`).join('');

/* ---------- 📥 นำเข้าชื่อจากเมนู QR + สินค้าครัวกลาง (อ่านอย่างเดียว · ไม่แตะตารางระบบอื่น) ---------- */
let IMP=[];
/* อ่านทีละ 1000 แถว (Supabase ตัดที่ 1000 ต่อครั้ง) */
async function selAll(t,q){let out=[];for(let o=0;o<50000;o+=1000){const r=await sel(t,q+'&limit=1000&offset='+o);out=out.concat(r||[]);if(!r||r.length<1000)break}return out}
/* หมวดของแอปนับสต๊อก → ประเภทในแอปนี้ (เดาให้ก่อน แก้ได้ในฟอร์ม) */
function kindGuess(cat){const c=String(cat||'');
  return /เครื่องดื่ม|น้ำดื่ม|น้ำอัดลม|เบียร์|โซดา|น้ำแข็ง/.test(c)?'drink':/น้ำจิ้ม|ซอส|เครื่องปรุง/.test(c)?'sauce':/หวาน|ไอติม|ไอศกรีม|ขนม/.test(c)?'dessert'
    :/หมู|เนื้อ|ไก่|ทะเล|กุ้ง|ปลา|ของสด|เนื้อสัตว์/.test(c)?'meat':/ผัก|เส้น|ลูกชิ้น|อาหาร/.test(c)?'menu':'product'}

  const [sc,ck,qr]=await Promise.all([

  $('sheet').innerHTML=`<h3>📥 นำเข้าจากเมนู<button class="ed" onclick="closeSheet()">✕</button></h3>
    <div class="note">ดึงเฉพาะชื่อที่ยังไม่มีในระบบ (ชื่อซ้ำกันหลายสาขารวมเป็นรายการเดียว) · นำเข้าแล้วขึ้นเป็น ❔ ยังไม่ยืนยัน — ต้องเข้าไปใส่สิ่งที่แพ้ + ติ๊กยืนยันทีละรายการ${bad?'<br>⚠️ อ่านไม่ได้: '+esc(bad):''}</div>

      <div class="foot"><button class="btn o" onclick="closeSheet()">ยกเลิก</button><button class="btn g" id="impGo" onclick="doImport()">📥 นำเข้า</button></div>`

/* ---------- ล็อกอิน (pnl_users · JJ Login + JJ Gate) ---------- */
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const enc=new TextEncoder().encode(str);
  const l=enc.length,bitLen=l*8,withOne=l+1,total=(Math.ceil((withOne+8)/64))*64;
  const M=new Uint8Array(total);M.set(enc);M[l]=0x80;
  const dv=new DataView(M.buffer);
  dv.setUint32(total-4,bitLen>>>0);dv.setUint32(total-8,Math.floor(bitLen/4294967296));
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));const w=new Array(64);
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3),s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[t]+w[t])>>>0,S0=rr(a,2)^rr(a,13)^rr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
const pwHash=(u,p)=>sha256hex(u+'|'+p+'|JJPNL');
async function fetchUser(name){const r=await sel('pnl_users',`select=id,username,display_name,role,active,status,pass_hash,apps,unit&username=eq.${enc(name)}&limit=1`);return r&&r[0]}
async function doLogin(){
  const u=($('liUser').value||'').trim(),p=$('liPass').value||'',msg=$('liMsg'),btn=$('liBtn');
  const say=t=>{if(msg){msg.textContent=t;msg.style.display='block'}};
  if(!u||!p)return say('กรอกชื่อผู้ใช้และรหัสผ่าน');
  if(btn)btn.disabled=true;
  try{const usr=await fetchUser(u);
    if(!usr||usr.pass_hash!==pwHash(u,p))return say('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    if(!userReady(usr))return say(usr.status==='pending'?'บัญชีนี้ยังรอผู้ดูแลอนุมัติ':'บัญชีนี้ถูกปิดการใช้งาน');
    JJGate.grant(usr.username);enter(usr);
  }catch(e){say('เชื่อมต่อฐานข้อมูลไม่ได้ — '+String(e.message||e).slice(0,80))}
  finally{if(btn)btn.disabled=false}
}
function enter(usr){
  ME={username:usr.username,display_name:usr.display_name||usr.username,role:usr.role||'',apps:usr.apps||null};
  LS.set('jjalg_sess',{username:ME.username,display_name:ME.display_name,role:ME.role});
  if(!canApp()){$('login').style.display='block';const m=$('liMsg');if(m){m.textContent='บัญชีนี้ยังไม่ได้รับสิทธิ์เข้า JJ Allergy — ขอสิทธิ์ที่ 🔑 JJ Access';m.style.display='block'}LS.del('jjalg_sess');ME=null;return}
  $('login').style.display='none';$('app').hidden=false;
  $('who').textContent='👤 '+ME.display_name;
  startApp();
}
function logout(){LS.del('jjalg_sess');location.reload()}
let started=false;
function startApp(){
  if(started)return;started=true;
  show(LS.get('jjalg_tab','search'));   // รีเฟรช/ลากลง = อยู่หน้าเดิม (show() เช็คสิทธิ์ของแท็บให้)
  loadAll();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('ovl').classList.contains('on'))loadAll()});
}
(async function init(){
  const sess=LS.get('jjalg_sess',null);
  if(sess&&sess.username&&JJGate.ok(sess.username)){
    try{const u=await fetchUser(sess.username);
      if(!userReady(u)){LS.del('jjalg_sess');$('login').style.display='block';return}
      enter(u);
    }catch(e){$('login').style.display='block';const m=$('liMsg');if(m){m.textContent='เชื่อมต่อฐานข้อมูลไม่ได้ ลองใหม่อีกครั้ง';m.style.display='block'}}
  }else{$('login').style.display='block';if(sess&&sess.username)JJGate.note(sess.username,'liUser','liPass')}
})();
</script>
<script>
/* ============================================================
   ลากหน้าลง = รีเฟรช (pull-to-refresh) — ใช้ได้บนมือถือทุกแบบ
   จำเป็นเพราะแอปที่ "เพิ่มไปยังหน้าจอโฮม" (PWA) ไม่มีปุ่ม/ท่ารีเฟรชของเบราว์เซอร์
   แตะที่ยอดสุดของหน้าแล้วลากลงเกิน 70px → ปล่อยนิ้ว = โหลดหน้าใหม่
   ============================================================ */
(function(){
  if(!('ontouchstart' in window))return;              // เฉพาะจอสัมผัส
  var TH=70, MAX=110, y0=0, dy=0, pulling=false, ready=false, bar=null;

  function el(){
    if(bar)return bar;
    bar=document.createElement('div');
    bar.setAttribute('aria-hidden','true');
    bar.style.cssText='position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:99999;display:flex;'+   /* ใต้แถบสถานะ iPhone (ไม่ได้ลาก = สูง 0 ไม่เห็นเหมือนเดิม) */
      'align-items:center;justify-content:center;pointer-events:none;'+
      'height:0;overflow:hidden;transition:none;'+
      'font:600 13px/1.2 "Prompt","Sarabun",system-ui,sans-serif;color:#F2CF7A;'+
      'background:linear-gradient(180deg,rgba(163,27,36,.95),rgba(163,27,36,0));';
    bar.innerHTML='<span id="__ptrTxt">ลากลงเพื่อรีเฟรช</span>';
    document.body.appendChild(bar);
    return bar;
  }
  function atTop(){
    var d=document.scrollingElement||document.documentElement;
    return (window.pageYOffset||d.scrollTop||0)<=0;
  }
  /* ลากอยู่ในกล่องที่เลื่อนได้เอง (ตาราง/ลิสต์) ไม่นับ */
  function inScrollable(node){
    for(var n=node;n&&n!==document.body;n=n.parentElement){
      var st=getComputedStyle(n), oy=st.overflowY;
      if((oy==='auto'||oy==='scroll')&&n.scrollHeight>n.clientHeight&&n.scrollTop>0)return true;
    }
    return false;
  }
  /* โหมด kiosk (แท็บเล็ตหน้าร้านให้ลูกค้ากด) ห้ามรีเฟรช — คะแนนที่กดค้างไว้จะหาย */
  function kiosk(){
    return document.body.classList.contains('kiosk') ||
           /[?&]kiosk=/.test(location.search);
  }
  document.addEventListener('touchstart',function(e){
    if(kiosk()){pulling=false;return;}
    if(e.touches.length!==1||!atTop()||inScrollable(e.target)){pulling=false;return;}
    y0=e.touches[0].clientY; dy=0; pulling=true; ready=false;
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(!pulling)return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0||!atTop()){ if(bar){bar.style.height='0';} return; }
    if(e.cancelable)e.preventDefault();                // กันหน้าเด้งตามนิ้ว
    var h=Math.min(dy*0.5,MAX), b=el();
    b.style.height=h+'px';
    ready = dy>TH;
    var t=b.querySelector('#__ptrTxt');
    if(t)t.textContent = ready ? 'ปล่อยเพื่อรีเฟรช' : 'ลากลงเพื่อรีเฟรช';
  },{passive:false});

  document.addEventListener('touchend',function(){
    if(!pulling)return; pulling=false;
    var b=el();
    if(ready){
      b.style.height='44px';
      var t=b.querySelector('#__ptrTxt'); if(t)t.textContent='กำลังโหลด…';
      setTimeout(function(){ location.reload(); },120);
    }else{
      b.style.transition='height .2s'; b.style.height='0';
      setTimeout(function(){ b.style.transition='none'; },220);
    }
  },{passive:true});
})();
</script>
