<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>JJ Calendar — จริงใจหมูกระทะ</title>
<meta name="theme-color" content="#0C0A09">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23A31B24'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --red:#FF4046; --red-d:#C62127; --red-t:rgba(255,64,70,.15);
  --gold:#FFC643; --gold-t:rgba(255,198,67,.13);
  --ink:#F4EFE8; --mut:#A89E93; --bg:#0C0A09; --card:rgba(255,255,255,.035); --line:rgba(255,255,255,.10);
  --ok:#2FE08A; --ok-t:rgba(47,224,138,.13); --bad:#FF5C5C; --bad-t:rgba(255,92,92,.13);
  --blu:#58B0FF; --blu-t:rgba(88,176,255,.13);
  --r:16px; --sh:0 2px 20px rgba(0,0,0,.35); --glow:0 0 18px rgba(255,64,70,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100dvh;overflow-x:hidden}
::selection{background:rgba(255,64,70,.4)}
body::before{content:'';position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:radial-gradient(38% 30% at 12% 8%,rgba(198,33,39,.25),transparent 60%),
             radial-gradient(30% 26% at 88% 12%,rgba(255,198,67,.11),transparent 60%),
             radial-gradient(42% 36% at 78% 92%,rgba(198,33,39,.16),transparent 60%);
  animation:aur 26s ease-in-out infinite alternate}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(75% 65% at 50% 28%,#000 0%,transparent 100%);
  mask-image:radial-gradient(75% 65% at 50% 28%,#000 0%,transparent 100%)}
@keyframes aur{to{transform:translate3d(3%,4%,0) scale(1.07)}}
h1,h2,h3,.num{font-family:'Prompt',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:15px;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
input,select,textarea{background:rgba(255,255,255,.05);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;width:100%;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,64,70,.14)}
input::placeholder,textarea::placeholder{color:#6E655C}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
select option{background:#1A1512;color:var(--ink)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
input[type=date],input[type=time]{color-scheme:dark}
::-webkit-scrollbar{height:7px;width:7px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,64,70,.45)}

/* ---------- layout ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(14,11,10,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
header::after{content:'';display:block;height:2px;margin-top:-1px;
  background:linear-gradient(90deg,transparent,var(--red) 18%,var(--gold) 50%,var(--red) 82%,transparent);
  background-size:220% 100%;animation:scan 6s linear infinite;opacity:.85}
@keyframes scan{to{background-position:-220% 0}}
.hrow{display:flex;align-items:center;gap:10px;padding:10px clamp(14px,1.6vw,28px) 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:'Prompt';font-weight:700;font-size:18px}
.brand .hlogo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--red-d),var(--red));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 14px rgba(255,198,67,.35)}
.brand>span{background:linear-gradient(90deg,#FFF3E0 0%,var(--gold) 45%,#FFF3E0 90%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.brand small{font-weight:500;font-size:11px;display:block;line-height:1;-webkit-text-fill-color:var(--mut);color:var(--mut)}
@keyframes shine{to{background-position:-200% 0}}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:7px 13px;border-radius:9px;font-weight:600;color:var(--mut);font-size:14px;white-space:nowrap;transition:.15s}
.seg button.on{background:linear-gradient(135deg,var(--red-d),var(--red));color:#fff;box-shadow:var(--glow)}
#mineBtn{border:1.5px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--mut);white-space:nowrap;transition:.15s}
#mineBtn.on{border-color:rgba(255,198,67,.55);color:var(--gold);background:var(--gold-t);box-shadow:0 0 14px rgba(255,198,67,.2)}
#hdUser{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
.tabbar{display:flex;gap:4px;overflow-x:auto;padding:4px 10px 9px;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:none;padding:8px 14px;border-radius:99px;font-weight:600;color:var(--mut);font-size:14px}
.tabbar button.on{background:linear-gradient(135deg,var(--red-d),var(--red));color:#fff;box-shadow:var(--glow)}
main{padding:16px clamp(12px,1.6vw,28px) 90px;max-width:1100px;margin:0 auto;position:relative}
.view{display:none}.view.on{display:block;animation:vin .3s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{background:linear-gradient(135deg,var(--red-d),var(--red));color:#fff;border-radius:11px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 14px rgba(255,64,70,.3);transition:.18s;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 24px rgba(255,64,70,.5)}
.btn.dk{background:linear-gradient(135deg,#2B2420,#3C312B);box-shadow:0 2px 12px rgba(0,0,0,.45)}
.btn.gh{background:rgba(255,255,255,.05);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.gh:hover{border-color:rgba(255,64,70,.5);box-shadow:0 0 14px rgba(255,64,70,.18)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2.5px 9px;background:rgba(255,255,255,.07);color:#CFC6BB;border:1px solid rgba(255,255,255,.08);white-space:nowrap}
.mut{color:var(--mut)} .xs{font-size:11.5px} .sm{font-size:13px} .b{font-weight:700}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px;font-family:'Prompt'}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}                                   /* ช่องวันที่/เวลาบนมือถือจอแคบ ห้ามดันล้นขอบฟอร์ม */
input[type=date],input[type=time]{min-width:0;max-width:100%}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:13.5px}
.spin{width:24px;height:24px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite;margin:30px auto;box-shadow:0 0 18px rgba(255,64,70,.25)}
@keyframes sp{to{transform:rotate(360deg)}}
.ckrow{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:2px 0 10px;cursor:pointer}
.ckrow input{width:18px;height:18px;accent-color:var(--red)}
.copyline{display:flex;gap:7px;align-items:center;margin:6px 0}
.copyline input{font-size:12px;font-family:ui-monospace,Menlo,monospace;background:rgba(0,0,0,.28)}
.hintlink{color:var(--blu);font-weight:600;font-size:13px;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.steps{margin:6px 0 2px;padding-left:20px;font-size:13.5px;line-height:1.7;color:#DCD3C7}
.steps li::marker{color:var(--gold);font-weight:700}

/* ---------- ปฏิทินเดือน ---------- */
.mnav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mnav h2{margin:0;font-size:18px;min-width:170px}
.mnav .nv{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:18px;font-weight:700;transition:.15s}
.mnav .nv:hover{border-color:rgba(255,198,67,.5);color:var(--gold)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--mut);font-family:'Prompt';font-weight:700;margin-bottom:5px}
.dow .sun{color:var(--bad)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mcell{min-height:92px;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:4px 4px 3px;background:rgba(255,255,255,.02);cursor:pointer;overflow:hidden;transition:.15s}
.mcell:hover{border-color:rgba(255,198,67,.45);background:rgba(255,255,255,.05)}
.mcell.out{opacity:.32}
.mcell.today{border-color:var(--red);box-shadow:inset 0 0 0 1px rgba(255,64,70,.35),0 0 14px rgba(255,64,70,.14)}
.mcell .dnum{font-family:'Prompt';font-size:12px;font-weight:600;color:var(--mut);display:block}
.mcell.today .dnum{color:var(--red);font-weight:700}
.mev{font-size:10.5px;line-height:1.35;border-radius:6px;padding:1.5px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mev:hover{filter:brightness(1.25)}
.mmore{font-size:10px;color:var(--mut);margin-top:2px;font-weight:600}
.todaybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,64,70,.10),rgba(255,198,67,.07));border:1px solid rgba(255,198,67,.3);border-radius:13px;padding:9px 13px;margin-bottom:12px;font-size:13.5px}
.todaybar .tchip{cursor:pointer;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600}
.todaybar .tchip:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:640px){
  .mcell{min-height:66px;padding:3px 2px 2px;border-radius:8px}
  .mev{font-size:8.5px;padding:1px 3px;border-radius:4px}
  .mcell .dnum{font-size:11px}
  .mnav h2{font-size:16px;min-width:150px}
}

/* ---------- 🎌 วันพิเศษ (2026-09-29) — สีพื้นช่องวัน ไม่ใช้แถบนัด (ไม่กินที่ 3 แถบ/วัน) ---------- */
.mcell.spd-ord{background:linear-gradient(160deg,rgba(88,176,255,.16),rgba(88,176,255,.04));border-color:rgba(88,176,255,.32)}
.mcell.spd-off{background:linear-gradient(160deg,rgba(178,140,255,.18),rgba(178,140,255,.05));border-color:rgba(178,140,255,.38)}
.mcell.spd-pay{background:linear-gradient(160deg,rgba(255,198,67,.16),rgba(255,198,67,.04));border-color:rgba(255,198,67,.35)}
.mcell.spd-off.spd-pay{background:linear-gradient(160deg,rgba(255,198,67,.16),rgba(178,140,255,.12))}
.spd{font-size:10px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.spd .ic{margin-right:2px}
.sdcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--r);padding:12px 14px;margin-bottom:9px}
.sdcard.ord{border-left-color:#58B0FF}
.sdcard.off{border-left-color:#B28CFF}
.sdcard.leg{border-left-color:#8C8278}
.chip.off{color:#D2BCFF;border-color:rgba(178,140,255,.5);background:rgba(178,140,255,.10)}
.sdbox.off{border-color:rgba(178,140,255,.4)}
.sdseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sdseg button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink,#fff);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;padding:6px 4px;line-height:1.3}
.sdseg button .n{display:inline-block;margin-left:5px;font-size:11px;font-weight:700;padding:0 6px;border-radius:9px;background:rgba(255,255,255,.1)}
.sdseg button.on.off{border-color:#B28CFF;background:rgba(178,140,255,.16)}
.sdseg button.on.pay{border-color:var(--gold);background:rgba(255,198,67,.14)}
.sdseg button.on.ord{border-color:#58B0FF;background:rgba(88,176,255,.14)}
.sdleg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.sdl{min-height:40px;border-radius:20px;border:1.5px solid var(--line);background:transparent;color:var(--ink,#fff);font:inherit;font-size:12.5px;font-weight:600;padding:4px 12px;cursor:pointer}
.sdl.off{border-color:rgba(178,140,255,.55)}.sdl.pay{border-color:rgba(255,198,67,.55)}.sdl.ord{border-color:rgba(88,176,255,.55)}
.sdl.offl{opacity:.45;border-style:dashed}
.sdcard.past{opacity:.6}
.sdcard.pay-only{border-left-color:#8C8278;border-style:dashed}
.sdcard .t{font-family:'Prompt';font-weight:700;font-size:15px}
.sdcard .when{font-size:13px;color:var(--mut);margin:2px 0 6px}
.sdcard .fx{display:flex;flex-wrap:wrap;gap:6px}
.sdcard .acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.chip.pay{color:#FFD36B;border-color:rgba(255,198,67,.45);background:rgba(255,198,67,.10)}
.chip.ord{color:#8CC8FF;border-color:rgba(88,176,255,.45);background:rgba(88,176,255,.10)}
.chip.wait{color:#FFB35C;border-color:rgba(255,160,70,.5)}
.chip.okc{color:#6BE39B;border-color:rgba(76,195,138,.5)}
.sdbox{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.sdbox.pay{border-color:rgba(255,198,67,.35)}
.sdbox.ord{border-color:rgba(88,176,255,.35)}
.sdbox .ckrow{margin:0}
.sdbox .more{margin-top:8px;font-size:13px;line-height:1.6}
.sdnote{font-size:12.5px;color:var(--mut);line-height:1.6;margin:6px 0 0}
.sdwarn{background:rgba(255,160,70,.10);border:1px solid rgba(255,160,70,.35);border-radius:10px;padding:8px 10px;font-size:12.5px;color:#FFC98A;margin-top:8px;line-height:1.55}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick .chip{cursor:pointer;font-size:13px;padding:7px 12px;min-height:36px}
.pick .chip.on{background:rgba(255,64,70,.18);border-color:var(--red);color:#fff}
.psrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;cursor:pointer;min-height:44px}
.psrow input{width:20px;height:20px;accent-color:var(--red)}
.psrow .d{font-size:12px;color:var(--mut)}
.psrow.have{opacity:.5}
@media(max-width:640px){
  .spd .tx{display:none}
  .spd{font-size:9px}
  .sdcard .acts2 .btn{flex:1 1 auto;min-height:44px;justify-content:center}
}

/* ---------- รายการนัด ---------- */
.agrp{margin:16px 2px 8px;font-family:'Prompt';font-weight:700;font-size:14px;color:var(--gold);display:flex;align-items:center;gap:8px}
.agrp.today{color:var(--red)}
.acard{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.18s;backdrop-filter:blur(8px)}
.acard:hover{border-color:rgba(255,198,67,.4);transform:translateY(-1px)}
.atime{flex:none;width:76px;text-align:center;font-family:'Prompt';font-weight:700;font-size:14px;padding-top:2px;line-height:1.5}
.atime .xs{display:block;font-weight:500;color:var(--mut)}
.abody{flex:1;min-width:0}
.abody .t{font-weight:700;font-family:'Prompt';font-size:15px;margin-bottom:3px}
.abody .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mut)}
.ppl{font-size:12.5px;color:#DCD3C7;margin-top:5px;line-height:1.5}

/* ---------- ผู้เข้าร่วม (ฟอร์ม) ---------- */
.attops{display:flex;gap:7px;margin-bottom:7px}
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:3px;max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:8px;background:rgba(0,0,0,.18)}
.attgrid label{display:flex;gap:7px;align-items:center;font-size:13.5px;cursor:pointer;padding:3px 4px;border-radius:7px}
.attgrid label:hover{background:rgba(255,255,255,.05)}
.attgrid input{width:16px;height:16px;accent-color:var(--red);flex:none}

/* ---------- misc ---------- */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fbar input{flex:1 1 230px;min-width:150px;padding:9px 12px;font-size:16px}
.fbar select{flex:0 1 200px;width:auto;padding:9px 30px 9px 12px;font-size:16px}
.fbar .fcount{font-size:12px;color:var(--mut);flex:none}
@media(max-width:560px){.fbar input,.fbar select{flex:1 1 100%}}
.chip.f{cursor:pointer;user-select:none}
.chip.f:hover{border-color:rgba(255,198,67,.5);color:var(--gold)}
.chip.f.on{background:var(--red-t);color:var(--red);border-color:rgba(255,64,70,.45)}
#attChips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
#rtDot{font-size:9px;margin-right:4px;vertical-align:middle}
.tapbtn{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border-radius:14px;font-weight:700;font-size:15.5px;font-family:'Prompt',sans-serif;text-decoration:none;color:#fff;margin-bottom:9px;transition:.18s;box-shadow:0 3px 18px rgba(0,0,0,.35)}
.tapbtn .ic{font-size:24px;line-height:1;flex:none}
.tapbtn .tx{flex:1;min-width:0}
.tapbtn .tx small{display:block;font-weight:500;font-size:11.5px;opacity:.85;margin-top:1px}
.tapbtn .go{font-size:20px;opacity:.7;flex:none}
.tapbtn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.tapbtn.ios{background:linear-gradient(135deg,#1F1B18,#3A322C);border:1.5px solid rgba(255,255,255,.18)}
.tapbtn.goog{background:linear-gradient(135deg,#1A4E85,#2E7BD6)}
.tapbtn.off{opacity:.5;filter:grayscale(.6)}
details.manual{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:10px;background:rgba(0,0,0,.18)}
details.manual>summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:13.5px;color:var(--mut);list-style:none}
details.manual>summary::-webkit-details-marker{display:none}
details.manual>summary::before{content:'▸ ';color:var(--gold)}
details.manual[open]>summary::before{content:'▾ '}
details.manual>div{padding-bottom:12px}
#fab{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--red-d),var(--red));color:#fff;font-size:28px;line-height:1;box-shadow:0 6px 26px rgba(255,64,70,.55);z-index:45;display:none;align-items:center;justify-content:center;transition:.18s}
#fab:hover{transform:scale(1.08)}

<style>
/* JJ Gate — ช่องล็อกอินบนมือถือต้องไม่ต่ำกว่า 16px ไม่งั้น iPhone จะซูมหน้าจอเองตอนกดพิมพ์ */

  #lgU,#lgP,#liUser,#liPass{font-size:16px !important}
  .jjgate-note{font-size:13px !important}
}

<script>
/* ============================================================
   JJ Gate — ด่านกันคนเข้าทางลิงก์ตรง (เจ้าของสั่ง 2026-09-21)
   · เข้าจากหน้าศูนย์รวมแอพ (index.html) หลังล็อกอิน = ผ่านได้เลยตามสิทธิ์
   · เข้าด้วย URL ตรง / ลิงก์ที่ถูกส่งต่อ = ต้องใส่รหัสผ่านใหม่ทุกครั้ง
   ใบผ่านมี 2 แบบ:
   · ใบผ่านครั้งเดียว (localStorage 'jjhub_pass') หน้าศูนย์รวมแอพออกให้ตอนกดไอคอน
     อายุ 2 นาที · ผูกกับชื่อผู้ใช้ + ชื่อแอพ · ใช้แล้วลบทิ้งทันที
   · ใบผ่านประจำแท็บ (sessionStorage) — รีเฟรช/กดลากลงยังอยู่ แต่แท็บใหม่ไม่มี
   *** บล็อกนี้เหมือนกันทุกแอพ (ต่างแค่ชื่อแอพบรรทัดแรก) แก้ที่ไหนต้องแก้ให้ครบทุกไฟล์ ***
   ============================================================ */
window.JJGate=(function(){
  var APP='calendar';                 /* ชื่อแอพนี้ — ต้องตรงกับ data-app ในหน้าศูนย์รวมแอพ */
  var TAB='jjgate_'+APP, TICKET='jjhub_pass', ALT='jjsso_ticket';
  var IDLE=30*60*1000;               /* ทิ้งไว้เกิน 30 นาทีแล้วรีเฟรช = ยืนยันรหัสใหม่ (กติกาเดียวกับ P&L) */
  var TTL=2*60*1000;                 /* ใบผ่านจากหน้าศูนย์รวมแอพ อายุ 2 นาที */
  function j(s){ try{ return JSON.parse(s||'null'); }catch(e){ return null; } }
  function readTab(){ try{ return j(sessionStorage.getItem(TAB)); }catch(e){ return null; } }
  function grant(user){ try{ sessionStorage.setItem(TAB,JSON.stringify({u:user||'',t:Date.now()})); }catch(e){} }
  /* ใช้ใบผ่านแล้วต้องลบให้เกลี้ยงทั้ง 2 แบบ ไม่งั้นใบที่เหลือจะถูกเอาไปเปิดแท็บใหม่ได้อีก
     (ลบเฉพาะใบที่จ่าหน้าถึงแอพนี้ — ใบของแอพอื่นต้องไม่โดนลบไปด้วย) */
  function burn(){
    try{ localStorage.removeItem(TICKET); }catch(e){}
    var o=null; try{ o=j(localStorage.getItem(ALT)); }catch(e){}
    if(!o||!o.app||o.app===APP){ try{ localStorage.removeItem(ALT); }catch(e){} }
  }
  function takeTicket(){
    var t=null; try{ t=j(localStorage.getItem(TICKET)); }catch(e){}
    if(t&&t.app===APP&&t.u&&t.exp&&t.exp>=Date.now()){ burn(); return t; }
    /* รับใบผ่านอีกแบบของหน้าศูนย์รวมแอพด้วย (jjsso_ticket — ระบบเดียวกับที่ JJ Social/ซ่อมบำรุงใช้) */
    var o=null; try{ o=j(localStorage.getItem(ALT)); }catch(e){}
    if(o&&o.u&&(!o.app||o.app===APP)&&(Date.now()-(+o.t||0))<TTL){ burn(); return {app:APP,u:o.u,exp:Date.now()+TTL}; }
    return null;
  }
  /* เปิดจากไอคอนที่ติดตั้งไว้บนหน้าจอมือถือ (PWA) = เครื่องของเจ้าตัวเอง ไม่ใช่ลิงก์ที่ถูกส่งต่อ → ผ่านได้
     (ลิงก์ที่ส่งต่อทางแชทจะเปิดในเบราว์เซอร์ธรรมดา ไม่ใช่โหมดนี้ — ยังโดนถามรหัสเหมือนเดิม) */
  function installed(){
    try{
      if(navigator.standalone===true)return true;                                   /* iPhone/iPad */
      return !!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches
             || window.matchMedia&&window.matchMedia('(display-mode: fullscreen)').matches);  /* Android */
    }catch(e){ return false; }
  }
  /* เรียกก่อนจะยอมรับ session ที่ค้างอยู่ในเครื่อง — false = ให้แสดงหน้าล็อกอิน
     ผ่านได้ 3 ทาง: ใบผ่านประจำแท็บ (รวมถึงการดึงหน้าลงรีเฟรช) · ใบผ่านจากหน้าศูนย์รวมแอพ · เปิดจากไอคอนบนมือถือ */
  function ok(user){
    var g=readTab();
    if(g&&(Date.now()-(g.t||0))<IDLE&&(!user||g.u===user)){ grant(g.u||user); return true; }
    var t=takeTicket();
    if(t&&(!user||t.u===user)){ grant(t.u); return true; }
    if(installed()){ grant(user||''); return true; }
    return false;
  }
  /* ออกใบผ่านก่อนพาไปอีกแอพ (หน้าศูนย์รวมแอพ + ลิงก์ข้ามแอพ) — ไม่รู้ชื่อผู้ใช้ = ไม่ออกให้ */
  function issue(app,user){
    if(!app||!user)return false;
    try{ localStorage.setItem(TICKET,JSON.stringify({app:app,u:user,exp:Date.now()+TTL})); return true; }catch(e){ return false; }
  }
  /* แปะข้อความ "เปิดจากลิงก์ตรง" บนหน้าล็อกอินของแอพ + เติมชื่อผู้ใช้ให้ เหลือแค่พิมพ์รหัส */
  function note(user,userId,passId){
    try{
      var u=userId?document.getElementById(userId):null, pw=passId?document.getElementById(passId):null;
      if(u&&user)u.value=user;
      /* หน้าล็อกอินมาตรฐาน (JJ Login) มีแถบ 🔒 ของตัวเองอยู่แล้ว */
      if(window.JJLogin&&document.getElementById('jjlgLock')){
        JJLogin.lock('<b>เปิดจากลิงก์ตรง</b> — ยืนยันรหัสผ่านอีกครั้งเพื่อความปลอดภัย<br>'+
          '<span style="opacity:.85">เข้าจาก<a href="index.html" style="color:inherit;font-weight:600"> หน้าศูนย์รวมแอพ </a>จะไม่ต้องกรอกซ้ำ</span>');
        if(pw)setTimeout(function(){ try{ pw.focus(); }catch(e){} },90);
        return;
      }
      var card=(u&&u.closest)?u.closest('.logincard,.lgc,.card,#login,#loginWrap'):null;
      if(card&&!card.querySelector('.jjgate-note')){
        var d=document.createElement('div');
        d.className='jjgate-note';
        d.style.cssText='margin:0 0 13px;padding:10px 12px;border-radius:11px;font-size:12.5px;line-height:1.55;text-align:left;'+
          'background:rgba(217,164,65,.13);border:1px solid rgba(217,164,65,.5);color:#C79A3E';
        d.innerHTML='🔒 <b>เปิดจากลิงก์ตรง</b> — ยืนยันรหัสผ่านอีกครั้งเพื่อความปลอดภัย<br>'+
          '<span style="opacity:.85">เข้าจาก<a href="index.html" style="color:inherit;font-weight:600"> หน้าศูนย์รวมแอพ </a>จะไม่ต้องกรอกซ้ำ</span>';
        card.insertBefore(d,card.firstChild);
      }
      if(pw)setTimeout(function(){ try{ pw.focus(); }catch(e){} },90);
    }catch(e){}
  }
  /* ต่ออายุใบผ่านของแท็บนี้เมื่อมีการใช้งาน */
  ['click','keydown','pointerdown','touchstart'].forEach(function(ev){
    try{ document.addEventListener(ev,function(){ var g=readTab(); if(g&&(Date.now()-(g.t||0))<IDLE)grant(g.u); },{passive:true,capture:true}); }catch(e){}
  });
  return {ok:ok,grant:grant,issue:issue,note:note,installed:installed,app:APP};
})();
</script>

    /* ผูกปุ่ม/Enter ให้การ์ดที่สร้างด้วย wrap() เอง */
    bind:function(o){ o=o||{};
      var go=o.submit;
      var run=function(e){ if(e&&e.preventDefault)e.preventDefault();
        if(typeof go==='function')go(); else if(typeof go==='string')try{eval(go);}catch(x){} };
      var b=document.getElementById(o.btnId||'lgBtn'); if(b&&go)b.addEventListener('click',run);
      [o.uid||'lgU',o.pid||'lgP'].forEach(function(id){
        var i=document.getElementById(id);

    },
    show:function(el,focusId){

      if(!box)return; box.classList.add('on');
      var f=document.getElementById(focusId||'lgU');
      if(f)setTimeout(function(){try{f.focus();}catch(e){}},60);
    },
    hide:function(el){ var box=(typeof el==='string')?document.getElementById(el):el;
      if(box)box.classList.remove('on'); },
    msg:function(t,id){ var m=document.getElementById(id||'lgMsg'); if(m)m.innerHTML=t||''; },
    /* แถบ "เปิดจากลิงก์ตรง" — เรียกตอนที่ด่านไม่ผ่าน */
    lock:function(t){ var l=document.getElementById('jjlgLock'); if(!l)return;

        '<b>เปิดจากลิงก์ตรง</b> — ใส่รหัสผ่านอีกครั้งเพื่อความปลอดภัย'; }
  };
  window.JJLogin=JJLogin;
})();
</script>

<script type="text/plain" id="feedCode">// ============================================================
// cal-feed — ฟีดปฏิทิน ICS ของระบบ JJ Calendar (จริงใจหมูกระทะ)
//
// วิธี deploy (ทำครั้งเดียว):
//   1. Supabase Dashboard → Edge Functions → Deploy a new function
//   2. ตั้งชื่อฟังก์ชันว่า  cal-feed  แล้ววางโค้ดไฟล์นี้ทั้งไฟล์ → Deploy
//   3. เข้าไปที่ฟังก์ชัน cal-feed → Settings → **ปิด "Verify JWT"** → Save
//      (ต้องปิด เพราะแอปปฏิทินบนมือถือแนบ Authorization header ไม่ได้
//       ถ้าไม่ปิด Supabase จะตอบ 401 ตั้งแต่ยังไม่ถึงโค้ดนี้)
//
// วิธีใช้ (แอป jjmk-calendar.html แท็บ "📲 เชื่อมมือถือ" สร้าง URL ให้อัตโนมัติ):
//   https://<project>.supabase.co/functions/v1/cal-feed?token=XXXX            → นัดทั้งองค์กร
//   https://<project>.supabase.co/functions/v1/cal-feed?token=XXXX&user=somchai → เฉพาะนัดที่ somchai ต้องเข้า
//   token ดูได้จากผลลัพธ์ตอนรัน jjmk-calendar.sql หรือ: select val->>'token' from cal_settings where id='feed';
//
// รหัสตอบกลับ (ใช้แยกอาการตอนกดปุ่ม "ทดสอบว่าฟีดใช้งานได้" ในแอป):
//   200 = ปกติ · 403 = token ไม่ตรง · 401 = ยังไม่ได้ปิด Verify JWT หรือยังไม่ได้ deploy
// ============================================================

const CORS: Record<string, string> = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Headers': '*',
};

function pad(n: number) { return String(n).padStart(2, '0'); }
// เวลาแบบระบุเวลา → UTC (Z)
function utc(d: string | Date) {
  const x = new Date(d);
  return `${x.getUTCFullYear()}${pad(x.getUTCMonth() + 1)}${pad(x.getUTCDate())}T${pad(x.getUTCHours())}${pad(x.getUTCMinutes())}00Z`;
}
// นัดทั้งวัน → วันที่ตามเวลาไทย (UTC+7 คงที่ ไทยไม่มี DST)
function bkkDate(d: string | Date, addDays = 0) {
  const x = new Date(new Date(d).getTime() + (7 * 3600 + addDays * 86400) * 1000);
  return `${x.getUTCFullYear()}${pad(x.getUTCMonth() + 1)}${pad(x.getUTCDate())}`;
}
function esc(s: unknown) {
  return String(s ?? '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}
// RFC 5545: บรรทัดยาวเกิน 75 ไบต์ต้องพับ (fold) ต่อบรรทัดขึ้นต้นด้วยช่องว่าง
// นับเป็น "ไบต์" ไม่ใช่จำนวนตัวอักษร — ภาษาไทย 1 ตัว = 3 ไบต์ และเดินทีละตัวอักษรจริง
// ด้วย for...of เพื่อไม่ให้หั่นกลางอีโมจิ (ของเดิมหั่นทีละ 73 ตัว ทำให้อีโมจิพังและบรรทัดยาวเกินมาตรฐาน)
function fold(line: string) {
  const enc = new TextEncoder();
  const out: string[] = [];
  let cur = '', bytes = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (bytes + b > 74) { out.push(cur); cur = ' '; bytes = 1; }   // บรรทัดต่อเริ่มด้วยช่องว่าง 1 ไบต์
    cur += ch; bytes += b;
  }
  out.push(cur);
  return out.join('\r\n');
}

type Attendee = { username: string; display_name?: string };

// อ่านข้อมูลจาก Supabase — ลองคีย์ service role ก่อน ถ้าใช้ไม่ได้ค่อยลอง anon
// (ตาราง cal_* เปิดสิทธิ์อ่านให้ anon อยู่แล้วตาม jjmk-calendar.sql จึงทำงานได้ทั้งสองแบบ)
async function sbGet(path: string) {
  const SB = Deno.env.get('SUPABASE_URL') || '';
  const keys = [
    ['service_role', Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')],
    ['anon', Deno.env.get('SUPABASE_ANON_KEY')],
  ].filter(([, k]) => !!k) as [string, string][];
  if (!keys.length) throw new Error('Edge Function ไม่มีคีย์ของโปรเจกต์ (SUPABASE_SERVICE_ROLE_KEY / SUPABASE_ANON_KEY)');
  let last = '';
  for (const [name, k] of keys) {
    const r = await fetch(SB + path, { headers: { apikey: k, Authorization: 'Bearer ' + k } });
    if (r.ok) return await r.json();
    last = `คีย์ ${name} อ่านไม่ได้ (HTTP ${r.status}: ${(await r.text()).slice(0, 160)})`;
  }
  throw new Error(last);
}

async function handle(req: Request) {
  if (req.method === 'OPTIONS') return new Response('ok', { headers: CORS });
  const url = new URL(req.url);
  const token = url.searchParams.get('token') || '';
  const user = (url.searchParams.get('user') || '').trim();

  const SB = Deno.env.get('SUPABASE_URL') || '';
  if (!SB) throw new Error('ไม่พบ SUPABASE_URL ใน Edge Function');

  // ตรวจ token กับ cal_settings (id='feed') — ไม่ตรงตอบ 403 เพื่อให้แยกจาก 401 ของ Verify JWT ได้
  const st = await sbGet('/rest/v1/cal_settings?id=eq.feed&select=val');
  const good = st?.[0]?.val?.token;
  if (!good) {
    throw new Error('ตาราง cal_settings ไม่มีแถว id=feed — รัน jjmk-calendar.sql ใน SQL Editor ก่อน');
  }
  if (token !== good) {
    return new Response('token ไม่ถูกต้อง — คัดลอก URL จากแท็บ "เชื่อมมือถือ" ในแอปใหม่อีกครั้ง', { status: 403, headers: CORS });
  }

  // ดึงนัดย้อนหลัง 60 วัน + อนาคตทั้งหมด (ที่ไม่ถูกยกเลิก)
  const since = new Date(Date.now() - 60 * 86400 * 1000).toISOString();
  const evs = await sbGet(
    `/rest/v1/cal_events?select=*,cal_attendees(username,display_name)` +
    `&cancelled=eq.false&start_at=gte.${encodeURIComponent(since)}&order=start_at.asc&limit=2000`,
  );
  if (!Array.isArray(evs)) throw new Error('อ่านตาราง cal_events ไม่ได้ (ผลลัพธ์ไม่ใช่รายการ)');

  const list = user
    ? evs.filter((e) => e.created_by === user || (e.cal_attendees || []).some((a: Attendee) => a.username === user))
    : evs;

  const calName = user ? `นัด ${user} · จริงใจหมูกระทะ` : 'นัดองค์กร · จริงใจหมูกระทะ';
  const L: string[] = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//JJ-PnL//JJ Calendar//TH',
    'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    fold('X-WR-CALNAME:' + esc(calName)),
    'X-WR-TIMEZONE:Asia/Bangkok',
    'REFRESH-INTERVAL;VALUE=DURATION:PT1H', 'X-PUBLISHED-TTL:PT1H',
  ];
  for (const e of list) {
    L.push('BEGIN:VEVENT', 'UID:' + e.id + '@jj-pnl', 'DTSTAMP:' + utc(e.updated_at || e.created_at));
    if (e.all_day) {
      // DTEND ของนัดทั้งวันเป็นแบบ exclusive → +1 วันจากวันสุดท้าย
      L.push('DTSTART;VALUE=DATE:' + bkkDate(e.start_at), 'DTEND;VALUE=DATE:' + bkkDate(e.end_at, 1));
    } else {
      L.push('DTSTART:' + utc(e.start_at), 'DTEND:' + utc(e.end_at));
    }
    L.push(fold('SUMMARY:' + esc(e.title)));
    const loc = [e.branch === 'ALL' ? '' : e.branch, e.location].filter(Boolean).join(' · ');
    if (loc) L.push(fold('LOCATION:' + esc(loc)));
    const who = (e.cal_attendees || []).map((a: Attendee) => a.display_name || a.username).join(', ');
    const desc = [e.detail, who ? 'ผู้เข้าร่วม: ' + who : '', 'สร้างโดย ' + (e.created_name || e.created_by)]
      .filter(Boolean).join('\n');
    L.push(fold('DESCRIPTION:' + esc(desc)));
    if (e.reminder_min > 0) {
      L.push('BEGIN:VALARM', 'ACTION:DISPLAY', fold('DESCRIPTION:' + esc(e.title)), `TRIGGER:-PT${e.reminder_min}M`, 'END:VALARM');
    }
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');

  return new Response(L.join('\r\n') + '\r\n', {
    headers: {
      ...CORS,
      'Content-Type': 'text/calendar; charset=utf-8',
      'Content-Disposition': 'inline; filename="jj-calendar.ics"',
      'Cache-Control': 'public, max-age=900',
    },
  });
}

Deno.serve(async (req) => {
  try {
    return await handle(req);
  } catch (err) {
    // ตอบสาเหตุจริงกลับไปเป็นข้อความ เพื่อให้ปุ่มทดสอบในแอปบอกได้ว่าติดตรงไหน
    const msg = err instanceof Error ? err.message : String(err);
    return new Response('cal-feed ผิดพลาด: ' + msg, { status: 500, headers: CORS });
  }
});
</script>

const CONFIG = {

const TH_MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

const BR_C={ALL:'#B08BE0',JJLP:'#FFC643',JJRD:'#FF6B6B',JJCK:'#2FE08A',OFFICE:'#58B0FF'};
const REM_OPTS=[[0,'ไม่เตือน'],[15,'15 นาที'],[30,'30 นาที'],[60,'1 ชั่วโมง'],[120,'2 ชั่วโมง'],[1440,'1 วัน']];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',3200)}

function thDate(d,short){const x=new Date(d);return (short?TH_DS[x.getDay()]+'. ':'วัน'+TH_D[x.getDay()]+'ที่ ')+x.getDate()+' '+(short?TH_MS[x.getMonth()]:TH_M[x.getMonth()])+' '+(x.getFullYear()+543)}
function thTime(d){const x=new Date(d);return pad(x.getHours())+':'+pad(x.getMinutes())}
function brLabel(c){if(c==='ALL')return 'ทุกสาขา';const b=allBranches().find(x=>x.code===c);return b?b.name:(c||'')}

function att(e){return e.cal_attendees||[]}
function byId(id){return S.events.find(e=>e.id===id)}

   ⚠️ ข้อมูลยังอ่านได้ด้วยคีย์สาธารณะ (ข้อจำกัดของทั้งระบบ) — นี่คือการจำกัดในแอพ แบบเดียวกับระบบเงินเดือน */
const ALL_BR=['JJLP','JJRD','JJCK','OFFICE'];

function applyUser(u){
  SCOPE=null;
  if(!u||u.role==='admin'||u.role==='owner')return;
  const apps=(u.apps&&typeof u.apps==='object')?u.apps:null;
  if(!apps||!Object.keys(apps).length)return;   // ยังไม่เคยตั้งสิทธิ์ = ไม่จำกัด
  const a=(apps.calendar&&typeof apps.calendar==='object')?apps.calendar:{};
  const br=String(a._br||'').split(',').map(x=>x.trim()).filter(x=>ALL_BR.includes(x));
  if(br.length)SCOPE=br;
}
function inScope(c){return !SCOPE||c==='ALL'||SCOPE.includes(c)}
function myBranches(){return allBranches().filter(b=>!SCOPE||SCOPE.includes(b.code))}   // อย่ากรอง allBranches() เอง — brLabel ใช้ตั้งชื่อทุกสาขา
function brHome(){const my=myBranches();return SCOPE&&my.length===1?my[0].code:'ALL'}       // เห็นสาขาเดียว = ล็อกปุ่มสาขาไว้ที่สาขานั้น
function brOk(c){return c==='ALL'?brHome()==='ALL':myBranches().some(b=>b.code===c)}       // ปุ่มสาขาที่กดได้
function nameOf(u){const x=S.users.find(r=>r.username===u);return x?(x.display_name||u):u}

/* ---------- REST ---------- */
async function api(method,path,body,prefer){
  const {url,key}=cfg();
  const r=await fetch(url+'/rest/v1/'+path,{method,
    headers:{'Content-Type':'application/json',apikey:key,Authorization:'Bearer '+key,
      ...(prefer?{Prefer:prefer}:{})},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(await r.text());
  const tx=await r.text(); return tx?JSON.parse(tx):null;
}
const sel=(t,q)=>api('GET',t+'?'+q);

/* ---------- login (บัญชีเดียวกับ P&L: ตาราง pnl_users) ---------- */
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const enc=new TextEncoder().encode(str);
  const l=enc.length,bitLen=l*8,withOne=l+1,total=(Math.ceil((withOne+8)/64))*64;
  const M=new Uint8Array(total);M.set(enc);M[l]=0x80;
  const dv=new DataView(M.buffer);
  dv.setUint32(total-4,bitLen>>>0);dv.setUint32(total-8,Math.floor(bitLen/4294967296));
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));const w=new Array(64);
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3),s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[t]+w[t])>>>0,S0=rr(a,2)^rr(a,13)^rr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function pwHash(u,p){return sha256hex(u+'|'+p+'|JJPNL')}
async function doLogin(){
  const u=$('#liUser').value.trim(),p=$('#liPass').value;
  if(!u||!p){toast('กรอกให้ครบก่อนครับ',true);return}
  try{
    const rows=await sel('pnl_users',`select=id,username,display_name,role,active,pass_hash,apps&username=eq.${encodeURIComponent(u)}&limit=1`);
    const usr=rows&&rows[0];
    if(!usr||usr.pass_hash!==pwHash(u,p)){toast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',true);return}
    if(!usr.active){toast('บัญชีนี้ถูกปิดการใช้งาน',true);return}
    JJGate.grant(usr.username);
    S.user={username:usr.username,display_name:usr.display_name,role:usr.role,apps:usr.apps||null};   // apps = สิทธิ์รายแอพ (_br = สาขาที่เห็น)
    LS.set('jjcal_sess',S.user);
    startApp();
  }catch(e){toast('เชื่อมต่อไม่ได้ — ตรวจว่ารัน jjmk-calendar.sql หรือยัง',true);console.error(e)}
}
function logout(){localStorage.removeItem('jjcal_sess');location.reload()}
/* โหลดหน้าใหม่แบบข้ามแคช — ดึงหน้าลงบนมือถือบางทียังได้ไฟล์เก่า */
function hardReload(){location.replace(location.pathname+'?v='+Date.now())}

/* ---------- โหลดข้อมูล ---------- */
async function loadBranches(){
  try{
    const rows=await sel('pnl_branches','select=*');
    const bs=(rows||[]).map(r=>({code:r.code||r.id,name:r.name||r.display_name||r.code})).filter(b=>b.code);
    if(bs.length)S.branches=bs;
  }catch(e){}
  if(!brOk(S.br))S.br=brHome();   // ค่าเก่า/เสีย/สาขาที่ไม่มีสิทธิ์ → ทุกที่ (ที่ดูแล) · เห็นสาขาเดียว = สาขานั้น
  renderSeg();
}
function renderSeg(){
  $('#brSeg').innerHTML=[brHome()==='ALL'?`<button data-br="ALL" ${S.br==='ALL'?'class="on"':''}>${SCOPE?'ทุกสาขาที่ดูแล':'ทุกที่'}</button>`:'',
    ...myBranches().map(b=>`<button data-br="${esc(b.code)}" ${S.br===b.code?'class="on"':''}>${esc(String(b.name).replace('สาขา',''))}</button>`)].join('');
}
async function loadUsers(){
  try{S.users=await sel('pnl_users','select=username,display_name,role,unit&active=eq.true&order=display_name.asc')||[]}
  catch(e){
    try{S.users=await sel('pnl_users','select=username,display_name,role&active=eq.true&order=display_name.asc')||[]}  // repo ที่ยังไม่มีคอลัมน์ unit
    catch(e2){S.users=[]}
  }
}
async function loadToken(){
  if(S.feedToken)return S.feedToken;
  try{const rows=await sel('cal_settings','select=val&id=eq.feed');S.feedToken=(rows&&rows[0]&&rows[0].val&&rows[0].val.token)||''}
  catch(e){S.feedToken=''}
  return S.feedToken;
}
async function loadEvents(force){
  if(S.loaded&&!force)return S.events;
  const since=new Date(Date.now()-400*86400000).toISOString();
  const rows=await sel('cal_events',`select=*,cal_attendees(username,display_name)&cancelled=eq.false&start_at=gte.${encodeURIComponent(since)}&order=start_at.asc&limit=2000`);
  /* เห็นเฉพาะสาขาที่ดูแล + นัดส่วนกลาง + นัดของตัวเอง — กรองที่นี่ที่เดียว (เดือน/รายการ/วัน/.ics/เตือน/เรียลไทม์ ได้ตามกันหมด) */
  S.events=(rows||[]).filter(e=>inScope(e.branch)||isMine(e));S.loaded=true;
  return S.events;
}
function filtered(){
  let out=S.events;
  /* นัดสาขาอื่นที่ตัวเองถูกเชิญ (มีใน S.events ก็เพราะเป็นนัดของตัวเอง) โชว์เสมอ — คนที่ล็อกไว้สาขาเดียวจะได้ไม่พลาด */
  if(S.br!=='ALL')out=out.filter(e=>e.branch===S.br||e.branch==='ALL'||!inScope(e.branch));
  if(S.mine)out=out.filter(e=>isMine(e));
  if(S.who)out=out.filter(e=>e.created_by===S.who||att(e).some(a=>a.username===S.who));
  if(S.q){
    const q=S.q.trim().toLowerCase();
    out=out.filter(e=>[e.title,e.location,e.detail,brLabel(e.branch),e.created_name,e.created_by]
      .concat(att(e).map(a=>a.display_name||a.username))
      .some(x=>String(x||'').toLowerCase().includes(q)));
  }
  return out;
}
function filterOn(){return !!(S.q||S.who||S.mine||S.br!==brHome())}
function filterBar(){
  const opts=['<option value="">👥 ทุกคน</option>'].concat(
    S.users.map(u=>`<option value="${esc(u.username)}" ${S.who===u.username?'selected':''}>${esc(u.display_name||u.username)}${u.unit&&UNIT_TH[u.unit]?' · '+esc(UNIT_TH[u.unit]):''}</option>`)).join('');
  const n=filtered().length;
  return `<div class="fbar">
    <input id="fq" placeholder="🔎 ค้นหาหัวข้อ / สถานที่ / ชื่อคน…" value="${esc(S.q)}" oninput="fQ(this.value)">
    <select id="fwho" onchange="fWho(this.value)">${opts}</select>
    ${filterOn()?`<button class="btn gh sm" onclick="fClear()">✖ ล้างตัวกรอง</button><span class="fcount">ตรงกับตัวกรอง ${n} นัด</span>`:''}
  </div>`;
}
let _fqT=null;
function fQ(v){
  S.q=v;fSave();clearTimeout(_fqT);
  _fqT=setTimeout(()=>{show(S.tab);const el=$('#fq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},280);
}
function fWho(v){S.who=v;fSave();show(S.tab)}
function fClear(){
  S.q='';S.who='';S.mine=false;S.br=brHome();   // เห็นสาขาเดียว = กลับไปสาขานั้น (ไม่มี "ทุกที่")
  localStorage.setItem('jjcal_br',S.br);LS.set('jjcal_mine',false);
  const mb=$('#mineBtn');if(mb)mb.classList.remove('on');
  renderSeg();fSave();show(S.tab);
}
function fSave(){try{sessionStorage.setItem('jjcal_filter',JSON.stringify({q:S.q,who:S.who}))}catch(e){}}
function fLoad(){try{const v=JSON.parse(sessionStorage.getItem('jjcal_filter')||'{}');S.q=v.q||'';S.who=v.who||''}catch(e){}}
function evDays(e){ // รายการวันที่นัดนี้กินถึง (กันเหตุ end ก่อน start ด้วย)
  const out=[];let d=dstart(new Date(e.start_at));
  let last=dstart(new Date(e.end_at));if(last<d)last=d;
  while(d<=last&&out.length<62){out.push(dkey(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)}
  return out;
}
function evWhen(e){
  const s=new Date(e.start_at),en=new Date(e.end_at);
  if(e.all_day)return dkey(s)===dkey(en)?'ทั้งวัน':'ทั้งวัน · ถึง'+thDate(en,true);
  if(dkey(s)===dkey(en))return thTime(s)+'–'+thTime(en)+' น.';
  return thTime(s)+' น. · ถึง'+thDate(en,true)+' '+thTime(en)+' น.';
}

/* ---------- nav ---------- */
function toggleMine(){S.mine=!S.mine;LS.set('jjcal_mine',S.mine);$('#mineBtn').classList.toggle('on',S.mine);show(S.tab)}
async function show(v){
  S.tab=v; LS.set('jjcal_tab',v);   // จำหน้าที่เปิดอยู่ — รีเฟรชแล้วกลับมาหน้าเดิม
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='view-'+v));
  $('#fab').style.display=(v==='sync'||v==='days')?'none':'flex';
  const el=$('#view-'+v);
  try{
    if(v==='month')vMonth(el);
    else if(v==='agenda')vAgenda(el);
    else if(v==='days')vDays(el);
    else if(v==='sync')await vSync(el);
  }catch(e){el.innerHTML='<div class="empty">โหลดไม่ได้: '+esc(e.message)+'<br><span class="xs">ถ้ายังไม่ได้ติดตั้ง ให้รัน jjmk-calendar.sql ใน Supabase ก่อนครับ</span></div>';console.error(e)}
}
document.addEventListener('click',e=>{
  const ev=e.target.closest('[data-ev]');
  if(ev){openEv(ev.dataset.ev);return}
  const nv=e.target.closest('[data-nav]');
  if(nv){
    const n=+nv.dataset.nav;
    S.cur=n===0?new Date():new Date(S.cur.getFullYear(),S.cur.getMonth()+n,1);
    vMonth($('#view-month'));return;
  }
  const dy=e.target.closest('[data-day]');
  if(dy){openDay(dy.dataset.day);return}
  const tb=e.target.closest('[data-v]');
  if(tb){show(tb.dataset.v);return}
  const br=e.target.closest('[data-br]');
  if(br){if(!brOk(br.dataset.br))return;S.br=br.dataset.br;localStorage.setItem('jjcal_br',S.br);renderSeg();show(S.tab)}
});

/* ---------- มุมมองเดือน ---------- */
function vMonth(el){
  const y=S.cur.getFullYear(),m=S.cur.getMonth();
  const startDow=new Date(y,m,1).getDay();
  const gridStart=new Date(y,m,1-startDow);
  const todayKey=dkey(new Date());
  const map={};
  filtered().forEach(e=>evDays(e).forEach(k=>{(map[k]=map[k]||[]).push(e)}));
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i);
    const k=dkey(d),evs=map[k]||[],out=d.getMonth()!==m;
    const sds=sdOn(k), sdHas=kk=>sds.some(x=>sdKind(x)===kk);
    const sdOff=sdHas('office'), sdPay=sdHas('pay'), sdOrd=sdHas('order');
    const sdIc=(sdOff?'🏢':'')+(sdPay?'💰':'')+(sdOrd?'📦':'')||'🎌';
    const sdStrip=sds.length?`<div class="spd" title="${esc(sds.map(x=>(sdKind(x)?SD_K[sdKind(x)].ic+' ':'')+x.name).join(' · '))}"><span class="ic">${sdIc}</span><span class="tx">${esc(sds[0].name)}${sds.length>1?' +'+(sds.length-1):''}</span></div>`:'';
    const chips=evs.slice(0,3).map(e=>{
      const c=brColor(e.branch);
      return `<div class="mev" data-ev="${e.id}" style="background:${c}22;color:${c};border:1px solid ${c}44">${e.all_day?'':thTime(e.start_at)+' '}${esc(e.title)}</div>`;
    }).join('')+(evs.length>3?`<div class="mmore">+${evs.length-3} รายการ</div>`:'');
    cells+=`<div class="mcell${out?' out':''}${k===todayKey?' today':''}${sdOrd?' spd-ord':''}${sdOff?' spd-off':''}${sdPay?' spd-pay':''}" data-day="${k}"><span class="dnum">${d.getDate()}</span>${sdStrip}${chips}</div>`;
  }
  const todayEvs=(map[todayKey]||[]);
  const bar=todayEvs.length?`<div class="todaybar">📌 <b>วันนี้มีนัด ${todayEvs.length} รายการ</b>${todayEvs.map(e=>`<span class="tchip" data-ev="${e.id}">${e.all_day?'ทั้งวัน':thTime(e.start_at)} · ${esc(e.title)}</span>`).join('')}</div>`:'';
  el.innerHTML=`${bar}${filterBar()}<div class="card">
    <div class="mnav">
      <button class="nv" data-nav="-1">‹</button>
      <h2>${TH_M[m]} ${y+543}</h2>
      <button class="nv" data-nav="1">›</button>
      <button class="btn gh sm" data-nav="0">วันนี้</button>
      <span style="flex:1"></span>
      <button class="btn sm" onclick="openEventForm()">➕ สร้างนัดใหม่</button>
    </div>
    ${sdLegend()}
    <div class="dow"><span class="sun">อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span></div>
    <div class="mgrid">${cells}</div>
  </div>
  <p class="xs mut" style="text-align:center">แตะวันเพื่อดูนัดของวันนั้น / เพิ่มนัด · แตะแถบนัดเพื่อดูรายละเอียด</p>`;
}

function openDay(k){
  const evs=filtered().filter(e=>evDays(e).includes(k)).sort((a,b)=>(a.all_day?-1:1)-(b.all_day?-1:1)||new Date(a.start_at)-new Date(b.start_at));
  const d=new Date(k+'T00:00:00');
  const sds=sdOn(k);
  openModal(`<h3>📅 ${thDate(d)} ${d.getFullYear()+543===new Date().getFullYear()+543&&dkey(d)===dkey(new Date())?'<span class="chip" style="color:var(--red)">วันนี้</span>':''}</h3>
    ${sds.map(x=>sdCard(x,true)).join('')}
    ${evs.length?evs.map(e=>{
      const c=brColor(e.branch);
      return `<div class="acard" data-ev="${e.id}" style="margin-bottom:8px">
        <div class="atime" style="color:${c}">${e.all_day?'ทั้งวัน':thTime(e.start_at)}<span class="xs">${e.all_day?'':'ถึง '+thTime(e.end_at)}</span></div>
        <div class="abody"><div class="t">${esc(e.title)}</div>
          <div class="meta"><span class="chip" style="color:${c};border-color:${c}55">${esc(brLabel(e.branch))}</span>${e.location?`<span>📍 ${esc(e.location)}</span>`:''}<span>👥 ${att(e).length} คน</span></div>
        </div></div>`;
    }).join(''):'<div class="empty">วันนี้ยังไม่มีนัด</div>'}
    <div class="acts"><button class="btn" onclick="closeModal();openEventForm(null,'${k}')">➕ เพิ่มนัดวันนี้</button>
    <button class="btn gh" onclick="closeModal()">ปิด</button></div>
    ${isBoss()&&S.daysReady&&S.sdKindCol?`<div class="xs mut" style="margin:12px 0 6px">🎌 ใส่วันนี้ลงปฏิทิน</div>
      <div class="acts" style="margin-top:0">${SD_KINDS.map(kk=>`<button class="btn dk sm" onclick="closeModal();openDayForm(null,'${k}','${kk}')">${SD_K[kk].ic} ${SD_K[kk].t}</button>`).join('')}</div>`:''}`);
}

/* ---------- มุมมองรายการนัด ---------- */
function vAgenda(el){
  const t0=dstart(new Date()).getTime();
  const ups=filtered().filter(e=>{let en=dstart(new Date(e.end_at));const st=dstart(new Date(e.start_at));if(en<st)en=st;return en.getTime()>=t0});
  if(!ups.length){
    el.innerHTML=filterBar()+sdAgenda()+'<div class="empty">'+(filterOn()?'ไม่มีนัดที่ตรงกับตัวกรอง<br><br><button class="btn gh" onclick="fClear()">✖ ล้างตัวกรอง</button>':'ยังไม่มีนัดที่จะถึง<br><br><button class="btn" onclick="openEventForm()">➕ สร้างนัดใหม่</button>')+'</div>';
    return;
  }
  const groups={};
  ups.forEach(e=>{
    const st=dstart(new Date(e.start_at));
    const k=st.getTime()<t0?dkey(new Date()):dkey(st); // นัดที่เริ่มไปแล้วแต่ยังไม่จบ → โชว์ในวันนี้
    (groups[k]=groups[k]||[]).push(e);
  });
  const todayKey=dkey(new Date());
  el.innerHTML=filterBar()+sdAgenda()+Object.keys(groups).sort().map(k=>{
    const d=new Date(k+'T00:00:00');
    return `<div class="agrp${k===todayKey?' today':''}">${k===todayKey?'📌 วันนี้ · ':''}${thDate(d)}</div>`+
      groups[k].sort((a,b)=>new Date(a.start_at)-new Date(b.start_at)).map(e=>{
        const c=brColor(e.branch);
        const names=att(e).map(a=>a.display_name||a.username);
        return `<div class="acard" data-ev="${e.id}">
          <div class="atime" style="color:${c}">${e.all_day?'ทั้งวัน':thTime(e.start_at)}<span class="xs">${e.all_day?'':'ถึง '+thTime(e.end_at)}</span></div>
          <div class="abody">

function attAll(v){
  document.querySelectorAll('.attck').forEach(c=>{if(c.closest('label').style.display!=='none')c.checked=!!v});
  attCount();
}
function attUnit(el){
  document.querySelectorAll('#attChips .chip').forEach(c=>c.classList.toggle('on',c===el));
  attApply();
}
function attApply(){   // กรองพร้อมกันทั้งสังกัดที่เลือกไว้และคำค้น
  const qEl=document.getElementById('attQ');
  const q=(qEl?qEl.value:'').trim().toLowerCase();
  const chip=document.querySelector('#attChips .chip.on');
  const unit=chip?chip.dataset.unit:'';
  document.querySelectorAll('#attGrid label').forEach(l=>{
    const okU=!unit||l.dataset.unit===unit;
    const okQ=!q||l.textContent.toLowerCase().includes(q);
    l.style.display=(okU&&okQ)?'':'none';
  });
}
function attCount(){
  const el=document.getElementById('attCount');if(!el)return;
  el.textContent='เลือกแล้ว '+[...document.querySelectorAll('.attck')].filter(c=>c.checked).length+' คน';
}
async function saveEvent(id){
  /* กันที่ปลายทาง: แก้ได้เฉพาะนัดที่มีสิทธิ์ · สาขาของนัดต้องอยู่ในสาขาที่ดูแล (ค่าที่แอบเปลี่ยนในฟอร์มก็ไม่ผ่าน) */
  const brV=$('#fBr').value, old=id?byId(id):null;
  if(id&&(!old||!canEdit(old))){toast('แก้ได้เฉพาะผู้สร้างนัดหรือ admin ครับ',true);return}
  if(SCOPE&&!(brV==='ALL'?(old&&old.branch==='ALL'):myBranches().some(b=>b.code===brV))){
    toast('บัญชีนี้ลงนัดได้เฉพาะสาขาที่ดูแล ('+SCOPE.join(', ')+')',true);return}
  const title=$('#fTitle').value.trim();
  if(!title){toast('ใส่หัวข้อนัดก่อนครับ',true);return}
  const d1=$('#fDate').value;
  if(!d1){toast('เลือกวันที่ก่อนครับ',true);return}
  let d2=$('#fDateEnd').value||d1; if(d2<d1)d2=d1;
  const allDay=$('#fAllDay').checked;
  let start,end;
  if(allDay){start=new Date(d1+'T00:00:00');end=new Date(d2+'T00:00:00')}
  else{
    const t1=$('#fT1').value||'10:00';let t2=$('#fT2').value||'';
    start=new Date(d1+'T'+t1);
    end=t2?new Date(d2+'T'+t2):new Date(start.getTime()+3600000);
    if(end<=start)end=new Date(start.getTime()+3600000);
  }
  const picks=[...document.querySelectorAll('.attck')].filter(c=>c.checked).map(c=>c.value);
  if(!picks.includes(S.user.username))picks.push(S.user.username);
  const body={title,detail:$('#fDetail').value.trim()||null,branch:brV,
    location:$('#fLoc').value.trim()||null,all_day:allDay,
    start_at:start.toISOString(),end_at:end.toISOString(),
    reminder_min:+$('#fRem').value,updated_by:S.user.username};
  $('#fSave').disabled=true;
  try{
    let evId=id;
    if(id){
      await api('PATCH',`cal_events?id=eq.${id}`,body);
      await api('DELETE',`cal_attendees?event_id=eq.${id}`);
    }else{
      body.created_by=S.user.username;body.created_name=S.user.display_name;
      const r=await api('POST','cal_events',body,'return=representation');
      evId=r[0].id;
    }
    const rows=picks.map(u=>({event_id:evId,username:u,display_name:u===S.user.username?S.user.display_name:nameOf(u)}));
    if(rows.length)await api('POST','cal_attendees',rows);
    toast(id?'แก้ไขนัดแล้ว ✅':'สร้างนัดแล้ว ✅ — ผู้เข้าร่วมกดเพิ่มลงมือถือได้จากหน้านัด');
    closeModal();
    await loadEvents(true);show(S.tab);
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message,true);console.error(e)}
  finally{const b=$('#fSave');if(b)b.disabled=false}
}
async function cancelEv(id){
  const e=byId(id);if(!e)return;
  if(!canEdit(e)){toast('ยกเลิกได้เฉพาะผู้สร้างนัดหรือ admin ครับ',true);return}
  if(!confirm('ยกเลิกนัด "'+e.title+'" ใช่ไหม? นัดจะหายจากปฏิทินทุกคน (รวมถึงมือถือที่ subscribe ไว้)'))return;
  try{
    await api('PATCH',`cal_events?id=eq.${id}`,{cancelled:true,updated_by:S.user.username});
    toast('ยกเลิกนัดแล้ว');closeModal();
    await loadEvents(true);show(S.tab);
  }catch(err){toast('ยกเลิกไม่สำเร็จ: '+err.message,true)}
}

/* ---------- ICS / Google Calendar ---------- */
function icsEsc(s){return String(s??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsUtc(d){const x=new Date(d);return x.getUTCFullYear()+pad(x.getUTCMonth()+1)+pad(x.getUTCDate())+'T'+pad(x.getUTCHours())+pad(x.getUTCMinutes())+'00Z'}
function icsDate(d,addDays){const x=new Date(d);if(addDays)x.setDate(x.getDate()+addDays);return ''+x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())}
function icsForEvent(e){
  const names=att(e).map(a=>a.display_name||a.username).join(', ');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//JJ-PnL//JJ Calendar//TH','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT','UID:'+e.id+'@jj-pnl','DTSTAMP:'+icsUtc(new Date())];
  if(e.all_day)L.push('DTSTART;VALUE=DATE:'+icsDate(e.start_at),'DTEND;VALUE=DATE:'+icsDate(e.end_at,1));
  else L.push('DTSTART:'+icsUtc(e.start_at),'DTEND:'+icsUtc(e.end_at));
  L.push('SUMMARY:'+icsEsc(e.title));
  const loc=[e.branch==='ALL'?'':brLabel(e.branch),e.location].filter(Boolean).join(' · ');
  if(loc)L.push('LOCATION:'+icsEsc(loc));
  L.push('DESCRIPTION:'+icsEsc([e.detail,names?'ผู้เข้าร่วม: '+names:'','สร้างโดย '+(e.created_name||e.created_by)].filter(Boolean).join('\n')));
  if(e.reminder_min>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),'TRIGGER:-PT'+e.reminder_min+'M','END:VALARM');
  L.push('END:VEVENT','END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}
function dlIcs(id){
  const e=byId(id);if(!e)return;
  const blob=new Blob([icsForEvent(e)],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='jj-nud-'+icsDate(e.start_at)+'.ics';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  toast('ดาวน์โหลดไฟล์นัดแล้ว — เปิดไฟล์เพื่อเพิ่มลงปฏิทินมือถือ');
}
function gcalUrl(e){
  const dates=e.all_day?icsDate(e.start_at)+'/'+icsDate(e.end_at,1):icsUtc(e.start_at)+'/'+icsUtc(e.end_at);
  const names=att(e).map(a=>a.display_name||a.username).join(', ');
  const p=new URLSearchParams({action:'TEMPLATE',text:e.title,dates,
    details:[e.detail,names?'ผู้เข้าร่วม: '+names:''].filter(Boolean).join('\n'),
    location:[e.branch==='ALL'?'':brLabel(e.branch),e.location].filter(Boolean).join(' · '),ctz:'Asia/Bangkok'});
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}

function copyFeedCode(){

  const fallback=()=>{ // คัดลอกอัตโนมัติไม่ได้ → เปิดกล่องให้เลือกเองทั้งก้อน (โค้ดยาวเกินใช้ prompt)
    openModal('<h3>📋 โค้ด cal-feed</h3><p class="sm mut" style="margin:0 0 8px">กดในกล่องแล้ว Ctrl+A → Ctrl+C (มือถือ: แตะค้าง → เลือกทั้งหมด → คัดลอก) แล้วเอาไปวางที่ <b>Edge Functions</b> ของ Supabase</p>'+

async function checkFeed(){
  const st=$('#feedStatus');if(!st)return;
  st.innerHTML='⏳ กำลังตรวจสอบระบบ…';st.style.color='var(--mut)';
  const taps=on=>document.querySelectorAll('.tapbtn').forEach(a=>a.classList.toggle('off',!on));
  const set=(h,c)=>{st.innerHTML=h;st.style.color=c;taps(c==='var(--ok)')};
  /* บัญชีที่เห็นเฉพาะสาขา ใช้ได้แค่ฟีด "นัดของฉัน" — ทดสอบด้วย URL นั้น (ไม่โชว์จำนวนนัดทั้งองค์กร) */
  const u=cfg().url+'/functions/v1/cal-feed?token='+encodeURIComponent(S.feedToken)+(SCOPE?'&user='+encodeURIComponent(S.user.username):'');
  let a;
  try{a=await fetch(u)}                       // ยิงแบบเดียวกับที่แอปปฏิทินมือถือยิง (ไม่มี header)
  catch(e){set('❌ ต่อฟีดไม่ได้ — เช็คอินเทอร์เน็ตแล้วลองใหม่','var(--bad)');return}
  if(a.ok){
    const tx=await a.text();
    if(!tx.includes('BEGIN:VCALENDAR')){set('❌ ฟีดตอบกลับไม่ใช่ข้อมูลปฏิทิน — ตรวจโค้ดในฟังก์ชัน cal-feed อีกครั้ง','var(--bad)');return}
    const n=(tx.match(/BEGIN:VEVENT/g)||[]).length;          // นับนัดที่อยู่ในฟีดจริง
    const emo=/[\uD800-\uDFFF]/.test(tx.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g,''));  // อีโมจิถูกหั่นกลางตัวไหม (fold เวอร์ชันเก่า)
    set('✅ <b>ระบบพร้อม</b> · มี'+(SCOPE?'นัดของคุณ':'นัด')+'ในฟีด '+n+' รายการ — แตะปุ่มข้างล่างได้เลย'+
      (emo?'<br><span style="color:var(--gold)">⚠️ เจออีโมจิถูกหั่นกลางตัวในฟีด — โค้ดที่ deploy เป็นเวอร์ชันเก่า กด 📋 คัดลอกโค้ด แล้ววางทับใน Edge Functions</span>':''),'var(--ok)');
    return;
  }
  const body=(await a.text().catch(()=>'')).trim();   // ฟังก์ชันตอบเหตุผลมาเป็นข้อความ — เอามาโชว์เลย
  if(a.status===403){set('❌ token ไม่ตรงกับในฐานข้อมูล — กดรีเฟรชหน้านี้ 1 ครั้ง ถ้ายังไม่หายให้รัน <b>jjmk-calendar.sql</b> ใหม่','var(--bad)');return}
  if(a.status>=500){
    set('⚠️ <b>ปุ่มยังใช้ไม่ได้</b> — ฟีดทำงานแล้วแต่มีข้อผิดพลาด (HTTP '+a.status+')'+(body?'<br>📄 <b>'+esc(body.slice(0,300))+'</b>':'')+
      '<br><span class="xs">ถ้าข้อความไม่ได้บอกสาเหตุ แปลว่าโค้ดที่ deploy เป็นเวอร์ชันเก่า — กด 📋 คัดลอกโค้ด cal-feed แล้ว Deploy ทับ เวอร์ชันใหม่จะบอกเองว่าติดคีย์หรือติดตาราง</span>','var(--bad)');
    return;
  }
  // 401 = ด่านหน้าของ Supabase ปัดตกตั้งแต่ยังไม่ถึงโค้ดเรา — ยิงซ้ำแบบแนบกุญแจเพื่อแยกว่า "ยังไม่ deploy" หรือ "ยังไม่ปิด Verify JWT"
  let b=null;const k=cfg().key;
  try{b=await fetch(u,{headers:{apikey:k,Authorization:'Bearer '+k}})}catch(e){}
  if(b&&(b.ok||b.status===403))
    set('⚠️ deploy <b>cal-feed</b> แล้ว แต่<b>ยังไม่ได้ปิด Verify JWT</b><br>Supabase → Edge Functions → cal-feed → <b>Settings</b> → ปิด <b>Verify JWT</b> → Save แล้วกดทดสอบใหม่','var(--gold)');
  else if(b&&b.status===404)
    set('❌ <b>ยังไม่ได้ deploy ฟังก์ชัน cal-feed</b><br>Supabase → Edge Functions → Deploy a new function → ตั้งชื่อ <b>cal-feed</b> → วางโค้ดที่ได้จากแชท → Deploy → แล้วปิด Verify JWT','var(--bad)');
  else
    set('❌ ฟีดตอบกลับ HTTP '+a.status+' — ตรวจว่ามีฟังก์ชันชื่อ <b>cal-feed</b> และ<b>ปิด Verify JWT</b> แล้ว','var(--bad)');
}
async function notifPerm(){
  if(!('Notification' in window)){toast('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน',true);return}
  const p=await Notification.requestPermission();
  toast(p==='granted'?'เปิดการแจ้งเตือนแล้ว ✅':'ยังไม่ได้รับอนุญาตจากเบราว์เซอร์',p!=='granted');
  if(S.tab==='sync')vSync($('#view-sync'));
}
function notifTick(){
  if(!S.user||!S.events.length)return;
  const now=Date.now();
  const seen=LS.get('jjcal_ntf',{});
  let changed=false;
  S.events.filter(e=>isMine(e)&&!e.all_day&&e.reminder_min>0).forEach(e=>{
    const t=new Date(e.start_at).getTime(),k=e.id+'@'+e.start_at;
    if(now>=t-e.reminder_min*60000&&now<t&&!seen[k]){
      seen[k]=now;changed=true;
      const msg='🔔 อีก '+Math.max(1,Math.round((t-now)/60000))+' นาที: '+e.title+(e.location?' · 📍 '+e.location:'');
      toast(msg);
      if(('Notification' in window)&&Notification.permission==='granted'){
        try{new Notification('JJ Calendar — ใกล้ถึงเวลานัด',{body:e.title+'\n'+thTime(e.start_at)+' น.'+(e.location?' · '+e.location:''),tag:k})}catch(x){}
      }
    }
  });
  if(changed){ // เก็บเฉพาะรายการช่วงหลัง กัน localStorage บวม
    Object.keys(seen).forEach(k=>{if(now-seen[k]>7*86400000)delete seen[k]});
    LS.set('jjcal_ntf',seen);
  }
}

  return thDate(a,true)+' – '+thDate(b,true)+' ('+(sdSpan(x.day_from,x.day_to)+1)+' วัน)';
}
function sdBrText(x){return x.order_branches&&x.order_branches.length?x.order_branches.map(c=>brLabel(c)).join('·'):'ทุกสาขา'}
/* ชั้นที่โชว์ในหน้าเดือน/รายการนัด (ปิดบางปฏิทินได้ — จำไว้ในเครื่อง) */
function sdShown(k){return !S.sdShow||S.sdShow[k]!==false}
function sdLayer(k){S.sdShow=Object.assign({office:true,pay:true,order:true},S.sdShow||{});S.sdShow[k]=!sdShown(k);LS.set('jjcal_sdshow',S.sdShow);show(S.tab)}
/* วันนี้เกี่ยวกับสาขาที่เลือกดูไหม: 🏢 = สาขา OFFICE · 💰 = หน้าร้าน (ทุกสาขายกเว้น OFFICE) · 📦 = สาขาที่เลือกไว้ */
function sdHere(x){
  const k=sdKind(x);
  if(k&&!sdShown(k))return false;
  if(S.br==='ALL'||!k)return true;
  if(k==='office')return S.br==='OFFICE';
  if(k==='pay')return S.br!=='OFFICE';
  return !x.order_branches||x.order_branches.includes(S.br);
}
function sdOn(k){
  return (S.days||[]).filter(x=>!x.cancelled&&x.day_from<=k&&k<=x.day_to&&sdHere(x));
}
async function loadDays(){
  const y=new Date().getFullYear();
  try{
    S.days=await sel('cal_special_days','select=*&cancelled=eq.false&day_to=gte.'+(y-2)+'-01-01&order=day_from.asc&limit=1000')||[];
    S.daysReady=true;
    /* มีช่อง kind ไหม (= รัน SQL รุ่นแยก 3 ปฏิทินแล้ว) · ไม่มีแถวเลยก็ลองอ่านช่องนั้นดู */
    if(S.days.length)S.sdKindCol=('kind' in S.days[0]);
    else{ try{ await sel('cal_special_days','select=kind&limit=1'); S.sdKindCol=true; }catch(e2){ S.sdKindCol=false; } }
  }catch(e){ S.days=[]; S.daysReady=false; }
  /* วันหยุดที่ตั้งไว้ในระบบเงินเดือน (หน้า 🎌) — อ่านอย่างเดียว ไว้โชว์ให้เห็นครบในที่เดียว */
  const q='&day=gte.'+(y-2)+'-01-01&order=day.asc&limit=1000';
  try{ S.holi=await sel('holidays','select=day,name,multiplier,scope,cal_id'+q)||[]; }
  catch(e){ try{ S.holi=await sel('holidays','select=day,name,multiplier,scope'+q)||[]; }
    catch(e2){ try{ S.holi=await sel('holidays','select=day,name,multiplier'+q)||[]; }catch(e3){ S.holi=[]; } } }
  return S.days;
}
function sdStatusChip(x){
  if(x.pay_status==='confirmed')return '<span class="chip okc">✅ ใช้คิดเงินแล้ว</span>';
  if(x.pay_status==='declined')return '<span class="chip">✖ เงินเดือนไม่ใช้</span>';
  return '<span class="chip wait">⏳ รอยืนยันในระบบเงินเดือน</span>';
}
function sdCard(x,inModal){
  const k=sdKind(x), past=x.day_to<dkey(new Date());
  const fx=[];
  if(k==='office')fx.push('<span class="chip off">🏢 สาขา OFFICE หยุด · หน้าร้านทำงานปกติ</span>');
  if(k==='pay')fx.push(`<span class="chip pay">💰 หน้าร้าน ×${+x.pay_multiplier||2} · วันห้ามหยุด</span>`);
  if(k==='order')fx.push(`<span class="chip ord">📦 คิดแบบ ส–อา · ${esc(sdBrText(x))}</span>`);
  if(sdPayEff(x))fx.push(sdStatusChip(x));
  if(!k)fx.push('<span class="chip">ป้ายเดิม — ยังไม่ได้อยู่ปฏิทินไหน</span>');
  const needPay=sdPayEff(x)&&x.pay_status==='pending';
  const mv=!k&&isBoss()&&S.sdKindCol?SD_KINDS.map(kk=>`<button class="btn gh sm" onclick="${inModal?'closeModal();':''}openDayForm('${x.id}',null,'${kk}')">→ ${SD_K[kk].ic} ${SD_K[kk].t}</button>`).join(''):'';
  return `<div class="sdcard ${k?SD_K[k].cls:'leg'}${past&&!inModal?' past':''}">
    <div class="t">${k?SD_K[k].ic:'🎌'} ${esc(x.name)}</div>
    <div class="when">${sdWhen(x)}</div>
    <div class="fx">${fx.join('')}</div>
    ${x.note?`<div class="sdnote">📝 ${esc(x.note)}</div>`:''}
    <div class="acts2">
      ${needPay?`<a class="btn sm" href="jjmk-payroll.html#holi" onclick="try{localStorage.setItem('jjpay_calfocus','${x.id}')}catch(e){}">💰 ไปยืนยันที่ระบบเงินเดือน</a>`:''}
      ${k&&isBoss()?`<button class="btn gh sm" onclick="${inModal?'closeModal();':''}openDayForm('${x.id}')">✏️ แก้ไข</button>`:''}${mv}
      <button class="btn gh sm" onclick="${inModal?'closeModal();':''}sdHistory('${x.id}')">🕘 ประวัติ</button>
    </div></div>`;
}
/* วันพิเศษ 30 วันข้างหน้า — โชว์บนสุดของหน้านัดที่จะถึง (ไม่โดนตัวกรองคำค้น/คน) */
function sdAgenda(){
  const t=dkey(new Date()),e=sdAdd(t,30);
  const xs=(S.days||[]).filter(x=>x.day_to>=t&&x.day_from<=e&&sdOn(x.day_from<t?t:x.day_from).includes(x));
  if(!xs.length)return '';
  return `<div class="agrp">🎌 วันพิเศษใน 30 วันข้างหน้า</div>`+xs.map(x=>sdCard(x,false)).join('');
}
/* ป้ายบอกชั้น + ปุ่มเปิด/ปิดแต่ละปฏิทินในหน้าเดือน */
function sdLegend(){
  if(!S.daysReady||!S.sdKindCol)return '';
  return `<div class="sdleg">${SD_KINDS.map(k=>`<button type="button" class="sdl ${SD_K[k].cls}${sdShown(k)?'':' offl'}" onclick="sdLayer('${k}')" aria-pressed="${sdShown(k)}">${sdShown(k)?'☑':'☐'} ${SD_K[k].ic} ${SD_K[k].t}</button>`).join('')}</div>`;
}

/* ---------- แท็บ 🎌 วันพิเศษ (แยก 3 ปฏิทิน) ---------- */
function sdTab(k){S.sdk=k;LS.set('jjcal_sdk',k);vDays($('#view-days'))}
function vDays(el){
  const y=S.dayYear, t=dkey(new Date()), K=SD_K[S.sdk]?S.sdk:'office', D=SD_K[K];

  const cnt=k=>(S.days||[]).filter(x=>sdKind(x)===k&&inY(x)).length;
  const yOpts=[y-1,y,y+1].map(v=>`<option value="${v}" ${v===y?'selected':''}>ปี ${v+543}</option>`).join('');

    <p class="xs mut" style="margin:0 0 10px;line-height:1.7">ลงที่นี่ที่เดียว แล้วระบบอื่นเอาไปใช้เอง — แยกเป็น 3 ปฏิทิน วันเดียวกันอยู่หลายปฏิทินได้
      · 🏢/💰 มีผลกับเงินเดือนเมื่อกด ✅ ยืนยันในหน้า 🎌 ของระบบเงินเดือนแล้วเท่านั้น</p>
    ${ready?`<div class="sdseg" role="tablist">${SD_KINDS.map(k=>`<button type="button" role="tab" aria-selected="${k===K}" class="${SD_K[k].cls}${k===K?' on':''}" onclick="sdTab('${k}')">${SD_K[k].ic} ${SD_K[k].t}<span class="n">${cnt(k)}</span></button>`).join('')}</div>
    <div class="sdbox ${D.cls}" style="margin:10px 0 0"><div class="sdnote" style="margin:0">${D.ic} <b>${D.tl}</b> — ${D.desc}</div></div>
    ${isBoss()?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button class="btn" style="min-height:44px" onclick="openDayForm(null,null,'${K}')">${D.add}</button>
      <button class="btn dk" style="min-height:44px" onclick="openPresetSheet('${K}')">📋 เลือกจากวันหยุดราชการ</button></div>`
      :'<p class="xs mut" style="margin:8px 0 0">เจ้าของ/ผู้ดูแลระบบเป็นคนลงวันพิเศษ</p>'}`:''}
  </div>`;
  if(!S.daysReady){
    h+=`<div class="empty">${isBoss()?'⚠️ ยังไม่ได้ติดตั้งตารางวันพิเศษ — รัน <b>jjmk-calendar-days.sql</b> ใน Supabase → SQL Editor ก่อนครับ':'ยังไม่เปิดใช้งาน'}</div>`;
    el.innerHTML=h; return;
  }
  if(!S.sdKindCol){
    h+=`<div class="empty">${isBoss()?'⚠️ ต้องรัน <b>jjmk-calendar-days.sql</b> รุ่นล่าสุดใน Supabase → SQL Editor ก่อน (แยกเป็น 3 ปฏิทิน)<br><span class="xs">รายการที่ลงไว้แล้วจะถูกย้ายเข้าปฏิทินให้เอง ไม่มีอะไรหาย</span>':'ยังไม่เปิดใช้งาน'}</div>`;
    el.innerHTML=h; return;
  }
  const rows=(S.days||[]).filter(x=>sdKind(x)===K&&inY(x));
  const up=rows.filter(x=>x.day_to>=t), past=rows.filter(x=>x.day_to<t).reverse();
  /* วันที่ตั้งไว้ในหน้า 🎌 ของเงินเดือนเอง (ไม่ได้มาจากปฏิทินนี้) — โชว์ให้เห็นครบ */
  const covered=d=>(S.days||[]).some(x=>sdKind(x)===K&&x.day_from<=d&&d<=x.day_to);
  const scOk=sc=>sc==='all'||(K==='office'?sc==='office':sc==='store');
  const holiOnly=K==='order'?[]:(S.holi||[]).filter(hh=>{const d=String(hh.day).slice(0,10);
    return d.slice(0,4)===String(y)&&!hh.cal_id&&scOk(hh.scope||'all')&&!covered(d)});
  const legacy=(S.days||[]).filter(x=>!sdKind(x)&&inY(x));
  if(!rows.length&&!holiOnly.length)h+=`<div class="empty">ปี ${y+543} ยังไม่มีวันใน${D.tl}${isBoss()?`<br><br>กด <b>${D.add}</b> หรือ <b>📋 เลือกจากวันหยุดราชการ</b>`:''}</div>`;
  if(up.length)h+=`<div class="agrp">📌 ที่จะถึง (${up.length})</div>`+up.map(x=>sdCard(x,false)).join('');
  if(holiOnly.length)h+=`<div class="agrp" style="color:var(--mut)">💰 ตั้งไว้ในระบบเงินเดือนเอง (${holiOnly.length})</div>`+
    holiOnly.map(hh=>{const sc=hh.scope||'all';
      return `<div class="sdcard pay-only"><div class="t">${esc(hh.name||'วันหยุดพิเศษ')}</div>
      <div class="when">${thDate(new Date(String(hh.day).slice(0,10)+'T12:00:00'))}</div>
      <div class="fx"><span class="chip ${K==='office'?'off':'pay'}">${sc==='office'?'🏢 ออฟฟิศหยุด':sc==='store'?`💰 หน้าร้าน ×${+hh.multiplier||2}`:`👥 ทุกคน — หน้าร้าน ×${+hh.multiplier||2} · ออฟฟิศหยุด`}</span><span class="chip">ตั้งไว้ที่หน้า 🎌 ของระบบเงินเดือน</span></div></div>`}).join('');
  if(past.length)h+=`<div class="agrp" style="color:var(--mut)">ผ่านไปแล้ว (${past.length})</div>`+past.map(x=>sdCard(x,false)).join('');
  if(legacy.length)h+=`<div class="agrp" style="color:var(--mut)">📝 ป้ายเดิม — ยังไม่ได้อยู่ปฏิทินไหน (${legacy.length})</div>`+legacy.map(x=>sdCard(x,false)).join('');
  el.innerHTML=h;
}

/* ---------- ฟอร์มเพิ่ม/แก้วัน (ทีละปฏิทิน) ---------- */
function openDayForm(id,presetDate,kind){
  if(!isBoss()){toast('เจ้าของ/ผู้ดูแลระบบเป็นคนลงวันพิเศษครับ',true);return}
  if(!S.daysReady||!S.sdKindCol){toast('ยังไม่ได้รัน jjmk-calendar-days.sql รุ่นล่าสุด',true);return}
  const x=id?(S.days||[]).find(r=>r.id===id):null;
  if(id&&!x)return;
  const K=sdKind(x)||(SD_K[kind]?kind:null)||(SD_K[S.sdk]?S.sdk:'office'), D=SD_K[K];
  const conv=!!x&&!sdKind(x);                       // ป้ายเดิม → ย้ายเข้าปฏิทินนี้
  const d1=x?x.day_from:(presetDate||dkey(new Date())), d2=x?x.day_to:d1;

    <div class="sdbox ${D.cls}"><div class="sdnote" style="margin:0">${D.desc}</div>
