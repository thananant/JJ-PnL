<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ซ่อมบำรุงสาขา — จริงใจหมูกระทะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--red:#C62127;--red-deep:#611014;--gold:#F1B61C;--gold-line:#C99106;
    --paper:#F6EFE3;--card:#FFF;--ink:#2B1B17;--ink-soft:#8A7565;--line:#E7DAC4;
    --shadow:0 1px 2px rgba(63,8,11,.06),0 6px 18px -8px rgba(63,8,11,.14)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Sarabun',sans-serif;background:var(--paper);color:var(--ink);line-height:1.45}
  header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px;
    background:linear-gradient(170deg,#611014,#3F080B 85%);color:#fbeee0;box-shadow:0 2px 14px rgba(63,8,11,.28)}
  header .hlogo{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--gold-line);flex:none}
  header .htit{font-family:Prompt;font-weight:600;font-size:1.02rem;line-height:1.15}
  header .htit small{display:block;font-family:Sarabun;font-weight:400;font-size:.68rem;opacity:.75}
  header .hsp{flex:1}
  header select{max-width:44vw;padding:7px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);color:#fbeee0;font-family:Prompt;font-weight:600;font-size:.85rem}
  header select option{color:#222;background:#fff}
  header .hbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;
    border-radius:10px;padding:7px 11px;font-family:Sarabun;font-weight:600;font-size:.85rem;cursor:pointer}
  main{max-width:760px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .hint{font-size:.78rem;color:var(--ink-soft)}
  .rempty{text-align:center;color:var(--ink-soft);padding:26px 10px}
  /* ปุ่ม */
  .act{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-family:Prompt;font-weight:600;
    font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);transition:.13s}
  .act:active{transform:scale(.985)}
  .act.send{background:var(--gold);color:var(--red-deep);border-color:var(--gold-line)}
  .act.ghost{background:#fff}
  .act.wide{width:100%}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:.8rem;color:var(--ink-soft);margin-bottom:4px;font-weight:600}
  .field input,.field select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;font-family:Sarabun;font-size:.95rem;background:#fff}
  /* overlay + sheet */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(42,23,19,.55);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
  .overlay.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:18px}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .sheet-head h3{margin:0;font-family:Prompt;font-weight:600;font-size:1.02rem}
  .sheet-head .x{border:none;background:#f4ede0;border-radius:9px;width:32px;height:32px;font-size:1rem;cursor:pointer}
  .sheet-body{padding:14px 16px;overflow-y:auto}
  .sub-title{font-family:Prompt;font-weight:600;font-size:.92rem;margin:14px 0 8px;color:var(--red-deep)}
  /* สรุป + การ์ดงาน */
  .mtsum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .mtsum .mchip{font-family:Prompt;font-weight:600;font-size:.82rem;padding:5px 12px;border-radius:999px;background:#f3ece0;color:#6b5f52}
  .mtsum .mchip.over{background:#fdeaea;color:#c62127}
  .mtsum .mchip.soon{background:#fff6dd;color:#9a6700}
  .mtsum .mchip.ok{background:#e8f7ec;color:#1a7f37}
  .mtcard{border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .mtcard.over{border-left-color:#c62127}.mtcard.soon{border-left-color:#c9a227}.mtcard.ok{border-left-color:#1a7f37}
  .mtrow1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .mtrow1 b{font-family:Prompt;font-weight:600}
  .mtfreq{flex:none;font-size:.75rem;color:#7a6a58;background:#f6efe3;border-radius:999px;padding:3px 10px}
  .mtdetail{font-size:.82rem;color:var(--ink-soft);margin-top:2px}
  .mtstat{font-size:.85rem;font-weight:600;margin-top:6px}
  .mtstat.over{color:#c62127}.mtstat.soon{color:#9a6700}.mtstat.ok{color:#1a7f37}
  .mtlast{font-size:.78rem;color:#8a7f74;margin-top:2px}
  .mtthumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .mtthumbs img{width:64px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:pointer;background:#f4f0e8}
  .mtbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .mtbtns .act{flex:1;min-width:150px}
  .mtlog{border-top:1px dashed rgba(0,0,0,.12);padding:10px 0}
  .mtlog:first-child{border-top:none;padding-top:2px}
  .mmrow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px dashed rgba(0,0,0,.1)}
  .mmrow .mmn{flex:1;min-width:0}
  .mmrow .mmn small{display:block;color:#8a7f74}
  .mmrow button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
  /* login */
  #login{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
    background:linear-gradient(170deg,#611014,#3F080B 85%);padding:20px}
  #login.on{display:flex}
  #login .lcard{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:360px;text-align:center;box-shadow:0 14px 44px -10px rgba(0,0,0,.4)}
  #login .llogo{width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid var(--gold-line);margin-bottom:8px}
  #login h2{margin:0;font-family:Prompt;font-weight:600;font-size:1.15rem;color:var(--red-deep)}
  #login .lsub{font-size:.8rem;color:var(--ink-soft);margin:2px 0 16px}
  #login input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:11px;font-family:Sarabun;font-size:.95rem;margin-bottom:9px;text-align:center}
  #login .lmsg{min-height:18px;font-size:.8rem;color:#c62127;margin:4px 0 8px}
  #login.err .lcard{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  /* toast */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2B1B17;color:#fff;
    padding:11px 18px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;transition:.22s;z-index:500;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header id="hdr" style="display:none">
  <img class="hlogo" id="hLogo" alt="">
  <div class="htit">🛠 ซ่อมบำรุงสาขา<small id="hUser">—</small></div>
  <div class="hsp"></div>
  <select id="hBranch" style="display:none"></select>
  <button class="hbtn" id="hMng" style="display:none">⚙️</button>
  <button class="hbtn" id="hOut">ออก</button>
</header>

<main id="main" style="display:none">
  <div class="card">
    <div class="mtsum" id="mtSum"></div>
    <div id="mtList"><div class="rempty">กำลังโหลด...</div></div>
    <p class="hint" style="margin:10px 0 0">ทำเสร็จแล้วกด “✅ ทำแล้ว” พร้อมถ่ายรูปแนบ · แตะรูปหรือ “🕘 ประวัติ” เพื่อเปิดดูรูปย้อนหลังได้ทุกครั้งที่เคยทำ</p>
  </div>
</main>

<div id="login">
  <div class="lcard">
    <img class="llogo" id="lLogo" alt="">
    <h2>ซ่อมบำรุงสาขา</h2>
    <div class="lsub">จริงใจหมูกระทะ · ตารางบำรุงรักษาประจำสาขา</div>
    <input id="lUser" placeholder="ชื่อผู้ใช้ (username)" autocomplete="username">
    <input id="lPass" type="password" placeholder="รหัสผ่าน (password)" autocomplete="current-password">
    <div class="lmsg" id="lMsg"></div>
    <button class="act send wide" id="lBtn">เข้าสู่ระบบ</button>
    <p class="hint" style="margin:12px 0 0">ใช้บัญชีเดียวกับแอพนับสต๊อก — พนักงานใหม่ให้สมัครที่แอพนับสต๊อกและรอผู้ดูแลอนุมัติก่อน</p>
  </div>
</div>

<div id="toast"></div>

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
function escapeHtml(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2100)}
let uidN=0;const uid=p=>(p||'i')+Date.now().toString(36)+(uidN++);
function todayISO(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function isoFromAny(d){return String(d||'').slice(0,10);}
function fmtDate(d){const s=isoFromAny(d),p=s.split('-');return p.length===3?(p[2]+'/'+p[1]+'/'+(+p[0]+543)):s;}
function addDaysISO(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+(+n||0));const p=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function diffDaysISO(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function processImage(file,cb){const reader=new FileReader();
  reader.onload=()=>{const im=new Image();
    im.onload=()=>{let w=im.width,h=im.height;const sc=Math.min(1,1280/Math.max(w,h));
      w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0,w,h);
      try{cb(cv.toDataURL('image/jpeg',.78))}catch(e){cb(null)}};
    im.onerror=()=>cb(null);im.src=reader.result};
  reader.onerror=()=>cb(null);reader.readAsDataURL(file)}

/* ================= login (บัญชีชุดเดียวกับแอพนับสต๊อก) ================= */
let PROF=null,BRANCHES=[],CUR_B=null;
const isAdmin=()=>!!(PROF&&(PROF.role==='admin'||PROF.role==='owner'));
const CLOCK_SKEW=e=>{const c=(e&&e.code)||'',m=(e&&e.message)||String(e||'');return c==='PGRST303'||/issued at future/i.test(m);};
async function getProfile(onWait){
  const g=await sb.auth.getUser();const user=g&&g.data&&g.data.user;
  if(!user)return null;
  for(let i=0;i<8;i++){
    const {data,error}=await sb.from('app_users').select('*').eq('auth_uid',user.id).maybeSingle();
    if(!error)return data||null;
    if(CLOCK_SKEW(error)&&i<7){if(onWait)onWait(i+1,8);await new Promise(r=>setTimeout(r,3000));continue;}
    console.error('getProfile',error);return null;}
  return null;}
function loginErr(m){$('#lMsg').textContent=m;$('#login').classList.add('err');setTimeout(()=>$('#login').classList.remove('err'),450)}
function authMsg(e){const s=((e&&e.message)||String(e)).toLowerCase();
  if(s.indexOf('invalid login')>-1)return'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
  if(s.indexOf('network')>-1||s.indexOf('failed to fetch')>-1)return'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่';
  return (e&&e.message)||'เกิดข้อผิดพลาด';}
async function doLogin(){
  const u=$('#lUser').value.trim(),p=$('#lPass').value.trim();
  if(!u||!p){loginErr('กรอกชื่อผู้ใช้และรหัสผ่าน');return;}
  const btn=$('#lBtn');btn.disabled=true;btn.textContent='⏳ เข้าสู่ระบบ...';
  try{
    const {error}=await sb.auth.signInWithPassword({email:u.toLowerCase()+EMAIL_DOMAIN,password:p});
    if(error)throw error;
    const prof=await getProfile((n,t)=>{btn.textContent='⏳ รอเซิร์ฟเวอร์... ('+n+'/'+t+')'});
    if(!prof){await sb.auth.signOut();loginErr('ไม่พบโปรไฟล์ในระบบ');return;}
    if(prof.status!=='active'){await sb.auth.signOut();loginErr('บัญชีนี้รอผู้ดูแลอนุมัติก่อนใช้งาน');return;}
    await enterApp(prof);
  }catch(e){loginErr(authMsg(e));}
  finally{btn.disabled=false;btn.textContent='เข้าสู่ระบบ';}
}
async function doLogout(){try{await sb.auth.signOut()}catch(e){}
  PROF=null;$('#hdr').style.display='none';$('#main').style.display='none';$('#login').classList.add('on');}
$('#lBtn').onclick=doLogin;
$('#lPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('#hOut').onclick=doLogout;

/* ================= เข้าแอพ + สาขา ================= */
function accessibleBranches(){
  if(isAdmin())return BRANCHES;
  const ids=(PROF&&PROF.branch_ids)||[];if(!ids.length)return BRANCHES;
  const r=BRANCHES.filter(b=>ids.indexOf(b.id)>-1);return r.length?r:BRANCHES;}
async function enterApp(prof){
  PROF=prof;
  const {data,error}=await sb.from('branches').select('*').order('sort');
  if(error){loginErr('โหลดสาขาไม่ได้: '+error.message);return;}
  BRANCHES=data||[];
  const acc=accessibleBranches();
  let saved=null;try{saved=localStorage.getItem('jjmt_branch')}catch(e){}
  CUR_B=(saved&&acc.some(b=>b.id===saved))?saved
    :((prof.branch_ids&&prof.branch_ids[0]&&acc.some(b=>b.id===prof.branch_ids[0]))?prof.branch_ids[0]:(acc[0]&&acc[0].id));
  if(!CUR_B){loginErr('ยังไม่มีสาขาในระบบ');return;}
  $('#login').classList.remove('on');
  $('#hdr').style.display='flex';$('#main').style.display='block';
  $('#hUser').textContent='👤 '+(prof.name||prof.username||'')+' · '+(prof.role||'staff');
  const sel=$('#hBranch');
  if(acc.length>1){sel.style.display='';sel.innerHTML=acc.map(b=>`<option value="${b.id}" ${b.id===CUR_B?'selected':''}>🏪 ${escapeHtml(b.name)}</option>`).join('');
    sel.onchange=()=>{CUR_B=sel.value;try{localStorage.setItem('jjmt_branch',CUR_B)}catch(e){}maintLoad();};}
  else{sel.style.display='none';}
  $('#hMng').style.display=isAdmin()?'':'none';
  $('#hMng').onclick=maintManageOverlay;
  maintLoad();
}
async function boot(){
  $('#hLogo').src=LOGO;$('#lLogo').src=LOGO;
  const s=await sb.auth.getSession().catch(()=>null);
  if(s&&s.data&&s.data.session){
    const prof=await getProfile();
    if(prof&&prof.status==='active'){await enterApp(prof);return;}
    try{await sb.auth.signOut()}catch(e){}
  }
  $('#login').classList.add('on');setTimeout(()=>$('#lUser').focus(),200);
}

/* ================= ตารางบำรุงรักษา ================= */
const MAINT_FREQ=[[1,'ทุกวัน'],[7,'ทุกสัปดาห์'],[14,'ทุก 2 สัปดาห์'],[30,'ทุกเดือน'],[60,'ทุก 2 เดือน'],[90,'ทุก 3 เดือน'],[180,'ทุก 6 เดือน'],[365,'ทุกปี']];
function maintFreqLabel(n){n=+n||0;const f=MAINT_FREQ.find(x=>x[0]===n);return f?f[1]:'ทุก '+n+' วัน';}
let MAINT_TASKS=[],MAINT_LOGS={};
function maintPhotos(lg){return (lg&&Array.isArray(lg.photos))?lg.photos.filter(u=>typeof u==='string'):[];}
function maintStat(t){
  const lg=(MAINT_LOGS[t.id]||[])[0];
  if(!lg)return{cls:'over',lg:null,last:null,due:null,left:null,txt:'ยังไม่เคยบันทึก — เริ่มทำรอบแรกได้เลย'};
  const last=isoFromAny(lg.done_date),due=addDaysISO(last,t.freq_days),left=diffDaysISO(todayISO(),due);
  const soonTh=t.freq_days>=14?3:(t.freq_days>=7?2:0);
  const cls=left<0?'over':(left<=soonTh?'soon':'ok');
  const txt=left<0?('เกินกำหนดมา '+(-left)+' วัน (ครบกำหนด '+fmtDate(due)+')')
    :left===0?'ครบกำหนดวันนี้'
    :('ครบกำหนด '+fmtDate(due)+' (อีก '+left+' วัน)');
  return{cls,lg,last,due,left,txt};
}
async function maintLoad(){
  const box=$('#mtList');box.innerHTML='<div class="rempty">กำลังโหลด...</div>';
  const [tk,lgs]=await Promise.all([
    sb.from('maint_tasks').select('*').eq('branch_id',CUR_B).is('deleted_at',null).order('sort'),
    sb.from('maint_logs').select('*').eq('branch_id',CUR_B).order('done_date',{ascending:false}).order('created_at',{ascending:false}).limit(600)]);
  if(tk.error){box.innerHTML='<div class="rempty">โหลดไม่ได้: '+escapeHtml(tk.error.message)+' (ยังไม่ได้รัน SQL jjmk_maint_setup?)</div>';return;}
  MAINT_TASKS=tk.data||[];MAINT_LOGS={};
  ((lgs&&lgs.data)||[]).forEach(r=>{(MAINT_LOGS[r.task_id]=MAINT_LOGS[r.task_id]||[]).push(r);});
  maintRenderList();
}
function maintRenderList(){
  const box=$('#mtList'),sum=$('#mtSum');
  if(!MAINT_TASKS.length){sum.innerHTML='';box.innerHTML='<div class="rempty">ยังไม่มีงานของสาขานี้'+(isAdmin()?' — กด ⚙️ เพื่อเพิ่มงาน':' — ให้ผู้ดูแลเพิ่มงานก่อน')+'</div>';return;}
  const rank={over:0,soon:1,ok:2};
  const arr=MAINT_TASKS.map(t=>({t,st:maintStat(t)}))
    .sort((a,b)=>rank[a.st.cls]-rank[b.st.cls]||((a.st.left==null?-9999:a.st.left)-(b.st.left==null?-9999:b.st.left))||((a.t.sort||0)-(b.t.sort||0)));
  const n={over:0,soon:0,ok:0};arr.forEach(x=>n[x.st.cls]++);
  sum.innerHTML=(n.over?`<span class="mchip over">🔴 เกินกำหนด ${n.over}</span>`:'')
    +(n.soon?`<span class="mchip soon">🟡 ใกล้ถึงกำหนด ${n.soon}</span>`:'')
    +`<span class="mchip ok">🟢 เรียบร้อย ${n.ok}</span>`;
  box.innerHTML=arr.map(({t,st})=>{
    const ph=maintPhotos(st.lg).slice(0,4),cnt=(MAINT_LOGS[t.id]||[]).length;
    return `<div class="mtcard ${st.cls}">
      <div class="mtrow1"><b>${escapeHtml(t.name)}</b><span class="mtfreq">${escapeHtml(maintFreqLabel(t.freq_days))}</span></div>
      ${t.detail?`<div class="mtdetail">${escapeHtml(t.detail)}</div>`:''}
      <div class="mtstat ${st.cls}">${st.cls==='over'?'🔴':st.cls==='soon'?'🟡':'🟢'} ${escapeHtml(st.txt)}</div>
      ${st.lg?`<div class="mtlast">ทำล่าสุด ${fmtDate(st.last)} · 👤 ${escapeHtml(st.lg.by_name||'—')}${st.lg.note?' · '+escapeHtml(st.lg.note):''}</div>`:''}
      ${ph.length?`<div class="mtthumbs">${ph.map(u=>`<img src="${escapeHtml(u)}" loading="lazy" data-full="${escapeHtml(u)}" alt="">`).join('')}</div>`:''}
      <div class="mtbtns">
        <button class="act send" data-done="${t.id}">✅ ทำแล้ว — ถ่ายรูปแนบ</button>
        <button class="act ghost" data-hist="${t.id}">🕘 ประวัติ${cnt?' ('+cnt+')':''}</button>
      </div>
    </div>`;}).join('');
  box.querySelectorAll('[data-full]').forEach(im=>im.onclick=()=>maintLightbox(im.dataset.full));
  box.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const t=MAINT_TASKS.find(x=>x.id===b.dataset.done);if(t)maintDoneOverlay(t);});
  box.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>{const t=MAINT_TASKS.find(x=>x.id===b.dataset.hist);if(t)maintHistOverlay(t);});
}
function maintLightbox(url){
  const ov=document.createElement('div');ov.className='overlay on';
  ov.style.cssText='z-index:300;background:rgba(12,7,5,.9);align-items:center';
  ov.innerHTML=`<img src="${escapeHtml(url)}" style="max-width:96vw;max-height:92vh;margin:auto;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5)" alt="">`;
  ov.onclick=()=>ov.remove();document.body.appendChild(ov);
}
async function maintUploadPhoto(dataUrl,taskId){
  const blob=await (await fetch(dataUrl)).blob();
  const path='m/'+CUR_B+'/'+taskId+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const up=await sb.storage.from('maint-photos').upload(path,blob,{contentType:'image/jpeg'});
  if(up.error)throw up.error;
  return sb.storage.from('maint-photos').getPublicUrl(path).data.publicUrl;
}
function maintDoneOverlay(t){
  const ov=document.createElement('div');ov.className='overlay on';
  ov.innerHTML=`<div class="sheet">
    <div class="sheet-head"><h3>✅ ${escapeHtml(t.name)}</h3><button class="x" data-x>✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>วันที่ทำ</label><input type="date" class="md_d" value="${todayISO()}"></div>
      <div class="field"><label>หมายเหตุ (ไม่บังคับ)</label><input class="md_n" placeholder="เช่น จ้างช่างมาล้าง / เปลี่ยนไส้กรองใหม่"></div>
      <div class="field"><label>รูปถ่ายหลังทำ (อย่างน้อย 1 รูป)</label>
        <input type="file" class="md_f" accept="image/*" multiple style="display:none">
        <div class="mtthumbs md_prev"></div>
        <button class="act ghost wide md_add" style="margin-top:6px">📸 ถ่ายรูป / เลือกรูป</button>
      </div>
      <button class="act send wide md_save" style="margin-top:6px">💾 บันทึกงาน + รูป</button>
      <p class="hint" style="margin:8px 0 0">บันทึกแล้วรูปจะขึ้นในตารางและประวัติทันที ให้เจ้าของ/ผู้ดูแลเปิดดูได้ทุกเครื่อง</p>
    </div></div>`;
  document.body.appendChild(ov);
  const x=()=>ov.remove();
  ov.querySelector('[data-x]').onclick=x;ov.onclick=e=>{if(e.target===ov)x();};
  const fin=ov.querySelector('.md_f'),prev=ov.querySelector('.md_prev'),save=ov.querySelector('.md_save');
  const imgs=[];
  function renderPrev(){prev.innerHTML=imgs.map((d,i)=>`<img src="${d}" data-i="${i}" title="แตะเพื่อลบรูปนี้" alt="">`).join('');
    prev.querySelectorAll('img').forEach(im=>im.onclick=()=>{imgs.splice(+im.dataset.i,1);renderPrev();});}
  ov.querySelector('.md_add').onclick=()=>fin.click();
  fin.onchange=()=>{[...fin.files].forEach(f=>processImage(f,d=>{if(d){imgs.push(d);renderPrev();}else toast('อ่านรูปไม่สำเร็จ 1 รูป');}));fin.value='';};
  save.onclick=async()=>{
    const d=ov.querySelector('.md_d').value||todayISO(),note=ov.querySelector('.md_n').value.trim();
    if(!imgs.length){toast('แนบรูปถ่ายอย่างน้อย 1 รูปก่อนบันทึก');return;}
    save.disabled=true;save.textContent='⏳ กำลังอัปโหลดรูป...';
    try{
      const urls=[];
      for(const im of imgs){urls.push(await maintUploadPhoto(im,t.id));save.textContent='⏳ อัปโหลดรูป '+urls.length+'/'+imgs.length+'...';}
      const {error}=await sb.from('maint_logs').insert({id:uid('ml'),task_id:t.id,branch_id:CUR_B,
        done_date:d,by_name:(PROF&&(PROF.name||PROF.username))||'',note:note||null,photos:urls});
      if(error)throw error;
      toast('บันทึก “'+t.name+'” แล้ว ✓');x();maintLoad();
    }catch(e){toast('บันทึกไม่ได้: '+((e&&e.message)||e)+' (ยังไม่ได้รัน SQL jjmk_maint_setup?)');
      save.disabled=false;save.textContent='💾 บันทึกงาน + รูป';}
  };
}
function maintHistOverlay(t){
  const logs=MAINT_LOGS[t.id]||[];
  const ov=document.createElement('div');ov.className='overlay on';
  const rows=logs.length?logs.map(lg=>{
    const ph=maintPhotos(lg);
    return `<div class="mtlog">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
        <b>📅 ${fmtDate(isoFromAny(lg.done_date))}</b>
        <span style="font-size:.8rem;color:#8a7f74">👤 ${escapeHtml(lg.by_name||'—')}${isAdmin()?` <button data-del="${lg.id}" title="ลบบันทึกนี้" style="border:none;background:none;cursor:pointer">🗑</button>`:''}</span>
      </div>
      ${lg.note?`<div class="mtdetail">${escapeHtml(lg.note)}</div>`:''}
      ${ph.length?`<div class="mtthumbs">${ph.map(u=>`<img src="${escapeHtml(u)}" loading="lazy" data-full="${escapeHtml(u)}" alt="">`).join('')}</div>`:'<div class="mtlast">ไม่มีรูปแนบ</div>'}
    </div>`;}).join(''):'<div class="rempty">ยังไม่เคยบันทึกงานนี้</div>';
  ov.innerHTML=`<div class="sheet">
    <div class="sheet-head"><h3>🕘 ${escapeHtml(t.name)}</h3><button class="x" data-x>✕</button></div>
    <div class="sheet-body">
      <p class="hint" style="margin:0 0 8px">${escapeHtml(maintFreqLabel(t.freq_days))} · ทำไปแล้ว ${logs.length} ครั้ง · แตะรูปเพื่อขยายเต็มจอ</p>
      ${rows}
    </div></div>`;
  document.body.appendChild(ov);
  const x=()=>ov.remove();
  ov.querySelector('[data-x]').onclick=x;ov.onclick=e=>{if(e.target===ov)x();};
  ov.querySelectorAll('[data-full]').forEach(im=>im.onclick=()=>maintLightbox(im.dataset.full));
  ov.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('ลบบันทึกนี้? (รูปในประวัติครั้งนี้จะหายจากตาราง)'))return;
    const {error}=await sb.from('maint_logs').delete().eq('id',b.dataset.del);
    if(error){toast('ลบไม่ได้: '+error.message);return;}
    toast('ลบบันทึกแล้ว');x();await maintLoad();
    const nt=MAINT_TASKS.find(z=>z.id===t.id);if(nt)maintHistOverlay(nt);
  });
}
function maintManageOverlay(){
  if(!isAdmin()){toast('เฉพาะเจ้าของ/ผู้ดูแล');return;}
  const acc=accessibleBranches();
  const bname=(acc.find(b=>b.id===CUR_B)||{}).name||'';
  const ov=document.createElement('div');ov.className='overlay on';
  const bChecks=acc.map(b=>`<label style="display:flex;gap:6px;align-items:center;font-size:.9rem"><input type="checkbox" class="mm_br" value="${b.id}" ${b.id===CUR_B?'checked':''}>🏪 ${escapeHtml(b.name)}</label>`).join('');
  ov.innerHTML=`<div class="sheet">
    <div class="sheet-head"><h3>⚙️ จัดการงานบำรุงรักษา</h3><button class="x" data-x>✕</button></div>
    <div class="sheet-body">
      <div class="sub-title" style="margin-top:0"><span class="mm_mode">➕ เพิ่มงานใหม่</span></div>
      <div class="field"><label>ชื่องาน</label><input class="mm_n" placeholder="เช่น ล้างฟิลเตอร์แอร์"></div>
      <div class="field"><label>รายละเอียด (ไม่บังคับ)</label><input class="mm_d" placeholder="เช่น ถอดฟิลเตอร์ทุกตัวมาล้าง ผึ่งให้แห้ง"></div>
      <div class="field"><label>ความถี่</label><select class="mm_f">${MAINT_FREQ.map(f=>`<option value="${f[0]}" ${f[0]===30?'selected':''}>${f[1]}</option>`).join('')}<option value="custom">กำหนดเอง…</option></select></div>
      <div class="field mm_brwrap"><label>ใช้กับสาขา</label><div style="display:flex;gap:14px;flex-wrap:wrap;padding:6px 2px">${bChecks}</div></div>
      <button class="act send wide mm_save">➕ เพิ่มงาน</button>
      <div class="sub-title">🛠 งานของ ${escapeHtml(bname)}</div>
      <div class="mm_list"></div>
      <p class="hint">🗑 ลบงาน = ซ่อนจากตาราง (ประวัติและรูปเก่ายังอยู่)</p>
    </div></div>`;
  document.body.appendChild(ov);
  const x=()=>ov.remove();
  ov.querySelector('[data-x]').onclick=x;ov.onclick=e=>{if(e.target===ov)x();};
  const fN=ov.querySelector('.mm_n'),fD=ov.querySelector('.mm_d'),fF=ov.querySelector('.mm_f'),
    saveBtn=ov.querySelector('.mm_save'),modeEl=ov.querySelector('.mm_mode'),brWrap=ov.querySelector('.mm_brwrap');
  let editId=null;
  function ensureFreqOpt(v){if(![...fF.options].some(o=>o.value===String(v))){
    const o=document.createElement('option');o.value=v;o.textContent=maintFreqLabel(v);fF.insertBefore(o,fF.lastElementChild);}fF.value=String(v);}
  fF.onchange=()=>{if(fF.value!=='custom')return;
    const v=parseInt(prompt('ทำทุกกี่วัน? (เช่น 45)'),10);
    if(v>0)ensureFreqOpt(v);else fF.value='30';};
  function resetForm(){editId=null;fN.value='';fD.value='';fF.value='30';brWrap.style.display='';
    modeEl.textContent='➕ เพิ่มงานใหม่';saveBtn.textContent='➕ เพิ่มงาน';}
  function renderList(){
    const wrap=ov.querySelector('.mm_list');
    wrap.innerHTML=MAINT_TASKS.length?MAINT_TASKS.map(t=>`<div class="mmrow">
        <div class="mmn"><b>${escapeHtml(t.name)}</b><small>${escapeHtml(maintFreqLabel(t.freq_days))}${t.detail?' · '+escapeHtml(t.detail):''}</small></div>
        <button data-ed="${t.id}">✏️</button><button data-rm="${t.id}">🗑</button>
      </div>`).join(''):'<div class="rempty">ยังไม่มีงานของสาขานี้</div>';
    wrap.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const t=MAINT_TASKS.find(z=>z.id===b.dataset.ed);if(!t)return;
      editId=t.id;fN.value=t.name;fD.value=t.detail||'';ensureFreqOpt(t.freq_days);brWrap.style.display='none';
      modeEl.textContent='✏️ แก้ไข: '+t.name;saveBtn.textContent='💾 บันทึกการแก้ไข';fN.focus();});
    wrap.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const t=MAINT_TASKS.find(z=>z.id===b.dataset.rm);if(!t)return;
      if(!confirm('ลบงาน “'+t.name+'” ออกจากสาขานี้?'))return;
      const {error}=await sb.from('maint_tasks').update({deleted_at:new Date().toISOString()}).eq('id',t.id);
      if(error){toast('ลบไม่ได้: '+error.message);return;}
      toast('ลบงานแล้ว');await maintLoad();renderList();if(editId===t.id)resetForm();});
  }
  saveBtn.onclick=async()=>{
    const name=fN.value.trim(),detail=fD.value.trim(),freq=parseInt(fF.value,10);
    if(!name){toast('กรอกชื่องานก่อน');fN.focus();return;}
    if(!(freq>0)){toast('เลือกความถี่ก่อน');return;}
    saveBtn.disabled=true;
    try{
      if(editId){
        const {error}=await sb.from('maint_tasks').update({name,detail:detail||null,freq_days:freq}).eq('id',editId);
        if(error)throw error;toast('บันทึกการแก้ไขแล้ว ✓');
      }else{
        const bids=[...ov.querySelectorAll('.mm_br:checked')].map(c=>c.value);
        if(!bids.length){toast('เลือกอย่างน้อย 1 สาขา');saveBtn.disabled=false;return;}
        const base=Math.max(0,...MAINT_TASKS.map(t=>t.sort||0));
        const rows=bids.map((bid,i)=>({id:uid('mt'),branch_id:bid,name,detail:detail||null,freq_days:freq,sort:base+10+i}));
        const {error}=await sb.from('maint_tasks').insert(rows);
        if(error)throw error;toast('เพิ่มงานแล้ว ✓ ('+bids.length+' สาขา)');
      }
      resetForm();await maintLoad();renderList();
    }catch(e){toast('บันทึกไม่ได้: '+((e&&e.message)||e));}
    finally{saveBtn.disabled=false;}
  };
  renderList();
}

boot();
</script>
</body>
