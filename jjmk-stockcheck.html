<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JJ เช็คสต๊อก · จริงใจหมูกระทะ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#C62127;--dk:#7E1013;--ink:#2E2119;--mut:#8A7A66;--line:#E8DFCC;--card:#FFFDF7;--bg:#F6F1E5;--green:#1F7A43;--amber:#A66A00;--blue:#5B7FA6;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Sarabun',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:86px}
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--dk),#690C0F);color:#fff;padding:12px 18px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hrow{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-family:'Prompt';font-size:18px;font-weight:700;white-space:nowrap}
header .sub{font-size:11.5px;color:#F2DCDC}
.seg{display:flex;gap:6px}
.seg button{padding:8px 16px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#F2DCDC;font-weight:700;font-size:14px;font-family:'Prompt';cursor:pointer}
.seg button.on{background:#fff;color:var(--dk)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{padding:8px 14px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#F2DCDC;font-weight:700;font-size:13.5px;font-family:'Prompt';cursor:pointer}
.tabs button.on{background:#F1C40F;color:#5A3E00}
header input[type=date],header input[type=text]{padding:8px 10px;border:0;border-radius:10px;font-size:14px}
main{max-width:1180px;margin:0 auto;padding:14px 18px}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:220px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;background:#fff}
.note{background:#FDF6E7;border:1px solid #EAD9AE;border-radius:12px;padding:8px 12px;font-size:12.5px;color:#7A6234}
.dept{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.dept>.h{display:flex;align-items:center;gap:9px;padding:11px 15px;font-family:'Prompt';font-weight:700;font-size:15px;cursor:pointer;user-select:none;background:#FBF6EA;border-bottom:1px solid #F0E8D6}
.dept>.h .n{margin-left:auto;font-size:12px;color:var(--mut);font-weight:600}
/* ---- แถวสินค้า: กริด desktop → ยุบเองบนมือถือ ---- */
.hd{display:grid;grid-template-columns:46px minmax(200px,1fr) 120px 120px 90px 90px 64px;gap:10px;align-items:center;padding:7px 15px;font-size:11px;color:var(--mut);font-weight:700;border-bottom:1px solid #F2EBDB}
.row{display:grid;grid-template-columns:46px minmax(200px,1fr) 120px 120px 90px 90px 64px;gap:10px;align-items:center;padding:8px 15px;border-bottom:1px solid #F5EFE1}
.row:last-child{border-bottom:0}
.row.low{background:#FDF3E7}
.pimg{width:42px;height:42px;border-radius:10px;object-fit:cover;background:#F3ECE0;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:1px solid var(--line)}
.nm .t{font-weight:700;font-size:14.5px}
.nm .s{font-size:11.5px;color:var(--mut)}
.nm .s .cn{color:var(--blue)}
.cell{font-size:13px;color:var(--ink)}
.cell .xs{font-size:10.5px;color:var(--mut)}
.q{width:100%;max-width:86px;padding:9px 6px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;text-align:center;background:#fff}
.q.has{border-color:var(--green);background:#F0F8F1;font-weight:700}
.outb{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;font-size:13px;color:var(--mut);cursor:pointer;width:100%}
.outb.on{background:#FBEAEA;border-color:#E4A6A6;color:var(--red);font-weight:700}
.ri{width:100%;max-width:86px;padding:8px 6px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;text-align:center;background:#fff}
.ri.dirty{border-color:var(--amber);background:#FFFBEF;font-weight:700}
.di{width:100%;padding:8px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;background:#fff}
.di.dirty{border-color:var(--amber);background:#FFFBEF}
/* settings grid */
.hd2,.row2{display:grid;grid-template-columns:46px minmax(190px,1fr) 140px 84px 84px 84px 84px 84px;gap:10px;align-items:center;padding:8px 15px}
.hd2{font-size:11px;color:var(--mut);font-weight:700;border-bottom:1px solid #F2EBDB;padding:7px 15px}
.row2{border-bottom:1px solid #F5EFE1}
.row2:last-child{border-bottom:0}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(0,0,0,.07);z-index:20}
.foot .in{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center}
.foot .st{flex:1;font-size:13.5px;color:var(--mut)}
.foot .st b{color:var(--ink)}
.savebtn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-family:'Prompt';font-weight:700;font-size:15px;box-shadow:0 3px 10px rgba(198,33,39,.3);cursor:pointer}
.savebtn:disabled{opacity:.55}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:86px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:92vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
/* ---- มือถือ: ยุบกริดอัตโนมัติ ---- */
@media(max-width:820px){
  .hd{display:none}
  .row{grid-template-columns:46px 1fr 82px 60px;grid-template-areas:"img nm q out" "img meta q out"}
  .row>.pimg{grid-area:img}.row>.nm{grid-area:nm}.row>.meta{grid-area:meta}.row>.qc{grid-area:q}.row>.oc{grid-area:out}
  .row .cell.dsk{display:none}
  .meta{display:block!important;font-size:11px;color:var(--mut)}
  .hd2{display:none}
  .row2{grid-template-columns:46px 1fr;row-gap:6px}
  .row2 .lbl::before{content:attr(data-l);display:block;font-size:10px;color:var(--mut)}
}
@media(min-width:821px){ .meta{display:none!important} }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div><h1>📋 JJ เช็คสต๊อก</h1><div class="sub">ชื่อจริงจากบิล P&amp;L · นับด้วยชื่อนับ · แบ่งตามแผนก</div></div>
    <div class="seg" id="brSeg"></div>
    <input type="date" id="cd">
    <input type="text" id="who" placeholder="ชื่อผู้นับ" style="width:110px">
    <div class="tabs">
      <button id="tabCount" class="on">📋 นับสต๊อก</button>
      <button id="tabSet">⚙️ ตั้งค่า</button>
    </div>
  </div>
</header>
<main>
  <div class="topbar">
    <input class="search" id="q" placeholder="🔍 ค้นหาชื่อบิล / ชื่อนับ / ซัพ / แผนก...">
    <div class="note" id="note" style="display:none"></div>
  </div>
  <div id="list"><div class="empty">กำลังโหลด...</div></div>
</main>
<div class="foot"><div class="in">
  <div class="st" id="st">–</div>
  <button class="savebtn" id="save">💾 บันทึก</button>
</div></div>
<input type="file" id="imgFile" accept="image/*" style="display:none">
<div id="toast"></div>
<script>
/* ============ JJ เช็คสต๊อก v2 ============
   - รายการต่อสาขาจากระบบนับ (products) เฉพาะตัวที่ผูกชื่อบิล P&L แล้ว (pnl_stock_names→pnl_stock_map)
   - ชื่อจริง = ชื่อบิล (ตัวใหญ่) · ชื่อนับ = ตัวรองไว้ใช้ตอนนับ (สองสาขาชื่อชุดเดียวกัน)
   - จัดกลุ่มตามแผนก (products.dept — รัน sql/jjmk_stockcheck_dept.sql ครั้งเดียว) ตกกลับหมวดเดิมถ้ายังไม่ตั้ง
   - รูปสินค้า: bucket product-images เดียวกับแอพนับ อัปเดตตามชื่อ = เห็นทั้ง 2 สาขา 2 ระบบ
   - ตั้งค่าอัตราใช้/วัน จ–พฤ (rate_wk) · ศ (rate_fri) · ส–อา (rate_we) + safety/max รายสาขา
     → เก็บลงคอลัมน์เดิมของแอพนับ = โฟลว์คำนวณสั่งของ + ส่ง LINE ซัพของแอพนับใช้ได้ทันที */
const CONFIG={URL:'https://aikyxvluaiubdidqxwnd.supabase.co',KEY:'sb_publishable_Bn6BMtcjasoPT3RZ_ekyOg_SLWWp-nm'};
const STK_BR={JJRD:'b19f0a17b4472',JJLP:'b19f0a17b448212'};
const BR_NAME={JJRD:'รัชดา',JJLP:'ลาดพร้าว'};
const S={br:localStorage.getItem('jjsc_br')||'JJRD',tab:'count',items:[],hidden:0,map:{},cur:{},q:'',open:{},deptOk:true,imgTarget:null};
const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isNaN(n)?0:n;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fq=v=>v==null||v===''?'':String(+(+v).toFixed(3));
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2800);}
async function api(method,path,body,prefer,raw){
  const r=await fetch(CONFIG.URL+(raw?'':'/rest/v1/')+path,{method,
    headers:{apikey:CONFIG.KEY,Authorization:'Bearer '+CONFIG.KEY,
      ...(raw?{}:{'Content-Type':'application/json'}),...(prefer?{Prefer:prefer}:{})},
    body:raw?body:(body?JSON.stringify(body):undefined)});
  if(!r.ok)throw new Error(await r.text().catch(()=>r.status));
  const tx=await r.text();return tx?JSON.parse(tx):[];
}
async function selAll(path){ // แบ่งหน้า กัน PostgREST ตัด 1,000 แถว
  let out=[],off=0;
  for(;;){const rows=await api('GET',path+'&limit=1000&offset='+off);out=out.concat(rows);if(rows.length<1000)break;off+=1000;}
  return out;
}
function bizToday(now){const d=new Date(now||Date.now());if(d.getHours()<6)d.setDate(d.getDate()-1);
  const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
// กลุ่มวันของวันนี้ ไว้ไฮไลต์ช่องอัตราใช้: 0=จ–พฤ 1=ศ 2=ส–อา
function dayGrp(ds){const g=new Date(ds+'T12:00:00').getDay();return g===5?1:(g===0||g===6?2:0);}
async function loadAll(){
  $('#list').innerHTML='<div class="empty">กำลังโหลด...</div>';
  const bid=STK_BR[S.br];
  const base='products?select=id,branch_id,cat_label,cat_ic,name,unit,sup,safety,max,rate_wk,rate_fri,rate_we,image_url,sort';
  let prods;
  try{ prods=await selAll(base+',dept&deleted_at=is.null&branch_id=eq.'+bid+'&order=sort'); S.deptOk=true; }
  catch(e){ prods=await selAll(base+'&deleted_at=is.null&branch_id=eq.'+bid+'&order=sort'); S.deptOk=false; } // ยังไม่รัน SQL แผนก
  const [map,cur]=await Promise.all([
    selAll('pnl_stock_names?select=*&order=id').catch(()=>selAll('pnl_stock_map?select=*&order=id')).catch(()=>[]),
    selAll('stock_current?select=product_id,qty,updated_at&branch_id=eq.'+bid).catch(()=>[])
  ]);
  S.map={}; map.forEach(r=>{ if(r.product_id&&!String(r.product_id).startsWith('none')&&r.pnl_item&&r.pnl_item!=='-')S.map[r.product_id]=r; });
  const all=prods.map(p=>({...p,qty:null,out:false,dirty:{}}));
  S.items=all.filter(p=>S.map[p.id]);        // เอาเฉพาะที่มีชื่อบิล
  S.hidden=all.length-S.items.length;
  S.cur={}; cur.forEach(r=>{S.cur[r.product_id]=r;});
  render();
}
const billName=it=>{const m=S.map[it.id];return m?m.pnl_item:it.name;};
function depts(){
  const q=S.q.trim().toLowerCase(); const m={};
  S.items.forEach(it=>{
    if(q&&!(it.name.toLowerCase().includes(q)||billName(it).toLowerCase().includes(q)
      ||(it.sup||'').toLowerCase().includes(q)||(it.dept||'').toLowerCase().includes(q)))return;
    const k=(S.deptOk&&it.dept)?it.dept:((it.cat_label||'ยังไม่จัดแผนก')+(S.deptOk?' (หมวดเดิม)':''));
    (m[k]=m[k]||{label:k,items:[]}).items.push(it);
  });
  return Object.values(m);
}
const counted=it=>it.out||(it.qty!=null&&it.qty!=='');
const isDirty=it=>Object.keys(it.dirty).length>0;
const low=it=>counted(it)&&it.safety!=null&&num(it.qty)<num(it.safety);
function imgCell(it){
  return it.image_url
    ?'<img class="pimg" src="'+esc(it.image_url)+'" loading="lazy" onclick="pickImg(\''+it.id+'\')" title="แตะเพื่อเปลี่ยนรูป">'
    :'<div class="pimg" onclick="pickImg(\''+it.id+'\')" title="แตะเพื่อใส่รูป">📷</div>';
}
function render(){
  const ds=depts();
  $('#note').style.display='';
  $('#note').innerHTML=(S.hidden?('ซ่อน '+S.hidden+' รายการที่ยังไม่ผูกชื่อบิล — ไปผูกที่แอพ P&L หน้า "ใช้จริง (สต๊อก)"'):'ผูกชื่อบิลครบทุกรายการ ✓')
    +(S.deptOk?'':' · ⚠ ยังไม่ได้รัน sql/jjmk_stockcheck_dept.sql — ตั้งแผนกยังไม่ได้ ใช้หมวดเดิมไปก่อน');
  if(!S.items.length){$('#list').innerHTML='<div class="empty">สาขานี้ยังไม่มีรายการที่ผูกชื่อบิล</div>';refresh();return;}
  const G=dayGrp($('#cd').value||bizToday());
  const hl=i=>i===G?';background:#FFF9E4':'';
  $('#list').innerHTML=ds.length?ds.map(dp=>{
    const open=S.open[dp.label]!==false;
    let head,rows;
    if(S.tab==='count'){
      head='<div class="hd"><span></span><span>สินค้า (ชื่อจริงจากบิล)</span><span>ซัพ</span><span>ครั้งก่อน</span><span style="text-align:center">นับได้</span><span style="text-align:center">หมด</span><span></span></div>';
      rows=dp.items.map(it=>{
        const cur=S.cur[it.id],cn=it.name!==billName(it);
        return '<div class="row'+(low(it)?' low':'')+'">'
          +imgCell(it)
          +'<div class="nm"><div class="t">'+esc(billName(it))+' <span style="font-weight:500;color:var(--mut);font-size:12px">'+esc(it.unit||'')+'</span></div>'
          +'<div class="s">'+(cn?'<span class="cn">นับ: '+esc(it.name)+'</span> · ':'')+'safety '+(it.safety??'–')+(low(it)?' · <b style="color:var(--amber)">⚠ ต่ำกว่า safety</b>':'')+'</div></div>'
          +'<div class="cell dsk">'+esc(it.sup||'–')+'</div>'
          +'<div class="cell dsk">'+(cur?('<b>'+cur.qty+'</b> <span class="xs">'+String(cur.updated_at||'').slice(5,10)+'</span>'):'–')+'</div>'
          +'<div class="meta">'+esc(it.sup||'')+(cur?' · ครั้งก่อน '+cur.qty:'')+'</div>'
          +'<div class="qc"><input class="q'+(it.qty!=null&&it.qty!==''?' has':'')+'" type="text" inputmode="decimal" placeholder="นับ" value="'+(it.qty??'')+'" onchange="setQ(\''+it.id+'\',this.value)"></div>'
          +'<div class="oc"><button class="outb'+(it.out?' on':'')+'" onclick="setOut(\''+it.id+'\')">หมด</button></div>'
          +'<span class="dsk cell"></span></div>';
      }).join('');
    }else{
      head='<div class="hd2"><span></span><span>สินค้า</span><span>แผนก</span><span style="text-align:center'+hl(0).replace(';','')+'">จ–พฤ/วัน</span><span style="text-align:center">ศ/วัน</span><span style="text-align:center">ส–อา/วัน</span><span style="text-align:center">safety</span><span style="text-align:center">max</span></div>';
      rows=dp.items.map(it=>{
        const cn=it.name!==billName(it);
        const ri=(f,i)=>'<span class="lbl" data-l="'+['จ–พฤ/วัน','ศ/วัน','ส–อา/วัน','safety','max'][i]+'"><input class="ri'+(it.dirty[f]!==undefined?' dirty':'')+'" type="text" inputmode="decimal" value="'+fq(it[f])+'" style="'+(i<3?hl(i).replace(';',''):'')+'" onchange="setF(\''+it.id+'\',\''+f+'\',this.value)"></span>';
        return '<div class="row2">'
          +imgCell(it)
          +'<div class="nm"><div class="t">'+esc(billName(it))+'</div><div class="s">'+(cn?'<span class="cn">นับ: '+esc(it.name)+'</span> · ':'')+esc(it.sup||'')+'</div></div>'
          +'<span class="lbl" data-l="แผนก"><input class="di'+(it.dirty.dept!==undefined?' dirty':'')+'" list="deptList" value="'+esc(it.dept||'')+'" placeholder="เช่น ครัว" '+(S.deptOk?'':'disabled')+' onchange="setF(\''+it.id+'\',\'dept\',this.value)"></span>'
          +ri('rate_wk',0)+ri('rate_fri',1)+ri('rate_we',2)+ri('safety',3)+ri('max',4)
          +'</div>';
      }).join('');
    }
    return '<div class="dept"><div class="h" onclick="tg(\''+esc(dp.label).replace(/'/g,"\\'")+'\')">🗂 '+esc(dp.label)
      +'<span class="n">'+(S.tab==='count'?dp.items.filter(counted).length+'/':'')+dp.items.length+' รายการ</span></div>'
      +(open?head+rows:'')+'</div>';
  }).join('')+'<datalist id="deptList">'+[...new Set(S.items.map(i=>i.dept).filter(Boolean))].map(d2=>'<option value="'+esc(d2)+'">').join('')+'</datalist>'
  :'<div class="empty">ไม่พบ "'+esc(S.q)+'"</div>';
  refresh();
}
function refresh(){
  if(S.tab==='count'){
    const n=S.items.filter(counted).length;
    $('#st').innerHTML='นับแล้ว <b>'+n+'</b>/'+S.items.length+' · '+BR_NAME[S.br]+' · '+($('#cd').value||'');
    $('#save').textContent='💾 บันทึกการนับ'; $('#save').disabled=!n;
  }else{
    const n=S.items.filter(isDirty).length;
    $('#st').innerHTML='แก้ตั้งค่า <b>'+n+'</b> รายการ · อัตราใช้/safety/max เก็บรายสาขา ('+BR_NAME[S.br]+') · แผนก/รูป ใช้ร่วม 2 สาขา';
    $('#save').textContent='💾 บันทึกตั้งค่า'; $('#save').disabled=!n;
  }
}
function tg(l){S.open[l]=S.open[l]===false;render();}
function setQ(id,v){const it=S.items.find(x=>x.id===id);if(!it)return;
  it.qty=v===''?null:num(v);if(it.qty!=null)it.out=false;render();}
function setOut(id){const it=S.items.find(x=>x.id===id);if(!it)return;
  it.out=!it.out;if(it.out)it.qty=0;render();}
function setF(id,f,v){const it=S.items.find(x=>x.id===id);if(!it)return;
  it.dirty[f]=(f==='dept')?String(v).trim():(v===''?null:num(v));render();}
/* ---- รูปสินค้า: bucket เดียวกับแอพนับ อัปเดตตามชื่อ (เห็นทั้ง 2 สาขา 2 ระบบ) ---- */
function pickImg(id){S.imgTarget=id;$('#imgFile').click();}
function shrink(file){return new Promise(res=>{
  const img=new Image();img.onload=()=>{
    const M=640,k=Math.min(1,M/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>res(b),'image/jpeg',0.8);
  };img.onerror=()=>res(null);img.src=URL.createObjectURL(file);});}
async function setImgUrl(name,url){ // แยกไว้เทสต์ได้: อัปเดต products ทุกแถวชื่อเดียวกัน + local
  await api('PATCH','products?name=eq.'+encodeURIComponent(name),{image_url:url},'return=minimal');
  S.items.forEach(x=>{if(x.name===name)x.image_url=url;});
}
async function upImg(file){
  const it=S.items.find(x=>x.id===S.imgTarget);if(!it||!file)return;
  toast('⏳ กำลังอัปโหลดรูป...');
  try{
    const blob=await shrink(file); if(!blob)throw new Error('อ่านรูปไม่สำเร็จ');
    const path='p/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    const r=await fetch(CONFIG.URL+'/storage/v1/object/product-images/'+path,{method:'POST',
      headers:{apikey:CONFIG.KEY,Authorization:'Bearer '+CONFIG.KEY,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
    if(!r.ok)throw new Error(await r.text().catch(()=>r.status));
    await setImgUrl(it.name,CONFIG.URL+'/storage/v1/object/public/product-images/'+path);
    toast('✅ ใส่รูป '+billName(it)+' แล้ว (เห็นทั้ง 2 สาขา)');render();
  }catch(e){toast('อัปโหลดรูปไม่สำเร็จ — '+String(e.message||e).slice(0,100),true);}
}
/* ---- บันทึก ---- */
async function saveAll(){
  const btn=$('#save');btn.disabled=true;const old=btn.textContent;btn.textContent='⏳ กำลังบันทึก...';
  try{
    if(S.tab==='count'){
      const who=($('#who').value||'').trim();localStorage.setItem('jjsc_who',who);
      const picked=S.items.filter(counted);
      const cd=$('#cd').value||bizToday(),bid=STK_BR[S.br];
      const hist=picked.map(it=>({branch_id:bid,branch_name:BR_NAME[S.br],count_date:cd,counter:who||null,
        cat_label:(S.deptOk&&it.dept)?it.dept:(it.cat_label||''),product_id:it.id,name:it.name,unit:it.unit||'',
        sup:it.sup||'',qty:num(it.qty),out_of_stock:!!it.out,safety:it.safety??null,max:it.max??null}));
      const cur=picked.map(it=>({branch_id:bid,product_id:it.id,qty:num(it.qty),counter:who||null,updated_at:new Date().toISOString()}));
      await api('POST','stock_counts',hist,'return=minimal');
      await api('POST','stock_current?on_conflict=branch_id,product_id',cur,'resolution=merge-duplicates,return=minimal');
      picked.forEach(it=>{S.cur[it.id]={product_id:it.id,qty:num(it.qty)};});
      toast('✅ บันทึกการนับ '+picked.length+' รายการ');
    }else{
      const dirty=S.items.filter(isDirty);
      for(const it of dirty){
        const d2={...it.dirty}; delete d2._;
        const dept=d2.dept; delete d2.dept;
        if(Object.keys(d2).length)await api('PATCH','products?id=eq.'+encodeURIComponent(it.id),d2,'return=minimal'); // อัตรา/safety/max รายสาขา
        if(dept!==undefined){await api('PATCH','products?name=eq.'+encodeURIComponent(it.name),{dept:dept||null},'return=minimal'); // แผนกใช้ร่วม 2 สาขา
          S.items.forEach(x=>{if(x.name===it.name)x.dept=dept||null;});}
        Object.assign(it,Object.fromEntries(Object.entries(it.dirty).filter(([k])=>k!=='dept')));
        it.dirty={};
      }
      toast('✅ บันทึกตั้งค่า '+dirty.length+' รายการ — โฟลว์สั่งของของแอพนับใช้ค่านี้ต่อได้เลย');
    }
    render();
  }catch(e){toast('บันทึกไม่สำเร็จ — '+String(e.message||e).slice(0,140),true);}
  btn.disabled=false;btn.textContent=old;refresh();
}
function boot(){
  $('#brSeg').innerHTML=Object.keys(STK_BR).map(b=>'<button data-br="'+b+'" class="'+(S.br===b?'on':'')+'">'+BR_NAME[b]+'</button>').join('');
  $('#brSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.br=b.dataset.br;localStorage.setItem('jjsc_br',S.br);
    document.querySelectorAll('#brSeg button').forEach(x=>x.classList.toggle('on',x.dataset.br===S.br));loadAll();};
  $('#tabCount').onclick=()=>{S.tab='count';$('#tabCount').classList.add('on');$('#tabSet').classList.remove('on');render();};
  $('#tabSet').onclick=()=>{S.tab='set';$('#tabSet').classList.add('on');$('#tabCount').classList.remove('on');render();};
  $('#cd').value=bizToday();
  $('#who').value=localStorage.getItem('jjsc_who')||'';
  $('#q').oninput=e=>{S.q=e.target.value;render();};
  $('#cd').onchange=render;
  $('#save').onclick=saveAll;
  $('#imgFile').onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';upImg(f);};
  loadAll().catch(e=>{$('#list').innerHTML='<div class="empty">โหลดไม่สำเร็จ — '+esc(e.message||e)+'</div>';});
}
boot();
</script>
