  const row={stk_name:p.name,recipe_id:r.id,factor:rnd4(f),by_name:S.user&&S.user.name};
  try{await db(()=>sb.from('kc_links').upsert(row,{onConflict:'stk_name'}));}catch(e){return;}
  TD_LINKS=(TD_LINKS||[]).filter(x=>supKey(x.stk_name)!==supKey(p.name)).concat([row]);SD_PICK=null;
  closeModal();toast(t('sd_link_saved'));sdCalc();if(S.tab==='send')sdPaint();});}

/* ---------- ออกบิล ---------- */
async function sdBillNo(code,d){ // <prefix><สาขา>-<ปปดดวว>-<ลำดับของวันนั้น> · อ่านเลขไม่ได้ = ไม่ออกบิล (กันเลขซ้ำ)
  const pre=String((S.cfg||CFG_DEF).bill_prefix||''),stamp=d.slice(2,4)+d.slice(5,7)+d.slice(8,10);
  const r=await sb.from('kc_deliveries').select('bill_no').eq('branch',code).eq('d',d);if(!r||r.error)throw (r&&r.error)||new Error('bill_no');
  let n=0;(r.data||[]).forEach(x=>{const m=/-(\d+)$/.exec(String(x.bill_no||''));if(m)n=Math.max(n,parseInt(m[1],10));});
  return pre+code+'-'+stamp+'-'+(n+1);}
function sdBillText(h,lines){ // ข้อความไลน์ (ไทยเสมอ) — หัวร้าน · สาขา · วันที่ · รายการ "ชื่อ จำนวน หน่วย × ราคา = เป็นเงิน" · รวม · เลขบิล · ค้างส่ง
  const L=lines.filter(l=>num(l.sent)>0);
  const rows=L.map(l=>String(l.name||'')+' '+fmtQ(l.sent)+' '+String(l.unit||'')+' × '+moneyU(l.unit_price)+' = '+money(l.amount));
  const back=lines.filter(l=>num(l.ordered)-num(l.sent)>1e-9).map(l=>String(l.name||'')+' '+fmtQ(rnd4(num(l.ordered)-num(l.sent)))+' '+String(l.unit||''));
  return ['🧾 '+SD_SHOP,'บิลส่งของ '+(h.bill_no||''),'สาขา: '+(h.branch_name||branchName(h.branch)||h.branch||''),
    'วันที่: '+thDate(h.d)+(h.order_date&&String(h.order_date).slice(0,10)!==String(h.d).slice(0,10)?' (สั่ง '+thDate(h.order_date)+')':'')]
    .concat(sdIsManual(h)?['✋ '+SD_MANUAL_NOTE]:[]).concat(['──────────'])   // บิล ➕ ส่งเพิ่ม บอกในไลน์ว่าไม่ใช่ของที่สั่งผ่านแอพนับ
    .concat(rows,['──────────','รวม '+L.length+' รายการ = '+money(h.total)]).concat(back.length?['ค้างส่ง: '+back.join(', ')]:[]).concat(h.by_name?['ส่งโดย '+h.by_name]:[]).join('\n');}
async function sdLineGo(h,lines){ // → {state:'sent'|'fail'|'none',text,gid,err,saveFail} · ส่งได้ = จด line_sent_at (พลาดลองอีกครั้ง · ยังไม่ได้ = จำไว้ในเครื่อง + บอกตรง ๆ)
  const text=sdBillText(h,lines),gid=((S.cfg||CFG_DEF).branch_line||{})[h.branch]||null;
  if(!gid)return {state:'none',text};
  try{await lineSend(gid,text);}catch(e){return {state:'fail',text,gid,err:(e&&e.message)||String(e)};}
  const at=new Date().toISOString();let saved=false;
  for(let i=0;i<2&&!saved;i++){try{const r=await sb.from('kc_deliveries').update({line_sent_at:at,line_group_id:gid}).eq('id',h.id);saved=!!(r&&!r.error);}catch(e){saved=false;}}
  if(saved){h.line_sent_at=at;h.line_group_id=gid;}else sdLineOkMark(h.id,at);
  return {state:'sent',text,gid,saveFail:!saved};}
async function sdRollback(id,step){ // บันทึกไม่ครบ = ถอนทุกอย่างที่เขียนไปแล้ว (best effort · ไม่ throw)
  if(step==='moves')await pushMovesUndo('kc_deliveries',id);
  if(step!=='head'){try{await sb.from('kc_delivery_lines').delete().eq('delivery_id',id);}catch(e){}}
  try{await sb.from('kc_deliveries').delete().eq('id',id);}catch(e){}}
async function sdStockOk(L,rids){ // ยอดสดของเมนูที่จะส่ง: อ่านไม่ได้ = ไม่ออกบิล (ห้ามเช็คกับแคช) · ไม่พอ = บอกแล้วจัดสรรใหม่บนจอ
  if(!(await refreshRows('recipe',rids))){toast(t('sd_live_fail'),true);return false;}
  const need={};L.forEach(l=>{need[l.link.recipe_id]=rnd4(num(need[l.link.recipe_id])+num(l.sent)*sdFactor(l));});
  for(const rid of rids){const r=recipeById(rid),have=Math.max(0,num(r&&r.qty));
    if(need[rid]>have+1e-9){toast(t('sd_stock_short',{n:dispName(r),h:fmtQ(have),u:trUnit(r&&r.yield_unit),s:fmtQ(need[rid])}),true);sdCalc();sdRefresh();return false;}}
  return true;}
function sdRowsOf(g,id){ // บรรทัดบิล = ทุกบรรทัดของใบสั่ง — ส่ง 0 = ค้างส่ง (บิลบอกครบว่าสั่งอะไร ส่งอะไร) · ชื่อ = ชื่อสินค้าที่สาขาสั่ง (recipe_id = เมนูของครัว) · ยังไม่ผูก/ไม่มีราคา = ส่ง 0 ไม่มีราคา
  const rows=g.lines.map((l,i)=>{
    if(!l.link||sdPriceOf(l)==null)return {delivery_id:id,recipe_id:l.link?l.link.recipe_id:null,name:l.name,stk_product_id:l.pid||null,ordered:l.remaining,sent:0,unit:l.unit||'',unit_cost:null,unit_price:null,amount:0,sort:i+1};
    const r=recipeById(l.link.recipe_id),up=num(sdPriceOf(l)),uc=num(sdCostOf(l));
    return {delivery_id:id,recipe_id:r.id,name:l.name||r.name,stk_product_id:l.pid||null,ordered:l.remaining,sent:num(l.sent),unit:l.unit||r.yield_unit||'',unit_cost:uc,unit_price:up,amount:rnd2(num(l.sent)*up),sort:i+1};});
  return {rows,subtotal:rnd2(rows.reduce((a,r)=>a+r.amount,0))};}
const sdSig=g=>g?g.lines.map(l=>[l.pid,supKey(l.name),rnd4(l.remaining)].join('|')).sort().join(';'):'';   // ลายเซ็นใบสั่ง: สินค้า + ที่ยังค้างส่ง (เทียบก่อน/หลังหน้าต่างยืนยัน)
async function sdInsertHead(head,g,d){ // เลขบิลชน (23505 — อีกเครื่องออกบิลสาขาเดียวกันพร้อมกัน · unique index ใน SQL) = อ่านเลขใหม่แล้วลองอีก ≤3 ครั้ง
  let err=null;
  for(let i=0;i<3;i++){let r=null;try{r=await sb.from('kc_deliveries').insert(head);}catch(e){r={error:e};}
    if(r&&!r.error)return;err=(r&&r.error)||new Error('insert');
    if(String(err.code||'')!=='23505')break;head.bill_no=await sdBillNo(g.code,d);}
  throw err;}
async function sdSend(gi){await once(async()=>{
  if(!SD.ok){toast(t('sd_noread'),true);return;}   // อ่านของที่ส่งไปแล้วไม่ครบ = ไม่ออกบิล (กันบิลซ้ำ/ตัดสต๊อกซ้ำ)
  const g=SD.groups[gi];if(!g||!canKitchen())return;
  if(!S.kcSql){toast(t('sd_sql_block'),true);return;}
  const bad=g.lines.find(l=>l.link&&num(l.sent)>0&&sdPriceOf(l)==null);if(bad){toast(t('sd_no_price',{n:bad.name}),true);sdCalc();sdRefresh();return;}
  const L=g.lines.filter(l=>l.link&&num(l.sent)>0);if(!L.length){toast(t(g.manual?'sd_m_nothing':'sd_nothing'),true);return;}
  const d=bizTodayISO(),rids=[...new Set(L.map(l=>l.link.recipe_id))];
  if(!(await sdStockOk(L,rids)))return;   // ยอดสด — อีกเครื่องอาจเพิ่งส่ง/ทำของ (อ่านไม่ได้ = ไม่ออกบิล)
  let no;try{no=await sdBillNo(g.code,d);}catch(e){toast(t('sd_not_saved')+' · '+((e&&e.message)||e),true);return;}
  const id=uid('dl'),by=S.user&&S.user.name;
  let {rows,subtotal}=sdRowsOf(g,id);
  if(!(await confirm2(t('sd_confirm',{b:g.short||g.name,n:L.length,m:money(subtotal),no}))))return;
  // หลังกดยืนยัน — ระหว่างหน้าต่างเปิด อีกเครื่องอาจส่ง/ทำของ/ออกบิล หรือสาขาแก้ยอด: อ่านซ้ำทั้งยอดสด + ใบสั่ง/ที่ส่งแล้ว + ราคา ไม่ตรงกับที่ยืนยัน = ไม่ออกบิล
  if(!(await sdStockOk(L,rids)))return;
  const R=await sdRead();if(!R.ok){toast(t('sd_noread'),true);return;}
  const g2=g.manual?sdManualGroups().find(x=>x.key===g.key):sdCalcGroups(R.raw,S.branches).groups.find(x=>x.key===g.key),again=sdRowsOf(g,id);   // เรียกเพิ่ม: เทียบกับร่างปัจจุบัน (อีกแท็บอาจแก้ร่าง) ไม่ใช่ออเดอร์
  if(sdSig(g2)!==sdSig(g)||again.subtotal!==subtotal||again.rows.some((r,i)=>r.amount!==rows[i].amount||r.sent!==rows[i].sent)){
    SD.raw=R.raw;SD.at=Date.now();sdCalc();if(S.tab==='send')sdPaint();toast(t('sd_changed'),true);return;}
  rows=again.rows;
  try{no=await sdBillNo(g.code,d);}catch(e){toast(t('sd_not_saved')+' · '+((e&&e.message)||e),true);return;}   // เลขบิลอ่านใหม่หลังหน้าต่าง (อีกเครื่องอาจออกบิลไปแล้ว)
  const head={id,bill_no:no,d,branch:g.code,branch_name:g.name,order_date:g.od,status:'sent',subtotal,overhead:0,total:subtotal,line_sent_at:null,line_group_id:null,paid_at:null,note:g.manual?SD_MANUAL_NOTE:null,by_name:by};
  const mv={};L.forEach(l=>{const rid=l.link.recipe_id,q=num(l.sent)*sdFactor(l);const m=mv[rid]=mv[rid]||{q:0,c:0};m.q+=q;m.c+=q*num(recipeUnitCost(recipeById(rid)));});
  let step='head';
  try{
    setBusy(true);try{await sdInsertHead(head,g,d);}finally{setBusy(false);}
    no=head.bill_no;
    step='lines';await db(()=>sb.from('kc_delivery_lines').insert(rows));
    step='moves';await pushMoves(Object.keys(mv).map(rid=>({d,kind:'send',ref_kind:'recipe',ref_id:rid,qty:-rnd4(mv[rid].q),cost:-rnd4(mv[rid].c),ref_table:'kc_deliveries',ref_id2:id,note:no+' · '+g.name})));
  }catch(e){await sdRollback(id,step);toast(t('sd_not_saved')+' · '+((e&&e.message)||e),true);return;}
  let left=0;
  if(g.manual)left=sdManualAfterBill(g);else Object.keys(SD_EDIT).forEach(k=>{if(k.indexOf(g.key+'|')===0)delete SD_EDIT[k];});   // เรียกเพิ่ม: ออกบิลแล้ว = เหลือในร่างเฉพาะส่วนที่ยังส่งไม่ครบ (บิลไลน์บอก "ค้างส่ง" ตรงกับการ์ด ✋)
  if(typeof MK_ORD!=='undefined')MK_ORD.at=0;   // 🍳 ทำของ คิดออเดอร์ใหม่รอบหน้า (ไม่ใช้ที่จำไว้ 60 วิ)
  const res=await sdLineGo(head,rows);
  if(res.saveFail)toast(t('sd_line_nosave'),'warn');else toast(t('sd_saved',{no}));
  await sdLoad();if(S.tab==='send')sdPaint();
  sdDone(head,res,left);});}
function sdManualAfterBill(g){ // ร่างเรียกเพิ่มหลังออกบิล: ส่งครบ = เอาออก · ส่งไม่ครบ (ของไม่พอ/ไม่มีราคา) = เหลือ ขอ − ส่ง ไว้ให้ส่งต่อ (ผู้ตรวจ V2: เดิมลบทั้งสาขาแล้วไม่มีที่ไหนจำว่ายังค้าง) → จำนวนบรรทัดที่ยังค้าง
  let left=0;g.lines.forEach(l=>{const rid=l.link&&l.link.recipe_id;if(!rid)return;const rem=rnd4(num(l.ordered)-num(l.sent));if(rem>1e-9)left++;sdManualSet(g.code,rid,rem>1e-9?rem:0,num(l.sent));});return left;}   // ที่ส่งไปแล้วสะสมในร่าง → การ์ดขึ้น ⏳ ส่งไปแล้ว N (ผู้ตรวจรอบ 2)
function sdDone(h,res,left){ // หน้าต่างผล: เลขบิล + สถานะไลน์ (ไม่มีกลุ่ม/ส่งไม่ได้ = กล่องคัดลอก) · left = บรรทัดเรียกเพิ่มที่ยังค้างในการ์ด ✋
  let x='<h3>🧾 '+esc(t('sd_done_t'))+'</h3><div class="okbox">'+esc(t('sd_saved',{no:h.bill_no}))+'<br>'+esc(h.branch_name||'')+' · <b>'+esc(money(h.total))+'</b></div>';
  if(left>0)x+='<div class="hintbox" id="sdLeftNote">✋ '+esc(t('sd_m_left',{n:left}))+'</div>';
  if(res.state==='sent')x+='<div class="okbox">💬 '+esc(t('sd_line_sent',{g:lgName(res.gid)}))+'</div>'+(res.saveFail?'<div class="badbox">⚠ '+esc(t('sd_line_nosave'))+'</div>':'');
  else x+='<div class="'+(res.state==='fail'?'badbox':'hintbox')+'">'+esc(res.state==='fail'?t('sd_line_fail')+(res.err?' ('+res.err+')':''):t('sd_line_none'))+'</div>'+lineTextBox(res.text,res.gid);
  x+='<div class="row" style="margin-top:12px"><button type="button" class="btn gh" data-id="'+esc(h.id)+'" onclick="closeModal();if(typeof blDetail===\'function\')blDetail(this.dataset.id)">'+esc(t('sd_view_bill'))+'</button>'+
    '<button type="button" class="btn" style="margin-left:auto" onclick="closeModal()">'+esc(t('close'))+'</button></div>';
  openModal(x);}

/* ---------- ➕ ส่งเพิ่ม — สาขาเรียกของเพิ่ม (ร่างในเครื่อง · ออกบิลทาง sdSend เดิม) ---------- */
function sdManualLoad(){ // → {<สาขา>:[{recipe_id,qty,sent?}]} ของวันนี้ (qty = ที่ยังขอ · sent = ส่งออกบิลไปแล้ววันนี้ มีเฉพาะเมื่อ >0) · วันอื่น/ค่าเสีย = ทิ้ง · ร่างของวันก่อนที่ยังมีรายการ = บอกครั้งเดียวว่าทิ้งแล้ว ไม่หายเงียบ ๆ (ผู้ตรวจ V2)
  const d=LS.get(SD_MANUAL,null);if(!d||d.d!==bizTodayISO()||!d.g||typeof d.g!=='object'||Array.isArray(d.g)){
    if(d){LS.del(SD_MANUAL);if(/^\d{4}-\d{2}-\d{2}$/.test(String(d.d||''))&&d.g&&typeof d.g==='object'&&!Array.isArray(d.g)&&Object.keys(d.g).length)toast(t('sd_m_dropped',{d:dispDate(d.d)}),'warn');}return {};}
  const g={};Object.keys(d.g).forEach(c=>{const rows=(Array.isArray(d.g[c])?d.g[c]:[]).filter(x=>x&&typeof x==='object'&&x.recipe_id);if(rows.length)g[c]=rows.map(x=>{const o={recipe_id:String(x.recipe_id),qty:rnd4(num(x.qty))},s=rnd4(num(x.sent));if(s>0)o.sent=s;return o;});});
  return g;}
function sdManualSave(g){if(!g||!Object.keys(g).length)LS.del(SD_MANUAL);else LS.set(SD_MANUAL,{d:bizTodayISO(),g});}
function sdManualRows(code){return sdManualLoad()[code]||[];}
function sdManualSet(code,rid,qty,sentAdd){ // qty>0 = ใส่/แก้ (คงลำดับเดิม · คงยอดที่ส่งไปแล้ว) · ≤0 = เอาออก · sentAdd = บวกยอดที่เพิ่งออกบิล (sdManualAfterBill)
  const g=sdManualLoad(),rows=g[code]||[],i=rows.findIndex(x=>x.recipe_id===rid),add=rnd4(num(sentAdd));
  if(qty>0){if(i>=0){rows[i].qty=qty;if(add>0)rows[i].sent=rnd4(num(rows[i].sent)+add);}else{const o={recipe_id:rid,qty};if(add>0)o.sent=add;rows.push(o);}}else if(i>=0)rows.splice(i,1);
  if(rows.length)g[code]=rows;else delete g[code];sdManualSave(g);}
function sdManualDel(code){const g=sdManualLoad();delete g[code];sdManualSave(g);}
function sdManualGroups(){ // ร่าง → กลุ่มรูปแบบเดียวกับ sdCalcGroups (เฉพาะสาขาที่เห็น · เมนูที่หาย/ไม่ใช้แล้ว ข้าม) — ☀️ วันนี้/🍳 ทำของ ไม่เรียกตัวนี้ (ร่างอยู่แค่เครื่องนี้)
  const m=sdManualLoad(),td=bizTodayISO(),out=[];
  (S.branches||[]).forEach(b=>{const rows=m[b.code];if(!rows||!rows.length)return;const lines=[];
    rows.forEach(x=>{const r=recipeById(x.recipe_id),q=rnd4(num(x.qty));if(!r||r.active===false||!(q>0))return;
      lines.push({rid:'manual|'+b.code+'|'+r.id,pid:'',cat:'',name:String(r.name||''),unit:String(r.yield_unit||''),ordered:q,already:rnd4(num(x.sent)),remaining:q,link:{recipe_id:r.id,factor:1},have:0,sent:0});});   // already = ส่งออกบิลไปแล้ววันนี้ (ช่อง "ขอเพิ่ม" ยังเป็นส่วนที่ยังขอ)
    if(!lines.length)return;
    out.push({key:'manual|'+b.code+'|'+td,code:b.code,name:b.name,short:b.short||b.name,color:b.color||'',od:td,lines,unlinked:0,manual:true});});
  return out;}
function sdThumb(o){const url=o&&imgOk(o.image_url)?String(o.image_url):'';return '<div class="ithumb">'+(url?'<img src="'+esc(url)+'" loading="lazy" data-ic="🍳" onerror="this.parentNode.textContent=this.dataset.ic">':'🍳')+'</div>';}   // รูปเสีย = กลับเป็นอิโมจิ (ผู้ตรวจ V1)   // รูปในช่อง — ไม่ใส่ซูม (แตะรูป = เลือกเมนู)
function sdManualLineHtml(gi,l,li,last){ // บรรทัดเรียกเพิ่ม: ชื่อเมนู (+ ⏳ ส่งไปแล้ว N ถ้าออกบิลไปบางส่วนแล้ว) + ✕ · มี X · ราคา · ช่อง "ขอเพิ่ม" = ส่วนที่ยังขอ แก้ร่างในที่ · ขาด/⚡ เหมือนบรรทัดปกติ
  const id=gi+'_'+li,u=trUnit(l.unit),r=recipeById(l.link.recipe_id),p=sdPriceOf(l);
  let h='<div class="sdl'+(last?' last':'')+'" id="sdL'+id+'"><div class="sdl-top sdm"><b class="sdl-name">'+esc(r?dispName(r):l.name)+'</b>'+(l.already>0?'<span class="xs mut">⏳ '+esc(t('sd_partial_h',{q:fmtQ(l.already),u}))+'</span>':'')+
    '<button type="button" class="sdl-x" aria-label="x" onclick="sdManualLineDel('+gi+','+li+')">✕</button></div>';
  h+='<div class="sdl-stats"><span>'+esc(t('sd_have'))+' <b id="sdHv'+id+'" class="'+(l.have>=l.remaining?'green':'red')+'">'+fmtQ(l.have)+'</b> '+esc(u)+'</span>'+(p==null?'<span class="chip warn">'+esc(t('no_price'))+'</span>':'<span>'+esc(moneyU(p))+'/'+esc(u)+'</span>')+'</div>';
  h+=(l.noPrice?'<div class="sdl-send"><span class="chip bad">⛔ '+esc(t('sd_no_price_h'))+'</span><button type="button" class="btn gh sm2" onclick="show(\'menus\')">📖 '+esc(t('nav_menus'))+'</button></div>':
    '<div class="sdl-send"><span class="sdl-lb">'+esc(t('sd_m_asked'))+'</span>'+stepper('sdS'+id,l.ordered,{step:1,min:1,unit:l.unit,on:(v)=>sdManualQtyIn(gi,li,v)})+'</div>')+
    '<div class="sdl-short" id="sdSh'+id+'">'+sdShortHtml(l,sdManualZero(SD.groups[gi]))+'</div>';
  return h+'</div>';}
function sdManualQtyIn(gi,li,v){ // แก้จำนวนที่ขอในที่ (ไม่วาดใหม่ — คีย์บอร์ดไม่หุบ) · ว่าง/0 ระหว่างพิมพ์ = ยังไม่บันทึก
  const g=SD.groups[gi],l=g&&g.manual&&g.lines[li];if(!l)return;const q=rnd4(numIn(v));if(!(q>0))return;
  sdManualSet(g.code,l.link.recipe_id,q);sdCalc();sdRefresh();}
function sdManualLineDel(gi,li){const g=SD.groups[gi],l=g&&g.manual&&g.lines[li];if(!l)return;sdManualSet(g.code,l.link.recipe_id,0);sdCalc();if(S.tab==='send')sdPaint();}
async function sdManualDrop(gi){const g=SD.groups[gi];if(!g||!g.manual)return;
  if(!(await confirm2(t('sd_m_drop_q',{b:g.short||g.name,n:g.lines.length}),{danger:true})))return;
  sdManualDel(g.code);sdCalc();if(S.tab==='send')sdPaint();}
async function sdManualOpen(){ // ① เลือกสาขา (สาขาเดียว = ข้ามไป ②) · ต้องอ่านออเดอร์ได้ก่อน (ของเพิ่มจัดสรรหลังใบสั่งปกติ)
  if(!canKitchen())return;if(!S.kcSql){toast(t('sd_sql_block'),true);return;}
  if(!SD.at){try{await sdLoad();}catch(e){}}
  if(!SD.ok||!SD.raw){toast(t('sd_noread'),true);return;}
  const B=S.branches||[];if(!B.length){toast(t('sd_m_none_br'),true);return;}
  MODAL_BACK=null;
  if(B.length===1){sdManualBr(B[0].code);return;}
  SD_M={code:null,q:''};
  openModal('<h3>'+esc(t('sd_m_title'))+'</h3><div class="hintbox">'+esc(t('sd_m_pick_br'))+'</div><div class="sd-mbrs">'+
    B.map(b=>'<button type="button" class="btn gh big sd-mbr" data-code="'+esc(b.code)+'" style="border-color:'+esc(sdBrColor(b.code,b.color))+'" onclick="sdManualBr(this.dataset.code)"><span class="sd-dot" style="background:'+esc(sdBrColor(b.code,b.color))+'"></span>'+esc(b.name)+'</button>').join('')+'</div>'+
    '<div class="row"><button type="button" class="btn gh" style="margin-left:auto" onclick="sdManualFinish()">'+esc(t('cancel'))+'</button></div>');}
function sdManualBr(code){const b=(S.branches||[]).find(x=>x.code===code);if(!b||!inBr(code))return;SD_M={code,q:''};sdManualPick();}
function sdManualPick(){ // ② ตารางรูปเมนู (ค้นหากรองในที่ · แตะ = ใส่จำนวน · ✓ บนช่องที่เลือกแล้ว) · ปิดหน้าต่าง = วาดการ์ดใหม่ (MODAL_BACK)
  const m=SD_M;if(!m||!m.code)return;const b=(S.branches||[]).find(x=>x.code===m.code);if(!b)return;const n=sdManualRows(m.code).length;
  MODAL_BACK=()=>sdManualFinish();
  openModal('<h3>'+esc(t('sd_m_title'))+'</h3><div class="sd-mhead"><span class="sd-dot" style="background:'+esc(sdBrColor(b.code,b.color))+'"></span><b>'+esc(b.name)+'</b>'+
      ((S.branches||[]).length>1?'<button type="button" class="btn gh sm2" onclick="sdManualOpen()">'+esc(t('sd_m_change_br'))+'</button>':'')+'</div>'+
    '<div class="hintbox">'+esc(t('sd_m_pick_menu'))+'</div>'+searchBox('sdMQ',v=>{if(SD_M)SD_M.q=String(v||'');const g=document.getElementById('sdMGrid');if(g)g.innerHTML=sdManualGridHtml();})+
    '<div class="igrid sd-mgrid" id="sdMGrid">'+sdManualGridHtml()+'</div>'+
    '<div class="row"><button type="button" class="btn big" id="sdMDone" onclick="sdManualFinish()">'+esc(t('sd_m_done',{n}))+'</button></div><div class="xs mut" style="margin-top:6px">'+esc(t('sd_m_draft'))+'</div>');
  const q=document.getElementById('sdMQ');if(q&&m.q)q.value=m.q;}
function sdManualGridHtml(){const m=SD_M;if(!m||!m.code)return '';const q=supKey(m.q),sel={};sdManualRows(m.code).forEach(x=>{sel[x.recipe_id]=x.qty;});
  const all=activeRecipes();let L=all.filter(r=>!q||supKey(r.name).includes(q)||supKey(dispName(r)).includes(q)||supKey(r.stock_name).includes(q)||supKey(r.cat).includes(q));
  L=L.slice().sort((a,b)=>dispName(a).localeCompare(dispName(b),'th'));
  if(!L.length)return '<div class="empty" style="grid-column:1/-1">'+esc(all.length?t('empty'):t('sd_m_no_menu'))+'</div>';
  return L.map(r=>{const p=sdPriceOf({link:{recipe_id:r.id,factor:1}}),on=sel[r.id]!=null,u=trUnit(r.yield_unit);
    return '<div class="icard sd-mtile tap'+(on?' on':'')+(p==null?' nop':'')+'" data-id="'+esc(r.id)+'" onclick="sdManualTap(this.dataset.id)">'+sdThumb(r)+
      (on?'<span class="sd-mbadge">✓ '+fmtQ(sel[r.id])+' '+esc(u)+'</span>':'')+'<div class="iname">'+esc(dispName(r))+'</div>'+
      '<div class="isub">'+esc(t('sd_have'))+' '+fmtQ(r.qty)+' '+esc(u)+' · '+(p==null?'⛔ '+esc(t('no_price')):esc(moneyU(p))+'/'+esc(u))+'</div></div>';}).join('');}
function sdManualTap(rid){ // แตะรูป → หน้าต่างใส่จำนวน (หน่วย yield_unit ตั้งต้น 1 · มีอยู่แล้ว = จำนวนเดิม + ปุ่มเอาออก) · ปิด = กลับตารางรูป
  const m=SD_M,r=recipeById(rid);if(!m||!m.code||!r)return;const cur=(sdManualRows(m.code).find(x=>x.recipe_id===rid)||{}).qty,p=sdPriceOf({link:{recipe_id:rid,factor:1}}),u=trUnit(r.yield_unit);
  MODAL_BACK=()=>sdManualPick();
  openModal('<div class="row" style="flex-wrap:nowrap;align-items:center">'+thumbHtml(r,'🍳')+'<div class="grow" style="min-width:0"><h3 style="margin:0 0 2px">'+esc(dispName(r))+'</h3><div class="xs mut">'+esc(t('sd_have'))+' '+fmtQ(r.qty)+' '+esc(u)+' · '+(p==null?'⛔ '+esc(t('no_price')):esc(moneyU(p))+'/'+esc(u))+'</div></div></div>'+
    (p==null?'<div class="badbox">⛔ '+esc(t('sd_no_price_h'))+'</div>':'')+
    '<div class="sd-mqty">'+fld(t('sd_m_qty'),stepper('sdMQty',cur!=null?cur:1,{step:1,min:1,unit:r.yield_unit}))+'</div>'+
    '<div class="row" style="margin-top:12px">'+(cur!=null?'<button type="button" class="btn gh" style="color:var(--bad)" data-id="'+esc(rid)+'" onclick="sdManualQtyOk(this.dataset.id,0)">🗑 '+esc(t('sd_m_remove'))+'</button>':'')+
      '<button type="button" class="btn gh" onclick="sdManualPick()">'+esc(t('cancel'))+'</button><button type="button" class="btn" style="flex:1" data-id="'+esc(rid)+'" onclick="sdManualQtyOk(this.dataset.id)">'+esc(t('sd_m_ok'))+'</button></div>');
  setTimeout(()=>{const i=document.getElementById('sdMQty');if(i&&!('ontouchstart' in window)){i.focus();try{i.select();}catch(e){}}},50);}
function sdManualQtyOk(rid,zero){ // ✓ = เก็บลงร่าง (จำนวน > 0) · zero=0 = เอาออก → กลับตารางรูป + การ์ดด้านหลังวาดใหม่
  const m=SD_M;if(!m||!m.code||!recipeById(rid))return;const inp=document.getElementById('sdMQty'),q=zero===0?0:rnd4(numIn(inp?inp.value:''));
  if(zero!==0&&!(q>0)){toast(t('sd_m_bad_qty'),true);return;}
  sdManualSet(m.code,rid,q);sdCalc();if(S.tab==='send')sdPaint();MODAL_BACK=null;sdManualPick();}
function sdManualFinish(){ // ปิดหน้าต่าง ➕ (ปุ่ม ✓ เสร็จ / ยกเลิก / แตะนอกหน้าต่าง) → การ์ดเรียกเพิ่มขึ้นในหน้า + เลื่อนไปที่การ์ด
  const m=SD_M;MODAL_BACK=null;SD_M=null;closeModal();sdCalc();if(S.tab!=='send')return;sdPaint();
  if(m&&m.code){const key='manual|'+m.code+'|'+bizTodayISO();const el=[...document.querySelectorAll('#sdBody .sd-card.sd-manual')].find(x=>x.dataset.key===key);
    if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'start',behavior:'smooth'});}catch(e){}}}

let BL={ym:ymNow(),br:'',rows:[],ok:true,at:0,loading:null};

RENDER.bills=function(el){
  const brs=S.branches;
  el.innerHTML=dhead('🧾 '+t('nav_bills'))+sqlNeedBox()+'<div class="sd-sub">'+esc(t('bl_sub'))+'</div>'+(brScoped()?'<div class="note">'+esc(t('br_scope',{b:brScopeTxt()||'—'}))+'</div>':'')+
    '<div class="bl-filters"><div class="bl-month"><button type="button" class="btn gh sm2" onclick="blMonth(-1)" aria-label="prev">‹</button><b id="blYm">'+esc(dispMonth(BL.ym))+'</b><button type="button" class="btn gh sm2" onclick="blMonth(1)" aria-label="next">›</button>'+
    (BL.ym!==ymNow()?'<button type="button" class="btn gh sm2" onclick="blMonthNow()">'+esc(t('bl_this_month'))+'</button>':'')+'</div>'+
    (brs.length>1?pillBar([{k:'',lb:t('bl_all_br')}].concat(brs.map(b=>({k:b.code,lb:b.short||b.name}))),BL.br,'blSetBr',{scroll:1}):'')+'</div>'+
    '<div id="blKpi"></div><div id="blList"><div class="spin"></div></div><div id="blSum"></div>';
  if(BL.at)blPaint();
  blLoad().then(ok=>{if(ok&&S.tab==='bills')blPaint();});   // ok=false = มีคำขอใหม่กว่า (กดเปลี่ยนเดือนซ้ำ) — รอบนั้นวาดเอง
};
function blMonth(n){BL.ym=n<0?prevMonth(BL.ym):nextMonth(BL.ym);BL.rows=[];BL.at=0;rerender();}
function blMonthNow(){BL.ym=ymNow();BL.rows=[];BL.at=0;rerender();}
function blSetBr(k){BL.br=S.branches.some(b=>b.code===k)?k:'';document.querySelectorAll('#view-bills .pills .pill').forEach(p=>p.classList.toggle('on',p.dataset.k===BL.br));blPaint();}
let BL_SEQ=0;
async function blLoad(){ // บิลของเดือน (เฉพาะสาขาที่เห็น) · อ่านไม่ได้ = ว่าง + แถบเตือน (ไม่ toast) · กด ‹ › รัว ๆ = ใช้ผลของคำขอล่าสุดเท่านั้น (seq — เดิมคืน promise ของเดือนก่อนหน้า แล้ววาดบิลเดือนนั้นใต้หัวเดือนใหม่) → true = ใช้ผลนี้แล้ว
  const seq=++BL_SEQ,ym=BL.ym,a=ym+'-01',b=ym+'-'+String(monthDays(ym)).padStart(2,'0');
  const p=(async()=>{let rows=[],ok=true;
    try{const r=await sb.from('kc_deliveries').select('*').gte('d',a).lte('d',b).order('d',{ascending:false}).order('created_at',{ascending:false}).limit(1000);
      if(!r||r.error)throw (r&&r.error)||new Error('read');rows=(r.data||[]).filter(x=>inBr(x.branch));}
    catch(e){ok=false;}
    if(seq!==BL_SEQ||ym!==BL.ym)return false;   // มีคำขอใหม่กว่า/เดือนเปลี่ยนไปแล้ว → ทิ้งผลนี้
    BL.rows=rows;BL.ok=ok;BL.at=Date.now();return true;})();
  BL.loading=p;
  try{return await p;}finally{if(BL.loading===p)BL.loading=null;}}
function blStTxt(st){const k='bl_st_'+st;return I18N.th[k]?t(k):String(st||'');}
function blBr(code){return (S.branchesAll||[]).find(b=>b.code===code)||null;}
function blSums(rows){ // ต่อสาขา {code,name,n,total,paid,unpaid}
  const m={};rows.forEach(x=>{const c=x.branch||'?';const o=m[c]=m[c]||{code:c,name:x.branch_name||branchName(c)||c,n:0,total:0,paid:0,unpaid:0};
    if(x.status==='void')return;o.n++;const v=num(x.total);o.total=rnd2(o.total+v);if(x.status==='paid')o.paid=rnd2(o.paid+v);else o.unpaid=rnd2(o.unpaid+v);});
  const ord={};S.branches.forEach((b,i)=>{ord[b.code]=i;});
  return Object.values(m).sort((a,b)=>num(ord[a.code]??99)-num(ord[b.code]??99));}
function blPaint(){
  const L=document.getElementById('blList'),K=document.getElementById('blKpi'),Su=document.getElementById('blSum');if(!L)return;
  const rows=BL.rows.filter(x=>!BL.br||x.branch===BL.br),td=bizTodayISO();
  const live=rows.filter(x=>x.status!=='void'),tot=rnd2(live.reduce((a,x)=>a+num(x.total),0)),paid=rnd2(live.filter(x=>x.status==='paid').reduce((a,x)=>a+num(x.total),0));
  if(K)K.innerHTML='<div class="kpis"><div class="kpi hero"><div class="t">'+esc(t('bl_k_total'))+'</div><div class="kpi-v">'+esc(money(tot))+'</div><div class="s">'+esc(t('bl_bills_n',{n:live.length}))+'</div></div>'+
    '<div class="kpi"><div class="t">'+esc(t('bl_paid'))+'</div><div class="kpi-v green">'+esc(money(paid))+'</div></div><div class="kpi"><div class="t">'+esc(t('bl_unpaid'))+'</div><div class="kpi-v '+(tot-paid>0?'red':'')+'">'+esc(money(rnd2(tot-paid)))+'</div></div></div>';
  if(!BL.ok){L.innerHTML='<div class="badbox">⚠ '+esc(t('bl_noread'))+'</div>';if(Su)Su.innerHTML='';return;}
  if(!rows.length){L.innerHTML=emptyBox(t('bl_none'));}
  else{let h='',last='';rows.forEach(x=>{if(x.d!==last){last=x.d;h+='<div class="dhead" style="font-size:14px;margin:10px 0 4px">'+esc(dispDate(x.d))+(x.d===td?' · '+esc(t('today')):'')+'</div>';}
      const b=blBr(x.branch),st=x.status||'sent';
      h+='<div class="rowline tap bl-row'+(st==='void'?' void':'')+'" data-id="'+esc(x.id)+'" onclick="blDetail(this.dataset.id)"><div class="grow"><div><span class="bno">'+esc(x.bill_no||'—')+'</span> '+
        '<span class="bl-dot" style="background:'+esc(sdBrColor(x.branch,b&&b.color))+'"></span>'+esc(x.branch_name||branchName(x.branch)||x.branch||'')+'</div>'+
        '<div class="xs mut">'+stPill(st,blStTxt(st))+' '+(x.line_sent_at?'<span class="chip ok">💬 ✓</span>':'<span class="chip mid">💬 —</span>')+' '+esc(t('bl_by'))+' '+esc(x.by_name||'')+' '+esc(dispTime(x.created_at))+'</div></div>'+
        '<span class="amt">'+esc(money(x.total))+'</span></div>';});
    L.innerHTML='<div class="card" style="padding-top:4px">'+h+'</div>';}
  if(Su){const sums=blSums(BL.rows);
    Su.innerHTML=sums.length?card('💰 '+esc(t('bl_sum_t',{m:dispMonth(BL.ym)})),'<div class="twrap"><table class="t bl-sum"><thead><tr><th>'+esc(t('branch'))+'</th><th class="n c-n">'+esc(t('bl_col_n'))+'</th><th class="n">'+esc(t('total'))+'</th><th class="n">'+esc(t('bl_paid'))+'</th><th class="n">'+esc(t('bl_unpaid'))+'</th></tr></thead><tbody>'+
      sums.map(s=>'<tr class="tap'+(BL.br&&BL.br===s.code?' cur':'')+'" data-k="'+esc(s.code)+'" onclick="blSetBr(this.dataset.k)"><td>'+esc(s.name)+'</td><td class="n c-n">'+s.n+'</td><td class="n">'+esc(money(s.total))+'</td><td class="n green">'+esc(money(s.paid))+'</td><td class="n '+(s.unpaid>0?'red':'')+'">'+esc(money(s.unpaid))+'</td></tr>').join('')+
      '<tr class="tot"><td>'+esc(t('total'))+'</td><td class="n c-n">'+sums.reduce((a,s)=>a+s.n,0)+'</td><td class="n">'+esc(money(sums.reduce((a,s)=>a+s.total,0)))+'</td><td class="n">'+esc(money(sums.reduce((a,s)=>a+s.paid,0)))+'</td><td class="n">'+esc(money(sums.reduce((a,s)=>a+s.unpaid,0)))+'</td></tr></tbody></table></div>'):'';}
}

/* ---------- รายละเอียดบิล (หน้าประวัติ/ส่งสาขาเรียกได้: blDetail(id)) ---------- */
async function blRead(id){let x=null,lines=[];
  try{x=await db(()=>sb.from('kc_deliveries').select('*').eq('id',id).maybeSingle());if(x)lines=await db(()=>sb.from('kc_delivery_lines').select('*').eq('delivery_id',id).order('sort').order('id'));}catch(e){return null;}
  if(!x){toast(t('bl_gone'));return null;}return {x,lines};}

  if(adm&&st!=='void')btns+='<button type="button" class="btn gh" style="color:var(--bad)" data-id="'+esc(x.id)+'" onclick="blVoid(this.dataset.id)">'+esc(t('bl_void'))+'</button>';

    '<div class="row" style="margin-bottom:8px"><b style="font-size:16px">'+esc(x.branch_name||branchName(x.branch)||x.branch||'')+'</b><span class="amt b" style="margin-left:auto;font-family:var(--fh);font-size:18px">'+esc(money(x.total))+'</span></div>'+
    '<div class="xs mut" style="margin-bottom:8px">'+esc(dispDate(x.d))+(x.order_date&&String(x.order_date).slice(0,10)!==String(x.d).slice(0,10)?' · '+esc(t('bl_order_d',{d:dispDate(x.order_date)})):'')+' · '+esc(t('bl_by'))+' '+esc(x.by_name||'')+' '+esc(dispTime(x.created_at))+
      (x.paid_at?' · '+esc(t('bl_paid_at',{d:dispDate(x.paid_at)})):'')+(x.line_sent_at?' · '+esc(t('bl_line_at',{d:dispDate(String(x.line_sent_at).slice(0,10)),t:dispTime(x.line_sent_at)}))+(x.line_group_id?' → '+esc(lgName(x.line_group_id)):''):'')+'</div>'+

async function blAfter(id){ // หลังจ่าย/ยกเลิก: หน้าบิลวาดใหม่ · 🚚 ส่งสาขา อ่านออเดอร์ใหม่ (ป้าย 🚚 + ใบสั่งที่กลับมาค้าง) · 🍳 ทำของ คิดใหม่รอบหน้า
  if(typeof MK_ORD!=='undefined')MK_ORD.at=0;
  if(S.tab==='bills'){await blLoad();blPaint();}
  if(typeof sdLoad==='function')sdLoad().then(()=>{if(S.tab==='send')sdPaint();}).catch(()=>{});
  if(id)blDetail(id);}
async function blResend(id){await once(async()=>{ // ส่งไลน์ซ้ำ (ข้อความเดิมจากบิล) · ไม่มีกลุ่ม/ส่งไม่ได้ = กล่องคัดลอก
  const R=await blRead(id);if(!R)return;const {x,lines}=R;if(!blScopeOk(x))return;if(x.status==='void'){toast(t('bl_void_done'),true);return;}
  const lo=!x.line_sent_at&&typeof sdLineOkAt==='function'?sdLineOkAt(x.id):null;   // เครื่องนี้ส่งถึงแล้วแต่จดไม่ได้ → ถามก่อน กันกลุ่มได้บิลซ้ำ
  if(lo&&!(await confirm2(t('bl_resend_q',{no:x.bill_no||'',t:dispTime(lo)}),{danger:true})))return;
  const res=await sdLineGo(x,lines);
  if(res.state==='sent'){toast(t('sd_line_sent',{g:lgName(res.gid)}));blAfter(id);return;}
  openModal('<h3>💬 '+esc(t('bl_resend'))+'</h3><div class="'+(res.state==='fail'?'badbox':'hintbox')+'">'+esc(res.state==='fail'?t('sd_line_fail')+(res.err?' ('+res.err+')':''):t('sd_line_none'))+'</div>'+lineTextBox(res.text,res.gid)+
    '<div class="row" style="margin-top:12px"><button type="button" class="btn gh" data-id="'+esc(id)+'" onclick="blDetail(this.dataset.id)">'+esc(t('bl_back'))+'</button><button type="button" class="btn" style="margin-left:auto" onclick="closeModal()">'+esc(t('close'))+'</button></div>');});}
async function blPaid(id){await once(async()=>{ // ✅ จ่ายแล้ว (หัวหน้า)
  if(!isAdminish())return;const R=await blRead(id);if(!R)return;const {x}=R;if(!blScopeOk(x))return;if(x.status!=='sent'){blDetail(id);return;}
  if(!(await confirm2(t('bl_paid_q',{b:x.branch_name||branchName(x.branch)||x.branch,no:x.bill_no||'',m:money(x.total)}))))return;
  try{await db(()=>sb.from('kc_deliveries').update({status:'paid',paid_at:bizTodayISO()}).eq('id',id).eq('status','sent'));}catch(e){return;}
  toast(t('bl_paid_ok'));blAfter(id);});}
async function blUnpaid(id){await once(async()=>{ // ↩️ ยังไม่จ่าย (หัวหน้า · กดผิด)
  if(!isAdminish())return;const R=await blRead(id);if(!R)return;if(!blScopeOk(R.x))return;if(R.x.status!=='paid'){blDetail(id);return;}
  try{await db(()=>sb.from('kc_deliveries').update({status:'sent',paid_at:null}).eq('id',id).eq('status','paid'));}catch(e){return;}
  toast(t('bl_unpaid_ok'));blAfter(id);});}
async function blVoidDone(id){ // เคยคืนสต๊อกของบิลนี้แล้ว (รอบก่อนคืนได้แต่เปลี่ยนสถานะไม่สำเร็จ) = ไม่คืนซ้ำ · อ่านไม่ได้ = null (ห้ามเดา)
  try{const r=await sb.from('kc_moves').select('id').eq('ref_table','kc_deliveries').eq('ref_id2',String(id)).eq('kind','send').gt('qty',0).limit(1);if(!r||r.error)return null;return !!(r.data&&r.data.length);}catch(e){return null;}}
async function blVoid(id){await once(async()=>{ // ❌ ยกเลิกบิล: คืนสต๊อก = กลับด้านของที่เคยตัดจริง (kc_moves send ของบิลนี้) · ไม่มี = จากบรรทัด · แล้ว status void
  if(!isAdminish())return;const R=await blRead(id);if(!R)return;const {x,lines}=R;if(!blScopeOk(x))return;
  if(x.status==='void'){toast(t('bl_void_done'),true);return;}
  if(!(await confirm2(t((typeof sdIsManual==='function'&&sdIsManual(x))?'bl_void_q_manual':'bl_void_q',{no:x.bill_no||'',b:x.branch_name||branchName(x.branch)||x.branch,n:lines.length}),{danger:true})))return;   // บิลเรียกเพิ่ม = ไม่สัญญาว่าออเดอร์จะกลับมาค้างส่ง
  try{
    const done=await blVoidDone(id);if(done==null){toast(t('bl_moves_noread'),true);return;}   // kc_moves คือของจริงที่เคยตัด — อ่านไม่ได้ = ไม่ยกเลิก (คืนผิดจำนวน/คืนซ้ำ)
    if(!done){
      let orig=null;try{const r=await sb.from('kc_moves').select('ref_id,qty,cost').eq('ref_table','kc_deliveries').eq('ref_id2',String(id)).eq('kind','send').lt('qty',0);if(r&&!r.error)orig=r.data||[];}catch(e){}
      if(orig==null){toast(t('bl_moves_noread'),true);return;}
      const agg={};
      if(orig.length)orig.forEach(m=>{const a=agg[m.ref_id]=agg[m.ref_id]||{q:0,c:0};a.q+=-num(m.qty);a.c+=-num(m.cost);});
      else lines.forEach(l=>{if(!l.recipe_id||!(num(l.sent)>0))return;const f=tdLineFactor(l);   // บิลเก่าไม่มี moves: หน่วยสาขา × ตัวคูณที่ผูก = หน่วยครัว (tdLineFactor — กติกาเดียวกับ tdAvgSent/MK_ORD.daily)
        const a=agg[l.recipe_id]=agg[l.recipe_id]||{q:0,c:0};a.q+=num(l.sent)*f;a.c+=num(l.sent)*num(l.unit_cost);});
      const ids=Object.keys(agg);await refreshRows('recipe',ids);
      await pushMoves(ids.map(rid=>({d:bizTodayISO(),kind:'send',ref_kind:'recipe',ref_id:rid,qty:rnd4(agg[rid].q),cost:rnd4(agg[rid].c),ref_table:'kc_deliveries',ref_id2:id,note:t('bl_void_note')+' '+(x.bill_no||'')})));}
    await db(()=>sb.from('kc_deliveries').update({status:'void',paid_at:null}).eq('id',id));
  }catch(e){return;}
  toast(t('bl_void_ok'));blAfter(id);});}

   🛒 สั่งของ — buy (po*)
   คำแนะนำแยกตามร้านค้า (ck_sups จับคู่ด้วยชื่อร้านของวัตถุดิบ it.sup):
     ต้องมี = มากกว่าระหว่าง "ขั้นต่ำ" (min_qty) กับ "ที่ต้องใช้ทำของ" (สูตร × รอบที่ 🍳 แนะนำ — ⚡ ด่วนจากออเดอร์สาขา / 🔄 เติมให้ถึงที่ควรมี · ใช้ mkLoad/mkNeeds ของโมดูลทำของ ไม่คิดซ้ำ)
     ต้องสั่ง = ต้องมี − ที่มีในสต๊อก − ที่สั่งไว้แล้วกำลังมา (kc_pos status sent)  → ปัดขึ้นเป็นจำนวนบรรจุ (หน่วยซื้อ buy_unit/buy_qty หรือบรรจุแรกใน packs)

async function poListLoad(){ // ใบสั่ง 30 วันหลัง + บรรทัด — ใบหรือบรรทัดอ่านไม่ได้ = PO_LIST_OK=false คงชุดล่าสุดที่อ่านได้ไว้ (ห้ามคิดคำแนะนำจากข้อมูลครึ่ง ๆ — เหมือน 🚚 sdLoad) · ยังไม่รัน SQL + ตารางไม่มีจริง = ว่าง (sdTblGone)
  const td=bizTodayISO();
  const get=async q=>{try{const r=await q;if(!r||r.error){const x={ok:false,rows:[],err:r&&r.error};sdTblGone(x);return x.ok?[]:null;}return r.data||[];}catch(e){return null;}};

function poIncoming(){ // ที่สั่งไว้แล้วกำลังมา (ใบ status sent · ร่างที่ไลน์ถึงแล้ว) ต่อวัตถุดิบ เป็นหน่วยหลัก

function poCalc(){
  const ordersOk=!!(typeof MK_ORD!=='undefined'&&MK_ORD.ok);
  if(!PO_LIST_OK)return {groups:[],ordersOk,listOk:false};   // ใบที่สั่งไปแล้วอ่านไม่ครบ = ไม่มีคำแนะนำ (ของที่กำลังมาจะถูกสั่งซ้ำ)
  const needs=(typeof mkNeeds==='function')?mkNeeds():{};
  const prod={},why={};
  activeRecipes().forEach(r=>{const n=needs[r.id];if(!n||!(n.sugg>0))return;
    bomOf(r).forEach(l=>{if(l.qty_base==null)return;const id=l.item.id;prod[id]=rnd4(num(prod[id])+l.qty_base*n.sugg);(why[id]=why[id]||[]).push({r,lots:n.sugg});});});
  const inc=poIncoming(),groups={};
  const grp=(key,supName)=>{if(groups[key])return groups[key];const s=S.sups.find(x=>supKey(x.name)===key)||null;
    return groups[key]={key,name:s?s.name:(String(supName||'').trim()||t('po_nosup')),sup:s,gid:(s&&s.line_group_id)||null,rows:[]};};
  activeItems().forEach(it=>{
    const stock=Math.max(0,num(it.qty)),mn=Math.max(0,num(it.min_qty)),pr=num(prod[it.id]),want=Math.max(mn,pr),incoming=num(inc[it.id]);
    const need=rnd4(want-stock-incoming),key=supKey(it.sup),manual=(PO_OVR.add[key]||[]).includes(it.id);
    if(need<=0&&!manual)return;
    const pk=poPack(it),sug=need>0?Math.ceil(need/pk.q-1e-9):0,ov=PO_OVR.v[key+'|'+it.id];
    const packs=(ov==null||ov==='')?(need>0?sug:1):Math.max(0,num(ov)),c=itemCost(it);
    grp(key,it.sup).rows.push({it,stock,mn,pr,want,incoming,need,pu:pk.u,pq:pk.q,sug,packs,ov:!(ov==null||ov===''),why:why[it.id]||[],lowMin:mn>0&&stock+incoming<mn,c,est:c==null?null:rnd2(c*pk.q*packs),manual:need<=0&&manual});
  });
  Object.keys(PO_OVR.add).forEach(key=>{if(!groups[key])grp(key,(S.sups.find(x=>supKey(x.name)===key)||{}).name||key);});
  const G=Object.values(groups).sort((a,b)=>((a.key==='')-(b.key===''))||a.name.localeCompare(b.name,'th'));
  G.forEach((g,i)=>{g.gi=i;});
  return {groups:G,ordersOk,listOk:true};
}

  finally{setBusy(false);}
  if(!ins){toast(t(PO_LIST_OK?'po_not_saved':'po_list_noread'),true);return null;}
  try{await db(()=>sb.from('kc_po_lines').insert(lines));}
  catch(e){try{await sb.from('kc_po_lines').delete().eq('po_id',id);await sb.from('kc_pos').delete().eq('id',id);}catch(_){}toast(t('po_not_saved'),true);return null;}
  return {id,po_no,text};}
async function poSend(gi){await once(async()=>{
  if(!PO_LIST_OK){toast(t('po_list_noread'),true);return;}   // ใบที่สั่งไปแล้วอ่านไม่ครบ = ไม่สั่ง (สั่งซ้ำ/เลขซ้ำ)
  const g=PO_SUG&&PO_SUG.groups[gi];if(!g||!canKitchen())return;const rows=g.rows.filter(r=>r.packs>0);
  if(!rows.length){toast(t('po_nothing'),true);return;}
  const po_no=poNextNo(),text0=poText(g,rows,po_no);
  if(!g.gid){poManualModal(g,rows,po_no,text0);return;}
  if(!(await confirm2(t('po_send_q',{s:g.name,g:lgName(g.gid)}))))return;
  const sv=await poSave(g,rows,po_no,text0,'draft');if(!sv)return;const id=sv.id,text=sv.text;
  try{await lineSend(g.gid,text);}catch(e){await poListLoad();poFailModal(id,g,text,e);return;}
  let ok=false;for(let i=0;i<2&&!ok;i++){try{const r=await sb.from('kc_pos').update({status:'sent',line_sent_at:new Date().toISOString()}).eq('id',id);ok=!!(r&&!r.error);}catch(e){ok=false;}}   // พลาด = ลองอีกครั้ง
  if(ok)toast(t('po_sent_ok',{s:g.name}));else{poLineOkMark(id);toast(t('po_sent_but'),'warn');}
  await poAfterSent(g.key);
});}
async function poAfterSent(key){ // ล้างที่แก้ของร้านนี้ → โหลดใบ/กำลังมาใหม่ → คิดใหม่
  Object.keys(PO_OVR.v).forEach(k=>{if(k.startsWith(key+'|'))delete PO_OVR.v[k];});delete PO_OVR.add[key];poOvrSave();
  await poListLoad();if(S.tab!=='buy')return;PO_SUG=poCalc();poPaint();poPaintList();}
function poManualModal(g,rows,po_no,text){ // ไม่มีกลุ่มไลน์: คัดลอก/เปิดไลน์เอง แล้วถามว่าส่งแล้วไหม
  const ok=hreg(()=>once(async()=>{if(!PO_LIST_OK){toast(t('po_list_noread'),true);return;}const sv=await poSave(g,rows,po_no,text,'sent');if(!sv)return;closeModal();toast(t('po_sent_ok',{s:g.name}));await poAfterSent(g.key);}));
  openModal('<h3>📋 '+esc(t('po_manual_t',{s:g.name}))+'</h3><div class="hintbox">'+esc(t('po_manual_h'))+'</div>'+lineTextBox(text)+
    '<div class="b" style="margin:16px 0 8px">'+esc(t('po_manual_q'))+'</div><div class="row"><button type="button" class="btn ok grow" id="poManualOk" onclick="'+ok+'">'+esc(t('po_mark_sent'))+'</button>'+
    '<button type="button" class="btn gh" id="poManualNo" onclick="closeModal()">'+esc(t('po_not_yet'))+'</button></div>');}
function poFailModal(id,g,text,e){ // บันทึกแล้ว (draft) แต่ไลน์ส่งไม่ได้
  openModal('<h3>⚠ '+esc(t('po_fail_t'))+'</h3><div class="badbox">'+esc(t('po_fail_h'))+'<div class="xs" style="margin-top:4px">'+esc((e&&e.message)||e||'')+'</div></div>'+lineTextBox(text)+
    '<div class="row" style="margin-top:14px"><button type="button" class="btn ok grow" id="poFailOk" onclick="'+hreg(()=>poMarkSent(id,g.key))+'">'+esc(t('po_mark_sent'))+'</button>'+
    '<button type="button" class="btn gh" id="poFailDrop" onclick="'+hreg(()=>poDrop(id,g.key))+'">'+esc(t('po_fail_drop'))+'</button></div>');}
async function poMarkSent(id,key){await once(async()=>{try{await db(()=>sb.from('kc_pos').update({status:'sent'}).eq('id',id));}catch(e){return;}closeModal();toast(t('sv_ok'));await poAfterSent(key);});}
async function poDrop(id,key){await once(async()=>{try{await db(()=>sb.from('kc_po_lines').delete().eq('po_id',id));await db(()=>sb.from('kc_pos').delete().eq('id',id));}catch(e){return;}
  closeModal();await poAfterSent(key);});}
/* ---------- ใบที่สั่งไปแล้ว ---------- */
function poPaintList(){
  const box=document.getElementById('poList'),n=document.getElementById('poListN');if(!box)return;
  if(!PO_LIST_OK){box.innerHTML='<div class="empty">'+esc(t('po_noread'))+'</div>';return;}
  if(n)n.textContent=PO_LIST.length?t('po_lines_n',{n:PO_LIST.length}):'';
  if(!PO_LIST.length){box.innerHTML='<div class="empty">'+esc(t('po_list_none'))+'</div>';return;}
  box.innerHTML=PO_LIST.map(p=>{const ln=PO_LINES[p.id]||[];
    return '<div class="rowline tap po-li" data-id="'+esc(p.id)+'" onclick="poDetail(this.dataset.id)"><div class="grow"><b>'+esc(p.sup_name||'')+'</b> <span class="mut sm">'+esc(p.po_no||'')+'</span>'+
      '<div class="xs mut">'+esc(dispDate(p.d))+' · '+esc(t('po_lines_n',{n:ln.length}))+(p.by_name?' · '+esc(p.by_name):'')+'</div></div>'+stPill(p.status,poStLb(p.status))+'</div>';}).join('');
}
async function poDetail(id){ // โมดูลอื่นเรียกได้
  let p=PO_LIST.find(x=>x.id===id),ln=PO_LINES[id];
  if(!p){try{p=await db(()=>sb.from('kc_pos').select('*').eq('id',id).maybeSingle());if(!p)return;ln=await db(()=>sb.from('kc_po_lines').select('*').eq('po_id',id).order('sort').order('id'));}catch(e){return;}}
  ln=ln||[];const s=supById(p.sup_id)||supByName(p.sup_name),gid=(s&&s.line_group_id)||null,est=ln.reduce((a,l)=>a+num(l.price_est),0),anyEst=ln.some(l=>l.price_est!=null);
  const rows=ln.map(l=>'<tr><td>'+esc(l.name||'')+'</td><td class="n">'+esc(fmtQ(l.packs))+' '+esc(trUnit(l.pack_unit||''))+
    ((l.pack_unit||'')!==(l.unit||'')?'<div class="xs mut">= '+esc(fmtQ(l.qty_base))+' '+esc(trUnit(l.unit||''))+'</div>':'')+'</td><td class="n">'+(l.price_est!=null?esc(money(l.price_est)):'–')+'</td></tr>').join('');
  const btns=[],lo=p.status==='draft'?poLineOkAt(p.id):null;
  if(lo)btns.push('<div class="badbox" style="flex-basis:100%">⚠ '+esc(t('po_line_local',{t:dispTime(lo)}))+'</div><button type="button" class="btn ok" id="poMarkBtn" onclick="'+hreg(()=>poMarkSent(id,supKey(p.sup_name)))+'">'+esc(t('po_mark_sent'))+'</button>');
  if(p.status==='sent'&&typeof rcFromPo==='function')btns.push('<button type="button" class="btn ok big" id="poRecvBtn" onclick="'+hreg(()=>{closeModal();rcFromPo(id);})+'">'+esc(t('po_recv_btn'))+'</button>');
  if(gid&&(p.status==='sent'||p.status==='draft'))btns.push('<button type="button" class="btn gh" id="poResendBtn" onclick="'+hreg(()=>poResend(id,gid))+'">'+esc(p.status==='draft'&&!lo?t('po_send_now'):t('po_resend'))+'</button>');
  btns.push('<button type="button" class="btn gh" data-t="'+esc(p.text||'')+'" onclick="copyText(this.dataset.t)">📋 '+esc(t('copy'))+'</button>');
  if(p.status==='sent'||p.status==='draft')btns.push('<button type="button" class="btn gh" id="poVoidBtn" onclick="'+hreg(()=>poVoid(id))+'">'+esc(t('po_void_btn'))+'</button>');
  openModal('<h3>🛒 '+esc(t('po_detail_t'))+' '+esc(p.po_no||'')+' '+stPill(p.status,poStLb(p.status))+'</h3>'+
    '<div class="rowline"><div class="grow"><b>'+esc(p.sup_name||'')+'</b><div class="xs mut">'+esc(dispDate(p.d))+' · '+esc(t('po_by'))+' '+esc(p.by_name||'')+' '+esc(dispTime(p.created_at))+(p.line_sent_at?' · 💬 '+esc(dispTime(p.line_sent_at)):'')+'</div></div></div>'+
    '<div class="twrap"><table class="t"><thead><tr><th>'+esc(t('item'))+'</th><th class="n">'+esc(t('qty'))+'</th><th class="n">'+esc(t('po_est_col'))+'</th></tr></thead><tbody>'+rows+
    '<tr class="tot"><td>'+esc(t('total'))+'</td><td class="n">'+esc(t('po_lines_n',{n:ln.length}))+'</td><td class="n">'+(anyEst?esc(money(est)):'–')+'</td></tr></tbody></table></div>'+
    (p.text?'<details class="po-txt"><summary>'+esc(t('po_text_t'))+'</summary><pre>'+esc(p.text)+'</pre></details>':'')+
    '<div class="po-btns">'+btns.join('')+'</div>');
}
async function poResend(id,gid){await once(async()=>{const p=PO_LIST.find(x=>x.id===id);if(!p||!gid)return;
  if(p.status==='draft'&&poLineOkAt(p.id)&&!(await confirm2(t('po_resend_q'),{danger:true})))return;   // ไลน์ถึงร้านแล้ว (จดไม่ได้) — ถามก่อน กันร้านได้ใบซ้ำ
  try{await lineSend(gid,p.text||'');}catch(e){toast(t('line_fail')+': '+((e&&e.message)||e),true);return;}
  try{await db(()=>sb.from('kc_pos').update({status:'sent',line_sent_at:new Date().toISOString()}).eq('id',id));}catch(e){}
  toast(t('line_ok'));closeModal();await poListLoad();if(S.tab==='buy'){PO_SUG=poCalc();poPaint();poPaintList();}});}
async function poVoid(id){await once(async()=>{const p=PO_LIST.find(x=>x.id===id);if(!p)return;
  if(!(await confirm2(t('po_void_q',{n:p.po_no||'',s:p.sup_name||''}),{danger:true})))return;
  try{if(p.status==='draft'){await db(()=>sb.from('kc_po_lines').delete().eq('po_id',id));await db(()=>sb.from('kc_pos').delete().eq('id',id));}
    else await db(()=>sb.from('kc_pos').update({status:'void'}).eq('id',id));}catch(e){return;}
  toast(t('po_voided'));closeModal();await poListLoad();if(S.tab==='buy'){PO_SUG=poCalc();poPaint();poPaintList();}});}

function mnTargetCalc(r,stock,daily){ // สูตร Safety/Max ที่เดียว — 🍳 mkNeeds · ☀️ tdPaintRefill · 🎯 หน้านี้ ต้องตรงกัน (เจ้าของสั่ง 2026-10-17)
  // Safety = ขั้นต่ำที่ต้องมี (target_qty · หรือ target_days × ยอดส่งเฉลี่ย/วัน) · Max = ทำเติมให้ถึง (max_qty · ว่าง/0 = Safety · ต่ำกว่า Safety = ใช้ Safety)
  // สต๊อก < Safety → ต้องเติม = Max − สต๊อก · ไม่ต่ำกว่า = 0 (ส่วน open/short ของออเดอร์สาขาคิดแยกใน mkNeeds ตามเดิม)
  const safety=num(r.target_qty)>0?num(r.target_qty):(num(r.target_days)>0?rnd4(num(r.target_days)*num(daily)):0);
  const max=num(r.max_qty)>0?num(r.max_qty):0,upto=max>0?Math.max(max,safety):safety;
  const below=safety>0&&num(stock)<safety-1e-9?Math.max(0,rnd4(upto-num(stock))):0;
  return {safety,max,upto,below};}
function mnCats(){const c=MENU_CATS.slice();S.recipes.forEach(r=>{const x=String(r.cat||'').trim();if(x&&!c.includes(x))c.push(x);});return c;}
function mnOffN(){return S.recipes.filter(r=>r.active===false).length;}
function mnRealCost(r){ // ต้นทุนจริง/หน่วย: ถัวเฉลี่ยล็อต → ล็อตล่าสุด → null
  if(!r)return null;if(r.avg_cost!=null&&num(r.avg_cost)>0)return num(r.avg_cost);if(r.unit_cost!=null&&num(r.unit_cost)>0)return num(r.unit_cost);return null;}

      '<label class="days"><span class="xs">'+esc(t('mn_tg_days'))+'</span><div class="mntg-in">'+inp('target_days')+'<span class="xs mut">'+esc(t('mn_tg_days_s'))+'</span></div></label>'+

function mnTgParse(s){ // ค่าในช่อง → null (ว่าง) · ตัวเลข ≥ 0 (ปัด 4 ตำแหน่ง · "1,5" = 1.5 แบบ numIn) · NaN = ใช้ไม่ได้ (ติดลบ/ตัวอักษร)
  s=String(s==null?'':s).trim();if(s==='')return null;
  if(!/^[0-9][0-9,]*(\.[0-9]+)?$/.test(s)&&!/^[0-9]+,[0-9]{1,2}$/.test(s))return NaN;
  const n=numIn(s);return (isFinite(n)&&n>=0)?rnd4(n):NaN;}
function mnTgInput(el){
  const id=el.dataset.id,f=el.dataset.f,r=recipeById(id);if(!r||!canKitchen()||!['target_qty','max_qty','target_days'].includes(f))return;
  const n=mnTgParse(el.value),bad=MN_TG.bad[id]=MN_TG.bad[id]||{},raw=MN_TG.raw[id]=MN_TG.raw[id]||{};
  /* ใช้ไม่ได้ = ลบค่าก่อนหน้าของช่องนั้นที่รอเขียนด้วย — พิมพ์ต่อจนใช้ไม่ได้ (25 → 25a) ต้องไม่เขียน 25 ทั้งที่ช่องแดง (ผู้ตรวจรอบ 2) */
  if(Number.isNaN(n)){el.classList.add('bad');bad[f]=1;raw[f]=el.value;if(MN_TG.pend[id])delete MN_TG.pend[id][f];}else{el.classList.remove('bad');delete bad[f];delete raw[f];(MN_TG.pend[id]=MN_TG.pend[id]||{})[f]=n;}
  const bb=document.getElementById('mnTgB_'+id);if(bb)bb.style.display=Object.keys(bad).length?'':'none';
  mnTgNeedPaint(id);
  clearTimeout(MN_TG.tm[id]);MN_TG.tm[id]=setTimeout(()=>mnTgFlush(id),600);}
async function mnTgFlush(id){ // เขียนแถวนี้ทีละครั้งต่อกัน — มีการเขียนค้างอยู่ = รอให้เสร็จแล้วเขียนรอบถัดไป (ค่าใหม่ไม่ถูกค่าเก่าที่มาช้าทับ)
  clearTimeout(MN_TG.tm[id]);
  if(MN_TG.busy[id]){MN_TG.again[id]=1;return;}
  const p=MN_TG.pend[id];if(!p||!Object.keys(p).length)return;delete MN_TG.pend[id];
  MN_TG.busy[id]=1;MN_TG.fly[id]=p;try{await mnTgSave(id,p);}finally{delete MN_TG.busy[id];delete MN_TG.fly[id];}
  if(MN_TG.again[id]){delete MN_TG.again[id];mnTgFlush(id);}}
async function mnTgSave(id,patch){ // เขียน ck_recipes เฉพาะช่องที่แก้ · ไม่มีคอลัมน์ max_qty (ยังไม่รัน SQL รุ่นล่าสุด) = เขียนใหม่โดยไม่มี + จำ S.kcMax=false + แถบบอก · เขียนพลาด = คืนค่าไว้รอเขียนรอบหน้า + ขอบแดง + toast
  const r=recipeById(id);if(!r||!canKitchen())return false;
  const row={};['target_qty','max_qty','target_days'].forEach(f=>{if(f in patch)row[f]=patch[f]==null?null:rnd4(num(patch[f]));});
  if(S.kcMax===false&&('max_qty' in row)){delete row.max_qty;const mi=document.getElementById('mnTgM_'+id);if(mi){mi.value='';mi.classList.remove('bad');}toast(t('mn_tg_sql'),'warn');}   // ค่าที่พิมพ์ก่อน probe ตอบว่าไม่มีคอลัมน์ = บอกให้รู้ ไม่ทิ้งเงียบ (ผู้ตรวจ V2)
  const seq=MN_TG.seq[id]=(MN_TG.seq[id]||0)+1;
  if(!Object.keys(row).length){mnTgMaxLock();return false;}
  let res=null,dropped=false;setBusy(true);
  try{for(let i=0;i<3;i++){res=await sb.from('ck_recipes').update(row).eq('id',id);if(!res||!res.error)break;
      if(('max_qty' in row)&&mnTgColGone(res.error,'max_qty')){delete row.max_qty;S.kcMax=false;dropped=true;if(!Object.keys(row).length){res={error:null};break;}continue;}
      break;}}
  catch(e){res={error:e};}finally{setBusy(false);}
  const el=document.getElementById('mnTgR_'+id);
  if(res&&res.error){MN_TG.pend[id]=Object.assign({},patch,MN_TG.pend[id]||{});MN_TG.err[id]=1;toast(t('sv_err')+(res.error.message||res.error),true);if(el)el.classList.add('err');return false;}   // ค่าที่เขียนไม่สำเร็จยังอยู่บนจอ (วาดจาก pend) + แถวแดง — รอบหน้าเขียนตามที่เห็น

async function mnWrite(build,row){ // ยังไม่รัน SQL บางคอลัมน์ = ตัดช่องนั้น (ออกจาก row ของผู้เรียกด้วย — แคชจะได้ตรงกับฐานข้อมูล) แล้วบันทึกช่องอื่น (PGRST204)
  setBusy(true);
  try{for(let i=0;i<8;i++){const r=await build(row);if(!r||!r.error)return r&&r.data;
      const m=/'([a-z_]+)' column/i.exec(String(r.error.message||''));
      if(r.error.code==='PGRST204'&&m&&(m[1] in row)){delete row[m[1]];if(m[1]==='max_qty')S.kcMax=false;else S.kcSql=false;continue;}   // max_qty = SQL รุ่นล่าสุดยังไม่รัน (คอลัมน์อื่นครบ) — แถบเฉพาะของ 🎯 ไม่ใช่ sql_need ทั้งแอป
      const d=document.getElementById('syncDot');if(d)d.className='err';toast(t('sv_err')+(r.error.message||r.error),true);throw r.error;}}
  finally{setBusy(false);}
  return null;}
async function mnInsLines(rows){ // insert แถวสูตร · ไม่มีช่อง unit (ยังไม่รัน SQL) = แปลงเป็นหน่วยหลักแล้วเขียนใหม่ → {data,unitLost} · พลาด = throw (toast แล้ว)
  let r=await sb.from('ck_recipe_items').insert(rows).select(),unitLost=false;
  if(r&&r.error&&r.error.code==='PGRST204'&&/'unit'/.test(String(r.error.message||''))){S.kcSql=false;unitLost=true;
    r=await sb.from('ck_recipe_items').insert(rows.map(x=>{const it=itemById(x.item_id);const f=x.unit?unitFactor(it,x.unit):1;const y=Object.assign({},x,{qty:rnd4(x.qty*(f||1))});delete y.unit;return y;})).select();}
  if(r&&r.error){toast(t('sv_err')+(r.error.message||r.error),true);throw r.error;}
  return {data:(r&&r.data&&r.data.length)?r.data:rows,unitLost};}
async function mnWriteLines(rid,lines){ // ลบของเดิมก่อน แล้วเขียนแถวใหม่ — ลบพลาด = ไม่มีอะไรเปลี่ยน · เขียนใหม่พลาด = ใส่ของเดิมคืน (ตรวจอิสระ 2026-10-16: เดิมเขียนก่อนลบ ลบพลาดแล้วสูตรซ้อนสองชุด → ล็อตถัดไปคิดส่วนผสม 2 เท่า)
  const old=(S.boms[rid]||[]).slice(),oldIds=old.map(x=>x.id).filter(x=>x!=null);
  const rows=lines.map((l,i)=>{const it=itemById(l.item_id);return {recipe_id:rid,item_id:l.item_id,qty:rnd4(num(l.qty)),unit:(l.unit&&l.unit!==it.unit)?l.unit:null,sort:i+1};});
  let out=[],unitLost=false;setBusy(true);
  try{
    if(oldIds.length){const r=await sb.from('ck_recipe_items').delete().in('id',oldIds);if(r&&r.error){toast(t('mn_lines_fail')+' · '+(r.error.message||r.error),true);throw r.error;}}
    if(rows.length){try{const w=await mnInsLines(rows);out=w.data;unitLost=w.unitLost;}
      catch(e){   // เขียนใหม่ไม่สำเร็จ → ใส่สูตรเดิมคืน (id เดิม) · ใส่คืนไม่ได้ = ฟอร์มยังมีส่วนผสมครบ กด 💾 ใหม่ได้
        let back=false;if(old.length){try{const keep=old.map(x=>{const y={id:x.id,recipe_id:x.recipe_id,item_id:x.item_id,qty:x.qty,sort:x.sort};if(x.unit!=null)y.unit=x.unit;return y;});await mnInsLines(keep);back=true;}catch(e2){}}
        if(!back){S.recipeItems=S.recipeItems.filter(x=>x.recipe_id!==rid);S.boms[rid]=[];}
        toast(back||!old.length?t('mn_lines_fail'):t('mn_lines_lost'),true);throw e;}}
  }finally{setBusy(false);}
  try{const r=await sb.from('ck_recipe_items').select('*').eq('recipe_id',rid).order('sort').order('id');if(r&&!r.error&&Array.isArray(r.data))out=r.data;}catch(e){}   // อ่านซ้ำให้แคชตรงฐานข้อมูล (fail-soft)
  S.recipeItems=S.recipeItems.filter(x=>x.recipe_id!==rid).concat(out);S.boms[rid]=out.slice();
  return unitLost;}
function mnValidate(d){ // → ข้อความผิดพลาด หรือ null
  if(!d.name)return t('need_name');
  if(S.recipes.some(r=>r.id!==d.id&&r.deleted_at==null&&supKey(r.name)===supKey(d.name)))return t('mn_dup');
  if(!(num(d.yield_qty)>0))return t('mn_need_yield');
  for(const l of d.lines){const c=mnLineCalc(l);if(!c.it)return t('mn_need_item');if(!(num(l.qty)>0))return t('mn_need_qty',{n:dispName(c.it)});if(c.f==null)return dispName(c.it)+': '+t('mn_line_bad',{u:trUnit(c.it.unit)});}
  return null;}
async function mnSave(){await once(async()=>{
  const d=MN_D;if(!d||!canKitchen())return;
  const nm=document.getElementById('mnName');if(nm)d.name=nm.value;const nt=document.getElementById('mnNote');if(nt)d.note=nt.value;
  d.name=String(d.name||'').trim();
  const err=mnValidate(d);if(err){toast(err,true);return;}
  {const r0=d.id?recipeById(d.id):null,lock=mnLockWhy(d);if(r0&&lock&&(d.yield_unit||'ถุง')!==r0.yield_unit){d.yield_unit=r0.yield_unit;mnYuPaint();mnPaintCost();toast(t('mn_lock',{why:lock}),true);return;}}   // กันทางอ้อม (select ถูกปิดอยู่แล้ว) — ร่างกลับเป็นหน่วยเดิม
  let cat=d.cat==='__new'?String(d.cat_new||'').trim():String(d.cat||'').trim();if(!cat)cat='อื่นๆ';
  const nz=v=>String(v==null?'':v).trim()===''?null:rnd4(num(v));
  const row={name:d.name,cat,yield_qty:rnd4(num(d.yield_qty)),yield_unit:d.yield_unit||'ถุง',extra_cost:rnd4(num(d.extra_cost)),markup_pct:nz(d.markup_pct),target_qty:nz(d.target_qty),target_days:nz(d.target_days),note:String(d.note||'')};
  if(S.kcMax!==false)row.max_qty=nz(d.max_qty);   // 🎯 Max — รู้แล้วว่าไม่มีคอลัมน์ (ยังไม่รัน SQL รุ่นล่าสุด) = ไม่ส่ง (mnWrite จะตัดให้ถ้าเพิ่งเจอ)
  let r=d.id?recipeById(d.id):null,renamed=false;
  try{
    if(r){renamed=r.name!==d.name;if(renamed)row.i18n=null;
      await mnWrite(x=>sb.from('ck_recipes').update(x).eq('id',r.id),row);Object.assign(r,row);if(renamed)r.i18n=null;}
    else{row.id=uid('rc');row.qty=0;row.active=true;row.image_url=d.image_url||null;
      row.sort=S.recipes.reduce((m,x)=>Math.max(m,num(x.sort)),0)+1;
      await mnWrite(x=>sb.from('ck_recipes').insert(x),row);if(!('active' in row))row.active=true;r=row;S.recipes.push(r);renamed=true;}
    var unitLost=await mnWriteLines(r.id,d.lines);
  }catch(e){return;}
  S.recipes.sort((a,b)=>(num(a.sort)-num(b.sort))||String(a.name||'').localeCompare(String(b.name||''),'th'));
  const maxLost=S.kcMax===false&&String(d.max_qty==null?'':d.max_qty).trim()!=='';   // กรอก Max ไว้แต่ฐานข้อมูลไม่มีคอลัมน์ = บอกตรง ๆ (ช่องอื่นบันทึกแล้ว)
  MN_D=null;mnDraftClear();MODAL_BACK=null;closeModal();toast(unitLost?t('mn_unit_lost'):maxLost?t('mn_tg_sql'):t('sv_ok'),unitLost?true:(maxLost?'warn':false));
  if(renamed)mnAutoI18n(r);
  if(S.tab==='menus')show('menus');else if(S.tab==='make')rerender();
});}

let IT_CAT=String(LS.get('jjck_itcat','')||'');   // '' ทั้งหมด · ชื่อหมวด · '__off' ไม่ใช้แล้ว
let IT_Q='';
let IT_D=null;                                     // ร่างฟอร์ม
const IT_DRAFT='jjck_it_draft',IT_DRAFT_MS=12*3600*1000;
const IT_IC={'เนื้อสัตว์':'🥩','ผัก':'🥬','ของแห้ง':'🌾','เครื่องปรุง':'🧂','บรรจุภัณฑ์':'📦','อื่นๆ':'🧺'};
const itIcon=it=>IT_IC[(it&&it.cat)||'']||'🥬';
const itLow=it=>it.min_qty!=null&&num(it.qty)<num(it.min_qty);
const itMoney=c=>'฿'+fmtQ(c);
function itCats(){const c=ITEM_CATS.slice();S.items.forEach(i=>{const x=String(i.cat||'').trim();if(x&&!c.includes(x))c.push(x);});return c;}
function itOffN(){return S.items.filter(i=>i.active===false).length;}
function itUsedIn(id){return activeRecipes().filter(r=>(S.boms[r.id]||[]).some(l=>l.item_id===id));}

/* ---------- รายการ ---------- */
RENDER.items=function(el){
  const K=canKitchen(),act=activeItems(),nOff=itOffN();
  if(IT_CAT==='__off'&&!nOff)IT_CAT='';
  const cats=itCats().filter(c=>act.some(i=>(i.cat||'อื่นๆ')===c));
  if(IT_CAT&&IT_CAT!=='__off'&&!cats.includes(IT_CAT))IT_CAT='';
  const pills=[{k:'',lb:t('all'),n:act.length}].concat(cats.map(c=>({k:c,lb:(IT_IC[c]||'🧺')+' '+trCat(c),n:act.filter(i=>(i.cat||'อื่นๆ')===c).length})));
  if(nOff)pills.push({k:'__off',lb:'🗄️ '+t('it_off_chip'),n:nOff});
  let h=dhead('🥬 '+t('nav_items'),esc(t('it_n',{n:act.length})))+sqlNeedBox();
  if(K)h+='<div class="row" style="margin-bottom:10px"><button class="btn" onclick="itEdit()">➕ '+esc(t('it_new'))+'</button>'+
    '<button class="btn gh" onclick="show(\'sups\')">🏷️ '+esc(t('nav_sups'))+'</button></div>';
  h+=pillBar(pills,IT_CAT,k=>itSetCat(k),{scroll:1});   // closure — string handler + Thai key would break the onclick quotes (callOf uses JSON.stringify)
  if(IT_CAT==='__off')h+='<div class="hintbox">🗄️ '+esc(t('it_off_view'))+'</div>';
  h+=searchBox('itQ','itSearch')+'<div id="itGrid" class="igrid"></div>';
  el.innerHTML=h;const q=document.getElementById('itQ');if(q)q.value=IT_Q;itPaintGrid();
};
function itSetCat(k){IT_CAT=k||'';LS.set('jjck_itcat',IT_CAT);show('items');}
function itSearch(v){IT_Q=v||'';itPaintGrid();}
function itPaintGrid(){
  const box=document.getElementById('itGrid');if(!box)return;
  const off=IT_CAT==='__off',q=supKey(IT_Q),K=canKitchen();
  const list=S.items.filter(i=>(off?i.active===false:(i.active!==false&&(!IT_CAT||(i.cat||'อื่นๆ')===IT_CAT)))&&
    (!q||supKey(i.name).includes(q)||supKey(dispName(i)).includes(q)||supKey(i.sup).includes(q)));
  if(!list.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">'+esc(t(off?'it_off_none':(q?'it_no_match':'it_none')))+'</div>';return;}
  box.innerHTML=list.map(it=>itCardHtml(it,off,K)).join('');
}
function itCardHtml(it,off,K){
  const low=!off&&itLow(it),c=itemCost(it);
  return '<div class="icard'+(low?' low':'')+(off?' itoff':'')+(K?' tap':'')+'" data-id="'+esc(it.id)+'"'+(K?' onclick="itEdit(this.dataset.id)"':'')+'>'+
    thumbHtml(it,itIcon(it),'ithumb')+
    '<div class="iname">'+esc(dispName(it))+'</div>'+
    '<div class="isub">'+(c!=null?'💰 '+esc(itMoney(c))+'/'+esc(trUnit(it.unit)):'<span class="amber">'+esc(t('no_price'))+'</span>')+
      (it.last_price!=null&&num(it.last_price)>0?' · '+esc(t('it_last'))+' '+esc(itMoney(it.last_price)):'')+'</div>'+
    '<div class="row" style="justify-content:space-between"><span class="chip '+(low?'bad':'ok')+'">'+(low?'⚠ ':'')+fmtQ(it.qty)+' '+esc(trUnit(it.unit))+'</span>'+
      (it.min_qty!=null?'<span class="xs mut">'+esc(t('it_min_s'))+' '+fmtQ(it.min_qty)+'</span>':'')+'</div>'+
    (it.sup?'<div class="xs mut">🏷️ '+esc(it.sup)+'</div>':'')+
    (off&&K?'<button class="btn sm2 gh" data-id="'+esc(it.id)+'" onclick="event.stopPropagation();itOff(this.dataset.id,true)">'+esc(t('it_restore'))+'</button>':'')+'</div>';}

/* ---------- ฟอร์ม ---------- */
function itDraftFrom(it){
  if(it)return {id:it.id,name:it.name||'',cat:it.cat||'อื่นๆ',unit:it.unit||'กก.',buy_unit:it.buy_unit||'',buy_qty:it.buy_qty==null?'':it.buy_qty,
    packs:(Array.isArray(it.packs)?it.packs:[]).filter(p=>p&&p.u).map(p=>({u:String(p.u),q:p.q==null?'':p.q})),count_unit:it.count_unit||'',sup:it.sup||'',
    min_qty:it.min_qty==null?'':it.min_qty,lead_days:it.lead_days==null?'':it.lead_days,image_url:it.image_url||null,active:it.active!==false,cat_new:'',sup_new:'',restored:false};
  return {id:null,name:'',cat:(IT_CAT&&IT_CAT!=='__off')?IT_CAT:'อื่นๆ',unit:'กก.',buy_unit:'',buy_qty:'',packs:[],count_unit:'',sup:'',min_qty:'',lead_days:'',image_url:null,active:true,cat_new:'',sup_new:'',restored:false};}
function itDraftRead(id){const d=LS.get(IT_DRAFT,null);if(!d||typeof d!=='object'||!(Date.now()-num(d._t)<IT_DRAFT_MS))return null;
  return String(d.id||'')===String(id||'')?d:null;}
function itDraftSave(){if(!IT_D)return;clearTimeout(itDraftSave._t);itDraftSave._t=setTimeout(()=>{if(IT_D)LS.set(IT_DRAFT,Object.assign({},IT_D,{_t:Date.now()}));},150);}
function itDraftClear(){clearTimeout(itDraftSave._t);LS.del(IT_DRAFT);}
function itEdit(id,opt){ // opt:{sup} = เปิดจากหน้าร้านค้า (ตั้งร้านให้ + ปิดแล้วกลับหน้าร้าน)
  if(!canKitchen())return;opt=opt||{};
  const it=id?itemById(id):null;if(id&&!it)return;
  const dr=itDraftRead(id);
  IT_D=dr?Object.assign(itDraftFrom(it),dr,{restored:true}):itDraftFrom(it);
  delete IT_D._hist;   // ร่างเก่าอาจจำสถานะประวัติไว้ — ถามสมุดสต๊อกใหม่ทุกครั้งที่เปิดฟอร์ม
  if(it&&IT_D.unit!==it.unit&&itLockWhy(IT_D))IT_D.unit=it.unit;
  if(opt.sup&&!IT_D.sup)IT_D.sup=opt.sup;
  IT_D._back=opt.back||null;
  itPaintForm();itHistCheck(IT_D);
}
function itLockWhy(d){ // เปลี่ยนหน่วยหลักไม่ได้เมื่อ: มีสต๊อก · อยู่ในสูตร · มีประวัติ — ยอด/ต้นทุน/สูตรเก็บเป็นหน่วยหลัก เปลี่ยนแล้วความหมายเพี้ยน (ตรวจอิสระ 2026-10-16)
  if(!d||!d.id)return '';const it=itemById(d.id);if(!it)return '';
  if(Math.abs(num(it.qty))>1e-9)return t('it_lock_stock',{q:fmtQ(it.qty),u:trUnit(it.unit)});
  if((S.recipeItems||[]).some(x=>x.item_id===d.id))return t('it_lock_recipe');
  if(d._hist)return t('it_lock_hist');return '';}
async function itHistCheck(d){ // มีการเคลื่อนไหวในสมุดสต๊อกไหม (อ่านทีหลัง · fail-soft)
  if(!d||!d.id||d._hist!=null)return;let has=false;
  try{const r=await sb.from('kc_moves').select('id').eq('ref_kind','item').eq('ref_id',d.id).limit(1);has=!!(r&&!r.error&&r.data&&r.data.length);}catch(e){}
  if(IT_D!==d)return;d._hist=has;const it=itemById(d.id);if(has&&it&&d.unit!==it.unit){d.unit=it.unit;itUnitsPaint();}
  const box=document.getElementById('itUnitFld');if(box)box.innerHTML=itUnitHtml();}
function itUnitHtml(){const d=IT_D,lock=itLockWhy(d);
  return '<select id="itUnit" onchange="itUnitChange(this.value)"'+(lock?' disabled':'')+'>'+unitOptions(allUnits(),d.unit)+'</select>'+(lock?'<div class="xs amber" style="margin-top:4px">'+esc(t('it_lock',{why:lock}))+'</div>':'');}
function itTmp(){const d=IT_D;return {unit:d.unit,buy_unit:d.buy_unit,buy_qty:num(d.buy_qty),packs:(d.packs||[]).map(p=>({u:p.u,q:num(p.q)})).filter(p=>p.u&&p.q>0)};}
function itRecipeUnits(id){ // หน่วย (ที่ไม่ใช่หน่วยหลัก) ที่สูตรเมนูใช้กับวัตถุดิบนี้ → [{u,names[]}]
  const it=itemById(id);if(!it)return [];const by={};
  (S.recipeItems||[]).forEach(x=>{if(x.item_id!==id||!x.unit||x.unit===it.unit)return;const r=recipeById(x.recipe_id);if(!r||r.deleted_at)return;
    (by[x.unit]=by[x.unit]||[]).push(dispName(r));});
  return Object.keys(by).map(u=>({u,names:[...new Set(by[u])]}));}
function itPackUsed(id,tmp){ // ขนาดบรรจุ/หน่วยซื้อที่กำลังจะบันทึก ทำให้หน่วยในสูตรแปลงไม่ได้ → {u,list} (ตรวจอิสระ 2026-10-16: ลบ ขวด แล้ว 🍳 คิดส่วนผสมเป็น 0 เงียบ ๆ)
  if(!id)return null;const bad=itRecipeUnits(id).filter(x=>unitFactor(tmp,x.u)==null);
  return bad.length?{u:bad[0].u,list:bad.map(x=>x.names.join(', ')).join(' · ')}:null;}
function itStdBad(u,q,base){ // หน่วยที่ตัวแปลงมาตรฐานรู้จักอยู่แล้ว (กรัม/ขีด/กก./มล./ลิตร/โหล/ชิ้น) ตั้งขนาดต่างจากมาตรฐาน = ตัวเลขขัดกัน → ข้อความผิดพลาด หรือ ''
  const f=unitConv(null,u,base);if(f==null||Math.abs(f-num(q))<1e-9*Math.max(1,f))return '';
  return t('it_pack_std',{u:trUnit(u),q:fmtQ(f),b:trUnit(base)});}
function itPaintForm(){
  const d=IT_D;if(!d)return;

    '<div class="grid2">'+fld(t('it_cat'),'<select id="itCat" onchange="itCatChange(this.value)">'+cats.map(c=>'<option value="'+esc(c)+'"'+(c===d.cat?' selected':'')+'>'+(IT_IC[c]||'🧺')+' '+esc(trCat(c))+'</option>').join('')+
        (cats.includes(d.cat)?'':'<option value="'+esc(d.cat)+'" selected>'+esc(d.cat)+'</option>')+'<option value="__new">'+esc(t('it_cat_new'))+'</option></select>'+
        '<input id="itCatNew" placeholder="'+esc(t('it_cat_new_ph'))+'" value="'+esc(d.cat_new)+'" style="margin-top:6px;display:'+(d.cat==='__new'?'':'none')+'" oninput="IT_D.cat_new=this.value;itDraftSave()">')+
      fld(t('it_sup'),'<select id="itSup" onchange="itSupChange(this.value)"><option value="">'+esc(t('it_sup_none'))+'</option>'+sups.map(s=>'<option value="'+esc(s)+'"'+(s===d.sup?' selected':'')+'>'+esc(s)+'</option>').join('')+
        '<option value="__new"'+(d.sup==='__new'?' selected':'')+'>'+esc(t('it_sup_new'))+'</option></select>'+
        '<input id="itSupNew" placeholder="'+esc(t('it_sup_new_ph'))+'" value="'+esc(d.sup_new)+'" style="margin-top:6px;display:'+(d.sup==='__new'?'':'none')+'" oninput="IT_D.sup_new=this.value;itDraftSave()">')+'</div>'+
    '<div class="grid2">'+fld(t('it_unit'),'<div id="itUnitFld">'+itUnitHtml()+'</div>')+
      fld(t('it_min'),'<div class="row" style="flex-wrap:nowrap"><input id="itMin" type="text" inputmode="decimal" value="'+esc(d.min_qty)+'" oninput="IT_D.min_qty=this.value;itDraftSave()"><span class="b" id="itMinU" style="flex:none">'+esc(trUnit(d.unit))+'</span></div>')+'</div>'+
    '<div id="itPacks">'+itPacksHtml()+'</div>'+
    '<div id="itCU">'+itCuHtml()+'</div>'+
    fld(t('it_lead'),'<input id="itLead" type="text" inputmode="numeric" value="'+esc(d.lead_days)+'" oninput="IT_D.lead_days=this.value;itDraftSave()">')+
    itCostHtml(it)+
    '<div class="itacts">'+(d.id?'<button class="btn gh" onclick="itOff(\''+esc(d.id)+'\','+(d.active?'false':'true')+')">'+esc(d.active?t('it_off_btn'):t('it_restore'))+'</button>'+
      (isAdminish()?'<button class="btn gh" onclick="itDel(\''+esc(d.id)+'\')">'+esc(t('it_del'))+'</button>':''):'')+
      '<button class="btn big" onclick="itSave()">💾 '+esc(t('save'))+'</button></div></div>';
  MODAL_BACK=null;openModal(h);
}
function itThumbHtml(){const d=IT_D,url=imgOk(d.image_url)?String(d.image_url):'';return '<div class="mthumb lg" '+(url?'data-url="'+esc(url)+'" onclick="zoomImg(this.dataset.url)"':'')+'>'+(url?'<img src="'+esc(url)+'">':itIcon({cat:d.cat==='__new'?'':d.cat}))+'</div>';}
function itPhoto(){const d=IT_D;if(!d)return;pickImage('item',d.id,url=>{if(!IT_D||!url)return;IT_D.image_url=url;itDraftSave();const b=document.getElementById('itThumb');if(b)b.innerHTML=itThumbHtml();if(S.tab==='items')itPaintGrid();});}
function itCatChange(v){const d=IT_D;if(!d)return;d.cat=v;const n=document.getElementById('itCatNew');if(n){n.style.display=v==='__new'?'':'none';if(v==='__new')n.focus();}itDraftSave();}
function itSupChange(v){const d=IT_D;if(!d)return;d.sup=v;const n=document.getElementById('itSupNew');if(n){n.style.display=v==='__new'?'':'none';if(v==='__new')n.focus();}itDraftSave();}
function itUnitChange(v){const d=IT_D;if(!d)return;
  const lock=itLockWhy(d);if(lock){toast(t('it_lock',{why:lock}),true);const sel=document.getElementById('itUnit');if(sel)sel.value=d.unit;return;}
  const f=unitConv(null,d.unit,v);   // ขนาดบรรจุเขียนเป็นหน่วยหลัก — เปลี่ยนหน่วยหลักแล้วแปลงตามถ้าแปลงได้ (กรัม↔กก.)
  if(f!=null){(d.packs||[]).forEach(p=>{if(num(p.q)>0)p.q=rnd4(num(p.q)*f);});if(num(d.buy_qty)>0)d.buy_qty=rnd4(num(d.buy_qty)*f);}
  d.unit=v;itDraftSave();itUnitsPaint();}

function itPacksClean(d){ // null = มีแถวผิด

  for(const p of (d.packs||[])){const u=String(p.u||'').trim(),q=num(p.q);
    if(!u&&String(p.q==null?'':p.q).trim()==='')continue;   // แถวว่าง ข้าม

let SP_Q='';
let SP=null;        // {id} หน้าร้านที่เปิดอยู่
let SP_STK=null;    // ซัพของแอพนับสต๊อก (suppliers · อ่านอย่างเดียว) — null = ยังไม่โหลด
let SP_PICK=null;   // {sel:{}, q:''} ตอนเลือกวัตถุดิบเข้าร้าน
const SP_SYNC_MS=6*3600*1000;   // คีย์ jjsc_lgsync ใช้ร่วมกับแอพนับสต๊อก (โดเมนเดียวกัน) — ไม่ดึงซ้ำ
function spItemsOf(name){const k=supKey(name);return k?activeItems().filter(i=>supKey(i.sup)===k):[];}
function spActive(){return S.sups.filter(s=>s.active!==false);}
async function spStkLoad(force){ // suppliers ของแอพนับสต๊อก — เอากลุ่มไลน์ที่ผูกไว้มาแนะนำ (อ่านอย่างเดียว ห้ามเขียน)
  if(SP_STK&&!force)return SP_STK;let r=null;try{r=await sb.from('suppliers').select('name,line_group_id');}catch(e){r=null;}
  SP_STK=(r&&!r.error&&Array.isArray(r.data))?r.data:[];return SP_STK;}
function spStkGroup(name){const k=supKey(name);if(!k)return null;const x=(SP_STK||[]).find(s=>supKey(s.name)===k&&s.line_group_id);return x?String(x.line_group_id):null;}
function spFromStk(){return spActive().filter(s=>!s.line_group_id&&spStkGroup(s.name));}
function spOrphans(){const have=new Set(S.sups.map(s=>supKey(s.name)));const out=[];
  activeItems().forEach(i=>{const n=String(i.sup||'').trim();if(n&&!have.has(supKey(n))&&!out.some(x=>supKey(x)===supKey(n)))out.push(n);});
  return out.sort((a,b)=>a.localeCompare(b,'th'));}
function spDays(s){return Array.isArray(s&&s.order_days)?s.order_days.map(Number).filter(d=>d>=0&&d<=6):[];}
function spDaysTxt(s){const d=spDays(s);return (!d.length||d.length>=7)?t('sp_days_any'):d.map(i=>t('wd')[i]).join(' ');}
function spMetaTxt(s){const c=Math.max(0,parseInt(s.credit_days,10)||0),l=s.lead_days==null?1:Math.max(0,parseInt(s.lead_days,10)||0);
  return '🥬 '+t('sp_items_n',{n:spItemsOf(s.name).length})+' · 💳 '+(c>0?t('sp_pay_credit',{n:c}):t('sp_pay_now'))+' · 📅 '+spDaysTxt(s)+' · 🚚 '+t('sp_lead_s',{n:l});}

/* ---------- รายการร้าน ---------- */
RENDER.sups=function(el){
  const K=canKitchen(),sups=spActive(),withG=sups.filter(s=>s.line_group_id).length,nOff=S.sups.length-sups.length;
  let h=dhead('🏷️ '+t('nav_sups'),esc(sups.length))+sqlNeedBox()+'<div class="note">'+esc(t('sp_hint'))+'</div>';
  h+=card('🤖 '+esc(t('sp_bot')),'<div class="sm" id="spBotTxt">'+esc(t('sp_bot_txt',{n:(S.lineGroups||[]).length,a:withG,b:sups.length}))+'</div>'+
    (K?'<div class="row" style="margin-top:8px" id="spBotBtns">'+spBotBtnsHtml()+'</div>':'')+
    '<details class="sphow"><summary>❓ '+esc(t('sp_how_q'))+'</summary><ol>'+[1,2,3,4].map(i=>'<li>'+esc(t('sp_how'+i))+'</li>').join('')+'</ol></details>');
  if(K)h+='<button class="btn big" style="margin-bottom:12px" onclick="spEdit()">＋ '+esc(t('sp_new'))+'</button>';
  h+=searchBox('spQ','spSearch')+'<div id="spList"></div>';
  const orph=spOrphans();
  if(orph.length)h+='<div class="spsec">🏷️ '+esc(t('sp_orphans'))+'</div>'+orph.map(n=>'<div class="card"><div class="row"><div class="mthumb">🏷️</div><div class="grow"><div class="b">'+esc(n)+'</div><div class="xs mut">🥬 '+esc(t('sp_items_n',{n:spItemsOf(n).length}))+'</div></div>'+
    (K?'<button class="btn ok sm2" data-n="'+esc(n)+'" onclick="spAddName(this.dataset.n)">＋ '+esc(t('sp_add_this'))+'</button>':'')+'</div></div>').join('');
  if(nOff)h+='<details class="sphow" id="spOffBox"><summary>🗄️ '+esc(t('sp_off_chip'))+' <span class="bdg chip mid">'+nOff+'</span></summary>'+
    S.sups.filter(s=>s.active===false).map(s=>'<div class="rowline"><div class="grow b">'+esc(s.name)+'</div>'+(K?'<button class="btn gh sm2" data-id="'+esc(s.id)+'" onclick="spActiveSet(this.dataset.id,true)">'+esc(t('sp_restore'))+'</button>':'')+'</div>').join('')+'</details>';
  el.innerHTML=h;const q=document.getElementById('spQ');if(q)q.value=SP_Q;spPaintList();
  if(SP_STK==null)spStkLoad().then(()=>{const b=document.getElementById('spBotBtns');if(b&&S.tab==='sups')b.innerHTML=spBotBtnsHtml();});
  spAutoSync();
};
function spBotBtnsHtml(){const n=spFromStk().length;return '<button class="btn gh sm2" onclick="spSync()">🔄 '+esc(t('sp_lg_sync'))+'</button>'+
  (n?'<button class="btn ok sm2" onclick="spUseStock()">📥 '+esc(t('sp_use_stock',{n}))+'</button>':'');}
function spSearch(v){SP_Q=v||'';spPaintList();}
function spPaintList(){
  const box=document.getElementById('spList');if(!box)return;
  const q=supKey(SP_Q),K=canKitchen();
  const list=spActive().filter(s=>!q||supKey(s.name).includes(q)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'th'));
  if(!list.length){box.innerHTML='<div class="card"><div class="empty">'+esc(t(q?'sp_no_match':'sp_none'))+'</div></div>';return;}
  box.innerHTML=list.map(s=>{const g=s.line_group_id?String(s.line_group_id):'';
    return '<div class="card tap spcard" data-id="'+esc(s.id)+'" onclick="spOpen(this.dataset.id)"><div class="row" style="flex-wrap:nowrap"><div class="mthumb">🏷️</div>'+
      '<div class="grow"><div class="b">'+esc(s.name)+'</div><div class="sm '+(g?'green':'amber')+'">'+(g?'💬 '+esc(lgName(g)):'⚠ '+esc(t('sp_no_line')))+'</div>'+
      '<div class="xs mut">'+esc(spMetaTxt(s))+'</div></div><span class="mut" style="font-size:22px">›</span></div></div>';}).join('');
}
async function spSync(auto){ // ดึงกลุ่มที่บอทอยู่ (Edge Function ของแอพนับสต๊อก) แล้วอ่าน line_groups ใหม่
  if(spSync._on)return;spSync._on=true;
  if(!auto)toast('⏳ '+t('sp_lg_syncing'));
  const before=JSON.stringify((S.lineGroups||[]).map(g=>[g.group_id,g.name]));
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),12000);   // ฟังก์ชันไม่ตอบ = ไม่ค้าง
  try{await fetch(SB_URL+'/functions/v1/sync-line-groups',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_ANON,Authorization:'Bearer '+SB_ANON},body:'{}',signal:ctl.signal});}catch(e){}
  clearTimeout(tm);
  try{await lineGroupsLoad(true);}catch(e){}
  try{localStorage.setItem('jjsc_lgsync',String(Date.now()));}catch(e){}
  spSync._on=false;const n=(S.lineGroups||[]).length;
  if(!auto)toast(n?t('sp_lg_found',{n}):t('sp_lg_none'),!n);
  const after=JSON.stringify((S.lineGroups||[]).map(g=>[g.group_id,g.name]));
  if(!auto||after!==before)spRepaint();}
function spAutoSync(){let last=0;try{last=+(localStorage.getItem('jjsc_lgsync')||0)||0;}catch(e){}if(Date.now()-last>=SP_SYNC_MS)spSync(true);}
function spRepaint(){if(S.tab==='sups'&&!modalOpen())show('sups');else if(SP&&modalOpen()&&document.querySelector('#modalBox [data-sp]'))spPaint();}
async function spUseStock(){ // ร้านชื่อเดียวกับในแอพนับสต๊อก → ใช้กลุ่มไลน์เดียวกัน (เขียนเฉพาะ ck_sups)
  if(!canKitchen())return;await spStkLoad();const list=spFromStk();if(!list.length)return;
  if(!await confirm2(t('sp_use_stock_q',{n:list.length})))return;
  await once(async()=>{let n=0;for(const s of list){const g=spStkGroup(s.name);await spWrite(x=>sb.from('ck_sups').update(x).eq('id',s.id),{line_group_id:g});s.line_group_id=g;n++;}
    toast(t('sp_use_stock_ok',{n}));if(S.tab==='sups')show('sups');});}
async function spWrite(build,row){return (typeof itWrite==='function')?itWrite(build,row):db(()=>build(row));}

/* ---------- หน้าร้าน ---------- */
async function spOpen(id){const s=supById(id);if(!s)return;SP={id};if(SP_STK==null){spPaint();await spStkLoad();if(SP&&SP.id===id&&modalOpen())spPaint();}else spPaint();}
function spPaint(){
  const s=SP&&supById(SP.id);if(!s){SP=null;MODAL_BACK=null;closeModal();return;}
  const K=canKitchen(),gid=s.line_group_id?String(s.line_group_id):'';

  h+='<div class="spsec">💬 '+esc(t('sp_line'))+'</div><div class="spline '+(gid?'ok':'bad')+'">'+(gid?'✓ '+esc(t('sp_line_on',{g:lgName(gid)})):'⚠ '+esc(t('sp_no_line_long')))+'</div>';
  if(K){h+='<select id="spG" onchange="spSetGroup(this.value)"><option value="">'+esc(t('sp_no_line'))+'</option>'+
      gl.map(g=>{const used=spActive().filter(x=>x.id!==s.id&&String(x.line_group_id||'')===String(g.group_id)).map(x=>x.name);
        return '<option value="'+esc(g.group_id)+'"'+(String(g.group_id)===gid?' selected':'')+'>'+esc(lgName(g.group_id))+(used.length?' · '+esc(t('sp_used_by',{s:used.slice(0,2).join(', ')+(used.length>2?' …':'')})):'')+'</option>';}).join('')+
      (gid&&!gl.some(g=>String(g.group_id)===gid)?'<option value="'+esc(gid)+'" selected>'+esc(lgName(gid))+'</option>':'')+'</select>';
    if(!gl.length)h+='<div class="hintbox">'+esc(t('sp_lg_none'))+'</div>';
    if(stk&&stk!==gid)h+='<div class="okbox row">📦 '+esc(t('sp_stk_has',{g:lgName(stk)}))+'<button class="btn ok sm2" style="margin-left:auto" data-g="'+esc(stk)+'" onclick="spSetGroup(this.dataset.g)">'+esc(t('sp_stk_use'))+'</button></div>';
    h+='<div class="row" style="margin-top:8px"><button class="btn gh sm2" onclick="spTest()"'+(gid?'':' disabled')+'>'+esc(t('sp_test'))+'</button><button class="btn gh sm2" onclick="spSync()">🔄 '+esc(t('sp_lg_sync'))+'</button></div>';}

      (K?'<button class="x" data-id="'+esc(i.id)+'" onclick="spItemOff(this.dataset.id)" aria-label="remove">✕</button>':'')+'</div>';}).join('')+'</div>'
    :'<div class="empty" style="padding:12px">'+esc(t('sp_items_none'))+'</div>';
  if(K)h+='<div class="row" style="margin-top:8px"><button class="btn gh sm2" onclick="spPick()">'+esc(t('sp_add_items'))+'</button><button class="btn gh sm2" onclick="spNewItem()">'+esc(t('sp_new_item'))+'</button></div>';
  h+='<div class="spsec">📝 '+esc(t('sp_info'))+'</div><div class="sm">'+(s.phone?'📞 '+esc(s.phone)+'<br>':'')+esc(spMetaTxt(s))+(s.note?'<br>📝 '+esc(s.note):'')+'</div>';

function spClose(){SP=null;MODAL_BACK=null;closeModal();if(S.tab==='sups')show('sups');}
async function spSetGroup(v){ // เลือกแล้วบันทึกทันที
  const s=SP&&supById(SP.id);if(!s||!canKitchen())return;v=String(v||'').trim()||null;
  await once(async()=>{await spWrite(x=>sb.from('ck_sups').update(x).eq('id',s.id),{line_group_id:v});s.line_group_id=v;
    toast(v?t('sp_line_saved',{g:lgName(v)}):t('sp_line_cleared'));spPaint();});}
function spTestText(s){return t('sp_test_txt',{s:s.name})+'\n'+thDate(bizTodayISO())+' '+dispTime(new Date().toISOString());}
async function spTest(){const s=SP&&supById(SP.id);if(!s)return;const g=document.getElementById('spG'),gid=String((g&&g.value)||s.line_group_id||'');
  if(!gid){toast(t('line_no_group'),true);return;}

  const q=supKey(P.q),k=supKey(s.name);
  const list=activeItems().filter(i=>supKey(i.sup)!==k&&(!q||supKey(i.name).includes(q)||supKey(dispName(i)).includes(q)))
